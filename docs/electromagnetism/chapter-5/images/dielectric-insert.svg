<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">介质插入平行板电容器</title><desc id="desc">插入长度 x 增大时电容增大；准静态力指向插入方向，固定电压时计入电源功．</desc>
<rect width="720" height="380" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#172033">
<text x="24" y="30" fill="#172033" font-size="17">介质插入平行板电容器</text>
<rect x="160" y="90" width="470" height="12" fill="#e5edf5" stroke="#475569" stroke-width="2"/>
<rect x="160" y="280" width="470" height="12" fill="#e5edf5" stroke="#475569" stroke-width="2"/>
<rect x="80" y="120" width="300" height="140" fill="#d6e8f5" stroke="#155da0" stroke-width="2"/>
<path d="M230 190 L460 190" fill="none" stroke="#ba2636" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="170" fill="#172033" font-size="17">F，x 增大</text>
<text x="490" y="220" fill="#172033" font-size="17">真空</text>
<text x="24" y="365" fill="#475569" font-size="13">PLW 原创 · 示意图非比例；曲线按正文公式采样</text>
</g></svg>
