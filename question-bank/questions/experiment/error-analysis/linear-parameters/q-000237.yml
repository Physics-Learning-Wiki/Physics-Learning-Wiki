stem: x=−1、0、1，y=1.1、1.9、3.0，求普通直线参数与未知尺度协方差．
reference_answer: a=2、b=0.95；残差 0.05、−0.10、0.05，协方差对角 0.005、0.0075．
solution: $A^Ty=(6,1.9)^T$、$A^TA=\operatorname{diag}(3,2)$，故 $a=2$、$b=0.95$．残差为 $(0.05,-0.10,0.05)$，平方和 0.015 除以自由度 1 得方差尺度
  0.015；乘逆正规矩阵得对角 0.005、0.0075，交叉项为零．
