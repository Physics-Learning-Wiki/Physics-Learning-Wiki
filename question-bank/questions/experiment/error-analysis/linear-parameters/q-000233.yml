stem: 相对权 p=4 的方程单位权化时，整条方程乘多少？
answer:
  value: 2
  tolerance:
    type: absolute
    value: 0.0004
  unit:
    required: false
    canonical: ''
    accepted: []
solution: 权为 $p$ 的残差平方项是 $pv^2=(\sqrt p\,v)^2$，因此将观测和模型同时乘 $\sqrt p=2$，而不是乘以 4．
