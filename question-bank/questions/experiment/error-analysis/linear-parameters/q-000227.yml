stem: 设计矩阵的两列完全相同时，有什么问题？
choices:
- id: A
  content: 不能单独辨识对应两个参数
- id: B
  content: 残差必定全部为零
- id: C
  content: 再重复相同方程一定可分离参数
answer:
  choice: A
solution: 两列线性依赖，满列秩条件失败，重复相同设计不增加参数方向信息．
hints:
- 先列设计矩阵并查秩；未知尺度使用 n−p，自变量角色要清楚．
feedback:
  correct: 关键结论与题设条件相符．两列线性依赖，满列秩条件失败，重复相同设计不增加参数方向信息．
  incorrect: 请重新检查模型、条件和计算：两列线性依赖，满列秩条件失败，重复相同设计不增加参数方向信息．
  choices:
    A: 相同列使两参数只能以其和被辨识．
    B: 秩亏说明解不唯一，残差仍可能不为零．
    C: 重复同一设计行不增加独立的参数方向．
