stem: 区分已知绝对协方差与只知相对权的参数协方差式．
reference_answer: 前者 (AᵀΣ⁻¹A)⁻¹；后者以 s0²(AᵀPA)⁻¹ 估计．
solution: '未知尺度 s0²=vᵀPv/(n−p)，正态下可谈精确残差卡方；不定乘数即逆正规矩阵列的求解系数．


  关键算式：


  $$

  s_0^2=\boldsymbol v^TP\boldsymbol v/(n-p),\quad\operatorname{Cov}(\hat{\boldsymbol\theta})\approx s_0^2(A^TPA)^{-1}

  $$

  '
