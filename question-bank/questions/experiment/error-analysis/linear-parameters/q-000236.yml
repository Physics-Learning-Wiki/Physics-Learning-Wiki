stem: 区分已知绝对协方差与只知相对权的参数协方差式．
reference_answer: 前者 (AᵀΣ⁻¹A)⁻¹；后者以 s0²(AᵀPA)⁻¹ 估计．
solution: 已知 $\Sigma$ 时参数协方差为 $(A^T\Sigma^{-1}A)^{-1}$；仅知相对权 $P$ 且 $\Sigma=\sigma_0^2P^{-1}$ 时，先以 $v^TPv/(n-p)$ 估计共同尺度，再乘
  $(A^TPA)^{-1}$．
