stem: 从一般残差模型推导普通正规方程并说明唯一解条件．
reference_answer: v=l−Aθhat，Aᵀv=0，AᵀAθhat=Aᵀl，rank(A)=p．
solution: 令 $v=l-A\theta$，对第 $j$ 个参数求导得 $-2\sum_i A_{ij}v_i=0$；合写为 $A^Tv=0$，代入残差即得正规方程．满列秩时 $z^TA^TAz=\|Az\|^2>0$ 对非零 $z$
  成立，解唯一．
