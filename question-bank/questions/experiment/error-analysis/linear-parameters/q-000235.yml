stem: 证明固定设计、零均值误差下最小二乘估计无偏．
reference_answer: 设 H=(AᵀA)⁻¹Aᵀ，有 HA=I，E(Hl)=θ．
solution: 取 $H=(A^TA)^{-1}A^T$，则 $HA=I$．代入 $l=A\theta+\epsilon$ 得 $E(\hat\theta)=HA\theta+HE(\epsilon)=\theta$．这是重复实验的平均性质，不代表单次估计没有误差．
