stem: 未知共同尺度的加权残差平方和为 0.12，n=9、p=3．单位权方差估计多少？
answer:
  value: 0.02
  tolerance:
    type: absolute
    value: 4.000000000000001e-06
  unit:
    required: false
    canonical: ''
    accepted: []
solution: 未知共同尺度的单位权方差估计为 $s_0^2=0.12/(9-3)=0.020$．这是方差；标准差还要开平方．
