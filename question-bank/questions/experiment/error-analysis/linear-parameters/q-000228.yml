type: multiple_choice
stem: 已知正定绝对协方差 Σ 的 GLS 需要什么？
choices:
- id: A
  content: 设计矩阵满列秩
- id: B
  content: 权矩阵为 Σ 的逆
- id: C
  content: 总是再乘 SSE/(n−p)
- id: D
  content: 独立原始观测保证参数无关
answer:
  choices:
  - A
  - B
solution: 绝对协方差解的参数协方差为 (AᵀΣ⁻¹A)⁻¹，不自动按残差重缩放，参数仍可相关．
hints:
- 先列设计矩阵并查秩；未知尺度使用 n−p，自变量角色要清楚．
feedback:
  correct: 关键结论与题设条件相符．绝对协方差解的参数协方差为 (AᵀΣ⁻¹A)⁻¹，不自动按残差重缩放，参数仍可相关．
  incorrect: 请重新检查模型、条件和计算：绝对协方差解的参数协方差为 (AᵀΣ⁻¹A)⁻¹，不自动按残差重缩放，参数仍可相关．
  choices:
    A: 满列秩保证正规矩阵可逆并使参数可辨识．
    B: 已知绝对协方差时权为其逆矩阵．
    C: 绝对尺度已经给定，不应再次按残差重缩放．
    D: 观测独立并不保证用同一组观测估计的参数独立．
