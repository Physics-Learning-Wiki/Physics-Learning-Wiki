stem: 正文组合例逆正规矩阵对角均 0.5，各点已知独立 u=0.020 mm，各段 u 多少 mm？
answer:
  value: 0.014142135623730952
  tolerance:
    type: absolute
    value: 2.8284271247461907e-06
  unit:
    required: true
    canonical: mm
    accepted:
    - mm
solution: 已知独立绝对方差时，各段参数方差为 $0.020^2\times0.5\,\mathrm{mm^2}$；开平方得到标准不确定度约 $0.0141421\,\mathrm{mm}$，不再乘残差尺度．
hints:
