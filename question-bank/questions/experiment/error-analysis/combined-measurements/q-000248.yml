stem: 观测 a、b、a+b，哪个设计矩阵行对应总长？
choices:
- id: A
  content: (1,1)
- id: B
  content: (1,0)
- id: C
  content: (0,0)
answer:
  choice: A
solution: 设计矩阵行是该观测对各参数的线性系数，总长包含两项各一次．
hints:
- 每行对应一个真实独立观测，求 Aᵀv 并保留参数非对角协方差．
feedback:
  correct: 关键结论与题设条件相符．设计矩阵行是该观测对各参数的线性系数，总长包含两项各一次．
  incorrect: 请重新检查模型、条件和计算：设计矩阵行是该观测对各参数的线性系数，总长包含两项各一次．
  choices:
    A: 总长为 a+b，两个参数的系数都是 1．
    B: 此行只对应 a，不包含 b．
    C: 零行表示观测不依赖任何参数，不是总长．
