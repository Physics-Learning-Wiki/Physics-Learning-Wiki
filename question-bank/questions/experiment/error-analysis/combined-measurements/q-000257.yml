stem: 组合测量若共享标尺比例和零点，怎样更新分析？
reference_answer: 在观测修正和协方差中加入共同来源，并检查是否影响模型可辨识性．
solution: 先确定共同零点和比例校准是独立外部信息还是未知待估参数；将其灵敏系数引入完整观测协方差或增广模型，并检查能否辨识．求解后保留参数协方差供总长传播．
