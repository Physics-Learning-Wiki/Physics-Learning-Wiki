stem: 组合例三个参数同 u，为什么总长 u 不等于 √3 倍？
reference_answer: 相邻参数有负协方差，必须用 1ᵀCov1．
solution: 参数方差均为 $0.5s_0^2$，但 $\operatorname{Cov}(a,b)=\operatorname{Cov}(b,c)=-0.25s_0^2$，而 $\operatorname{Cov}(a,c)=0$．总长方差是三项方差加两倍三个协方差之和，等于
  $0.5s_0^2$，故其标准不确定度等于单段而非其 $\sqrt3$ 倍．
