stem: 两块表的等级规格均为满量程的 s%，量程分别为 0–3 V 与 0–10 V，用来测 2 V 时如何选量程？还须检查什么？
reference_answer: 不超量程且适用时，满量程允差规格下 0–3 V 表给较小限值．
solution: 按题设满量程规格，0–3 V 表的允许误差半宽为 3s/100 V，0–10 V 表为 10s/100 V．测 2 V 时前者限值较小，还要检查过载、输入阻抗、动态响应、环境与规格适用性．
