stem: 解释重复性、复现性和仪器稳定性的区别，并各举一个实验条件．
reference_answer: 同条件短期分散；改变规定条件后的分散；计量特性随时间变化．
solution: 同操作者短时称量检验重复性；换实验室比较涉及复现性；一年零点变化涉及稳定性．三者信息不可互相替代．
