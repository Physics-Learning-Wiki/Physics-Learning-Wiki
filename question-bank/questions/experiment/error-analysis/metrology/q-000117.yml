  required: true
  min_chars: 1
  max_chars: 12000
  rows: 6
  placeholder: 写出模型、假设、关键计算及结果解释．
grading:
  mode: self_assessed
  rubric:
  - id: incomplete
    label: 将重复性、复现性和稳定性都解释为同一条件下的散布．
    points: 0
  - id: partial
    label: 识别其中两种性质，但遗漏条件变化、时间变化或具体例子．
    points: 0.5
  - id: complete
    label: 分别以同人短时称量、换实验室比较和跨时段零点变化说明重复性、复现性与稳定性．
    points: 1
