stem: 为工作砝码列出溯源所需信息．另说明校准是否已涵盖量具安装的阿贝误差：偏置80mm、转角标准不确定度5×10^-6 rad时的长度贡献是多少？
reference_answer: 溯源链须有参考、校准、条件、修正和不确定度；偏置转角贡献为0.0004mm，不能默认已含在证书．
solution: '校准链连续且有记录，每环贡献不确定度并检查共享来源．阿贝几何误差小角近似 e=hθ，u项为80×5×10^-6=0.0004mm；实际使用安装误差须另建模，除非证书范围明确已覆盖．


  关键算式：


  $$

  u_{\rm Abbe}=|h|u(\theta)=0.0004\,\mathrm{mm}

  $$

  '
