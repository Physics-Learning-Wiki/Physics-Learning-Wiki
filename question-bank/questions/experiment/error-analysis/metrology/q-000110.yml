type: single_choice
stem: 规格明确为满量程 0.5% 的 0–10 V 表，求允差时分母或引用量是哪一个？
choices:
- id: A
  content: 10 V 满量程
- id: B
  content: 当前读数
- id: C
  content: 本次均值的标准差
answer:
  choice: A
solution: 题设明确引用满量程；允许误差限为 10×0.005=0.05 V，不等于按读数百分比计算．
hints:
- 先核对引用量、证书修正和包含因子，区分仪器状态与结果溯源．
feedback:
  correct: 题设明确引用满量程；允许误差限为 10×0.005=0.05 V，不等于按读数百分比计算．
  incorrect: 题设的百分比以满量程 10 V 为引用量，不是以本次读数为准．
  choices:
    A: 规格明确以 10 V 为引用值，因此限值为 10×0.5%．
    B: 按读数计算会误把满量程百分比当作读数百分比．
    C: 样本标准差反映重复散布，不是此规格规定的引用量．
