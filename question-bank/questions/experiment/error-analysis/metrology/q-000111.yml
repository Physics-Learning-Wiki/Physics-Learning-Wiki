stem: 哪一句正确描述计量溯源性？
choices:
- id: A
  content: 结果经有记录的不间断校准链联系参考，每环贡献不确定度
- id: B
  content: 仪器贴校准标签就自动满足所有用途
- id: C
  content: 最高参考必须有零不确定度
answer:
  choice: A
solution: 溯源属于测量结果，须结合使用条件、修正与每一环的信息，不能由标签替代完整链条．
hints:
- 先核对引用量、证书修正和包含因子，区分仪器状态与结果溯源．
feedback:
  correct: 溯源属于测量结果，须结合使用条件、修正与每一环的信息，不能由标签替代完整链条．
  incorrect: 检查校准链是否连续、有记录，以及每一环的不确定度．
  choices:
    A: 溯源性需要结果通过有记录的不间断校准链联系参考，每一步均贡献不确定度．
    B: 标签不能说明全部校准链、实际使用条件及不确定度．
    C: 参考标准的实现与校准仍有不确定度，不能要求链顶为零．
