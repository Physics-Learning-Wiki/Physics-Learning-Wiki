stem: 量块标称 100 mm，证书偏差 +0.002 mm，标准不确定度 0.0001 mm．按校准值与按标称值使用怎样不同？
reference_answer: 按校准值取 100.002 mm 并保留证书不确定度；按标称值需处理未修正偏差和相应允差模型．
solution: '解释具体等/级及限值取决于证书和规程；修正不使实际制造偏差消失，不能把偏差直接当标准差．


  关键算式：


  $$

  L=100.002\,\mathrm{mm},\quad u(L)=0.0001\,\mathrm{mm}

  $$

  '
