stem: f=a exp(−kt)，a=5、k=0.3、t=0．对 a 的偏导是多少？
answer:
  value: 1
  tolerance:
    type: absolute
    value: 0.0002
  unit:
    required: false
    canonical: ''
    accepted: []
solution: 固定 $k,t$，对幅度求偏导得 $\partial f/\partial a=e^{-kt}$．在 $t=0$ 时它等于 1．
