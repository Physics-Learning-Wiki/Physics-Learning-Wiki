stem: 同模型 a=5、k=0.3，全部观测 t=0．对 k 的偏导是多少？
answer:
  value: 0
  tolerance:
    type: absolute
    value: 1.0e-08
  unit:
    required: false
    canonical: ''
    accepted: []
solution: 固定 $a,t$，有 $\partial f/\partial k=-at e^{-kt}$；在 $t=0$ 时为零．全部时间均为零时，观测不能辨识 $k$．
