stem: 推导一次加权 Gauss–Newton 修正式．
reference_answer: r=y−f(θ0)，f(θ0+δ)≈f(θ0)+Jδ，解 JᵀWJδ=JᵀWr．
solution: 取 $r=y-f(\theta)$，作 $f(\theta+\delta)\approx f(\theta)+J\delta$，局部残差约为 $r-J\delta$．最小化其加权平方和并对 $\delta$ 求导，得到 $J^TWJ\delta=J^TWr$；更新后重新计算
  $J$ 和 $r$．
