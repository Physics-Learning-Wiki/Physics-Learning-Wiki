stem: 非线性参数协方差什么时候只能作局部近似？
reference_answer: 强非线性、参数边界、缺秩、多极小点或明显非对称时不宜直接给精确对称区间．
solution: 用最优点的雅可比近似局部曲率；强非线性、参数边界或高度相关时，局部对称近似可能失效，应比较轮廓目标或模拟．已知绝对权与仅知相对权还须区分尺度．
