stem: 非线性参数协方差什么时候只能作局部近似？
reference_answer: 强非线性、参数边界、缺秩、多极小点或明显非对称时不宜直接给精确对称区间．
solution: '绝对已知尺度用 (JᵀWJ)⁻¹，未知共同尺度可近似乘 SSE/(n−p)；不宣称一般非线性残差必精确卡方或参数必无偏．


  关键算式：


  $$

  \operatorname{Cov}(\hat{\boldsymbol\theta})\approx(J^TWJ)^{-1}

  $$

  '
