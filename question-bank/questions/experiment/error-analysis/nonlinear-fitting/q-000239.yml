stem: 指数电压噪声等方差，直接取对数后不加权拟合意味着什么？
choices:
- id: A
  content: 改变了噪声模型，不能默认等价
- id: B
  content: 必定保持等方差
- id: C
  content: 消除了所有系统效应
answer:
