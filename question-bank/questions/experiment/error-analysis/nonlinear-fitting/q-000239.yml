stem: 指数电压噪声等方差，直接取对数后不加权拟合意味着什么？
choices:
- id: A
  content: 改变了噪声模型，不能默认等价
- id: B
  content: 必定保持等方差
- id: C
  content: 消除了所有系统效应
answer:
  choice: A
solution: 局部对数噪声约为原噪声除电压，尺度随信号改变；对数图可猜初值但须核查最终模型．
hints:
- 在当前参数处求雅可比，解修正后重算目标；局部收敛不等于全局正确．
feedback:
  correct: 关键结论与题设条件相符．局部对数噪声约为原噪声除电压，尺度随信号改变；对数图可猜初值但须核查最终模型．
  incorrect: 请重新检查模型、条件和计算：局部对数噪声约为原噪声除电压，尺度随信号改变；对数图可猜初值但须核查最终模型．
  choices:
    A: 加性等方差噪声取对数后近似除以模型值，方差随信号变化．
    B: 对数导数为 1/y，因而原量等方差一般不会保持．
    C: 变量变换不会自动消除校准或其他系统效应．
