stem: 设计指数衰减拟合的初值与失败诊断流程．
reference_answer: 由物理测量、图形或子方程猜初值，多组起点比较目标并检查残差与秩．
solution: 用正电压对数图估计初值，但最终仍按给定加性误差拟合原量．用多组物理合理初值比较目标与结果，检查残差、参数尺度、雅可比秩和边界；全部在 $t=0$ 时无法识别衰减率．
