stem: 将 4.51050 用最近舍入及五成双保留四位有效数字．写出结果并解释最后的零为何要保留．
solution: 舍去部分恰为保留末位单位的一半，保留位 0 为偶数，因此写作 4.510．4.51 的数值相等，但书写并未表达同样的末位信息．
