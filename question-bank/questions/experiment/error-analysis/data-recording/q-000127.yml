solution: '给出 ln(x/x0) 的无量纲要求，角度导数使用弧度；接近奇异点或相消时不能仅按口诀．


  关键算式：


  $$

  u(\ln(x/x_0))\approx u(x)/|x|,\quad u(\sin\phi)\approx|\cos\phi|u(\phi)

  $$

  '
