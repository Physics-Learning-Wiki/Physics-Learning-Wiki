stem: 说明乘除、开方、对数与三角函数的位数规则和局限．
reference_answer: 乘除开方可按有效数字粗估；对数用相对变化；三角函数须按角度与导数处理．
solution: 乘除和开方可按最少有效数字粗估；对数应写成无量纲比值 ln(x/x₀)，固定 x₀ 且局部线性近似时 u(ln(x/x₀))≈u(x)/|x|．三角函数角度须用弧度，例如 u(sinφ)≈|cosφ|u(φ)．靠近奇异点、发生相消或相关时，应回到测量模型评估．
