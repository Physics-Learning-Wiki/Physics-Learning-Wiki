stem: 为什么 11.4+2.56 可以按传统规则报 14.0，而精确传播不一定只看小数位？
reference_answer: 未修约和为 13.96；传统规则按最粗小数位，但不替代显式不确定度模型．
solution: '解释保护位、相关性和相消；先用未修约数计算预算，最后按报告规则修约，不能每步丢位．


  $$

  11.4+2.56=13.96\approx14.0

  $$

  '
