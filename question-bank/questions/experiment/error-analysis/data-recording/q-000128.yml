stem: 0.01231 按两位最近舍入和两位向上进位分别为何值？哪种适用于本章？
reference_answer: 0.012 与 0.013；本章采用最近舍入和五成双．
solution: '不同规程可规定保守进位或一位三分之一等约定，必须说明依据，不能混用并把另一种约定当计算错误．


  关键算式：


  $$

  0.01231\longrightarrow0.012\quad\text{或}\quad0.013

  $$

  '
