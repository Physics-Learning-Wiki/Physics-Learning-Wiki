stem: 100.02147(35) g 已声明括号为标准不确定度．括号表示什么？
choices:
- id: A
  content: 0.00035 g
- id: B
  content: 35 g
- id: C
  content: 0.35 g
answer:
  choice: A
solution: 括号数字对应估计值末位，所以为 35×10^-5 g．
hints:
- 保留未修约中间值，先确定不确定度末位，再对齐结果；不要倒改原始记录．
feedback:
  correct: 括号数字对应估计值末位，所以为 35×10^-5 g．
  incorrect: 括号中的 35 对应估计值的最后两位，即 35 个 0.00001 g．
  choices:
    A: 括号对应估计值末两位，因此 35 个末位单位等于 0.00035 g．
    B: 35 表示末位单位的个数，不直接表示 35 g．
    C: 应从估计值末位 0.00001 g 开始计数，不能移成 0.35 g．
