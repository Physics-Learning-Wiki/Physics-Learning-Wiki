stem: 设计一张可复查的温度—长度原始记录表，需要哪些字段？
reference_answer: 顺序/时刻、温度、单位、每次读数、仪器与分辨率、校准和异常备注、修正栏．
solution: 保留原始值、更正痕迹、条件和证书引用；不要用最终位数倒改原始数据，也避免量化效应重复计入．
