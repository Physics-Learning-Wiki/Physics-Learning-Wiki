  mode: self_assessed
  rubric:
  - id: incomplete
    label: 尚未掌握：结论或模型错误
    points: 0
  - id: partial
    label: 部分掌握：主要思路正确，但条件、推导或解释不完整
    points: 0.5
  - id: complete
    label: 基本掌握：顺序/时刻、温度、单位、每次读数、仪器与分辨率、校准和异常备注、修正栏．
    points: 1
hints:
- 保留未修约中间值，先确定不确定度末位，再对齐结果；不要倒改原始记录．
feedback:
  correct: 关键结论与题设条件相符．保留原始值、更正痕迹、条件和证书引用；不要用最终位数倒改原始数据，也避免量化效应重复计入．
  incorrect: 请重新检查模型、条件和计算：保留原始值、更正痕迹、条件和证书引用；不要用最终位数倒改原始数据，也避免量化效应重复计入．
