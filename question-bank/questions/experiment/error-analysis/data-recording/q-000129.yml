choice_order: fixed
type: free_response
stem: 设计一张可复查的温度—长度原始记录表，需要哪些字段？
reference_answer: 顺序/时刻、温度、单位、每次读数、仪器与分辨率、校准和异常备注、修正栏．
solution: 保留原始值、更正痕迹、条件和证书引用；不要用最终位数倒改原始数据，也避免量化效应重复计入．
response:
  format: plain_text
  required: true
  min_chars: 1
  max_chars: 12000
  rows: 6
  placeholder: 写出模型、假设、关键计算及结果解释．
grading:
  mode: self_assessed
  rubric:
  - id: incomplete
    label: 只记录最终结果，遗漏原始读数和单位．
    points: 0
  - id: partial
    label: 记录各次读数和单位，但缺少仪器、环境、顺序或修正信息．
    points: 0.5
  - id: complete
    label: 列出顺序或时刻、温度与长度单位、每次读数、仪器分辨率、校准和异常备注，原始读数与修正分列．
    points: 1
hints:
- 保留未修约中间值，先确定不确定度末位，再对齐结果；不要倒改原始记录．
feedback:
  correct: 列出顺序或时刻、温度与长度单位、每次读数、仪器分辨率、校准和异常备注，原始读数与修正分列．
  incorrect: 记录各次读数和单位，但缺少仪器、环境、顺序或修正信息．
difficulty: 3
cognitive_level: analyze
style: modeling
estimated_seconds: 600
