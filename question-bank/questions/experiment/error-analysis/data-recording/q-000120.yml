type: single_choice
stem: 原始读数 12.14 mm、零点 +0.04 mm．记录应怎样保存？
choices:
- id: A
  content: 保留两原始值，另列修正后的 12.10 mm
- id: B
  content: 用 12.10 覆盖原读数
- id: C
  content: 把原读数添零改成 12.14000
answer:
  choice: A
solution: 原始值、修正和最终结果分列，保证可复查，不冒充更高分辨率．
hints:
- 保留未修约中间值，先确定不确定度末位，再对齐结果；不要倒改原始记录．
feedback:
  correct: 原始值、修正和最终结果分列，保证可复查，不冒充更高分辨率．
  incorrect: 同时保留示值和零点，再单独记录修正后结果．
  choices:
    A: 保留原始示值与零点，并另列 12.10 mm，读者才能复算修正．
    B: 覆盖原始读数会丢失修正前的信息．
    C: 添零会改变读数所表达的末位信息，原始记录应忠实保留．
