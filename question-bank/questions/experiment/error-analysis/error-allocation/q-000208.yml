stem: 面积 l×w，l=100 mm、w=50 mm，目标 u(A)=1 mm²，若 u(w)=0.008 mm，允许 u(l) 最大多少 mm？
answer:
  value: 0.012
  tolerance:
    type: absolute
    value: 2.4000000000000003e-06
  unit:
    required: true
    canonical: mm
    accepted:
    - mm
solution: '宽度贡献 100×0.008=0.8 mm²；长度贡献上限 √(1−0.8²)=0.6，除以50得0.012 mm．


  关键算式：


  $$

  \text{计算结果}=0.012\,\mathrm{mm}

  $$

  '
