stem: 从总输出目标推导一个输入的允许不确定度公式，并交代相关项例外．
reference_answer: 在独立输入、一阶近似及根号内非负、$c_j\ne0$ 的条件下，$u_j\leq\sqrt{u_*^2-\sum_{i\ne j}q_i^2}/|c_j|$．
solution: '对互不相关的输入，令 $q_i=|c_i|u_i$．输出目标要求


  $$

  \sum_i q_i^2\leq u_*^2.

  $$


  将其他项移到右边：


  $$

  c_j^2u_j^2\leq u_*^2-\sum_{i\ne j}q_i^2.

  $$


  若右侧非负且 $c_j\ne0$，便得到


  $$

  u_j\leq\frac{\sqrt{u_*^2-\sum_{i\ne j}q_i^2}}{|c_j|}.

  $$


  右侧为负说明其他固定项已超过目标；$c_j=0$ 时不能除以它，还须检查高阶影响．存在相关项时，应使用完整协方差约束重新分析．'
