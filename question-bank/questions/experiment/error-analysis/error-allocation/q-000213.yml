stem: 弓高弦长 D=s²/(4h)+h，如何减弱高度影响？为何不能断言高度完全无影响？
reference_answer: $c_s=s/(2h)$、$c_h=1-s^2/(4h^2)$；$s=2h$ 使高度的一阶贡献为零．
solution: '对模型 $D=s^2/(4h)+h$ 分别求偏导：


  $$

  c_s=\frac{s}{2h},\qquad c_h=1-\frac{s^2}{4h^2}.

  $$


  当几何条件允许 $s=2h$ 时，$c_h=0$，高度不确定度在该点没有一阶贡献．实际工作点可能偏离这一条件，二阶项和 $s$、$h$ 的相关性仍可能影响输出；应结合几何可行性和完整预算判断．'
