stem: 等贡献分配一定经济最优吗？给一个调整策略．
reference_answer: 不一定；对难测项适当放宽，再收紧容易改进项，并复核总预算．
solution: '无成本函数不能声称经济最优；有成本模型可在总方差约束下优化，同时考虑固定共同下限．


  关键算式：


  $$

  \min\sum_i C_i(u_i)\quad\text{满足}\quad\sum_i c_i^2u_i^2\leq u_*^2

  $$

  '
