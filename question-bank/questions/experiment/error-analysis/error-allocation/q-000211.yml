stem: 等贡献分配一定经济最优吗？给一个调整策略．
reference_answer: 不一定．等贡献只是满足预算的一个起点，未包含设备价格、测量时间或实现难度．例如两个贡献起初各为 u*/√2；若第一项难以降低，可适当放宽它，再降低第二项，直到两项平方和仍不超过 u*²．给定成本函数和可实现范围后才能比较经济性；共同校准下限也要计入．
solution: 不一定．等贡献只是满足预算的一个起点，未包含设备价格、测量时间或实现难度．例如两个贡献起初各为 u*/√2；若第一项难以降低，可适当放宽它，再降低第二项，直到两项平方和仍不超过 u*²．给定成本函数和可实现范围后才能比较经济性；共同校准下限也要计入．
