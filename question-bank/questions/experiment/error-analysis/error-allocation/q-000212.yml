stem: 比较 L=L1−(d1+d2)/2 与 L=(L1+L2)/2 怎样选方案？
reference_answer: 分别写出两个测量模型及其灵敏系数．若各输入互不相关，第一方案 u₁²=u²(L₁)+[u²(d₁)+u²(d₂)]/4，第二方案 u₂²=[u²(L₁)+u²(L₂)]/4．将实际输入不确定度换成同一单位后比较，并检查两个方案对同一几何量是否都成立．若量具共享零点或校准，还须加入相应协方差，不能仅按输入项数选择．
