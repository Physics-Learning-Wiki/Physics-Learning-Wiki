stem: 比较 L=L1−(d1+d2)/2 与 L=(L1+L2)/2 怎样选方案？
reference_answer: 对同一目标量写两个完整输入模型，使用实际不确定度和协方差计算预算．
solution: '输入少不保证更好；给相同单位、说明共享尺/零点；选择可实现且预算较小的方案并检查模型条件．


  关键算式：


  $$

  u_1^2=u^2(L_1)+[u^2(d_1)+u^2(d_2)]/4,\quad u_2^2=[u^2(L_1)+u^2(L_2)]/4

  $$

  '
