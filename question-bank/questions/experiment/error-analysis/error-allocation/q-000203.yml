stem: 给定目标总方差已小于其他固定项方差和，怎样处理剩余分配？
choices:
- id: A
  content: 报告目标不可行并调整方案
- id: B
  content: 把负根号取绝对值
- id: C
  content: 把剩余贡献强制填零
answer:
  choice: A
solution: 预算目标已被用尽，必须改变既有来源或目标，不能伪造可行解．
hints:
- 先把每项转换为输出贡献，再从总方差约束反解，检查目标可行性．
feedback:
  correct: 核对每项涉及的模型和条件，见各选项反馈．
  incorrect: 请逐项检查因果关系与适用前提，见各选项反馈．
  choices:
    A: 其他固定项已超过目标，应调整目标或降低已有贡献．
    B: 负根号代表当前约束不可行，不能取绝对值．
    C: 剩余项为零也无法使超标的其他项达标．
