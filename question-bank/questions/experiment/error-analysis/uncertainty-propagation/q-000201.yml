stem: X 的估计值为零，Y=X² 的一阶导数为零，是否可报 u(Y)=0？
reference_answer: 不能．零一阶导数不排除二阶分散；零均值正态例子中 $\operatorname{Var}(X^2)=2\sigma^4$．
solution: '零一阶导数不代表输出没有分散．例如，若 $X$ 服从均值为零、标准差为 $\sigma$ 的正态分布，令 $Y=X^2$，则


  $$

  E(Y)=E(X^2)=\sigma^2,\qquad E(X^4)=3\sigma^4.

  $$


  所以


  $$

  \operatorname{Var}(Y)=E(X^4)-[E(X^2)]^2=2\sigma^4,\qquad u(Y)=\sqrt{2}\,\sigma^2.

  $$


  此处 $f''(0)=0$ 的一阶近似丢掉了主要变化，需要考虑高阶项或完整分布传播．'
