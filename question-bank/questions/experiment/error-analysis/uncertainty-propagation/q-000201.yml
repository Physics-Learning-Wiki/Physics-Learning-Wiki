stem: X 的估计值为零，Y=X² 的一阶导数为零，是否可报 u(Y)=0？
reference_answer: 不能；二阶影响和输出分布仍可能非零．
solution: '若 X 为零均值正态，E(X²)=σ²，Var(X²)=2σ⁴，可直接证明一阶失效；需高阶或分布传播．


  关键算式：


  $$

  E(X^2)=\sigma^2,\qquad\operatorname{Var}(X^2)=2\sigma^4

  $$

  '
