stem: 同一共同零点的两个位置读数求差时为什么可能消去该项？
choices:
- id: A
  content: 模型中共同项代数消去，协方差式给同样结果
- id: B
  content: 因为任何减法都减少一半不确定度
- id: C
  content: 因为两个读数必然独立
answer:
  choice: A
solution: 共同 B 在 R2−R1 中消失；忽略相关性反而会多计两次 B 的方差．
