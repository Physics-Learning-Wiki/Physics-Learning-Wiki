stem: 线性模型 y=x₁−2x₂ 中，已知两项有符号偏差严格满足 |e₁|≤0.03、|e₂|≤0.01．求输出偏差的保守绝对界限，并解释为什么独立正态模型下的方和根概率范围是另一种结论．
reference_answer: 由三角不等式 |eᵧ|≤0.03+2×0.01=0.05；方和根描述给定分布及覆盖条件下的概率范围，不能仅凭严格界限导出．
solution: 线性模型给 eᵧ=e₁−2e₂．三角不等式给 |eᵧ|≤|e₁|+2|e₂|≤0.05．两项同时取 e₁=0.03、e₂=−0.01 可达到该界．概率合成需要额外给出分布、相关性与覆盖因子；正态模型具有无界尾部，不能把严格有限界与正态假设视为同一条件．
