stem: φ=arcsin(z)，z=0.5，u(z)=0.001．一阶 u(φ) 多少 rad？（结果至少保留三位有效数字）．
answer:
  value: 0.0011547005383792516
  tolerance:
    type: absolute
    value: 5.001e-06
  unit:
    required: true
    canonical: rad
    accepted:
    - rad
solution: φ=arcsin z 的导数为 1/√(1−z²)．在 z=0.5 处代入 u(z)=0.001，得 u(φ)≈0.001/√(1−0.5²)=0.00115470 rad．
