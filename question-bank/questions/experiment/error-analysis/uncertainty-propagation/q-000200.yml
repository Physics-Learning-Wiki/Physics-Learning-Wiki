stem: 如何由配对数据估计相关系数，同时避免遗漏校准来源？
reference_answer: 将中心化乘积之和除以两个中心化平方和乘积的平方根；共同校准须另建模型．
solution: '先求配对观测的均值 $\bar x$ 和 $\bar y$，然后计算


  $$

  r=\frac{\sum_k(x_k-\bar x)(y_k-\bar y)}

  {\sqrt{\sum_k(x_k-\bar x)^2\sum_k(y_k-\bar y)^2}}.

  $$


  先画散点图检查异常点和非线性；分母为零时该系数未定义．如果共同校准在这组观测中保持不变，它可能没有反映在样本散布中，还须根据校准信息建立相关模型．'
