stem: 如何由配对数据估计相关系数，同时避免遗漏校准来源？
reference_answer: 先作散点图，再以中心化乘积和除以两平方和根号．
solution: '说明配对样本量、异常和非线性；观察象限只能粗估，共同校准即使未在样本中变化也可造成相关输入信息．


  关键算式：


  $$

  r=\frac{\sum_k(x_k-\bar x)(y_k-\bar y)}{\sqrt{\sum_k(x_k-\bar x)^2\sum_k(y_k-\bar y)^2}}

  $$

  '
