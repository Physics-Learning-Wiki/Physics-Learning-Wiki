stem: sin、cos、tan、cot 的反求角度偏差和 u 怎样传播？
reference_answer: 先求反求导数再链式乘原模型导数；分别 1/cosφ、−1/sinφ、cos²φ、−sin²φ．
solution: '角度以弧度计；偏差保留符号，方差按完整协方差；接近奇异点不能机械给对称范围．


  关键算式：


  $$

  \frac{\mathrm d\phi}{\mathrm dz}=\frac1{\cos\phi},\ -\frac1{\sin\phi},\ \cos^2\phi,\ -\sin^2\phi

  $$

  '
