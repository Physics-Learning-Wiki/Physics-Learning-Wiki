stem: sin、cos、tan、cot 的反求角度偏差和 u 怎样传播？
reference_answer: 反求导数依次为 $1/\cos\phi$、$-1/\sin\phi$、$\cos^2\phi$、$-\sin^2\phi$，再用链式法则传播．
solution: '令 $z$ 为三角函数值，分别对关系式微分，得到


  $$

  \begin{aligned}

  \sin\phi=z&:\quad \frac{\mathrm d\phi}{\mathrm dz}=\frac1{\cos\phi},\\

  \cos\phi=z&:\quad \frac{\mathrm d\phi}{\mathrm dz}=-\frac1{\sin\phi},\\

  \tan\phi=z&:\quad \frac{\mathrm d\phi}{\mathrm dz}=\cos^2\phi,\\

  \cot\phi=z&:\quad \frac{\mathrm d\phi}{\mathrm dz}=-\sin^2\phi.

  \end{aligned}

  $$


  将相应导数乘以 $z$ 对输入的导数．有符号偏差保留导数的符号；标准不确定度按方差与协方差传播．角度使用弧度；分母接近零或跨越反函数分支时，还须检查定义域和一阶近似．'
