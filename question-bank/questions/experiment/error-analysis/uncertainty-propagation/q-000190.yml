stem: 有符号偏差与标准不确定度的合成有什么区别？
choices:
- id: A
  content: 偏差一阶按带符号导数相加，不确定度按方差和协方差合成
- id: B
  content: 两者永远算术相加
- id: C
  content: 两者永远取绝对值相加
answer:
  choice: A
solution: 已知偏移先修正；其不可靠度是另一量，不能由偏移的正负抵消推出方差为零．
hints:
- 先写测量方程与偏导，检查单位、符号、协方差和一阶近似．
feedback:
  correct: 核对每项涉及的模型和条件，见各选项反馈．
  incorrect: 请逐项检查因果关系与适用前提，见各选项反馈．
  choices:
    A: 偏差的线性传播保留符号；标准不确定度用方差和协方差传播．
    B: 随机分量不能无条件按算术和处理．
    C: 绝对值和是特定严格限值的保守界，不是两者通用公式．
