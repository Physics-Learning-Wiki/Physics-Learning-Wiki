stem: 有符号偏差与标准不确定度的合成有什么区别？
choices:
- id: A
  content: 偏差一阶按带符号导数相加，不确定度按方差和协方差合成
- id: B
  content: 两者永远算术相加
- id: C
  content: 两者永远取绝对值相加
