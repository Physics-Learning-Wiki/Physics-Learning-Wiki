stem: 从一阶模型展开推导协方差传播式．
reference_answer: 一阶传播式为 $u_c^2=\sum_i c_i^2u^2(x_i)+2\sum_{i<j}c_i c_j\operatorname{Cov}(X_i,X_j)$．
solution: '在输入估计点作一阶展开，并令 $\delta X_i=X_i-x_i$：


  $$

  Y-y\approx\sum_i c_i\delta X_i,\qquad c_i=\left.\frac{\partial f}{\partial X_i}\right|_{X_i=x_i}.

  $$


  对线性组合展开方差：


  $$

  \operatorname{Var}\!\left(\sum_i c_i\delta X_i\right)

  =\sum_i c_i^2\operatorname{Var}(\delta X_i)

  +\sum_{i\ne j}c_i c_j\operatorname{Cov}(\delta X_i,\delta X_j).

  $$


  协方差对称，每对交叉项出现两次．代入 $\operatorname{Var}(X_i)=u^2(x_i)$，得到


  $$

  u_c^2=\sum_i c_i^2u^2(x_i)+2\sum_{i<j}c_i c_j\operatorname{Cov}(X_i,X_j).

  $$


  不相关时交叉项为零；显著非线性时还需检查高阶影响．'
