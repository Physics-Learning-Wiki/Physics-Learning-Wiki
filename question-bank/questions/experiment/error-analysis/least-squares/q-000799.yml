stem: 固定 x=3 处，拟合均值为 3.96，残差标准差 s=0.219089，n=5、x 均值 2、Sxx=10．假设独立正态同方差，给定 t(0.975,3)=3.18245，求均值响应的 95% 置信区间与新独立观测的 95% 预测区间．
reference_answer: 均值区间约 3.96±0.382；新观测区间约 3.96±0.795．
solution: 均值标准误差为 s√(1/5+(3−2)²/10)，新观测还增加一次观测误差，标准误差为 s√(1+1/5+(3−2)²/10)．分别乘题给 t 值得半宽 0.381894 和 0.794975．
