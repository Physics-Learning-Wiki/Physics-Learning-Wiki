stem: 为什么 α=b/a 传播必须保留截距与斜率协方差？
reference_answer: 二者由同组数据估计通常相关，交叉项为 −2b Cov(a,b)/a³．
solution: '写完整方差 b²u²(a)/a⁴+u²(b)/a²−2bCov(a,b)/a³；输入观测独立不能推出参数独立．


  关键算式：


  $$

  u^2(\alpha)=b^2u^2(a)/a^4+u^2(b)/a^2-2b\operatorname{Cov}(a,b)/a^3

  $$

  '
