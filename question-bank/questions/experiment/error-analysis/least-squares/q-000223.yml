stem: 为什么 α=b/a 传播必须保留截距与斜率协方差？
reference_answer: 二者由同组数据估计通常相关，交叉项为 −2b Cov(a,b)/a³．
solution: 对 $\alpha=b/a$ 有 $\partial\alpha/\partial a=-b/a^2$、$\partial\alpha/\partial b=1/a$；乘以完整协方差矩阵后交叉项符号为负，是否可忽略取决于实际协方差．
