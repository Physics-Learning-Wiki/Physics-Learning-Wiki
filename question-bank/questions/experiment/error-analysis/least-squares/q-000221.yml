solution: 由 $\alpha=b/a$，代入 $a=1000\,\mathrm{mm}$ 和 $b=0.017\,\mathrm{mm/K}$，得 $\alpha=1.7\times10^{-5}\,\mathrm{K^{-1}}$；长度单位相消．
