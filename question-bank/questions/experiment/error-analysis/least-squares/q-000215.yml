stem: 给定各点已知绝对标准不确定度时，curve_fit 应采用哪一设定？
choices:
- id: A
  content: sigma 传标准不确定度，absolute_sigma=True
- id: B
  content: sigma 传方差并自动残差缩放
- id: C
  content: 不给 sigma，结果必更精确
answer:
  choice: A
solution: sigma 是标准量；True 保留已知绝对尺度，不自动乘约化残差．
hints:
- 写残差和目标函数，区分已知不确定度与残差估计的共同尺度．
feedback:
