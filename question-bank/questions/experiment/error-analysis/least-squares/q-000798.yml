stem: 某有截距直线回归有 5 个独立观测，回归平方和 9.216，残差平方和 0.144．在固定横坐标、误差独立正态同方差的模型下，以 0.05 水平检验总体斜率是否为零．给定 F(1,3) 的 0.05 上侧临界值为 10.13．
reference_answer: F=192，大于 10.13，拒绝零斜率；不由此证明因果或拟合充分．
solution: 回归和残差自由度分别为 1 和 3，故 F=(9.216/1)/(0.144/3)=192．大于题给临界值，拒绝零斜率；模型是否充分仍需检查残差与实验设计．
