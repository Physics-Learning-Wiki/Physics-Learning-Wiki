stem: 在三个不同固定横坐标 x=0、1、2 处各独立观测两次，数据依次为 (0.9,1.1)、(2.4,2.6)、(4.9,5.1)．设误差独立正态同方差，计算直线模型的纯误差平方和、失拟平方和和失拟 F 值，给出两个自由度．
reference_answer: 纯误差 0.06，失拟 1/3，F=16.67，自由度 (1,3)．
solution: 各组均值为 1、2.5、5，直线拟合值为 5/6、17/6、29/6．组内六个偏差各为 ±0.1，纯误差为 0.06，组均值偏离拟合线的加权平方和为 1/3．失拟与纯误差自由度分别为 3−2=1、6−3=3，故 F=(1/3)/(0.06/3)=16.67．
