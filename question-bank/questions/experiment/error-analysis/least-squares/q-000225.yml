stem: 残差随温度明显弯曲，但 R² 很高，怎样处理？
reference_answer: 检查模型不足、温标与相关影响，必要时在物理依据下扩展模型．
solution: 先画残差对温度图并核查校准与观测过程；若弯曲稳定且有物理依据，在明确适用范围后比较更合适的模型，再用新模型重新估计参数和不确定度．
