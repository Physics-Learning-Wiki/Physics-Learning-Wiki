stem: 从残差平方和推导直线斜率和截距公式．
reference_answer: Σv=0、Σxv=0，b=Sxy/Sxx，a=平均y−b平均x．
solution: 分别对截距和斜率求导得到 $\sum v_i=0$ 与 $\sum x_i v_i=0$；第一式得 $a=\bar y-b\bar x$，代入第二式得 $bS_{xx}=S_{xy}$，当 $S_{xx}>0$ 时解唯一．
