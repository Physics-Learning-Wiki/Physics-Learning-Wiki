type: multiple_choice
stem: 直线普通最小二乘的噪声估计需要什么？
choices:
- id: A
  content: 横坐标可视为已知且 Sxx>0
- id: B
  content: 独立同方差零均值误差、充分模型且 n>2
- id: C
  content: 只有两个点也可估残差方差
- id: D
  content: 高 R² 已证明线性模型
answer:
  choices:
  - A
  - B
solution: 两个参数需正残差自由度，R² 不能替代残差结构和物理条件检查．
hints:
- 写残差和目标函数，区分已知不确定度与残差估计的共同尺度．
feedback:
  correct: 关键结论与题设条件相符．两个参数需正残差自由度，R² 不能替代残差结构和物理条件检查．
  incorrect: 请重新检查模型、条件和计算：两个参数需正残差自由度，R² 不能替代残差结构和物理条件检查．
  choices:
    A: 横坐标视为已知且不同，才能确定唯一斜率．
    B: 独立同方差与零均值使残差方差可估共同方差；还需正自由度．
    C: 两点拟合两个参数，残差自由度为零．
    D: 高 R² 不能排除弯曲和系统偏差．
