stem: 普通直线拟合 n=6，残差平方和 0.04，共同方差未知．残差方差估计为多少？
answer:
  value: 0.01
  tolerance:
    type: absolute
    value: 2.0000000000000003e-06
  unit:
    required: false
    canonical: ''
    accepted: []
solution: 有截距直线估计两个参数，残差自由度为 $6-2=4$，因此共同方差估计为 $s^2=0.04/4=0.01$．
hints:
