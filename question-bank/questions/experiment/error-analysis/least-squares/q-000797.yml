stem: 自编数据 x=(0,1,2,3,4)、y=(1,2.2,2.8,4.2,4.8)，已有拟合值 ŷ=1.08+0.96x．计算总平方和、回归平方和、残差平方和并解释它们为何相加．
reference_answer: 总平方和 9.36，回归平方和 9.216，残差平方和 0.144，满足 9.36=9.216+0.144．
solution: 平均值为 3；将每个总偏差拆成拟合偏差和残差．有截距的最小二乘满足残差与常数列、x 列正交，因此平方展开后的交叉项为零．逐项求和得 9.36=9.216+0.144．
