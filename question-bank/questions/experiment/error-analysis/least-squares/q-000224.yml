stem: 某加权拟合约化 χ²=0.18，可否自动缩小给定标准不确定度？
reference_answer: 不可；先看样本偶然性、输入设定、相关性与模型．
solution: 已知各输入标准不确定度是绝对尺度时，用它们形成权重和参数协方差；小的约化卡方可来自随机波动或模型与输入尺度不匹配，应检查数据和相关性而非自动修改尺度．
