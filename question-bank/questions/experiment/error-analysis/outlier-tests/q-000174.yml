reference_answer: T=(xj−均值其余)/(s其余√(1+1/(n−1)))，自由度 n−2．
solution: '候选与其余均值的差方差为 σ²+σ²/(n−1)；尺度由余下样本估计，候选必须事先独立指定．


  关键算式：


  $$

  T=\frac{x_j-\bar x_{-j}}{s_{-j}\sqrt{1+1/(n-1)}}\sim t_{n-2}

  $$

  '
