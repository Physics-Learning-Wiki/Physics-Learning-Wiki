stem: 日志显示温度突变，某读数离群，应先删点还是改模型？
reference_answer: 先核对温度日志、读数时刻与仪器状态．如果温度确实改变了被测对象或测量模型，可按条件分段分析或重新测量；如果有独立证据证明该次测量失效，可标记排除并保留原始记录．仅凭离群和温度变化不能直接认定误操作，原因不明时比较包含与不包含该值的结果．
solution: 先核对温度日志、读数时刻与仪器状态．如果温度确实改变了被测对象或测量模型，可按条件分段分析或重新测量；如果有独立证据证明该次测量失效，可标记排除并保留原始记录．仅凭离群和温度变化不能直接认定误操作，原因不明时比较包含与不包含该值的结果．
