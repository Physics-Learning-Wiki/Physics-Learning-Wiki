stem: 一个候选由看完全体后选为最远点，能否用固定候选预测阈值？
choices:
- id: A
  content: 不能忽略事后选择，需要配套阈值
- id: B
  content: 可以，因为 n 没改变
- id: C
  content: 只需把显著性水平改为一
answer:
  choice: A
solution: 候选产生方式影响整体错误概率；固定候选与全样本极值选择不同．
hints:
- 先说明候选是否预先指定，再核对分母尺度、自由度和单双端阈值．
feedback:
  correct: 核对每项涉及的模型和条件，见各选项反馈．
  incorrect: 请逐项检查因果关系与适用前提，见各选项反馈．
  choices:
    A: 事后选极值改变统计量分布，应选择考虑筛选的阈值．
    B: 样本数相同不代表候选选择过程相同．
    C: 显著性水平不能这样设置来修复选择效应．
