stem: 一次异常值分析必须记录哪些内容？
choices:
- id: A
  content: 候选选择和原始值
- id: B
  content: 统计量、阈值、假设及处理理由
- id: C
  content: 删除后标准差变小即可替代理由
- id: D
  content: 只保留最后通过检验的数据
answer:
  choices:
  - A
  - B
solution: 原始数据和选择过程决定可复查性，不能只报告删点后的好看结果．
hints:
- 先说明候选是否预先指定，再核对分母尺度、自由度和单双端阈值．
