stem: Dixon 题给 n=5、双端搜索、r10、α=0.05，临界值 0.710，Q=0.867．报告什么？
reference_answer: 0.867>0.710，因此在 n=5、双端搜索、r10 与显著性水平 0.05 对应的表和独立正态单异常模型下，端点被标记为可疑．应记录候选来源和原始数据并调查原因；该表值不能直接用于其他样本数或其他比值．
