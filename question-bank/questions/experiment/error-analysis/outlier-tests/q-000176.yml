stem: Dixon 题给 n=5、双端搜索、r10、α=0.05，临界值 0.710，Q=0.867．报告什么？
reference_answer: 在题设的匹配表与假设下超过阈值，端点可疑．
solution: '必须一并报告统计量变体、样本数、尾部、正态与独立条件；不能把此阈值用于 n=20 或其他 Dixon 比．


  关键算式：


  $$

  Q=0.867\gt Q_{\rm crit}=0.710

  $$

  '
