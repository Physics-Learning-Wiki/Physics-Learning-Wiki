  rubric:
  - id: incomplete
    label: 把新样本的 4 当作历史尺度的自由度，或直接用历史标准差作为新均值标准差．
    points: 0
  - id: partial
    label: 算出 s/√5 和历史自由度 19，但未说明历史尺度估计、正态及两批过程相容性．
    points: 0.5
  - id: complete
    label: 说明历史 20 次独立正态样本给尺度自由度 19，新均值的尺度为 s/√5，并检查两批条件、独立性和共同方差．
    points: 1
hints:
