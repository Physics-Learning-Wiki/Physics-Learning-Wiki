stem: 历史二十次独立同分布正态观测计算出的样本标准差 s，用于新五次独立观测的均值；假设两批过程具有相同方差．尺度自由度从哪里来？如何报告？
reference_answer: 条件相容时用 s/√5，历史尺度自由度 19．
solution: '本次结果以历史重复性资料评定，不能随意改成 4；需核查量程、环境、独立性、稳定性及资料不可靠度．


  $$

  u(\bar x_{\rm new})=s_{\rm hist}/\sqrt5,\quad\nu_{\rm hist}=19

  $$

  '
