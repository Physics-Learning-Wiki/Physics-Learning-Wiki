type: single_choice
stem: 贝塞尔样本方差为何除以 n−1？
choices:
- id: A
  content: 估计均值使残差平方和期望减少一个总体方差
- id: B
  content: 因为每组必有一个读数错误
- id: C
  content: 因为标准差本来无偏
answer:
  choice: A
solution: 残差和约束损失一个自由度，平方和期望为 (n−1)σ²；样本标准差本身不一般无偏．
hints:
- 先写出总离差平方和分解，再对它取期望．
feedback:
  correct: 残差和约束损失一个自由度，平方和期望为 (n−1)σ²；样本标准差本身不一般无偏．
  incorrect: 平均值由样本估计，残差和为零；考虑平方和的期望．
  choices:
    A: 正确：估计均值使残差平方和期望减少 σ²，故除以 n−1．
    B: 自由度损失源于估计均值，即使所有读数都正确也存在．
    C: 无偏的是这里的样本方差 s²；开平方后 s 一般并非无偏．
