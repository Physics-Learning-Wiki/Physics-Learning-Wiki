type: numeric
stem: 四次独立正态读数为 10.0、10.2、9.8、10.0 mm，总体标准差未知．给定双侧 95% 临界值 t(0.975,3)=3.18245，求均值置信区间的半宽，单位 mm，至少保留三位有效数字．
answer:
  value: 0.25984565
  tolerance:
    type: absolute
    value: 0.0002
  unit:
    required: true
    canonical: mm
    accepted:
    - mm
solution: 平均值 10.0 mm，残差平方和 0.08 mm²，s=√(0.08/3) mm，均值标准差估计为 s/2≈0.0816497 mm；半宽 3.18245×0.0816497≈0.259846 mm．该区间只含所建模的重复性．
feedback:
  correct: 用样本标准差 $s=\sqrt{0.08/3}\,\mathrm{mm}$ 求均值标准差估计 $s/2$，再乘给定的临界值．
  incorrect: 区间半宽为 $t s/\sqrt{n}$；注意先用 $n-1$ 计算样本方差，再将标准差除以 $\sqrt{n}=2$，并填写单位 mm．
