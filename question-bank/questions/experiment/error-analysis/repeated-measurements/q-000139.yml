stem: Peters、极差和最大误差法能否统一赋 n−1 自由度？
reference_answer: 不能；须定义估计量、中心和分布，评估相对波动或相应抽样分布．
solution: '给 Peters 正态系数√(π/2)，极差依赖 d2(n)；最大样本残差不同于先验允差，等效自由度不是普遍精确卡方自由度．


  关键算式：


  $$

  s_P=\sqrt{\pi/2}\frac{\sum_i|x_i-\bar x|}{\sqrt{n(n-1)}},\quad s_R=R/d_2(n)

  $$

  '
