stem: 哪些信息支持使用 s/√n 评定均值的重复性分量？假设各次观测方差相同．
choices:
- id: A
  content: 观测独立且条件稳定
- id: B
  content: 描述对象确为观测均值
- id: C
  content: 存在未处理线性漂移
- id: D
  content: 共同校准也按次数平均
answer:
  choices:
  - A
  - B
solution: 均值、独立与稳定是相应模型条件；漂移需另建模，共同校准不随次数降低．
hints:
- 分别检查所求量、各观测的方差和相关性．
feedback:
  correct: 均值、独立与稳定是相应模型条件；漂移需另建模，共同校准不随次数降低．
  incorrect: 分别判断独立性、稳定性、所求量和共同校准的影响．
  choices:
    A: 独立且稳定支持方差相加；还需相同单次方差或适合的模型．
    B: s/√n 描述均值的重复性尺度；s 本身描述单次观测散布．
    C: 线性漂移破坏共同稳定均值模型，应先调查或建模．
    D: 共同校准项在每次读数中相同，平均后仍保留．
