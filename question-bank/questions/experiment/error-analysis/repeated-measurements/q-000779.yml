type: free_response
stem: 设观测相互独立同分布，均值 μ、有限方差 σ² 均未知．推导残差平方和期望，并说明为何样本方差除以 n−1；你的推导是否表明样本标准差无偏？
reference_answer: 将偏离总体均值的平方和分解为残差平方和与 n 倍均值偏差平方；取期望得 (n−1)σ²，故 s² 无偏，而 s 不一般无偏．
solution: 利用 Σ(Xᵢ−μ)²=Σ(Xᵢ−X̄)²+n(X̄−μ)²，残差和为零消去交叉项．独立同方差给 Var(X̄)=σ²/n，取期望后得到 E[Σ(Xᵢ−X̄)²]=(n−1)σ²．因此 s²=Σ(Xᵢ−X̄)²/(n−1)
  是 σ² 的无偏估计．平方根是非线性运算，不能由此断言 s 对 σ 无偏．
feedback:
  correct: 请对照自评标准检查：偏离总体均值的平方和期望为 $n\sigma^2$，均值偏差平方的 $n$ 倍的期望为 $\sigma^2$；方差无偏不能直接推出标准差无偏．
  incorrect: 请对照自评标准补充平方和分解及两项期望，注意残差和为零消去交叉项，并区分样本方差与样本标准差的无偏性．
