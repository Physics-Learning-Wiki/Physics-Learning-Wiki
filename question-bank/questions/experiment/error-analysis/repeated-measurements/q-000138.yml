stem: 推导 Var(平均值)=σ²/n，并说明共同校准改变什么．
reference_answer: 独立等方差时方差和除以 n²；共同项留下 u²(B)．
solution: '从一般协方差和出发；共用 B 的各观测协方差不为零，所以只有独立 E_i 的部分除以 n．


  $$

  \operatorname{Var}(\bar X)=u^2(B)+\sigma_E^2/n

  $$

  '
