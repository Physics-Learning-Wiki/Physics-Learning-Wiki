choice_order: fixed
type: free_response
stem: 四个相互独立、来自同一稳定分布的组均值为 10.0、10.2、9.8、10.0 mm，求组均值的总平均值标准不确定度．
reference_answer: 总均值 10.0 mm，组间 s=0.163299 mm，均值 u=0.0816497 mm，自由度 3．
solution: 组均值的总平均为 10.0 mm，残差平方和为 0.08 mm²；除以 3 后开方，再除以 √4，得均值标准不确定度约 0.0816497 mm．组内与组间来源应按模型处理，避免重复计入；只有独立同单次方差等条件成立时，次数不同的组才可按次数加权．
response:
  format: plain_text
  required: true
  min_chars: 1
  max_chars: 12000
  rows: 6
  placeholder: 写出模型、假设、关键计算及结果解释．
grading:
  mode: self_assessed
  rubric:
  - id: incomplete
    label: 未得到正确中心或误将单组标准差直接当总平均值标准差．
    points: 0
  - id: partial
    label: 求出均值及平方和，但漏掉 n−1、√4 或组均值相容条件．
    points: 0.5
  - id: complete
    label: 算出均值 10.0 mm、平方和 0.08 mm²、s=0.1633 mm、u=0.08165 mm，并说明组均值独立同分布和自由度 3．
    points: 1
hints:
- 先计算组均值的样本标准差，再对四组平均．
feedback:
  correct: 算出均值 10.0 mm、平方和 0.08 mm²、s=0.1633 mm、u=0.08165 mm，并说明组均值独立同分布和自由度 3．
  incorrect: 求出均值及平方和，但漏掉 n−1、√4 或组均值相容条件．
