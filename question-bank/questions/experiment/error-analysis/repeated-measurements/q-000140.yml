stem: 四个独立等精度组均值为 10.0、10.2、9.8、10.0 mm，求组间总均值标准不确定度．
reference_answer: 总均值 10.0 mm，组间 s=0.163299 mm，均值 u=0.0816497 mm，自由度 3．
solution: '平方和为 0.08；除以 3 后开方，再除以 √4．说明组内与组间来源不可重复计入；次数不同可转加权模型．


  关键算式：


  $$

  u(\bar x)=\sqrt{0.08/(3\cdot4)}=0.0816497\ldots\,\mathrm{mm}

  $$

  '
