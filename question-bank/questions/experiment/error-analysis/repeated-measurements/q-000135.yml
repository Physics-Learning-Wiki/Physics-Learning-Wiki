stem: 独立同条件观测 n=16，样本标准差 0.08 s，均值标准不确定度多少 s？
answer:
  value: 0.02
  tolerance:
    type: absolute
    value: 4.000000000000001e-06
  unit:
    required: true
    canonical: s
    accepted:
    - s
solution: 0.08/√16=0.02 s，只是均值重复性分量．
hints:
- 先求 √16，再判断结果描述单次还是均值．
feedback:
  correct: 0.08/√16=0.02 s，只是均值重复性分量．
  incorrect: 用单次样本标准差除以 √16，结果只代表均值重复性分量．
