type: numeric
stem: 四次独立读数为 10.0、10.2、9.8、10.0 mm．求样本标准差 s，单位 mm，至少保留三位有效数字．
answer:
  value: 0.163299316
  tolerance:
    type: absolute
    value: 0.0005001
  unit:
    required: true
    canonical: mm
    accepted:
    - mm
solution: 平均值为 10.0 mm，残差平方和为 0.08 mm²；样本方差为 0.08/3 mm²，所以 s≈0.163299 mm．
feedback:
  correct: 残差平方和为 $0.08\,\mathrm{mm}^2$，除以自由度 3 后开平方得到样本标准差，取三位有效数字为 $0.163\,\mathrm{mm}$．
  incorrect: 先求平均值和残差平方和；样本方差应除以 $n-1=3$，再开平方并填写单位 mm．
