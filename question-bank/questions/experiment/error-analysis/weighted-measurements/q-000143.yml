type: single_choice
stem: 只知道相对权时，哪一量还须从残差估计？
choices:
- id: A
  content: 共同的单位权方差尺度
- id: B
  content: 每个结果的物理单位
- id: C
  content: 被测对象必须改变的幅度
answer:
  choice: A
solution: 相对权确定方差比例，绝对共同尺度仍未知；需有正残差自由度．
hints:
- 权取独立方差倒数；先分清已知绝对尺度、相对权和共同校准．
feedback:
  correct: 相对权确定方差比例，绝对共同尺度仍未知；需有正残差自由度．
  incorrect: 相对权决定方差比例，但不确定共同的绝对尺度．
  choices:
    A: 相对权只决定方差比例，仍须估计单位权方差的共同尺度．
    B: 物理单位由量值和模型确定，与残差估计单位权方差不同．
    C: 合并同一被测量时不要求对象改变；变化还可能破坏共同均值假设．
