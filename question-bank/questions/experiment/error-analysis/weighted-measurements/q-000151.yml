stem: 怎样从独立正态似然得到同样的加权平均？
reference_answer: 对联合密度取对数并对共同均值求导为零．
solution: '对数似然的均值相关部分为 -Σ(x_i−μ)²/(2u_i²)；零导数得权均值，说明这不是参数的概率密度．


  关键算式：


  $$

  \frac{\partial\log L}{\partial\mu}=\sum_i(x_i-\mu)/u_i^2=0

  $$

  '
