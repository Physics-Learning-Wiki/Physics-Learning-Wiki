stem: 怎样从独立正态似然得到同样的加权平均？
reference_answer: 对联合密度取对数并对共同均值求导为零．
solution: 独立正态观测的联合似然是各正态密度之积，已知方差时，与 μ 有关的对数似然为 −Σ(xᵢ−μ)²/(2uᵢ²) 加常数．对 μ 求导得 Σ(xᵢ−μ)/uᵢ²；令其为零并整理，μ 的估计为 Σ(xᵢ/uᵢ²)/Σ(1/uᵢ²)．二阶导数为
  −Σ1/uᵢ²<0，故为极大值．似然是观测数据给定后关于参数的函数，不是参数概率密度．
