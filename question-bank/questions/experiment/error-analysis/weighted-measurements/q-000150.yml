stem: 在约束权系数和为一的条件下推导逆方差加权．
reference_answer: 最小化 Σa_i²u_i²，用乘子得 a_i∝1/u_i²．
solution: '说明无偏约束、独立和已知方差；归一后方差为 1/Σ1/u_i²，正态性并非线性最小方差推导的必要条件．


  关键算式：


  $$

  \min_{\sum a_i=1}\sum_i a_i^2u_i^2,\quad a_i=\frac{u_i^{-2}}{\sum_j u_j^{-2}}

  $$

  '
