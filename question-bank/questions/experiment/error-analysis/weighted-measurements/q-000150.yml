stem: 在约束权系数和为一的条件下推导逆方差加权．
reference_answer: 最小化 Σa_i²u_i²，用乘子得 a_i∝1/u_i²．
solution: 设独立无偏观测的正方差为 uᵢ²，线性估计为 ΣaᵢXᵢ．无偏性要求 Σaᵢ=1，方差为 Σaᵢ²uᵢ²．构造 F=Σaᵢ²uᵢ²−λ(Σaᵢ−1)，对各 aᵢ 求导得 2aᵢuᵢ²=λ，故 aᵢ 与 1/uᵢ²
  成正比．利用系数和为一归一化，得到 aᵢ=uᵢ⁻²/Σⱼuⱼ⁻²，合并方差为 1/Σⱼuⱼ⁻²．此线性最小方差推导不要求正态．
