stem: 独立噪声合并后 u=0.06 mm，另有所有观测共用的独立校准 u=0.08 mm．最终 u 多少 mm？
answer:
  value: 0.1
  tolerance:
    type: absolute
    value: 2.0e-05
  unit:
    required: true
    canonical: mm
    accepted:
    - mm
solution: 共同项不平均掉，√(0.06²+0.08²)=0.10 mm．
hints:
- 权取独立方差倒数；先分清已知绝对尺度、相对权和共同校准．
feedback:
