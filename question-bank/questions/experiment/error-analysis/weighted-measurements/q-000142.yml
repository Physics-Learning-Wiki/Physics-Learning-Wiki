type: single_choice
stem: 已知独立结果标准不确定度之比为 1:2，逆方差权重比为何？
choices:
- id: A
  content: '4:1'
- id: B
  content: '2:1'
- id: C
  content: '1:2'
answer:
  choice: A
solution: 权重与方差倒数成比例，所以标准差扩大二倍，权重缩为四分之一．
hints:
- 权取独立方差倒数；先分清已知绝对尺度、相对权和共同校准．
feedback:
  correct: 权重与方差倒数成比例，所以标准差扩大二倍，权重缩为四分之一．
  incorrect: 先平方标准不确定度之比，再取方差之比的倒数．
  choices:
    A: 标准不确定度比 1:2，对应方差比 1:4，逆方差权比 4:1．
    B: 2:1 是标准差倒数之比；权用方差倒数．
    C: 较大标准不确定度对应较小权，而非较大权．
