  rubric:
  - id: incomplete
    label: 忽略协方差而直接写独立情形，或未说明合并权．
    points: 0
  - id: partial
    label: 给出矩阵权重公式，但遗漏正定条件、方差或非对角项意义．
    points: 0.5
  - id: complete
    label: 在正定协方差矩阵下写出 1ᵀΣ⁻¹x/(1ᵀΣ⁻¹1) 及方差倒数，解释共同来源产生非零协方差和忽略它的影响．
    points: 1
