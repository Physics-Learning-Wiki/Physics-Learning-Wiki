stem: 已知一般协方差矩阵 Σ 时怎样写合并结果？为何不能忽略非对角项？
reference_answer: μhat=(1ᵀΣ⁻¹x)/(1ᵀΣ⁻¹1)，方差为该分母倒数．
solution: 对正定协方差矩阵 Σ，最小化 aᵀΣa 并约束 1ᵀa=1，可得 a=Σ⁻¹1/(1ᵀΣ⁻¹1)，因此合并估计为 1ᵀΣ⁻¹x/(1ᵀΣ⁻¹1)，方差为 1/(1ᵀΣ⁻¹1)．非对角元描述不同结果的协方差；共同校准可造成正相关，忽略它会低估该贡献．相关性也可能为负，影响方向应按具体模型判断．
