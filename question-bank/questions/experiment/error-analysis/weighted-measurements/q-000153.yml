stem: 已知一般协方差矩阵 Σ 时怎样写合并结果？为何不能忽略非对角项？
reference_answer: μhat=(1ᵀΣ⁻¹x)/(1ᵀΣ⁻¹1)，方差为该分母倒数．
solution: '从约束最小方差得公式；共同偏差导致非零协方差，忽略会虚增独立信息，需检查正定与物理来源．


  关键算式：


  $$

  \hat\mu=\frac{\boldsymbol1^T\Sigma^{-1}\boldsymbol x}{\boldsymbol1^T\Sigma^{-1}\boldsymbol1}

  $$

  '
