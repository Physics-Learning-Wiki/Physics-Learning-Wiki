stem: 推导天平交换法消除不等臂因子，并说明失效条件．
reference_answer: 设被测质量为 m、两臂长为 l₁、l₂．第一次平衡满足 ml₁=P₁l₂，交换后满足 ml₂=P₂l₁．两式相乘得 m²l₁l₂=P₁P₂l₁l₂，因此 m=√(P₁P₂)．这依赖两次臂长关系和零点稳定；交换引入新偏差或漂移时会留下误差．
solution: 设被测质量为 m、两臂长为 l₁、l₂．第一次平衡满足 ml₁=P₁l₂，交换后满足 ml₂=P₂l₁．两式相乘得 m²l₁l₂=P₁P₂l₁l₂，因此 m=√(P₁P₂)．这依赖两次臂长关系和零点稳定；交换引入新偏差或漂移时会留下误差．
