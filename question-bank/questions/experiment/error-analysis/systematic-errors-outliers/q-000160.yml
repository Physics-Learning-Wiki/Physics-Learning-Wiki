stem: 两独立结果 10.00、10.10 mm，标准不确定度 0.02、0.03 mm．差值的标准不确定度多少 mm？（结果至少保留三位有效数字）．
answer:
  value: 0.03605551275463989
  tolerance:
    type: absolute
    value: 5.001e-05
  unit:
    required: true
    canonical: mm
    accepted:
    - mm
solution: 独立结果相减时方差相加：u=√(0.02²+0.03²)=√0.0013≈0.0360555 mm．覆盖解释还需分布与自由度．
