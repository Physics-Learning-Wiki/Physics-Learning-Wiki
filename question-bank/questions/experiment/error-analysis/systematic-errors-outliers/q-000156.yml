type: multiple_choice
stem: 哪些措施依赖正确的对消模型？
choices:
- id: A
  content: 交换天平两臂载荷
- id: B
  content: 相隔半周期配对
- id: C
  content: 不论漂移多大直接增加次数
- id: D
  content: 把同一个读数当十次观测
answer:
  choices:
  - A
  - B
solution: 交换和半周期方案均要稳定性与符号/相位条件；伪重复或盲目平均不提供这种对消．
hints:
- 先按顺序和物理来源检查，传统诊断量本身没有自动的显著性水平．
feedback:
  correct: 核对每项涉及的模型和条件，见各选项反馈．
  incorrect: 请逐项检查因果关系与适用前提，见各选项反馈．
  choices:
    A: 交换载荷利用两次平衡方程消去臂长比，依赖条件稳定．
    B: 半周期对消依赖周期、相位与幅度条件．
    C: 增加次数不能保证消除共同漂移．
    D: 重复记录同一读数不会提供独立信息．
