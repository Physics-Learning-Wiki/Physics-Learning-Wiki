stem: 两个实验室结果不同，选择 t、F 或秩和检验时应说明什么？
reference_answer: 先明确检验对象：t 类方法关注均值差，F 方法针对方差比且经典形式依赖正态，秩和检验比较秩或分布位置，不能无条件解释为中位数差．再说明两组是否独立或配对、样本量、模型和显著性水平；配对数据应分析配对差．结果差异本身不证明哪台仪器有故障．
solution: 先明确检验对象：t 类方法关注均值差，F 方法针对方差比且经典形式依赖正态，秩和检验比较秩或分布位置，不能无条件解释为中位数差．再说明两组是否独立或配对、样本量、模型和显著性水平；配对数据应分析配对差．结果差异本身不证明哪台仪器有故障．
