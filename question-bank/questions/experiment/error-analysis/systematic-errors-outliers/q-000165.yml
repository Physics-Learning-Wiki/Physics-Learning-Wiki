stem: 两个实验室结果不同，选择 t、F 或秩和检验时应说明什么？
reference_answer: 均值、方差、分布位置的检验对象不同，先说明假设和采样关系．
solution: '独立组均值可用 Welch；F 精确模型要求正态；配对应分析差值，秩和一般不是无条件中位数检验；差异不自动等于仪器故障．


  关键算式：


  $$

  T=\frac{\bar x_1-\bar x_2}{\sqrt{s_1^2/n_1+s_2^2/n_2}}

  $$

  '
