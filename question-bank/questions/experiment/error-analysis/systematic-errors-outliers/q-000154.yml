answer:
  choice: A
solution: 该量无自带显著性水平，需结合预先分组检验、环境和顺序图．
hints:
- 先按顺序和物理来源检查，传统诊断量本身没有自动的显著性水平．
feedback:
  correct: 核对每项涉及的模型和条件，见各选项反馈．
  incorrect: 请逐项检查因果关系与适用前提，见各选项反馈．
  choices:
    A: 前后半列残差和差对应两段均值差，可作为变化线索．
    B: 两段均值差不能区分周期、趋势和其他原因．
    C: 没有指定检验分布和阈值，不能据此声称 95% 显著．
