stem: 推导半周期法并给一个不能消掉的成分．
reference_answer: 设周期偏移为 b(φ)=a sinφ．相隔半周期时 b(φ+π)=−a sinφ，因此两次平均中这项为零．若还有常数 b₀ 或偶次谐波 a₂sin(2φ)，半周期后它们不变，平均仍保留；相位或幅度变化也会留下残余．
solution: 设周期偏移为 b(φ)=a sinφ．相隔半周期时 b(φ+π)=−a sinφ，因此两次平均中这项为零．若还有常数 b₀ 或偶次谐波 a₂sin(2φ)，半周期后它们不变，平均仍保留；相位或幅度变化也会留下残余．
