stem: 量具示值 15.08 mm，零点偏差 +0.03 mm．按读数减偏差模型，修正长度为多少 mm？
answer:
  value: 15.05
  tolerance:
    type: absolute
    value: 0.001
  unit:
    required: true
    canonical: mm
    accepted:
    - mm
solution: 修正值为 -0.03 mm，故 15.08-0.03=15.05 mm．
