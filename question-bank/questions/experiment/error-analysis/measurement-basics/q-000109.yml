choice_order: fixed
type: free_response
stem: 定义非标准温度下铜棒长度的测量对象时，应交代哪些条件？说明为何模型中需要温度修正．
reference_answer: 交代温度、端点、受力与目标温度；长度会随温度变化，须在膨胀模型下修正并评定输入的不确定度．
solution: 明确铜棒两端、温度和机械载荷．非目标温度下的长度不同于目标温度下的长度；应给出热膨胀模型及温度、膨胀系数的不确定度，再判断近似是否适用．
response:
  format: plain_text
  required: true
  min_chars: 1
  max_chars: 12000
  rows: 6
  placeholder: 写出模型、假设、关键计算及结果解释．
grading:
  mode: self_assessed
  rubric:
  - id: incomplete
    label: 未定义被测量，或把温度引起的真实长度变化直接当作读数误差．
    points: 0
  - id: partial
    label: 列出温度或端点，但未说明目标温度、热膨胀修正及输入不确定度．
    points: 0.5
  - id: complete
    label: 明确端点、温度和载荷，说明目标温度及热膨胀模型，并指出温度与膨胀系数的不确定度．
    points: 1
hints:
- 想想温度和受力变化时，铜棒长度是否仍是同一个被测量．
feedback:
  correct: 明确端点、温度和载荷，说明目标温度及热膨胀模型，并指出温度与膨胀系数的不确定度．
  incorrect: 列出温度或端点，但未说明目标温度、热膨胀修正及输入不确定度．
