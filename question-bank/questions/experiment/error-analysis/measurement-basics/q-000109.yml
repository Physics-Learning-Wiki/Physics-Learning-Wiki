stem: 建立非标准温度下铜棒长度的测量说明，至少交代什么？另说明单摆有限摆幅、空气阻尼和悬线质量为何属于模型检查．
reference_answer: 铜棒须交代端点、温度、受力、参考条件和修正；单摆须核查振幅、阻尼和质量分布模型．
solution: '定义不清可能把真实变化当误差．单摆有限振幅以弧度展开，首项相对周期修正为 θ0²/16；阻尼与悬线质量需按实际动力学建模，不能把修正本身当标准差，也不能用不满足条件的通用补丁．


  关键算式：


  $$

  T/T_0\approx1+\theta_0^2/16

  $$

  '
