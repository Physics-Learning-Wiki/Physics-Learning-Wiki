stem: 为什么测量误差的「绝对」不等于取绝对值？
choices:
- id: A
  content: 它按被测量单位表达，仍可带符号
- id: B
  content: 所有误差本来都非负
- id: C
  content: 相对误差才有符号
answer:
  choice: A
solution: 绝对误差为测得量值减参考值，有量纲、有符号；大小另用绝对值表示．
hints:
- 先区别集中、整体偏移和基于信息的分散性；写出参考值与修正符号．
feedback:
  correct: 绝对误差为测得量值减参考值，有量纲、有符号；大小另用绝对值表示．
  incorrect: 先保留测得值减参考值的正负号，再区分差值与绝对值．
  choices:
    A: 这里绝对指以被测量单位表达；相减的结果可以有正负．
    B: 误差是有符号的差；只有误差的绝对值总是非负．
    C: 绝对误差与相对误差都可以有符号，相对误差是除以参考值后的比值．
