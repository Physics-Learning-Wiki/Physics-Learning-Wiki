stem: 温度短时固定偏高、缓慢上升、无规则变化，分别怎样进入测量误差模型？
reference_answer: 可分别表现为共同偏移、漂移和随机散布．
solution: 固定偏高若在整组测量期间近似不变，可表现为共同偏移；缓慢上升可形成时间漂移；无规则变化可能增加随机散布．分类依赖测量条件和时间尺度；可估计的显著效应应修正并评定修正量不确定度．
