stem: 五次称量几乎相同，却比标准器量值整体高 0.2 g．直接支持哪一判断？
choices:
- id: A
  content: 重复性好，但存在共同偏移线索
- id: B
  content: 准确度必定很高
- id: C
  content: 平均后偏移必定消失
answer:
  choice: A
solution: 集中反映分散小；与参考整体偏离提示共同效应，需要核查参考不确定度和修正模型．
hints:
- 先区别集中、整体偏移和基于信息的分散性；写出参考值与修正符号．
feedback:
  correct: 集中反映分散小；与参考整体偏离提示共同效应，需要核查参考不确定度和修正模型．
  incorrect: 比较数据内部的集中程度与相对标准器的整体偏移．
  choices:
    A: 集中反映重复性好；相对标准器的整体偏移是共同效应线索，还需考虑标准器不确定度．
    B: 集中程度不能单独说明与真值接近，也不能证明准确度高．
    C: 共同偏移在每次观测中相同，取平均不会自动消除．
