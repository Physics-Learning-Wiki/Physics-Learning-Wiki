stem: 不同教材对「准确度、精确度」的使用可能不同，怎样避免概念混淆？
reference_answer: 先对应英文术语和所指性质，再使用本章正确度、精密度、准确度约定．
solution: trueness 关注系统偏移，precision 关注重复分散，accuracy 是接近真值的定性概念；不能只按中文名称互换或给准确度直接赋标准差．
