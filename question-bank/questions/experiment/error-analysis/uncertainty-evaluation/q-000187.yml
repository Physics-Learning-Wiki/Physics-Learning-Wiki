stem: 独立输出贡献为 0.03 mm（ν=9）和 0.04 mm（ν=8）．求有效自由度及近似 95% 扩展不确定度，并说明条件．
reference_answer: $u_c=0.05\,\mathrm{mm}$、$\nu_{\rm eff}\approx15.243902$；在题解所述近似条件下，$k\approx2.12848$，$U\approx0.106424\,\mathrm{mm}$．
solution: '两个输出贡献相互独立，先求合成标准不确定度：


  $$

  u_c=\sqrt{0.03^2+0.04^2}=0.05\,\mathrm{mm}.

  $$


  再使用 Welch–Satterthwaite 近似：


  $$

  \nu_{\rm eff}=\frac{0.05^4}{0.03^4/9+0.04^4/8}=15.243902\ldots.

  $$


  若输出分布和自由度近似支持双侧 t 包含因子，则


  $$

  k\approx t_{0.975,15.243902}=2.12848,\qquad U=ku_c\approx0.106424\,\mathrm{mm}.

  $$


  扩展不确定度可约报 $0.11\,\mathrm{mm}$．覆盖解释依赖模型，不能把近似当成精确结论．'
