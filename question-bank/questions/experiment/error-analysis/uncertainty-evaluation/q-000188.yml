stem: 证书和重复性都包含显示量化时怎样避免重复预算？
reference_answer: 先查证书说明：证书给出的校准不确定度是否已经包含显示量化；再查重复测量和所采用的读数模型是否也把同一量化影响计入．按实际模型保留一次并记录理由；若两项只部分重叠，须拆分或建相关模型，不能按 A/B 标签机械相加．
solution: 先查证书说明：证书给出的校准不确定度是否已经包含显示量化；再查重复测量和所采用的读数模型是否也把同一量化影响计入．按实际模型保留一次并记录理由；若两项只部分重叠，须拆分或建相关模型，不能按 A/B 标签机械相加．
