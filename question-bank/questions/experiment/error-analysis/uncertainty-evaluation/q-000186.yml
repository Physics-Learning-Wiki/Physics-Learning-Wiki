stem: 同为 ±a 范围，比较均匀、三角、反正弦和等概率两点模型．
reference_answer: 四种模型的标准不确定度分别为 $a/\sqrt{3}$、$a/\sqrt{6}$、$a/\sqrt{2}$、$a$．
solution: '同为中心对称、半宽为 $a$ 的分布，标准不确定度由二阶矩决定．均匀分布的密度为 $1/(2a)$，因此


  $$

  E(X^2)=\int_{-a}^{a}\frac{x^2}{2a}\,\mathrm dx=\frac{a^2}{3},\qquad u=\frac{a}{\sqrt{3}}.

  $$


  对称三角分布的密度为 $(a-|x|)/a^2$，其二阶矩为 $a^2/6$．均匀相位的正弦项 $X=a\sin\phi$ 给出 $E(X^2)=a^2/2$；在端点 $\pm a$ 等概率取值时，$E(X^2)=a^2$．这三种情形的标准不确定度依次为


  $$

  \frac{a}{\sqrt{6}},\qquad \frac{a}{\sqrt{2}},\qquad a.

  $$


  选择哪种模型应由物理信息支持．'
