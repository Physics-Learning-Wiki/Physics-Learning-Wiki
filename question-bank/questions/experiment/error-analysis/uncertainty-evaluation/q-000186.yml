stem: 同为 ±a 范围，比较均匀、三角、反正弦和等概率两点模型．
reference_answer: 标准差分别 a/√3、a/√6、a/√2、a．
solution: '说明均匀为区间等密度，三角可来自独立均匀和，反正弦来自均匀相位，两点为离散端点；不是自由择小的规则．


  关键算式：


  $$

  u_{\rm uniform}=a/\sqrt3,\quad u_{\rm triangular}=a/\sqrt6,\quad u_{\rm arcsine}=a/\sqrt2,\quad u_{\rm
  two-point}=a

  $$

  '
