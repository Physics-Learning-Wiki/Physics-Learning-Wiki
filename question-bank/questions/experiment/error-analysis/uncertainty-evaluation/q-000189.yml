solution: '当前均值的除数来自当前次数，尺度自由度来自历史估计；不能把资料带来的不可靠度或漂移隐藏为零．


  关键算式：


  $$

  u(\bar x_{\rm new})=s_{\rm hist}/\sqrt{n_{\rm new}}

  $$

