stem: 历史 s 用于当前均值，怎样判断评定可靠度和自由度？
reference_answer: 核对历史数据与当前测量的仪器、量程、环境和稳定性是否相容．若历史标准差 sₕᵢₛₜ 能代表当前单次观测，且当前 n 次独立同方差，则当前均值分量 u=sₕᵢₛₜ/√n．尺度的自由度来自历史样本和估计方法；例如历史
  20 次独立正态观测用样本标准差时为 19，而不是当前 n−1．
solution: 核对历史数据与当前测量的仪器、量程、环境和稳定性是否相容．若历史标准差 sₕᵢₛₜ 能代表当前单次观测，且当前 n 次独立同方差，则当前均值分量 u=sₕᵢₛₜ/√n．尺度的自由度来自历史样本和估计方法；例如历史 20 次独立正态观测用样本标准差时为
