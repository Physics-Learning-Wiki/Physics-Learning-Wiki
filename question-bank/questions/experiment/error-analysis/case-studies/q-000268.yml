stem: 读真实万有引力实验 ppm 预算时怎样区分修正与不确定度贡献？
reference_answer: 修正带符号进入估计，标准不确定度描述剩余信息分散．
solution: '核查列单位、标准/扩展形式、方法和共享来源；总项与细项不能重复加，读真实论文并保留方法范围，不能将示意数据称为实测．


  关键算式：


  $$

  1\,\mathrm{ppm}=10^{-6}

  $$

  '
