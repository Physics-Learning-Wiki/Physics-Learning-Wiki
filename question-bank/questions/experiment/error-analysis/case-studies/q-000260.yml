stem: 完整测量报告应包括什么？
choices:
- id: A
  content: 模型、原始数据和修正信息
- id: B
  content: 输入分布、相关性、预算与限制
- id: C
  content: 只给最终小数点后十位
- id: D
  content: 以接近课本值替代不确定度
answer:
  choices:
  - A
  - B
solution: 可复算报告必须说明值如何从观测与信息产生，不能用位数或巧合接近参考替代评定．
hints:
- 把原始数据、修正、输入预算、计算与报告连成链，检查共同来源和单位．
