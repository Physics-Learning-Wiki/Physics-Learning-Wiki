solution: '给六个偏导，先修正再传播；嵌套模型应保留共享温标和材料来源相关性，不能任加一个温度安全余量．


  关键算式：


  $$

  l=l_s+\Delta l-l_s(\Delta t\,\delta\alpha+\alpha_s\delta t)

  $$

  '
