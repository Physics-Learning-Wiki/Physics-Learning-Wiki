stem: '考虑静态球对称度规


  $$

  \mathrm{d}s^2=-e^{\nu(r)}\,\mathrm{d}t^2+e^{a(r)}\,\mathrm{d}r^2

  +r^2\left(\mathrm{d}\theta^2+\sin^2\theta\,\mathrm{d}\varphi^2\right).

  $$


  1. 求所有独立非零的 Christoffel 符号。

  2. 求 Ricci 张量的非零分量；已知 $R_{\varphi\varphi}=\sin^2\theta\,R_{\theta\theta}$。

  3. 取


  $$

  e^{\nu(r)}=e^{-a(r)}=1-\frac{2M}{r},

  $$


  验证 $R_{\mu\nu}=0$（$r>2M$）。

  '
