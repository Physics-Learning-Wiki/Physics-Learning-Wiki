reference_answer: |
  非零联络为

  $$
  \Gamma^0{}_{ij}=a\dot a\,\delta_{ij}=H g_{ij},
  \qquad
  \Gamma^i{}_{0j}=\Gamma^i{}_{j0}=H\delta^i{}_j .
  $$

  $$
  R_{00}=-3\frac{\ddot a}{a},
  \qquad
  R_{ij}=\left(\frac{\ddot a}{a}+2H^2\right)g_{ij},
  \qquad
  R=6\left(\frac{\ddot a}{a}+H^2\right).
  $$

  $$
  G_{00}=3H^2,
  \qquad
  G_{ij}=-\left(2\frac{\ddot a}{a}+H^2\right)g_{ij}.
  $$

  由 00 分量得第一 Friedmann 方程，由空间分量并消去 $H^2$ 得加速度方程；守恒律给出连续性方程。
solution: |
  记 $x^0=t$，$x^i=(x,y,z)$，$a=a(t)$，并令 $\dot a=\mathrm{d}a/\mathrm{d}t$。

  度规和逆度规为

  $$
  g_{00}=-1,\qquad g_{ij}=a^2\delta_{ij},
  \qquad
  g^{00}=-1,\qquad g^{ij}=a^{-2}\delta^{ij}.
  $$

  只有时间导数非零：

  $$
  \partial_0 g_{ij}=2a\dot a\,\delta_{ij}.
  $$

  由

  $$
  \Gamma^\rho{}_{\mu\nu}
  =\frac{1}{2}g^{\rho\sigma}
  \left(\partial_\mu g_{\nu\sigma}+\partial_\nu g_{\mu\sigma}-\partial_\sigma g_{\mu\nu}\right)
  $$

  得

  $$
  \Gamma^0{}_{ij}
  =\frac{1}{2}g^{00}(-\partial_0 g_{ij})
  =a\dot a\,\delta_{ij}
  =H g_{ij},
  $$

  $$
  \Gamma^i{}_{0j}
  =\Gamma^i{}_{j0}
  =\frac{1}{2}g^{ik}\partial_0 g_{jk}
  =H\delta^i{}_j .
  $$

  其余分量为零。

  代入

  $$
  R_{\mu\nu}=\partial_\lambda\Gamma^\lambda{}_{\mu\nu}
  -\partial_\nu\Gamma^\lambda{}_{\mu\lambda}
  +\Gamma^\lambda{}_{\mu\nu}\Gamma^\sigma{}_{\lambda\sigma}
  -\Gamma^\sigma{}_{\mu\lambda}\Gamma^\lambda{}_{\nu\sigma}.
  $$

  对于 $00$ 分量，注意 $\Gamma^\lambda{}_{0\lambda}=3H$，于是

  $$
  R_{00}=-\partial_0(3H)-3H^2
  =-3\left(\dot H+H^2\right)
  =-3\frac{\ddot a}{a}.
  $$

  对于空间分量，

  $$
  R_{ij}
  =\left(\frac{\ddot a}{a}+2H^2\right)g_{ij}.
  $$

  因此 Ricci 标量为

  $$
  R=g^{00}R_{00}+g^{ij}R_{ij}
  =6\left(\frac{\ddot a}{a}+H^2\right).
  $$

  爱因斯坦张量 $G_{\mu\nu}=R_{\mu\nu}-\dfrac{1}{2}Rg_{\mu\nu}$ 给出

  $$
  G_{00}=3H^2,
  \qquad
  G_{ij}=-\left(2\frac{\ddot a}{a}+H^2\right)g_{ij}.
  $$

  取 $00$ 分量：

  $$
  G_{00}+\Lambda g_{00}=8\pi G T_{00}
  \;\Longrightarrow\;
  3H^2-\Lambda=8\pi G\rho,
  $$

  即

  $$
  H^2=\frac{8\pi G}{3}\rho+\frac{\Lambda}{3}.
  $$

  取空间分量，并利用 $T_{ij}=p g_{ij}$：

  $$
  -\left(2\frac{\ddot a}{a}+H^2\right)+\Lambda=8\pi G p .
  $$

  把第一 Friedmann 方程代入消去 $H^2$，整理得

  $$
  \frac{\ddot a}{a}
  =-\frac{4\pi G}{3}(\rho+3p)+\frac{\Lambda}{3}.
  $$

  最后推导连续性方程。对于 $u^\mu=(1,0,0,0)$，

  $$
  T^{00}=\rho,
  \qquad
  T^{ij}=p\,a^{-2}\delta^{ij}.
  $$

  由

  $$
  \nabla_\mu T^{\mu 0}
  =\partial_\mu T^{\mu 0}
  +\Gamma^\mu{}_{\mu\lambda}T^{\lambda 0}
  +\Gamma^0{}_{\mu\lambda}T^{\mu\lambda}
  =0 .
  $$

  逐项计算：

  $$
  \partial_\mu T^{\mu 0}=\dot\rho,
  \qquad
  \Gamma^\mu{}_{\mu 0}T^{00}=3H\rho,
  $$

  $$
  \Gamma^0{}_{ij}T^{ij}
  =(a\dot a\,\delta_{ij})\left(p\,a^{-2}\delta^{ij}\right)
  =3Hp .
  $$

  所以

  $$
  \dot\rho+3H(\rho+p)=0 .
  $$

  这就是宇宙学中的连续性（能量守恒）方程。
hints:
  - '先求 $g^{00}=-1$ 与 $g^{ij}=a^{-2}\delta^{ij}$。'
