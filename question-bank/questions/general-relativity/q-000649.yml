stem: |
  在平面极坐标 $(r,\varphi)$ 中，度规为

  $$
  \mathrm{d}s^2=\mathrm{d}r^2+r^2\,\mathrm{d}\varphi^2 .
  $$

  1. 求所有非零的 Christoffel 符号 $\Gamma^i{}_{jk}$。
  2. 采用约定

  $$
  R^i{}_{jkl}=\partial_k\Gamma^i{}_{jl}-\partial_l\Gamma^i{}_{jk}
  +\Gamma^i{}_{km}\Gamma^m{}_{jl}-\Gamma^i{}_{lm}\Gamma^m{}_{jk},
  $$

  计算唯一可能非零的独立分量 $R^r{}_{\varphi r\varphi}$，并说明黎曼张量整体为零。
  3. 既然 Christoffel 符号不为零，为什么这仍然是平直空间？
