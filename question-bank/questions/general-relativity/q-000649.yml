reference_answer: |
  非零分量为

  $$
  \Gamma^r{}_{\varphi\varphi}=-r,
  \qquad
  \Gamma^\varphi{}_{r\varphi}=\Gamma^\varphi{}_{\varphi r}=\frac{1}{r}.
  $$

  按题给约定，

  $$
  R^r{}_{\varphi r\varphi}
  =\partial_r(-r)-\partial_\varphi 0
  -(-r)\left(\frac{1}{r}\right)=0 .
  $$

  其余分量由对称性和二维情形只有这一个独立分量可知全为零。Christoffel 符号的非零只反映坐标基随位置变化；判断内禀弯曲要看黎曼张量。
solution: |
  度规及其逆为

  $$
  g_{ij}=
  \begin{pmatrix}
  1 & 0\\
  0 & r^2
  \end{pmatrix},
  \qquad
  g^{ij}=
  \begin{pmatrix}
  1 & 0\\
  0 & r^{-2}
  \end{pmatrix}.
  $$

  只有 $g_{\varphi\varphi}=r^2$ 依赖坐标，且

  $$
  \partial_r g_{\varphi\varphi}=2r,
  \qquad
  \partial_\varphi g_{\varphi\varphi}=0 .
  $$

  由

  $$
  \Gamma^i{}_{jk}=\frac{1}{2}g^{i\ell}
  \left(\partial_j g_{k\ell}+\partial_k g_{j\ell}-\partial_\ell g_{jk}\right)
  $$

  得

  $$
  \Gamma^r{}_{\varphi\varphi}
  =\frac{1}{2}g^{rr}(-\partial_r g_{\varphi\varphi})
  =-\frac{1}{2}(2r)=-r,
  $$

  $$
  \Gamma^\varphi{}_{r\varphi}
  =\frac{1}{2}g^{\varphi\varphi}\partial_r g_{\varphi\varphi}
  =\frac{1}{2}\frac{1}{r^2}(2r)=\frac{1}{r},
  $$

  并且 $\Gamma^\varphi{}_{\varphi r}=\Gamma^\varphi{}_{r\varphi}$。其余分量全为零。

  计算 $R^r{}_{\varphi r\varphi}$：

  $$
  R^r{}_{\varphi r\varphi}
  =\partial_r\Gamma^r{}_{\varphi\varphi}
  -\partial_\varphi\Gamma^r{}_{\varphi r}
  +\Gamma^r{}_{rm}\Gamma^m{}_{\varphi\varphi}
  -\Gamma^r{}_{\varphi m}\Gamma^m{}_{\varphi r}.
  $$

  第一项给出 $\partial_r(-r)=-1$，第二项为零，第三项因所有 $\Gamma^r{}_{rm}=0$ 而为零；最后一项只有 $m=\varphi$ 贡献：

  $$
  \Gamma^r{}_{\varphi\varphi}\Gamma^\varphi{}_{\varphi r}
  =(-r)\left(\frac{1}{r}\right)=-1 .
  $$

  因此

  $$
  R^r{}_{\varphi r\varphi}=-1-(-1)=0 .
  $$

  在二维空间中黎曼张量只有一个独立分量，其余分量由指标对称性得到，所以

  $$
  R^i{}_{jkl}=0 .
  $$

  Christoffel 符号不为零并不表示空间弯曲：它描述的是坐标基如何随位置变化。极坐标的基矢方向随 $\varphi$ 转动，因此即使平面是平直的，也会出现非零的联络。黎曼张量才是内禀曲率的判据。
hints:
  - '先写出 $g^{rr}=1$ 与 $g^{\varphi\varphi}=1/r^2$。'
  - '非零联络来自 $g_{\varphi\varphi}=r^2$ 对 $r$ 的导数。'
  - "二维情形的黎曼张量只有一个独立分量。"
feedback:
  correct: '正确：得到 Γ^r_{φφ}=-r、Γ^φ_{rφ}=1/r，并验证 R^r_{φrφ}=0。'
  incorrect: '请检查：非零联络来自 g_{φφ}=r^2 的导数；黎曼张量的两项应相消。'

