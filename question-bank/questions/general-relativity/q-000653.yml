reference_answer: '$$

  K(2M)=\frac{48M^2}{(2M)^6}=\frac{3}{4M^4}

  $$


  为有限值；$r\to0$ 时 $K\to\infty$。因此 $r=0$ 是曲率奇点。


  在 $(v,r,\theta,\varphi)$ 坐标中


  $$

  \mathrm{d}s^2=-\left(1-\frac{2M}{r}\right)\mathrm{d}v^2

  +2\,\mathrm{d}v\,\mathrm{d}r

  +r^2\left(\mathrm{d}\theta^2+\sin^2\theta\,\mathrm{d}\varphi^2\right).

  $$


  当 $r\to2M$ 时 $g_{vv}\to0$、$g_{vr}=1$、$g_{rr}=0$，没有 $1/f$ 型发散；配合有限的曲率标量，可知 $r=2M$ 只是坐标奇点（事件视界），而 $r=0$ 是真正的曲率奇点。

  '
solution: '先看 Kretschmann 标量。它是标量，在坐标变换下不变，因此可以用于判断内禀奇点。


  在 $r=2M$ 处，


  $$

  K(2M)=\frac{48M^2}{(2M)^6}

  =\frac{48M^2}{64M^6}

  =\frac{3}{4M^4},

  $$


  这是有限值。反之，当 $r\to0$ 时


  $$

  K=\frac{48M^2}{r^6}\longrightarrow\infty .

  $$


  所以 $r=0$ 是曲率发散的真实奇点，而 $r=2M$ 不是曲率奇点。


  现在做坐标变换。记


  $$

  f(r)=1-\frac{2M}{r},

  \qquad

  r_*=r+2M\ln\left(\frac{r}{2M}-1\right).

  $$


  对 $r$ 求导：


  $$

  \frac{\mathrm{d}r_*}{\mathrm{d}r}

  =1+\frac{2M}{r-2M}

  =\frac{1}{1-2M/r}

  =\frac{1}{f(r)} .

  $$


  因此


  $$

  \mathrm{d}v=\mathrm{d}t+\frac{\mathrm{d}r}{f(r)},

  \qquad

  \mathrm{d}t=\mathrm{d}v-\frac{\mathrm{d}r}{f(r)} .

  $$


  代入度规的时间部分：


  $$

  -f\,\mathrm{d}t^2

  =-f\left(\mathrm{d}v-\frac{\mathrm{d}r}{f}\right)^2

  =-f\,\mathrm{d}v^2+2\,\mathrm{d}v\,\mathrm{d}r-\frac{\mathrm{d}r^2}{f}.

  $$


  再加上径向项 $\mathrm{d}r^2/f$，两项恰好抵消：


  $$

  -f\,\mathrm{d}t^2+\frac{\mathrm{d}r^2}{f}

  =-f\,\mathrm{d}v^2+2\,\mathrm{d}v\,\mathrm{d}r .

  $$


  于是


  $$

  \mathrm{d}s^2

  =-\left(1-\frac{2M}{r}\right)\mathrm{d}v^2

  +2\,\mathrm{d}v\,\mathrm{d}r

  +r^2\left(\mathrm{d}\theta^2+\sin^2\theta\,\mathrm{d}\varphi^2\right).

  $$


  在新坐标中，$r=2M$ 处的度规分量为


  $$

  g_{vv}\to0,\qquad g_{vr}=1,\qquad g_{rr}=0,

  $$


  角向分量也保持有限。这里不再出现 $1/f$ 型的发散因子，因此度规在该处是正则的（至少不再因坐标选择而奇异）。


  结论：$r=2M$ 处的"发散"来自 Schwarzschild 坐标在视界处失效，是坐标奇点；$K$ 有限且存在正则坐标覆盖说明时空几何本身没有在视界处坏掉。$r=0$ 处 $K$ 发散，且不存在坐标变换能消除，是真正的曲率奇点。


  注：上面的 $r_*$ 定义适用于 $r>2M$；若要延伸到 $r<2M$，可把对数写成 $\ln|r/(2M)-1|$。

  '
hints:
- 先把 $r=2M$ 代入 $K$，注意 $(2M)^6=64M^6$。
- 求出 $\mathrm{d}r_*/\mathrm{d}r=1/f$，再算 $\mathrm{d}t$。
- 检查新度规中是否还存在 $1/f$ 因子。
