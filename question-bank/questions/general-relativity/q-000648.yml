stem: |
  用角坐标 $(\theta,\varphi)$ 参数化一个二维环面（torus），其诱导度规为

  $$
  \mathrm{d}s^2=r^2\,\mathrm{d}\theta^2+(R+r\cos\theta)^2\,\mathrm{d}\varphi^2,
  \qquad R>r>0,
  $$

  其中 $R$ 与 $r$ 是常数。

  1. 写出度规矩阵 $g_{ij}$ 与逆度规 $g^{ij}$。
  2. 设某矢量的逆变分量为 $(V^\theta,V^\varphi)$，求协变分量 $V_i$ 与标量 $V^iV_i$。
  3. 若 $V^\theta$ 与 $V^\varphi$ 都是常数，所得标量是否随 $\theta$ 改变？这与"标量的数值与坐标选择无关"矛盾吗？请解释。
