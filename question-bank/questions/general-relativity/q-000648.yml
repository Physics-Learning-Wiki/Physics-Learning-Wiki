reference_answer: |
  $$
  g_{ij}=\mathrm{diag}\left(r^2,(R+r\cos\theta)^2\right),
  \qquad
  g^{ij}=\mathrm{diag}\left(r^{-2},(R+r\cos\theta)^{-2}\right).
  $$

  $$
  V_\theta=r^2V^\theta,
  \qquad
  V_\varphi=(R+r\cos\theta)^2V^\varphi,
  $$

  $$
  V^iV_i=r^2(V^\theta)^2+(R+r\cos\theta)^2(V^\varphi)^2 .
  $$

  若 $V^\varphi\neq0$，该标量随 $\theta$ 变化。这里比较的是环面上不同点的内积：保持分量不变并不等于把一个矢量沿环面平移。标量在**同一点**的数值不随坐标改变；但标量场完全可以随位置变化。
solution: |
  从线元直接读出

  $$
  g_{\theta\theta}=r^2,
  \qquad
  g_{\varphi\varphi}=(R+r\cos\theta)^2,
  \qquad
  g_{\theta\varphi}=g_{\varphi\theta}=0 .
  $$

  因此

  $$
  g_{ij}=
  \begin{pmatrix}
  r^2 & 0\\
  0 & (R+r\cos\theta)^2
  \end{pmatrix},
  \qquad
  g^{ij}=
  \begin{pmatrix}
  r^{-2} & 0\\
  0 & (R+r\cos\theta)^{-2}
  \end{pmatrix}.
  $$

  用 $V_i=g_{ij}V^j$ 降指标：

  $$
  V_\theta=g_{\theta\theta}V^\theta=r^2V^\theta,
  \qquad
  V_\varphi=g_{\varphi\varphi}V^\varphi=(R+r\cos\theta)^2V^\varphi .
  $$

  于是

  $$
  V^iV_i=V^\theta V_\theta+V^\varphi V_\varphi
  =r^2(V^\theta)^2+(R+r\cos\theta)^2(V^\varphi)^2 .
  $$

  度规分量 $g_{\varphi\varphi}$ 显含 $\theta$。即使让两个分量在所有点都取相同的数值，标量仍会随 $\theta$ 改变，因为环面的坐标基和度规沿 $\theta$ 方向变化。

  这并不与"标量不依赖坐标"矛盾。标量在**给定点**的数值对坐标变换不变；但一个标量场当然可以逐点变化。要保持分量不变来比较不同点，相当于人为指定了一个并非平行移动的矢量场，因此看到的是度规的逐点变化，而不是坐标变换。
hints:
  - "度规矩阵是对角的，直接读线元即可。"
  - "标量是 $V^iV_i$，不是 $V^iV^j$。"
  - "区分'同一点的标量在坐标变换下不变'与'标量场随位置变化'。"
feedback:
  correct: '正确：写出环面度规与逆度规，用度规计算内积，并说明逐点变化与坐标不变性不矛盾。'
  incorrect: '请检查：度规对角元是 r^2 与 (R+r cosθ)^2；标量在一点的值不随坐标变，但标量场可随位置变。'

