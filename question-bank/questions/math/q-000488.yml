hints:
- 主峰条件是 s=sm，不是 s=0。
- 将无量纲自变量定义反解为 x。
feedback:
  correct: 正确保留了特殊函数主峰的固定偏移。
  incorrect: 不能把 Ai 自变量的零值位置误当成强度主峰。
  choices:
    A: 直接由 s=sm 反解，并满足初始峰位。
    B: 无量纲 sm 不能直接与长度相加，必须乘 x0。
    C: 移项符号错误，未满足给定的自变量定义。
    D: 这是 s=0 的位置，遗漏了主峰相对偏移。
