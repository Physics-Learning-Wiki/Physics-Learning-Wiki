stem: |-
  Chen 等（2025）利用有限能量艾里束调整传播路径，以绕过无线链路中的障碍物。 [研究来源（DOI）](https://doi.org/10.1038/s41467-025-62443-0)。

  取论文场表达式的理想零截断参考：$E(x,z)=\operatorname{Ai}(s)e^{i\Phi(x,z)}$，其中相位 $\Phi$ 为实数，

  $$s=\frac{x}{x_0}-\frac{z^2}{4k^2x_0^4},\qquad x_0>0,\ k>0.$$

  给定艾里强度的主峰位于 $s=s_m=-1.01879$，即相应的 $\operatorname{Ai}^{\prime}(s_m)=0$，而非 $s=0$。这里 $x,z,x_0$ 为长度，$k$ 为长度的倒数。

  ![理想艾里强度及主峰位置的原创计算图](asset:math-airy)

  图中文字说明：横轴是无量纲 $s$，主峰标为 $s_m$；图为理想函数计算，不是无线实验数据。主峰在 $(x,z)$ 坐标中满足哪一条曲线？
solution: |-
  实相位因子不改变强度，故主峰条件就是 $s=s_m$。把定义式乘以 $x_0$ 并解出 $x$，得到

  $$x_m(z)=x_0s_m+\frac{z^2}{4k^2x_0^3}.$$

  检查：在初始面 $z=0$，主峰已经位于负的 $x_0s_m$，并不在坐标原点；第二项具有长度单位。令自变量为零也会得到一条抛物线，但它与真正主峰轨迹相差固定的横向偏移。此比较针对理想零截断形式；有限截断时还需考虑复自变量和幅度因子。

  研究对应：Results, Airy beam generation and characterization, Eq. (1), parabolic bending discussion。教学范围：不把 s=0 曲线当作精确主峰；此题也没有分析有限截断、遮挡或学习模型的性能。

  来源：[DOI 10.1038/s41467-025-62443-0](https://doi.org/10.1038/s41467-025-62443-0)。
