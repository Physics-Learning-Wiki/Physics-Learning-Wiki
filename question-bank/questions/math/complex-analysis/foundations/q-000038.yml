stem: 考察函数 $f(z) = x^2 + y + i(y^2 - x)$，其实部为 $u(x, y) = x^2 + y$，虚部为 $v(x, y) = y^2 - x$。关于该函数在复平面上的可微性与解析性，下列结论正确的是：
choices:
- id: A
  content: 仅在直线 $y = x$ 上的各点处复可导，但在全复平面上处处不解析
- id: B
  content: 在直线 $y = x$ 上的各点处全纯解析，在其余点处不解析
- id: C
  content: 在全复平面上处处复可导，因而为整函数
- id: D
  content: 在全复平面上处处不可微、处处不解析
answer:
  choice: A
feedback:
  choices:
    A: 正确！偏导数 $u_x = 2x, u_y = 1, v_x = -1, v_y = 2y$ 处处连续，C-R 条件 $u_x = v_y \iff 2x = 2y$ 仅在直线 $y = x$ 上成立（此时 $u_y = -v_x
      = 1$ 自然成立），故仅在直线 $y=x$ 上复可导；但直线不含任何二维开邻域，直线上的点无法在邻域内处处可导，故全平面处处不解析。
    B: 错误。解析性定义要求存在开邻域（内部包含开二维圆盘）处处可导，直线 $y = x$ 的任意开邻域都必然包含非直线上的点（在这些点上不满足 C-R 方程），因此在该直线上并不解析。
    C: 错误。离开直线 $y = x$ 后 C-R 方程破坏，不可导，绝非整函数。
    D: 错误。由于一阶偏导数连续，在直线 $y = x$ 上满足 C-R 条件，由充分条件可知在直线上是严格复可微的。
  correct: 回答正确！准确把握了由 C-R 条件所确定的可微曲线集与解析开集之间的本质拓扑差异。
  incorrect: 回答错误。请求出 $u, v$ 的一阶偏导数，代入 C-R 方程求解满足条件的坐标集合，并结合解析性的开集邻域定义分析。
hints:
- 计算偏导数 $u_x = 2x, u_y = 1, v_x = -1, v_y = 2y$ 并代入 C-R 条件。
- 求解方程组 $u_x = v_y$ 与 $u_y = -v_x$ 确定可微点所在轨迹。
solution: "**解析**：\n1. **计算偏导数**：\n   实部与虚部分别为：\n   $$u(x, y) = x^2 + y, \\quad v(x, y) = y^2 - x$$\n   一阶偏导数为：\n   $$u_x\
  \ = 2x, \\quad u_y = 1$$\n   $$v_x = -1, \\quad v_y = 2y$$\n   偏导数在整个二维实平面 $\\mathbb{R}^2$ 上显然处处连续。\n\n2. **检验柯西-黎曼条件**：\n\
  \   $$\n   \\begin{cases}\n   u_x = v_y \\iff 2x = 2y \\iff y = x \\\\\n   u_y = -v_x \\iff 1 = -(-1) = 1 \\quad (\\text{恒成立})\n\
  \   \\end{cases}\n   $$\n   因为偏导数连续，且在直线 $y = x$ 上严格满足 C-R 条件，所以函数 $f(z)$ **在直线 $y = x$ 上的每一个点都复可导**。\n\n3. **判定解析性**：\n\
  \   函数的解析性要求函数在某点的某个**开邻域** $(|z - z_0| < \\varepsilon)$ 内处处可导。\n   直线 $y = x$ 是一条没有内部的一维线。对于直线上的任意一点 $z_0$，以其为圆心的任意开圆盘邻域必包含坐标\
  \ $y \\neq x$ 的点；而在这些点处不满足 C-R 方程因而不可导。\n   因此，不存在任何一个使得函数处处可导的开邻域，函数在复平面上**处处不解析**！\n   故 A 正确，B、C、D 错误。"
