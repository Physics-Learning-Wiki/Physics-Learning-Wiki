reference_answer: 无穷远点留数 $1$；有限和 $-1$；不能使用该极限捷径。
solution: 先长除得 $f(z)=z-z/(z^2+1)=z-z^{-1}+O(z^{-3})$。$1/z$ 系数为 $-1$，故无穷远点留数为 $1$，有限和为 $-1$。$zf(z)$ 含 $z^2$ 项而发散，捷径不适用。局部计算在
  $\pm i$ 处各得 $z^3/(2z)=z^2/2=-1/2$。
