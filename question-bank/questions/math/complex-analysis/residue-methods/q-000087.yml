stem: 设 $a>0$，求 $f(z)=\pi\cot(\pi z)/(z^2+a^2)$ 的全部有限奇点和留数。进一步用留数定理计算 $\sum_{n\in\mathbb Z}1/(n^2+a^2)$，说明围道积分消失的依据。
