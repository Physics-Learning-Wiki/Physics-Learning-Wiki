reference_answer: 整数 $n$ 处留数 $1/(n^2+a^2)$；$\pm ia$ 处均为 $-\pi\coth(\pi a)/(2a)$。级数和为 $\pi\coth(\pi a)/a$。
solution: 整数点是余切的单极点，其留数为 $1$，乘以解析因子给出 $1/(n^2+a^2)$。$\pm ia$ 是分母的单零点，利用 $\cot(it)=-i\coth t$，商式法给出两处留数都为 $-\pi\coth(\pi a)/(2a)$。取边界
  $\operatorname{Re}z,\operatorname{Im}z=\pm(N+1/2)$ 的正向正方形，大到包含 $\pm ia$。竖边上余切模不超过 $1$，横边上余切模不超过 $\coth[\pi(N+1/2)]$，所以统一有界。边界上
  $|z^2+a^2|\ge |z|^2-a^2\ge(N+1/2)^2-a^2$，周长为 $8(N+1/2)$，积分为 $O(1/N)$ 并趋零。留数定理给出截断整数和减去 $\pi\coth(\pi a)/a$ 趋零，故得结果。此函数有无穷多有限极点，应取有限围道再取极限，不能直接套有限奇点的全平面总和公式。
