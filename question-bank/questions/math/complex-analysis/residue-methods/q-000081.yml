reference_answer: $z_1=(\sqrt5-1)/2$ 的留数 $(\sqrt5-5)/10$，$z_2=-(\sqrt5+1)/2$ 的留数 $-(\sqrt5+5)/10$。四个积分依次为 $0,\pi i(\sqrt5-5)/5,\pi
  i(\sqrt5-5)/5,-2\pi i$。$R=|z_1|,|z_2|$ 时曲线经过极点。
solution: $Q^{\prime}(z)=-1-2z$。在 $z_1$ 处为 $-\sqrt5$，在 $z_2$ 处为 $\sqrt5$，相除得到两留数，和为 $-1$。$|z_1|\approx0.618,|z_2|\approx1.618$。半径
  $0.6$ 不包围极点，$0.7,1.6$ 只包围 $z_1$，$1.7$ 包围两点，各自乘以 $2\pi i$ 即得结果。半径恰等于任一极点的模时，路径上有奇点，普通留数定理不能直接使用。
