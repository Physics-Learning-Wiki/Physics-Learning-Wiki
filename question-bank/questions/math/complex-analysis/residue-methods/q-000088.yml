reference_answer: $\pi i$；不需要求出整个函数。
solution: 令 $f(z)=\sum_{n\ge0}a_nz^n$，并约定负指标系数为零。比较系数得 $(n-1)(n-2)a_n-a_{n-2}=0$。已知 $a_1=1$，在 $n=3$ 处得到 $2a_3-a_1=0$，即 $a_3=1/2$。$f/z^4$
  的留数正是 $a_3$，所以积分为 $2\pi i a_3=\pi i$。其他系数（如自由的 $a_2$）无需确定。
