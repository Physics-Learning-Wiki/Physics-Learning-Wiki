stem: 设整函数 $f$ 满足 $z^2f^{\prime\prime}-2zf^{\prime}+(2-z^2)f=0$ 且 $f^{\prime}(0)=1$。求逆时针积分 $\oint_{|z|=1}f(z)/z^4\,\mathrm
  dz$。是否需要先求出整个函数？
