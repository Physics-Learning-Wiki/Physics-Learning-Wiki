reference_answer: 无穷远点留数 $-3$；有限留数之和 $3$；$1,-1$ 处留数为 $2,1$。
solution: 无穷远展开为 $f(z)=3/z+1/z^2+O(z^{-3})$。无穷远点留数是 $1/z$ 系数的负值，所以为 $-3$，有限和为 $3$。局部商式法给出 $(3+1)/2=2$ 和 $(-3+1)/(-2)=1$，和为
  $3$。
