stem: 设 $a>0,m>0$，计算 $I=\int_0^{\infty}\sin(mx)/[x(x^2+a^2)]\,\mathrm dx$。用 $e^{imz}/[z(z^2+a^2)]$ 构造上半平面凹陷围道，并写出原点小圆弧贡献。
