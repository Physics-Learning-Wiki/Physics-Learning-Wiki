reference_answer: $I=\pi(1-e^{-ma})/(2a^2)$；顺时针上半小圆弧贡献 $-i\pi/a^2$。
solution: 原实被积函数在零点有有限极限 $m/a^2$，普通积分收敛；辅助复函数则在原点有单极点，留数为 $1/a^2$。从 $-\varepsilon$ 沿上半圆顺时针绕至 $\varepsilon$ 的小弧贡献为 $-i\pi/a^2$。上半平面内部唯一极点
  $ia$ 的留数是 $-e^{-ma}/(2a^2)$。负、正实轴段对称合并为 $2iI$，大圆弧由约当引理消失，故 $2iI-i\pi/a^2=-\pi i e^{-ma}/a^2$，解得所列结果。
