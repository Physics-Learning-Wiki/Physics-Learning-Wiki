reference_answer: $\operatorname{Res}(f,0)=4/3$；本性奇点。
solution: 展开 $z^2e^{2/z}=\sum_{n=0}^{\infty}(2^n/n!)z^{2-n}$。令 $2-n=-1$ 得 $n=3$，故留数为 $2^3/3!=4/3$。乘以 $z^2$ 后主部仍有无穷多项，原点仍为本性奇点。
