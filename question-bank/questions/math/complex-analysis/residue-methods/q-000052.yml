reference_answer: 留数为 $1$；不能使用有限阶极点公式。
solution: $\sin(1/z)=\sum_{n=0}^{\infty}(-1)^n z^{-(2n+1)}/(2n+1)!$。$n=0$ 给出 $1/z$，故留数为 $1$。主部有无穷多项，不存在有限的极点阶数 $m$，所以高阶极点公式不适用。
