reference_answer: 留数 $1/24$；三阶极点。
solution: $e^z-1-z=z^2/2+z^3/6+z^4/24+O(z^5)$。除以 $z^5$ 后主部为 $1/(2z^3)+1/(6z^2)+1/(24z)$，故留数 $1/24$，极点阶数三阶。不能把分子减去的常数和线性项再计入。
