reference_answer: $1$。
solution: $\cos z=1+O(z^2)$，$(1-z)^{-1}=1+z+O(z^2)$，故解析因子的乘积为 $1+z+O(z^2)$。除以 $z^2$，得到 $z^{-2}+z^{-1}+O(1)$，留数为 $1$。无需展开到二次以上。
