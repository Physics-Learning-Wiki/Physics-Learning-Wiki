reference_answer: $-i/4$。
solution: 写成 $1/[(z-i)^2(z+i)^2]$，$i$ 是二阶极点。$g(z)=(z+i)^{-2}$，故留数为 $g^{\prime}(i)=-2/(2i)^3=-i/4$。另一个因子 $z+i$ 在 $i$ 处不为零，必须保留在待求导函数里。
