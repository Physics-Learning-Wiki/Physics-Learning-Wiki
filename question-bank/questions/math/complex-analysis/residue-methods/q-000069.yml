reference_answer: $3$。
solution: $z=1$ 为三阶极点，$g(z)=z^{-2}$。$g^{\prime\prime}(z)=6z^{-4}$，所以留数为 $g^{\prime\prime}(1)/2!=6/2=3$。原点的二阶极点与 $1$ 处阶数无关。
