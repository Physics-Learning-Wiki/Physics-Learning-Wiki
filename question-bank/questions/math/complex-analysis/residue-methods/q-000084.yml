reference_answer: $\pi/e$。
solution: 考虑 $g(z)=e^{iz}/(z^2+1)^2$，上半平面指数衰减，有理因子在大圆上一致趋零，可用约当引理。$i$ 处留数为 $[ie^{iz}/(z+i)^2-2e^{iz}/(z+i)^3]_{z=i}=-i/(2e)$。复实轴积分为
  $2\pi i[-i/(2e)]=\pi/e$；取实部即得原积分，虚部也可由奇偶性验证为零。
