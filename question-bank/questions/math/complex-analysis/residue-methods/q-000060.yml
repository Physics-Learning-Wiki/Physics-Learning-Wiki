reference_answer: $z_k=e^{i(\pi/4+k\pi/2)}$，$k=0,1,2,3$；每点为一阶极点，留数为 $1/(2z_k^2)$。
solution: 分母零点满足 $z^4=-1$，得到所列四根，均非零。$Q^{\prime}(z_k)=4z_k^3\ne0$ 且 $P(z_k)=2z_k\ne0$，所以各点为一阶极点。商式法给出 $2z_k/(4z_k^3)=1/(2z_k^2)$。按
  $k$ 顺序，留数为 $-i/2,i/2,-i/2,i/2$，和为零。
