reference_answer: $1$。
solution: 写成 $P/Q=\pi\cos(\pi z)/\sin(\pi z)$。在 $n$ 处，$P(n)=\pi(-1)^n$，$Q^{\prime}(n)=\pi\cos(\pi n)=\pi(-1)^n\ne0$。二者相除为
  $1$；分母求导时必须保留链式法则的 $\pi$。
