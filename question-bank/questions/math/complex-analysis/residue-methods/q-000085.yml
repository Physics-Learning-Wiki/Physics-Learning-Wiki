stem: 设 $a\in\mathbb R\setminus\{0\}$、$p\in\mathbb R$，求 $F(p)=\int_{-\infty}^{\infty}e^{ipx}/(x^2+a^2)\,\mathrm dx$。分别说明 $p>0,p<0,p=0$
  的处理。
