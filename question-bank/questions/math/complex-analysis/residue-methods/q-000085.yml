reference_answer: $F(p)=\pi e^{-|ap|}/|a|$。
solution: 令 $b=|a|>0$。$p>0$ 时向上闭合，留数 $e^{-pb}/(2ib)$，得到 $\pi e^{-pb}/b$。$p<0$ 时向下闭合，$-ib$ 处留数 $e^{pb}/(-2ib)$；顺时针积分系数为 $-2\pi
  i$，得到 $\pi e^{pb}/b$。两种情形均由约当引理去掉大圆弧。$p=0$ 不用约当引理，直接以 $O(R^{-2})$ 的有理函数估计去掉圆弧，得到 $\pi/b$。合并为 $\pi e^{-b|p|}/b$。
