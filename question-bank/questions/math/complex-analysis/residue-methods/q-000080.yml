reference_answer: $-[\sqrt2+i(2+\sqrt2)]/8$。
solution: $Q^{\prime}(z_0)=4z_0^3\ne0$，所以留数为 $(z_0+1)/(4z_0^3)$。利用 $z_0^4=-1$ 得 $z_0^3=-1/z_0$，于是留数为 $-(z_0^2+z_0)/4=-(i+(1+i)/\sqrt2)/4=-\sqrt2/8-i(2+\sqrt2)/8$。实部和虚部都为负。
