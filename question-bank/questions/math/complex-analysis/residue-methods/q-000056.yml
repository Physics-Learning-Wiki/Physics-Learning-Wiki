reference_answer: $-1/2$。
solution: 原点为一阶极点。$zf(z)=e^z/(z-2)$ 在原点解析，极限为 $e^0/(0-2)=-1/2$。负号来自另一个分母因子，不能把 $z-2$ 写成 $2-z$。
