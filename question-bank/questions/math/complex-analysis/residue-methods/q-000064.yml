reference_answer: $-1,0,1$ 都是一阶极点，留数依次为 $1,-1,1$。
solution: $Q=z(z-1)(z+1)$，三个零点互异，分子在这三点均非零。$Q^{\prime}=3z^2-1$，故在 $\pm1$ 处留数为 $2/2=1$，原点处为 $1/(-1)=-1$。其和为 $1$，与无穷远展开的 $1/z$
  系数一致。
