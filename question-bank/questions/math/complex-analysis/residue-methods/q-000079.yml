reference_answer: 无穷远点留数 $-1$；$z=2$ 留数 $5/4$；原点留数 $-1/4$。
solution: $f(z)=z^{-1}(1+z^{-2})(1-2/z)^{-1}=z^{-1}+O(z^{-2})$，有限和为 $1$，无穷远点留数为 $-1$。$z=2$ 为单极点，留数为 $(2^2+1)/2^2=5/4$。仅有两个有限极点，故原点留数
  $1-5/4=-1/4$；也可对 $(z^2+1)/(z-2)$ 在原点求一次导数核对。
