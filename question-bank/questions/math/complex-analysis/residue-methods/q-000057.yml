reference_answer: 可去奇点；留数为 $0$；延拓值为 $-1$。
solution: 令 $w=z-\pi$，$\sin(\pi+w)=-\sin w=-w+O(w^3)$，故 $f=-1+O(w^2)$。分子的一阶零点抵消分母，主部为零，留数为零，延拓值为 $-1$。$\lim(z-\pi)f(z)=0$
  并不证明这里是单极点。
