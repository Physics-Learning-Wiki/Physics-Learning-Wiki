reference_answer: $\operatorname{Res}(f,0)=e-1$。
solution: 在该圆环内，$e^{1/z}=\sum_{n\ge0}z^{-n}/n!$，$(1-z)^{-1}=\sum_{k\ge0}z^k$。两个级数在紧子集上一致绝对收敛，可以相乘。$k-n=-1$ 即 $n=k+1$，因此留数为
  $\sum_{k\ge0}1/(k+1)!=e-1$。各个 $k$ 都有贡献，不能仅保留 $n=1$。
