reference_answer: $z=1$ 可去，留数 $0$；$z=-1$ 为一阶极点，留数 $1$。
solution: 在原定义域上约分得 $f(z)=1/(z+1)$。在 $z=1$ 可补定义 $f(1)=1/2$，留数为零；在 $z=-1$，$\lim_{z\to-1}(z+1)f(z)=1$，因此是一阶极点，留数为 $1$。
