reference_answer: $\pi/2$。
solution: 取 $f(z)=z^2/(z^2+1)^2$，在上半平面闭合。大圆上 $|f(z)|\le R^2/(R^2-1)^2$，弧长为 $\pi R$，故弧积分模至多 $\pi R^3/(R^2-1)^2\to0$。内部只有 $i$，其二阶极点留数为
  $-i/4$，因此实积分为 $2\pi i(-i/4)=\pi/2$。
