reference_answer: $e^{-a}/(2ia)$。
solution: $z^2+a^2=(z-ia)(z+ia)$，且 $ia\ne-ia$。消去 $z-ia$ 后得到 $e^{iz}/(z+ia)$，在 $ia$ 的值为 $e^{-a}/(2ia)$。指数因子中的 $i^2=-1$ 给出衰减符号。
