reference_answer: 各点留数均为 $1$。
solution: $e^{z_n}=1$，且分母导数 $e^{z_n}=1\ne0$，故每点为一阶极点。分子是常数 $1$，商式法得到留数 $1$。奇点虽然无限多个，但在有限平面中没有聚点，每个点都可以单独求留数。
