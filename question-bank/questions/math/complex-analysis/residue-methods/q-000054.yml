reference_answer: 本性奇点；留数为 $1$。
solution: $\cos(1/z)/z=\sum_{n\ge0}(-1)^n z^{-(2n+1)}/(2n)!$。主部无穷，原点为本性奇点。$n=0$ 的系数为 $1$，就是留数。不要把 $\cos(1/z)$ 本身的零留数直接用于乘积。
