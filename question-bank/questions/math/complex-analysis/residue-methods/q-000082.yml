reference_answer: 逆时针为 $2\pi i$，顺时针为 $-2\pi i$。
solution: 原点虽然是本性奇点，仍是孤立奇点。洛朗展开的 $1/z$ 系数是 $1$，单位圆只包围原点，所以逆时针积分为 $2\pi i$。反向参数化使积分整体变号。留数定理不要求所有奇点都是极点。
