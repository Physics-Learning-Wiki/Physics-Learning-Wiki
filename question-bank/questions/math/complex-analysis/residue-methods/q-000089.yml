reference_answer: 不能；原点是非孤立奇点，通常的孤立奇点留数定义不适用。
solution: 当 $n\in\mathbb Z\setminus\{0\}$ 时，$z_n=1/(n\pi)$ 是分母的一阶零点（导数为 $-\cos(1/z)/z^2$，在 $z_n$ 非零），因此是极点。$z_n\to0$，任意原点去心邻域都含有其他极点，函数不在其中解析。所以不能作覆盖整个小去心圆盘的洛朗展开；原点也不能归入三种孤立奇点。本题的结论是留数定义不适用，而非留数等于零。
