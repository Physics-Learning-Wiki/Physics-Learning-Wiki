reference_answer: $ie^i/4$。
solution: $Q(i)=i^4-1=0$，$Q^{\prime}(i)=4i^3=-4i\ne0$。因 $e^i\ne0$，该点为一阶极点。留数为 $e^i/(-4i)=ie^i/4$，这里 $1/i=-i$。
