reference_answer: 本性奇点；留数为 $1$。
solution: $e^{1/z}=\sum_{n=0}^{\infty}z^{-n}/n!$ 在任意 $0<|z|<r$ 内成立。主部有无穷多项，所以原点为本性奇点；$n=1$ 对应 $z^{-1}$，其系数为 $1$。
