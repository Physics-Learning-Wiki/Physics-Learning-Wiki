reference_answer: $1/2$。
solution: 在 $|z|<1$ 内，$e^z=1+z+z^2/2+O(z^3)$，$(1+z)^{-1}=1-z+z^2+O(z^3)$。乘积的二次系数为 $1-1+1/2=1/2$。除以 $z^3$ 后它就是留数；只看 $e^z$ 的二次项虽碰巧同值，却不能省略另外两个贡献。
