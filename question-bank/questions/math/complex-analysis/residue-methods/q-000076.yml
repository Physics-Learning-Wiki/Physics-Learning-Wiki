reference_answer: 两者均为 $0$。
solution: $f(z)=z^{-4}(1+z^{-4})^{-1}=z^{-4}-z^{-8}+\cdots$，没有 $1/z$ 项，所以无穷远点留数为零，有限留数之和也为零。这里有限极点依然存在，留数和为零不能推出每个留数为零。
