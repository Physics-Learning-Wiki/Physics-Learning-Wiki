reference_answer: $-i/4$。
solution: $g(z)=z^2/(z+i)^2$，其导数为 $2z/(z+i)^2-2z^2/(z+i)^3=2iz/(z+i)^3$。代入 $z=i$ 得 $-2/(2i)^3=-i/4$。原点不在此次计算中心，不能以原点泰勒展开替代
  $i$ 附近的局部计算。
