- 二阶导数在零点等于二次项系数的两倍。
feedback:
  correct: 正确保留了径向项 u′/r 对系数的贡献。
  incorrect: 不能把二维径向方程直接当作 u″+k²u=0。
  choices:
    A: 常数项比较给出 4a1+k²=0。
    B: 二次项比较给出 16a2+k²a1=0。
    C: 每项的第一导数都含正的奇次幂，零点极限为零。
    D: 忽略了径向项会产生这个错误；正确值为 −k²/2。
