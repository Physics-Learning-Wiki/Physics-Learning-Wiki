hints:
- 令平方根为 $a+ib$，比较平方后的实部和虚部。
- 利用 $a^2+b^2=|z|$ 与差平方关系相加。
feedback:
  correct: 选择分支后，实部唯一为正值。
  incorrect: 不要把复数的实部直接开平方；先比较模及实虚部。
