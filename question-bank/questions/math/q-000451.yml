hints:
- 写出 $F=\phi\circ\omega$ 的第一次链式求导。
- 第二次求导时确认 $\omega^{\prime\prime}$ 是否为零。
feedback:
  correct: 正确区分两种自变量及一、二阶导数的缩放。
  incorrect: 从复合函数定义求导，避免把链式因子倒置。
  choices:
    A: 除以 $2i$ 等于乘以 $-i/2$。
    B: 二阶导数包含 $(2i)^2=-4$，且此处无非线性映射修正项。
    C: 把梯度的缩放方向倒置了；物理坐标扩大后梯度模减半。
    D: 由一次链式法则取模直接得到。
