hints:
- 判断收敛时必须同时包括面积权重 r。
- 平方渐近式后再做积分，不要只看点值趋于零。
feedback:
  correct: 区分了点值衰减与总积分收敛。
  incorrect: 二维径向积分包含面积权重，振幅趋零本身不足以保证有限总量。
