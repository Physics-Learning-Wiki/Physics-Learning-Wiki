reference_answer: 弧长为 $\frac{3}{2}$．
solution: '求导计算微元：


  $$

  y'' = \frac{3}{2}(1 - x^{2/3})^{1/2} \cdot \left( -\frac{2}{3}x^{-1/3} \right) = -\frac{\sqrt{1 - x^{2/3}}}{x^{1/3}}

  $$


  计算弧长微元 $\mathrm{d}s = \sqrt{1 + (y'')^2}\,\mathrm{d}x$：


  $$

  1 + (y'')^2 = 1 + \frac{1 - x^{2/3}}{x^{2/3}} = \frac{x^{2/3} + 1 - x^{2/3}}{x^{2/3}} = \frac{1}{x^{2/3}}

  $$


  故 $\mathrm{d}s = \sqrt{x^{-2/3}}\,\mathrm{d}x = x^{-1/3}\,\mathrm{d}x$．


  积分计算总弧长：


  $$

  s = \int_0^1 x^{-1/3}\,\mathrm{d}x = \left. \frac{x^{2/3}}{2/3} \right|_0^1 = \frac{3}{2}

  $$


  因此所求曲线的弧长为 $\frac{3}{2}$．'
feedback:
  correct: 正确运用弧长公式化简根式微元并积分得出 3/2．
  incorrect: 星形线第一象限方程为 $y = (1-x^{2/3})^{3/2}$，其弧长微元化简极为整齐．
