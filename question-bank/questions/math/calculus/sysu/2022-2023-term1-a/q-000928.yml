stem: '设数列 $\{x_n\}$ 满足 $x_1 = 2$，$x_{n+1} = \frac{1}{2}\left(x_n + \frac{4}{x_n}\right)$（$n = 1, 2, 3, \dots$）：


  1. 证明数列 $\{x_n\}$ 的极限存在；

  2. 求极限 $\lim_{n \to \infty} x_n$．'
