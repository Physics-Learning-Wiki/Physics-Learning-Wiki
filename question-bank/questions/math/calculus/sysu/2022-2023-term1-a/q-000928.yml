reference_answer: 数列极限存在，且 $\lim_{n \to \infty} x_n = 2$．
solution: '1. 证明极限存在：

  由于 $x_1 = 2 > 0$，由递推关系易知所有 $x_n > 0$．

  对一切 $n \ge 1$，由基本均值不等式：


  $$

  x_{n+1} = \frac{1}{2}\left( x_n + \frac{4}{x_n} \right) \ge \sqrt{x_n \cdot \frac{4}{x_n}} = 2

  $$


  故对所有 $n \ge 2$ 均有 $x_n \ge 2$（数列有下界）．

  考察相邻项差值：


  $$

  x_{n+1} - x_n = \frac{1}{2}\left( \frac{4}{x_n} - x_n \right) = \frac{4 - x_n^2}{2x_n}

  $$


  当 $n \ge 2$ 时，$x_n \ge 2$，故 $4 - x_n^2 \le 0$，从而 $x_{n+1} \le x_n$（单调递减）．

  由单调有界收敛准则，数列 $\{x_n\}$ 的极限存在．


  2. 求极限：

  设 $\lim_{n \to \infty} x_n = a$（由于 $x_n \ge 2$，必有 $a \ge 2$）．两边取极限：


  $$

  a = \frac{1}{2}\left( a + \frac{4}{a} \right) \implies 2a^2 = a^2 + 4 \implies a^2 = 4 \implies a = 2

  $$


  因此 $\lim_{n \to \infty} x_n = 2$．'
feedback:
  correct: 均值不等式求下界与单调递减性证明规范，极限求解准确．
  incorrect: 巴比伦法/牛顿迭代求根号 $\sqrt{4}$ 的典型递推序列．
