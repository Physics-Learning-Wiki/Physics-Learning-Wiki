reference_answer: 函数在 $(0,0)$ 处连续；偏导数存在且 $f_x(0,0)=0, f_y(0,0)=0$；函数在 $(0,0)$ 处可微，全微分为 $\mathrm{d}z = 0\,\mathrm{d}x + 0\,\mathrm{d}y
  = 0$．
solution: '1. 连续性：

  由于 $|\sin\frac{1}{\sqrt{x^2+y^2}}| \le 1$，有 $0 \le |f(x, y)| \le |x|^{3/2} + |y|^{3/2}$．当 $(x, y) \to (0, 0)$ 时上界趋于 0．由夹逼定理
  $\lim_{(x,y)\to(0,0)} f(x, y) = 0 = f(0, 0)$，函数在 $(0, 0)$ 处连续．


  2. 偏导数：

  $f_x(0, 0) = \lim_{x \to 0} \frac{f(x, 0) - 0}{x} = \lim_{x \to 0} \frac{|x|^{3/2} \sin(1/|x|)}{x} = \lim_{x \to 0} x^{1/2}
  \text{sgn}(x) \sin\frac{1}{|x|} = 0$．同理由对称性 $f_y(0, 0) = 0$．偏导数均存在且为 0．


  3. 可微性：

  考察全增量减线性主部比距离的极限：令 $x = r\cos\theta, y = r\sin\theta$：


  $$

  \frac{f(x, y) - [f_x(0,0)x + f_y(0,0)y]}{\sqrt{x^2+y^2}} = \frac{r^{3/2}(|\cos\theta|^{3/2} + |\sin\theta|^{3/2})\sin(1/r)}{r}
  = r^{1/2}(|\cos\theta|^{3/2} + |\sin\theta|^{3/2})\sin\frac{1}{r}

  $$


  当 $r \to 0^+$ 时，因三角有界，整个表达式绝对值 $\le 2r^{1/2} \to 0$．

  极限为 0，因此函数在 $(0, 0)$ 处可微，全微分为 $\mathrm{d}z = 0$．'
feedback:
  correct: 连续性、偏导数与全微分判定严密，放缩步骤规范完整．
  incorrect: 极坐标下剩余径向项为 $r^{1/2} \to 0$，幂次大于 1 保证了原点可微性．
