stem: '设二元函数 $f(x, y) = \begin{cases} (|x|^{3/2} + |y|^{3/2})\sin\frac{1}{\sqrt{x^2+y^2}}, & (x, y) \neq (0, 0) \\[2mm] 0,
  & (x, y) = (0, 0) \end{cases}$：


  1. 判断 $f(x, y)$ 在 $(0, 0)$ 处是否连续；

  2. 判断 $f(x, y)$ 在 $(0, 0)$ 处的偏导数是否存在？若存在，求其偏导数值；

  3. 判断 $f(x, y)$ 在 $(0, 0)$ 处是否可微？若可微，求其全微分 $\mathrm{d}z|_{(0,0)}$．'
