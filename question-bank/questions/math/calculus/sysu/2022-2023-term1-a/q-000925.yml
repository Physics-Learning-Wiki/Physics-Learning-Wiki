stem: '已知函数 $f(x) = \frac{x^3 + 4}{x^2}$：


  1. 求 $f(x)$ 的单调区间、极值点和极值；

  2. 求 $f(x)$ 的凹凸区间，并判断其有无拐点；

  3. 求 $f(x)$ 的所有渐近线方程．'
