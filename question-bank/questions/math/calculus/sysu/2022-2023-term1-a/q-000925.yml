reference_answer: 在 $(-\infty, 0)$ 和 $(2, +\infty)$ 递增，在 $(0, 2)$ 递减；极小值点 $x=2$（极小值 $3$）；全定义域为凹无拐点；垂直渐近线 $x=0$，斜渐近线 $y=x$．
solution: '函数定义域为 $(-\infty, 0) \cup (0, +\infty)$．改写 $f(x) = x + \frac{4}{x^2}$．


  1. 单调性与极值：

  $f''(x) = 1 - \frac{8}{x^3} = \frac{x^3-8}{x^3}$．令 $f''(x) = 0$ 得驻点 $x = 2$．

  - 当 $x < 0$ 时，$x^3 < 0, x^3-8 < 0$，故 $f''(x) > 0$，单调递增；

  - 当 $0 < x < 2$ 时，$x^3 > 0, x^3-8 < 0$，故 $f''(x) < 0$，单调递减；

  - 当 $x > 2$ 时，$x^3 > 0, x^3-8 > 0$，故 $f''(x) > 0$，单调递增．

  因此 $x = 2$ 为唯一极小值点，极小值为 $f(2) = 2 + 1 = 3$．


  2. 凹凸性：

  $f''''(x) = \frac{24}{x^4} > 0$（对所有 $x \neq 0$）．因此在 $(-\infty, 0)$ 和 $(0, +\infty)$ 上均为凹（Concave up），图象无拐点．


  3. 渐近线：

  $\lim_{x \to 0} f(x) = +\infty$，垂直渐近线为 $x = 0$（$y$ 轴）．

  当 $x \to \pm\infty$ 时，$f(x) - x = \frac{4}{x^2} \to 0$，斜渐近线为 $y = x$．'
feedback:
  correct: 全面准确分析函数单调性、极值、凹凸区间与渐近线．
  incorrect: 改写为 $f(x) = x + 4x^{-2}$ 求导极为简明快捷．
