reference_answer: $\lim_{x \to 0} \frac{\int_0^x (x-t)f(t)\,\mathrm{d}t}{x \int_0^x f(x-t)\,\mathrm{d}t} = \frac{1}{2}$．
solution: '首先拆开分子与分母中的变限积分：


  分子：$\int_0^x (x-t)f(t)\,\mathrm{d}t = x\int_0^x f(t)\,\mathrm{d}t - \int_0^x t f(t)\,\mathrm{d}t$．

  分母：在积分中令 $u = x - t$，则 $\mathrm{d}t = -\mathrm{d}u$，$\int_0^x f(x-t)\,\mathrm{d}t = \int_0^x f(u)\,\mathrm{d}u$．故分母为 $x\int_0^x
  f(u)\,\mathrm{d}u$．


  原式化为：


  $$

  \lim_{x \to 0} \frac{x\int_0^x f(t)\,\mathrm{d}t - \int_0^x t f(t)\,\mathrm{d}t}{x\int_0^x f(t)\,\mathrm{d}t}

  $$


  当 $x \to 0$ 时属于 $\frac{0}{0}$ 型未定式，应用洛必达法则：


  分子导数：$\left( \int_0^x f(t)\,\mathrm{d}t + x f(x) \right) - x f(x) = \int_0^x f(t)\,\mathrm{d}t$．

  分母导数：$\int_0^x f(t)\,\mathrm{d}t + x f(x)$．


  因此：


  $$

  \lim_{x \to 0} \frac{\int_0^x f(t)\,\mathrm{d}t}{\int_0^x f(t)\,\mathrm{d}t + x f(x)}

  $$


  由积分第一中值定理：$\int_0^x f(t)\,\mathrm{d}t = x f(\xi)$（$\xi$ 介于 $0$ 与 $x$ 之间）．分子分母同除以 $x$：


  $$

  \lim_{x \to 0} \frac{f(\xi)}{f(\xi) + f(x)} = \frac{f(0)}{f(0) + f(0)} = \frac{f(0)}{2f(0)} = \frac{1}{2}

  $$


  （由于 $f(0) \neq 0$，可约去 $f(0)$）．因此极限值为 $\frac{1}{2}$．'
feedback:
  correct: 换元化简卷积分母并应用洛必达法则与积分中值定理求得 1/2．
  incorrect: 对 $\int_0^x f(x-t)\,\mathrm{d}t$ 作换元 $u = x-t$ 还原为普通变上限积分是化简关键．
