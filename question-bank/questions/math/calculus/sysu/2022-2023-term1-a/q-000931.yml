stem: '设函数 $f(x)$ 连续，且 $f(0) \neq 0$，求极限：


  $$

  \lim_{x \to 0} \frac{\int_0^x (x-t)f(t)\,\mathrm{d}t}{x \int_0^x f(x-t)\,\mathrm{d}t}

  $$'
