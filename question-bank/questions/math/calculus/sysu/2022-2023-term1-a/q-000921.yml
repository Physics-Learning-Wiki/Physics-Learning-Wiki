reference_answer: $\lim_{x \to 0} \frac{5\sin x + 2x^2 \cos\frac{1}{x}}{\ln(1+2x)(1+\cos x)} = \frac{5}{4}$．
solution: '当 $x \to 0$ 时，$\ln(1+2x) \sim 2x$，$\lim_{x \to 0} (1 + \cos x) = 2$．分母等价于 $2x \cdot 2 = 4x$．


  将分子拆开逐项计算：


  $$

  \lim_{x \to 0} \frac{5\sin x}{4x} = \frac{5}{4} \lim_{x \to 0} \frac{\sin x}{x} = \frac{5}{4}

  $$


  对于第二项，由于 $|\cos(1/x)| \le 1$ 有界：


  $$

  \lim_{x \to 0} \frac{2x^2 \cos(1/x)}{4x} = \lim_{x \to 0} \frac{1}{2} x \cos\frac{1}{x} = 0

  $$


  由极限四则运算法则：


  $$

  \lim_{x \to 0} \frac{5\sin x + 2x^2 \cos(1/x)}{\ln(1+2x)(1+\cos x)} = \frac{5}{4} + 0 = \frac{5}{4}

  $$'
feedback:
  correct: 正确分离有界量与等价无穷小项求得 5/4．
  incorrect: 无穷小量与有界量乘积为无穷小量，即 $x \cos(1/x) \to 0$．
