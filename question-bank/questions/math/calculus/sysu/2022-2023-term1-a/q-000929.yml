stem: '求极限：


  $$

  \lim_{n \to \infty} \frac{1}{n} \left( \sqrt{1 + \cos\frac{1}{n}} + \sqrt{1 + \cos\frac{2}{n}} + \dots + \sqrt{1 + \cos\frac{n}{n}}
  \right)

  $$'
