reference_answer: $\lim_{n \to \infty} \frac{1}{n} \sum_{k=1}^n \sqrt{1 + \cos\frac{k}{n}} = 2\sqrt{2}\sin\frac{1}{2}$．
solution: '原式为黎曼和形式：


  $$

  \lim_{n \to \infty} \frac{1}{n} \sum_{k=1}^n \sqrt{1 + \cos\frac{k}{n}} = \int_0^1 \sqrt{1 + \cos x}\,\mathrm{d}x

  $$


  利用半角恒等式 $1 + \cos x = 2\cos^2\frac{x}{2}$．在 $x \in [0, 1]$ 上，$\frac{x}{2} \in [0, 1/2]$，$\cos\frac{x}{2} > 0$：


  $$

  \int_0^1 \sqrt{2\cos^2\frac{x}{2}}\,\mathrm{d}x = \sqrt{2} \int_0^1 \cos\frac{x}{2}\,\mathrm{d}x = \left. \sqrt{2} \cdot
  2\sin\frac{x}{2} \right|_0^1 = 2\sqrt{2} \sin\frac{1}{2}

  $$


  因此所求极限为 $2\sqrt{2}\sin\frac{1}{2}$．'
feedback:
  correct: 正确转化为定积分并利用半角公式化简求出 $2\sqrt{2}\sin(1/2)$．
  incorrect: 利用 $1+\cos x = 2\cos^2(x/2)$ 开根号是三角化简基本技巧．
