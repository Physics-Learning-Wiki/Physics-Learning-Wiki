stem: 设函数 $f(x)$ 在闭区间 $[0, 2023]$ 上可导，且满足 $f(0) = f(2022) = 0$．证明：方程 $f(x) + f'(x) = 0$ 在开区间 $(0, 2023)$ 内至少有一个根．
