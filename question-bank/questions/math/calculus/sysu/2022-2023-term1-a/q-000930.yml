reference_answer: 命题成立，通过构造辅助函数 $F(x) = e^x f(x)$ 并应用罗尔中值定理获证．
solution: '构造辅助函数：


  $$

  F(x) = e^x f(x)

  $$


  由题设条件，因为 $f(x)$ 在 $[0, 2022]$ 上可导，故 $F(x)$ 在 $[0, 2022]$ 上连续，在 $(0, 2022)$ 内可导．

  代入端点值：


  $$

  F(0) = e^0 f(0) = 0, \quad F(2022) = e^{2022} f(2022) = 0

  $$


  满足 $F(0) = F(2022)$．根据罗尔中值定理，至少存在一点 $c \in (0, 2022)$，使得 $F''(c) = 0$．

  计算导数：


  $$

  F''(x) = e^x f(x) + e^x f''(x) = e^x [f(x) + f''(x)]

  $$


  由于 $e^c > 0$ 恒不为零，故：


  $$

  F''(c) = 0 \implies f(c) + f''(c) = 0

  $$


  因为 $c \in (0, 2022) \subset (0, 2023)$，所以方程 $f(x) + f''(x) = 0$ 在 $(0, 2023)$ 内至少有一个根．'
feedback:
  correct: 辅助函数 $e^x f(x)$ 构造准确，罗尔定理应用规范严密．
  incorrect: 对于含 $f'(x) + f(x)$ 的结论，构造积分因子辅助函数 $e^x f(x)$ 是经典方法．
