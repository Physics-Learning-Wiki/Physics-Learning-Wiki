reference_answer: $\frac{\partial^2 z}{\partial x \partial y} = \frac{2y}{(e^z - x - 2z)^2} - \frac{2yz(e^z - 2)}{(e^z - x
  - 2z)^3}$．
solution: '方程两端关于 $x$ 求偏导数（$y$ 视为常数）：


  $$

  z + x\frac{\partial z}{\partial x} + 2z\frac{\partial z}{\partial x} - e^z \frac{\partial z}{\partial x} = 0 \implies \frac{\partial
  z}{\partial x}(e^z - x - 2z) = z \implies \frac{\partial z}{\partial x} = \frac{z}{e^z - x - 2z}

  $$


  两端关于 $y$ 求偏导数（$x$ 视为常数）：


  $$

  2y + x\frac{\partial z}{\partial y} + 2z\frac{\partial z}{\partial y} - e^z \frac{\partial z}{\partial y} = 0 \implies \frac{\partial
  z}{\partial y} = \frac{2y}{e^z - x - 2z}

  $$


  对 $\frac{\partial z}{\partial x}$ 关于 $y$ 求导：


  $$

  \frac{\partial^2 z}{\partial x \partial y} = \frac{\partial}{\partial y}\left( \frac{z}{e^z - x - 2z} \right) = \frac{\frac{\partial
  z}{\partial y}(e^z - x - 2z) - z(e^z \frac{\partial z}{\partial y} - 2\frac{\partial z}{\partial y})}{(e^z - x - 2z)^2}

  $$


  提取公因式 $\frac{\partial z}{\partial y}$：


  $$

  = \frac{\frac{\partial z}{\partial y}[(e^z - x - 2z) - z(e^z - 2)]}{(e^z - x - 2z)^2}

  $$


  将 $\frac{\partial z}{\partial y} = \frac{2y}{e^z - x - 2z}$ 代入：


  $$

  \frac{\partial^2 z}{\partial x \partial y} = \frac{2y[(e^z - x - 2z) - z(e^z - 2)]}{(e^z - x - 2z)^3} = \frac{2y}{(e^z -
  x - 2z)^2} - \frac{2yz(e^z - 2)}{(e^z - x - 2z)^3}

  $$'
feedback:
  correct: 正确计算隐函数一阶偏导数并应用商导法则化简二阶混合偏导．
  incorrect: 隐函数二次求偏导时，时刻注意 $z$ 是 $x, y$ 的函数，在对 $y$ 求导时涉及 $\partial z/\partial y$．
