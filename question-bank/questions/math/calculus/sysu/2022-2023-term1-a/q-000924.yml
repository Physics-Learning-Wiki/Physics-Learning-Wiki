stem: '已知空间直线 $l: \begin{cases} x + y - 1 = 0 \\ y + z + 1 = 0 \end{cases}$，求直线 $l$ 在平面 $\Pi: 2x + y + 2z = 0$ 上的投影直线方程（一般式方程）．'
