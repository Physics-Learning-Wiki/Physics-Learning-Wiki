reference_answer: 投影直线的方程为 $\begin{cases} x - z - 2 = 0 \\ 2x + y + 2z = 0 \end{cases}$．
solution: '设过直线 $l$ 的平面束方程为：


  $$

  \lambda_1(x + y - 1) + \lambda_2(y + z + 1) = 0 \implies \lambda_1 x + (\lambda_1 + \lambda_2)y + \lambda_2 z + (\lambda_2
  - \lambda_1) = 0

  $$


  投影平面 $\Pi_1$ 需与已知平面 $\Pi: 2x + y + 2z = 0$ 垂直，两平面法向量垂直点积为零：


  $$

  2\lambda_1 + 1(\lambda_1 + \lambda_2) + 2\lambda_2 = 0 \implies 3\lambda_1 + 3\lambda_2 = 0 \implies \lambda_1 + \lambda_2
  = 0 \implies \lambda_2 = -\lambda_1

  $$


  取 $\lambda_1 = 1, \lambda_2 = -1$，代入平面束方程得投影平面的方程：


  $$

  (x + y - 1) - (y + z + 1) = 0 \implies x - z - 2 = 0

  $$


  投影直线为投影平面与被投影平面的交线，其方程为：


  $$

  \begin{cases} x - z - 2 = 0 \\ 2x + y + 2z = 0 \end{cases}

  $$'
feedback:
  correct: 正确运用平面束建立垂直投影平面方程并写成交线一般式．
  incorrect: 直线在平面上的投影直线由垂直投影平面与原平面联立给出．
