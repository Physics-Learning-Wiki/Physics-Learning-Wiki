stem: '设函数 $f(x) = \frac{1+x+x^2}{1-x+x^2}$：


  1. 求 $f(x)$ 在 $x = 0$ 点带有皮亚诺余项的 $4$ 阶泰勒展开式；

  2. 由此求 $f^{(4)}(0)$ 的值．'
