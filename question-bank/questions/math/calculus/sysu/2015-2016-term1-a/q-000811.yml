reference_answer: $\lim_{\substack{x\to +\infty \\ y\to +\infty}} \left(\frac{xy}{x^2+y^2}\right)^{x^2} = 0$．
solution: '当 $x > 0, y > 0$ 时，由基本均值不等式：


  $$

  x^2 + y^2 \ge 2xy > 0

  $$


  所以底数满足：


  $$

  0 < \frac{xy}{x^2+y^2} \le \frac{1}{2}

  $$


  因为底数严格小于 1，指数 $x^2 > 0$：


  $$

  0 < \left(\frac{xy}{x^2+y^2}\right)^{x^2} \le \left(\frac{1}{2}\right)^{x^2}

  $$


  当 $x \to +\infty$ 时，$x^2 \to +\infty$，从而：


  $$

  \lim_{x\to +\infty} \left(\frac{1}{2}\right)^{x^2} = 0

  $$


  根据两边夹法则（夹逼定理）：


  $$

  \lim_{\substack{x\to +\infty \\ y\to +\infty}} \left(\frac{xy}{x^2+y^2}\right)^{x^2} = 0

  $$'
feedback:
  correct: 利用 $xy/(x^2+y^2) \le 1/2$ 与底数小于 1 的指数衰减完美夹逼．
  incorrect: 请注意：当 $x, y > 0$ 时 $x^2+y^2 \ge 2xy$ 给出底数上界为 $1/2$，无需做复杂的路径分析，直接放缩即可．
