reference_answer: $x = 2, \quad 2y = 4, \quad 3z = 6$（即 $x = 2, y = 2, z = 2$），最大值为 $64$．
solution: '已知条件为 $x + 2y + 3z = 12$，且 $x \ge 0, y \ge 0, z \ge 0$．


  目标函数为 $u = x y^2 z^3$．


  **方法一（均值不等式法）：**


  将条件和式拆为目标函数各变量对应因子的和：


  $$

  x + 2y + 3z = x + y + y + z + z + z = 12

  $$


  这正好是 6 个非负数 $x, y, y, z, z, z$ 之和．


  对这 6 个数应用算术–几何均值不等式（AM–GM）：


  $$

  \frac{x + y + y + z + z + z}{6} \ge \sqrt[6]{x \cdot y \cdot y \cdot z \cdot z \cdot z} = \sqrt[6]{x y^2 z^3}

  $$


  代入和为 12：


  $$

  \frac{12}{6} = 2 \ge \sqrt[6]{x y^2 z^3} \implies x y^2 z^3 \le 2^6 = 64

  $$


  等号成立的充要条件是这 6 个数全部相等：


  $$

  x = y = z = 2

  $$


  此时三个非负数分别为 $x = 2$，$2y = 4$，$3z = 6$（满足 $2 + 4 + 6 = 12$），目标函数的最大值为 $2 \cdot 2^2 \cdot 2^3 = 64$．


  **方法二（拉格朗日乘数法）：**


  设 $L(x, y, z, \lambda) = \ln x + 2\ln y + 3\ln z + \lambda(x + 2y + 3z - 12)$．


  分别求偏导：$\frac{1}{x} + \lambda = 0, \frac{2}{y} + 2\lambda = 0, \frac{3}{z} + 3\lambda = 0$，解得 $x = y = z = -\frac{1}{\lambda}$．


  代入约束解得 $x = y = z = 2$，同样得出最大值为 $64$．'
feedback:
  correct: 正确利用 AM-GM 不等式或拉格朗日乘数法求得极值点与最大值．
  incorrect: 请注意约束是 $x+2y+3z=12$，拆成 6 项 $x+y+y+z+z+z$ 均值不等式最简便，注意分清题目要求的「三个非负数」是 $x, 2y, 3z$ 还是 $x, y, z$．
