reference_answer: $\int_0^{100\pi} \sqrt{1-\cos 2x}\,\mathrm{d}x = 200\sqrt{2}$．
solution: '利用半角公式：$1 - \cos 2x = 2\sin^2 x$．


  因此被积函数为：


  $$

  \sqrt{1 - \cos 2x} = \sqrt{2\sin^2 x} = \sqrt{2} |\sin x|

  $$


  注意 $|\sin x|$ 是以 $\pi$ 为周期的周期函数．积分区间 $[0, 100\pi]$ 包含了 100 个周期，每个周期的长度为 $\pi$．


  由定积分的周期性性质：


  $$

  \int_0^{100\pi} \sqrt{2} |\sin x|\,\mathrm{d}x = 100 \int_0^\pi \sqrt{2} |\sin x|\,\mathrm{d}x

  $$


  在 $[0, \pi]$ 上，$\sin x \ge 0$，所以 $|\sin x| = \sin x$：


  $$

  100\sqrt{2} \int_0^\pi \sin x\,\mathrm{d}x = 100\sqrt{2} [-\cos x]_0^\pi = 100\sqrt{2} (1 - (-1)) = 200\sqrt{2}

  $$'
feedback:
  correct: 正确识别绝对值 $|\sin x|$ 并利用周期性将大区间转化为单周期积分．
  incorrect: 易错点：开根号必须保留绝对值 $\sqrt{\sin^2 x} = |\sin x|$，不能直接写成 $\sin x$（否则在许多区间上为负导致结果错误）．
