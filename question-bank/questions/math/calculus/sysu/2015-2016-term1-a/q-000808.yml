reference_answer: '(1) 单调增区间：$(-\infty, -1)$ 和 $(3, +\infty)$；单调减区间：$(-1, 1)$ 和 $(1, 3)$；极大值 $f(-1) = -8$，极小值 $f(3) = 0$．


  (2) 凸区间：$(-\infty, 1)$；凹区间：$(1, +\infty)$；无拐点．


  (3) 垂直渐近线：$x = 1$；斜渐近线：$y = x - 5$．'
solution: '函数的定义域为 $(-\infty, 1) \cup (1, +\infty)$．


  **(1) 单调性与极值：**


  求一阶导数：


  $$

  f''(x) = \frac{2(x-3)(x-1) - (x-3)^2}{(x-1)^2} = \frac{(x-3)(x+1)}{(x-1)^2}

  $$


  令 $f''(x) = 0$，驻点为 $x = -1$ 和 $x = 3$．分母 $(x-1)^2 > 0$（$x\neq 1$）．


  - 当 $x \in (-\infty, -1)$ 时，$f''(x) > 0$，$f(x)$ 单调递增；

  - 当 $x \in (-1, 1)$ 时，$f''(x) < 0$，$f(x)$ 单调递减；

  - 当 $x \in (1, 3)$ 时，$f''(x) < 0$，$f(x)$ 单调递减；

  - 当 $x \in (3, +\infty)$ 时，$f''(x) > 0$，$f(x)$ 单调递增．


  极大值为 $f(-1) = \frac{(-4)^2}{-2} = -8$；极小值为 $f(3) = 0$．


  **(2) 凹凸性：**


  对 $f''(x) = 1 - \frac{4}{(x-1)^2}$ 求二阶导数：


  $$

  f''''(x) = \frac{8}{(x-1)^3}

  $$


  - 当 $x \in (-\infty, 1)$ 时，$f''''(x) < 0$，曲线为凸；

  - 当 $x \in (1, +\infty)$ 时，$f''''(x) > 0$，曲线为凹．


  注意 $x=1$ 不在定义域内，因此无拐点．


  **(3) 渐近线：**


  - 垂直渐近线：$\lim_{x\to 1^-} f(x) = -\infty, \lim_{x\to 1^+} f(x) = +\infty$，所以 $x = 1$ 是垂直渐近线．

  - 斜渐近线：进行多项式带余除法：


  $$

  f(x) = \frac{x^2-6x+9}{x-1} = x - 5 + \frac{4}{x-1}

  $$


  当 $x \to \pm\infty$ 时，$\lim_{x\to\pm\infty} [f(x) - (x-5)] = \lim_{x\to\pm\infty} \frac{4}{x-1} = 0$．


  所以斜渐近线为 $y = x - 5$．'
feedback:
  correct: 全面且精确地讨论了单调性、极值、凹凸区间与渐近线．
  incorrect: 请注意：$x=1$ 是定义域不可达点，不能算作拐点；斜渐近线常数项可通过代数化简 $f(x) = x - 5 + \frac{4}{x-1}$ 直接读取．
