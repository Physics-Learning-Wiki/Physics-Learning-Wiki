reference_answer: $\frac{\partial z}{\partial x} = \frac{yz}{e^z - xy} = \frac{z}{x(z-1)}$，$\frac{\partial^2 z}{\partial x^2}
  = \frac{y^2 z(2e^z - 2xy - ze^z)}{(e^z - xy)^3} = -\frac{z(z^2-2z+2)}{x^2(z-1)^3}$．
solution: '**1. 求一阶偏导数 $\frac{\partial z}{\partial x}$：**


  对等式 $e^z = xyz$ 两边关于 $x$ 求偏导：


  $$

  e^z \frac{\partial z}{\partial x} = yz + xy \frac{\partial z}{\partial x}

  $$


  移项整理：


  $$

  (e^z - xy)\frac{\partial z}{\partial x} = yz \implies \frac{\partial z}{\partial x} = \frac{yz}{e^z - xy}

  $$


  若利用原方程 $e^z = xyz$，则 $e^z - xy = xyz - xy = xy(z-1)$，代入可化简为：


  $$

  \frac{\partial z}{\partial x} = \frac{yz}{xy(z-1)} = \frac{z}{x(z-1)}

  $$


  **2. 求二阶偏导数 $\frac{\partial^2 z}{\partial x^2}$：**


  由一阶导数等式 $(e^z - xy)\frac{\partial z}{\partial x} = yz$，两边再次对 $x$ 求偏导：


  $$

  \left(e^z \frac{\partial z}{\partial x} - y\right)\frac{\partial z}{\partial x} + (e^z - xy)\frac{\partial^2 z}{\partial
  x^2} = y \frac{\partial z}{\partial x}

  $$


  整理得：


  $$

  (e^z - xy)\frac{\partial^2 z}{\partial x^2} = 2y \frac{\partial z}{\partial x} - e^z \left(\frac{\partial z}{\partial x}\right)^2

  $$


  将 $\frac{\partial z}{\partial x} = \frac{yz}{e^z - xy}$ 代入：


  $$

  \frac{\partial^2 z}{\partial x^2} = \frac{2y \cdot \frac{yz}{e^z - xy} - e^z \frac{y^2 z^2}{(e^z - xy)^2}}{e^z - xy} = \frac{y^2
  z[2(e^z - xy) - z e^z]}{(e^z - xy)^3}

  $$


  若利用 $e^z = xyz$，也可写成：


  $$

  \frac{\partial^2 z}{\partial x^2} = -\frac{z(z^2-2z+2)}{x^2(z-1)^3}

  $$'
feedback:
  correct: 正确应用隐函数微分法求出一阶偏导数与二阶偏导数．
