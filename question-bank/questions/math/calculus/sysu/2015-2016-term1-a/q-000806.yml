stem: '设函数 $f(x)$ 在 $x=0$ 的某个邻域内有二阶导数，且


  $$

  \lim_{x\to 0} \left(1 + x + \frac{f(x)}{x}\right)^{\frac{1}{x}} = e^3

  $$


  求 $f(0), f''(0), f''''(0)$ 的值．'
