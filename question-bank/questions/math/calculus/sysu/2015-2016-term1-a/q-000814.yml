stem: '设函数 $f(x)$ 在 $[a, b]$ 上连续，在 $(a, b)$ 内有二阶导数，且满足 $f(a) = f(b) = 0, f(c) > 0$（其中 $a < c < b$）．


  证明：在 $(a, b)$ 内至少存在一点 $\xi$，使得 $f''''(\xi) < 0$．'
