reference_answer: 利用两次拉格朗日中值定理（或极值点费马引理与二阶导数性质）可证在 $(a, b)$ 内必存在 $\xi$ 使得 $f''(\xi) < 0$．
solution: '**证法一（拉格朗日中值定理两次应用）：**


  因为 $f(x)$ 在 $[a, c]$ 上连续，在 $(a, c)$ 内可导，由拉格朗日中值定理，存在 $\xi_1 \in (a, c)$ 使得：


  $$

  f''(\xi_1) = \frac{f(c) - f(a)}{c - a} = \frac{f(c)}{c - a} > 0

  $$


  同理，因为 $f(x)$ 在 $[c, b]$ 上连续，在 $(c, b)$ 内可导，由拉格朗日中值定理，存在 $\xi_2 \in (c, b)$ 使得：


  $$

  f''(\xi_2) = \frac{f(b) - f(c)}{b - c} = \frac{-f(c)}{b - c} < 0

  $$


  显然 $a < \xi_1 < c < \xi_2 < b$．考察函数 $f''(x)$ 在闭区间 $[\xi_1, \xi_2]$ 上的性质：


  $f''(x)$ 在 $[\xi_1, \xi_2]$ 上连续，在 $(\xi_1, \xi_2)$ 内可导．由拉格朗日中值定理，存在 $\xi \in (\xi_1, \xi_2) \subset (a, b)$ 使得：


  $$

  f''''(\xi) = \frac{f''(\xi_2) - f''(\xi_1)}{\xi_2 - \xi_1}

  $$


  因为 $\xi_2 > \xi_1$，分母 $\xi_2 - \xi_1 > 0$；而分子中 $f''(\xi_2) < 0$ 且 $f''(\xi_1) > 0$，所以分子：


  $$

  f''(\xi_2) - f''(\xi_1) < 0

  $$


  因此：


  $$

  f''''(\xi) < 0

  $$


  证毕．'
feedback:
  correct: 严谨地在 $[a,c]$ 与 $[c,b]$ 上分别使用拉格朗日中值定理得到异号的一阶导数，再对导函数应用中值定理得出二阶导数严格为负．
  incorrect: 证明思路提示：在点 $c$ 的两侧分别应用拉格朗日中值定理得到 $f'(\xi_1) > 0$ 与 $f'(\xi_2) < 0$，再利用微分中值定理考察 $f'(\xi_2)-f'(\xi_1)$ 的符号．
