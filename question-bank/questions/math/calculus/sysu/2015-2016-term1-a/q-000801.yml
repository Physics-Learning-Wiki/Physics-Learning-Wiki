reference_answer: $\lim_{n\to\infty} a_n = 1$．
solution: '求和式共有 $n$ 项，每项的分母随着项数增加而增大．


  对于 $1 \le k \le n$，分母满足：


  $$

  n^2 + \pi \le n^2 + k\pi \le n^2 + n\pi

  $$


  因此每一项满足不等式：


  $$

  \frac{1}{n^2 + n\pi} \le \frac{1}{n^2 + k\pi} \le \frac{1}{n^2 + \pi}

  $$


  将 $k=1, 2, \dots, n$ 的 $n$ 个不等式相加，并乘以外部的系数 $n$：


  $$

  n \cdot \frac{n}{n^2 + n\pi} \le a_n \le n \cdot \frac{n}{n^2 + \pi}

  $$


  即：


  $$

  \frac{n^2}{n^2 + n\pi} \le a_n \le \frac{n^2}{n^2 + \pi}

  $$


  当 $n \to \infty$ 时：


  $$

  \lim_{n\to\infty} \frac{n^2}{n^2 + n\pi} = \lim_{n\to\infty} \frac{1}{1 + \frac{\pi}{n}} = 1

  $$


  $$

  \lim_{n\to\infty} \frac{n^2}{n^2 + \pi} = \lim_{n\to\infty} \frac{1}{1 + \frac{\pi}{n^2}} = 1

  $$


  由夹逼定理（两边夹法则），可知：


  $$

  \lim_{n\to\infty} a_n = 1

  $$'
feedback:
  correct: 正确掌握了 $n$ 项求和数列极限的夹逼放大与缩小技巧．
  incorrect: 请注意：项数随 $n$ 无限增多，不能直接对各项分别求极限再相加；应放缩最大项与最小项使用夹逼定理．
