stem: '设数列


  $$

  a_n = n \left(\frac{1}{n^2+\pi} + \frac{1}{n^2+2\pi} + \dots + \frac{1}{n^2+n\pi}\right)

  $$


  求极限 $\lim_{n\to\infty} a_n$．'
