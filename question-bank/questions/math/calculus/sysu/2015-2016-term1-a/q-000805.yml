reference_answer: $\frac{x-4}{1} = \frac{y}{-2} = \frac{z-2}{1}$（或对称式 $\frac{x-4}{2} = \frac{y}{-4} = \frac{z-2}{2}$，一般式 $\begin{cases}
  2x - 2z - 4 = 0 \\ x + y + z - 6 = 0 \end{cases}$）．
solution: '**方法一（梯度叉积法）：**


  设曲面方程为 $F(x, y, z) = \frac{x^2}{4} - \frac{y^2}{9} - 2z = 0$，其法向量为：


  $$

  \nabla F = \left(\frac{x}{2}, -\frac{2y}{9}, -2\right)

  $$


  在点 $P(4, 0, 2)$ 处，曲面的法向量为 $\mathbf{n}_1 = (2, 0, -2)$．


  平面的方程为 $G(x, y, z) = x + y + z - 6 = 0$，其法向量为 $\mathbf{n}_2 = (1, 1, 1)$．


  交线在点 $P$ 处的切向量 $\mathbf{v}$ 与两法向量均垂直，由叉乘确定：


  $$

  \mathbf{v} = \mathbf{n}_1 \times \mathbf{n}_2 = \begin{vmatrix} \mathbf{i} & \mathbf{j} & \mathbf{k} \\ 2 & 0 & -2 \\ 1
  & 1 & 1 \end{vmatrix} = (2, -4, 2)

  $$


  取方向向量为 $(1, -2, 1)$．过点 $P(4, 0, 2)$ 的切线对称式方程为：


  $$

  \frac{x-4}{1} = \frac{y}{-2} = \frac{z-2}{1}

  $$'
feedback:
  correct: 正确计算两曲面的法向量并通过叉乘求得交线的切向量与切线方程．
  incorrect: 请检查点 $P(4,0,2)$ 处的梯度分量，以及向量积 $\mathbf{n}_1 \times \mathbf{n}_2$ 的正负号．
