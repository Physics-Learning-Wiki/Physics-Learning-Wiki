stem: '求经过直线 $L_1: \frac{x-1}{2} = \frac{y}{1} = \frac{z}{-1}$ 且平行于直线 $L_2: \frac{x}{2} = \frac{y}{1} = \frac{z+1}{-2}$ 的平面方程．'
