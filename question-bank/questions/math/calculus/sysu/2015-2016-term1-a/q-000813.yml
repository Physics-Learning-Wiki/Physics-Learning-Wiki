reference_answer: $x - 2y - 1 = 0$．
solution: '直线 $L_1$ 经过点 $M_0(1, 0, 0)$，其方向向量为 $\mathbf{s}_1 = (2, 1, -1)$．


  直线 $L_2$ 的方向向量为 $\mathbf{s}_2 = (2, 1, -2)$．


  因为所求平面包含直线 $L_1$ 且平行于直线 $L_2$，所以平面的法向量 $\mathbf{n}$ 垂直于 $\mathbf{s}_1$ 与 $\mathbf{s}_2$：


  $$

  \mathbf{n} = \mathbf{s}_1 \times \mathbf{s}_2 = \begin{vmatrix} \mathbf{i} & \mathbf{j} & \mathbf{k} \\ 2 & 1 & -1 \\ 2
  & 1 & -2 \end{vmatrix} = (-2 - (-1))\mathbf{i} - (-4 - (-2))\mathbf{j} + (2 - 2)\mathbf{k} = (-1, 2, 0)

  $$


  化简取法向量为 $\mathbf{n} = (1, -2, 0)$．


  平面经过点 $M_0(1, 0, 0)$，点法式平面方程为：


  $$

  1 \cdot (x - 1) - 2 \cdot (y - 0) + 0 \cdot (z - 0) = 0

  $$


  化简即得：


  $$

  x - 2y - 1 = 0

  $$'
feedback:
  correct: 正确通过两直线方向向量叉积确定平面法向量，并结合已知点求得平面方程．
  incorrect: 请检查向量积 $\mathbf{s}_1 \times \mathbf{s}_2$ 的坐标计算，注意 $z$ 分量为 $2\times 1 - 1\times 2 = 0$．
