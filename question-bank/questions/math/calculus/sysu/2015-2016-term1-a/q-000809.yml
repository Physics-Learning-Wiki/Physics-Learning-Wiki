reference_answer: $f^{(n)}(3) = (-1)^n \frac{(n+1)!}{3^{n+2}}$，泰勒公式为 $\frac{1}{x^2} = \sum_{k=0}^n (-1)^k \frac{k+1}{3^{k+2}}
  (x-3)^k + o((x-3)^n)$．
solution: '函数 $f(x) = x^{-2}$．逐阶求导：


  $$

  f''(x) = -2x^{-3}

  $$


  $$

  f''''(x) = (-2)(-3)x^{-4} = 3! x^{-4}

  $$


  $$

  f''''''(x) = (-2)(-3)(-4)x^{-5} = -4! x^{-5}

  $$


  一般地，对任意非负整数 $k$：


  $$

  f^{(k)}(x) = (-1)^k (k+1)! x^{-(k+2)}

  $$


  在 $x = 3$ 处：


  $$

  f^{(k)}(3) = (-1)^k \frac{(k+1)!}{3^{k+2}}

  $$


  因此 $n$ 阶导数值为：


  $$

  f^{(n)}(3) = (-1)^n \frac{(n+1)!}{3^{n+2}}

  $$


  带皮亚诺余项的 $n$ 阶泰勒公式为：


  $$

  f(x) = \sum_{k=0}^n \frac{f^{(k)}(3)}{k!} (x-3)^k + o((x-3)^n) = \sum_{k=0}^n (-1)^k \frac{k+1}{3^{k+2}} (x-3)^k + o((x-3)^n)

  $$'
feedback:
  correct: 正确归纳 $n$ 阶导数通项公式并规范写出带皮亚诺余项的泰勒多项式．
  incorrect: 请注意符号 $(-1)^n$、阶乘 $(n+1)!$ 与除以 $k!$ 后的系数化简 $\frac{(k+1)!}{k!} = k+1$．
