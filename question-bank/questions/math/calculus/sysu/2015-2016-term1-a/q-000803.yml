reference_answer: $e^x \arctan(e^{-x}) + \frac{1}{2}\ln(1+e^{2x}) + C$（或等价形式 $e^x \arctan(e^{-x}) + x + \frac{1}{2}\ln(1+e^{-2x})
  + C$）．
solution: '采用分部积分法，设 $u = \arctan(e^{-x}), \mathrm{d}v = e^x \,\mathrm{d}x$：


  $$

  v = e^x, \quad \mathrm{d}u = \frac{1}{1+(e^{-x})^2} \cdot (-e^{-x})\,\mathrm{d}x = -\frac{e^{-x}}{1+e^{-2x}}\,\mathrm{d}x

  $$


  代入分部积分公式：


  $$

  \int e^x \arctan(e^{-x})\,\mathrm{d}x = e^x \arctan(e^{-x}) - \int e^x \left(-\frac{e^{-x}}{1+e^{-2x}}\right)\,\mathrm{d}x

  $$


  $$

  = e^x \arctan(e^{-x}) + \int \frac{1}{1+e^{-2x}}\,\mathrm{d}x

  $$


  计算剩余积分，分子分母同乘 $e^{2x}$：


  $$

  \int \frac{1}{1+e^{-2x}}\,\mathrm{d}x = \int \frac{e^{2x}}{e^{2x}+1}\,\mathrm{d}x = \frac{1}{2}\int \frac{\mathrm{d}(e^{2x}+1)}{e^{2x}+1}
  = \frac{1}{2}\ln(e^{2x}+1) + C

  $$


  因此：


  $$

  \int e^x \arctan(e^{-x})\,\mathrm{d}x = e^x \arctan(e^{-x}) + \frac{1}{2}\ln(1+e^{2x}) + C

  $$'
feedback:
  correct: 正确运用分部积分法与有理化换元求得原函数．
  incorrect: 请注意分部积分中 $\mathrm{d}(\arctan(e^{-x}))$ 的复合函数求导链式法则，以及剩余积分 $\int \frac{1}{1+e^{-2x}}\,\mathrm{d}x$ 的计算．
