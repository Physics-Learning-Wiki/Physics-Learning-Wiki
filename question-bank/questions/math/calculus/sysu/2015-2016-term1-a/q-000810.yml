reference_answer: 函数在 $(0, 0)$ 处连续，偏导数 $f_x(0,0)=0, f_y(0,0)=0$ 均存在，但在 $(0, 0)$ 处不可微．
solution: '**1. 连续性：**


  因为 $|\sin x| \le |x|, |\sin y| \le |y|$，所以当 $(x, y) \neq (0, 0)$ 时：


  $$

  |f(x, y)| = \frac{|x||\sin x||\sin y|}{x^2+y^2} \le \frac{x^2 |y|}{x^2+y^2} \le |y|

  $$


  当 $(x, y) \to (0, 0)$ 时，$|y| \to 0$，由夹逼定理可知：


  $$

  \lim_{(x, y)\to(0, 0)} f(x, y) = 0 = f(0, 0)

  $$


  因此 $f(x, y)$ 在 $(0, 0)$ 处连续．


  **2. 偏导数的存在性：**


  由偏导数定义：


  $$

  f_x(0, 0) = \lim_{x\to 0} \frac{f(x, 0) - f(0, 0)}{x} = \lim_{x\to 0} \frac{0 - 0}{x} = 0

  $$


  $$

  f_y(0, 0) = \lim_{y\to 0} \frac{f(0, y) - f(0, 0)}{y} = \lim_{y\to 0} \frac{0 - 0}{y} = 0

  $$


  两偏导数均存在且均为 0．


  **3. 可微性：**


  考察可微性判别极限：


  $$

  \lim_{(x, y)\to(0, 0)} \frac{f(x, y) - f(0, 0) - f_x(0,0)x - f_y(0,0)y}{\sqrt{x^2+y^2}} = \lim_{(x, y)\to(0, 0)} \frac{x\sin
  x\sin y}{(x^2+y^2)^{\frac{3}{2}}}

  $$


  沿射线 $y = x$（$x > 0$）趋近于原点：


  $$

  \frac{x\sin^2 x}{(2x^2)^{\frac{3}{2}}} \sim \frac{x \cdot x^2}{2\sqrt{2}x^3} = \frac{1}{2\sqrt{2}} \neq 0

  $$


  极限不为 0，因此 $f(x, y)$ 在 $(0, 0)$ 处不可微．'
feedback:
  correct: 严密论证了连续性（夹逼放大）、偏导数（定义求导均为 0）以及不可微性（沿射线 $y=x$ 极限非零）．
  incorrect: 注意多元函数可微性检验必须检验误差量与距离比值的全极限是否为 0，不能仅由偏导数存在断言可微．
