stem: '讨论二元函数


  $$

  f(x, y) = \begin{cases} \frac{x\sin x\sin y}{x^2+y^2}, & x^2+y^2 \neq 0, \\ 0, & x^2+y^2 = 0 \end{cases}

  $$


  在点 $(0, 0)$ 处的连续性、偏导数的存在性及可微性．'
