reference_answer: 傅里叶级数为 $\frac{4\pi^2}{3} + \sum_{n=1}^\infty \left( \frac{4}{n^2}\cos nx - \frac{4\pi}{n}\sin nx \right)$；和函数在连续点
  $x \neq 2k\pi$ 为 $f(x)$，在间断点 $x = 2k\pi$ 为 $2\pi^2$（$k \in \mathbb{Z}$）．
solution: '周期为 $2\pi$（半周期 $l = \pi$），在区间 $[0, 2\pi]$ 上积分计算傅里叶系数：


  $$

  a_0 = \frac{1}{\pi}\int_0^{2\pi} x^2\,\mathrm{d}x = \frac{1}{\pi}\left. \left[ \frac{x^3}{3} \right] \right|_0^{2\pi} =
  \frac{8\pi^2}{3}

  $$


  计算余弦系数 $a_n$（应用两次分部积分法）：


  $$

  a_n = \frac{1}{\pi}\int_0^{2\pi} x^2\cos nx\,\mathrm{d}x = \frac{1}{\pi}\left( \left. \left[ \frac{x^2\sin nx}{n} \right]
  \right|_0^{2\pi} - \frac{2}{n}\int_0^{2\pi} x\sin nx\,\mathrm{d}x \right)

  $$


  $$

  = -\frac{2}{n\pi}\left( \left. \left[ -\frac{x\cos nx}{n} \right] \right|_0^{2\pi} + \frac{1}{n}\int_0^{2\pi}\cos nx\,\mathrm{d}x
  \right) = -\frac{2}{n\pi}\left( -\frac{2\pi}{n} + 0 \right) = \frac{4}{n^2}

  $$


  计算正弦系数 $b_n$：


  $$

  b_n = \frac{1}{\pi}\int_0^{2\pi} x^2\sin nx\,\mathrm{d}x = \frac{1}{\pi}\left( \left. \left[ -\frac{x^2\cos nx}{n} \right]
  \right|_0^{2\pi} + \frac{2}{n}\int_0^{2\pi} x\cos nx\,\mathrm{d}x \right)

  $$


  $$

  = \frac{1}{\pi}\left( -\frac{4\pi^2}{n} + 0 + \frac{2}{n} \cdot 0 \right) = -\frac{4\pi}{n}

  $$


  因此傅里叶级数展开式为：


  $$

  f(x) \sim \frac{a_0}{2} + \sum_{n=1}^\infty (a_n\cos nx + b_n\sin nx) = \frac{4\pi^2}{3} + \sum_{n=1}^\infty \left( \frac{4}{n^2}\cos
  nx - \frac{4\pi}{n}\sin nx \right)

  $$


  由狄利克雷收敛定理，和函数 $S(x)$ 满足：

  - 在所有连续点 $x \neq 2k\pi$（$k \in \mathbb{Z}$）处：$S(x) = f(x)$；

  - 在跳跃间断点 $x = 2k\pi$（$k \in \mathbb{Z}$）处：


  $$

  S(2k\pi) = \frac{f(0^+) + f(2\pi^-)}{2} = \frac{0 + 4\pi^2}{2} = 2\pi^2

  $$'
feedback:
  correct: 正确计算傅里叶系数并根据狄利克雷定理确定展开式与间断点和函数值．
  incorrect: 在非对称区间 $[0, 2\pi]$ 上展开时，$x^2$ 不具有奇偶对称性，余弦与正弦系数均不为零．
