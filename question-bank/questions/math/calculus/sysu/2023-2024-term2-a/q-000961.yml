reference_answer: $\frac{\pi}{4}$
solution: '曲面 $S$ 不是封闭曲面．补加上顶面 $S_1\colon z = 1$（$x^2+y^2 \le 1$），取上侧（法向量沿 $+z$ 轴方向），使 $S \cup S_1$ 构成封闭立体 $\Omega$ 的边界外侧面．


  在闭曲面上应用高斯公式：


  $$

  \iint_{(S \cup S_1)^+} (y-z)\,\mathrm{d}y\mathrm{d}z + (z-x)\,\mathrm{d}z\mathrm{d}x + (x-y^2)\,\mathrm{d}x\mathrm{d}y

  $$


  $$

  = \iiint_\Omega \left( \frac{\partial(y-z)}{\partial x} + \frac{\partial(z-x)}{\partial y} + \frac{\partial(x-y^2)}{\partial
  z} \right)\,\mathrm{d}V = \iiint_\Omega (0 + 0 + 0)\,\mathrm{d}V = 0

  $$


  由封闭曲面积分为零可知：


  $$

  I = \iint_{S^+} = -\iint_{S_1^+}

  $$


  在顶面 $S_1$ 上，$z = 1$，$\mathrm{d}z = 0$，故 $\mathrm{d}y\mathrm{d}z = 0$，$\mathrm{d}z\mathrm{d}x = 0$．

  取上侧时曲面微元 $\mathrm{d}x\mathrm{d}y > 0$，因此：


  $$

  \iint_{S_1^+} = \iint_{x^2+y^2 \le 1} (x - y^2)\,\mathrm{d}x\mathrm{d}y

  $$


  由对称性，$\iint_{x^2+y^2 \le 1} x\,\mathrm{d}x\mathrm{d}y = 0$．

  转极坐标计算第二项：


  $$

  \iint_{x^2+y^2 \le 1} y^2\,\mathrm{d}x\mathrm{d}y = \int_0^{2\pi} \sin^2\theta\,\mathrm{d}\theta \int_0^1 r^3\,\mathrm{d}r
  = \pi \cdot \frac{1}{4} = \frac{\pi}{4}

  $$


  因此：


  $$

  I = -\left( 0 - \frac{\pi}{4} \right) = \frac{\pi}{4}

  $$'
feedback:
  correct: 正确添加辅助顶盖封闭曲面应用高斯公式并计算辅助面积分．
  incorrect: 高斯公式将原本复杂的锥面积分直接简化为平面圆盘上的二重积分．
