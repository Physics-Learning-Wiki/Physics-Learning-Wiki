stem: '求第二类曲面积分：


  $$

  I = \iint_{S^+} (y-z)\,\mathrm{d}y\mathrm{d}z + (z-x)\,\mathrm{d}z\mathrm{d}x + (x-y^2)\,\mathrm{d}x\mathrm{d}y

  $$


  其中 $S^+$ 是锥面 $x^2+y^2=z^2$ 在 $0 \le z \le 1$ 中的部分的外侧（背向 $z$ 轴）．'
