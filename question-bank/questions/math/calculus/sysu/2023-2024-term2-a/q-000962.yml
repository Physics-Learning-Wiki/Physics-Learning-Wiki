stem: 求曲线积分 $\int_L (x^2+y)\,\mathrm{d}x + (x+y^2\sin^3 y)\,\mathrm{d}y$，其中 $L$ 是半圆弧 $y = \sqrt{x(2-x)}$（$y \ge 0$），方向为从 $(2,
  0)$ 到 $(0, 0)$．
