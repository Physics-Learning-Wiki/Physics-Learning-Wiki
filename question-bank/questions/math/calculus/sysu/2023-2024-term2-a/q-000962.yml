reference_answer: $-\frac{8}{3}$
solution: '记 $P(x, y) = x^2+y$，$Q(x, y) = x+y^2\sin^3 y$．


  验证积分与路径无关的充要条件：


  $$

  \frac{\partial Q}{\partial x} = 1, \quad \frac{\partial P}{\partial y} = 1 \implies \frac{\partial Q}{\partial x} = \frac{\partial
  P}{\partial y}

  $$


  由于偏导数在全平面 $\mathbb{R}^2$ 连续且相等，该曲线积分与路径无关．


  为了简化计算，可将路径改换为沿 $x$ 轴从 $(2, 0)$ 到 $(0, 0)$ 的直线段 $L''$：

  在直线段 $L''$ 上，$y = 0$，$\mathrm{d}y = 0$，$x$ 从 $2$ 变化到 $0$：


  $$

  \int_L = \int_{L''} (x^2 + 0)\,\mathrm{d}x = \int_2^0 x^2\,\mathrm{d}x = \left. \left[ \frac{x^3}{3} \right] \right|_2^0
  = 0 - \frac{8}{3} = -\frac{8}{3}

  $$'
feedback:
  correct: 正确验证路径无关条件并改换积分路径为坐标轴线段简捷求解．
  incorrect: 路径无关时换成直线段计算可以彻底规避半圆方程中繁杂的三角参数代换．
