stem: '1. 证明含参变量反常积分 $\int_0^{+\infty} \frac{\sin xy}{x}\,\mathrm{d}x$ 在 $y \in [2023, 2024]$ 上一致收敛；

  2. 求积分 $\int_0^{+\infty} \frac{\cos 2023x - \cos 2024x}{x^2}\,\mathrm{d}x$ 的值．'
