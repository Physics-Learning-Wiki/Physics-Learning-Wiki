reference_answer: 该反常积分收敛．
solution: '积分区间为 $(0, 1)$，分别考察区间两个端点的奇点性质：


  1. 考察端点 $x = 1$：

  计算极限（$0/0$ 型应用洛必达法则）：


  $$

  \lim_{x \to 1^-} \frac{\ln x}{1-x} = \lim_{x \to 1^-} \frac{1/x}{-1} = -1

  $$


  极限存在且有限，因此 $x = 1$ 不是瑕点．


  2. 考察端点 $x = 0$：

  当 $x \to 0^+$ 时，$\ln x \to -\infty$，$1-x \to 1$，故 $x = 0$ 为唯一瑕点．

  取比较基准幂次 $p = \frac{1}{2} < 1$，考察极限：


  $$

  \lim_{x \to 0^+} x^{1/2} \left| \frac{\ln x}{1-x} \right| = \lim_{x \to 0^+} \frac{x^{1/2}|\ln x|}{1-x} = \frac{0}{1} =
  0

  $$


  因为当 $p = \frac{1}{2} < 1$ 时，基准瑕积分 $\int_0^1 \frac{1}{x^{1/2}}\,\mathrm{d}x$ 收敛，根据瑕积分比较判别法的极限形式（$\lim_{x \to 0^+} \frac{f(x)}{1/x^p}
  = 0$），原反常积分在瑕点 $x = 0$ 处收敛．


  综上所述，反常积分 $\int_0^1 \frac{\ln x}{1-x}\,\mathrm{d}x$ 收敛．'
feedback:
  correct: 正确辨识两端点奇点性质，排除 $x=1$ 瑕点并用比较法证明 $x=0$ 瑕点收敛．
  incorrect: $\lim_{x \to 0^+} x^p \ln x = 0$ 对任意正数 $p > 0$ 均成立，故对数瑕点比任何负幂次奇性都要弱．
