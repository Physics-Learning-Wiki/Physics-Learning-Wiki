reference_answer: $y = Ce^{-x^2/2} + 1$（$C$ 为任意常数）
solution: '分离变量法：


  $$

  \frac{\mathrm{d}y}{\mathrm{d}x} = x(1 - y) \implies \frac{\mathrm{d}y}{1-y} = x\,\mathrm{d}x \quad (y \neq 1)

  $$


  两边同时积分：


  $$

  -\ln|1-y| = \frac{x^2}{2} + C_1 \implies |1-y| = e^{-C_1} e^{-x^2/2} \implies 1-y = C_2 e^{-x^2/2}

  $$


  整理得：


  $$

  y = C e^{-x^2/2} + 1

  $$


  当 $C = 0$ 时对应特解 $y = 1$，因此 $y = C e^{-x^2/2} + 1$ 为该微分方程的通解（其中 $C$ 为任意常数）．


  【另解（一阶线性微分方程公式）】：

  $P(x) = x$，$Q(x) = x$．通解公式：


  $$

  y = e^{-\int x\,\mathrm{d}x}\left( \int x e^{\int x\,\mathrm{d}x}\,\mathrm{d}x + C \right) = e^{-x^2/2}\left( \int x e^{x^2/2}\,\mathrm{d}x
  + C \right) = e^{-x^2/2}(e^{x^2/2} + C) = 1 + C e^{-x^2/2}

  $$'
feedback:
  correct: 正确运用分离变量法或一阶线性方程通解公式求出通解．
  incorrect: 分离变量后务必验证 $y=1$ 是否被常数 $C=0$ 涵盖．
