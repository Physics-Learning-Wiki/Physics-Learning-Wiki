reference_answer: $\frac{4\pi}{5}$
solution: '展开被积函数：


  $$

  (x+y+z)^2 = x^2 + y^2 + z^2 + 2xy + 2yz + 2zx

  $$


  因为积分区域 $\Omega$ 是关于三个坐标面 $xOy$、$yOz$、$zOx$ 对称的单位球体，而 $2xy, 2yz, 2zx$ 关于各坐标分量为奇函数，所以交叉项在 $\Omega$ 上的积分为零：


  $$

  \iiint_\Omega 2xy\,\mathrm{d}V = \iiint_\Omega 2yz\,\mathrm{d}V = \iiint_\Omega 2zx\,\mathrm{d}V = 0

  $$


  由单位球体的轮换对称性：


  $$

  \iiint_\Omega x^2\,\mathrm{d}V = \iiint_\Omega y^2\,\mathrm{d}V = \iiint_\Omega z^2\,\mathrm{d}V

  $$


  因此：


  $$

  I = \iiint_\Omega (x^2+y^2+z^2)\,\mathrm{d}V

  $$


  采用球坐标变换（$x = r\sin\varphi\cos\theta, y = r\sin\varphi\sin\theta, z = r\cos\varphi$，$\mathrm{d}V = r^2\sin\varphi\,\mathrm{d}r\mathrm{d}\varphi\mathrm{d}\theta$）：


  $$

  I = \int_0^{2\pi}\mathrm{d}\theta \int_0^\pi \sin\varphi\,\mathrm{d}\varphi \int_0^1 r^2 \cdot r^2\,\mathrm{d}r

  $$


  $$

  = 2\pi \cdot [-\cos\varphi]_0^\pi \cdot \left[ \frac{r^5}{5} \right]_0^1 = 2\pi \cdot 2 \cdot \frac{1}{5} = \frac{4\pi}{5}

  $$'
feedback:
  correct: 正确利用奇偶对称性消除交叉项并由轮换对称性或球坐标计算球面积分．
  incorrect: 直接计算 $x^2+y^2+z^2 = r^2$ 在球坐标下仅需一步三向分离变量积分．
