reference_answer: $y = C_1\cos 3x + C_2\sin 3x + \frac{1}{34}e^{5x}$（$C_1, C_2$ 为任意常数）
solution: '1. 求对应齐次方程 $y'''' + 9y = 0$ 的通解：

  特征方程为 $r^2 + 9 = 0$，特征根为一对共轭纯虚根 $r = \pm 3i$．

  齐次通解为：


  $$

  Y(x) = C_1\cos 3x + C_2\sin 3x

  $$


  2. 求非齐次特解：

  自由项为 $f(x) = e^{5x}$，对应的指数特征数 $\lambda = 5$ 不是特征根（$5 \neq \pm 3i$）．

  因此设非齐次方程的特解形式为 $y^* = Ae^{5x}$．

  求导代入：


  $$

  (y^*)'' = 5Ae^{5x}, \quad (y^*)'''' = 25Ae^{5x}

  $$


  代入原方程：


  $$

  25Ae^{5x} + 9Ae^{5x} = 34Ae^{5x} = e^{5x} \implies 34A = 1 \implies A = \frac{1}{34}

  $$


  故特解为 $y^* = \frac{1}{34}e^{5x}$．


  3. 得到原非齐次方程的通解：


  $$

  y(x) = Y(x) + y^* = C_1\cos 3x + C_2\sin 3x + \frac{1}{34}e^{5x}

  $$


  其中 $C_1, C_2$ 为任意常数．'
feedback:
  correct: 正确求出二阶常系数齐次通解与待定系数特解并组合出通解．
  incorrect: 注意特征根为纯虚数时对应三角函数组合，自由项指数不是特征根时不产生乘因子 $x$．
