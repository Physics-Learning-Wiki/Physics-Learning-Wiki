reference_answer: $\frac{3\sqrt{5}}{2}$
solution: '直线段 $AB$ 的截距式方程为 $\frac{x}{1} + \frac{y}{2} = 1$，解得：


  $$

  y = 2 - 2x \quad (0 \le x \le 1)

  $$


  计算弧长微元：


  $$

  y'' = -2 \implies \mathrm{d}s = \sqrt{1 + (y'')^2}\,\mathrm{d}x = \sqrt{1 + (-2)^2}\,\mathrm{d}x = \sqrt{5}\,\mathrm{d}x

  $$


  被积函数化简：


  $$

  x + y = x + (2 - 2x) = 2 - x

  $$


  计算定积分：


  $$

  \int_L (x+y)\,\mathrm{d}s = \int_0^1 (2 - x)\sqrt{5}\,\mathrm{d}x = \sqrt{5} \left. \left[ 2x - \frac{x^2}{2} \right] \right|_0^1
  = \sqrt{5} \left( 2 - \frac{1}{2} \right) = \frac{3\sqrt{5}}{2}

  $$'
feedback:
  correct: 正确写出直线段方程与弧长微元并求得第一类曲线积分．
  incorrect: 第一类曲线积分与方向无关，积分上下限遵循普通定积分从小到大的自然顺序．
