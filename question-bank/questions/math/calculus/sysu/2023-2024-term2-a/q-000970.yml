stem: 已知数列 $\{a_n\}$ 单调递增且有界，$a_n > 1$．试证明级数 $\sum_{n=1}^\infty \frac{1}{\sqrt{a_{n+1}}}\left( 1 - \frac{a_n}{a_{n+1}} \right)$
  收敛．
