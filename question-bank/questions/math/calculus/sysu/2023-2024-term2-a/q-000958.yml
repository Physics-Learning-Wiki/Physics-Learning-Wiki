reference_answer: $\frac{\pi}{4}$
solution: '积分区域 $D$ 为 $X$-型区域：$0 \le x \le \pi$，$0 \le y \le \sin x$．


  化为二次积分：


  $$

  I = \int_0^\pi \mathrm{d}x \int_0^{\sin x} y\,\mathrm{d}y = \int_0^\pi \left. \left[ \frac{y^2}{2} \right] \right|_0^{\sin
  x}\,\mathrm{d}x = \frac{1}{2}\int_0^\pi \sin^2 x\,\mathrm{d}x

  $$


  利用降幂公式 $\sin^2 x = \frac{1 - \cos 2x}{2}$：


  $$

  I = \frac{1}{4}\int_0^\pi (1 - \cos 2x)\,\mathrm{d}x = \frac{1}{4}\left[ x - \frac{\sin 2x}{2} \right]_0^\pi = \frac{\pi}{4}

  $$'
feedback:
  correct: 正确表示区域积分限并利用降幂公式完成二次积分．
  incorrect: 正弦平方在半个周期 $[0, \pi]$ 上的平均值为 $1/2$，定积分直接为 $\pi/2$．
