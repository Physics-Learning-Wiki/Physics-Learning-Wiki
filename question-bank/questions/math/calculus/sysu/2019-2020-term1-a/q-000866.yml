stem: '设 $2n$ 次多项式


  $$

  P_{2n}(x) = 1 + \sum_{k=1}^{2n} \frac{(-1)^k}{k} x^k = 1 - x + \frac{x^2}{2} - \frac{x^3}{3} + \dots + \frac{x^{2n}}{2n}

  $$


  分析该多项式的单调性，由此证明该多项式在实数域内没有零点．'
