reference_answer: $\lim_{n\to\infty} \left(1 + \frac{1}{n} - \frac{1}{n^2}\right)^n = e$．
solution: '**方法一（重要极限法）：**


  原式可变形为：


  $$

  \lim_{n\to\infty} \left(1 + \frac{n-1}{n^2}\right)^n = \lim_{n\to\infty} \left[\left(1 + \frac{n-1}{n^2}\right)^{\frac{n^2}{n-1}}\right]^{\frac{n(n-1)}{n^2}}

  $$


  当 $n \to \infty$ 时，$\frac{n-1}{n^2} \to 0$，内层底数趋于重要极限底数 $e$；


  外层指数为 $\lim_{n\to\infty} \frac{n^2 - n}{n^2} = 1$．


  因此极限为 $e^1 = e$．


  **方法二（对数化与等价无穷小）：**


  令 $y_n = \left(1 + \frac{1}{n} - \frac{1}{n^2}\right)^n$．取对数：


  $$

  \ln y_n = n \ln\left(1 + \frac{n-1}{n^2}\right) \sim n \cdot \frac{n-1}{n^2} = \frac{n-1}{n} \to 1

  $$


  故 $\lim_{n\to\infty} y_n = e^1 = e$．'
feedback:
  correct: 正确使用重要极限 $1^\infty$ 型变形或对数等价无穷小求得极限 e．
  incorrect: 请注意：$1 + 1/n - 1/n^2 = 1 + (n-1)/n^2$，取对数后为 $n \cdot \frac{n-1}{n^2} \to 1$．
