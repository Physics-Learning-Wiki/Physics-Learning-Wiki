reference_answer: $\frac{x}{1} = \frac{y}{2} = \frac{z}{1}$（或过原点与垂足 $P(-1, -1, 1)$ 的对称式方程）．
solution: '**1. 求直线 $L$ 的方向向量：**


  直线的两平面法向量分别为 $\mathbf{n}_1 = (1, 0, -1), \mathbf{n}_2 = (0, -1, 2)$．


  直线的方向向量为：


  $$

  \mathbf{s} = \mathbf{n}_1 \times \mathbf{n}_2 = \begin{vmatrix} \mathbf{i} & \mathbf{j} & \mathbf{k} \\ 1 & 0 & -1 \\ 0
  & -1 & 2 \end{vmatrix} = (-1, -2, -1) \parallel (1, 2, 1)

  $$


  **2. 求垂足坐标 $P(x, y, z)$：**


  垂足 $P$ 位于直线 $L$ 上，设参数方程：由 $x = z - 2, y = 2z - 1$．


  向量 $\vec{OP} = (z - 2, 2z - 1, z)$．


  因为 $OP$ 垂直于直线 $L$：


  $$

  \vec{OP} \cdot \mathbf{s} = 0 \implies 1(z - 2) + 2(2z - 1) + 1(z) = 0

  $$


  展开：


  $$

  z - 2 + 4z - 2 + z = 0 \implies 6z - 4 = 0 \implies z = \frac{2}{3}

  $$


  代入解得垂足坐标：


  $$

  x = \frac{2}{3} - 2 = -\frac{4}{3}, \quad y = 2\left(\frac{2}{3}\right) - 1 = \frac{1}{3}, \quad z = \frac{2}{3}

  $$


  **3. 写出垂线方程：**


  垂线经过原点 $(0, 0, 0)$ 和垂足 $P\left(-\frac{4}{3}, \frac{1}{3}, \frac{2}{3}\right)$，其方向向量为 $(-4, 1, 2)$．


  垂线的对称式方程为：


  $$

  \frac{x}{-4} = \frac{y}{1} = \frac{z}{2}

  $$'
feedback:
  correct: 正确利用参数化直线求得垂足坐标，并写出过原点与垂足的垂线方程．
  incorrect: 求垂足提示：将直线表示为关于 $z$ 的参数方程，由 $\vec{OP} \cdot \mathbf{s} = 0$ 确定参数 $z$．
