reference_answer: $(x+1)\arctan\sqrt{x} - \sqrt{x} + C$．
solution: '做换元法：令 $t = \sqrt{x}$（$t \ge 0$），则 $x = t^2, \mathrm{d}x = 2t\,\mathrm{d}t$．


  $$

  \int \arctan\sqrt{x}\,\mathrm{d}x = \int \arctan t \cdot 2t\,\mathrm{d}t = \int \arctan t \,\mathrm{d}(t^2)

  $$


  采用分部积分法：


  $$

  = t^2 \arctan t - \int t^2 \,\mathrm{d}(\arctan t) = t^2 \arctan t - \int \frac{t^2}{1+t^2}\,\mathrm{d}t

  $$


  拆分有理式：


  $$

  \int \frac{t^2}{1+t^2}\,\mathrm{d}t = \int \left(1 - \frac{1}{1+t^2}\right)\,\mathrm{d}t = t - \arctan t

  $$


  代回：


  $$

  = t^2 \arctan t - (t - \arctan t) + C = (t^2 + 1)\arctan t - t + C

  $$


  回代 $t = \sqrt{x}$：


  $$

  \int \arctan\sqrt{x}\,\mathrm{d}x = (x + 1)\arctan\sqrt{x} - \sqrt{x} + C

  $$'
feedback:
  correct: 正确利用根式换元与分部积分求得原函数．
  incorrect: 分部积分后 $\int \frac{t^2}{1+t^2}\,\mathrm{d}t = t - \arctan t$，注意负号分配与回代．
