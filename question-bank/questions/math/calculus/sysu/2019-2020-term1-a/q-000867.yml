reference_answer: $\mathrm{d}y = \frac{2x - y(x^2+y)e^{xy}}{x(x^2+y)e^{xy} - 1}\,\mathrm{d}x$．
solution: '对原方程两边取外微分：


  $$

  \mathrm{d}\left(e^{xy}\right) - \mathrm{d}\left(\ln(x^2+y)\right) = 0

  $$


  计算各微分式：


  $$

  e^{xy} \mathrm{d}(xy) - \frac{1}{x^2+y}\mathrm{d}(x^2+y) = 0

  $$


  $$

  e^{xy}(y\,\mathrm{d}x + x\,\mathrm{d}y) - \frac{1}{x^2+y}(2x\,\mathrm{d}x + \mathrm{d}y) = 0

  $$


  两边同乘 $(x^2+y)$：


  $$

  (x^2+y)e^{xy}(y\,\mathrm{d}x + x\,\mathrm{d}y) - 2x\,\mathrm{d}x - \mathrm{d}y = 0

  $$


  合并 $\mathrm{d}x$ 与 $\mathrm{d}y$：


  $$

  \left[x(x^2+y)e^{xy} - 1\right]\mathrm{d}y = \left[2x - y(x^2+y)e^{xy}\right]\mathrm{d}x

  $$


  因此隐函数的微分表达式为：


  $$

  \mathrm{d}y = \frac{2x - y(x^2+y)e^{xy}}{x(x^2+y)e^{xy} - 1}\,\mathrm{d}x

  $$'
feedback:
  correct: 正确使用微分运算法则分离 $\mathrm{d}x$ 与 $\mathrm{d}y$ 解出全微分．
  incorrect: 求微分注意 $\mathrm{d}(xy) = y\mathrm{d}x + x\mathrm{d}y$ 与 $\mathrm{d}(x^2+y) = 2x\mathrm{d}x + \mathrm{d}y$．
