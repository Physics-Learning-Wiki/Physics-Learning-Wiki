reference_answer: $x + \ln\left|\frac{x+2}{(x-1)^2}\right| + C$（或 $x + \ln|x+2| - 2\ln|x-1| + C$）．
solution: '对假分式进行多项式除法：


  $$

  \frac{x^2 - 7}{x^2 + x - 2} = \frac{(x^2 + x - 2) - (x + 5)}{x^2 + x - 2} = 1 - \frac{x + 5}{x^2 + x - 2}

  $$


  分母因式分解：$x^2 + x - 2 = (x+2)(x-1)$．


  部分分式分解：设 $\frac{x+5}{(x+2)(x-1)} = \frac{A}{x+2} + \frac{B}{x-1}$．


  - 用遮掩法：令 $x = -2$，得 $A = \frac{-2+5}{-2-1} = \frac{3}{-3} = -1$；

  - 令 $x = 1$，得 $B = \frac{1+5}{1+2} = \frac{6}{3} = 2$．


  所以：


  $$

  \frac{x+5}{x^2+x-2} = -\frac{1}{x+2} + \frac{2}{x-1}

  $$


  代入被积函数：


  $$

  \int \frac{x^2 - 7}{x^2 + x - 2}\,\mathrm{d}x = \int \left(1 + \frac{1}{x+2} - \frac{2}{x-1}\right)\,\mathrm{d}x

  $$


  $$

  = x + \ln|x+2| - 2\ln|x-1| + C = x + \ln\left|\frac{x+2}{(x-1)^2}\right| + C

  $$'
feedback:
  correct: 正确完成真分式化简与部分分式分解求得原函数．
  incorrect: 请注意部分分式拆分系数：$A=-1, B=2$，积分后包含绝对值符号与积分常数 C．
