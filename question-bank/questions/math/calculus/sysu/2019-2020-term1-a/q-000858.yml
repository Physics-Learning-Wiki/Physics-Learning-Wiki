reference_answer: $\lim_{(x, y)\to(0, 0)} (x + 2y) \ln(x^4 + y^4) = 0$．
solution: '采用极坐标变换 $x = r\cos\theta, y = r\sin\theta$（$r > 0$）：


  $$

  x^4 + y^4 = r^4 (\cos^4\theta + \sin^4\theta)

  $$


  注意三角多项式满足 $\frac{1}{2} \le \cos^4\theta + \sin^4\theta \le 1$．


  因此对数项可拆分：


  $$

  \ln(x^4 + y^4) = \ln(r^4) + \ln(\cos^4\theta + \sin^4\theta) = 4\ln r + \ln(\cos^4\theta + \sin^4\theta)

  $$


  而 $(x + 2y) = r(\cos\theta + 2\sin\theta)$．所以：


  $$

  (x + 2y) \ln(x^4 + y^4) = r(\cos\theta + 2\sin\theta) [4\ln r + \ln(\cos^4\theta + \sin^4\theta)]

  $$


  当 $(x, y) \to (0, 0)$ 时，$r \to 0^+$．


  因为 $\cos\theta + 2\sin\theta$ 和 $\ln(\cos^4\theta + \sin^4\theta)$ 均有界，且经典极限：


  $$

  \lim_{r\to 0^+} r \ln r = 0

  $$


  由有界量乘以无穷小量仍为无穷小量，可知：


  $$

  \lim_{(x, y)\to(0, 0)} (x + 2y) \ln(x^4 + y^4) = 0

  $$'
feedback:
  correct: 利用极坐标放缩结合 $\lim_{r\to 0} r\ln r = 0$ 严谨证明极限为 0．
  incorrect: 请注意：$x^4+y^4 \sim r^4$，对数项为 $4\ln r$；乘以一次项 $r$ 后为 $r\ln r \to 0$．
