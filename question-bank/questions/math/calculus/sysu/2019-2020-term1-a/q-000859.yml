reference_answer: $V = \frac{\pi}{6}$．
solution: '**1. 求切线方程与切点：**


  设切点为 $(x_0, y_0)$，满足 $y_0 = \sqrt{x_0 - 1}$（$x_0 > 1$）．


  求导数：$y'' = \frac{1}{2\sqrt{x-1}}$，所以切线斜率为 $k = \frac{1}{2\sqrt{x_0 - 1}}$．


  因为切线过原点 $(0, 0)$，斜率又等于 $\frac{y_0 - 0}{x_0 - 0} = \frac{\sqrt{x_0 - 1}}{x_0}$．


  列方程：


  $$

  \frac{\sqrt{x_0 - 1}}{x_0} = \frac{1}{2\sqrt{x_0 - 1}} \implies 2(x_0 - 1) = x_0 \implies x_0 = 2

  $$


  代入得 $y_0 = 1$．切线斜率为 $k = \frac{1}{2}$，切线方程为 $y = \frac{1}{2}x$．


  **2. 计算旋转体体积：**


  区域 $D$ 由切线 $y = \frac{1}{2}x$（$0 \le x \le 2$）、曲线 $y = \sqrt{x-1}$（$1 \le x \le 2$）以及 $x$ 轴（$0 \le x \le 1$）围成．


  绕 $x$ 轴旋转所得旋转体的体积等于圆锥体体积减去旋转抛物面体体积：


  $$

  V_1 = \pi \int_0^2 \left(\frac{1}{2}x\right)^2 \,\mathrm{d}x = \frac{\pi}{4} \left[\frac{x^3}{3}\right]_0^2 = \frac{2\pi}{3}

  $$


  （或者圆锥体积公式：$\frac{1}{3} \pi r^2 h = \frac{1}{3} \pi (1)^2 \cdot 2 = \frac{2\pi}{3}$）．


  曲线下方旋转体体积：


  $$

  V_2 = \pi \int_1^2 (\sqrt{x-1})^2 \,\mathrm{d}x = \pi \int_1^2 (x-1)\,\mathrm{d}x = \pi \left[\frac{(x-1)^2}{2}\right]_1^2
  = \frac{\pi}{2}

  $$


  因此区域 $D$ 的旋转体体积为：


  $$

  V = V_1 - V_2 = \frac{2\pi}{3} - \frac{\pi}{2} = \frac{\pi}{6}

  $$'
feedback:
  correct: 正确求出切点 (2, 1) 与切线方程，并通过体积相减求得 pi/6．
  incorrect: 请注意切线过原点建立斜率等式求出切点为 (2, 1)，原卷参考解答计算有笔误写为 pi，正确差值为 $2\pi/3 - \pi/2 = \pi/6$．
