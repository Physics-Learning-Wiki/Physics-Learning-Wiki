stem: '过原点作曲线 $y = \sqrt{x-1}$ 的切线，设 $D$ 是该切线与上述曲线及 $x$ 轴所围成的平面区域．


  求区域 $D$ 绕 $x$ 轴旋转一周所得旋转体的体积．'
