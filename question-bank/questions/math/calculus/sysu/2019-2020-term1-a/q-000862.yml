stem: '证明定积分等式：


  $$

  \int_0^{\frac{\pi}{2}} \frac{x}{1 + \cos x + \sin x}\,\mathrm{d}x = \frac{\pi}{4} \int_0^{\frac{\pi}{2}} \frac{1}{1 + \sin
  x + \cos x}\,\mathrm{d}x

  $$'
