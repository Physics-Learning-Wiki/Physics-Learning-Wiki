reference_answer: 利用区间对称变换 $x = \frac{\pi}{2} - t$ 及三角恒等式两式相加可证结论．
solution: '记原积分左端为 $I = \int_0^{\frac{\pi}{2}} \frac{x}{1 + \cos x + \sin x}\,\mathrm{d}x$．


  做变量代换：令 $x = \frac{\pi}{2} - t$，则 $\mathrm{d}x = -\mathrm{d}t$．


  当 $x = 0$ 时 $t = \frac{\pi}{2}$；当 $x = \frac{\pi}{2}$ 时 $t = 0$．


  根据诱导公式：$\cos x = \cos\left(\frac{\pi}{2} - t\right) = \sin t$，$\sin x = \sin\left(\frac{\pi}{2} - t\right) = \cos t$．


  代入积分式：


  $$

  I = \int_{\frac{\pi}{2}}^0 \frac{\frac{\pi}{2} - t}{1 + \sin t + \cos t} \,(-\mathrm{d}t) = \int_0^{\frac{\pi}{2}} \frac{\frac{\pi}{2}
  - t}{1 + \cos t + \sin t}\,\mathrm{d}t

  $$


  将积分变量改记为 $x$：


  $$

  I = \frac{\pi}{2} \int_0^{\frac{\pi}{2}} \frac{1}{1 + \cos x + \sin x}\,\mathrm{d}x - \int_0^{\frac{\pi}{2}} \frac{x}{1
  + \cos x + \sin x}\,\mathrm{d}x

  $$


  后一项正好就是原积分 $I$，移项得：


  $$

  2I = \frac{\pi}{2} \int_0^{\frac{\pi}{2}} \frac{1}{1 + \cos x + \sin x}\,\mathrm{d}x

  $$


  两边同除以 2：


  $$

  I = \frac{\pi}{4} \int_0^{\frac{\pi}{2}} \frac{1}{1 + \sin x + \cos x}\,\mathrm{d}x

  $$


  证毕．'
feedback:
  correct: 熟练运用区间倒换 $x = \pi/2 - t$ 与三角诱导公式两式相加完成证明．
  incorrect: 证明提示：经典定积分变换 $x = \pi/2 - t$，分母对称不变，分子分离出 $\pi/2 - x$ 移项即得系数 $\pi/4$．
