stem: '设 $f(x)$ 在闭区间 $[0, 1]$ 上连续可微，且 $f(0) = 0$．


  证明：在开区间 $(0, 1)$ 中存在一点 $\xi$，满足 $(1 - \xi)f''(\xi) = f(\xi)$．'
