reference_answer: 构造辅助函数 $F(x) = (1-x)f(x)$，在 $[0, 1]$ 上应用罗尔中值定理即可证明．
solution: '将待证式改写为 $(1 - \xi)f''(\xi) - f(\xi) = 0$．


  观察发现 $[(1 - x)f(x)]'' = -f(x) + (1 - x)f''(x) = (1 - x)f''(x) - f(x)$．


  因此构造辅助函数：


  $$

  F(x) = (1 - x)f(x)

  $$


  验证罗尔中值定理的条件：


  1. 因为 $f(x)$ 在 $[0, 1]$ 上连续可微，所以 $F(x)$ 在 $[0, 1]$ 上连续，在 $(0, 1)$ 上可导；

  2. 端点值：$F(0) = (1 - 0)f(0) = 0$（由已知 $f(0) = 0$）；$F(1) = (1 - 1)f(1) = 0$．即 $F(0) = F(1) = 0$．


  根据罗尔中值定理，在开区间 $(0, 1)$ 内至少存在一点 $\xi \in (0, 1)$，使得：


  $$

  F''(\xi) = 0

  $$


  即：


  $$

  (1 - \xi)f''(\xi) - f(\xi) = 0 \implies (1 - \xi)f''(\xi) = f(\xi)

  $$


  证毕．'
feedback:
  correct: 敏锐利用乘积求导法则构造辅助函数 $F(x)=(1-x)f(x)$ 并直接应用罗尔定理．
  incorrect: 构造辅助函数法：由 $(1-x)f'(x)-f(x) = [(1-x)f(x)]'$ 直接构造 $F(x)=(1-x)f(x)$．
