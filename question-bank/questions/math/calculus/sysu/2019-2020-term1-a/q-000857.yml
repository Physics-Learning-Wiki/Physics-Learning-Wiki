reference_answer: $\lim_{x\to 0} \frac{\int_0^x (x-t)f(t)\,\mathrm{d}t}{x^2} = \frac{f(0)}{2}$．
solution: '拆分变上限积分中的变量 $x$（注意积分变量为 $t$）：


  $$

  \int_0^x (x-t)f(t)\,\mathrm{d}t = x \int_0^x f(t)\,\mathrm{d}t - \int_0^x t f(t)\,\mathrm{d}t

  $$


  该极限为 $\frac{0}{0}$ 型未定式，应用洛必达法则对分子分母关于 $x$ 求导：


  $$

  \frac{\mathrm{d}}{\mathrm{d}x}\left(x \int_0^x f(t)\,\mathrm{d}t - \int_0^x t f(t)\,\mathrm{d}t\right) = \int_0^x f(t)\,\mathrm{d}t
  + x f(x) - x f(x) = \int_0^x f(t)\,\mathrm{d}t

  $$


  分母求导为 $2x$．所以：


  $$

  \lim_{x\to 0} \frac{\int_0^x (x-t)f(t)\,\mathrm{d}t}{x^2} = \lim_{x\to 0} \frac{\int_0^x f(t)\,\mathrm{d}t}{2x}

  $$


  再次应用洛必达法则（或微积分基本定理导数定义）：


  $$

  \lim_{x\to 0} \frac{\int_0^x f(t)\,\mathrm{d}t}{2x} = \lim_{x\to 0} \frac{f(x)}{2} = \frac{f(0)}{2}

  $$'
feedback:
  correct: 正确拆分变上限积分提出变量 $x$ 并两次应用洛必达法则求得 $f(0)/2$．
  incorrect: 求导关键：积分内含被积变量 $x$，必须先拆成 $x\int_0^x f(t)\,\mathrm{d}t - \int_0^x tf(t)\,\mathrm{d}t$ 才能对 $x$ 求导．
