reference_answer: '当 $n$ 为奇数时，$f^{(n)}(0) = 0$；当 $n$ 为偶数 $2m$（$m \ge 1$）时，$f^{(2m)}(0) = (-1)^m (2 + 2^{2m-1})$（$f(0)=4$）．


  泰勒展式为 $f(x) = 4 + \sum_{m=1}^{\lfloor n/2 \rfloor} (-1)^m \frac{2 + 2^{2m-1}}{(2m)!} x^{2m} + o(x^n)$．'
solution: '展开平方：


  $$

  f(x) = (1 + \cos x)^2 = 1 + 2\cos x + \cos^2 x = 1 + 2\cos x + \frac{1 + \cos 2x}{2} = \frac{3}{2} + 2\cos x + \frac{1}{2}\cos
  2x

  $$


  利用标准余弦展开式 $\cos u = \sum_{m=0}^k \frac{(-1)^m}{(2m)!} u^{2m} + o(u^{2k+1})$：


  $$

  \cos x = \sum_{m=0}^{\lfloor n/2 \rfloor} \frac{(-1)^m}{(2m)!} x^{2m} + o(x^n)

  $$


  $$

  \cos 2x = \sum_{m=0}^{\lfloor n/2 \rfloor} \frac{(-1)^m}{(2m)!} (2x)^{2m} + o(x^n) = \sum_{m=0}^{\lfloor n/2 \rfloor} \frac{(-1)^m
  2^{2m}}{(2m)!} x^{2m} + o(x^n)

  $$


  合并常数项（$m=0$ 时）：


  $$

  \frac{3}{2} + 2(1) + \frac{1}{2}(1) = 4

  $$


  对 $m \ge 1$，第 $2m$ 次项系数为：


  $$

  a_{2m} = 2 \cdot \frac{(-1)^m}{(2m)!} + \frac{1}{2} \cdot \frac{(-1)^m 2^{2m}}{(2m)!} = (-1)^m \frac{2 + 2^{2m-1}}{(2m)!}

  $$


  奇数次项系数全部为 0．


  由泰勒展开系数 $a_k = \frac{f^{(k)}(0)}{k!}$：


  - 当 $n$ 为奇数时，$f^{(n)}(0) = 0$；

  - 当 $n$ 为偶数 $2m$（$m \ge 1$）时，$f^{(2m)}(0) = (-1)^m (2 + 2^{2m-1})$；当 $n=0$ 时 $f(0) = 4$．'
feedback:
  correct: 正确使用半角降幂公式化为单个余弦项之和，并写出通项导数与泰勒公式．
  incorrect: 关键化简技巧：$(1+\cos x)^2 = \frac{3}{2} + 2\cos x + \frac{1}{2}\cos 2x$，分别对 $\cos x$ 和 $\cos 2x$ 应用标准展开．
