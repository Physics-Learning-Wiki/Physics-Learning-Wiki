stem: 求函数 $F(x, y, z) = \frac{y}{x}$ 在点 $M\left(\frac{1}{2}, \frac{1}{2}, 1\right)$ 处沿曲面 $x^2 + 2y^2 + \frac{z^2}{4} = 1$
  的外法线方向的方向导数．
