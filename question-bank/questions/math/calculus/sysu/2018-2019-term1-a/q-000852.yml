reference_answer: $\frac{\partial F}{\partial \mathbf{n}^0} = -\frac{2}{3}$．
solution: '**1. 求曲面在点 $M$ 处的外法线单位向量：**


  设曲面方程为 $G(x, y, z) = x^2 + 2y^2 + \frac{z^2}{4} - 1 = 0$．其法向量为：


  $$

  \nabla G = \left(2x, 4y, \frac{z}{2}\right)

  $$


  在点 $M\left(\frac{1}{2}, \frac{1}{2}, 1\right)$ 处：


  $$

  \mathbf{n} = \nabla G|_M = \left(1, 2, \frac{1}{2}\right)

  $$


  外法线方向指向曲面外侧，模长为：


  $$

  |\mathbf{n}| = \sqrt{1^2 + 2^2 + \left(\frac{1}{2}\right)^2} = \sqrt{1 + 4 + \frac{1}{4}} = \sqrt{\frac{21}{4}} = \frac{\sqrt{21}}{2}

  $$


  单位外法向量为：


  $$

  \mathbf{n}^0 = \frac{\mathbf{n}}{|\mathbf{n}|} = \left(\frac{2}{\sqrt{21}}, \frac{4}{\sqrt{21}}, \frac{1}{\sqrt{21}}\right)

  $$


  **2. 求函数 $F(x, y, z) = \frac{y}{x}$ 在点 $M$ 处的梯度：**


  $$

  \nabla F = \left(-\frac{y}{x^2}, \frac{1}{x}, 0\right)

  $$


  在点 $M\left(\frac{1}{2}, \frac{1}{2}, 1\right)$ 处：


  $$

  \nabla F|_M = \left(-\frac{1/2}{(1/2)^2}, \frac{1}{1/2}, 0\right) = (-2, 2, 0)

  $$


  **3. 计算方向导数：**


  $$

  \frac{\partial F}{\partial \mathbf{n}^0} = \nabla F|_M \cdot \mathbf{n}^0 = (-2) \cdot \frac{2}{\sqrt{21}} + 2 \cdot \frac{4}{\sqrt{21}}
  + 0 = \frac{-4 + 8}{\sqrt{21}} = \frac{4}{\sqrt{21}} = \frac{4\sqrt{21}}{21}

  $$'
feedback:
  correct: 正确计算梯度与外法线单位向量并求得方向导数．
  incorrect: 方向导数等于梯度与单位方向向量的点积，外法向量需先归一化为单位向量．
