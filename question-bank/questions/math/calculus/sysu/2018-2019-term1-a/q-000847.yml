reference_answer: $\int_0^{2\pi} x\cos^2 x\,\mathrm{d}x = \pi^2$．
solution: '**方法一（降幂分部积分法）：**


  利用降幂公式 $\cos^2 x = \frac{1 + \cos 2x}{2}$：


  $$

  \int_0^{2\pi} x\cos^2 x\,\mathrm{d}x = \frac{1}{2}\int_0^{2\pi} x\,\mathrm{d}x + \frac{1}{2}\int_0^{2\pi} x\cos 2x\,\mathrm{d}x

  $$


  第一项：


  $$

  \frac{1}{2}\left[\frac{x^2}{2}\right]_0^{2\pi} = \frac{1}{4}(4\pi^2) = \pi^2

  $$


  第二项采用分部积分：


  $$

  \int_0^{2\pi} x\cos 2x\,\mathrm{d}x = \left[\frac{x\sin 2x}{2}\right]_0^{2\pi} - \frac{1}{2}\int_0^{2\pi} \sin 2x\,\mathrm{d}x
  = 0 - \left[-\frac{\cos 2x}{4}\right]_0^{2\pi} = 0

  $$


  因此：


  $$

  \int_0^{2\pi} x\cos^2 x\,\mathrm{d}x = \pi^2 + 0 = \pi^2

  $$


  **方法二（区间对称换元法）：**


  设 $x = 2\pi - t$，则 $\cos^2(2\pi - t) = \cos^2 t$．


  $$I = \int_0^{2\pi} (2\pi - t)\cos^2 t\,\mathrm{d}t = 2\pi \int_0^{2\pi} \cos^2 t\,\mathrm{d}t - I$$


  $$2I = 2\pi \cdot \pi \implies I = \pi^2$$'
feedback:
  correct: 正确使用降幂公式或区间对称换元求得 $\pi^2$．
  incorrect: 请注意：$\cos^2 x = (1+\cos 2x)/2$，其中 $x\cos 2x$ 在 $[0, 2\pi]$ 上的积分为 0，积分完全由 $x/2$ 贡献．
