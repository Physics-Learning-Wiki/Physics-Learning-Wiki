reference_answer: 函数在 $(0, 0)$ 处连续，偏导数 $f_x(0,0)=0, f_y(0,0)=0$ 存在，且在 $(0, 0)$ 处可微．
solution: '**1. 连续性：**


  当 $(x, y) \neq (0, 0)$ 时，由极坐标变换 $x = r\cos\theta, y = r\sin\theta$：


  $$

  |f(x, y)| = \frac{r^6 |\cos^3\theta \sin^3\theta|}{r^2} = r^4 |\cos^3\theta \sin^3\theta| \le r^4 = (x^2 + y^2)^2

  $$


  当 $(x, y) \to (0, 0)$ 时，$r^4 \to 0$，所以 $\lim_{(x, y)\to (0, 0)} f(x, y) = 0 = f(0, 0)$．


  因此 $f(x, y)$ 在 $(0, 0)$ 处连续．


  **2. 偏导数的存在性：**


  按偏导数定义：


  $$

  f_x(0, 0) = \lim_{x\to 0} \frac{f(x, 0) - f(0, 0)}{x} = \lim_{x\to 0} \frac{0 - 0}{x} = 0

  $$


  $$

  f_y(0, 0) = \lim_{y\to 0} \frac{f(0, y) - f(0, 0)}{y} = \lim_{y\to 0} \frac{0 - 0}{y} = 0

  $$


  两偏导数均存在且为 0．


  **3. 可微性：**


  考察可微性判别极限：


  $$

  \lim_{(x, y)\to(0, 0)} \frac{f(x, y) - f(0, 0) - f_x(0,0)x - f_y(0,0)y}{\sqrt{x^2+y^2}} = \lim_{(x, y)\to(0, 0)} \frac{x^3
  y^3}{(x^2+y^2)^{\frac{3}{2}}}

  $$


  代入极坐标：


  $$

  \frac{r^6 \cos^3\theta \sin^3\theta}{r^3} = r^3 \cos^3\theta \sin^3\theta

  $$


  因为 $|r^3 \cos^3\theta \sin^3\theta| \le r^3 \to 0$（当 $r \to 0$ 时）．


  因此该极限等于 0，根据全微分定义，函数在 $(0, 0)$ 处**可微**．'
feedback:
  correct: 严谨证明了连续性、偏导数存在性，并通过极坐标放缩 $r^3 \to 0$ 论证了可微性．
  incorrect: 请注意分子次数为 6，分母在可微性检验中为 $r^3$，比值次数为 $r^3 \to 0$，极限为 0，故函数在原点确实可微！
