stem: '求通过两平行直线 $l_1: \frac{x-1}{2} = \frac{y+1}{-1} = \frac{z+1}{1}$ 和 $l_2: \frac{x+2}{-4} = \frac{y-2}{2} = \frac{z}{-2}$
  的平面方程．'
