reference_answer: $4x + 5y - 3z + 2 = 0$（或 $-4x - 5y + 3z - 2 = 0$）．
solution: '直线 $l_1$ 经过点 $M_1(1, -1, -1)$，方向向量为 $\mathbf{s}_1 = (2, -1, 1)$．


  直线 $l_2$ 经过点 $M_2(-2, 2, 0)$，方向向量为 $\mathbf{s}_2 = (-4, 2, -2) = -2\mathbf{s}_1$，两直线平行．


  两直线确定的平面包含向量 $\mathbf{s}_1$ 以及连接两直线上两点的向量 $\vec{M_1 M_2}$：


  $$

  \vec{M_1 M_2} = (-2 - 1, 2 - (-1), 0 - (-1)) = (-3, 3, 1)

  $$


  平面的法向量垂直于 $\mathbf{s}_1$ 与 $\vec{M_1 M_2}$：


  $$

  \mathbf{n} = \mathbf{s}_1 \times \vec{M_1 M_2} = \begin{vmatrix} \mathbf{i} & \mathbf{j} & \mathbf{k} \\ 2 & -1 & 1 \\ -3
  & 3 & 1 \end{vmatrix} = (-1 - 3)\mathbf{i} - (2 - (-3))\mathbf{j} + (6 - 3)\mathbf{k} = (-4, -5, 3)

  $$


  取法向量 $\mathbf{n} = (4, 5, -3)$．平面过点 $M_1(1, -1, -1)$，代入点法式方程：


  $$

  4(x - 1) + 5(y + 1) - 3(z + 1) = 0

  $$


  展开化简：


  $$

  4x + 5y - 3z - 4 + 5 - 3 = 0 \implies 4x + 5y - 3z - 2 = 0

  $$'
feedback:
  correct: 正确计算平行线间的位移向量并叉积求出平面法向量与平面方程．
  incorrect: 两直线平行时方向向量线性相关，必须从两条直线上各取一点构造差向量 $\vec{M_1 M_2}$ 再做叉积．
