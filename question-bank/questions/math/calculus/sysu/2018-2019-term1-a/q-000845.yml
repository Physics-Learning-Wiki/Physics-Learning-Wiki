reference_answer: $\frac{\mathrm{d}y}{\mathrm{d}x} = -\frac{y\cos x + 2x\sin(x^2+y)}{\sin x + \sin(x^2+y)}$．
solution: '方程两边关于 $x$ 求导（将 $y$ 视为 $x$ 的函数）：


  $$

  \frac{\mathrm{d}}{\mathrm{d}x}[y\sin x] - \frac{\mathrm{d}}{\mathrm{d}x}[\cos(x^2+y)] = 0

  $$


  分别求导：


  $$

  y'' \sin x + y \cos x - [-\sin(x^2+y)] \cdot (2x + y'') = 0

  $$


  $$

  y'' \sin x + y \cos x + 2x \sin(x^2+y) + y'' \sin(x^2+y) = 0

  $$


  合并 $y''$ 的系数：


  $$

  [\sin x + \sin(x^2+y)] y'' = -[y\cos x + 2x\sin(x^2+y)]

  $$


  当分母不为 0 时：


  $$

  \frac{\mathrm{d}y}{\mathrm{d}x} = -\frac{y\cos x + 2x\sin(x^2+y)}{\sin x + \sin(x^2+y)}

  $$'
feedback:
  correct: 正确应用隐函数链式法则解得一阶导数．
  incorrect: 求导注意复合函数求导：$\frac{\mathrm{d}}{\mathrm{d}x}\cos(x^2+y) = -\sin(x^2+y) \cdot (2x + y')$，不要漏掉内部的 $y'$．
