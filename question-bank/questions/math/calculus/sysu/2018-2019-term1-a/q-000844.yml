reference_answer: $\lim_{n\to\infty} \frac{3n^2 + 2n - 1}{\sqrt{n^4 + n^3 + 2}} = 3$．
solution: '该极限为 $\frac{\infty}{\infty}$ 型，分子分母最高次幂均为 $n^2$（分母根号下为 $n^4$）．


  分子分母同除以 $n^2$：


  $$

  \frac{3n^2 + 2n - 1}{\sqrt{n^4 + n^3 + 2}} = \frac{3 + \frac{2}{n} - \frac{1}{n^2}}{\sqrt{1 + \frac{1}{n} + \frac{2}{n^4}}}

  $$


  当 $n \to \infty$ 时，各负幂次项均趋于 0：


  $$

  \lim_{n\to\infty} \frac{3 + \frac{2}{n} - \frac{1}{n^2}}{\sqrt{1 + \frac{1}{n} + \frac{2}{n^4}}} = \frac{3 + 0 - 0}{\sqrt{1
  + 0 + 0}} = 3

  $$'
feedback:
  correct: 正确提取最高阶主部 $n^2$ 得到极限 3．
  incorrect: 分式抓大头：分子最高次项为 $3n^2$，分母最高次项为 $\sqrt{n^4} = n^2$，比值为 3．
