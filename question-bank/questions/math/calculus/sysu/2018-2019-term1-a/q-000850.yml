reference_answer: '极值点：极大值点 $x = 3$（极大值为 $\frac{27}{e^3}$），$x = 0$ 不是极值点；


  拐点：$(0, 0)$ 和 $(3 \pm \sqrt{3}, f(3 \pm \sqrt{3}))$；


  渐近线：水平渐近线 $y = 0$（当 $x \to +\infty$ 时），无铅直渐近线．'
solution: '定义域为 $(-\infty, +\infty)$．


  **1. 单调性与极值：**


  求一阶导数：


  $$

  f''(x) = 3x^2 e^{-x} - x^3 e^{-x} = x^2(3 - x)e^{-x}

  $$


  令 $f''(x) = 0$，驻点为 $x = 0$ 和 $x = 3$．


  - 当 $x < 0$ 时，$f''(x) > 0$，单调递增；

  - 当 $0 < x < 3$ 时，$f''(x) > 0$，单调递增；

  - 当 $x > 3$ 时，$f''(x) < 0$，单调递减．


  在 $x=0$ 两侧导数不改变符号，故 $x=0$ 不是极值点；


  在 $x=3$ 处导数由正变负，故 $x=3$ 是极大值点，极大值为 $f(3) = 27e^{-3} = \frac{27}{e^3}$．


  **2. 凹凸性与拐点：**


  求二阶导数：


  $$

  f''''(x) = (2x(3-x) - x^2)e^{-x} - x^2(3-x)e^{-x} = x(x^2 - 6x + 6)e^{-x}

  $$


  令 $f''''(x) = 0$，解得 $x_1 = 0, x_{2,3} = 3 \pm \sqrt{3}$．


  在这三点两侧二阶导数均变号，因此拐点有 3 个：$(0, 0)$，$(3-\sqrt{3}, f(3-\sqrt{3}))$，$(3+\sqrt{3}, f(3+\sqrt{3}))$．


  **3. 渐近线：**


  - 当 $x \to +\infty$ 时，$\lim_{x\to+\infty} x^3 e^{-x} = 0$，所以水平渐近线为 $y = 0$；

  - 当 $x \to -\infty$ 时，$\lim_{x\to-\infty} x^3 e^{-x} = -\infty$，且 $\lim_{x\to-\infty} \frac{f(x)}{x} = +\infty$，无斜渐近线；

  - 在实数轴上连续，无铅直渐近线．'
feedback:
  correct: 正确分析驻点并指出 $x=0$ 不是极值点，完整求得极大值、3个拐点与水平渐近线．
  incorrect: 易错点：$x=0$ 处一阶导数为 0 但两侧导数均大于 0，故不是极值点而是拐点；拐点由 $x(x^2-6x+6)=0$ 给出 3 个点．
