reference_answer: $L = \frac{3\pi a}{2}$．
solution: '在极坐标系下，由于 $\rho \ge 0$，要求 $\sin^3\left(\frac{\theta}{3}\right) \ge 0$，从而 $0 \le \frac{\theta}{3} \le \pi$，即 $\theta
  \in [0, 3\pi]$．


  计算 $\rho$ 关于 $\theta$ 的导数：


  $$

  \frac{\mathrm{d}\rho}{\mathrm{d}\theta} = 3a \sin^2\left(\frac{\theta}{3}\right) \cos\left(\frac{\theta}{3}\right) \cdot
  \frac{1}{3} = a \sin^2\left(\frac{\theta}{3}\right) \cos\left(\frac{\theta}{3}\right)

  $$


  计算弧长微元 $\mathrm{d}s = \sqrt{\rho^2 + \left(\frac{\mathrm{d}\rho}{\mathrm{d}\theta}\right)^2}\,\mathrm{d}\theta$：


  $$

  \rho^2 + \left(\frac{\mathrm{d}\rho}{\mathrm{d}\theta}\right)^2 = a^2 \sin^6\left(\frac{\theta}{3}\right) + a^2 \sin^4\left(\frac{\theta}{3}\right)
  \cos^2\left(\frac{\theta}{3}\right)

  $$


  $$

  = a^2 \sin^4\left(\frac{\theta}{3}\right) \left[\sin^2\left(\frac{\theta}{3}\right) + \cos^2\left(\frac{\theta}{3}\right)\right]
  = a^2 \sin^4\left(\frac{\theta}{3}\right)

  $$


  开根号（由于 $\frac{\theta}{3} \in [0, \pi]$，$\sin\left(\frac{\theta}{3}\right) \ge 0$）：


  $$

  \mathrm{d}s = a \sin^2\left(\frac{\theta}{3}\right)\,\mathrm{d}\theta

  $$


  计算全长积分：


  $$

  L = \int_0^{3\pi} a \sin^2\left(\frac{\theta}{3}\right)\,\mathrm{d}\theta

  $$


  令 $u = \frac{\theta}{3}$，$\mathrm{d}\theta = 3\,\mathrm{d}u$，$u \in [0, \pi]$：


  $$

  L = 3a \int_0^\pi \sin^2 u\,\mathrm{d}u = 3a \cdot \frac{\pi}{2} = \frac{3\pi a}{2}

  $$'
feedback:
  correct: 正确确定极角范围 $[0, 3\pi]$，熟练计算极坐标弧长微元并求得 $\frac{3\pi a}{2}$．
  incorrect: 请注意：极坐标封闭曲线范围由 $\rho \ge 0$ 确定为 $\theta \in [0, 3\pi]$；弧长微元为 $\sqrt{\rho^2 + (\rho')^2}\,\mathrm{d}\theta$．
