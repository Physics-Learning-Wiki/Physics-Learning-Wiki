reference_answer: $\lim_{x\to 0} \left(\frac{1+x}{1-e^{-x}} - \frac{1}{x}\right) = \frac{3}{2}$．
solution: '极限为 $\infty - \infty$ 型未定式，先通分化为分式：


  $$

  \frac{1+x}{1-e^{-x}} - \frac{1}{x} = \frac{x(1+x) - (1-e^{-x})}{x(1-e^{-x})}

  $$


  当 $x \to 0$ 时，分母等价无穷小代换：$1 - e^{-x} \sim x$，故分母为 $x \cdot x = x^2$：


  $$

  \lim_{x\to 0} \frac{x + x^2 - 1 + e^{-x}}{x^2}

  $$


  利用 $e^{-x}$ 在 $x=0$ 处的泰勒展开：


  $$

  e^{-x} = 1 - x + \frac{x^2}{2} + o(x^2)

  $$


  分子为：


  $$

  x + x^2 - 1 + \left(1 - x + \frac{x^2}{2} + o(x^2)\right) = \frac{3}{2}x^2 + o(x^2)

  $$


  因此：


  $$

  \lim_{x\to 0} \frac{\frac{3}{2}x^2 + o(x^2)}{x^2} = \frac{3}{2}

  $$'
feedback:
  correct: 正确通分并利用分母等价无穷小与分子泰勒展开求得 3/2．
  incorrect: 通分后分子展开：$e^{-x} = 1 - x + x^2/2 + o(x^2)$，注意分子一次项抵消后二次项系数为 $1 + 1/2 = 3/2$．
