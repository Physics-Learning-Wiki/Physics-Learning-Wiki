reference_answer: $2\sqrt{e^x - 2} - 2\sqrt{2}\arctan\left(\frac{\sqrt{e^x-2}}{\sqrt{2}}\right) + C$．
solution: '令 $t = \sqrt{e^x - 2}$（$t \ge 0$），则 $e^x - 2 = t^2 \implies e^x = t^2 + 2$．


  两边取对数求微分：$x = \ln(t^2 + 2) \implies \mathrm{d}x = \frac{2t}{t^2 + 2}\,\mathrm{d}t$．


  代入不定积分：


  $$

  \int \sqrt{e^x - 2}\,\mathrm{d}x = \int t \cdot \frac{2t}{t^2 + 2}\,\mathrm{d}t = 2 \int \frac{t^2}{t^2 + 2}\,\mathrm{d}t

  $$


  拆分分子：


  $$

  2 \int \frac{(t^2 + 2) - 2}{t^2 + 2}\,\mathrm{d}t = 2 \int \left(1 - \frac{2}{t^2 + 2}\right)\,\mathrm{d}t

  $$


  $$

  = 2t - 4 \int \frac{1}{t^2 + (\sqrt{2})^2}\,\mathrm{d}t = 2t - 4 \cdot \frac{1}{\sqrt{2}} \arctan\left(\frac{t}{\sqrt{2}}\right)
  + C

  $$


  $$

  = 2t - 2\sqrt{2} \arctan\left(\frac{t}{\sqrt{2}}\right) + C

  $$


  回代 $t = \sqrt{e^x - 2}$：


  $$

  \int \sqrt{e^x - 2}\,\mathrm{d}x = 2\sqrt{e^x - 2} - 2\sqrt{2}\arctan\left(\frac{\sqrt{e^x-2}}{\sqrt{2}}\right) + C

  $$'
feedback:
  correct: 正确设根式为 $t$ 完成换元并准确积分回代．
  incorrect: 换元后 $\mathrm{d}x = \frac{2t}{t^2+2}\,\mathrm{d}t$，有理分式积分利用 $\int \frac{1}{t^2+a^2}\,\mathrm{d}t = \frac{1}{a}\arctan(t/a)$．
