  rubric:
  - id: incomplete
    label: 尚未掌握：换元微分错误导致被积表达式不正确
    points: 0
  - id: partial
    label: 部分掌握：正确化为关于 t 的积分，但在 arctan 系数或回代上有失误
    points: 0.5
  - id: complete
    label: 基本掌握：正确完成换元积分并准确回代写出常数 C
