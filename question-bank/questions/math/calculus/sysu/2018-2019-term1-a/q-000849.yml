reference_answer: 最短距离为 $\frac{\sqrt{2}}{2}$．
solution: '设曲面上点为 $P(x, y, z)$，原点到 $P$ 的距离平方为 $f(x, y, z) = x^2 + y^2 + z^2$．


  约束条件为 $(x-y)^2 + z^2 = 1$．


  **方法一（代数消元法）：**


  由曲面方程 $z^2 = 1 - (x-y)^2 \ge 0$（要求 $|x-y| \le 1$）．代入距离平方：


  $$

  d^2 = x^2 + y^2 + 1 - (x-y)^2 = x^2 + y^2 + 1 - (x^2 - 2xy + y^2) = 2xy + 1

  $$


  因为 $(x-y)^2 = x^2 - 2xy + y^2 \ge 0$，所以 $2xy \le x^2 + y^2$；更直接地，改写为变量变换：


  令 $u = x-y, v = x+y$，则 $u^2 + z^2 = 1$ 且 $x^2 + y^2 = \frac{u^2 + v^2}{2}$．


  代入距离平方：


  $$

  d^2 = \frac{u^2 + v^2}{2} + z^2 = \frac{u^2 + v^2}{2} + (1 - u^2) = 1 - \frac{u^2}{2} + \frac{v^2}{2}

  $$


  要使 $d^2$ 最小，必须取 $v = 0$（即 $x + y = 0 \implies y = -x$），且取 $u^2$ 的最大可能值．


  因为 $u^2 + z^2 = 1$ 且 $z^2 \ge 0$，所以 $u^2 \le 1$，最大值为 $u^2 = 1$（此时 $z = 0$）．


  代入得 $d^2$ 的最小值：


  $$

  d_{\min}^2 = 1 - \frac{1}{2} + 0 = \frac{1}{2}

  $$


  因此原点到曲面的最短距离为：


  $$

  d_{\min} = \sqrt{\frac{1}{2}} = \frac{\sqrt{2}}{2}

  $$'
feedback:
  correct: 巧妙通过变量代换或拉格朗日乘数法求得最短距离 $\frac{\sqrt{2}}{2}$．
  incorrect: 请注意题目求的是原点到曲面的距离（非平方），消元后最小值点为 $u^2=1, v=0, z=0$，距离平方为 $1/2$，距离为 $\sqrt{2}/2$．
