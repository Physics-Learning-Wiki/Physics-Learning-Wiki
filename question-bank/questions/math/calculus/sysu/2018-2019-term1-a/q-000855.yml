reference_answer: (1) 由变上限积分求导结合基本均值不等式可得 $F'(x) = f(x) + \frac{1}{f(x)} \ge 2$；(2) 结合单调性与零点定理可证在 $(a, b)$ 内有且仅有一个根．
solution: '**(1) 证明 $F''(x) \ge 2$：**


  根据变上限积分的求导法则：


  $$

  F''(x) = \frac{\mathrm{d}}{\mathrm{d}x} \int_a^x f(t)\,\mathrm{d}t + \frac{\mathrm{d}}{\mathrm{d}x} \int_b^x \frac{1}{f(t)}\,\mathrm{d}t
  = f(x) + \frac{1}{f(x)}

  $$


  因为已知 $f(x) > 0$，由基本不等式 $u + \frac{1}{u} \ge 2$（当且仅当 $u = 1$ 时等号成立）：


  $$

  F''(x) = f(x) + \frac{1}{f(x)} \ge 2\sqrt{f(x) \cdot \frac{1}{f(x)}} = 2

  $$


  **(2) 证明方程 $F(x) = 0$ 在 $(a, b)$ 内有且仅有一个根：**


  考察两端点处 $F(x)$ 的函数值：


  - 在 $x = a$ 处：


  $$

  F(a) = \int_a^a f(t)\,\mathrm{d}t + \int_b^a \frac{1}{f(t)}\,\mathrm{d}t = 0 - \int_a^b \frac{1}{f(t)}\,\mathrm{d}t = -\int_a^b
  \frac{1}{f(t)}\,\mathrm{d}t

  $$


  因为在 $[a, b]$ 上 $f(t) > 0$，所以 $\frac{1}{f(t)} > 0$ 且 $b > a$，故 $\int_a^b \frac{1}{f(t)}\,\mathrm{d}t > 0$，因此 $F(a) < 0$．


  - 在 $x = b$ 处：


  $$

  F(b) = \int_a^b f(t)\,\mathrm{d}t + \int_b^b \frac{1}{f(t)}\,\mathrm{d}t = \int_a^b f(t)\,\mathrm{d}t + 0 > 0

  $$


  因为 $F(x)$ 在 $[a, b]$ 上连续，且 $F(a) < 0, F(b) > 0$，由零点定理，存在 $\xi \in (a, b)$ 使得 $F(\xi) = 0$（根的存在性）．


  又由第 (1) 问知，在 $[a, b]$ 上 $F''(x) \ge 2 > 0$，所以 $F(x)$ 在 $[a, b]$ 上严格单调递增．


  由严格单调性可知零点必然唯一（根的唯一性）．


  综上，方程 $F(x) = 0$ 在 $(a, b)$ 内有且仅有一个根．'
feedback:
  correct: 严密利用变上限求导、均值不等式、零点定理与单调性完成存在性与唯一性证明．
  incorrect: 证明步骤：变上限积分导数为 $f(x)+1/f(x) \ge 2$ 保证严格单调增；验证 $F(a)<0$ 与 $F(b)>0$ 应用零点定理．
