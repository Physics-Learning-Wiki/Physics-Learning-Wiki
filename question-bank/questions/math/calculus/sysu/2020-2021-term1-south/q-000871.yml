reference_answer: $a = \ln 2$．
solution: '底数 $\frac{x+2a}{x-a} = 1 + \frac{3a}{x-a} \to 1$，指数 $x \to \infty$，属于 $1^\infty$ 型未定式．


  变形计算极限：


  $$

  \lim_{x \to \infty} \left( 1 + \frac{3a}{x-a} \right)^x = e^{\lim_{x \to \infty} \frac{3ax}{x-a}} = e^{3a}

  $$


  由题设 $e^{3a} = 8 = 2^3$，两边取对数得 $3a = 3\ln 2$，即 $a = \ln 2$．'
feedback:
  correct: 正确完成 $1^\infty$ 型极限变形并解得待定参数 $a$．
  incorrect: $1^\infty$ 型极限标准公式为 $e^{\lim (u-1)v}$．
