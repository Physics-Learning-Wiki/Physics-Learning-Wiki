reference_answer: $\lim_{x \to 0} \frac{\int_{\cos^2 x}^1 \sqrt{1+t^2}\,\mathrm{d}t}{x^2} = \sqrt{2}$．
solution: '当 $x \to 0$ 时，$\cos^2 x \to 1$，分子分母均趋于 $0$，属于 $\frac{0}{0}$ 型未定式．


  对分子变限积分求导：


  $$

  \frac{\mathrm{d}}{\mathrm{d}x} \int_{\cos^2 x}^1 \sqrt{1+t^2}\,\mathrm{d}t = -\sqrt{1+(\cos^2 x)^2} \cdot (\cos^2 x)'' =
  -\sqrt{1+\cos^4 x} \cdot (-2\sin x \cos x) = \sqrt{1+\cos^4 x} \sin 2x

  $$


  应用洛必达法则：


  $$

  \lim_{x \to 0} \frac{\int_{\cos^2 x}^1 \sqrt{1+t^2}\,\mathrm{d}t}{x^2} = \lim_{x \to 0} \frac{\sqrt{1+\cos^4 x} \sin 2x}{2x}

  $$


  因为当 $x \to 0$ 时，$\sqrt{1+\cos^4 x} \to \sqrt{2}$，且 $\lim_{x \to 0} \frac{\sin 2x}{2x} = 1$．因此极限值为 $\sqrt{2} \cdot 1 = \sqrt{2}$．'
feedback:
  correct: 正确运用变下限积分求导法则与洛必达法则求得极限．
  incorrect: 注意变下限求导需带负号：$(\int_{u(x)}^c f(t)\,\mathrm{d}t)' = -f(u(x))u'(x)$．
