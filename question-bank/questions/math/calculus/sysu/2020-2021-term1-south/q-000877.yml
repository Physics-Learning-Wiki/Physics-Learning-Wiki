reference_answer: 不等式在区间 $(0, \pi/2)$ 上恒成立．
solution: '不等式等价于 $\tan x \sin x - x^2 > 0$．令辅助函数 $f(x) = \tan x \sin x - x^2$（$x \in [0, \pi/2)$），$f(0) = 0$．


  求导得：


  $$

  f''(x) = \sec^2 x \sin x + \tan x \cos x - 2x = \tan x \left( \frac{1}{\cos x} + \cos x \right) - 2x

  $$


  在 $(0, \pi/2)$ 内，由均值不等式 $\frac{1}{\cos x} + \cos x \ge 2$（仅在 $x=0$ 取等），且 $\tan x > x > 0$．


  故 $f''(x) > x \cdot 2 - 2x = 0$．函数 $f(x)$ 在 $[0, \pi/2)$ 上严格单调递增．


  因此当 $x \in (0, \pi/2)$ 时，$f(x) > f(0) = 0$，即 $\frac{\tan x}{x} > \frac{x}{\sin x}$ 恒成立．'
feedback:
  correct: 正确构造辅助函数并通过导数放缩证明严格递增．
  incorrect: 利用 $u + 1/u \ge 2$ 与 $\tan x > x$ 可免去繁复的二阶求导．
