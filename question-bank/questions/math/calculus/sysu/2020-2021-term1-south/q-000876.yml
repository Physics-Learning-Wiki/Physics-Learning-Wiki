stem: '设函数 $f(x)$ 在点 $x_0$ 处二阶导数 $f''''(x_0)$ 存在，证明：


  $$

  \lim_{h \to 0} \frac{f(x_0+h) + f(x_0-h) - 2f(x_0)}{h^2} = f''''(x_0)

  $$'
