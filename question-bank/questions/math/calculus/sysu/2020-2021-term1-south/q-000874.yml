stem: '讨论函数：


  $$

  f(x) = \begin{cases} \frac{2^{1/x}-1}{2^{1/x}+1}, & x \neq 0 \\[2mm] 1, & x = 0 \end{cases}

  $$


  在 $x = 0$ 处的连续性．'
