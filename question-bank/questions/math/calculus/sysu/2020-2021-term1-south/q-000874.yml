reference_answer: 函数在 $x = 0$ 处不连续（$x = 0$ 为第一类跳跃间断点）．
solution: '分别计算函数在 $x = 0$ 处的左右极限：


  1. 当 $x \to 0^+$ 时，$\frac{1}{x} \to +\infty$，$2^{1/x} \to +\infty$：


  $$

  \lim_{x \to 0^+} f(x) = \lim_{x \to 0^+} \frac{1 - 2^{-1/x}}{1 + 2^{-1/x}} = \frac{1 - 0}{1 + 0} = 1

  $$


  2. 当 $x \to 0^-$ 时，$\frac{1}{x} \to -\infty$，$2^{1/x} \to 0$：


  $$

  \lim_{x \to 0^-} f(x) = \lim_{x \to 0^-} \frac{2^{1/x}-1}{2^{1/x}+1} = \frac{0 - 1}{0 + 1} = -1

  $$


  由于 $\lim_{x \to 0^+} f(x) = 1 \neq -1 = \lim_{x \to 0^-} f(x)$，左右极限不相等，故 $\lim_{x \to 0} f(x)$ 不存在．因此函数在 $x = 0$ 处不连续．'
feedback:
  correct: 正确分左右极限讨论并判定跳跃间断点．
  incorrect: 注意 $2^{1/x}$ 在 $x \to 0^+$ 趋于 $+\infty$，在 $x \to 0^-$ 趋于 $0$．
