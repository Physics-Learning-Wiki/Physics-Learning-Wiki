stem: 立体 $V$ 由平面 $z = 1$ 和椭圆锥面 $z^2 = \frac{x^2}{a^2} + \frac{y^2}{b^2}$（其中 $a > 0, b > 0, z \ge 0$）所围成，求该立体 $V$ 的体积．
