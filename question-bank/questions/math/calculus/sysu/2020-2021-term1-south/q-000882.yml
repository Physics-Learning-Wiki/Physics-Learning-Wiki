reference_answer: 立体 $V$ 的体积为 $\frac{1}{3}\pi ab$．
solution: '取高度为 $z$（$0 \le z \le 1$）的水平截面，截痕为椭圆：


  $$

  \frac{x^2}{(az)^2} + \frac{y^2}{(bz)^2} = 1

  $$


  截面面积为 $S(z) = \pi (az)(bz) = \pi ab z^2$．


  利用平行截面面积分计算立体体积：


  $$

  V = \int_0^1 S(z)\,\mathrm{d}z = \int_0^1 \pi ab z^2\,\mathrm{d}z = \left. \pi ab \frac{z^3}{3} \right|_0^1 = \frac{1}{3}\pi
  ab

  $$'
feedback:
  correct: 正确写出水平截面椭圆面积函数并积分得出体积．
  incorrect: 平行截面面积公式 $V = \int S(z)\,\mathrm{d}z$ 是求柱体、锥体体积的基本工具．
