reference_answer: 极限存在，且极限值为 $0$．
solution: '引入极坐标变换：令 $x = \rho \cos\theta, y = \rho \sin\theta$．当 $(x, y) \to (0, 0)$ 时，$\rho = \sqrt{x^2+y^2} \to 0^+$．


  代入原分式中：


  $$

  \frac{x^2 y^2}{(x^2+y^2)^{3/2}} = \frac{\rho^4 \cos^2\theta \sin^2\theta}{\rho^3} = \rho \cos^2\theta \sin^2\theta

  $$


  由于 $|\cos^2\theta \sin^2\theta| \le 1$，故：


  $$

  0 \le \left| \frac{x^2 y^2}{(x^2+y^2)^{3/2}} \right| \le \rho

  $$


  当 $\rho \to 0^+$ 时，上界 $\rho \to 0$．由夹逼准则（无穷小与有界量之积）可知，原极限存在且等于 $0$．'
feedback:
  correct: 正确运用极坐标变换与夹逼准则证明二元极限存在且为 0．
  incorrect: 二元极限证明存在不能仅验证某条直线路径，须用不等式放缩给出一致界．
