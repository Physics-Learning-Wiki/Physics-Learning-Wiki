reference_answer: $\int (\arcsin x)^2\,\mathrm{d}x = x(\arcsin x)^2 + 2\sqrt{1-x^2}\arcsin x - 2x + C$．
solution: '令 $t = \arcsin x$，则 $x = \sin t$，$\mathrm{d}x = \cos t\,\mathrm{d}t$：


  $$

  \int (\arcsin x)^2\,\mathrm{d}x = \int t^2 \cos t\,\mathrm{d}t = \int t^2\,\mathrm{d}(\sin t)

  $$


  应用分部积分法：


  $$

  = t^2 \sin t - \int \sin t \cdot 2t\,\mathrm{d}t = t^2 \sin t + 2\int t\,\mathrm{d}(\cos t) = t^2 \sin t + 2t\cos t - 2\sin
  t + C

  $$


  回代 $t = \arcsin x, \sin t = x, \cos t = \sqrt{1-x^2}$：


  $$

  = x (\arcsin x)^2 + 2\sqrt{1-x^2} \arcsin x - 2x + C

  $$


  其中 $C$ 为任意常数．'
feedback:
  correct: 正确使用换元或分部积分求得原函数．
  incorrect: 反三角积分令 $t=\arcsin x$ 代换可化为多项式与三角函数乘积，分部积分更简明．
