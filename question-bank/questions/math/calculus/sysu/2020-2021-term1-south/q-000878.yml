stem: '设函数 $f(x)$ 在闭区间 $[a, b]$ 上可导（其中 $0 < a < b$），证明存在 $\xi \in (a, b)$，使得：


  $$

  2\xi [f(b) - f(a)] = (b^2 - a^2)f''(\xi)

  $$'
