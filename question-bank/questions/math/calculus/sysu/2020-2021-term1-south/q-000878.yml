reference_answer: 命题成立，通过构造辅助函数与罗尔定理或柯西中值定理获证．
solution: '构造辅助函数：


  $$

  F(x) = (b^2 - a^2)f(x) - [f(b) - f(a)]x^2

  $$


  $F(x)$ 在 $[a, b]$ 上连续，在 $(a, b)$ 内可导，且端点值满足：


  $$

  F(a) = b^2 f(a) - a^2 f(b) = F(b)

  $$


  由罗尔中值定理，存在 $\xi \in (a, b)$ 使得 $F''(\xi) = 0$，即：


  $$

  (b^2 - a^2)f''(\xi) - 2\xi[f(b) - f(a)] = 0 \implies 2\xi [f(b) - f(a)] = (b^2 - a^2)f''(\xi)

  $$'
feedback:
  correct: 规范构造辅助函数并利用罗尔定理完成证明．
  incorrect: 亦可直接设 $g(x) = x^2$，由柯西中值定理 $\frac{f(b)-f(a)}{b^2-a^2} = \frac{f'(\xi)}{2\xi}$ 一步得出．
