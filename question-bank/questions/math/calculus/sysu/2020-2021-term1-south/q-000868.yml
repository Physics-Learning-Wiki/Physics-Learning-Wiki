reference_answer: $\lim_{n \to \infty} \frac{1^p + 2^p + 3^p + \cdots + n^p}{n^{p+1}} = \frac{1}{p+1}$．
solution: '将待求数列极限变形提取公因子 $\frac{1}{n}$：


  $$

  \lim_{n \to \infty} \frac{1^p + 2^p + \cdots + n^p}{n^{p+1}} = \lim_{n \to \infty} \frac{1}{n} \sum_{k=1}^n \left( \frac{k}{n}
  \right)^p

  $$


  根据定积分的黎曼和定义，上式即为被积函数 $f(x) = x^p$ 在闭区间 $[0, 1]$ 上的定积分：


  $$

  \int_0^1 x^p\,\mathrm{d}x = \left. \frac{x^{p+1}}{p+1} \right|_0^1 = \frac{1}{p+1}

  $$


  因此所求数列极限为 $\frac{1}{p+1}$．'
feedback:
  correct: 正确识别黎曼和并化为 $[0,1]$ 上的定积分求解．
  incorrect: 遇到形如 $\frac{1}{n}\sum f(k/n)$ 的和式极限，优先考虑定积分定义．
