reference_answer: $y^{(n)} = (-1)^n n! \left[ \frac{1}{(x+2)^{n+1}} - \frac{1}{(x+3)^{n+1}} \right]$．
solution: '将分母因式分解并拆分为部分分式：


  $$

  y = \frac{1}{(x+2)(x+3)} = \frac{1}{x+2} - \frac{1}{x+3}

  $$


  对于基础分式 $\frac{1}{x+c} = (x+c)^{-1}$，其 $n$ 阶导数公式为：


  $$

  \left( \frac{1}{x+c} \right)^{(n)} = \frac{(-1)^n n!}{(x+c)^{n+1}}

  $$


  根据导数的线性性质，逐项求导可得：


  $$

  y^{(n)} = (-1)^n n! \left[ \frac{1}{(x+2)^{n+1}} - \frac{1}{(x+3)^{n+1}} \right]

  $$'
feedback:
  correct: 正确将有理分式拆分为简单一次分式并求得高阶导数通式．
  incorrect: 有理分式求高阶导数应先裂项为一次分式，避免盲目使用商求导公式．
