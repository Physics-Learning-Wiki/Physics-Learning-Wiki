reference_answer: 当 $n$ 为奇数时 $y^{(n)}(0) = 0$；当 $n$ 为偶数时 $y^{(n)}(0) = (-1)^{n/2} \frac{n!}{(n/2)!}$．
solution: '由基本麦克劳林级数 $e^u = \sum_{k=0}^\infty \frac{u^k}{k!}$，令 $u = -x^2$ 得：


  $$

  e^{-x^2} = \sum_{k=0}^\infty \frac{(-1)^k}{k!} x^{2k}

  $$


  展开式中 $x^n$ 的系数为 $\frac{y^{(n)}(0)}{n!}$：


  - 当 $n$ 为奇数时，级数中无奇次幂项，故 $y^{(n)}(0) = 0$；

  - 当 $n$ 为偶数时，令 $n = 2k$，此时对应系数为 $\frac{(-1)^{n/2}}{(n/2)!}$，因此 $y^{(n)}(0) = (-1)^{n/2} \frac{n!}{(n/2)!}$．'
feedback:
  correct: 正确利用麦克劳林级数系数与高阶导数关系，分类讨论奇偶阶．
  incorrect: 奇偶函数性质：偶函数的奇阶导数在原点恒为 0．
