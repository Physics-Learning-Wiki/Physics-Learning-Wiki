reference_answer: $f'(0) = -2021!$．
solution: '由于 $f(0) = 0$，根据导数的定义有：


  $$

  f''(0) = \lim_{x \to 0} \frac{f(x) - f(0)}{x - 0} = \lim_{x \to 0} \frac{x(x-1)(x-2)\cdots(x-2021)}{x}

  $$


  消去公因式 $x$：


  $$

  f''(0) = \lim_{x \to 0} [(x-1)(x-2)\cdots(x-2021)] = (-1)(-2)\cdots(-2021) = (-1)^{2021} \cdot 2021! = -2021!

  $$


  因此所求导数值为 $-2021!$．'
feedback:
  correct: 正确使用导数定义求零点处的导数值，并准确判定负号．
  incorrect: 若 $f(x) = x g(x)$ 且 $g(x)$ 连续，则 $f'(0) = g(0)$．乘积包含 2021 个负因子，符号为负．
