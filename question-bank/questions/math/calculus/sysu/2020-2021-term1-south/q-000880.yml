reference_answer: 平面方程为 $2x + y - 3 = 0$．
solution: '设过交线的平面束方程为：


  $$

  (4x - y + 3z - 3) + \lambda (-2x + 2y - 3z) = 0 \implies (4 - 2\lambda)x + (-1 + 2\lambda)y + (3 - 3\lambda)z - 3 = 0

  $$


  该平面与 $xOy$ 面垂直，其法向量需与 $(0, 0, 1)$ 垂直，故 $z$ 分量为 $0$：


  $$

  3 - 3\lambda = 0 \implies \lambda = 1

  $$


  代入 $\lambda = 1$ 即得 $2x + y - 3 = 0$．'
feedback:
  correct: 正确利用平面束方程或消去法求得垂直平面的方程．
  incorrect: 与 $xOy$ 垂直即平面方程中不含 $z$ 项，直接将两原方程相加消去 $z$ 即可秒解．
