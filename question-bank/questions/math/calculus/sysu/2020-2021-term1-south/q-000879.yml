stem: '计算由星形线参数方程：


  $$

  \begin{cases} x = a \cos^3 t \\ y = a \sin^3 t \end{cases} \quad (a > 0, \, 0 \le t \le 2\pi)

  $$


  所围成平面图形的面积．'
