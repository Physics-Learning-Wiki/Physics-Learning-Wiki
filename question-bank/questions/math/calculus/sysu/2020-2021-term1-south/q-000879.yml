reference_answer: 星形线所围图形面积为 $\frac{3}{8}\pi a^2$．
solution: '由对称性，总面积等于第一象限面积的 $4$ 倍：


  $$

  A = 4 \int_0^a y\,\mathrm{d}x = 4 \int_{\pi/2}^0 (a \sin^3 t)(-3a \cos^2 t \sin t)\,\mathrm{d}t = 12a^2 \int_0^{\pi/2} \sin^4
  t \cos^2 t\,\mathrm{d}t

  $$


  改写为 $\int_0^{\pi/2} (\sin^4 t - \sin^6 t)\,\mathrm{d}t$，应用点夫（Wallis）公式：


  $$

  \int_0^{\pi/2} \sin^4 t\,\mathrm{d}t = \frac{3}{4} \cdot \frac{1}{2} \cdot \frac{\pi}{2} = \frac{3\pi}{16}, \quad \int_0^{\pi/2}
  \sin^6 t\,\mathrm{d}t = \frac{5}{6} \cdot \frac{3\pi}{16} = \frac{5\pi}{32}

  $$


  差值为 $\frac{\pi}{32}$，乘以 $12a^2$ 得总面积 $A = \frac{3}{8}\pi a^2$．'
feedback:
  correct: 正确利用对称性与 Wallis 公式求得星形线面积．
  incorrect: 注意定积分换元时上限与下限对应的参数范围，微元 $\mathrm{d}x = -3a\cos^2 t\sin t\,\mathrm{d}t$ 附带负号．
