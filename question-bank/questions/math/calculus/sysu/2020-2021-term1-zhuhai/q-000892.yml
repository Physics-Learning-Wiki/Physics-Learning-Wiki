stem: '讨论二元函数：


  $$

  f(x, y) = \begin{cases} \frac{xy}{x^2+y^2}, & x^2+y^2 \neq 0 \\[2mm] 0, & x^2+y^2 = 0 \end{cases}

  $$


  在点 $(0, 0)$ 处的一阶偏导数和全微分是否存在？'
