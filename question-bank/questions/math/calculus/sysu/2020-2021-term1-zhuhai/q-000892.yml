reference_answer: 偏导数存在且 $f_x(0,0)=0, f_y(0,0)=0$；全微分不存在（不可微）．
solution: '由偏导数定义：$f_x(0,0) = \lim_{\Delta x \to 0} \frac{0-0}{\Delta x} = 0, f_y(0,0) = 0$，偏导数均存在．


  考察全微分定义式极限：沿 $y=x$ 方向，$\frac{\Delta x \Delta y}{[(\Delta x)^2 + (\Delta y)^2]^{3/2}} = \frac{(\Delta x)^2}{2\sqrt{2}(\Delta
  x)^3} = \frac{1}{2\sqrt{2}\Delta x} \to \infty \neq 0$．故不可微．'
feedback:
  correct: 正确求得偏导数为 0 并证明不可微．
  incorrect: 偏导数存在不保证连续或可微，该函数在原点甚至不连续．
