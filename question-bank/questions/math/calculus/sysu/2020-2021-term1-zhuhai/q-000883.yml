reference_answer: $\lim_{x \to 0} \left( \frac{1}{\ln(1+x)} - \frac{1}{x} \right) = \frac{1}{2}$．
solution: '通分后应用泰勒展开：


  $$

  \lim_{x \to 0} \frac{x - \ln(1+x)}{x\ln(1+x)} = \lim_{x \to 0} \frac{x - (x - x^2/2 + o(x^2))}{x^2} = \frac{1}{2}

  $$'
feedback:
  correct: 正确通分并展开得出极限 1/2．
  incorrect: 通分后利用 $\ln(1+x) = x - x^2/2 + o(x^2)$ 最简捷．
