reference_answer: $f(x)$ 在 $x=0$ 的展开式中 $x^6$ 项系数为 $-\frac{1}{18}$．
solution: '由于 $\arctan t = t - \frac{t^3}{3} + o(t^4)$，被积函数为 $t^2 \arctan t = t^3 - \frac{t^5}{3} + o(t^6)$．


  逐项积分：


  $$

  f(x) = \int_0^x \left( t^3 - \frac{t^5}{3} + o(t^6) \right)\,\mathrm{d}t = \frac{x^4}{4} - \frac{x^6}{18} + o(x^7)

  $$


  故 $x^6$ 项的系数为 $-\frac{1}{18}$．'
feedback:
  correct: 正确展开被积函数并逐项积分求得系数 $-1/18$．
  incorrect: 避免直接对变限积分连求六阶导数，级数逐项积分是最有效手段．
