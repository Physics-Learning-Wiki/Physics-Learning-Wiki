stem: 已知 $\arctan x = \sum_{n=0}^\infty (-1)^n \frac{x^{2n+1}}{2n+1}$（$-1 \le x \le 1$）．设函数 $f(x) = \int_0^x t^2 \arctan t\,\mathrm{d}t$，求
  $f(x)$ 在 $x = 0$ 处的麦克劳林展开式中 $x^6$ 项的系数．
