stem: '回答下列关于向量混合积与微分中值定理的问题：


  1. 叙述三维向量混合积 $\mathbf{u} \cdot (\mathbf{v} \times \mathbf{w})$ 的几何意义；

  2. 设 $\mathbf{F}(x) = (f(x), g(x), h(x))$ 在 $[a,b]$ 连续、$(a,b)$ 可导，定义 $D(x) = \mathbf{F}(x) \cdot (\mathbf{F}(a) \times \mathbf{F}(b))$．证明存在
  $c \in (a,b)$ 使得 $D''(c) = 0$；

  3. 证明结论 2 是柯西中值定理的推广．'
