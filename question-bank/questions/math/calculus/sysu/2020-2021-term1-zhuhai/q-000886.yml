reference_answer: $\int_0^n (x - [x])\,\mathrm{d}x = \frac{n}{2}$．
solution: '$f(x) = x - [x]$ 是以 $1$ 为周期的函数．单周期上的积分为 $\int_0^1 x\,\mathrm{d}x = \frac{1}{2}$．


  由周期性，在包含 $n$ 个周期的区间 $[0, n]$ 上的定积分为 $n \times \frac{1}{2} = \frac{n}{2}$．'
feedback:
  correct: 正确利用小数部分函数的周期性求得定积分 $n/2$．
  incorrect: 周期函数在 $n$ 个周期上的积分等于单周期积分的 $n$ 倍．
