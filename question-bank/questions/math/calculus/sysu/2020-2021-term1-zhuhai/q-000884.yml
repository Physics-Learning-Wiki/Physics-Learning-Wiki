reference_answer: $a = 1, b = 0, c = \frac{1}{2}$．
solution: '由于极限值非零且分子趋于 0，分母在 $x \to 0$ 处极限必为 0，故 $b = 0$．


  应用洛必达法则：


  $$

  \lim_{x \to 0} \frac{a - \cos x}{\frac{\ln(1+x^3)}{x}} = \lim_{x \to 0} \frac{a - \cos x}{x^2}

  $$


  分母趋于 0，要使极限有限非零，分子必须趋于 0，得 $a = 1$．


  代入得 $c = \lim_{x \to 0} \frac{1-\cos x}{x^2} = \frac{1}{2}$．'
feedback:
  correct: 正确分析极限非零的存在条件并求得参数 $a=1, b=0, c=1/2$．
  incorrect: 分子分母同阶是未定式极限非零的根本条件．
