stem: '设实数 $a, b, c$ 满足：


  $$

  \lim_{x \to 0} \frac{ax - \sin x}{\int_b^x \frac{\ln(1+t^3)}{t}\,\mathrm{d}t} = c \neq 0

  $$


  求常数 $a, b, c$ 的值．'
