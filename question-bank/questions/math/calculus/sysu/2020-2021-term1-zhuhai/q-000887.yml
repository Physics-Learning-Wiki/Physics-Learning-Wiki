stem: '求通过直线 $L_1$：


  $$

  \begin{cases} x - 2z - 4 = 0 \\ 3y - z + 8 = 0 \end{cases}

  $$


  且与直线 $L_2: x - 1 = y + 1 = z - 3$ 平行的平面方程．'
