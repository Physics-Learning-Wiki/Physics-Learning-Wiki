reference_answer: 平面方程为 $2x + 3y - 5z = 0$．
solution: '$L_1$ 的方向为 $(1, 0, -2) \times (0, 3, -1) = (6, 1, 3)$．$L_2$ 的方向为 $(1, 1, 1)$．


  平面的法向量垂直于两直线方向：$(6, 1, 3) \times (1, 1, 1) = (-2, -3, 5)$，可取法向量 $(2, 3, -5)$．


  在 $L_1$ 上取点 $(2, -3, -1)$，点法式为 $2(x-2) + 3(y+3) - 5(z+1) = 0 \implies 2x + 3y - 5z = 0$．'
feedback:
  correct: 法向量叉乘计算与点法式方程建立准确无误．
  incorrect: 过一直线且平行于另一直线的平面，其法向量垂直于两直线的方向向量．
