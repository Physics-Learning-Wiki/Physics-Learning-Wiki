reference_answer: 极小值点 $x=2$（极小值 $4$），极大值点 $x=0$（极大值 $0$）；$(-\infty, 1)$ 上为凸，$(1, +\infty)$ 上为凹；垂直渐近线 $x=1$，斜渐近线 $y=x+1$．
solution: '1. $f''(x) = \frac{x(x-2)}{(x-1)^2}$，驻点 $x=0, 2$．在 $(-\infty, 0)$ 和 $(2, +\infty)$ 递增，在 $(0, 1)$ 和 $(1, 2)$ 递减．极大值
  $f(0)=0$，极小值 $f(2)=4$．


  2. $f''''(x) = \frac{2}{(x-1)^3}$．$x < 1$ 时 $f'''' < 0$（凸），$x > 1$ 时 $f'''' > 0$（凹）．


  3. $\lim_{x \to 1} f(x) = \infty$，故 $x=1$ 为垂直渐近线．由 $\frac{x^2}{x-1} = x+1 + \frac{1}{x-1}$ 知 $y = x+1$ 为斜渐近线．'
feedback:
  correct: 全面完整给出单调性、极值、凹凸区间与两条渐近线．
  incorrect: 利用多项式带余除法可迅速求出斜渐近线方程．
