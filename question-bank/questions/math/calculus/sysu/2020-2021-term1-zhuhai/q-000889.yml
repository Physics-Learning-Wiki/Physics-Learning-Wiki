reference_answer: 命题成立，通过偏导数链式法则与对称性相加获证．
solution: '由 $\frac{\partial r}{\partial x} = \frac{x}{r}$ 得 $\frac{\partial u}{\partial x} = -\frac{x}{r^3}$．


  继续求二阶偏导：$\frac{\partial^2 u}{\partial x^2} = -\frac{r^3 - 3x^2 r}{r^6} = \frac{3x^2 - r^2}{r^5}$．


  同理 $\frac{\partial^2 u}{\partial y^2} = \frac{3y^2-r^2}{r^5}, \frac{\partial^2 u}{\partial z^2} = \frac{3z^2-r^2}{r^5}$．


  三式相加：$\frac{3(x^2+y^2+z^2) - 3r^2}{r^5} = 0$．证毕．'
feedback:
  correct: 二阶偏导数推导严谨，利用轮换对称性清晰简明．
  incorrect: 点源势函数 $1/r$ 是三维调和函数的经典原型．
