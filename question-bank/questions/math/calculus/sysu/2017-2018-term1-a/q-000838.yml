reference_answer: 极值点为 $\left(\frac{\pi}{6}, \frac{\pi}{6}, \frac{\pi}{6}\right)$，极大值为 $\frac{1}{8}$．
solution: '目标函数 $u = \sin x \sin y \sin z$ 在开区域 $x > 0, y > 0, z > 0, x+y+z = \frac{\pi}{2}$ 上为正．


  取对数求极值：设 $F(x, y, z) = \ln u = \ln\sin x + \ln\sin y + \ln\sin z$．


  构造拉格朗日函数：


  $$

  L(x, y, z, \lambda) = \ln\sin x + \ln\sin y + \ln\sin z - \lambda\left(x + y + z - \frac{\pi}{2}\right)

  $$


  求一阶偏导数并令其为 0：


  $$

  \begin{cases} \frac{\partial L}{\partial x} = \cot x - \lambda = 0 \\ \frac{\partial L}{\partial y} = \cot y - \lambda =
  0 \\ \frac{\partial L}{\partial z} = \cot z - \lambda = 0 \end{cases}

  $$


  由此可知 $\cot x = \cot y = \cot z = \lambda$．


  在 $(0, \frac{\pi}{2})$ 内，余切函数 $\cot t$ 单调递减，因此：


  $$

  x = y = z

  $$


  代入约束条件 $x + y + z = 3x = \frac{\pi}{2}$：


  $$

  x = y = z = \frac{\pi}{6}

  $$


  代入目标函数计算极值：


  $$

  u\left(\frac{\pi}{6}, \frac{\pi}{6}, \frac{\pi}{6}\right) = \sin\frac{\pi}{6} \sin\frac{\pi}{6} \sin\frac{\pi}{6} = \left(\frac{1}{2}\right)^3
  = \frac{1}{8}

  $$


  在区域边界上（当 $x, y$ 或 $z \to 0$ 时），$u \to 0$；而在区域内部 $u > 0$ 且驻点唯一，故该点为极大值点，极大值为 $\frac{1}{8}$．'
feedback:
  correct: 正确使用拉格朗日乘数法求得对称驻点并得出极大值 1/8．
  incorrect: 请注意利用对数化简求导 $\frac{\mathrm{d}}{\mathrm{d}x}(\ln\sin x) = \cot x$，由对称性得出 $x=y=z=\pi/6$．
