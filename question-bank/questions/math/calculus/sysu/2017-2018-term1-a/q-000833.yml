reference_answer: $2x - y + 2z - 3 = 0$．
solution: '直线的对称式方程为 $\frac{x}{2} = \frac{y-1}{-1} = \frac{z+1}{2}$，其方向向量为：


  $$

  \mathbf{s} = (2, -1, 2)

  $$


  因为所求平面与该直线垂直，所以直线的方向向量可直接作为平面的法向量：


  $$

  \mathbf{n} = \mathbf{s} = (2, -1, 2)

  $$


  又已知平面经过点 $M(0, 1, 2)$，代入点法式平面方程：


  $$

  2(x - 0) - 1(y - 1) + 2(z - 2) = 0

  $$


  展开化简：


  $$

  2x - y + 1 + 2z - 4 = 0 \implies 2x - y + 2z - 3 = 0

  $$'
feedback:
  correct: 正确识别直线方向向量即为垂面的法向量，点法式计算无误．
  incorrect: 与直线垂直的平面，其法向量与直线的方向向量平行；直接使用点法式 $A(x-x_0)+B(y-y_0)+C(z-z_0)=0$ 即可．
