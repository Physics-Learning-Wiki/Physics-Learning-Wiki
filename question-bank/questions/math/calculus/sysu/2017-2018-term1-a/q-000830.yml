reference_answer: $\lim_{x\to 0^+} x^{\sin x} = 1$．
solution: '该极限为 $0^0$ 型未定式．取指数对数转化：


  $$

  x^{\sin x} = e^{\sin x \ln x}

  $$


  考察指数部分的极限：当 $x \to 0^+$ 时，利用等价无穷小 $\sin x \sim x$：


  $$

  \lim_{x\to 0^+} \sin x \ln x = \lim_{x\to 0^+} x \ln x

  $$


  改写为 $\frac{\infty}{\infty}$ 型并应用洛必达法则：


  $$

  \lim_{x\to 0^+} \frac{\ln x}{\frac{1}{x}} = \lim_{x\to 0^+} \frac{\frac{1}{x}}{-\frac{1}{x^2}} = \lim_{x\to 0^+} (-x) =
  0

  $$


  由指数函数的连续性：


  $$

  \lim_{x\to 0^+} x^{\sin x} = e^{\lim_{x\to 0^+} \sin x \ln x} = e^0 = 1

  $$'
feedback:
  correct: 正确对 $0^0$ 型未定式取对数并结合 $\lim_{x\to 0^+} x\ln x = 0$ 求得结果 1．
  incorrect: 请注意 $0^0$ 型需取对数转化为 $0 \cdot (-\infty)$ 型，再化为分式使用洛必达法则求得指数极限为 0，底数为 $e^0=1$．
