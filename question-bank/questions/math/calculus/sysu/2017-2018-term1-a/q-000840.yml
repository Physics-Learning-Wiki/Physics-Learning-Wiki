stem: 设 $z = f(x^2 - y^2, e^{xy+x})$，其中 $f(u, v)$ 具有二阶连续偏导数，求 $\frac{\partial z}{\partial x}$、$\frac{\partial z}{\partial
  y}$ 以及混合偏导数 $\frac{\partial^2 z}{\partial x \partial y}$．
