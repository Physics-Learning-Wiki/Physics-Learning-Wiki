reference_answer: '凹区间为 $(-\infty, -1)$ 和 $(1, +\infty)$；凸区间为 $(-1, 1)$；


  拐点为 $(-1, 3e^{-\frac{1}{2}})$ 和 $(1, 3e^{-\frac{1}{2}})$；


  水平渐近线为 $y = 0$（$x$ 轴），无垂直或斜渐近线．'
solution: '函数的定义域为 $(-\infty, +\infty)$，为偶函数．


  求一阶导数：


  $$

  y'' = 3 e^{-\frac{x^2}{2}} (-x) = -3x e^{-\frac{x^2}{2}}

  $$


  求二阶导数：


  $$

  y'''' = -3 e^{-\frac{x^2}{2}} + (-3x) e^{-\frac{x^2}{2}} (-x) = 3(x^2 - 1) e^{-\frac{x^2}{2}}

  $$


  令 $y'''' = 0$，解得 $x = \pm 1$．因为 $e^{-\frac{x^2}{2}} > 0$ 恒成立，符号完全由 $x^2 - 1$ 决定：


  - 当 $x \in (-\infty, -1)$ 时，$y'''' > 0$，曲线为凹；

  - 当 $x \in (-1, 1)$ 时，$y'''' < 0$，曲线为凸；

  - 当 $x \in (1, +\infty)$ 时，$y'''' > 0$，曲线为凹．


  拐点坐标：代入原函数得 $y(\pm 1) = 3e^{-\frac{1}{2}} = \frac{3}{\sqrt{e}}$．拐点为 $(-1, \frac{3}{\sqrt{e}})$ 和 $(1, \frac{3}{\sqrt{e}})$．


  渐近线：


  当 $x \to \pm\infty$ 时，$\lim_{x\to\pm\infty} 3e^{-\frac{x^2}{2}} = 0$．所以水平渐近线为 $y = 0$（$x$ 轴）．'
feedback:
  correct: 正确求得二阶导数并准确给出凹凸区间、拐点与渐近线．
  incorrect: 请注意拐点必须写成点坐标 $(x, y)$ 形式，水平渐近线方程应写为 $y = 0$．
