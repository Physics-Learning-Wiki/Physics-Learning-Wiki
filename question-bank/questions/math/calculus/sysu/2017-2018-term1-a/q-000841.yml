reference_answer: (1) 利用换元 $x = -t$ 可证 $\int_{-a}^a f(x)g(x)\,\mathrm{d}x = A \int_0^a g(x)\,\mathrm{d}x$；(2) 积分值为 $\frac{1}{3}$．
solution: '**(1) 证明：**


  记 $I = \int_{-a}^a f(x)g(x)\,\mathrm{d}x$．做换元 $x = -t, \mathrm{d}x = -\mathrm{d}t$：


  $$

  I = \int_a^{-a} f(-t)g(-t)\,(-\mathrm{d}t) = \int_{-a}^a f(-t)g(t)\,\mathrm{d}t = \int_{-a}^a f(-x)g(x)\,\mathrm{d}x

  $$


  将两式相加：


  $$

  2I = \int_{-a}^a [f(x) + f(-x)] g(x)\,\mathrm{d}x = \int_{-a}^a A g(x)\,\mathrm{d}x

  $$


  因为 $g(x)$ 是偶函数，所以 $\int_{-a}^a g(x)\,\mathrm{d}x = 2\int_0^a g(x)\,\mathrm{d}x$．代入得：


  $$

  2I = A \cdot 2\int_0^a g(x)\,\mathrm{d}x \implies I = A \int_0^a g(x)\,\mathrm{d}x

  $$


  证毕．


  **(2) 计算积分：**


  原积分为 $\int_{-1}^1 \frac{x^2}{1 + e^{\frac{1}{x}}}\,\mathrm{d}x$．


  令 $g(x) = x^2$（显然为偶函数），$f(x) = \frac{1}{1 + e^{\frac{1}{x}}}$．


  验证 $f(x) + f(-x)$：


  $$

  f(-x) = \frac{1}{1 + e^{-\frac{1}{x}}} = \frac{e^{\frac{1}{x}}}{e^{\frac{1}{x}} + 1}

  $$


  $$

  f(x) + f(-x) = \frac{1}{1 + e^{\frac{1}{x}}} + \frac{e^{\frac{1}{x}}}{1 + e^{\frac{1}{x}}} = 1

  $$


  满足条件，常数 $A = 1$．


  由第 (1) 问的结论，直接得到：


  $$

  \int_{-1}^1 \frac{x^2}{1 + e^{\frac{1}{x}}}\,\mathrm{d}x = 1 \cdot \int_0^1 x^2\,\mathrm{d}x = \left[\frac{x^3}{3}\right]_0^1
  = \frac{1}{3}

  $$'
feedback:
  correct: 严密使用区间倒换技巧证明恒等式，并巧妙分解 $x^2 \cdot \frac{1}{1+e^{1/x}}$ 求得积分值 1/3．
  incorrect: 区间对称积分经典变换：令 $x=-t$，两式相加利用 $f(x)+f(-x)=1$ 消除复杂的指数项．
