stem: '设 $f(x), g(x)$ 在区间 $[-a, a]$（$a > 0$）上连续，$g(x)$ 为偶函数，$f(x)$ 满足 $f(x) + f(-x) = A$（$A$ 为常数）．


  (1) 证明：$\int_{-a}^a f(x)g(x)\,\mathrm{d}x = A \int_0^a g(x)\,\mathrm{d}x$；


  (2) 利用该结论计算定积分 $\int_{-1}^1 \frac{x^2}{1 + e^{\frac{1}{x}}}\,\mathrm{d}x$ 的值．'
