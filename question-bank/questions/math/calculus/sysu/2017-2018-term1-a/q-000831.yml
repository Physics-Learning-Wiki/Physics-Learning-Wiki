reference_answer: $\int_0^\pi \frac{\sin x \cos^2 x}{1 + \cos^2 x}\,\mathrm{d}x = 2 - \frac{\pi}{2}$．
solution: '采用换元法（凑微分）：设 $u = \cos x$，则 $\mathrm{d}u = -\sin x\,\mathrm{d}x$．


  当 $x = 0$ 时，$u = 1$；当 $x = \pi$ 时，$u = -1$．


  代入定积分：


  $$

  \int_0^\pi \frac{\sin x \cos^2 x}{1 + \cos^2 x}\,\mathrm{d}x = \int_1^{-1} \frac{u^2}{1 + u^2}\,(-\mathrm{d}u) = \int_{-1}^1
  \frac{u^2}{1 + u^2}\,\mathrm{d}u

  $$


  由于被积函数 $\frac{u^2}{1+u^2}$ 为偶函数，且区间对称：


  $$

  \int_{-1}^1 \frac{u^2}{1 + u^2}\,\mathrm{d}u = 2 \int_0^1 \frac{u^2}{1 + u^2}\,\mathrm{d}u

  $$


  拆分有理式 $\frac{u^2}{1+u^2} = 1 - \frac{1}{1+u^2}$：


  $$

  2 \int_0^1 \left(1 - \frac{1}{1+u^2}\right)\,\mathrm{d}u = 2 [u - \arctan u]_0^1 = 2\left(1 - \frac{\pi}{4}\right) = 2 -
  \frac{\pi}{2}

  $$'
feedback:
  correct: 正确使用换元 $u=\cos x$ 结合偶函数对称性与有理分式积分求得 $2-\pi/2$．
  incorrect: 请注意：$\mathrm{d}(\cos x) = -\sin x\,\mathrm{d}x$ 带来的上下限翻转，以及有理分式恒等变形 $\frac{u^2}{1+u^2} = 1 - \frac{1}{1+u^2}$．
