reference_answer: $S = 2\pi (\sqrt{2} + \ln(1+\sqrt{2}))$．
solution: '曲线 $y = \sin x$ 绕 $x$ 轴旋转所得旋转曲面的侧面积微元为：


  $$

  \mathrm{d}S = 2\pi y \,\mathrm{d}s = 2\pi y \sqrt{1 + (y'')^2}\,\mathrm{d}x

  $$


  已知 $y'' = \cos x$，所以在 $[0, \pi]$ 上：


  $$

  S = 2\pi \int_0^\pi \sin x \sqrt{1 + \cos^2 x}\,\mathrm{d}x

  $$


  令 $u = \cos x, \mathrm{d}u = -\sin x\,\mathrm{d}x$．当 $x=0$ 时 $u=1$；$x=\pi$ 时 $u=-1$：


  $$

  S = 2\pi \int_{-1}^1 \sqrt{1 + u^2}\,\mathrm{d}u = 4\pi \int_0^1 \sqrt{1 + u^2}\,\mathrm{d}u

  $$


  利用标准积分公式 $\int \sqrt{1+u^2}\,\mathrm{d}u = \frac{1}{2} u\sqrt{1+u^2} + \frac{1}{2}\ln(u+\sqrt{1+u^2})$：


  $$

  \int_0^1 \sqrt{1+u^2}\,\mathrm{d}u = \left[\frac{1}{2}u\sqrt{1+u^2} + \frac{1}{2}\ln(u+\sqrt{1+u^2})\right]_0^1 = \frac{\sqrt{2}}{2}
  + \frac{1}{2}\ln(1+\sqrt{2})

  $$


  乘以 $4\pi$：


  $$

  S = 4\pi \left(\frac{\sqrt{2}}{2} + \frac{1}{2}\ln(1+\sqrt{2})\right) = 2\pi (\sqrt{2} + \ln(1+\sqrt{2}))

  $$'
feedback:
  correct: 正确写出旋转曲面侧面积积分公式并完成 $\int \sqrt{1+u^2}\,\mathrm{d}u$ 积分．
  incorrect: 请注意旋转曲面侧面积公式为 $2\pi \int y \sqrt{1+(y')^2}\,\mathrm{d}x$，不是截面面积积分 $\pi \int y^2\,\mathrm{d}x$（后者为体积）．
