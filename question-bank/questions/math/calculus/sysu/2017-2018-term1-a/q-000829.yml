reference_answer: $\lim_{n\to\infty} (\sqrt{n+1} - \sqrt{n}) = 0$．
solution: '采用分子有理化：


  $$

  \sqrt{n+1} - \sqrt{n} = \frac{(\sqrt{n+1} - \sqrt{n})(\sqrt{n+1} + \sqrt{n})}{\sqrt{n+1} + \sqrt{n}} = \frac{(n+1) - n}{\sqrt{n+1}
  + \sqrt{n}} = \frac{1}{\sqrt{n+1} + \sqrt{n}}

  $$


  当 $n \to \infty$ 时，分母 $\sqrt{n+1} + \sqrt{n} \to +\infty$，因此：


  $$

  \lim_{n\to\infty} (\sqrt{n+1} - \sqrt{n}) = \lim_{n\to\infty} \frac{1}{\sqrt{n+1} + \sqrt{n}} = 0

  $$'
feedback:
  correct: 正确通过分子有理化求出极限 0．
  incorrect: $\infty - \infty$ 型根式差极限的标准方法是分子有理化，将差化为分母和的形式．
