reference_answer: $\ln(3+x) = \ln 3 + \sum_{k=1}^n \frac{(-1)^{k-1}}{k \cdot 3^k} x^k + o(x^n)$．
solution: '变形提取常数项 3：


  $$

  \ln(3+x) = \ln\left(3\left(1 + \frac{x}{3}\right)\right) = \ln 3 + \ln\left(1 + \frac{x}{3}\right)

  $$


  利用标准对数展开式 $\ln(1+u) = \sum_{k=1}^n \frac{(-1)^{k-1}}{k} u^k + o(u^n)$，代入 $u = \frac{x}{3}$：


  $$

  \ln\left(1 + \frac{x}{3}\right) = \sum_{k=1}^n \frac{(-1)^{k-1}}{k} \left(\frac{x}{3}\right)^k + o(x^n) = \sum_{k=1}^n \frac{(-1)^{k-1}}{k
  \cdot 3^k} x^k + o(x^n)

  $$


  因此，带皮亚诺余项的 $n$ 阶泰勒公式为：


  $$

  \ln(3+x) = \ln 3 + \frac{x}{3} - \frac{x^2}{2 \cdot 3^2} + \frac{x^3}{3 \cdot 3^3} - \dots + \frac{(-1)^{n-1}}{n \cdot 3^n}
  x^n + o(x^n)

  $$


  即：


  $$

  \ln(3+x) = \ln 3 + \sum_{k=1}^n \frac{(-1)^{k-1}}{k \cdot 3^k} x^k + o(x^n)

  $$'
feedback:
  correct: 正确提取 $\ln 3$ 并利用 $\ln(1+x/3)$ 标准展开式求得通项与余项．
  incorrect: 常见疏漏：忘记首项常数项 $\ln 3$；通项中分母幂次为 $k \cdot 3^k$．
