reference_answer: $\frac{\partial^2 z}{\partial x \partial y} = -b e^x [\sin(ax+by) + a\cos(ax+by)]$．
solution: '先对 $y$ 求一阶偏导数（注意此时 $e^x$ 视为常数）：


  $$

  \frac{\partial z}{\partial y} = e^x [-\sin(ax + by)] \cdot b = -b e^x \sin(ax + by)

  $$


  再对 $x$ 求偏导数（应用乘积法则）：


  $$

  \frac{\partial^2 z}{\partial x \partial y} = -b \frac{\partial}{\partial x} [e^x \sin(ax + by)]

  $$


  $$

  = -b \left(e^x \sin(ax + by) + e^x [\cos(ax + by) \cdot a]\right)

  $$


  提取公因式 $e^x$：


  $$

  \frac{\partial^2 z}{\partial x \partial y} = -b e^x [\sin(ax + by) + a\cos(ax + by)]

  $$'
feedback:
  correct: 正确应用链式法则与乘积法则计算混合二阶偏导数．
  incorrect: 先对 $y$ 求偏导再对 $x$ 求偏导时，乘积项 $e^x \sin(ax+by)$ 两项都含 $x$，必须使用乘积法则求导．
