stem: '讨论二元函数


  $$

  f(x, y) = \begin{cases} \frac{x^2 y^2}{x^2 + y^2}, & x^2 + y^2 \neq 0, \\ 0, & x^2 + y^2 = 0 \end{cases}

  $$


  在点 $(0, 0)$ 处的连续性、一阶偏导数存在性及一阶微分的存在性（可微性）．'
