reference_answer: 函数在 $(0, 0)$ 处连续，一阶偏导数 $f_x(0,0)=0, f_y(0,0)=0$ 存在，且在 $(0, 0)$ 处可微．
solution: '**1. 连续性：**


  利用极坐标 $x = r\cos\theta, y = r\sin\theta$：


  $$

  |f(x, y)| = \frac{r^4 \cos^2\theta \sin^2\theta}{r^2} = r^2 \cos^2\theta \sin^2\theta \le r^2 = x^2 + y^2

  $$


  当 $(x, y) \to (0, 0)$ 时，$r^2 \to 0$，故 $\lim_{(x, y)\to(0, 0)} f(x, y) = 0 = f(0, 0)$．


  因此 $f(x, y)$ 在 $(0, 0)$ 处连续．


  **2. 偏导数存在性：**


  由定义：


  $$

  f_x(0, 0) = \lim_{x\to 0} \frac{f(x, 0) - f(0, 0)}{x} = \lim_{x\to 0} \frac{0 - 0}{x} = 0

  $$


  $$

  f_y(0, 0) = \lim_{y\to 0} \frac{f(0, y) - f(0, 0)}{y} = \lim_{y\to 0} \frac{0 - 0}{y} = 0

  $$


  两偏导数均存在且均为 0．


  **3. 可微性：**


  考察可微性极限：


  $$

  \lim_{(x, y)\to(0, 0)} \frac{f(x, y) - f(0, 0) - f_x(0,0)x - f_y(0,0)y}{\sqrt{x^2+y^2}} = \lim_{(x, y)\to(0, 0)} \frac{\frac{x^2
  y^2}{x^2+y^2}}{\sqrt{x^2+y^2}} = \lim_{(x, y)\to(0, 0)} \frac{x^2 y^2}{(x^2+y^2)^{\frac{3}{2}}}

  $$


  换极坐标：


  $$

  \frac{r^4 \cos^2\theta \sin^2\theta}{r^3} = r \cos^2\theta \sin^2\theta

  $$


  因为 $|r \cos^2\theta \sin^2\theta| \le r$，当 $r \to 0$ 时该极限必为 0．


  极限等于 0，因此 $f(x, y)$ 在 $(0, 0)$ 处**可微**．'
feedback:
  correct: 严谨证明了连续性、偏导数存在性，并通过极坐标放缩证明可微性极限为 0．
  incorrect: 请注意与不可微例题区分：本题分子次数为 4，分母在可微性检验中为 $r^3$，比值次数为 $r^1 \to 0$，故函数在原点确实可微！
