stem: '在曲线 $C: y = 1 - x^2$（$x > 0$）上的点 $P$ 处作曲线的切线，该切线与两坐标轴分别交于 $A, B$ 两点．


  (1) 试确定点 $P$ 的位置，使得 $A, B$ 两点与坐标原点 $O$ 所围成的三角形 $\triangle OAB$ 的面积最小；


  (2) 求此时在点 $P$ 处的切线方程；


  (3) 求曲线 $C$ 与 $x$ 轴、$y$ 轴所围成图形的面积．'
