reference_answer: '(1) 点 $P$ 的坐标为 $\left(\frac{\sqrt{3}}{3}, \frac{2}{3}\right)$，最小面积为 $\frac{4\sqrt{3}}{9}$．


  (2) 切线方程为 $2\sqrt{3}x + 3y - 4 = 0$（或 $y = -\frac{2\sqrt{3}}{3}x + \frac{4}{3}$）．


  (3) 所围图形面积为 $\frac{2}{3}$．'
solution: '**(1) 确定点 $P$ 使得 $\triangle OAB$ 面积最小：**


  设点 $P$ 的坐标为 $(m, 1 - m^2)$，其中 $0 < m < 1$．


  因为 $y'' = -2x$，所以在点 $P$ 处的切线斜率为 $k = -2m$．


  切线方程为：


  $$

  y - (1 - m^2) = -2m(x - m) \implies y = -2mx + 1 + m^2

  $$


  求与坐标轴的交点：


  - 令 $x = 0$，得点 $A(0, 1 + m^2)$；

  - 令 $y = 0$，得点 $B\left(\frac{1+m^2}{2m}, 0\right)$．


  直角三角形 $\triangle OAB$ 的面积为：


  $$

  S(m) = \frac{1}{2} OA \cdot OB = \frac{1}{2} (1 + m^2) \cdot \frac{1 + m^2}{2m} = \frac{(1 + m^2)^2}{4m}

  $$


  对 $S(m)$ 关于 $m$ 求导：


  $$

  S''(m) = \frac{2(1+m^2)(2m)(4m) - 4(1+m^2)^2}{16m^2} = \frac{4(1+m^2)[4m^2 - (1+m^2)]}{16m^2} = \frac{(1+m^2)(3m^2 - 1)}{4m^2}

  $$


  令 $S''(m) = 0$，在 $m > 0$ 内的唯一驻点为 $m = \frac{1}{\sqrt{3}} = \frac{\sqrt{3}}{3}$．


  由于在 $m \in (0, 1)$ 上连续且两端趋向无穷大，驻点处取得最小值．


  代入纵坐标：$1 - m^2 = 1 - \frac{1}{3} = \frac{2}{3}$．所以点 $P$ 为 $\left(\frac{\sqrt{3}}{3}, \frac{2}{3}\right)$．


  最小面积为 $S\left(\frac{\sqrt{3}}{3}\right) = \frac{\left(\frac{4}{3}\right)^2}{4 \cdot \frac{\sqrt{3}}{3}} = \frac{16/9}{4\sqrt{3}/3}
  = \frac{4\sqrt{3}}{9}$．


  **(2) 切线方程：**


  将 $m = \frac{\sqrt{3}}{3}$ 代入切线方程：


  $$

  y = -\frac{2\sqrt{3}}{3}x + \frac{4}{3} \implies 2\sqrt{3}x + 3y - 4 = 0

  $$


  **(3) 曲线与两坐标轴所围面积：**


  曲线 $y = 1 - x^2$ 与 $x$ 轴交于 $x = 1$，与 $y$ 轴交于 $y = 1$：


  $$

  S_0 = \int_0^1 (1 - x^2)\,\mathrm{d}x = \left[x - \frac{x^3}{3}\right]_0^1 = 1 - \frac{1}{3} = \frac{2}{3}

  $$'
feedback:
  correct: 完整准确求解了切线方程、截距、面积函数极值与定积分面积．
  incorrect: 请注意：三角形面积为 $\frac{(1+m^2)^2}{4m}$，驻点由分子 $3m^2-1=0$ 给出 $m=\frac{\sqrt{3}}{3}$．
