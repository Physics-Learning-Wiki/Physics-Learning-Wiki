reference_answer: 构造辅助函数 $F(x) = x f(x)$，在 $[0, 1]$ 上应用罗尔中值定理即可证明存在 $\xi \in (0, 1)$ 满足 $f'(\xi) + \frac{1}{\xi}f(\xi) = 0$．
solution: '将待证等式两端乘以 $\xi$（注意 $\xi \in (0, 1)$，$\xi \neq 0$）：


  $$

  \xi f''(\xi) + f(\xi) = 0

  $$


  观察左端为乘积导数：$(\xi f(\xi))'' = f(\xi) + \xi f''(\xi)$．


  因此构造辅助函数：


  $$

  F(x) = x f(x)

  $$


  验证罗尔中值定理的条件：


  1. $F(x)$ 在闭区间 $[0, 1]$ 上连续；

  2. $F(x)$ 在开区间 $(0, 1)$ 内可导；

  3. 端点值：$F(0) = 0 \cdot f(0) = 0$；$F(1) = 1 \cdot f(1) = 0$（由已知 $f(1) = 0$），即 $F(0) = F(1) = 0$．


  根据罗尔中值定理，在开区间 $(0, 1)$ 内至少存在一点 $\xi \in (0, 1)$，使得：


  $$

  F''(\xi) = 0

  $$


  计算导数：$F''(x) = f(x) + x f''(x)$．故：


  $$

  f(\xi) + \xi f''(\xi) = 0

  $$


  因为 $\xi \in (0, 1)$，两边同除以 $\xi$：


  $$

  f''(\xi) + \frac{1}{\xi}f(\xi) = 0

  $$


  证毕．'
feedback:
  correct: 敏锐识别出乘积导数形式，巧妙构造 $F(x)=xf(x)$ 并直接应用罗尔定理．
  incorrect: 证明提示：等式同乘 $\xi$ 得到 $xf'(x)+f(x) = (xf(x))'$，利用 $F(0)=F(1)=0$ 应用罗尔中值定理．
