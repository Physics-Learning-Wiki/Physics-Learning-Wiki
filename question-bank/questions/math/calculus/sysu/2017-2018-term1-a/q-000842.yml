stem: '已知函数 $f(x)$ 在区间 $[0, 1]$ 上连续，在区间 $(0, 1)$ 可导，且 $f(1) = 0$．


  证明：存在 $\xi \in (0, 1)$，使得 $f''(\xi) + \frac{1}{\xi}f(\xi) = 0$．'
