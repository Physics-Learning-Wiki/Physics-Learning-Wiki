reference_answer: $\lim_{x \to +\infty} \left( \frac{3x+2}{3x-1} \right)^{2x-1} = e^2$．
solution: '底数 $\frac{3x+2}{3x-1} = 1 + \frac{3}{3x-1} \to 1$，指数 $2x-1 \to +\infty$，属于 $1^\infty$ 型未定式．


  变形计算极限：


  $$

  \lim_{x \to +\infty} \left( 1 + \frac{3}{3x-1} \right)^{2x-1} = e^{\lim_{x \to +\infty} \frac{3(2x-1)}{3x-1}} = e^{\lim_{x
  \to +\infty} \frac{6x-3}{3x-1}} = e^2

  $$


  因此所求极限为 $e^2$．'
feedback:
  correct: 正确变形为重要极限形式并求得指数为 2．
  incorrect: $1^\infty$ 型极限公式为 $e^{\lim (u-1)v}$．
