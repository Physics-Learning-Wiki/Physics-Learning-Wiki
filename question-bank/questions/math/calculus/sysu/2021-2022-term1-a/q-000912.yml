reference_answer: $\frac{\mathrm{d}y}{\mathrm{d}x} = -\frac{y\cos x + \sin(x-y)}{\sin x - \sin(x-y)}$．
solution: '方程两边关于 $x$ 求导，注意 $y$ 是 $x$ 的函数：


  $$

  (y'' \sin x + y \cos x) - [-\sin(x-y) \cdot (1 - y'')] = 0

  $$


  整理得：


  $$

  y'' \sin x + y \cos x + \sin(x-y) - y'' \sin(x-y) = 0

  $$


  将含有 $y''$ 的项移到等式左边，其余各项移到等式右边：


  $$

  y''[\sin x - \sin(x-y)] = -[y\cos x + \sin(x-y)]

  $$


  解得：


  $$

  \frac{\mathrm{d}y}{\mathrm{d}x} = -\frac{y\cos x + \sin(x-y)}{\sin x - \sin(x-y)} = \frac{y\cos x + \sin(x-y)}{\sin(x-y)
  - \sin x}

  $$'
feedback:
  correct: 正确应用复合求导法则求得隐函数一阶导数．
  incorrect: 对 $\cos(x-y)$ 链式求导时注意内部微元为 $(1 - y')$．
