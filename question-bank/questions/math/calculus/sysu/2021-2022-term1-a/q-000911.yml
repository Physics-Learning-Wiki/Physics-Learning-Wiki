reference_answer: $\lim_{n \to \infty} \left( \frac{1}{n+1} + \frac{1}{n+2} + \cdots + \frac{1}{n+n} \right) = \ln 2$．
solution: '提取公因式 $\frac{1}{n}$ 改写为黎曼和形式：


  $$

  \lim_{n \to \infty} \sum_{k=1}^n \frac{1}{n+k} = \lim_{n \to \infty} \frac{1}{n} \sum_{k=1}^n \frac{1}{1 + \frac{k}{n}}

  $$


  根据定积分定义，该和式对应函数 $f(x) = \frac{1}{1+x}$ 在区间 $[0, 1]$ 上的定积分：


  $$

  \int_0^1 \frac{1}{1+x}\,\mathrm{d}x = \left. \ln(1+x) \right|_0^1 = \ln 2 - \ln 1 = \ln 2

  $$


  因此所求数列极限为 $\ln 2$．'
feedback:
  correct: 正确转化为定积分 $\int_0^1 \frac{1}{1+x}\,\mathrm{d}x$ 并求得 $\ln 2$．
  incorrect: 数列和式每项分母呈等差递增时，通常提取 $1/n$ 转化为定积分黎曼和．
