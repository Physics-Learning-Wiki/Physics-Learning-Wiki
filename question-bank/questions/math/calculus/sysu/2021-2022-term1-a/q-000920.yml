stem: '设函数 $f(x)$ 连续，$g(x) = \int_0^1 f(tx)\,\mathrm{d}t$，且已知 $\lim_{x \to 0} \frac{f(x)}{x} = A$（其中 $A$ 为有限常数）：


  1. 求导函数 $g''(x)$（对 $x \neq 0$）；

  2. 讨论 $g''(x)$ 在 $x = 0$ 处的连续性．'
