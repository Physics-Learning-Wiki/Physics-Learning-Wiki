reference_answer: 当 $x \neq 0$ 时 $g'(x) = \frac{f(x) - g(x)}{x}$；且 $g'(0) = \frac{A}{2}$，导函数在 $x=0$ 处连续．
solution: '1. 求 $g''(x)$（$x \neq 0$）：

  作变量代换：令 $u = tx$，则 $\mathrm{d}t = \frac{1}{x}\,\mathrm{d}u$．当 $t=0$ 时 $u=0$；当 $t=1$ 时 $u=x$：


  $$

  g(x) = \frac{1}{x} \int_0^x f(u)\,\mathrm{d}u \implies x g(x) = \int_0^x f(u)\,\mathrm{d}u

  $$


  两边关于 $x$ 求导：


  $$

  g(x) + x g''(x) = f(x) \implies g''(x) = \frac{f(x) - g(x)}{x} \quad (x \neq 0)

  $$


  2. 讨论 $g''(x)$ 在 $x = 0$ 处的连续性：

  已知 $\lim_{x \to 0} \frac{f(x)}{x} = A$ 且 $f$ 连续，从而 $f(0) = 0$．


  由导数定义计算 $g''(0)$：由于 $g(0) = \int_0^1 f(0)\,\mathrm{d}t = 0$，


  $$

  g''(0) = \lim_{x \to 0} \frac{g(x) - g(0)}{x} = \lim_{x \to 0} \frac{\int_0^x f(u)\,\mathrm{d}u}{x^2}

  $$


  应用洛必达法则：


  $$

  g''(0) = \lim_{x \to 0} \frac{f(x)}{2x} = \frac{1}{2} \lim_{x \to 0} \frac{f(x)}{x} = \frac{A}{2}

  $$


  再考察当 $x \to 0$ 时 $g''(x)$ 的极限：


  $$

  \lim_{x \to 0} g''(x) = \lim_{x \to 0} \frac{f(x) - g(x)}{x} = \lim_{x \to 0} \left[ \frac{f(x)}{x} - \frac{g(x)}{x} \right]
  = A - g''(0) = A - \frac{A}{2} = \frac{A}{2}

  $$


  因为 $\lim_{x \to 0} g''(x) = g''(0) = \frac{A}{2}$，所以导函数 $g''(x)$ 在 $x = 0$ 处连续．'
feedback:
  correct: 变量代换求变限积分导数规范，利用导数定义与洛必达严密证明导函数连续．
  incorrect: 遇到含参数积分 $g(x)=\int_0^1 f(tx)\,\mathrm{d}t$，换元为 $\frac{1}{x}\int_0^x f(u)\,\mathrm{d}u$ 后再求导最简捷．
