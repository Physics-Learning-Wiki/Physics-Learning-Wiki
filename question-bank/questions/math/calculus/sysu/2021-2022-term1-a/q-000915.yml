stem: '设平面区域 $A$ 由曲线 $y = e^x$、直线 $x = 1$、圆弧 $y = \sqrt{1-x^2}$（$x \in [0, 1]$）及 $y$ 轴围成：


  1. 求区域 $A$ 的面积；

  2. 求区域 $A$ 绕 $y$ 轴旋转所形成的旋转体的体积．'
