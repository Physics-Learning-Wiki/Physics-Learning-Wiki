reference_answer: 区域面积为 $e - 1 - \frac{\pi}{4}$；旋转体体积为 $\frac{\pi}{3}$ 或相应柱壳积分值．
solution: '在区间 $x \in [0, 1]$ 上，$e^x \ge \sqrt{1-x^2}$（因为 $e^x \ge 1$ 且 $\sqrt{1-x^2} \le 1$）．


  1. 计算面积：


  $$

  S = \int_0^1 (e^x - \sqrt{1-x^2})\,\mathrm{d}x = \int_0^1 e^x\,\mathrm{d}x - \int_0^1 \sqrt{1-x^2}\,\mathrm{d}x

  $$


  其中 $\int_0^1 e^x\,\mathrm{d}x = e - 1$，$\int_0^1 \sqrt{1-x^2}\,\mathrm{d}x$ 为单位圆在第一象限的面积 $\frac{\pi}{4}$．


  因此面积为 $S = e - 1 - \frac{\pi}{4}$．


  2. 计算绕 $y$ 轴旋转体体积：

  利用柱壳法（Cylindrical shells）：


  $$

  V = 2\pi \int_0^1 x(e^x - \sqrt{1-x^2})\,\mathrm{d}x = 2\pi \int_0^1 x e^x\,\mathrm{d}x - 2\pi \int_0^1 x\sqrt{1-x^2}\,\mathrm{d}x

  $$


  第一项分部积分：$\int_0^1 x e^x\,\mathrm{d}x = [x e^x - e^x]_0^1 = (e - e) - (0 - 1) = 1$．


  第二项凑微分：$\int_0^1 x\sqrt{1-x^2}\,\mathrm{d}x = -\frac{1}{2}\int_0^1 (1-x^2)^{1/2}\,\mathrm{d}(1-x^2) = \left. -\frac{1}{3}(1-x^2)^{3/2}
  \right|_0^1 = \frac{1}{3}$．


  因此总旋转体积为：


  $$

  V = 2\pi \left( 1 - \frac{1}{3} \right) = \frac{4\pi}{3}

  $$'
feedback:
  correct: 正确运用定积分几何应用计算平面面积与柱壳旋转体积．
  incorrect: 绕 $y$ 轴旋转体体积利用柱壳公式 $V = 2\pi\int x(y_1-y_2)\,\mathrm{d}x$ 比沿 $y$ 轴切片积分简便得多．
