stem: '设数列 $\{a_n\}$ 满足递推关系：$a_1 = \sqrt{2}$，$a_n = \sqrt{2 + a_{n-1}}$（$n \ge 2$）．


  1. 证明数列 $\{a_n\}$ 的极限存在；

  2. 求数列 $\{a_n\}$ 的极限值．'
