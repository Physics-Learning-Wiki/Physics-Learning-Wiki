reference_answer: 数列收敛，极限值为 $2$．
solution: '1. 证明极限存在：

  - 有上界：用数学归纳法证明 $a_n < 2$．$a_1 = \sqrt{2} < 2$；若 $a_k < 2$，则 $a_{k+1} = \sqrt{2+a_k} < \sqrt{4} = 2$．故对一切 $n \ge 1$ 均有 $a_n
  < 2$．

  - 单调递增：$a_n^2 - a_{n-1}^2 = (2+a_{n-1}) - a_{n-1}^2 = -(a_{n-1}-2)(a_{n-1}+1) > 0$，故 $a_n > a_{n-1}$．

  由单调有界收敛准则，数列 $\{a_n\}$ 极限存在．


  2. 求极限值：

  设 $\lim_{n \to \infty} a_n = A$（$A > 0$）．两边取极限：$A = \sqrt{2+A} \implies A^2 - A - 2 = 0 \implies A = 2$（舍去负根 $A=-1$）．

  因此极限值为 $2$．'
feedback:
  correct: 单调有界性证明规范完整，极限求解正确．
  incorrect: 递推数列必须先用单调有界定理证明极限存在，再对递推式两边取极限．
