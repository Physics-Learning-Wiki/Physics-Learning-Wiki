reference_answer: $\lim_{x \to 0} \frac{\sin \alpha x}{\tan \beta x} = \frac{\alpha}{\beta}$．
solution: '当 $x \to 0$ 时，利用等价无穷小代换：$\sin \alpha x \sim \alpha x$，$\tan \beta x \sim \beta x$．


  因此：


  $$

  \lim_{x \to 0} \frac{\sin \alpha x}{\tan \beta x} = \lim_{x \to 0} \frac{\alpha x}{\beta x} = \frac{\alpha}{\beta}

  $$


  极限值为 $\frac{\alpha}{\beta}$．'
feedback:
  correct: 正确运用基本等价无穷小求得极限．
  incorrect: 当 $u \to 0$ 时，$\sin u \sim u$ 且 $\tan u \sim u$．
