reference_answer: 命题获证，通过因式分解与局部有界性取 $\delta = \min\{1, \frac{\epsilon}{3a^2+3|a|+1}\}$ 规范证明．
solution: '任给 $\epsilon > 0$．需要找到 $\delta > 0$，使得当 $0 < |x - a| < \delta$ 时恒有 $|x^3 - a^3| < \epsilon$．


  因式分解得：


  $$

  |x^3 - a^3| = |x - a| \cdot |x^2 + ax + a^2|

  $$


  先限制 $\delta \le 1$，即当 $|x - a| < 1$ 时，由三角不等式 $|x| \le |a| + 1$．


  放缩二次因子：


  $$

  |x^2 + ax + a^2| \le |x|^2 + |a||x| + a^2 \le (|a|+1)^2 + |a|(|a|+1) + a^2 = 3a^2 + 3|a| + 1 = M > 0

  $$


  令 $\delta = \min\left\{ 1, \frac{\epsilon}{3a^2 + 3|a| + 1} \right\}$．


  当 $0 < |x - a| < \delta$ 时，恒有：


  $$

  |x^3 - a^3| = |x - a| \cdot |x^2 + ax + a^2| < \frac{\epsilon}{M} \cdot M = \epsilon

  $$


  根据极限的 $\epsilon - \delta$ 定义，$\lim_{x \to a} x^3 = a^3$ 成立．'
feedback:
  correct: 正确限制局部邻域界限并构造合适 $\delta$，证明规范严密．
  incorrect: 利用 $\epsilon-\delta$ 证明多项式极限时，先预设 $\delta \le 1$ 控制剩余多项式因子的界限是标准技巧．
