reference_answer: 平面方程为 $2y + z + 3 = 0$．
solution: '两已知平面的法向量分别为 $\mathbf{n}_1 = (2, -2, 4)$ 与 $\mathbf{n}_2 = (3, 1, -2)$．


  所求平面的法向量 $\mathbf{n}$ 需同时垂直于 $\mathbf{n}_1$ 与 $\mathbf{n}_2$，因此可取其叉乘：


  $$

  \mathbf{n} = \mathbf{n}_1 \times \mathbf{n}_2 = \begin{vmatrix} \mathbf{i} & \mathbf{j} & \mathbf{k} \\ 2 & -2 & 4 \\ 3
  & 1 & -2 \end{vmatrix} = (4 - 4)\mathbf{i} - (-4 - 12)\mathbf{j} + (2 - (-6))\mathbf{k} = (0, 16, 8)

  $$


  化简取同向法向量 $\mathbf{n}'' = (0, 2, 1)$．


  过已知点 $(2, 0, -3)$，应用平面的点法式方程：


  $$

  0 \cdot (x - 2) + 2(y - 0) + 1(z - (-3)) = 0 \implies 2y + z + 3 = 0

  $$


  因此所求平面方程为 $2y + z + 3 = 0$．'
feedback:
  correct: 法向量叉乘与点法式方程建立完全准确．
  incorrect: 两法向量叉乘所得向量即为所求平面的法向量．
