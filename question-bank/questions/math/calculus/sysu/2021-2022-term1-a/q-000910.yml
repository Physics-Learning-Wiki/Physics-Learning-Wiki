reference_answer: 恒等式成立，通过定义函数求导证明导数为零且原点取值为 $\pi/2$ 获证．
solution: '构造函数 $f(x) = \arcsin x + \arccos x$（$x \in [-1, 1]$）．


  在开区间 $(-1, 1)$ 内对 $f(x)$ 求导：


  $$

  f''(x) = (\arcsin x)'' + (\arccos x)'' = \frac{1}{\sqrt{1-x^2}} + \left( -\frac{1}{\sqrt{1-x^2}} \right) = 0

  $$


  由拉格朗日中值定理推论，导数在开区间内恒为零的函数必为常数：$f(x) \equiv C$．


  代入特殊点 $x = 0$ 确定常数：


  $$

  C = f(0) = \arcsin 0 + \arccos 0 = 0 + \frac{\pi}{2} = \frac{\pi}{2}

  $$


  由于 $f(x)$ 在闭区间 $[-1, 1]$ 上连续，由连续性知端点处亦成立：$f(-1) = -\frac{\pi}{2} + \pi = \frac{\pi}{2}$，$f(1) = \frac{\pi}{2} + 0 = \frac{\pi}{2}$．


  因此对任意 $\alpha \in [-1, 1]$，恒有 $\arcsin \alpha + \arccos \alpha = \frac{\pi}{2}$．'
feedback:
  correct: 导数验证为 0 并准确由端点/特殊点定常数，证明规范严谨．
  incorrect: 利用导数恒等于 0 证明恒等式是微积分的标准方法．
