reference_answer: $\lim_{x \to 0} \frac{\tan x - x}{(1 - \cos x)\sin x} = \frac{2}{3}$．
solution: '当 $x \to 0$ 时，分母中 $1 - \cos x \sim \frac{x^2}{2}$，$\sin x \sim x$，故分母等价于 $\frac{x^3}{2}$．


  对分子利用泰勒展开：$\tan x = x + \frac{x^3}{3} + o(x^3)$，因此分子 $\tan x - x = \frac{x^3}{3} + o(x^3)$．


  代入极限式：


  $$

  \lim_{x \to 0} \frac{\frac{x^3}{3} + o(x^3)}{\frac{x^3}{2}} = \frac{1/3}{1/2} = \frac{2}{3}

  $$


  因此所求极限为 $\frac{2}{3}$．'
feedback:
  correct: 正确对分子利用三阶展开并化简分母求得 2/3．
  incorrect: 牢记 $\tan x - x \sim \frac{x^3}{3}$，结合分母 $\frac{x^3}{2}$ 即可快速得出结果．
