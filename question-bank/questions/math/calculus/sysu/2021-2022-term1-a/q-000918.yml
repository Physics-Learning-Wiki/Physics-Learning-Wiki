reference_answer: 垂直渐近线为 $x = -1$；斜渐近线为 $y = x - 2$．
solution: '函数的定义域为 $x \neq -1$．


  1. 垂直渐近线：

  考察 $x \to -1$ 处的极限：


  $$

  \lim_{x \to -1} f(x) = \lim_{x \to -1} \frac{x^3+x+1}{(x+1)^2} = \frac{-1-1+1}{0^+} = \frac{-1}{0^+} = -\infty

  $$


  极限为无穷大，因此直线 $x = -1$ 是垂直渐近线．


  2. 斜渐近线：

  展开分母 $(x+1)^2 = x^2 + 2x + 1$．进行多项式长除法：


  $$

  x^3 + x + 1 = (x - 2)(x^2 + 2x + 1) + (4x + 3)

  $$


  因此：


  $$

  f(x) = x - 2 + \frac{4x+3}{(x+1)^2}

  $$


  当 $x \to \pm\infty$ 时：


  $$

  \lim_{x \to \pm\infty} [f(x) - (x - 2)] = \lim_{x \to \pm\infty} \frac{4x+3}{(x+1)^2} = 0

  $$


  因此直线 $y = x - 2$ 是斜渐近线．


  综上，该函数的渐近线为垂直渐近线 $x = -1$ 与斜渐近线 $y = x - 2$．'
feedback:
  correct: 长除法分离线性主部准确，完整求出两条渐近线．
  incorrect: 有理分式分子次数比分母高 1 时必有斜渐近线，长除法可一步分离出渐近线方程．
