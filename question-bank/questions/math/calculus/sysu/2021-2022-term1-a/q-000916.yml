reference_answer: $\int_{-1/2}^{1/2} \frac{\sin x + x^2}{\sqrt{1-x^2}}\,\mathrm{d}x = \frac{\pi}{6} - \frac{\sqrt{3}}{4}$．
solution: '积分区间为对称区间 $[-1/2, 1/2]$，将被积函数拆为两项：


  $$

  \int_{-1/2}^{1/2} \frac{\sin x}{\sqrt{1-x^2}}\,\mathrm{d}x + \int_{-1/2}^{1/2} \frac{x^2}{\sqrt{1-x^2}}\,\mathrm{d}x

  $$


  第一项由于被积函数为奇函数，在对称区间上的积分为零：


  $$

  \int_{-1/2}^{1/2} \frac{\sin x}{\sqrt{1-x^2}}\,\mathrm{d}x = 0

  $$


  第二项被积函数为偶函数，化为半区间积分的两倍：


  $$

  I = 2\int_0^{1/2} \frac{x^2}{\sqrt{1-x^2}}\,\mathrm{d}x

  $$


  令 $x = \sin t$，则 $\mathrm{d}x = \cos t\,\mathrm{d}t$．当 $x = 0$ 时 $t = 0$；当 $x = 1/2$ 时 $t = \pi/6$：


  $$

  I = 2\int_0^{\pi/6} \frac{\sin^2 t}{\cos t} \cos t\,\mathrm{d}t = 2\int_0^{\pi/6} \sin^2 t\,\mathrm{d}t = \int_0^{\pi/6}
  (1 - \cos 2t)\,\mathrm{d}t = \left[ t - \frac{\sin 2t}{2} \right]_0^{\pi/6} = \frac{\pi}{6} - \frac{\sin(\pi/3)}{2} = \frac{\pi}{6}
  - \frac{\sqrt{3}}{4}

  $$


  因此所求积分值为 $\frac{\pi}{6} - \frac{\sqrt{3}}{4}$．'
feedback:
  correct: 正确利用奇函数积分为零简化计算，并通过三角代换求出结果．
  incorrect: 对称区间积分第一步务必检验被积函数奇偶性．
