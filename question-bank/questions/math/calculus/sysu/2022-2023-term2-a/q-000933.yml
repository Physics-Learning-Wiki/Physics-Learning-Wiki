reference_answer: $\oint_L (x^2 + y^2)\,\mathrm{d}s = \frac{8\sqrt{2}}{3}$．
solution: '闭曲线 $L$ 为由顶点 $(\pm 1, 0), (0, \pm 1)$ 围成的正方形闭折线．


  由区域与被积函数的对称性，积分在四个象限的直线上完全相等，且具有 $x, y$ 轮换对称性：


  $$

  \oint_L (x^2 + y^2)\,\mathrm{d}s = 2\oint_L x^2\,\mathrm{d}s = 2 \times 4 \int_{L_1} x^2\,\mathrm{d}s = 8\int_{L_1} x^2\,\mathrm{d}s

  $$


  其中 $L_1$ 为第一象限线段：$x + y = 1$（$0 \le x \le 1$）．其弧长微元为 $\mathrm{d}s = \sqrt{1 + (-1)^2}\,\mathrm{d}x = \sqrt{2}\,\mathrm{d}x$．


  代入计算：


  $$

  8\int_0^1 x^2 \sqrt{2}\,\mathrm{d}x = 8\sqrt{2} \left. \frac{x^3}{3} \right|_0^1 = \frac{8\sqrt{2}}{3}

  $$


  因此积分值为 $\frac{8\sqrt{2}}{3}$．'
feedback:
  correct: 利用对称性化为第一象限单段积分并准确得出结果．
  incorrect: 第一类曲线积分充分利用对称性与轮换对称性可极大简化运算．
