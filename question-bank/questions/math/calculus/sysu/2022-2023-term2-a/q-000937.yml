reference_answer: 原方程通解为 $y = x^2 \arctan(C_1 x) - \frac{x}{C_1} + \frac{1}{C_1^2}\arctan(C_1 x) + C_2$（当 $C_1 \neq 0$）或 $y
  = C_2$（当 $C_1 = 0$）．
solution: '方程不显含未知函数 $y$，令 $p = y''$，则 $y'''' = p''$．原方程化为一阶方程：


  $$

  x p'' = p + x\sin\frac{p}{x} \implies p'' = \frac{p}{x} + \sin\frac{p}{x}

  $$


  这是一个关于 $p$ 的一阶齐次微分方程．令 $u = \frac{p}{x}$，则 $p = xu$，$p'' = u + xu''$：


  $$

  u + xu'' = u + \sin u \implies x\frac{\mathrm{d}u}{\mathrm{d}x} = \sin u

  $$


  分离变量：


  $$

  \frac{\mathrm{d}u}{\sin u} = \frac{\mathrm{d}x}{x} \implies \ln\left|\tan\frac{u}{2}\right| = \ln|x| + \ln|C_1| \implies
  \tan\frac{u}{2} = C_1 x

  $$


  从而：


  $$

  u = 2\arctan(C_1 x) \implies p = \frac{\mathrm{d}y}{\mathrm{d}x} = 2x\arctan(C_1 x)

  $$


  两边积分求 $y$：


  $$

  y = \int 2x\arctan(C_1 x)\,\mathrm{d}x = \int \arctan(C_1 x)\,\mathrm{d}(x^2) = x^2 \arctan(C_1 x) - \int x^2 \frac{C_1}{1
  + C_1^2 x^2}\,\mathrm{d}x

  $$


  拆分有理分式：


  $$

  \int \frac{C_1 x^2}{1 + C_1^2 x^2}\,\mathrm{d}x = \frac{1}{C_1} \int \left( 1 - \frac{1}{1 + C_1^2 x^2} \right)\,\mathrm{d}x
  = \frac{x}{C_1} - \frac{1}{C_1^2} \arctan(C_1 x)

  $$


  因此原微分方程的通解为：


  $$

  y = x^2 \arctan(C_1 x) - \frac{x}{C_1} + \frac{1}{C_1^2}\arctan(C_1 x) + C_2 \quad (C_1 \neq 0)

  $$


  当 $C_1 = 0$ 时，$u = 0 \implies y'' = 0 \implies y = C_2$ 亦为解．'
feedback:
  correct: 正确降阶并利用齐次方程与分部积分求解通解．
  incorrect: 可降阶方程令 $y'=p$ 后化为齐次方程令 $u=p/x$，两步降阶求积分．
