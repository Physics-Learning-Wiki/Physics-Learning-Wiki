reference_answer: $\int_0^{\sqrt{\pi}} \mathrm{d}y \int_y^{\sqrt{\pi}} \sin(x^2)\,\mathrm{d}x = 1$．
solution: '原积分区域为 $D: \{ (x, y) \mid 0 \le y \le \sqrt{\pi}, \, y \le x \le \sqrt{\pi} \}$．


  交换积分次序，改写为关于 $x$ 的先行积分：$0 \le x \le \sqrt{\pi}, \, 0 \le y \le x$：


  $$

  \int_0^{\sqrt{\pi}} \mathrm{d}x \int_0^x \sin(x^2)\,\mathrm{d}y = \int_0^{\sqrt{\pi}} x\sin(x^2)\,\mathrm{d}x

  $$


  利用凑微分法：


  $$

  = -\left. \frac{1}{2}\cos(x^2) \right|_0^{\sqrt{\pi}} = -\frac{1}{2}(\cos\pi - \cos 0) = -\frac{1}{2}(-1 - 1) = 1

  $$


  因此积分值为 $1$．'
feedback:
  correct: 正确交换二重积分次序并凑微分计算求得 1．
  incorrect: $\sin(x^2)$ 原函数非初等，交换积分次序是唯一可行的标准路径．
