reference_answer: 曲线积分与路径无关，原函数为 $u(x, y) = \frac{1}{2}x^2 + e^x - 1 + xy + \sin y$．
solution: '设 $P(x, y) = x + y + e^x$，$Q(x, y) = x + \cos y$．


  计算偏导数：


  $$

  \frac{\partial Q}{\partial x} = 1, \quad \frac{\partial P}{\partial y} = 1

  $$


  在整个平面 $\mathbb{R}^2$ 上恒有 $\frac{\partial Q}{\partial x} = \frac{\partial P}{\partial y}$，且两函数具有一阶连续偏导数，故该曲线积分在全平面上与路径无关．


  选取折线路径 $(0, 0) \to (x, 0) \to (x, y)$ 计算原函数：


  $$

  u(x, y) = \int_0^x P(t, 0)\,\mathrm{d}t + \int_0^y Q(x, t)\,\mathrm{d}t = \int_0^x (t + 0 + e^t)\,\mathrm{d}t + \int_0^y
  (x + \cos t)\,\mathrm{d}t

  $$


  逐项计算：


  $$

  \int_0^x (t + e^t)\,\mathrm{d}t = \left. \left( \frac{1}{2}t^2 + e^t \right) \right|_0^x = \frac{1}{2}x^2 + e^x - 1

  $$


  $$

  \int_0^y (x + \cos t)\,\mathrm{d}t = xy + \sin y

  $$


  相加即得：


  $$

  u(x, y) = \frac{1}{2}x^2 + e^x - 1 + xy + \sin y

  $$'
feedback:
  correct: 正确验证全微分充要条件并用折线积分准确求得原函数．
  incorrect: 全微分方程或路径无关积分，沿平行于坐标轴的折线积分求势函数最不易出错．
