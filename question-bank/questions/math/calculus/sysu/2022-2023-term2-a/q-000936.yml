reference_answer: $I = \pi a^3$．
solution: '上半球面 $S$ 关于平面 $x = 0$ 和 $y = 0$ 均具有完全对称性．由于被积函数 $x$ 和 $y$ 为奇函数：


  $$

  \iint_S x\,\mathrm{d}S = 0, \quad \iint_S y\,\mathrm{d}S = 0

  $$


  因此原积分化简为：


  $$

  I = \iint_S z\,\mathrm{d}S

  $$


  对上半球面 $z = \sqrt{a^2 - x^2 - y^2}$，投影到 $xOy$ 面上的区域为圆盘 $D_{xy}: x^2+y^2 \le a^2$．面积微元为：


  $$

  \mathrm{d}S = \sqrt{1 + (z_x'')^2 + (z_y'')^2}\,\mathrm{d}x\mathrm{d}y = \sqrt{1 + \frac{x^2}{a^2-x^2-y^2} + \frac{y^2}{a^2-x^2-y^2}}\,\mathrm{d}x\mathrm{d}y
  = \frac{a}{\sqrt{a^2-x^2-y^2}}\,\mathrm{d}x\mathrm{d}y

  $$


  代入积分：


  $$

  I = \iint_{D_{xy}} \sqrt{a^2-x^2-y^2} \cdot \frac{a}{\sqrt{a^2-x^2-y^2}}\,\mathrm{d}x\mathrm{d}y = a \iint_{D_{xy}} 1\,\mathrm{d}x\mathrm{d}y
  = a \cdot (\pi a^2) = \pi a^3

  $$


  因此所求积分为 $\pi a^3$．'
feedback:
  correct: 正确运用对称性消去 x, y 项，并利用球面微元化简求得 $\pi a^3$．
  incorrect: 球面面积微元中 $z\,\mathrm{d}S = a\,\mathrm{d}x\mathrm{d}y$ 是极其优美的简化特性．
