stem: '计算第一类曲面积分：


  $$

  I = \iint_S (x + y + z)\,\mathrm{d}S

  $$


  其中 $S$ 为上半球面 $z = \sqrt{a^2 - x^2 - y^2}$（$a > 0$）．'
