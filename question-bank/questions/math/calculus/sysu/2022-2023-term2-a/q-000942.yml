stem: '判断含参变量反常积分：


  $$

  \int_0^{+\infty} e^{-tx}\frac{\sin x}{x}\,\mathrm{d}x

  $$


  在 $t \in [0, +\infty)$ 上是否一致收敛，并给出证明．'
