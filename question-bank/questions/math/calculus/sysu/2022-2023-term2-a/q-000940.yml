stem: '对于函数项级数 $\sum_{n=1}^\infty 2^n \sin\frac{x}{3^n}$，证明：


  1. 在任意有界闭区间 $[-M, M]$（$M > 0$ 为给定常数）上一致收敛；

  2. 在全实轴 $(-\infty, +\infty)$ 上不一致收敛．'
