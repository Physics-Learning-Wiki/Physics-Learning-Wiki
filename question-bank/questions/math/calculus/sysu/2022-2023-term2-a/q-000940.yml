reference_answer: 命题成立，通过魏尔斯特拉斯 M 判别法与柯西准则反例获证．
solution: '1. 证明在 $[-M, M]$ 上一致收敛：

  利用不等式 $|\sin u| \le |u|$，对任意 $x \in [-M, M]$，级数通项满足：


  $$

  |u_n(x)| = \left| 2^n \sin\frac{x}{3^n} \right| \le 2^n \cdot \frac{|x|}{3^n} \le M \left( \frac{2}{3} \right)^n

  $$


  因为等比级数 $\sum_{n=1}^\infty M\left(\frac{2}{3}\right)^n$ 公比 $q = \frac{2}{3} < 1$，级数收敛．

  根据魏尔斯特拉斯 M 判别法（优级数判别法），函数项级数在 $[-M, M]$ 上一致收敛．


  2. 证明在 $(-\infty, +\infty)$ 上不一致收敛：

  若级数在 $\mathbb{R}$ 上一致收敛，则其通项必须在 $\mathbb{R}$ 上一致趋于零，即 $\sup_{x \in \mathbb{R}} |u_n(x)| \to 0$（当 $n \to \infty$）．

  取特殊点列 $x_n = 3^n \in \mathbb{R}$，代入通项：


  $$

  |u_n(x_n)| = 2^n \sin\frac{3^n}{3^n} = 2^n \sin 1

  $$


  由于 $\sin 1 > 0$ 且当 $n \to \infty$ 时 $2^n \to +\infty$，显然 $|u_n(x_n)| \to +\infty \neq 0$．

  通项在全实轴上并不一致趋于 0，因此级数在 $(-\infty, +\infty)$ 上不一致收敛．'
feedback:
  correct: 魏尔斯特拉斯判别法与通项不一致趋于 0 的反例论证准确规范．
  incorrect: 否定全实轴一致收敛的最有力武器是构造点列 $x_n$ 使得通项不趋于 0．
