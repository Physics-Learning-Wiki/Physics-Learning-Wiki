reference_answer: 该级数条件收敛．
solution: '记通项 $u_n = \frac{1}{n^{1+1/n}}$．


  1. 验证自身收敛性（莱布尼茨判别法）：

  考察数列单调性与极限：$u_n = \frac{1}{n \cdot n^{1/n}}$．

  因为当 $n \to \infty$ 时 $n^{1/n} \to 1$，故 $\lim_{n \to \infty} u_n = 0$．

  考虑连续函数 $f(x) = x^{1+1/x} = e^{(1+1/x)\ln x}$，其指数部分导数为 $-\frac{1}{x^2}\ln x + \frac{x+1}{x^2} = \frac{1-\ln x + x}{x^2} >
  0$（当 $x \ge 2$ 时）．故分母递增，通项 $u_n$ 单调递减．

  由莱布尼茨定理，交错级数 $\sum_{n=1}^\infty (-1)^{n-1} u_n$ 收敛．


  2. 检验绝对收敛性：

  考察绝对值级数 $\sum_{n=1}^\infty u_n = \sum_{n=1}^\infty \frac{1}{n^{1+1/n}}$．

  与发散的调和级数 $\sum_{n=1}^\infty \frac{1}{n}$ 作极限比值审敛：


  $$

  \lim_{n \to \infty} \frac{u_n}{1/n} = \lim_{n \to \infty} \frac{n}{n \cdot n^{1/n}} = \lim_{n \to \infty} \frac{1}{n^{1/n}}
  = 1

  $$


  极限为非零常数 $1$．由于调和级数 $\sum_{n=1}^\infty \frac{1}{n}$ 发散，由比较判别法的极限形式知绝对值级数发散．


  综上所述，原级数条件收敛．'
feedback:
  correct: 莱布尼茨判别法与比较审敛法论述严谨，准确判定为条件收敛．
  incorrect: 注意 $n^{1/n} \to 1$，故 $n^{1+1/n}$ 与 $n$ 同阶，绝对值级数必与调和级数同发散．
