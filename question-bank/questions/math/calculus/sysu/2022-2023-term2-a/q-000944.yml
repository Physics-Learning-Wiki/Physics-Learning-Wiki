reference_answer: 傅里叶级数为 $\frac{k}{2} + \frac{2k}{\pi} \sum_{m=1}^\infty \frac{1}{2m-1}\sin\frac{(2m-1)\pi x}{2}$；在连续点和函数为原值，在不连续点
  $2n$ 处和函数为 $\frac{k}{2}$．
solution: '半周期为 $l = 2$．函数在一个周期内分段连续可导，满足狄利克雷充分收敛条件．


  计算傅里叶系数：


  $$

  a_0 = \frac{1}{2}\int_{-2}^2 f(x)\,\mathrm{d}x = \frac{1}{2}\left( \int_{-2}^0 0\,\mathrm{d}x + \int_0^2 k\,\mathrm{d}x
  \right) = \frac{1}{2}(2k) = k

  $$


  $$

  a_n = \frac{1}{2}\int_{-2}^2 f(x)\cos\frac{n\pi x}{2}\,\mathrm{d}x = \frac{k}{2}\int_0^2 \cos\frac{n\pi x}{2}\,\mathrm{d}x
  = \left. \frac{k}{2} \cdot \frac{2}{n\pi}\sin\frac{n\pi x}{2} \right|_0^2 = 0 \quad (n = 1, 2, \dots)

  $$


  $$

  b_n = \frac{1}{2}\int_{-2}^2 f(x)\sin\frac{n\pi x}{2}\,\mathrm{d}x = \frac{k}{2}\int_0^2 \sin\frac{n\pi x}{2}\,\mathrm{d}x
  = \left. -\frac{k}{n\pi}\cos\frac{n\pi x}{2} \right|_0^2 = \frac{k}{n\pi}(1 - \cos n\pi) = \begin{cases} \frac{2k}{n\pi},
  & n \text{ 为奇数} \\[2mm] 0, & n \text{ 为偶数} \end{cases}

  $$


  因此傅里叶级数展开式为：


  $$

  f(x) \sim \frac{a_0}{2} + \sum_{n=1}^\infty b_n \sin\frac{n\pi x}{2} = \frac{k}{2} + \frac{2k}{\pi} \sum_{m=1}^\infty \frac{1}{2m-1}
  \sin\frac{(2m-1)\pi x}{2}

  $$


  由狄利克雷收敛定理，和函数 $S(x)$ 为：

  - 当 $x \neq 2n$（连续点）时：$S(x) = f(x)$；

  - 当 $x = 2n$（跳跃间断点）时：$S(x) = \frac{f(2n^+) + f(2n^-)}{2} = \frac{k + 0}{2} = \frac{k}{2}$．'
feedback:
  correct: 正确计算傅里叶系数并根据狄利克雷定理确定展开式与间断点和函数值．
  incorrect: 方波脉冲的傅里叶级数仅含奇次正弦项，常数项为平均直流分量 $k/2$．
