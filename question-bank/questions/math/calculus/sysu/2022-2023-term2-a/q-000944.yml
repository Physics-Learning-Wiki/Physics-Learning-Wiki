stem: '设函数 $f(x)$ 是以 $4$ 为周期的周期函数，且在基本周期 $[-2, 2)$ 上的表达式为：


  $$

  f(x) = \begin{cases} 0, & x \in [-2, 0) \\[2mm] k, & x \in [0, 2) \end{cases}

  $$


  其中 $k$ 为常数．求 $f(x)$ 的傅里叶级数展开式及其和函数．'
