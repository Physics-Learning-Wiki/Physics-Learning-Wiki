reference_answer: 收敛域为 $\left[ -\frac{4}{3}, -\frac{2}{3} \right)$；和函数为 $S(x) = -\ln(-2-3x)$．
solution: '1. 求收敛域：

  令 $t = 3(x+1)$，原级数化为 $\sum_{n=1}^\infty \frac{t^n}{n}$．

  收敛半径：$\rho = \lim_{n\to\infty} \sqrt[n]{\frac{3^n}{n}} = 3 \implies R = \frac{1}{3}$．

  开区间为 $|x+1| < \frac{1}{3} \iff -\frac{4}{3} < x < -\frac{2}{3}$．

  检验端点：

  - 当 $x = -\frac{2}{3}$ 时，$t = 1$，级数成为调和级数 $\sum_{n=1}^\infty \frac{1}{n}$，发散；

  - 当 $x = -\frac{4}{3}$ 时，$t = -1$，级数成为交错调和级数 $\sum_{n=1}^\infty \frac{(-1)^n}{n}$，收敛．

  因此收敛域为 $\left[ -\frac{4}{3}, -\frac{2}{3} \right)$．


  2. 求和函数：

  在开区间 $\left( -\frac{4}{3}, -\frac{2}{3} \right)$ 内，逐项求导：


  $$

  S''(x) = \sum_{n=1}^\infty 3^n (x+1)^{n-1} = 3 \sum_{n=1}^\infty [3(x+1)]^{n-1} = \frac{3}{1 - 3(x+1)} = \frac{3}{-2 - 3x}
  = -\frac{3}{3x+2}

  $$


  对 $S''(x)$ 积分，且 $S(-1) = 0$：


  $$

  S(x) = \int_{-1}^x -\frac{3}{3t+2}\,\mathrm{d}t = -\left. \ln|3t+2| \right|_{-1}^x = -\ln|3x+2| + \ln|-1| = -\ln(-2-3x)

  $$


  由阿贝尔定理，和函数在左端点 $x = -\frac{4}{3}$ 连续，$S(-4/3) = -\ln 2 = \sum_{n=1}^\infty \frac{(-1)^n}{n}$．

  因此在收敛域 $\left[ -\frac{4}{3}, -\frac{2}{3} \right)$ 上，和函数为 $S(x) = -\ln(-2-3x)$．'
feedback:
  correct: 正确判断端点敛散性确定收敛域，并通过逐项求导积分求得和函数．
  incorrect: 利用已知对数级数展开式 $\sum_{n=1}^\infty \frac{t^n}{n} = -\ln(1-t)$ 亦可直接验证和函数．
