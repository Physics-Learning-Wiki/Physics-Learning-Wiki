reference_answer: $I = \frac{3\pi}{5}$．
solution: '曲面 $S$ 为封闭光滑边界，且取外侧，应用高斯公式：


  $$

  I = \iiint_\Omega \left( \frac{\partial P}{\partial x} + \frac{\partial Q}{\partial y} + \frac{\partial R}{\partial z} \right)\,\mathrm{d}V
  = \iiint_\Omega (2x\sin y + 2y e^z + 3z^2)\,\mathrm{d}x\mathrm{d}y\mathrm{d}z

  $$


  由于立体 $\Omega$ 关于 $x = 0$ 和 $y = 0$ 均对称：

  - 被积函数 $2x\sin y$ 关于 $x$ 为奇函数，关于对称区域的积分为 0；

  - 被积函数 $2y e^z$ 关于 $y$ 为奇函数，关于对称区域的积分为 0．


  因此只需计算最后一项：


  $$

  I = \iiint_\Omega 3z^2\,\mathrm{d}x\mathrm{d}y\mathrm{d}z = 3 \int_0^1 z^2\,\mathrm{d}z \iint_{x^2+y^2 \le z^2} 1\,\mathrm{d}x\mathrm{d}y
  = 3 \int_0^1 z^2 \cdot (\pi z^2)\,\mathrm{d}z = 3\pi \int_0^1 z^4\,\mathrm{d}z = \left. 3\pi \frac{z^5}{5} \right|_0^1 =
  \frac{3\pi}{5}

  $$


  因此曲面积分值为 $\frac{3\pi}{5}$．'
feedback:
  correct: 正确使用高斯公式结合区域对称性化简，求出 $3\pi/5$．
  incorrect: 高斯公式将封闭闭曲面积分化为三重积分，优先观察被积函数的奇偶对称性．
