stem: '计算曲面积分：


  $$

  I = \oiint_S x^2\sin y\,\mathrm{d}y\mathrm{d}z + y^2 e^z\,\mathrm{d}z\mathrm{d}x + z^3\,\mathrm{d}x\mathrm{d}y

  $$


  其中 $S$ 为圆锥体立体 $\Omega: x^2 + y^2 \le z^2 \, (0 \le z \le 1)$ 全表面的外侧．'
