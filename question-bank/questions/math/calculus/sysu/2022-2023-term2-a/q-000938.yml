reference_answer: 通解为 $y = C_1 + \frac{C_2}{x} + C_3 x^3 - \frac{x^2}{2}$．
solution: '该方程为三阶欧拉方程．作自变量代换 $x = e^t$（即 $t = \ln x$）．


  利用微分算子关系：$x y'' = Dy$，$x^2 y'''' = D(D-1)y$，$x^3 y'''''' = D(D-1)(D-2)y$（其中 $D = \frac{\mathrm{d}}{\mathrm{d}t}$）：


  $$

  D(D-1)(D-2)y + D(D-1)y - 4Dy = 3e^{2t}

  $$


  化简左端算子：


  $$

  (D^3 - 3D^2 + 2D) + (D^2 - D) - 4D = D^3 - 2D^2 - 3D = D(D+1)(D-3)

  $$


  方程化为常系数线性微分方程：


  $$

  \frac{\mathrm{d}^3 y}{\mathrm{d}t^3} - 2\frac{\mathrm{d}^2 y}{\mathrm{d}t^2} - 3\frac{\mathrm{d}y}{\mathrm{d}t} = 3e^{2t}

  $$


  1. 求对应齐次方程的通解：

  特征方程为 $r^3 - 2r^2 - 3r = 0 \implies r(r+1)(r-3) = 0$，特征根为 $r_1 = 0, r_2 = -1, r_3 = 3$．

  齐次通解为 $Y(t) = C_1 + C_2 e^{-t} + C_3 e^{3t}$．


  2. 求非齐次特解：

  右端项为 $3e^{2t}$，$\lambda = 2$ 不是特征根．设特解形式为 $y^* = A e^{2t}$：


  $$

  (2^3 - 2 \cdot 2^2 - 3 \cdot 2) A e^{2t} = (8 - 8 - 6)A e^{2t} = -6A e^{2t} = 3e^{2t} \implies A = -\frac{1}{2}

  $$


  特解为 $y^* = -\frac{1}{2}e^{2t}$．


  3. 回代 $t = \ln x$：$e^{-t} = \frac{1}{x}, e^{3t} = x^3, e^{2t} = x^2$．


  因此原方程的通解为：


  $$

  y = C_1 + \frac{C_2}{x} + C_3 x^3 - \frac{x^2}{2}

  $$'
feedback:
  correct: 熟练运用欧拉方程变换化为常系数微分方程并准确求得通解．
  incorrect: 欧拉方程通过 $x = e^t$ 换元转换为常系数微分方程，算子代数化简特征多项式最快捷．
