reference_answer: 该反常积分收敛．
solution: '积分区间为 $(0, 1]$，瑕点仅为 $x = 0$．


  当 $x \to 0^+$ 时，利用等价无穷小展开：$1 - \cos x \sim \frac{x^2}{2}$．


  考察被积函数在瑕点处的渐近阶数：


  $$

  \frac{1 - \cos x}{x^{5/2}} \sim \frac{x^2/2}{x^{5/2}} = \frac{1}{2x^{1/2}}

  $$


  取比较基准积分 $\int_0^1 \frac{1}{x^{1/2}}\,\mathrm{d}x$：


  $$

  \lim_{x \to 0^+} \frac{\frac{1-\cos x}{x^{5/2}}}{\frac{1}{x^{1/2}}} = \lim_{x \to 0^+} \frac{1-\cos x}{x^2} = \frac{1}{2}
  \neq 0

  $$


  因为 $p = \frac{1}{2} < 1$，反常积分 $\int_0^1 \frac{1}{x^{1/2}}\,\mathrm{d}x$ 收敛．


  根据比较判别法的极限形式，原反常积分 $\int_0^1 \frac{1 - \cos x}{x^{5/2}}\,\mathrm{d}x$ 收敛．'
feedback:
  correct: 正确识别瑕点并用等价无穷小化为 p-积分求得收敛．
  incorrect: 在瑕点 $x=0$ 处，$\int_0^1 \frac{1}{x^p}\,\mathrm{d}x$ 当且仅当 $p < 1$ 时收敛．
