stem: 设 $z = f(x, y)$ 由方程 $xy + yz + xz = 1$ 所确定，求 $\frac{\partial z}{\partial x}$、$\frac{\partial^2 z}{\partial x^2}$ 以及
  $\frac{\partial^2 z}{\partial x \partial y}$．
