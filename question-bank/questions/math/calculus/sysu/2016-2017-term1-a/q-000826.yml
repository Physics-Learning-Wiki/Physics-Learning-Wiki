reference_answer: 当 $n = 2m$ 或 $2m+1$ 时，$x\arctan x = \sum_{k=1}^m (-1)^{k-1} \frac{x^{2k}}{2k-1} + o(x^n)$（即 $x^2 - \frac{x^4}{3}
  + \frac{x^6}{5} - \dots + (-1)^{m-1}\frac{x^{2m}}{2m-1} + o(x^n)$）．
solution: '已知 $\arctan x$ 在 $x=0$ 处的麦克劳林展开式为：


  $$

  \arctan x = x - \frac{x^3}{3} + \frac{x^5}{5} - \dots + (-1)^{k-1}\frac{x^{2k-1}}{2k-1} + o(x^{2k})

  $$


  两边同乘 $x$：


  $$

  x \arctan x = x^2 - \frac{x^4}{3} + \frac{x^6}{5} - \dots + (-1)^{k-1}\frac{x^{2k}}{2k-1} + o(x^{2k+1})

  $$


  若要求展开到 $n$ 阶带皮亚诺余项，记 $m = \lfloor \frac{n}{2} \rfloor$：


  $$

  x \arctan x = \sum_{k=1}^m (-1)^{k-1} \frac{x^{2k}}{2k-1} + o(x^n)

  $$


  其中当 $n$ 为偶数 $2m$ 时，最高次项为 $(-1)^{m-1} \frac{x^{2m}}{2m-1}$，余项为 $o(x^n)$；当 $n$ 为奇数 $2m+1$ 时，奇数次项系数为 0，多项式保持一致，余项写为 $o(x^n)$．'
feedback:
  correct: 正确由 $\arctan x$ 展开式乘 $x$ 得到通项公式与皮亚诺余项．
  incorrect: 请注意：展开式只含偶数次幂，系数为 $(-1)^{k-1}/(2k-1)$，余项规范写为 $o(x^n)$．
