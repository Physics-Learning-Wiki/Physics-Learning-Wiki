reference_answer: $\frac{\mathrm{d}x}{\mathrm{d}z} = 0, \frac{\mathrm{d}y}{\mathrm{d}z} = -1$，切线方程为 $\frac{x-1}{0} = \frac{y+1}{-1}
  = \frac{z-2}{1}$（即 $\begin{cases} x = 1 \\ y + z - 1 = 0 \end{cases}$）．
solution: '将方程两边分别对 $z$ 求导：


  $$

  \begin{cases} 2x \frac{\mathrm{d}x}{\mathrm{d}z} + 2y \frac{\mathrm{d}y}{\mathrm{d}z} = z \\ \frac{\mathrm{d}x}{\mathrm{d}z}
  + \frac{\mathrm{d}y}{\mathrm{d}z} + 1 = 0 \end{cases}

  $$


  将点 $(x, y, z) = (1, -1, 2)$ 代入方程组：


  $$

  \begin{cases} 2 \frac{\mathrm{d}x}{\mathrm{d}z} - 2 \frac{\mathrm{d}y}{\mathrm{d}z} = 2 \\ \frac{\mathrm{d}x}{\mathrm{d}z}
  + \frac{\mathrm{d}y}{\mathrm{d}z} = -1 \end{cases}

  $$


  第一式两边除以 2 得 $\frac{\mathrm{d}x}{\mathrm{d}z} - \frac{\mathrm{d}y}{\mathrm{d}z} = 1$．与第二式联立相加解得：


  $$

  \frac{\mathrm{d}x}{\mathrm{d}z} = 0, \quad \frac{\mathrm{d}y}{\mathrm{d}z} = -1

  $$


  曲线在点 $(1, -1, 2)$ 处的切向方向向量为 $\mathbf{v} = \left(\frac{\mathrm{d}x}{\mathrm{d}z}, \frac{\mathrm{d}y}{\mathrm{d}z}, 1\right)
  = (0, -1, 1)$．


  故切线对称式方程为：


  $$

  \frac{x-1}{0} = \frac{y+1}{-1} = \frac{z-2}{1}

  $$'
feedback:
  correct: 正确建立关于导数的线性方程组解得导数值并写出空间切线方程．
  incorrect: 请检查对 $z$ 求导的方程组并在已知点 $(1, -1, 2)$ 处代入消元解出导数．
