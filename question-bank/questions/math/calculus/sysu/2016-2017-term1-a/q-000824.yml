stem: '设空间曲线


  $$

  L: \begin{cases} x^2 + y^2 = \frac{1}{2}z^2, \\ x + y + z = 2 \end{cases}

  $$


  求 $L$ 在点 $(1, -1, 2)$ 处的切线方程以及 $\frac{\mathrm{d}x}{\mathrm{d}z}, \frac{\mathrm{d}y}{\mathrm{d}z}$ 的值．'
