stem: '设二元函数


  $$

  f(x, y) = \begin{cases} \frac{y\sin(x^2)}{x^2+y^2}, & (x, y) \neq (0, 0), \\ 0, & (x, y) = (0, 0) \end{cases}

  $$


  讨论在点 $(0, 0)$ 处的连续性、偏导数存在性及可微性．'
