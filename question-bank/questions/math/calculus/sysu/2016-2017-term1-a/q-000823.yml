reference_answer: 函数在 $(0, 0)$ 处连续，偏导数 $f_x(0,0)=0, f_y(0,0)=0$ 均存在，但在 $(0, 0)$ 处不可微．
solution: '**1. 连续性：**


  利用不等式 $|\sin(x^2)| \le x^2$，当 $(x, y) \neq (0, 0)$ 时：


  $$

  |f(x, y)| = \frac{|y| |\sin(x^2)|}{x^2+y^2} \le \frac{|y| x^2}{x^2+y^2} \le |y|

  $$


  当 $(x, y) \to (0, 0)$ 时，$|y| \to 0$，由夹逼定理知：


  $$

  \lim_{(x, y)\to(0, 0)} f(x, y) = 0 = f(0, 0)

  $$


  因此 $f(x, y)$ 在 $(0, 0)$ 处连续．


  **2. 偏导数存在性：**


  由偏导数定义：


  $$

  f_x(0, 0) = \lim_{x\to 0} \frac{f(x, 0) - f(0, 0)}{x} = \lim_{x\to 0} \frac{0 - 0}{x} = 0

  $$


  $$

  f_y(0, 0) = \lim_{y\to 0} \frac{f(0, y) - f(0, 0)}{y} = \lim_{y\to 0} \frac{0 - 0}{y} = 0

  $$


  两偏导数均存在且为 0．


  **3. 可微性：**


  考察可微性判别极限：


  $$

  \lim_{(x, y)\to(0, 0)} \frac{f(x, y) - f(0, 0) - f_x(0,0)x - f_y(0,0)y}{\sqrt{x^2+y^2}} = \lim_{(x, y)\to(0, 0)} \frac{y\sin(x^2)}{(x^2+y^2)^{\frac{3}{2}}}

  $$


  沿射线 $y = x$（$x > 0$）趋近于 $(0, 0)$：


  $$

  \frac{x\sin(x^2)}{(2x^2)^{\frac{3}{2}}} \sim \frac{x \cdot x^2}{2\sqrt{2}x^3} = \frac{1}{2\sqrt{2}} \neq 0

  $$


  全极限不为 0，因此函数在 $(0, 0)$ 处不可微．'
feedback:
  correct: 严密论证了连续性、偏导数存在性以及沿射线路径检验不可微性．
  incorrect: 可微性必须满足增量全极限为 0；选取射线 $y=x$ 可得极限值为 $\frac{1}{2\sqrt{2}} \neq 0$，从而否定可微性．
