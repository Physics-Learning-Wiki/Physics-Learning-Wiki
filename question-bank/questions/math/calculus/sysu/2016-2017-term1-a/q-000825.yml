reference_answer: $\frac{\partial z}{\partial \mathbf{l}} = \frac{\sqrt{2}}{3}$．
solution: '**1. 求切线方向向量：**


  对抛物线方程 $y^2 = 4x$ 两边关于 $x$ 求导：$2y y'' = 4 \implies y'' = \frac{2}{y}$．


  在点 $(1, 2)$ 处，切线斜率为 $k = y''|_{(1, 2)} = \frac{2}{2} = 1$．


  偏向 $x$ 轴正向，切线的方向角为 $\alpha = \frac{\pi}{4}$．


  单位方向向量为：


  $$

  \mathbf{l} = \left(\cos \frac{\pi}{4}, \sin \frac{\pi}{4}\right) = \left(\frac{\sqrt{2}}{2}, \frac{\sqrt{2}}{2}\right)

  $$


  **2. 求函数的梯度：**


  $$

  \nabla z = \left(\frac{\partial z}{\partial x}, \frac{\partial z}{\partial y}\right) = \left(\frac{1}{x+y}, \frac{1}{x+y}\right)

  $$


  在点 $(1, 2)$ 处，$x+y = 3$，所以 $\nabla z|_{(1, 2)} = \left(\frac{1}{3}, \frac{1}{3}\right)$．


  **3. 计算方向导数：**


  $$

  \frac{\partial z}{\partial \mathbf{l}} = \nabla z \cdot \mathbf{l} = \frac{1}{3} \cdot \frac{\sqrt{2}}{2} + \frac{1}{3}
  \cdot \frac{\sqrt{2}}{2} = \frac{\sqrt{2}}{3}

  $$'
feedback:
  correct: 准确求得切线单位方向向量与梯度向量，点积得出方向导数．
  incorrect: 注意方向向量必须归一化为单位向量 $(\cos\alpha, \sin\alpha)$，且注意偏向 $x$ 轴正向的朝向．
