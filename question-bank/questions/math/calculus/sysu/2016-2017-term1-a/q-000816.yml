reference_answer: $\int_{\frac{1}{e}}^e |\ln x|\,\mathrm{d}x = 2 - \frac{2}{e}$．
solution: '被积函数包含绝对值，按零点 $x = 1$ 分段去绝对值：


  - 当 $x \in [\frac{1}{e}, 1]$ 时，$\ln x \le 0$，所以 $|\ln x| = -\ln x$；

  - 当 $x \in [1, e]$ 时，$\ln x \ge 0$，所以 $|\ln x| = \ln x$．


  拆分积分区间：


  $$

  \int_{\frac{1}{e}}^e |\ln x|\,\mathrm{d}x = -\int_{\frac{1}{e}}^1 \ln x\,\mathrm{d}x + \int_1^e \ln x\,\mathrm{d}x

  $$


  已知 $\int \ln x\,\mathrm{d}x = x\ln x - x + C$．分别代入上下限：


  $$

  \int_{\frac{1}{e}}^1 \ln x\,\mathrm{d}x = [x\ln x - x]_{\frac{1}{e}}^1 = (0 - 1) - \left(\frac{1}{e}(-1) - \frac{1}{e}\right)
  = -1 + \frac{2}{e}

  $$


  $$

  \int_1^e \ln x\,\mathrm{d}x = [x\ln x - x]_1^e = (e - e) - (0 - 1) = 1

  $$


  相加得：


  $$

  \int_{\frac{1}{e}}^e |\ln x|\,\mathrm{d}x = -\left(-1 + \frac{2}{e}\right) + 1 = 2 - \frac{2}{e}

  $$'
feedback:
  correct: 正确以 $x=1$ 为界拆开绝对值并准确应用牛顿–莱布尼茨公式．
  incorrect: 请注意绝对值在 $x \in [1/e, 1]$ 上的符号为负，牛顿–莱布尼茨公式计算 $[x\ln x - x]_{1/e}^1$ 时注意下限正负号．
