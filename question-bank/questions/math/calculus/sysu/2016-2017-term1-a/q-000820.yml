reference_answer: '单调增区间：$(-\infty, -1)$ 和 $(3, +\infty)$；单调减区间：$(-1, 1)$ 和 $(1, 3)$；极大值点 $x = -1$（极大值 $-2$），极小值点 $x = 3$（极小值
  $6$）．


  凸区间：$(-\infty, 1)$；凹区间：$(1, +\infty)$；无拐点．


  垂直渐近线：$x = 1$；斜渐近线：$y = x + 1$．'
solution: '函数的定义域为 $(-\infty, 1) \cup (1, +\infty)$．


  **1. 单调性与极值：**


  求一阶导数：


  $$

  f''(x) = \frac{2x(x-1) - (x^2+3)}{(x-1)^2} = \frac{x^2-2x-3}{(x-1)^2} = \frac{(x-3)(x+1)}{(x-1)^2}

  $$


  令 $f''(x) = 0$，驻点为 $x = -1$ 和 $x = 3$．


  - 在 $(-\infty, -1)$ 上，$f''(x) > 0$，$f(x)$ 单调递增；

  - 在 $(-1, 1)$ 上，$f''(x) < 0$，$f(x)$ 单调递减；

  - 在 $(1, 3)$ 上，$f''(x) < 0$，$f(x)$ 单调递减；

  - 在 $(3, +\infty)$ 上，$f''(x) > 0$，$f(x)$ 单调递增．


  极大值点为 $x = -1$，极大值为 $f(-1) = -2$；极小值点为 $x = 3$，极小值为 $f(3) = 6$．


  **2. 凹凸性与拐点：**


  求二阶导数：因为 $f''(x) = 1 + \frac{4}{(x-1)^2}$，所以：


  $$

  f''''(x) = \frac{8}{(x-1)^3}

  $$


  - 在 $(-\infty, 1)$ 上，$f''''(x) < 0$，曲线为凸；

  - 在 $(1, +\infty)$ 上，$f''''(x) > 0$，曲线为凹．


  由于 $x=1$ 不在定义域内，函数曲线无拐点．


  **3. 渐近线：**


  - 垂直渐近线：$\lim_{x\to 1^-} f(x) = -\infty, \lim_{x\to 1^+} f(x) = +\infty$，所以 $x = 1$ 是垂直渐近线．

  - 斜渐近线：$f(x) = x + 1 + \frac{4}{x-1}$，当 $x\to\pm\infty$ 时 $\lim [f(x) - (x+1)] = 0$，所以斜渐近线为 $y = x + 1$．'
feedback:
  correct: 严密求得导数与二阶导数，正确分析单调性、极值、凹凸区间与渐近线．
  incorrect: 请注意 $x=1$ 不在定义域内，故不是拐点；斜渐近线方程可通过多项式带余除法直接得到 $y = x + 1$．
