reference_answer: $\mathrm{d}z = -\frac{F_1 + F_2 + F_3}{F_3}\,\mathrm{d}x - \frac{F_2 + F_3}{F_3}\,\mathrm{d}y$（其中假定 $F_3
  \neq 0$）．
solution: '设复合中间变量 $u = x, v = x+y, w = x+y+z$．方程为 $F(u, v, w) = 0$．


  两边取全微分：


  $$

  \mathrm{d}F = F_1 \,\mathrm{d}u + F_2 \,\mathrm{d}v + F_3 \,\mathrm{d}w = 0

  $$


  计算各中间变量的微分：


  $$

  \mathrm{d}u = \mathrm{d}x, \quad \mathrm{d}v = \mathrm{d}x + \mathrm{d}y, \quad \mathrm{d}w = \mathrm{d}x + \mathrm{d}y
  + \mathrm{d}z

  $$


  代入微分等式：


  $$

  F_1 \,\mathrm{d}x + F_2 (\mathrm{d}x + \mathrm{d}y) + F_3 (\mathrm{d}x + \mathrm{d}y + \mathrm{d}z) = 0

  $$


  按自变量 $\mathrm{d}x, \mathrm{d}y, \mathrm{d}z$ 合并同类项：


  $$

  (F_1 + F_2 + F_3)\,\mathrm{d}x + (F_2 + F_3)\,\mathrm{d}y + F_3 \,\mathrm{d}z = 0

  $$


  若 $F_3 \neq 0$，解出 $\mathrm{d}z$：


  $$

  \mathrm{d}z = -\frac{F_1 + F_2 + F_3}{F_3}\,\mathrm{d}x - \frac{F_2 + F_3}{F_3}\,\mathrm{d}y

  $$'
feedback:
  correct: 正确使用全微分形式不变性与链式法则解出 $\mathrm{d}z$．
  incorrect: 全微分法则：$\mathrm{d}F = 0$，将 $\mathrm{d}u, \mathrm{d}v, \mathrm{d}w$ 展开后合并 $\mathrm{d}x, \mathrm{d}y, \mathrm{d}z$
    的系数即可直接解得 $\mathrm{d}z$．
