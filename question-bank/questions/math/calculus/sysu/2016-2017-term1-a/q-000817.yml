reference_answer: $\frac{x}{1+e^{-x}} - \ln(1+e^x) + C$（或等价形式 $\frac{x}{1+e^{-x}} - x - \ln(1+e^{-x}) + C$）．
solution: '观察微分式：


  $$

  \mathrm{d}\left(\frac{1}{1+e^{-x}}\right) = -\frac{-e^{-x}}{(1+e^{-x})^2}\,\mathrm{d}x = \frac{e^{-x}}{(1+e^{-x})^2}\,\mathrm{d}x

  $$


  因此可采用分部积分法：


  $$

  \int \frac{x e^{-x}}{(1+e^{-x})^2}\,\mathrm{d}x = \int x \,\mathrm{d}\left(\frac{1}{1+e^{-x}}\right)

  $$


  $$

  = \frac{x}{1+e^{-x}} - \int \frac{1}{1+e^{-x}}\,\mathrm{d}x

  $$


  计算剩余积分，分子分母同乘以 $e^x$：


  $$

  \int \frac{1}{1+e^{-x}}\,\mathrm{d}x = \int \frac{e^x}{e^x+1}\,\mathrm{d}x = \ln(e^x+1) + C_1

  $$


  因此最终结果为：


  $$

  \int \frac{x e^{-x}}{(1+e^{-x})^2}\,\mathrm{d}x = \frac{x}{1+e^{-x}} - \ln(1+e^x) + C

  $$


  （若将后项拆为 $-x - \ln(1+e^{-x})$，亦完全等价）．'
feedback:
  correct: 准确凑微分 $\mathrm{d}(1/(1+e^{-x}))$ 并应用分部积分法．
  incorrect: 请注意分部积分后的剩余积分需分子分母同乘 $e^x$ 凑微分求解，原卷参考解答漏写了首项 $\frac{x}{1+e^{-x}}$，本解析已予核实订正．
