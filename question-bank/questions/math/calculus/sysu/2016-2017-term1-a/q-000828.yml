stem: '设函数 $f(x)$ 在 $[0, 2]$ 上连续，在 $(0, 2)$ 上二阶可导，且满足 $f(1) = f(2) = 0$．


  证明：在 $(0, 2)$ 内存在 $\xi$，使得 $2f''(\xi) + \xi f''''(\xi) = 0$．'
