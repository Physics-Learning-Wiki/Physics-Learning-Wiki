stem: '设函数


  $$

  f(x) = \begin{cases} \sin(\ln(x^2-1)^2), & x \le 0, \\ \frac{\sin(\pi x)}{x(x^2+2x-3)}, & x > 0 \end{cases}

  $$


  分析它的所有间断点及其类型．'
