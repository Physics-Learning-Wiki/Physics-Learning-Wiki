reference_answer: $2x + 9z = 0$．
solution: '平面通过 $y$ 轴，因而经过原点 $(0, 0, 0)$，且其法向量垂直于 $y$ 轴的方向向量 $(0, 1, 0)$．


  因此该平面的法向量必然没有 $y$ 分量，设其方程为：


  $$

  Ax + Cz = 0 \quad (A^2 + C^2 \neq 0)

  $$


  其法向量为 $\mathbf{n}_1 = (A, 0, C)$．


  已知平面 $9x - 4y - 2z - 1 = 0$ 的法向量为 $\mathbf{n}_2 = (9, -4, -2)$．


  由两平面垂直的充要条件：


  $$

  \mathbf{n}_1 \cdot \mathbf{n}_2 = 0 \implies 9A + 0(-4) - 2C = 0 \implies 9A - 2C = 0

  $$


  取 $A = 2, C = 9$（此时法向量为 $(2, 0, 9)$），代入所设方程得：


  $$

  2x + 9z = 0

  $$'
feedback:
  correct: 正确利用过 $y$ 轴的平面方程形式与法向量垂直条件求得结果．
  incorrect: 过 $y$ 轴的平面经过原点且法向量垂直于 $(0,1,0)$，故方程不含 $y$ 和常数项，形如 $Ax+Cz=0$．
