reference_answer: $6$
solution: '曲线具有关于坐标轴与原点的对称性，全长等于第一象限弧长（$t \in [0, \frac{\pi}{2}]$）的 4 倍：


  $$ s = 4 \int_0^{\pi/2} \sqrt{x''(t)^2 + y''(t)^2}\,\mathrm{d}t $$


  计算导数：


  $$

  x''(t) = -3\cos^2 t \sin t, \quad y''(t) = 3\sin^2 t \cos t

  $$


  弧长微分平方：


  $$

  x''(t)^2 + y''(t)^2 = 9\cos^4 t\sin^2 t + 9\sin^4 t\cos^2 t = 9\sin^2 t\cos^2 t (\cos^2 t + \sin^2 t) = 9\sin^2 t\cos^2
  t

  $$


  在 $t \in [0, \frac{\pi}{2}]$ 上，$\sin t \ge 0, \cos t \ge 0$：


  $$

  \sqrt{x''(t)^2 + y''(t)^2} = 3\sin t\cos t

  $$


  计算积分：


  $$

  s = 4 \int_0^{\pi/2} 3\sin t\cos t\,\mathrm{d}t = 12 \left. \left[ \frac{\sin^2 t}{2} \right] \right|_0^{\pi/2} = 12 \cdot
  \frac{1}{2} = 6

  $$'
feedback:
  correct: 正确利用对称性与参数方程弧长公式计算曲线周长．
  incorrect: 开根号时注意三角函数的符号，利用第一象限弧长再乘以 4 可以避免绝对值讨论．
