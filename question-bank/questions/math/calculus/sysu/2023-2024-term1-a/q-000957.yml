reference_answer: 见详细证明过程．
solution: '1. 证明存在 $\eta \in [1, 3]$ 使得 $f(\eta) = 0$：


  因为 $f(1) + f(2) + f(3) = 0$：

  - 若 $f(1) = f(2) = f(3) = 0$，则结论显然成立（可取 $\eta = 1$）；

  - 若 $f(1), f(2), f(3)$ 不全为 $0$，因为三数之和为 $0$，所以在 $\{f(1), f(2), f(3)\}$ 中必至少有一个正数和一个负数．记这两个取值对应的自变量为 $a, b \in \{1, 2, 3\}$，使得
  $f(a) < 0$ 且 $f(b) > 0$．

  因为 $f(x)$ 在闭区间 $[0, 3]$ 上连续，在以 $a$ 和 $b$ 为端点的闭区间上也连续．由介值定理（零点定理），在 $a$ 与 $b$ 之间必存在一点 $\eta \in (a, b) \subset [1, 3]$（或端点），使得
  $f(\eta) = 0$．


  2. 证明存在 $\xi \in (0, 3)$ 使得 $f(\xi) + 2f''(\xi) = 0$：


  目标等式等价于 $\frac{1}{2}f(\xi) + f''(\xi) = 0$．

  构造辅助函数：


  $$

  F(x) = e^{\frac{1}{2}x} f(x)

  $$


  因为 $f(x)$ 在 $[0, 3]$ 连续、在 $(0, 3)$ 可导，显然 $F(x)$ 在 $[0, \eta] \subset [0, 3]$ 上连续，在 $(0, \eta)$ 内可导．

  计算端点值：


  $$

  F(0) = e^0 f(0) = 0

  $$


  $$

  F(\eta) = e^{\frac{1}{2}\eta} f(\eta) = 0

  $$


  由罗尔中值定理，必存在 $\xi \in (0, \eta) \subset (0, 3)$，使得 $F''(\xi) = 0$．

  计算导数：


  $$

  F''(x) = \frac{1}{2}e^{\frac{1}{2}x} f(x) + e^{\frac{1}{2}x} f''(x) = e^{\frac{1}{2}x}\left( \frac{1}{2}f(x) + f''(x) \right)

  $$


  由于 $e^{\frac{1}{2}\xi} \neq 0$：


  $$

  F''(\xi) = 0 \implies \frac{1}{2}f(\xi) + f''(\xi) = 0 \implies f(\xi) + 2f''(\xi) = 0

  $$


  结论得证．'
feedback:
  correct: 正确运用零点定理确定第一个零点并构造指数辅助函数应用罗尔定理．
  incorrect: 证明含有 $k f(x) + f'(x) = 0$ 的导数中值问题，标准辅助函数为 $F(x) = e^{kx} f(x)$．
