stem: '若函数 $f(x)$ 在 $[0, 3]$ 上连续，在 $(0, 3)$ 内可导，且 $f(0) = 0$，$f(1) + f(2) + f(3) = 0$．证明：


  1. 在 $[1, 3]$ 上存在一点 $\eta$，使得 $f(\eta) = 0$；

  2. 在 $(0, 3)$ 内存在一点 $\xi$，使得 $f(\xi) + 2f''(\xi) = 0$．'
