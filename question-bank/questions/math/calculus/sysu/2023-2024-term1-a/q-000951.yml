reference_answer: $0$
solution: '利用基本不等式 $|xy| \le \frac{x^2+y^2}{2}$ 进行放缩：


  $$

  0 \le |xy\ln(x^2+y^2)| \le \frac{x^2+y^2}{2} |\ln(x^2+y^2)|

  $$


  令 $t = x^2+y^2$．当 $(x, y) \to (0, 0)$ 时，$t \to 0^+$．


  考察一元极限：


  $$

  \lim_{t \to 0^+} t\ln t = \lim_{t \to 0^+} \frac{\ln t}{\frac{1}{t}} = \lim_{t \to 0^+} \frac{\frac{1}{t}}{-\frac{1}{t^2}}
  = \lim_{t \to 0^+} (-t) = 0

  $$


  由夹逼准则可知：


  $$

  \lim_{(x,y) \to (0,0)} |xy\ln(x^2+y^2)| = 0 \implies \lim_{(x,y) \to (0,0)} xy\ln(x^2+y^2) = 0

  $$'
feedback:
  correct: 正确应用均值不等式放缩与一元极限结论由夹逼准则求得多元极限．
  incorrect: 多元极坐标下 $xy\ln(r^2) = r^2\sin\theta\cos\theta \cdot 2\ln r$，其中 $\lim_{r \to 0^+} r^2\ln r = 0$ 且三角函数有界，亦可直接得出结论．
