reference_answer: $\frac{x-3}{-1} = \frac{y-3}{-1} = \frac{z}{1}$（或 $\frac{x-3}{1} = \frac{y-3}{1} = \frac{z}{-1}$）
solution: '设直线 $L$ 与 $L_1$ 相交于点 $A$．


  因为点 $A$ 在直线 $L_1$ 上，可设其参数坐标为 $A(t, t, 2t)$．


  直线 $L_1$ 的方向向量为 $\mathbf{s}_1 = (1, 1, 2)$．


  连接 $M(3, 3, 0)$ 与 $A$ 的向量为：


  $$

  \vec{MA} = (t-3, t-3, 2t)

  $$


  因为直线 $L$ 与 $L_1$ 垂直，故 $\vec{MA} \perp \mathbf{s}_1$，即数量积为零：


  $$

  \vec{MA} \cdot \mathbf{s}_1 = (t-3)\cdot 1 + (t-3)\cdot 1 + 2t\cdot 2 = 6t - 6 = 0 \implies t = 1

  $$


  由此得到垂足坐标为 $A(1, 1, 2)$．


  直线 $L$ 的方向向量可取为：


  $$

  \mathbf{s} = \vec{MA} = (1-3, 1-3, 2-0) = (-2, -2, 2) \sim (-1, -1, 1)

  $$


  因此所求直线 $L$ 的对称式方程为：


  $$

  \frac{x-3}{-1} = \frac{y-3}{-1} = \frac{z}{1}

  $$'
feedback:
  correct: 正确设出垂足参数坐标并利用垂直条件确定交点与方向向量．
  incorrect: 两直线垂直相交意味着必须有交点（垂足），点到直线的垂线方向向量即为连接已知点与垂足的向量．
