reference_answer: 泰勒公式为 $f(x) = -x - \frac{x^3}{3} - \frac{x^5}{5} - \dots - \frac{x^{2k-1}}{2k-1} + o(x^n)$；$n$ 阶导数为 $f^{(n)}(0)
  = \begin{cases} -(n-1)!, & n \text{ 为奇数} \\[2mm] 0, & n \text{ 为偶数} \end{cases}$．
solution: '将对数拆开：


  $$

  f(x) = \frac{1}{2}\left[ \ln(1-x) - \ln(1+x) \right]

  $$


  利用基本初等函数的麦克劳林展开式：


  $$

  \ln(1+x) = x - \frac{x^2}{2} + \frac{x^3}{3} - \dots + (-1)^{n-1}\frac{x^n}{n} + o(x^n)

  $$


  $$

  \ln(1-x) = -x - \frac{x^2}{2} - \frac{x^3}{3} - \dots - \frac{x^n}{n} + o(x^n)

  $$


  两式相减：


  $$

  \ln(1-x) - \ln(1+x) = -2x - 2\frac{x^3}{3} - 2\frac{x^5}{5} - \dots = -2\sum_{k=1}^{\lfloor (n+1)/2 \rfloor} \frac{x^{2k-1}}{2k-1}
  + o(x^n)

  $$


  乘以 $\frac{1}{2}$ 得 $n$ 阶麦克劳林展开式（带佩亚诺余项）：


  $$

  f(x) = -x - \frac{x^3}{3} - \frac{x^5}{5} - \dots - \frac{x^{2k-1}}{2k-1} + o(x^n) = \sum_{k=1}^n \frac{(-1)^k - 1}{2k}x^k
  + o(x^n)

  $$


  根据泰勒公式系数与高阶导数的关系 $a_n = \frac{f^{(n)}(0)}{n!}$：


  - 当 $n$ 为偶数时，展开式中无 $x^n$ 项，故 $f^{(n)}(0) = 0$；

  - 当 $n$ 为奇数时，$x^n$ 项的系数为 $-\frac{1}{n}$，故：


  $$

  \frac{f^{(n)}(0)}{n!} = -\frac{1}{n} \implies f^{(n)}(0) = -\frac{n!}{n} = -(n-1)!

  $$


  综上：


  $$

  f^{(n)}(0) = \begin{cases} -(n-1)!, & n \text{ 为奇数} \\[2mm] 0, & n \text{ 为偶数} \end{cases}

  $$'
