reference_answer: $2 + \ln 2$
solution: '根据分段点拆分积分区间：


  $$

  \int_{-1}^5 f(x)\,\mathrm{d}x = \int_{-1}^1 \frac{x^3}{\sqrt{1+x^2}}\,\mathrm{d}x + \int_1^5 \frac{\sqrt{2x-1}}{\sqrt{2x-1}
  + 1}\,\mathrm{d}x

  $$


  1. 考察第一部分：

  被积函数 $g(x) = \frac{x^3}{\sqrt{1+x^2}}$ 满足 $g(-x) = -g(x)$，为奇函数．因此在关于原点对称的区间 $[-1, 1]$ 上的积分为零：


  $$

  \int_{-1}^1 \frac{x^3}{\sqrt{1+x^2}}\,\mathrm{d}x = 0

  $$


  2. 考察第二部分：

  作换元令 $t = \sqrt{2x-1}$，则 $x = \frac{t^2+1}{2}$，$\mathrm{d}x = t\,\mathrm{d}t$．

  当 $x = 1$ 时 $t = 1$；当 $x = 5$ 时 $t = 3$．代入得：


  $$

  \int_1^5 \frac{\sqrt{2x-1}}{\sqrt{2x-1} + 1}\,\mathrm{d}x = \int_1^3 \frac{t}{t+1} \cdot t\,\mathrm{d}t = \int_1^3 \frac{t^2}{t+1}\,\mathrm{d}t

  $$


  分离多项式：


  $$

  \frac{t^2}{t+1} = \frac{(t+1)(t-1) + 1}{t+1} = t - 1 + \frac{1}{t+1}

  $$


  积分得：


  $$

  \int_1^3 \left( t - 1 + \frac{1}{t+1} \right)\,\mathrm{d}t = \left. \left[ \frac{t^2}{2} - t + \ln(t+1) \right] \right|_1^3

  $$


  $$

  = \left( \frac{9}{2} - 3 + \ln 4 \right) - \left( \frac{1}{2} - 1 + \ln 2 \right) = \left( \frac{3}{2} + 2\ln 2 \right)
  - \left( -\frac{1}{2} + \ln 2 \right) = 2 + \ln 2

  $$


  综上，原定积分的值为 $2 + \ln 2$．'
feedback:
  correct: 正确利用奇函数在对称区间的积分为零并完成根式换元积分．
  incorrect: 注意换元时不仅要替换 $\mathrm{d}x$，还要相应同步变换积分上下限．
