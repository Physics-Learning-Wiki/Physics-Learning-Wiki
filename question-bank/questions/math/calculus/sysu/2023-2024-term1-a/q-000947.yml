stem: '设函数


  $$

  f(x) = \begin{cases} \frac{x^3}{\sqrt{1+x^2}}, & x < 1 \\[2mm] \frac{\sqrt{2x-1}}{\sqrt{2x-1} + 1}, & x \ge 1 \end{cases}

  $$


  求积分 $\int_{-1}^5 f(x)\,\mathrm{d}x$ 的值．'
