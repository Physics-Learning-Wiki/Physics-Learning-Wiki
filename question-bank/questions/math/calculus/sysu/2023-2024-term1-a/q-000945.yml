reference_answer: $\frac{1}{2}$
solution: '由夹逼准则进行放缩：


  对任意 $1 \le k \le n$，显然有 $4n^2+1 \le 4n^2+k \le 4n^2+n$．由此可得和式的上下界：


  $$

  \frac{n}{\sqrt{4n^2+n}} \le \sum_{k=1}^n \frac{1}{\sqrt{4n^2+k}} \le \frac{n}{\sqrt{4n^2+1}}

  $$


  分别考察两端的极限：


  $$

  \lim_{n \to \infty} \frac{n}{\sqrt{4n^2+n}} = \lim_{n \to \infty} \frac{1}{\sqrt{4 + \frac{1}{n}}} = \frac{1}{2}

  $$


  $$

  \lim_{n \to \infty} \frac{n}{\sqrt{4n^2+1}} = \lim_{n \to \infty} \frac{1}{\sqrt{4 + \frac{1}{n^2}}} = \frac{1}{2}

  $$


  由夹逼准则可知：


  $$

  \lim_{n \to \infty} \sum_{k=1}^n \frac{1}{\sqrt{4n^2+k}} = \frac{1}{2}

  $$'
feedback:
  correct: 正确建立和式的上下界放缩并由夹逼准则求得极限．
  incorrect: 当和式分母中 $k$ 与 $n^2$ 相比为次阶无穷小时，通常优先使用夹逼准则而非定积分定义．
