stem: '求极限：


  $$

  \lim_{n \to \infty} \left( \frac{1}{\sqrt{4n^2+1}} + \frac{1}{\sqrt{4n^2+2}} + \dots + \frac{1}{\sqrt{4n^2+n}} \right)

  $$


  其中 $n$ 为正整数．'
