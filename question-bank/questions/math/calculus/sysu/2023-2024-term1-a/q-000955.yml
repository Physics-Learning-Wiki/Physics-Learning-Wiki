reference_answer: $2$
solution: '由微积分基本定理可知 $f''(x) = \frac{\sin x}{\pi-x}$，且 $f(0) = 0$．


  应用分部积分法：


  $$

  \int_0^\pi f(x)\,\mathrm{d}x = [x f(x)]_0^\pi - \int_0^\pi x f''(x)\,\mathrm{d}x = \pi f(\pi) - \int_0^\pi \frac{x\sin x}{\pi-x}\,\mathrm{d}x

  $$


  由于 $\pi f(\pi) = \pi \int_0^\pi \frac{\sin x}{\pi-x}\,\mathrm{d}x$，合并两项：


  $$

  \int_0^\pi f(x)\,\mathrm{d}x = \pi \int_0^\pi \frac{\sin x}{\pi-x}\,\mathrm{d}x - \int_0^\pi \frac{x\sin x}{\pi-x}\,\mathrm{d}x
  = \int_0^\pi \frac{(\pi-x)\sin x}{\pi-x}\,\mathrm{d}x

  $$


  化简被积函数：


  $$

  = \int_0^\pi \sin x\,\mathrm{d}x = \left. [-\cos x] \right|_0^\pi = -(-1) - (-1) = 2

  $$


  【另解（交换积分次序）】：


  $$

  \int_0^\pi \mathrm{d}x \int_0^x \frac{\sin t}{\pi-t}\,\mathrm{d}t = \int_0^\pi \frac{\sin t}{\pi-t} \left( \int_t^\pi 1\,\mathrm{d}x
  \right)\,\mathrm{d}t = \int_0^\pi \frac{\sin t}{\pi-t} (\pi-t)\,\mathrm{d}t = \int_0^\pi \sin t\,\mathrm{d}t = 2

  $$'
feedback:
  correct: 正确应用分部积分法或交换二次积分次序化简变限积分并计算定积分．
  incorrect: 分部积分法与二重积分交换次序在此类变限积分问题中完全等价且都非常优美．
