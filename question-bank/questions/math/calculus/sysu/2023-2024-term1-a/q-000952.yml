reference_answer: $\mathrm{d}z = -\frac{e^x\sin y}{y+e^z}\,\mathrm{d}x - \frac{e^x\cos y + z}{y+e^z}\,\mathrm{d}y$
solution: '设多元函数 $F(x, y, z) = e^x\sin y + yz + e^z + 5$．


  计算一阶偏导数：


  $$

  F_x = e^x\sin y

  $$


  $$

  F_y = e^x\cos y + z

  $$


  $$

  F_z = y + e^z

  $$


  根据隐函数求导法则：


  $$

  \frac{\partial z}{\partial x} = -\frac{F_x}{F_z} = -\frac{e^x\sin y}{y+e^z}

  $$


  $$

  \frac{\partial z}{\partial y} = -\frac{F_y}{F_z} = -\frac{e^x\cos y + z}{y+e^z}

  $$


  因此隐函数的全微分公式为：


  $$

  \mathrm{d}z = \frac{\partial z}{\partial x}\,\mathrm{d}x + \frac{\partial z}{\partial y}\,\mathrm{d}y = -\frac{e^x\sin y}{y+e^z}\,\mathrm{d}x
  - \frac{e^x\cos y + z}{y+e^z}\,\mathrm{d}y

  $$'
feedback:
  correct: 正确运用隐函数求偏导法则并合成全微分表达式．
  incorrect: 也可以直接对原方程两边同时求全微分：$e^x\sin y\,\mathrm{d}x + e^x\cos y\,\mathrm{d}y + z\,\mathrm{d}y + y\,\mathrm{d}z + e^z\,\mathrm{d}z
    = 0$，整理求解 $\mathrm{d}z$．
