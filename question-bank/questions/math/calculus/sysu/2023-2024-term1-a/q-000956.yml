reference_answer: $\frac{1}{2}$
solution: '整理式子：


  $$

  \lim_{n \to \infty} \left[ n - n^2\ln\left(1 + \frac{1}{n}\right) \right]

  $$


  令 $t = \frac{1}{n}$，当 $n \to \infty$ 时 $t \to 0^+$：


  $$

  \lim_{t \to 0^+} \left[ \frac{1}{t} - \frac{1}{t^2}\ln(1+t) \right] = \lim_{t \to 0^+} \frac{t - \ln(1+t)}{t^2}

  $$


  利用对数函数的麦克劳林展开：


  $$

  \ln(1+t) = t - \frac{t^2}{2} + o(t^2)

  $$


  代入分子：


  $$

  t - \ln(1+t) = t - \left( t - \frac{t^2}{2} + o(t^2) \right) = \frac{t^2}{2} + o(t^2)

  $$


  因此：


  $$

  \lim_{t \to 0^+} \frac{\frac{t^2}{2} + o(t^2)}{t^2} = \frac{1}{2}

  $$'
feedback:
