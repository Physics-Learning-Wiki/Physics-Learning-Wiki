reference_answer: 最小值 $z_{\min} = -5$，最大值 $z_{\max} = 5$
solution: '构造拉格朗日乘数函数：


  $$

  F(x, y, \lambda) = 3x + 4y + \lambda(x^2 + y^2 - 1)

  $$


  求偏导并令其为零：


  $$

  \begin{cases} F_x = 3 + 2\lambda x = 0 \\[2mm] F_y = 4 + 2\lambda y = 0 \\[2mm] F_\lambda = x^2 + y^2 - 1 = 0 \end{cases}

  $$


  由前两式解得：


  $$

  x = -\frac{3}{2\lambda}, \quad y = -\frac{2}{\lambda}

  $$


  代入单位圆方程：


  $$

  \left(-\frac{3}{2\lambda}\right)^2 + \left(-\frac{2}{\lambda}\right)^2 = \frac{9}{4\lambda^2} + \frac{16}{4\lambda^2} =
  \frac{25}{4\lambda^2} = 1 \implies \lambda^2 = \frac{25}{4} \implies \lambda = \pm \frac{5}{2}

  $$


  - 当 $\lambda = \frac{5}{2}$ 时：$x = -\frac{3}{5}$，$y = -\frac{4}{5}$，此时 $z = 3(-\frac{3}{5}) + 4(-\frac{4}{5}) = -5$；

  - 当 $\lambda = -\frac{5}{2}$ 时：$x = \frac{3}{5}$，$y = \frac{4}{5}$，此时 $z = 3(\frac{3}{5}) + 4(\frac{4}{5}) = 5$．


  因为平面闭曲线 $x^2+y^2=1$ 是有界闭集，连续函数 $z = 3x+4y$ 必存在最大值与最小值．


  故最小值 $z_{\min} = -5$，最大值 $z_{\max} = 5$．'
feedback:
  correct: 正确构建拉格朗日乘数方程组并求解得到条件极值．
  incorrect: 本题亦可用柯西不等式 $(3x+4y)^2 \le (3^2+4^2)(x^2+y^2) = 25$ 直接验证最值取值范围．
