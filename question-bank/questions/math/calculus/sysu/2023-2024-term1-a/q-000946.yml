reference_answer: $a = -2\ln 2$
solution: '计算右极限：


  $$

  \lim_{x \to 0^+} f(x) = \lim_{x \to 0^+} \frac{2}{\sqrt{x+1} - \sqrt{x}} = \frac{2}{\sqrt{1} - 0} = 2

  $$


  计算左极限（$1^\infty$ 型未定式）：


  $$

  \lim_{x \to 0^-} f(x) = \lim_{x \to 0^-} (\cos x)^{\frac{a}{\sin^2 x}} = \exp\left( \lim_{x \to 0^-} \frac{a\ln(\cos x)}{\sin^2
  x} \right)

  $$


  当 $x \to 0^-$ 时，由等价无穷小：


  $$

  \ln(\cos x) = \ln(1 + (\cos x - 1)) \sim \cos x - 1 \sim -\frac{x^2}{2}, \quad \sin^2 x \sim x^2

  $$


  故指数极限为：


  $$

  \lim_{x \to 0^-} \frac{a\ln(\cos x)}{\sin^2 x} = \lim_{x \to 0^-} \frac{a\left(-\frac{x^2}{2}\right)}{x^2} = -\frac{a}{2}

  $$


  因此左极限为 $e^{-a/2}$．


  由于 $f(x)$ 在 $x = 0$ 处极限存在，左极限必须等于右极限：


  $$

  e^{-a/2} = 2 \implies -\frac{a}{2} = \ln 2 \implies a = -2\ln 2

  $$'
feedback:
  correct: 正确计算左右极限并由极限存在条件求出参数 $a$．
  incorrect: $1^\infty$ 型极限通过对数变形转化为 $\frac{0}{0}$ 型并利用等价无穷小求解．
