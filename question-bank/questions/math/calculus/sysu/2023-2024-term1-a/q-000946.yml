stem: '设函数


  $$

  f(x) = \begin{cases} (\cos x)^{\frac{a}{\sin^2 x}}, & x < 0 \\[2mm] \frac{2}{\sqrt{x+1} - \sqrt{x}}, & x \ge 0 \end{cases}

  $$


  在 $x = 0$ 处极限存在，求 $a$ 的值．'
