reference_answer: $\frac{1}{2024}$
solution: '将求和式改写为定积分的黎曼和形式：


  $$

  \lim_{n \to \infty} \frac{1}{n^{2024}} \sum_{i=1}^n i^{2023} = \lim_{n \to \infty} \frac{1}{n} \sum_{i=1}^n \left( \frac{i}{n}
  \right)^{2023}

  $$


  根据定积分定义，这是函数 $f(x) = x^{2023}$ 在区间 $[0, 1]$ 上的定积分：


  $$

  \lim_{n \to \infty} \frac{1}{n} \sum_{i=1}^n \left( \frac{i}{n} \right)^{2023} = \int_0^1 x^{2023}\,\mathrm{d}x = \left.
  \left[ \frac{x^{2024}}{2024} \right] \right|_0^1 = \frac{1}{2024}

  $$'
feedback:
  correct: 正确将幂和极限识别为定积分定义并求出数值．
  incorrect: 提取因子 $1/n$ 将和项化为 $(i/n)^p$，是定积分定义求和式极限的标准范式．
