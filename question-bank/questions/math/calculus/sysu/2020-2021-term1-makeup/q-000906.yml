stem: 设 $w = f(x+y+z, xyz)$，其中函数 $f(u, v)$ 具有二阶连续的偏导数，求一阶偏导数 $\frac{\partial w}{\partial x}$ 以及二阶混合偏导数 $\frac{\partial^2 w}{\partial
  x \partial z}$．
