reference_answer: $\frac{\partial w}{\partial x} = f_1' + yz f_2'$，$\frac{\partial^2 w}{\partial x \partial z} = f_{11}''
  + y(x+z)f_{12}'' + xy^2 z f_{22}'' + y f_2'$．
solution: '中间变量 $u = x+y+z, v = xyz$．


  1. $\frac{\partial w}{\partial x} = f_1'' \cdot 1 + f_2'' \cdot yz = f_1'' + yz f_2''$．


  2. 对 $z$ 求导：$\frac{\partial}{\partial z}(f_1'' + yz f_2'') = \frac{\partial f_1''}{\partial z} + y f_2'' + yz \frac{\partial
  f_2''}{\partial z}$．


  其中 $\frac{\partial f_1''}{\partial z} = f_{11}'''' \cdot 1 + f_{12}'''' \cdot xy$；$\frac{\partial f_2''}{\partial z} = f_{21}''''
  \cdot 1 + f_{22}'''' \cdot xy$．


  代入整理得 $\frac{\partial^2 w}{\partial x \partial z} = f_{11}'''' + y(x+z)f_{12}'''' + xy^2 z f_{22}'''' + y f_2''$．'
feedback:
  correct: 链式法则与乘积法则运用严密，二阶偏导各项完整．
  incorrect: 注意 $f_1', f_2'$ 仍是复合函数，再次求导须继续使用链式法则．
