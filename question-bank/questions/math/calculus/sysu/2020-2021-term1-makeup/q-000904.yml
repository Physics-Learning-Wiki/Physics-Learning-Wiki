reference_answer: $\lim_{(x, y) \to (0, 0)} \frac{\sin(x^3 + y^4)}{x^2 + y^2} = 0$．
solution: '极坐标放缩：$|\sin(x^3+y^4)| \le |x^3+y^4| = \rho^3 |\cos^3\theta + \rho\sin^4\theta| \le 2\rho^3$（当 $\rho < 1$ 时）．


  分母为 $\rho^2$，故原式绝对值 $\le 2\rho \to 0$．由夹逼定理，极限值为 $0$．'
feedback:
  correct: 正确利用不等式放缩与夹逼定理求得极限 0．
  incorrect: 分子次数高于分母次数时，转化为极坐标可简捷证明极限为 0．
