reference_answer: $\lim_{x \to 0^+} x^x = 1$．
solution: '指数恒等式变形：$\lim_{x \to 0^+} x^x = e^{\lim_{x \to 0^+} x\ln x}$．


  求指数极限：$\lim_{x \to 0^+} \frac{\ln x}{1/x} = \lim_{x \to 0^+} \frac{1/x}{-1/x^2} = \lim_{x \to 0^+} (-x) = 0$．


  因此原极限为 $e^0 = 1$．'
feedback:
  correct: 正确对数化并用洛必达求得极限 1．
  incorrect: $0^0$ 型极限恒等变形为 $e^{x\ln x}$．
