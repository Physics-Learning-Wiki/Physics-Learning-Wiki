reference_answer: $\int 2x\arctan x\,\mathrm{d}x = (x^2+1)\arctan x - x + C$．
solution: '分部积分：


  $$

  \int \arctan x\,\mathrm{d}(x^2) = x^2 \arctan x - \int \frac{x^2}{1+x^2}\,\mathrm{d}x = x^2 \arctan x - (x - \arctan x)
  + C = (x^2+1)\arctan x - x + C

  $$'
feedback:
  correct: 分部积分步骤规范，结果准确．
  incorrect: 拆分 $\frac{x^2}{1+x^2} = 1 - \frac{1}{1+x^2}$．
