reference_answer: 数列的最大项在 $n = 3$ 处取得，最大项为 $\sqrt[3]{3}$．
solution: '考察函数 $f(x) = x^{1/x}$（$x > 0$），导数 $f''(x) = x^{1/x} \frac{1-\ln x}{x^2}$，唯一驻点为 $x = e \approx 2.718$．


  $f(x)$ 在 $(0, e]$ 递增，在 $[e, +\infty)$ 递减．最大项可能在 $n=2$ 或 $n=3$．


  比较 $(\sqrt{2})^6 = 8$ 与 $(\sqrt[3]{3})^6 = 9$，因为 $9 > 8$，故 $\sqrt[3]{3} > \sqrt{2}$．最大项为 $\sqrt[3]{3}$（在 $n=3$ 取得）．'
feedback:
  correct: 连续求导分析与离散比较严谨，得出最大项 $\sqrt[3]{3}$．
  incorrect: 驻点 $x=e$ 介于 2 与 3 之间，取 6 次方可快速比较大小．
