reference_answer: 所围图形面积为 $\frac{e}{2} - 1$．
solution: '设切点为 $(x_0, \ln(x_0-1))$，斜率 $\frac{\ln(x_0-1)}{x_0-1} = \frac{1}{x_0-1} \implies x_0 = 1+e$．切线方程为 $y = \frac{x-1}{e}$．


  三角形面积为 $\frac{1}{2} e \cdot 1 = \frac{e}{2}$．曲线与 $x$ 轴围成面积为 $\int_2^{1+e} \ln(x-1)\,\mathrm{d}x = 1$．


  总面积为 $\frac{e}{2} - 1$．'
feedback:
  correct: 切点求解与面积积分计算准确．
  incorrect: 点 $(1,0)$ 在曲线外，必须先设切点求切线．
