reference_answer: $\int \frac{\mathrm{d}x}{(2+\cos x)\sin x} = \frac{1}{3}\ln(2+\cos x) + \frac{1}{6}\ln(1-\cos x) - \frac{1}{2}\ln(1+\cos
  x) + C$．
solution: '分子分母同乘 $\sin x$：


  $$

  \int \frac{\sin x\,\mathrm{d}x}{(2+\cos x)(1-\cos^2 x)} = -\int \frac{\mathrm{d}u}{(u+2)(1-u)(1+u)} = \int \frac{\mathrm{d}u}{(u+2)(u-1)(u+1)}

  $$


  部分分式拆分：$\frac{1}{(u+2)(u-1)(u+1)} = \frac{1/3}{u+2} + \frac{1/6}{u-1} - \frac{1/2}{u+1}$．


  积分并回代 $u = \cos x$ 即得结果．'
feedback:
  correct: 凑微分与部分分式分解准确无误．
  incorrect: 分母含 $\sin x$ 时同乘 $\sin x$ 化为有理式是标准方法．
