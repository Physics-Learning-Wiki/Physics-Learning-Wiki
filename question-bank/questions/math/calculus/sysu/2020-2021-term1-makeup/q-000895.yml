reference_answer: $\lim_{x \to 0} \left( \frac{1+x}{1-e^x} + \frac{1}{x} \right) = -\frac{1}{2}$．
solution: '通分：$\lim_{x \to 0} \frac{x(1+x) + (1-e^x)}{x(1-e^x)} = \lim_{x \to 0} \frac{x + x^2 + 1 - e^x}{-x^2}$．


  利用 $e^x = 1 + x + \frac{x^2}{2} + o(x^2)$，分子化为 $\frac{x^2}{2} + o(x^2)$．


  代入得极限为 $\frac{x^2/2}{-x^2} = -\frac{1}{2}$．（注：分母 $1-e^x \sim -x$，注意负号）．'
feedback:
  correct: 通分与泰勒展开准确，符号无误求得 $-1/2$．
  incorrect: 注意 $1-e^x \sim -x$，遗漏负号是常见失误．
