reference_answer: 极大值点 $x=-2$（极大值 $-4$），极小值点 $x=0$（极小值 $0$）；$(-\infty, -1)$ 上为凸，$(-1, +\infty)$ 上为凹；垂直渐近线 $x=-1$，斜渐近线 $y=x-1$．
solution: '1. $y'' = \frac{x(x+2)}{(1+x)^2}$，驻点 $x=0, -2$．在 $(-\infty, -2)$ 和 $(0, +\infty)$ 递增，在 $(-2, -1)$ 和 $(-1, 0)$ 递减．极大值
  $y(-2)=-4$，极小值 $y(0)=0$．


  2. $y'''' = \frac{2}{(1+x)^3}$．$x < -1$ 时 $y'''' < 0$（凸），$x > -1$ 时 $y'''' > 0$（凹）．


  3. 垂直渐近线 $x=-1$；由 $\frac{x^2}{1+x} = x-1 + \frac{1}{1+x}$ 得斜渐近线 $y = x-1$．（原题手写答案曾有分子符号展开失误，本解答已严密修正）．'
feedback:
  correct: 准确求出一阶二阶导数并全面给出函数性态及更正说明．
  incorrect: 注意 $2x(1+x)-x^2 = x^2+2x$，斜渐近线为 $y = x - 1$．
