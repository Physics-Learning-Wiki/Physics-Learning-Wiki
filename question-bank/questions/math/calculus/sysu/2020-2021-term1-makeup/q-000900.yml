stem: '设函数 $f(x) = (1-x^2)\sin x$：


  1. 求 $f(x)$ 在 $x = 0$ 点带有皮亚诺余项的 $7$ 阶泰勒展开式；

  2. 由此求 $f^{(7)}(0)$ 的值．'
