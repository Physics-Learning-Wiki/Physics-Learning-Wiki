stem: '证明数列：


  $$

  \sqrt{2}, \, \sqrt{2+\sqrt{2}}, \, \sqrt{2+\sqrt{2+\sqrt{2}}}, \, \dots, \, \underbrace{\sqrt{2+\sqrt{2+\dots+\sqrt{2}}}}_{n
  \text{ 个根号}}, \, \dots

  $$


  收敛，并求其极限．'
