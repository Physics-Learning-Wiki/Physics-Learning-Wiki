reference_answer: 数列收敛，极限为 $2$．
solution: '递推式为 $a_1 = \sqrt{2}, a_n = \sqrt{2+a_{n-1}}$．


  1. 有界性：数学归纳法易证 $a_n < 2$（对所有 $n \ge 1$）．

  2. 单调性：$a_n^2 - a_{n-1}^2 = -(a_{n-1}-2)(a_{n-1}+1) > 0$，故 $a_n > a_{n-1}$ 单调递增．

  3. 求极限：由单调有界准则极限 $A$ 存在，$A = \sqrt{2+A} \implies A^2 - A - 2 = 0$，舍去负根得 $A = 2$．'
feedback:
  correct: 单调有界性证明严谨，方程取极限求解准确．
  incorrect: 递推数列求极限严禁先斩后奏，必须先证明极限存在性．
