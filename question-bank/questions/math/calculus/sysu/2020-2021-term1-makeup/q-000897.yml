reference_answer: 命题成立，通过对称变量代换 $x = \pi/2 - t$ 获证．
solution: '令 $I$ 为左端积分．作变量代换 $x = \frac{\pi}{2} - t$：


  $$

  I = \int_{\pi/2}^0 \frac{\frac{\pi}{2}-t}{1+\sin t + \cos t}\,(-\mathrm{d}t) = \frac{\pi}{2} \int_0^{\pi/2} \frac{1}{1+\sin
  x + \cos x}\,\mathrm{d}x - I

  $$


  移项得 $2I = \frac{\pi}{2} \int_0^{\pi/2} \frac{1}{1+\sin x + \cos x}\,\mathrm{d}x$，即 $I = \frac{\pi}{4} \int_0^{\pi/2} \frac{1}{1+\sin
  x + \cos x}\,\mathrm{d}x$．'
feedback:
  correct: 正确使用区间对称代换消去分子中的 $x$．
  incorrect: 在 $[0, \pi/2]$ 上的对称代换 $x = \pi/2 - t$ 能互换正弦与余弦．
