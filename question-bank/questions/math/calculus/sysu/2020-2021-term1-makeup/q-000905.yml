reference_answer: 垂线方程为 $\frac{x-2}{-8} = \frac{y-1}{5} = \frac{z-3}{-11}$．
solution: '设垂足为 $P(-2+2t, 2+t, -t)$，方向向量 $\vec{AP} = (2t-4, t+1, -t-3)$．


  由垂直条件 $\vec{AP} \cdot (2, 1, -1) = 0 \implies 2(2t-4) + (t+1) - (-t-3) = 6t - 4 = 0 \implies t = 2/3$．


  方向向量为 $(-8/3, 5/3, -11/3)$，同向向量为 $(-8, 5, -11)$．点向式方程为 $\frac{x-2}{-8} = \frac{y-1}{5} = \frac{z-3}{-11}$．'
feedback:
  correct: 垂足参数求解准确，点向式垂线方程规范．
  incorrect: 利用直线参数方程求垂足是解决过点作垂线的最简方法．
