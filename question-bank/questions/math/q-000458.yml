hints:
- 先固定 $z=1$，分解关于 $w$ 的分母。
- 留数可用 $\lim_{w\to w_0}(w-w_0)G_{12}$。
feedback:
  correct: 正确区分响应变量的有理极点与参数空间的平方根分支。
  incorrect: 固定参数后再判断关于响应变量的奇点。
  choices:
    A: 去掉因子 $w-1$ 后，余下分母在该点为 $2$。
    B: 另一个因子在 $w=-1$ 为 $-2$，留数应为负。
    C: 此时函数精确等于 $w^{-2}$。
    D: 直接代入给出 $-1$，不是零。
