choices:
- id: A
  content: 不同基底必定给出不同的实际解。
- id: B
  content: 重本征值使初值问题不再有唯一解。
- id: C
  content: 初值在 S 内，所以它完全不随时间改变。
- id: D
  content: 无论怎样选择 S 的基底，解都是 $e^{-3t/(2\mu)}w_0$。
