estimated_seconds: 240
hints:
- 两个基方向对应同一个生成元本征值。
- 将共同的时间因子从线性组合中提出。
feedback:
  correct: 把坐标表示的变化与实际向量演化区分开。
  incorrect: 同一本征值的所有方向具有相同时间因子。
  choices:
    A: 展开系数会变，但合成后的向量不变。
    B: 所给线性常微分方程仍有唯一解，谱简并不会破坏唯一性。
    C: 该子空间的生成元本征值为负，只有常数零模才不衰减。
    D: 共同的衰减因子可直接乘在整个初始向量上。
