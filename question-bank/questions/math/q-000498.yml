stem: 'Luo 等（2026）研究网络扩散的等待时间与松弛速度；指数等待时间是其一般模型的一个可解极限。 [研究来源（DOI）](https://doi.org/10.1038/s41467-026-72161-w)。


  在指数等待模型 $\dot x=(P-I)x/\mu$ 中，设 $P$ 在二维子空间 $S=\{(a,b,c)^T:a+b+c=0\}$ 上恒满足 $Pw=-\tfrac12w$，$\mu>0$。初值 $w_0=(1,-1,0)^T$ 位于
  $S$。可以任选 $S$ 的两条独立向量作为展开基底。


  关于基底选择与后续解，哪一结论正确？'
solution: '对任何 $w\in S$，生成元都作用为 $(P-I)w/\mu=-3w/(2\mu)$。因此无论怎样把初值展开成该子空间的两个基向量，每个系数都乘同一个 $e^{-3t/(2\mu)}$。


  重新合并后恒得 $x(t)=e^{-3t/(2\mu)}w_0$。检查：零时刻恢复初值，代回方程成立，分量和始终为零。更换基底会改变展开系数的具体表示，但不会改变作为向量的解；重本征值本身也不意味着缺少唯一演化。


  研究对应：Results, homogeneous exponential limit Eq. (2) and eigenvalue-based relaxation analysis。教学范围：这里已假定给定子空间由普通本征向量构成，不涉及不可对角化矩阵的广义本征模。


  来源：[DOI 10.1038/s41467-026-72161-w](https://doi.org/10.1038/s41467-026-72161-w)。'
difficulty: 1
