hints:
- 寻找 $1+\varepsilon$ 的零点。
- 求它到展开点的复平面距离。
feedback:
  correct: 用最近分支点确定了局部展开的范围。
  incorrect: 应定位复奇点，不能只看函数在正实轴上的表现。
  choices:
    A: 分支点 $-1$ 距离展开点为 $1$。
    B: 展开点不是奇点，存在非零收敛邻域。
    C: 半径为 $2$ 的圆盘已经包含分支点。
    D: 存在有限距离的分支点，不能是整函数级数。
