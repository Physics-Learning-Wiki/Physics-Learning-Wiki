hints:
- 先对 W 作乘积求导。
- 把两个二阶导数都替换为 s 乘对应函数。
feedback:
  correct: 用方程本身证明了非零朗斯基量保持常数。
  incorrect: 先求导再代入；不能凭两解满足同一个方程推断线性相关。
  choices:
    A: W 的导数为零，由初值确定非零常数。
    B: 该表达式导数不为零，与计算矛盾。
    C: 它连给定的 W(0)=1/π 都不满足。
    D: 同一二阶方程可以有两个独立解，且给定零点值已排除 W=0。
