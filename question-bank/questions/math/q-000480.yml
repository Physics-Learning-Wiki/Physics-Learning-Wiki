- 再用轴线取值决定另一个系数。
feedback:
  correct: 先筛除奇异解，再用归一化固定幅度。
  incorrect: 方程的通解并不自动满足轴线条件。
  choices:
    A: 有限性给 B=0，归一化给 A=1。
    B: 在轴线附近对数发散。
    C: 有限但在轴线取值二，不满足给定归一化。
    D: 增加有限的 J0 项不能取消 Y0 的发散。
