stem: |-
  Bodet 等（2024）测量亚太赫兹贝塞尔束，观察到中心窄峰、同心环及有限距离内较稳定的束形。 [研究来源（DOI）](https://doi.org/10.1038/s41598-024-70542-z)。

  为解释论文观察到的中心峰和同心环，本题建立一个轴对称理想剖面 $u(r)$，$r\geq0$，满足

  $$u^{\prime\prime}+\frac1r u^{\prime}+k^2u=0\quad(r>0),\qquad k>0.$$

  给定其通解为 $u(r)=A J_0(kr)+B Y_0(kr)$。所需的特殊函数知识全部如下：$J_0(s)\to1$，而 $Y_0(s)\sim(2/\pi)\ln s$ 当 $s\to0^+$。要求轴线上 $u$ 有限并归一化为 $u(0)=1$。满足要求的解是哪一个？这一理想方程是本题教学模型，不是论文对实测束形的完整拟合。
solution: |-
  当 $r\to0^+$ 时，$Y_0(kr)$ 按对数发散，而 $J_0(kr)$ 有有限极限一。常数倍的有限项无法抵消非零的对数发散，所以有限性要求 $B=0$。

  随后 $u(0)=A=1$，因此 $u(r)=J_0(kr)$。检查：它满足给定方程及轴线归一化；如果将中心轴从区域中移除，有限性条件便不同，不能一概排除 $Y_0$。理想剖面只用于理解径向函数选择，实际有限孔径束仍有有限传播距离。

  研究对应：Results, Effect of beam type, Fig. 6(a)–(c); Methods, Sub-THz Bessel beam generation and reception, Fig. 7(c),(d)。教学范围：论文没有直接推导本题径向方程；此处是对其观测环形结构的标准理想化解释，不重现测量数据。

  来源：[DOI 10.1038/s41598-024-70542-z](https://doi.org/10.1038/s41598-024-70542-z)。
