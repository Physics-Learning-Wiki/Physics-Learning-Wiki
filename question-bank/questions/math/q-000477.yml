feedback:
  correct: 分别检查了近似误差、对数导数与单调性。
  incorrect: 局部斜率近似与整条解的误差不同；单调也不等于线性。
  choices:
    A: 分子与分母约去 κC 后得到这一比值。
    B: C/(1−C) 随 C 单调增加，端点给出上界。
    C: 除以 C 并使用正性即可推出两个结论。
    D: 斜率依赖 C；单调函数完全可以是曲线。
