feedback:
  correct: 正确使用了双正交基底及本征值的倒数。
  incorrect: 一般本征向量矩阵的逆不等于转置，必须检验基底的正交性。
  choices:
    A: 它们是实际逆矩阵的两行。
    B: 左、右基底夹住本征值倒数，构成逆算子。
    C: 仅在实正交等额外条件下成立；本题 P 的列向量不正交。
    D: 矩阵乘法与模态展开得到同一结果。
