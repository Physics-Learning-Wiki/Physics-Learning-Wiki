hints:
- 先取映射两边的模。
- 注意 $-i(\xi+i\eta)=-i\xi+\eta$。
feedback:
  correct: 正确使用模把孔外区域变为半平面。
  incorrect: 检查复指数实部的符号，及边界与区域的区别。
  choices:
    A: 实坐标控制辐角，不能单独判定孔内外。
    B: 因为 $r/R=e^\eta>1$，所以 $\eta>0$。
    C: 负的虚坐标对应 $r<R$，位于孔内。
    D: 零虚坐标只对应圆周边界。
