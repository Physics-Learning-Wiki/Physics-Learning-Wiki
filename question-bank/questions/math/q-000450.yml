stem: 'Mose 等（2025）在光弹性应力分析中，把圆孔附近的区域映射为较简单的复平面区域。 [研究来源（DOI）](https://doi.org/10.1038/s41598-025-88114-0)。


  取圆孔中心为原点、半径为 $R>0$，只研究孔外 $r>R$ 的局部区域。令 $\zeta=\xi+i\eta$，采用论文所用映射


  $$

  z=iR e^{-i\zeta}=r e^{i\theta}.

  $$


  ![圆孔及外部一点的坐标示意，图不按比例绘制](asset:math-hole)


  图中文字说明：白色圆盘是孔，圆心为 $0$；孔外一点为 $z$，到圆心距离为 $r$，与正实轴夹角为 $\theta$。不要求处理整个圆周的分支拼接。孔外区域对应哪一条件？'
solution: '把 $\zeta=\xi+i\eta$ 代入，得到


  $$

  z=iR e^{-i\xi+\eta},\qquad |z|=R e^\eta.

  $$


  因此 $\eta=\ln(r/R)$。孔外 $r/R>1$，所以 $\eta>0$；圆周本身才对应 $\eta=0$。这里用模确定径向坐标，不需要先选定辐角分支。


  检查：当 $r\to R^+$ 时，$\eta\to0^+$；当 $r$ 增大时，$\eta$ 单调增大。对数的自变量 $r/R$ 无量纲。


  研究对应：The concept of conformal mapping, Eqs. (25a)–(25c), Fig. 4。教学范围：不重建光弹性应力，也不证明映射在整个环域上单值可逆。


  来源：[DOI 10.1038/s41598-025-88114-0](https://doi.org/10.1038/s41598-025-88114-0)。'
