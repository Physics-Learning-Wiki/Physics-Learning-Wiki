  incorrect: 先检查导数符号，再检查是否保留了 1−C 因子。
  choices:
    A: 满足初值，但会随 y 增加，与负的导数矛盾。
    B: 把与 C 有关的斜率误当成常数；还可能离开物理范围。
    C: 浓度方向相反，而且一般不满足非线性方程。
    D: 由对数比值积分精确得到。
