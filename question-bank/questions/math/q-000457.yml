hints:
- 可去奇点定理需要穿孔邻域上的单值解析函数。
- 根的模不发散，但绕行后会变号。
feedback:
  correct: 利用多值性而非仅靠函数模判断。
  incorrect: 有界性并不足以把多值函数的分支点判成可去奇点。
  choices:
    A: 二阶极点也会发散，并不能解释绕行换支。
    B: 缺少整个穿孔邻域上的单值解析前提。
    C: 绕行会换支，符合分支点的特征。
    D: 一阶极点会发散，且是单值函数的孤立奇点。
