choices:
- id: A
  content: 两种情况的所有内部浓度也必然相同。
- id: B
  content: 两种情况的 $C(h)$ 相同，因为积分只含端点温差。
- id: C
  content: 二次温度剖面必使 $C(h)$ 减半。
- id: D
  content: 仅凭方程无法判断端点浓度的关系。
answer:
  choice: B
