hints:
- 把右边从零积分到 h。
- 两种温度函数是否具有相同的端点差？
feedback:
  correct: 识别了端点关系与内部剖面的区别。
  incorrect: 直接积分全微分，先判断依赖的是温度路径还是端点温差。
  choices:
    A: 内部温度不同，一般会产生不同的内部浓度。
    B: 所给常系数方程积分后只含温度的端点差。
    C: 没有这样的二分之一因子；导数积分恢复完整温差。
    D: 已有方程和相同冷端浓度足以作端点比较。
