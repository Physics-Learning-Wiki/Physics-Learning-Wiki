stem: 'Santos（2024）研究带时间延迟的牛顿冷却模型，用它讨论热历史对后续冷却的影响。 [研究来源（DOI）](https://doi.org/10.1103/PhysRevE.109.044149)。


  论文在延迟项的二阶截断中得到含二阶时间导数的方程。为独立检验“方程阶数改变后需要什么初始资料”，本题使用原创的无量纲教学方程


  $$\theta^{\prime\prime}+5\theta^{\prime}+4\theta=0.$$


  两种情形都给定 $\theta(0)=1$：情形甲另给 $\theta^{\prime}(0)=0$，情形乙另给 $\theta^{\prime}(0)=-4$。请求出这两个解，并用它们说明单独的 $\theta(0)$ 是否能确定二阶演化。系数
  $5,4$ 是教学选取，不要求由某个真实延迟参数反推。'
solution: '设解为 $e^{rt}$，特征方程 $r^2+5r+4=(r+1)(r+4)=0$，因此一般解为 $\theta=Ae^{-t}+Be^{-4t}$。共同初值要求 $A+B=1$。


  情形甲有 $-A-4B=0$，解得 $A=4/3$、$B=-1/3$，所以 $\theta_{\text{甲}}=(4e^{-t}-e^{-4t})/3$。情形乙有 $-A-4B=-4$，得到 $A=0$、$B=1$，所以 $\theta_{\text{乙}}=e^{-4t}$。


  两个解的初值相同，但导数和后续曲线不同。这一反例表明，只给函数在一点的值不足以确定该二阶方程的解；还需要一个独立条件，例如初始导数。检查：每个指数对应一个特征根，两解均满足微分方程；分别代入零点可验证各自的两个初值。该教学比较没有证明截断方程在任意时间都逼近原延迟模型，截断精度是另一问题。


  研究对应：Section II A, second-order expansion, Eqs. (5)–(8), discussion of two initial conditions。教学范围：没有将这些教学系数当作论文拟合值；没有检验二阶近似相对于完整延迟模型的误差。


  来源：[DOI 10.1103/PhysRevE.109.044149](https://doi.org/10.1103/PhysRevE.109.044149)。'
