stem: |
  设度规 $g_{\mu\nu}$ 在坐标基下是对角的。证明以下 Christoffel 符号公式（下式中重复指标不求和）：

  1. 若 $\mu,\nu,\lambda$ 两两不同，则 $\Gamma^{\mu}{}_{\nu\lambda}=0$；
  2. 若 $\nu\ne\mu$，则

  $$
  \Gamma^{\mu}{}_{\nu\nu}
  =-\frac{1}{2g_{\mu\mu}}\partial_{\mu}g_{\nu\nu};
  $$

  3. 若 $\nu\ne\mu$，则

  $$
  \Gamma^{\mu}{}_{\mu\nu}
  =\Gamma^{\mu}{}_{\nu\mu}
  =\partial_{\nu}\ln\sqrt{|g_{\mu\mu}|}.
  $$
