reference_answer: |
  对角度规下 Levi-Civita 公式中的 $g^{\mu\sigma}$ 只有 $\sigma=\mu$ 一项（不求和）：

  $$
  \Gamma^{\mu}{}_{\nu\lambda}
  =\frac{1}{2g_{\mu\mu}}
  \left(\partial_{\nu}g_{\lambda\mu}
  +\partial_{\lambda}g_{\nu\mu}
  -\partial_{\mu}g_{\nu\lambda}\right).
  $$

  若 $\mu,\nu,\lambda$ 两两不同，右端三个 $g$ 分量都含不同指标，度规分量为零，故 $\Gamma=0$．

  若 $\nu=\lambda\ne\mu$，第一、二项为零，只剩

  $$
  \Gamma^{\mu}{}_{\nu\nu}
  =-\frac{1}{2g_{\mu\mu}}\partial_{\mu}g_{\nu\nu}.
  $$

  若 $\mu=\nu\ne\lambda$（或 $\mu=\lambda\ne\nu$），第二项为零，剩下

  $$
  \Gamma^{\mu}{}_{\mu\lambda}
  =\frac{1}{2g_{\mu\mu}}\partial_{\lambda}g_{\mu\mu}
  =\partial_{\lambda}\ln\sqrt{|g_{\mu\mu}|}.
  $$
solution: |
  从 Levi-Civita 联络的显式形式出发：

  $$
  \Gamma^{\mu}{}_{\nu\lambda}
  =\frac{1}{2}g^{\mu\sigma}
  \left(
  \partial_{\nu}g_{\lambda\sigma}
  +\partial_{\lambda}g_{\nu\sigma}
  -\partial_{\sigma}g_{\nu\lambda}
  \right).
  $$

  由于度规对角，$g^{\mu\sigma}$ 只在 $\sigma=\mu$ 时非零，且 $g^{\mu\mu}=1/g_{\mu\mu}$．因此

  $$
  \Gamma^{\mu}{}_{\nu\lambda}
  =\frac{1}{2g_{\mu\mu}}
  \left(
  \partial_{\nu}g_{\lambda\mu}
  +\partial_{\lambda}g_{\nu\mu}
  -\partial_{\mu}g_{\nu\lambda}
  \right).
  $$

  **情形一：** $\mu,\nu,\lambda$ 两两不同．此时 $g_{\lambda\mu}=0$、$g_{\nu\mu}=0$、$g_{\nu\lambda}=0$，所以
  $\Gamma^{\mu}{}_{\nu\lambda}=0$．

  **情形二：** $\nu=\lambda\ne\mu$．前两项消失，只剩

  $$
  \Gamma^{\mu}{}_{\nu\nu}
  =-\frac{1}{2g_{\mu\mu}}\partial_{\mu}g_{\nu\nu}.
  $$

  **情形三：** $\mu=\nu\ne\lambda$．此时 $g_{\lambda\mu}=0$、$g_{\nu\lambda}=0$，于是

  $$
  \Gamma^{\mu}{}_{\mu\lambda}
  =\frac{1}{2g_{\mu\mu}}\partial_{\lambda}g_{\mu\mu}
  =\partial_{\lambda}\ln\sqrt{|g_{\mu\mu}|}.
  $$

  由联络在下指标上的对称性，$\Gamma^{\mu}{}_{\lambda\mu}=\Gamma^{\mu}{}_{\mu\lambda}$，得到第三个公式．

  这些公式在球坐标、Schwarzschild 度规以及宇宙学度规中都很实用．

  **参考定位：** Carroll, *Spacetime and Geometry*, 第 3 章 Exercise 3．
