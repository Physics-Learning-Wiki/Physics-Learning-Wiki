feedback:
  correct: 正确：四张乘积坐标卡覆盖了环面，并且重叠区上的每个角坐标转移都是恒等映射或平移 $2\pi$，因此整体转移函数光滑。
  incorrect: 请检查单个 $S^{1}$ 坐标能否覆盖整个圆周，以及重叠区的转移函数是否只相差 $2\pi$ 的整数倍；还要确认这些转移函数的定义域确实覆盖了所有非空交集。
reference_answer: |
  把 $S^{1}$ 用两张角坐标卡覆盖：

  $$
  U_{1}=S^{1}\setminus\{e^{\mathrm{i}0}\},\quad \theta_{1}\in(0,2\pi),
  \qquad
  U_{2}=S^{1}\setminus\{e^{\mathrm{i}\pi}\},\quad \theta_{2}\in(-\pi,\pi).
  $$

  取四张乘积坐标卡 $U_{i}\times U_{j}$（$i,j=1,2$），坐标为 $(\theta_{i},\varphi_{j})$．它们覆盖 $S^{1}\times S^{1}$．在重叠区域上，两个角坐标只相差 $0$ 或 $\pm2\pi$，因此转移函数是平移

  $$
  \theta_{2}=\theta_{1}\quad\text{或}\quad\theta_{2}=\theta_{1}-2\pi,
  $$

  以及对 $\varphi$ 的同类关系；这些都是光滑映射．因此四张卡构成一个光滑图册（不必是极大的）．
solution: |
  参数化 $S^{1}$ 的最简单方式是角坐标 $\theta\sim\theta+2\pi$．单个角坐标在 $0$ 与 $2\pi$ 的粘合处不单值，所以至少需要两张卡．取

  $$
  U_{1}=S^{1}-\{1\},\qquad \theta_{1}\in(0,2\pi),
  $$

  $$
  U_{2}=S^{1}-\{-1\},\qquad \theta_{2}\in(-\pi,\pi).
  $$

  在 $U_{1}\cap U_{2}$ 上，$\theta_{1}=\theta_{2}$（当 $\theta_{2}\in(0,\pi)$）或 $\theta_{1}=\theta_{2}+2\pi$（当 $\theta_{2}\in(-\pi,0)$）．可见转移函数是恒等映射或平移 $2\pi$，两者都光滑．

  对 $T^{2}=S^{1}\times S^{1}$，取

  $$
  (U_{i}\times U_{j},\;(\theta_{i},\varphi_{j})),
  \qquad i,j\in\{1,2\}.
  $$

  四张卡覆盖 $T^{2}$．在任意重叠区域，每个角坐标的转移都是恒等或平移 $2\pi$，所以乘积转移函数也是光滑的．这就是 $T^{2}$ 的一个光滑图册；它自然不是极大的，但已经足以证明 $T^{2}$ 是二维光滑流形．

  **参考定位：** Carroll, *Spacetime and Geometry*, 第 2 章 Exercise 3．
