stem: |
  令 $T^{2}=S^{1}\times S^{1}$．请构造一个有限的图册，使 $T^{2}$ 成为二维光滑流形。

  要求：

  1. 至少写出四张坐标卡，并说明它们覆盖整个 $T^{2}$；
  2. 写出重叠区域上的坐标转移函数；
  3. 说明这些转移函数为什么是光滑的。
