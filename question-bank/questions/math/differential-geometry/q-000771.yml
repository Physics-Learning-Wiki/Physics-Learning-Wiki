feedback:
  correct: 正确：球坐标和笛卡尔坐标给出同一组切矢量分量，并按各自度规都得到模长平方为 $2$。
  incorrect: 请检查 $\mathrm{d}\theta/\mathrm{d}\lambda$ 的求导，以及球坐标模长中的度规因子 $g_{\theta\theta}=r^{2}$、$g_{\varphi\varphi}=r^{2}\sin^{2}\theta$ 是否都已计入。
reference_answer: |
  $$
  r=\sqrt{1+\lambda^{2}},\qquad
  \theta=\arccos\left(\frac{\lambda}{\sqrt{1+\lambda^{2}}}\right),
  \qquad \varphi=\lambda .
  $$

  笛卡尔切矢量为 $(-\sin\lambda,\cos\lambda,1)$．球坐标切矢量为

  $$
  \left(\frac{\mathrm{d}r}{\mathrm{d}\lambda},
  \frac{\mathrm{d}\theta}{\mathrm{d}\lambda},
  \frac{\mathrm{d}\varphi}{\mathrm{d}\lambda}\right)
  =\left(\frac{\lambda}{\sqrt{1+\lambda^{2}}},
  -\frac{1}{1+\lambda^{2}},1\right).
  $$

  笛卡尔模长为 $\sqrt{2}$；球坐标下
  $\lambda^{2}/(1+\lambda^{2})+1/(1+\lambda^{2})+1=2$，也等于 $2$，两边一致．
solution: |
  由 $x^{2}+y^{2}=\cos^{2}\lambda+\sin^{2}\lambda=1$，得

  $$
  r=\sqrt{x^{2}+y^{2}+z^{2}}=\sqrt{1+\lambda^{2}}.
  $$

  又 $z=r\cos\theta$，所以

  $$
  \theta=\arccos\left(\frac{z}{r}\right)
  =\arccos\left(\frac{\lambda}{\sqrt{1+\lambda^{2}}}\right).
  $$

  最后 $y/x=\tan\lambda$，故 $\varphi=\lambda$（相差 $2\pi$ 不影响曲线）．

  笛卡尔坐标下直接对 $\lambda$ 求导：

  $$
  \left(\frac{\mathrm{d}x}{\mathrm{d}\lambda},
  \frac{\mathrm{d}y}{\mathrm{d}\lambda},
  \frac{\mathrm{d}z}{\mathrm{d}\lambda}\right)
  =(-\sin\lambda,\cos\lambda,1).
  $$

  球坐标下逐项求导：

  $$
  \frac{\mathrm{d}r}{\mathrm{d}\lambda}
  =\frac{\lambda}{\sqrt{1+\lambda^{2}}},
  $$

  $$
  \frac{\mathrm{d}\theta}{\mathrm{d}\lambda}
  =-\frac{1}{1+\lambda^{2}},
  \qquad
  \frac{\mathrm{d}\varphi}{\mathrm{d}\lambda}=1.
  $$

  因此球坐标下的切矢量分量为

  $$
  V^{\mu}
  =\left(\frac{\lambda}{\sqrt{1+\lambda^{2}}},
  -\frac{1}{1+\lambda^{2}},1\right).
  $$

  核对模长：笛卡尔坐标下

  $$
  |V|^{2}=\sin^{2}\lambda+\cos^{2}\lambda+1=2.
  $$

  球坐标下

  $$
  |V|^{2}
  =\left(\frac{\lambda}{\sqrt{1+\lambda^{2}}}\right)^{2}
  +(1+\lambda^{2})\left(-\frac{1}{1+\lambda^{2}}\right)^{2}
  +(1+\lambda^{2})\sin^{2}\theta .
  $$

  而 $\sin^{2}\theta=1-\lambda^{2}/(1+\lambda^{2})=1/(1+\lambda^{2})$，所以

  $$
  |V|^{2}=\frac{\lambda^{2}}{1+\lambda^{2}}
  +\frac{1}{1+\lambda^{2}}+1=2.
  $$

  两种坐标给出同一个几何结果，这正是切矢量作为几何对象与坐标无关的体现．

  **参考定位：** Carroll, *Spacetime and Geometry*, 第 2 章 Exercise 6．
