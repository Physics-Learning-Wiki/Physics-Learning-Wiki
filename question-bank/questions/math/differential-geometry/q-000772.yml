stem: |
  在 $\mathbb{R}^{2}$ 上取两个矢量场

  $$
  E_{1}=\frac{\partial}{\partial x},
  \qquad
  E_{2}=x\frac{\partial}{\partial x}
  +\frac{\partial}{\partial y}.
  $$

  1. 证明 $E_{1}$ 与 $E_{2}$ 在每一点都线性无关且都不为零；
  2. 计算对易子 $[E_{1},E_{2}]$；
  3. 解释为什么不存在坐标 $(u,v)$，使 $E_{1}=\partial_{u}$、$E_{2}=\partial_{v}$．
