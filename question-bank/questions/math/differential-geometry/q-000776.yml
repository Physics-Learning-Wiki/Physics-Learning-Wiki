stem: '单位三维球面 $S^{3}$ 在坐标 $(\chi,\theta,\varphi)$ 中的度规为


  $$

  \mathrm{d}s^{2}

  =\mathrm{d}\chi^{2}

  +\sin^{2}\chi\left(

  \mathrm{d}\theta^{2}

  +\sin^{2}\theta\,\mathrm{d}\varphi^{2}

  \right).

  $$


  1. 求所有非零的 Christoffel 符号；

  2. 求黎曼张量的独立非零分量、Ricci 张量与 Ricci 标量；

  3. 验证最大对称空间的关系


  $$

  R_{abcd}

  =\frac{R}{n(n-1)}

  \left(g_{ac}g_{bd}-g_{ad}g_{bc}\right),

  \qquad n=3 .

  $$

  '
