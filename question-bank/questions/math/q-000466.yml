hints:
- 初值项不会因拉普拉斯变换消失。
- 时间常数的单边拉普拉斯变换为常数除以 s。
feedback:
  correct: 点源权重和时间边界变换均保持一致。
  incorrect: 将时间积分与空间分布的作用区分开。
  choices:
    A: 源项就是初值分布的线性组合。
    B: 常值边界对时间积分产生因子 $1/s$。
    C: 遗漏了时间积分，量纲也不一致。
    D: 每个点源积分为一，总权重相加得到一。
