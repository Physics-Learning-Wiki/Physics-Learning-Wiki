stem: 已知函数 $y = x^2\mathrm{e}^{\sin x}$，则 $y''(0) =$ ______．
reference_answer: $2$
solution: '方法一（Taylor 展开）：由 $\mathrm{e}^{\sin x} = 1 + \sin x + o(x) = 1 + x + o(x)$，得 $y = x^2(1 + x + o(x)) = x^2 + x^3
  + o(x^3)$．根据 Maclaurin 展开系数 $y = y(0) + y''(0)x + \frac{y''''(0)}{2!}x^2 + \cdots$，可知 $\frac{y''''(0)}{2!} = 1$，故 $y''''(0)
  = 2$．


  方法二（Leibniz 求导法则）：$y'''' = (x^2)''''\mathrm{e}^{\sin x} + 2(x^2)''(\mathrm{e}^{\sin x})'' + x^2(\mathrm{e}^{\sin x})''''
  = 2\mathrm{e}^{\sin x} + 4x(\mathrm{e}^{\sin x})'' + x^2(\mathrm{e}^{\sin x})''''$．代入 $x=0$，得 $y''''(0) = 2$．'
