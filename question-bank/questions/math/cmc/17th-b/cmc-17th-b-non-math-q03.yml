stem: '设 $f(x)$ 连续，且 $f(x) + f(-x) = 2$．求定积分：


  $$

  \int_{-1}^1\left(f(x) + x^2\ln\left(x + \sqrt{x^2+1}\right)\right)\mathrm{d}x =
  \text{______}．

  $$'
reference_answer: $2$
solution: '因为 $\ln\left(x+\sqrt{x^2+1}\right)$ 是奇函数，且 $x^2$ 为偶函数，所以 $x^2\ln\left(x+\sqrt{x^2+1}\right)$
  为奇函数，在对称区间 $[-1,1]$ 上的定积分为 $0$．原积分化为：


  $$

  \int_{-1}^1 f(x)\mathrm{d}x = \int_0^1 (f(x) + f(-x))\mathrm{d}x = \int_0^1 2\mathrm{d}x
  = 2

  $$


  故结果为 $2$．'
