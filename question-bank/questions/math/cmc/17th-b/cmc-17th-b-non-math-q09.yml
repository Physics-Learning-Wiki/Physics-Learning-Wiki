stem: '（本题 14 分）(1) 设函数 $f(x) = \sin^2 x\sin 2x$，讨论 $f(x)$ 在区间 $(0,\pi)$ 的单调性；

  (2) 判断级数 $\sum_{n=1}^\infty a_n$ 的敛散性，其中：


  $$

  a_n = \sin^2 x\sin^2 2x\cdots\sin^2 2^n x, \quad x\in(-\infty,+\infty)

  $$'
reference_answer: (1) 在 $(0,\pi/3)\cup(2\pi/3,\pi)$ 单调递增，在 $(\pi/3,2\pi/3)$ 单调递减；(2)
  级数对任意实数 $x$ 均收敛
solution: '(1) $f(x) = \sin^2 x\sin 2x$，求导得 $f''(x) = -8\sin^2 x\left(\sin x - \frac{\sqrt{3}}{2}\right)\left(\sin
  x + \frac{\sqrt{3}}{2}\right)$．在 $(0,\pi)$ 内驻点为 $x_1 = \frac{\pi}{3}, x_2 = \frac{2\pi}{3}$．因此
  $f(x)$ 在 $(0,\frac{\pi}{3})\cup(\frac{2\pi}{3},\pi)$ 上单调增加，在 $(\frac{\pi}{3},\frac{2\pi}{3})$
  上单调减少（得 5 分）．

  (2) 由 (1) 知在 $[0,\pi]$ 上最值为 $\pm \frac{3\sqrt{3}}{8}$，故 $|f(x)|\leqslant \frac{3\sqrt{3}}{8}$（得
  9 分）．由于 $a_n^{3/2} \leqslant \left(\frac{3\sqrt{3}}{8}\right)^n$，两边取 $2/3$ 次方得 $a_n
  \leqslant \left(\frac{3}{4}\right)^n$．公比 $3/4 < 1$ 的几何级数收敛，由比较判别法知级数 $\sum_{n=1}^\infty
  a_n$ 收敛（满分 14 分）．'
