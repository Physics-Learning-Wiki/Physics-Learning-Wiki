stem: （本题 14 分）求由方程 $2x^2 + 2y^2 + z^2 + 8xz - z + 8 = 0$ 所确定的函数 $z = z(x,y)$ 的极值．
reference_answer: 在 $(-2,0)$ 处取得极小值 $z = 1$；在 $(\frac{16}{7},0)$ 处取得极大值 $z = -\frac{8}{7}$
solution: 方程两边分别对 $x,y$ 求偏导：$z_x = -\frac{4x+8z}{2z+8x-1}, z_y = -\frac{4y}{2z+8x-1}$．令 $z_x = 0, z_y = 0$，由 $z_y=0$ 得 $y=0$；由
  $z_x=0$ 得 $x = -2z$．代入原方程得 $-7z^2 - z + 8 = 0 \implies (7z+8)(z-1) = 0$．解得两驻点 $(-2,0)$（$z_1=1$）和 $(\frac{16}{7},0)$（$z_2=-\frac{8}{7}$）（得
  5 分）．求二阶偏导数判别：在 $(-2,0)$ 处 $A = z_{xx} = \frac{4}{15}, B = 0, C = z_{yy} = \frac{4}{15}$，因 $AC-B^2 > 0$ 且 $A > 0$，故取得极小值
  $z = 1$；在 $(\frac{16}{7},0)$ 处 $A = -\frac{4}{15}, B = 0, C = -\frac{4}{15}$，因 $AC-B^2 > 0$ 且 $A < 0$，故取得极大值 $z = -\frac{8}{7}$（满分
  14 分）．
