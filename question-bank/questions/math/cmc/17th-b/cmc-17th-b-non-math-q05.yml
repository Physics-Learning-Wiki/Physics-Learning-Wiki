stem: 积分 $\int_1^{+\infty}\frac{\ln x}{(1+x)^2}\mathrm{d}x =$ ______．
reference_answer: $\ln 2$
solution: '利用分部积分法：


  $$

  \int_1^{+\infty}\frac{\ln x}{(1+x)^2}\mathrm{d}x = \int_1^{+\infty}\ln x\mathrm{d}\left(-\frac{1}{1+x}\right) = \left.-\frac{\ln
  x}{1+x}\right|_1^{+\infty} + \int_1^{+\infty}\frac{\mathrm{d}x}{x(1+x)}

  $$


  当 $x\to +\infty$ 时 $\frac{\ln x}{1+x}\to 0$，在 $x=1$ 处值为 $0$．拆分分式积分：$\int_1^{+\infty}\left(\frac{1}{x} - \frac{1}{1+x}\right)\mathrm{d}x
  = \left.\ln\frac{x}{1+x}\right|_1^{+\infty} = 0 - (-\ln 2) = \ln 2$．因此积分为 $\ln 2$．'
