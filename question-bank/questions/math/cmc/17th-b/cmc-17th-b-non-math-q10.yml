stem: '（本题 14 分）设 $f(x)$ 在 $[a,b]$ 上有连续的导数，记 $A = \frac{1}{b-a}\int_a^b f(x)\mathrm{d}x$．试证明：


  $$

  \int_a^b |f(x) - A|^2\mathrm{d}x \leqslant \frac{(a-b)^2}{2}\int_a^b |f''(x)|^2\mathrm{d}x

  $$'
reference_answer: 详见参考解答（通过积分第一中值定理与柯西–施瓦茨积分不等式放缩）
solution: '根据积分中值定理，存在 $c\in[a,b]$ 使得 $A = f(c)$（得 3 分）．由微积分基本定理 $f(x) - f(c) = \int_c^x
  f''(t)\mathrm{d}t$．应用柯西–施瓦茨积分不等式：


  $$

  |f(x) - A|^2 = \left|\int_c^x f''(t)\mathrm{d}t\right|^2 \leqslant |x-c|\int_a^b
  |f''(t)|^2\mathrm{d}t

  $$


  两边对 $x$ 在 $[a,b]$ 上求定积分：$\int_a^b |f(x)-A|^2\mathrm{d}x \leqslant \left(\int_a^b
  |x-c|\mathrm{d}x\right)\int_a^b |f''(x)|^2\mathrm{d}x$（得 9 分）．计算定积分 $\int_a^b |x-c|\mathrm{d}x
  = \frac{1}{2}[(c-a)^2 + (b-c)^2] \leqslant \frac{(a-b)^2}{2}$．代入即证得：$\int_a^b |f(x)-A|^2\mathrm{d}x
  \leqslant \frac{(a-b)^2}{2}\int_a^b |f''(x)|^2\mathrm{d}x$（满分 14 分）．'
