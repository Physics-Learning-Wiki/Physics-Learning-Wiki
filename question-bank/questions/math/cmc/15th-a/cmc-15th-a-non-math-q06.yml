stem: （本题 14 分）解微分方程 $(x^2+y^2+3)\frac{\mathrm{d}y}{\mathrm{d}x} = 2x\left(2y - \frac{x^2}{y}\right)$．
reference_answer: $(y^2 - 2x^2 - 3)^3 = C(y^2 - x^2 - 1)^2$
solution: 方程改写为：$\frac{y\mathrm{d}y}{x\mathrm{d}x} = \frac{2(2y^2-x^2)}{x^2+y^2+3}$令
  $u = x^2, v = y^2$，则方程化为：$\frac{\mathrm{d}v}{\mathrm{d}u} = \frac{2(2v-u)}{u+v+3}
  \quad (得 5 分)$解代数方程组 $2v-u = 0, u+v+3 = 0$ 得平移交点 $u = -2, v = -1$．再令 $U = u+2, V
  = v+1$，方程化为齐次微分方程：$\frac{\mathrm{d}V}{\mathrm{d}U} = \frac{2(2V-U)}{U+V} \quad (得
  8 分)$作变量替换 $W = V/U$，变量分离：$U\frac{\mathrm{d}W}{\mathrm{d}U} = -\frac{W^2-3W+2}{W+1}
  \quad (得 11 分)$积分得 $U(W-2)^3 = C(W-1)^2$．回代原变量得通解为：$(y^2 - 2x^2 - 3)^3 = C(y^2 -
  x^2 - 1)^2 \quad (满分 14 分)$
