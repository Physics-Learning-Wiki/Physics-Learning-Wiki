stem: 设 $f(x) = \frac{1}{x^2 - 3x + 2}$，则 $f^{(n)}(0) =$ ______．
reference_answer: $n!\left(1 - \frac{1}{2^{n+1}}\right)$
solution: 拆分部分分式：$f(x) = -\frac{1}{x-1} + \frac{1}{x-2} = \frac{1}{1-x} - \frac{1}{2}\frac{1}{1-x/2}$展开为几何级数：$f(x) = \sum_{n=0}^\infty
  x^n - \frac{1}{2}\sum_{n=0}^\infty \left(\frac{x}{2}\right)^n = \sum_{n=0}^\infty \left(1 - \frac{1}{2^{n+1}}\right)x^n$由
  Maclaurin 展开系数 $f^{(n)}(0) = n! a_n = n!\left(1 - \frac{1}{2^{n+1}}\right)$．
