stem: 设 $z = f(x^2 - y^2, xy)$，且 $f(u,v)$ 有连续的二阶偏导数，则 $\frac{\partial^2 z}{\partial x\partial y} =$ ______．
reference_answer: $f_2 - 4xy f_{11} + 2(x^2-y^2)f_{12} + xy f_{22}$
solution: 求一阶偏导数：$z_x = 2x f_1 + y f_2$．再对 $y$ 求偏导：$z_{xy} = 2x(f_{11}(-2y) + x f_{12}) + f_2 + y(f_{21}(-2y) + x f_{22})
  = f_2 - 4xy f_{11} + 2(x^2-y^2)f_{12} + xy f_{22}$
