stem: 幂级数 $\sum_{n=1}^\infty \frac{(-1)^{n-1}x^{2n}}{n(2n-1)}$ 的收敛域为 ______．
reference_answer: $[-1, 1]$
solution: 计算收敛半径：由比值法易得收敛半径 $R = 1$．当 $x = \pm 1$ 时，级数成为 $\sum_{n=1}^\infty \frac{(-1)^{n-1}}{n(2n-1)}$，由于通项阶为
  $O(1/n^2)$，绝对收敛．故收敛域为 $[-1, 1]$．
