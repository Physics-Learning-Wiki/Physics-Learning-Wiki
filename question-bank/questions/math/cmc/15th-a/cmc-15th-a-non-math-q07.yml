stem: '（本题 14 分）设 $\Sigma_1$ 是以 $(0,4,0)$ 为顶点且与曲面 $\Sigma_2: \frac{x^2}{3}+\frac{y^2}{4}+\frac{z^2}{3}
  = 1$ ($y>0$) 相切的圆锥面，求曲面 $\Sigma_1$ 与 $\Sigma_2$ 所围成的空间区域的体积．'
reference_answer: $\pi$
solution: 设切线在 $xOy$ 平面上切点为 $(x_0,y_0)$，切线斜率满足：$\frac{y_0-4}{x_0} = -\frac{4x_0}{3y_0},
  \quad \frac{x_0^2}{3} + \frac{y_0^2}{4} = 1$联立解得 $x_0 = \pm\frac{3}{2}, y_0 = 1$（得
  5 分）．圆锥面 $\Sigma_1$ 与椭球面 $\Sigma_2$ 为绕 $y$ 轴旋转曲面，交线位于平面 $y_0 = 1$ 上（得 8 分）．圆锥体底面半径
  $\frac{3}{2}$、高 $3$，体积为 $V_1 = \frac{1}{3}\pi\left(\frac{3}{2}\right)^2\times 3
  = \frac{9\pi}{4}$．椭球冠体积为 $V_2 = \int_1^2 \pi \cdot 3(1-\frac{y^2}{4})\mathrm{d}y
  = \frac{5\pi}{4}$．故所围区域体积为 $V_1 - V_2 = \frac{9\pi}{4} - \frac{5\pi}{4} = \pi$（满分
  14 分）．
