stem: （本题 14 分）设 $I_n = n\int_1^a \frac{\mathrm{d}x}{1+x^n}$，其中 $a > 1$．求极限 $\lim_{n\to\infty} I_n$．
reference_answer: $\ln 2$
solution: 记 $b = 1/a$，则 $0 < b < 1$．作代换 $x = 1/t$：$I_n = \int_b^1 \frac{n t^{n-1}}{t(1+t^n)}\mathrm{d}t = \int_b^1 \frac{\mathrm{d}(\ln(1+t^n))}{t}$分部积分得：$I_n
  = \ln 2 - \frac{\ln(1+b^n)}{b} + \int_b^1 \frac{\ln(1+t^n)}{t^2}\mathrm{d}t \quad (得 8 分)$当 $t\in[b,1]$ 时，由不等式 $\ln(1+t^n)
  \leqslant t^n$ 可得：$0 \leqslant \int_b^1 \frac{\ln(1+t^n)}{t^2}\mathrm{d}t \leqslant \int_b^1 t^{n-2}\mathrm{d}t = \frac{1-b^{n-1}}{n-1}
  \to 0 \quad (n\to\infty)$由于 $b^n\to 0$，第二项趋于 0，由夹逼准则得 $\lim_{n\to\infty} I_n = \ln 2$（满分 14 分）．
