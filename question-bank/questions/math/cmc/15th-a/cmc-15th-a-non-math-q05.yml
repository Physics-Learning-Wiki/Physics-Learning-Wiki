stem: 设曲面 $\Sigma$ 是平面 $y+z=5$ 被柱面 $x^2+y^2=25$ 所截得的部分，则曲面积分 $\iint_\Sigma (x+y+z)\mathrm{d}S =$ ______．
reference_answer: $125\sqrt{2}\pi$
solution: '在曲面 $\Sigma$ 上 $y+z=5$，故被积函数为 $x+5$．投影区域 $D_{xy}: x^2+y^2\leqslant 25$，面积微元 $\mathrm{d}S = \sqrt{1 + 0^2 + (-1)^2}\mathrm{d}x\mathrm{d}y
  = \sqrt{2}\mathrm{d}x\mathrm{d}y$．利用对称性 $\iint_{D_{xy}} x\mathrm{d}x\mathrm{d}y = 0$：$\iint_\Sigma (x+y+z)\mathrm{d}S =
  \sqrt{2}\iint_{D_{xy}} (x+5)\mathrm{d}x\mathrm{d}y = 5\sqrt{2}\iint_{D_{xy}}\mathrm{d}x\mathrm{d}y = 5\sqrt{2}\times \pi(5^2)
  = 125\sqrt{2}\pi$'
