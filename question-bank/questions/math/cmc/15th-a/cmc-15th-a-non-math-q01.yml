stem: $\lim_{x\to 3}\frac{\sqrt{x^3+9}-6}{2-\sqrt{x^3-23}} =$ ______．
reference_answer: $-\frac{1}{3}$
solution: 利用洛必达法则或有理化因式分解：$\lim_{x\to 3}\frac{\sqrt{x^3+9}-6}{2-\sqrt{x^3-23}} = \lim_{x\to 3}\frac{\frac{3x^2}{2\sqrt{x^3+9}}}{-\frac{3x^2}{2\sqrt{x^3-23}}}
  = -\lim_{x\to 3}\frac{\sqrt{x^3-23}}{\sqrt{x^3+9}} = -\frac{\sqrt{27-23}}{\sqrt{27+9}} = -\frac{2}{6} = -\frac{1}{3}$因此极限为
  $-\frac{1}{3}$．
