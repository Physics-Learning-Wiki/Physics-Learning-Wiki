stem: （本题 14 分）设数列 $\{x_n\}$ 满足 $x_0 = \frac{1}{3}$，$x_{n+1} = \frac{x_n^2}{1-x_n+x_n^2}$
  ($n\geqslant 0$)．证明：无穷级数 $\sum_{n=0}^\infty x_n$ 收敛并求其和．
reference_answer: 级数收敛，其和为 $\frac{1}{2}$
solution: 由数学归纳法易知 $x_n > 0$．计算差分：$x_{n+1} - x_n = -\frac{x_n(1-x_n)^2}{1-x_n+x_n^2}
  < 0$故 $\{x_n\}$ 严格单调递减有下界，极限存在．令 $L = \frac{L^2}{1-L+L^2}$ 解得 $\lim_{n\to\infty}
  x_n = 0$（得 6 分）．将递推关系改写为裂项形式：$x_n = \frac{x_n}{1-x_n} - \frac{x_{n+1}}{1-x_{n+1}}$对前
  $n$ 项求和：$\sum_{i=0}^n x_i = \frac{x_0}{1-x_0} - \frac{x_{n+1}}{1-x_{n+1}}$令 $n\to\infty$，由于
  $x_{n+1}\to 0$：$\sum_{i=0}^\infty x_i = \frac{x_0}{1-x_0} = \frac{1/3}{1-1/3} =
  \frac{1}{2} \quad (满分 14 分)$
