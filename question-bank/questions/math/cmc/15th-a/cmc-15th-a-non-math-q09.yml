choice_order: fixed
stem: '（本题 14 分）设 $f(x)$ 在 $[0,1]$ 上有连续的导数，且 $f(0) = 0$．求证：


  $$

  \int_0^1 f^2(x)\mathrm{d}x \leqslant 4\int_0^1 (1-x)^2 |f''(x)|^2\mathrm{d}x

  $$


  并求使上式成为等式的 $f(x)$．'
reference_answer: 等号成立当且仅当 $f(x) \equiv 0$
solution: 由分部积分法：$\int_0^1 f^2(x)\mathrm{d}x = \left.(x-1)f^2(x)\right|_0^1 - \int_0^1
  (x-1)\cdot 2f(x)f'(x)\mathrm{d}x = 2\int_0^1 (1-x)f'(x)f(x)\mathrm{d}x \quad (得
  4 分)$由柯西–施瓦茨积分不等式：$\int_0^1 (1-x)f'(x)f(x)\mathrm{d}x \leqslant \left(\int_0^1 (1-x)^2
  (f'(x))^2\mathrm{d}x\right)^{1/2}\left(\int_0^1 f^2(x)\mathrm{d}x\right)^{1/2}$代入得：$\int_0^1
  f^2(x)\mathrm{d}x \leqslant 2\left(\int_0^1 (1-x)^2 (f'(x))^2\mathrm{d}x\right)^{1/2}\left(\int_0^1
  f^2(x)\mathrm{d}x\right)^{1/2}$两边平方即得不等式（得 10 分）．等号成立时必存在常数 $c$ 使得 $(1-x)f'(x) =
  c f(x)$，解得 $f(x) = d(1-x)^{-c}$．当 $x\to 0$ 时 $f(x)\to 0$，故 $d = 0$，即唯一极值函数为 $f(x)
  \equiv 0$（满分 14 分）．
