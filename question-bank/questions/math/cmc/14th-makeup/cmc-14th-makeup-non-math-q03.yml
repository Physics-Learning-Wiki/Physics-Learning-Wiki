stem: 设 $y=y(x)$ 是初值问题 $\begin{cases} y''-2y'-3y=1, \\ y(0)=0, y'(0)=1 \end{cases}$ 的解，则 $y(x) =$ ______．
reference_answer: $\frac{1}{3}(\mathrm{e}^{3x}-1)$
solution: 齐次特征方程 $\lambda^2 - 2\lambda - 3 = 0$ 的根为 $\lambda_1 = 3, \lambda_2 = -1$．非齐次方程特解设为 $y_0 = A$，代入解得 $y_0 = -\frac{1}{3}$．通解为
  $y(x) = C_1\mathrm{e}^{3x} + C_2\mathrm{e}^{-x} - \frac{1}{3}$．由 $y(0)=0, y'(0)=1$ 联立解得 $C_1 = \frac{1}{3}, C_2 = 0$．故 $y(x)
  = \frac{1}{3}(\mathrm{e}^{3x}-1)$．
