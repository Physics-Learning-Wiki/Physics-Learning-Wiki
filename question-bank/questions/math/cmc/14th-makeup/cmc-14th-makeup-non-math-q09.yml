stem: '（本题满分 14 分）设 $f(x)$ 是 $[-1,1]$ 上的连续偶函数，计算曲线积分：


  $$

  I = \oint_L \frac{x^2+y^2}{2\sqrt{1-x^2}}\mathrm{d}x + f(x)\mathrm{d}y

  $$


  其中曲线 $L$ 为正向圆周 $x^2+y^2 = -2y$．'
reference_answer: $4$
solution: 圆周方程改写为 $x^2 + (y+1)^2 = 1$，引入参数方程 $x = \cos\theta, y = -1+\sin\theta$ ($0\leqslant \theta \leqslant 2\pi$)（得 4
  分）．将线积分拆分为两部分 $I = I_1 + I_2$：第一项中 $x^2+y^2 = -2y = 2(1-\sin\theta)$，$\sqrt{1-x^2} = |\sin\theta|$，$\mathrm{d}x = -\sin\theta\mathrm{d}\theta$：$I_1
  = \int_0^{2\pi} \frac{2(1-\sin\theta)}{2|\sin\theta|}(-\sin\theta)\mathrm{d}\theta = -\int_0^\pi (1-\sin\theta)\mathrm{d}\theta
  + \int_\pi^{2\pi} (1-\sin\theta)\mathrm{d}\theta = 4 \quad (得 9 分)$第二项为 $I_2 = \int_0^{2\pi} f(\cos\theta)\cos\theta\mathrm{d}\theta$．令
  $\theta = t+\pi$ 可知被积函数具有半周期反号性质，积分恰为 0（得 12 分）．故原曲线积分为 $I = 4+0 = 4$（满分 14 分）．
