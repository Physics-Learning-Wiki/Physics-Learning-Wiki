stem: 极限 $\lim_{n\to\infty}\frac{1}{n^3}[1^2 + 3^2 + \cdots + (2n-1)^2] =$ ______．
reference_answer: $\frac{4}{3}$
solution: 利用定积分的定义转化为黎曼和：$\lim_{n\to\infty}\frac{1}{n^3}\sum_{k=1}^n (2k-1)^2 = 4\lim_{n\to\infty}\frac{1}{n}\sum_{k=1}^n
  \left(\frac{k}{n} - \frac{1}{2n}\right)^2 = 4\int_0^1 x^2\mathrm{d}x = \left.4\cdot\frac{x^3}{3}\right|_0^1
  = \frac{4}{3}$
