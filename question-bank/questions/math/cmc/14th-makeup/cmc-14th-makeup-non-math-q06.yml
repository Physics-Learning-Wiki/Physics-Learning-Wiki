stem: （本题满分 14 分）设函数 $f(x) = \mathrm{e}^{-x}\int_0^x \frac{t^{2023}}{1+t^2}\mathrm{d}t$，正整数 $n\leqslant 2023$，求导数 $f^{(n)}(0)$．
reference_answer: $0$
solution: 设 $F(x) = \int_0^x \frac{t^{2023}}{1+t^2}\mathrm{d}t$，则 $(1+x^2)F'(x) = x^{2023}$．两端求 $k-1$ 阶导数，由 Leibniz 公式：$(1+x^2)F^{(k)}(x)
  + 2(k-1)x F^{(k-1)}(x) + (k-1)(k-2)F^{(k-2)}(x) = (x^{2023})^{(k-1)}$代入 $x=0$，当 $k\leqslant 2023$ 时右端均为 0，且 $F(0)=F'(0)=0$，因此
  $F^{(k)}(0) = 0$（得 9 分）．由乘积高阶导数 Leibniz 公式：$f^{(n)}(0) = \left.\sum_{k=0}^n C_n^k (\mathrm{e}^{-x})^{(n-k)} F^{(k)}(x)\right|_{x=0}
  = \sum_{k=0}^n (-1)^{n-k}C_n^k F^{(k)}(0) = 0 \quad (满分 14 分)$
