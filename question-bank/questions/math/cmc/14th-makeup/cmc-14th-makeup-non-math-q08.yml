stem: '（本题满分 14 分）设函数 $f(x)$ 在区间 $[0,1]$ 上连续，在 $(0,1)$ 内可导，且 $f(0)=0, f(1)=2$．证明：存在两两互异的点 $\xi_1, \xi_2, \xi_3 \in (0,1)$，使得


  $$

  f''(\xi_1)f''(\xi_2)\sqrt{1-\xi_3} \geqslant 2

  $$'
reference_answer: 详见参考解答（通过连续函数零点介值定理构造中间节点 $\xi_3$ 并利用 Lagrange 中值定理与不等式证明）
solution: 令辅助函数 $F(x) = f(x) - 2 + x$．则 $F(0) = -2, F(1) = 1$．由介值定理，存在 $\xi_3\in(0,1)$ 使得 $F(\xi_3) = 0$，即 $f(\xi_3) = 2 -
  \xi_3$（得 5 分）．在区间 $[0,\xi_3]$ 与 $[\xi_3,1]$ 上分别应用 Lagrange 中值定理，存在 $\xi_1\in(0,\xi_3), \xi_2\in(\xi_3,1)$ 使得：$f'(\xi_1)
  = \frac{f(\xi_3)-f(0)}{\xi_3} = \frac{2-\xi_3}{\xi_3}, \quad f'(\xi_2) = \frac{f(1)-f(\xi_3)}{1-\xi_3} = \frac{\xi_3}{1-\xi_3}
  \quad (得 10 分)$相乘得：$f'(\xi_1)f'(\xi_2) = \frac{2-\xi_3}{1-\xi_3} = 1 + \frac{1}{1-\xi_3} \geqslant \frac{2}{\sqrt{1-\xi_3}}$两边同乘
  $\sqrt{1-\xi_3}$ 即证得 $f'(\xi_1)f'(\xi_2)\sqrt{1-\xi_3} \geqslant 2$．显然 $0 < \xi_1 < \xi_3 < \xi_2 < 1$，三点两两互异（满分 14 分）．
