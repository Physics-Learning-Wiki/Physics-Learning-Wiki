stem: 设函数 $f(x)$ 在 $x=1$ 的某一邻域内可微，且满足 $f(1+x)-3f(1-x) = 4+2x+o(x)$，其中 $o(x)$ 是当 $x\to
  0$ 时 $x$ 的高阶无穷小，则曲线 $y=f(x)$ 在点 $(1,f(1))$ 处的切线方程为 ______．
reference_answer: $x - 2y - 5 = 0$
solution: 由连续性令 $x\to 0$ 得 $-2f(1) = 4 \implies f(1) = -2$．改写等式两端求导数：$\frac{f(1+x)-f(1)}{x}
  + 3\frac{f(1-x)-f(1)}{-x} = 2 + \frac{o(x)}{x}$两边取 $x\to 0$ 极限，由导数定义得 $4f'(1) =
  2 \implies f'(1) = \frac{1}{2}$．切线方程为 $y - (-2) = \frac{1}{2}(x-1)$，即 $x - 2y -
  5 = 0$．
