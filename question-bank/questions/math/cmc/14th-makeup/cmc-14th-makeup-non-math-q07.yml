stem: （本题满分 14 分）设函数 $f(x)$ 在区间 $(0,1)$ 内有定义，$\lim_{x\to 0^+} f(x) = 0$，且 $\lim_{x\to
  0^+}\frac{f(x)-f(x/3)}{x} = 0$．证明：$\lim_{x\to 0^+}\frac{f(x)}{x} = 0$．
reference_answer: 详见参考解答（通过几何级数裂项相消与极限一致逼近证明）
solution: 由题设，对任意非负整数 $k$：$\lim_{x\to 0^+}\frac{f(x/3^k) - f(x/3^{k+1})}{x/3^k} =
  0 \quad (得 4 分)$求和得：$\lim_{x\to 0^+}\frac{f(x) - f(x/3^n)}{x} = \lim_{x\to 0^+}\sum_{k=0}^{n-1}\frac{f(x/3^k)
  - f(x/3^{k+1})}{x/3^k}\cdot\frac{1}{3^k} = 0 \quad (得 9 分)$因此对任意 $\varepsilon >
  0$，存在 $\delta > 0$ 使得当 $0<x<\delta$ 时 $|f(x)-f(x/3^n)| < \varepsilon x$．令 $n\to\infty$，因
  $\lim_{x\to 0^+} f(x) = 0$，有 $|f(x)| \leqslant \varepsilon x$．由此证得 $\lim_{x\to 0^+}\frac{f(x)}{x}
  = 0$（满分 14 分）．
