stem: 设 $a > 0$，则均匀曲面 $x^2+y^2+z^2=a^2$ ($x\geqslant 0, y\geqslant 0, z\geqslant 0$)
  的重心坐标为 ______．
reference_answer: $\left(\frac{a}{2}, \frac{a}{2}, \frac{a}{2}\right)$
solution: 第一卦限球面面积为 $M = \frac{1}{8}(4\pi a^2) = \frac{\pi a^2}{2}$．由投影积分：$\bar{z}
  = \frac{1}{M}\iint_\Sigma z\mathrm{d}S = \frac{2}{\pi a^2}\iint_\Sigma z\frac{a}{z}\mathrm{d}x\mathrm{d}y
  = \frac{2}{\pi a}\iint_{D_{xy}}\mathrm{d}x\mathrm{d}y = \frac{2}{\pi a}\cdot\frac{\pi
  a^2}{4} = \frac{a}{2}$由轮换对称性 $\bar{x} = \bar{y} = \bar{z} = \frac{a}{2}$，重心坐标为 $\left(\frac{a}{2},
  \frac{a}{2}, \frac{a}{2}\right)$．
