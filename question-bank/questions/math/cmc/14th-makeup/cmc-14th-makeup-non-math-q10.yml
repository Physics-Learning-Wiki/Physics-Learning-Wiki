stem: （本题满分 14 分）设函数 $f(x) = \int_0^x \frac{\ln(1+t)}{1+\mathrm{e}^{-t}\sin^3 t}\mathrm{d}t$ ($x>0$)，证明级数 $\sum_{n=1}^\infty
  \frac{1}{n}f(\frac{1}{n})$ 收敛，且 $\frac{1}{3} < \sum_{n=1}^\infty \frac{1}{n}f(\frac{1}{n}) < \frac{5}{6}$．
reference_answer: 详见参考解答（通过被积函数泰勒不等式放缩与黎曼 Zeta 函数求和估计证明）
solution: 当 $t\in(0,1]$ 时，有 $t - \frac{t^2}{2} \leqslant \ln(1+t) \leqslant t$ 以及 $0 < \mathrm{e}^{-t}\sin^3 t \leqslant t$．故：$f(x)
  \geqslant \frac{1}{1+x}\int_0^x \left(t - \frac{t^2}{2}\right)\mathrm{d}t = \frac{1}{1+x}\left(\frac{x^2}{2} - \frac{x^3}{6}\right)
  > \frac{1}{3}\frac{x^2}{1+x}$且 $f(x) \leqslant \int_0^x t\mathrm{d}t = \frac{1}{2}x^2$（得 6 分）．对左端求和：$\sum_{n=1}^\infty \frac{1}{n}f\left(\frac{1}{n}\right)
  > \frac{1}{3}\sum_{n=1}^\infty \frac{1}{n}\frac{1/n^2}{1+1/n} = \frac{1}{3}\sum_{n=1}^\infty \frac{1}{n(n+1)} = \frac{1}{3}
  \quad (得 10 分)$对右端求和：$\sum_{n=1}^\infty \frac{1}{n}f\left(\frac{1}{n}\right) \leqslant \frac{1}{2}\sum_{n=1}^\infty \frac{1}{n^3}
  < \frac{1}{2}\sum_{n=1}^\infty \frac{1}{n^2} = \frac{1}{2}\cdot\frac{\pi^2}{6} < \frac{5}{6}$由正项级数比较判别法知级数收敛，且界值 $\frac{1}{3}
  < \sum_{n=1}^\infty \frac{1}{n}f(\frac{1}{n}) < \frac{5}{6}$ 成立（满分 14 分）．
