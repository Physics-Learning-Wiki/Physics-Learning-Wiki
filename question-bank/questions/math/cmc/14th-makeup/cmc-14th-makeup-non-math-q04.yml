stem: 设可微函数 $z=z(x,y)$ 满足 $x^2\frac{\partial z}{\partial x}+y^2\frac{\partial z}{\partial y}=2z^2$，又设 $u=x, v=\frac{1}{y}-\frac{1}{x},
  w=\frac{1}{z}-\frac{1}{x}$，则对函数 $w=w(u,v)$，偏导数 $\left.\frac{\partial w}{\partial u}\right|_{\substack{u=2\\v=1}} =$ ______．
reference_answer: $-\frac{1}{4}$
solution: 由变量关系 $x = u, y = \frac{u}{uv+1}, \frac{1}{z} = w+\frac{1}{u}$．链式求导：$\frac{\partial w}{\partial u} = -\frac{1}{z^2}\frac{\partial
  z}{\partial u} + \frac{1}{u^2} = -\frac{1}{z^2}\left(z_x\cdot 1 + z_y\cdot \frac{1}{(uv+1)^2}\right) + \frac{1}{u^2} = -\frac{1}{z^2
  u^2}\left(x^2 z_x + y^2 z_y\right) + \frac{1}{u^2}$利用已知条件 $x^2 z_x+y^2 z_y = 2z^2$：$\frac{\partial w}{\partial u} = -\frac{2z^2}{z^2
  u^2} + \frac{1}{u^2} = -\frac{1}{u^2}$代入 $u=2, v=1$ 得 $\left.\frac{\partial w}{\partial u}\right|_{(2,1)} = -\frac{1}{4}$．
