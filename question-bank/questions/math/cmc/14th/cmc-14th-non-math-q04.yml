stem: 微分方程 $\frac{\mathrm{d}y}{\mathrm{d}x}x\ln x\sin y + \cos y(1 - x\cos y) = 0$ 的通解为 ______．
reference_answer: $(x + C)\cos y = \ln x$ 或 $\frac{1}{\cos y} = \frac{x+C}{\ln x}$
solution: 改写为 $y'\sin y + \frac{1}{x\ln x}\cos y = \frac{1}{\ln x}\cos^2 y$．令 $z = \cos y$ 转化为 Bernoulli 方程，再令 $w = 1/z$ 转化为一阶线性方程，求解得
  $w = \frac{1}{\ln x}(x+C)$，回代得 $(x+C)\cos y = \ln x$．
