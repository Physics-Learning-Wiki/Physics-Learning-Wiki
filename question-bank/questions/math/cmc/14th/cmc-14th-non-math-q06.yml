stem: '（本题满分 14 分）记向量 $\vec{OA}$ 与 $\vec{OB}$ 的夹角为 $\alpha$，$|\vec{OA}| = 1, |\vec{OB}| = 2$，$\vec{OP} = (1-\lambda)\vec{OA},
  \vec{OQ} = \lambda\vec{OB}$ ($0\leqslant \lambda \leqslant 1$)．

  (1) 问当 $\lambda$ 为何值时，$|\vec{PQ}|$ 取得最小值；

  (2) 设 (1) 中的 $\lambda$ 满足 $0 < \lambda < \frac{1}{5}$，求夹角 $\alpha$ 的取值范围．'
reference_answer: (1) 当 $\lambda = \frac{1+2\cos\alpha}{5+4\cos\alpha}$ 时取得最小值；(2) 夹角 $\alpha\in\left(\frac{\pi}{2}, \frac{2\pi}{3}\right)$
solution: '(1) 由余弦定理：$|\vec{PQ}|^2 = (1-\lambda)^2 + 4\lambda^2 - 4\lambda(1-\lambda)\cos\alpha = (5+4\cos\alpha)\lambda^2
  - 2(1+2\cos\alpha)\lambda + 1$这是关于 $\lambda$ 的二次函数，由于 $5+4\cos\alpha \geqslant 1 > 0$，对称轴为 $\lambda = \frac{1+2\cos\alpha}{5+4\cos\alpha}$．当
  $\cos\alpha\in[-1/2, 1]$ 时此对称轴满足 $0\leqslant\lambda\leqslant 1$，此时 $|\vec{PQ}|$ 取得最小值（得 6 分）．

  (2) 由条件 $0 < \frac{1+2\cos\alpha}{5+4\cos\alpha} < \frac{1}{5}$：解 $1+2\cos\alpha > 0 \implies \cos\alpha > -1/2$；解 $5+10\cos\alpha
  < 5+4\cos\alpha \implies 6\cos\alpha < 0 \implies \cos\alpha < 0$．联立得 $-\frac{1}{2} < \cos\alpha < 0$．因为 $\alpha\in[0,\pi]$，反三角函数解得
  $\alpha\in\left(\frac{\pi}{2}, \frac{2\pi}{3}\right)$（满分 14 分）．'
