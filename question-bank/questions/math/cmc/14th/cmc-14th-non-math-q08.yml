stem: '（本题满分 14 分）证明：对任意正整数 $n$，恒有：


  $$

  \int_0^{\pi/2} x\left(\frac{\sin nx}{\sin x}\right)^4\mathrm{d}x \leqslant \left(\frac{n^2}{4}-\frac{1}{8}\right)\pi^2

  $$'
reference_answer: 详见参考解答（通过区间分段放缩与 Jordan 不等式积分估计证明）
solution: 首先由数学归纳法当 $x\in[0,\pi/2]$ 时有 $|\sin nx|\leqslant n\sin x$（得 2 分）．当 $n>1$ 时，将积分区间拆分为 $[0, \frac{\pi}{2n}]$ 与 $[\frac{\pi}{2n},
  \frac{\pi}{2}]$ 两段：$\int_0^{\pi/2} x\left(\frac{\sin nx}{\sin x}\right)^4\mathrm{d}x = \int_0^{\frac{\pi}{2n}} x\left(\frac{\sin
  nx}{\sin x}\right)^4\mathrm{d}x + \int_{\frac{\pi}{2n}}^{\pi/2} x\left(\frac{\sin nx}{\sin x}\right)^4\mathrm{d}x$第一段利用
  $\frac{\sin nx}{\sin x} \leqslant n$ 放缩：$\int_0^{\frac{\pi}{2n}} n^4 x\mathrm{d}x = \frac{n^4}{2}\left(\frac{\pi}{2n}\right)^2
  = \frac{n^2\pi^2}{8}$第二段利用 $|\sin nx|\leqslant 1$ 及 Jordan 不等式 $\sin x \geqslant \frac{2}{\pi}x$：$\int_{\frac{\pi}{2n}}^{\pi/2}
  x\left(\frac{\pi}{2x}\right)^4\mathrm{d}x = \frac{\pi^4}{16}\int_{\frac{\pi}{2n}}^{\pi/2} \frac{\mathrm{d}x}{x^3} = \frac{\pi^4}{16}\left.\left(-\frac{1}{2x^2}\right)\right|_{\frac{\pi}{2n}}^{\pi/2}
  = \frac{\pi^2}{8}\left(n^2 - 1\right)$两段相加：$\frac{n^2\pi^2}{8} + \frac{(n^2-1)\pi^2}{8} = \frac{2n^2-1}{8}\pi^2 = \left(\frac{n^2}{4}
  - \frac{1}{8}\right)\pi^2 \quad (得 12 分)$当 $n=1$ 时，左端等于 $\int_0^{\pi/2} x\mathrm{d}x = \frac{\pi^2}{8}$，右端为 $(\frac{1}{4}-\frac{1}{8})\pi^2
  = \frac{\pi^2}{8}$ 等号成立．综合即证得不等式（满分 14 分）．
