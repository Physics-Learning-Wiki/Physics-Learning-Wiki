stem: （本题满分 14 分）设正项级数 $\sum_{n=1}^\infty a_n$ 收敛，证明：存在收敛的正项级数 $\sum_{n=1}^\infty b_n$，使得 $\lim_{n\to\infty}\frac{a_n}{b_n}
  = 0$．
reference_answer: 详见参考解答（通过收敛级数余和构造逐段放大系数的序列 $b_n$ 证明）
solution: 由于正项级数 $\sum_{n=1}^\infty a_n$ 收敛，由 Cauchy 收敛准则，对任意正整数 $k$，取 $\varepsilon_k = \frac{1}{3^k}$，存在严格递增的下标数列 $n_1 <
  n_2 < \cdots < n_k < \cdots$ 使得余和满足：$\sum_{l=n_k}^\infty a_l < \frac{1}{3^k} \quad (得 4 分)$分段构造数列 $\{b_n\}$ 如下：当 $1\leqslant
  n < n_1$ 时，令 $b_n = a_n$；当 $n_k \leqslant n < n_{k+1}$ 时，令 $b_n = 2^k a_n$ ($k=1,2,\cdots$)（得 9 分）．当 $n\to\infty$ 时 $k\to\infty$，比值满足
  $\frac{a_n}{b_n} = \frac{1}{2^k} \to 0$．进一步估算级数总和：$\sum_{n=1}^\infty b_n = \sum_{n=1}^{n_1-1} a_n + \sum_{k=1}^\infty \sum_{l=n_k}^{n_{k+1}-1}
  2^k a_l \leqslant \sum_{n=1}^{n_1-1} a_n + \sum_{k=1}^\infty 2^k \left(\frac{1}{3^k}\right) = \sum_{n=1}^{n_1-1} a_n + 2
  < \infty$因此构造的正项级数 $\sum_{n=1}^\infty b_n$ 收敛且满足极限为 0（满分 14 分）．
