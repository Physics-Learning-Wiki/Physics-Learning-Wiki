stem: 极限 $\lim_{x\to 0}\frac{1-\sqrt{1-x^2}\cos x}{1+x^2-\cos^2 x} =$ ______．
reference_answer: $\frac{1}{2}$
solution: 利用泰勒展开：分子为 $1 - \left(1 - \frac{x^2}{2} + o(x^2)\right)\left(1 - \frac{x^2}{2}
  + o(x^2)\right) = x^2 + o(x^2)$；分母为 $1 + x^2 - (1 - x^2 + o(x^2)) = 2x^2 + o(x^2)$．由此得极限为
  $\lim_{x\to 0}\frac{x^2}{2x^2} = \frac{1}{2}$．
