stem: '（本题满分 14 分）设 $z = f(x,y)$ 是区域 $D = \{(x,y)\mid 0\leqslant x\leqslant 1, 0\leqslant
  y\leqslant 1\}$ 上的可微函数，$f(0,0)=0$，且 $\left.\mathrm{d}z\right|_{(0,0)} = 3\mathrm{d}x+2\mathrm{d}y$，求极限：


  $$

  \lim_{x\to 0^+}\frac{\int_0^{x^2}\mathrm{d}t\int_x^{\sqrt{t}} f(t,u)\mathrm{d}u}{1-\sqrt[4]{1-x^4}}

  $$'
reference_answer: $-2$
solution: 交换二次积分次序：$\int_0^{x^2}\mathrm{d}t\int_x^{\sqrt{t}} f(t,u)\mathrm{d}u = -\int_0^x
  \mathrm{d}u\int_0^{u^2} f(t,u)\mathrm{d}t \quad (得 3 分)$分母当 $x\to 0^+$ 时 $1-\sqrt[4]{1-x^4}
  = \frac{1}{4}x^4 + o(x^4)$．应用洛必达法则：$\lim_{x\to 0^+}\frac{-\int_0^x \mathrm{d}u\int_0^{u^2}
  f(t,u)\mathrm{d}t}{\frac{1}{4}x^4} = -\lim_{x\to 0^+}\frac{\int_0^{x^2} f(t,x)\mathrm{d}t}{x^3}$由积分第一中值定理，存在
  $\xi\in(0,x^2)$ 使 $\int_0^{x^2} f(t,x)\mathrm{d}t = f(\xi,x)x^2$（得 6 分）．根据多元函数在原点的全微分展开式：$f(\xi,x)
  = f(0,0) + f_x(0,0)\xi + f_y(0,0)x + o(\sqrt{\xi^2+x^2}) = 3\xi + 2x + o(\sqrt{\xi^2+x^2})$因为
  $0 < \xi < x^2$，故 $\lim_{x\to 0^+}\frac{\xi}{x} = 0$．因此：$-\lim_{x\to 0^+}\frac{f(\xi,x)}{x}
  = -\lim_{x\to 0^+}\left(3\frac{\xi}{x} + 2 + \frac{o(x)}{x}\right) = -2 \quad (满分
  14 分)$
