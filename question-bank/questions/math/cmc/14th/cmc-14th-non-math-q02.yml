stem: 设 $f(x) = \begin{cases} 1, & x > 0, \\ 0, & x \leqslant 0, \end{cases}$ $g(x)
  = \begin{cases} x-1, & x \geqslant 1, \\ 1-x, & x < 1, \end{cases}$ 则复合函数 $f[g(x)]$
  的间断点为 $x =$ ______．
reference_answer: $1$
solution: 易知 $g(x) = |x-1|$．当 $x \ne 1$ 时 $g(x) > 0$，故 $f[g(x)] = 1$；当 $x = 1$ 时 $g(1)
  = 0$，故 $f[g(1)] = 0$．因此复合函数除 $x=1$ 外恒等于 1，在 $x=1$ 处不连续，唯一间断点为 $x=1$．
