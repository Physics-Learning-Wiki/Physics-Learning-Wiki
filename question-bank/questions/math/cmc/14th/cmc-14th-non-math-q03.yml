stem: 极限 $\lim_{x\to 1^-}(1-x)^3\sum_{n=1}^\infty n^2 x^n =$ ______．
reference_answer: $2$
solution: 利用幂级数逐项求导易知：$\sum_{n=1}^\infty n^2 x^n = \frac{x^2+x}{(1-x)^3}$（$|x|<1$）．因此：$\lim_{x\to 1^-}(1-x)^3\sum_{n=1}^\infty
  n^2 x^n = \lim_{x\to 1^-}(x^2+x) = 2$
