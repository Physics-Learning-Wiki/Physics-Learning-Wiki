stem: 记 $D = \left\{(x,y)\mid 0\leqslant x+y\leqslant \frac{\pi}{2}, 0\leqslant x-y\leqslant \frac{\pi}{2}\right\}$，则 $\iint_D
  y\sin(x+y)\mathrm{d}x\mathrm{d}y =$ ______．
reference_answer: $\frac{\pi}{8} - \frac{\pi^2}{32}$
solution: 作二元变量代换 $u = x+y, v = x-y$，对应 $x = \frac{u+v}{2}, y = \frac{u-v}{2}$，雅可比行列式绝对值 $|J| = \frac{1}{2}$．积分化为：$\iint_D
  y\sin(x+y)\mathrm{d}x\mathrm{d}y = \frac{1}{4}\int_0^{\pi/2}\mathrm{d}v\int_0^{\pi/2}(u-v)\sin u\mathrm{d}u = \frac{1}{4}\left(\frac{\pi}{2}\times
  1 - \frac{\pi^2}{8}\times 1\right) = \frac{\pi}{8} - \frac{\pi^2}{32}$
