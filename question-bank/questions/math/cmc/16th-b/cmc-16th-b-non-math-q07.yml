stem: （本题 14 分）求函数 $f(x) = \frac{1}{(x-1)(x+3)}$ 在 $x_0 = 2$ 处的 Taylor 级数，并确定它的收敛域．
reference_answer: $f(x) = \frac{1}{4}\sum_{n=0}^\infty (-1)^n\left(1 - \frac{1}{5^{n+1}}\right)(x-2)^n$，收敛域为 $(1,3)$
solution: '拆分部分分式：


  $$

  f(x) = \frac{1}{4}\left(\frac{1}{x-1} - \frac{1}{x+3}\right) = \frac{1}{4}\left(\frac{1}{1+(x-2)} - \frac{1}{5}\cdot\frac{1}{1+\frac{x-2}{5}}\right)

  $$


  由公比绝对值小于 1 展开为几何幂级数：


  $$

  \frac{1}{1+(x-2)} = \sum_{n=0}^\infty (-1)^n (x-2)^n, \quad |x-2| < 1

  $$


  $$

  \frac{1}{1+\frac{x-2}{5}} = \sum_{n=0}^\infty (-1)^n \left(\frac{x-2}{5}\right)^n, \quad |x-2| < 5

  $$


  由此在公共收敛区间 $|x-2| < 1$ 内得到：


  $$

  f(x) = \frac{1}{4}\sum_{n=0}^\infty (-1)^n\left(1 - \frac{1}{5^{n+1}}\right)(x-2)^n, \quad |x-2| < 1

  $$


  在端点 $x = 1$ 和 $x = 3$ 处，级数通项不趋于 0，发散．故该幂级数的收敛域为 $(1,3)$（满分 14 分）．

  '
