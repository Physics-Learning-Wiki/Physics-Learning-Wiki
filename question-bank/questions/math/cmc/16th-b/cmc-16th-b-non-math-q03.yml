choice_order: fixed
stem: 设 $y = y(x)$ 由方程 $\mathrm{e}^{3y} + \int_0^{x+y}\cos t^2\mathrm{d}t = 1$ 确定，则 $\left.\frac{\mathrm{d}^2 y}{\mathrm{d}x^2}\right|_{(0,0)}
  =$ ______．
reference_answer: $-\frac{9}{64}$
solution: 方程两端对 $x$ 求导：$3y'\mathrm{e}^{3y} + (1+y')\cos(x+y)^2 = 0$将 $x=0, y=0$ 代入得 $3y'(0) + 1 + y'(0) = 0 \implies y'(0)
  = -\frac{1}{4}$．继续求导：$3y''\mathrm{e}^{3y} + 9(y')^2\mathrm{e}^{3y} + y''\cos(x+y)^2 - 2(x+y)(1+y')^2\sin(x+y)^2 = 0$将 $x=0,
  y=0, y'(0)=-\frac{1}{4}$ 代入：$3y''(0) + 9\left(-\frac{1}{4}\right)^2 + y''(0) - 0 = 0 \implies 4y''(0) = -\frac{9}{16} \implies
  y''(0) = -\frac{9}{64}$
