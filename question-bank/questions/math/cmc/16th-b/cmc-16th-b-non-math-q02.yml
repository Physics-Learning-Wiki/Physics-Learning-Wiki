stem: $\int_{-2}^2 (x^3\cos^5 x + \sqrt{4-x^2})\mathrm{d}x =$ ______．
reference_answer: $2\pi$
solution: 由于区间 $[-2,2]$ 对称，被积函数中第一项 $x^3\cos^5 x$ 为奇函数，在对称区间定积分为 0．原式等于 $\int_{-2}^2 \sqrt{4-x^2}\mathrm{d}x$．由定积分几何意义，此积分为圆心在原点、半径为
  2 的上半圆盘面积，故积分为 $\frac{1}{2}\pi (2)^2 = 2\pi$．
