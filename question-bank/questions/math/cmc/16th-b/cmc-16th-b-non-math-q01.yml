stem: 极限 $\lim_{x\to 0}\frac{\ln(1+x^2)-x^2}{\sin^4 x} =$ ______．
reference_answer: $-\frac{1}{2}$
solution: 当 $x\to 0$ 时，$\ln(1+x^2) = x^2 - \frac{x^4}{2} + o(x^4)$，$\sin^4 x = x^4 + o(x^4)$．故原式极限为：$\lim_{x\to 0}\frac{-\frac{x^4}{2}
  + o(x^4)}{x^4 + o(x^4)} = -\frac{1}{2}$
