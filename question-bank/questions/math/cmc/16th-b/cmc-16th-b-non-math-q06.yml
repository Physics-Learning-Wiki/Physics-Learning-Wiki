stem: （本题 14 分）用 Lagrange 乘数法求函数 $f(x,y,z) = x + 2y + 3z$ 在平面 $x - y + z = 1$ 和圆柱面 $x^2 + y^2 = 1$ 的交线上的最大值．
reference_answer: $3 + \sqrt{29}$
solution: 构造 Lagrange 辅助函数：$L(x,y,z; \lambda, \mu) = x + 2y + 3z - \lambda(x - y + z - 1) - \mu(x^2 + y^2 - 1) \quad (得 2
  分)$求解驻点方程组：$L_x = 1 - \lambda - 2\mu x = 0$, $L_y = 2 + \lambda - 2\mu y = 0$, $L_z = 3 - \lambda = 0$, $x - y + z - 1 =
  0$, $x^2 + y^2 - 1 = 0$．由 $L_z=0$ 得 $\lambda = 3$．代入前两式得 $x = -\frac{1}{\mu}, y = \frac{5}{2\mu}$．代入 $x^2+y^2=1$ 得 $\frac{1}{\mu^2}
  + \frac{25}{4\mu^2} = 1 \implies \mu = \pm\frac{\sqrt{29}}{2}$（得 12 分）．代入求得两驻点处函数值分别为 $3 \pm \sqrt{29}$，故最大值为 $3 + \sqrt{29}$（满分
  14 分）．
