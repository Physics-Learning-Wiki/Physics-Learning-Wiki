stem: '（本题 14 分）设 $f(x)$ 在 $(-\infty,+\infty)$ 上连续，在 $x=0$ 处可导，且满足：


  $$

  f(x) = x^3 + x^2\lim_{x\to 0}\frac{f(x)}{x} - x\int_0^1 f(x)\mathrm{d}x

  $$


  求函数 $f(x)$ 的表达式．'
reference_answer: $f(x) = x^3 - \frac{3}{22}x^2 - \frac{3}{22}x$
solution: '由题设在原点连续可导，令 $x=0$ 可知 $f(0)=0$，故 $\lim_{x\to 0}\frac{f(x)}{x} = f''(0)$．记常数
  $a = f''(0)$，$b = \int_0^1 f(x)\mathrm{d}x$，原式化为：


  $$

  f(x) = x^3 + ax^2 - bx \quad (1)

  $$


  由式 (1) 知 $\lim_{x\to 0}\frac{f(x)}{x} = -b$，故 $a = -b$（得 6 分）．对式 (1) 在 $[0,1]$ 上求定积分：


  $$

  b = \int_0^1 (x^3 + ax^2 - bx)\mathrm{d}x = \frac{1}{4} + \frac{1}{3}a - \frac{1}{2}b
  \quad (得 10 分)

  $$


  将 $a = -b$ 代入得 $\frac{3}{2}b = \frac{1}{4} - \frac{1}{3}b$，解得 $b = \frac{3}{22}$，$a
  = -\frac{3}{22}$．因此所求函数表达式为：$f(x) = x^3 - \frac{3}{22}x^2 - \frac{3}{22}x$（满分 14
  分）．'
