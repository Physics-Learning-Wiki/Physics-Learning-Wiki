stem: '（本题 14 分）设函数 $f(x), g(x)$ 在 $[a,b]$ 上连续可导且满足以下三个条件：

  (i) $\int_a^b f(x)\mathrm{d}x = \int_a^b g(x)\mathrm{d}x = 0$；

  (ii) $f''(x)g(x) - f(x)g''(x) > 0, x\in[a,b]$；

  (iii) $g(x)$ 在 $(a,b)$ 上有唯一零点 $\xi$．


  证明：

  (1) $\int_a^b f(x)\left(\int_a^x g(s)\mathrm{d}s\right)\mathrm{d}x = -\int_a^b g(x)\left(\int_a^x f(s)\mathrm{d}s\right)\mathrm{d}x$；

  (2) $\int_a^b f(x)\left(\int_a^x g(s)\mathrm{d}s\right)\mathrm{d}x > 0$．'
reference_answer: 详见参考解答（通过分部积分与利用条件 (ii) 建立比值单调性及符号判别）
solution: '(1) 记 $F(x) = \int_a^x f(s)\mathrm{d}s, G(x) = \int_a^x g(s)\mathrm{d}s$．由分部积分：


  $$

  \int_a^b f(x)G(x)\mathrm{d}x = \left.F(x)G(x)\right|_a^b - \int_a^b F(x)g(x)\mathrm{d}x

  $$


  因 $F(b) = G(b) = 0$ 且 $F(a) = G(a) = 0$，首末项为 0，即证得结论（得 4 分）．

  (2) 记积分 $I = \int_a^b f(x)G(x)\mathrm{d}x$．由对称性 $I = \frac{1}{2}\iint_D (f(x)g(s)-f(s)g(x))\mathrm{d}s\mathrm{d}x$（得 8 分）．由条件
  (ii) 知商函数 $f(x)/g(x)$ 在除零点 $\xi$ 外严格单调递增．结合条件 (iii) $g(x)$ 在 $\xi$ 变号，可将积分区域细分证明被积函数非负且不恒为零（得 12 分），从而严格证得 $I > 0$（满分 14
  分）．'
