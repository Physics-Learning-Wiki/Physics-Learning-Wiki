stem: （本题 14 分）求微分方程 $y'x\ln x\sin y + (1 - x\cos y)\cos y = 0$ 的通解．
reference_answer: $\frac{1}{\cos y} = \frac{1}{\ln x}(x + C)$ 或 $\cos y = \frac{\ln
  x}{x+C}$
solution: '将方程整理变形为：$y''\sin y + \frac{1}{x\ln x}\cos y = \frac{1}{\ln x}\cos^2 y$．令
  $z = \cos y$，则 $z'' = -y''\sin y$，原方程化为 Bernoulli 方程（$n=2$）：


  $$

  z'' - \frac{1}{x\ln x}z = -\frac{1}{\ln x}z^2 \quad (得 6 分)

  $$


  再令 $u = z^{-1} = \frac{1}{\cos y}$，方程转化为一阶线性非齐次方程：$u'' + \frac{1}{x\ln x}u = \frac{1}{\ln
  x}$．应用通解公式：


  $$

  u = \mathrm{e}^{-\int \frac{\mathrm{d}x}{x\ln x}}\left(\int \frac{1}{\ln x}\mathrm{e}^{\int
  \frac{\mathrm{d}x}{x\ln x}}\mathrm{d}x + C\right) = \frac{1}{\ln x}\left(\int 1\mathrm{d}x
  + C\right) = \frac{1}{\ln x}(x+C) \quad (得 12 分)

  $$


  变量换回得所求通解为：$\frac{1}{\cos y} = \frac{1}{\ln x}(x+C)$（满分 14 分）．'
