stem: 设平面过原点与点 $(6,-3,2)$，且与平面 $4x - y + 2z - 8 = 0$ 垂直，则此平面方程为 ______．
reference_answer: $2x + 2y - 3z = 0$（或其非零常数倍形式）
solution: 设所求平面法向量为 $\mathbf{n} = (A,B,C)$．由平面过原点及点 $(6,-3,2)$ 知 $6A - 3B + 2C = 0$；由平面与 $4x-y+2z-8=0$ 垂直知 $4A - B + 2C =
  0$．联立解得 $A = B$，$C = -\frac{3}{2}A$．取 $A = 2$，得法向量 $\mathbf{n} = (2,2,-3)$，故平面方程为 $2x + 2y - 3z = 0$．
