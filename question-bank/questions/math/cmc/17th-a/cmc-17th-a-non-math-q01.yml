stem: 设函数 $f(x) = x - \ln(1+x) - \frac{1}{2}x\sin x$，$g(x) = ax^3$，且满足 $\lim_{x\to 0}\frac{f(x)}{g(x)} = 1$，则 $a =$ ______．
reference_answer: $a = -\frac{1}{3}$
solution: 根据 Taylor 公式，$\ln(1+x) = x - \frac{x^2}{2} + \frac{x^3}{3} + o(x^3)$，$\sin x = x - \frac{x^3}{6} + o(x^3)$，所以 $f(x)
  = -\frac{1}{3}x^3 + o(x^3)$．由 $\lim_{x\to 0}\frac{f(x)}{g(x)} = 1$ 即 $\lim_{x\to 0}\frac{-\frac{1}{3}x^3+o(x^3)}{ax^3} =
  1$，得 $a = -\frac{1}{3}$．
