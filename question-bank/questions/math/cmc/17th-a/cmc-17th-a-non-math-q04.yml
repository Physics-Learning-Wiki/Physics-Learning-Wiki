choice_order: fixed
stem: 设函数 $f(u,v)$ 具有一阶连续偏导数，$f(2,0) = 3$，$f'_u(2,0) = 5$，又设 $z = z(x,y)$ 是由方程 $xz
  = f(2x-y, xyz)$ 确定的隐函数，则 $\left.\frac{\partial z}{\partial x}\right|_{\substack{x=1\\y=0}}
  =$ ______．
reference_answer: $7$
solution: 对隐函数方程两边关于 $x$ 求偏导：$z + x\frac{\partial z}{\partial x} = 2f'_u + yf'_v\left(z
  + x\frac{\partial z}{\partial x}\right)$．由此解得 $\frac{\partial z}{\partial x} = \frac{1}{x}\left(\frac{2f'_u}{1-yf'_v}
  - z\right)$．当 $x=1, y=0$ 时，$z = f(2,0) = 3$，$f'_u(2,0) = 5$．代入得 $\left.\frac{\partial
  z}{\partial x}\right|_{\substack{x=1\\y=0}} = 2f'_u(2,0) - 3 = 2\times 5 - 3 = 7$．
