stem: 设曲线 $L$ 为球面 $x^2+y^2+z^2=4$ 与平面 $x+y+z=3$ 的交线，则第一类曲线积分 $\int_L (x^2+2xy)\mathrm{d}s
  =$ ______．
reference_answer: $6\pi$
solution: 根据轮换对称性，在交线 $L$ 上：$\int_L (x^2+2xy)\mathrm{d}s = \frac{1}{3}\int_L (x^2+y^2+z^2)\mathrm{d}s
  + \frac{2}{3}\int_L (xy+yz+zx)\mathrm{d}s = \frac{1}{3}\int_L (x+y+z)^2\mathrm{d}s$．在
  $L$ 上 $x+y+z=3$，故 $(x+y+z)^2 = 9$．交线 $L$ 为圆周，球心到平面距离 $d = \frac{3}{\sqrt{3}} = \sqrt{3}$，圆半径
  $r = \sqrt{4-3} = 1$，周长 $\int_L\mathrm{d}s = 2\pi$．故积分值为 $\frac{1}{3}\times 9\times
  2\pi = 6\pi$．
