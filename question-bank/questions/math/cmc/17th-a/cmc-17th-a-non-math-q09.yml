stem: '（本题 14 分）判断级数 $\sum_{n=1}^\infty a_n$ 的敛散性，其中：


  $$

  a_n = \sin^2 x\sin^2 2x\cdots\sin^2 2^n x, \quad x\in(-\infty,+\infty)

  $$'
reference_answer: 级数 $\sum_{n=1}^\infty a_n$ 对任意 $x\in(-\infty,+\infty)$ 均收敛
solution: 令辅助函数 $f(x) = \sin^2 x\sin 2x$，则 $f'(x) = -8\sin^2 x\left(\sin x - \frac{\sqrt{3}}{2}\right)\left(\sin
  x + \frac{\sqrt{3}}{2}\right)$．在 $(0,\pi)$ 驻点为 $x_1 = \frac{\pi}{3}, x_2 = \frac{2\pi}{3}$（得
  4 分）．易知 $f(x)$ 在 $[0,\pi]$ 上最值为 $\pm \frac{3\sqrt{3}}{8}$，故 $|f(x)| \leqslant \frac{3\sqrt{3}}{8}$（得
  9 分）．由于 $a_n^{3/2} = |\sin x|\cdot |f(x)f(2x)\cdots f(2^{n-1}x)|\cdot |\sin^2 2^n
  x| \leqslant \left(\frac{3\sqrt{3}}{8}\right)^n$，两边取 $2/3$ 次方得 $a_n \leqslant \left(\frac{3\sqrt{3}}{8}\right)^{2n/3}
  = \left(\frac{3}{4}\right)^n$．由于几何级数 $\sum_{n=1}^\infty \left(\frac{3}{4}\right)^n$
  收敛，根据比较审敛法，$\sum_{n=1}^\infty a_n$ 收敛（满分 14 分）．
