stem: '（本题 14 分）设 $\Omega$ 是由平面 $\Pi_1: x = 0$, $\Pi_2: x = y$, $\Pi_3: y = z$, $\Pi_4:
  z = 1$, $\Pi_5: z = 2$ 围成的空间区域，求三重积分：


  $$

  \iiint_\Omega \frac{\mathrm{d}x\mathrm{d}y\mathrm{d}z}{\sqrt{y^2 + z^2}}

  $$'
reference_answer: $\frac{3(\sqrt{2}-1)}{2}$
solution: '采用截面投影法（先二后一），对 $1 \leqslant z \leqslant 2$，平面截区域为 $D_z = \{(x,y)\mid 0
  \leqslant x \leqslant y, 0 \leqslant y \leqslant z\}$：


  $$

  \iiint_\Omega \frac{\mathrm{d}x\mathrm{d}y\mathrm{d}z}{\sqrt{y^2+z^2}} = \int_1^2
  \mathrm{d}z \iint_{D_z} \frac{\mathrm{d}x\mathrm{d}y}{\sqrt{y^2+z^2}} \quad (得 5
  分)

  $$


  先对 $x$ 积分：


  $$

  = \int_1^2 \mathrm{d}z \int_0^z \mathrm{d}y \int_0^y \frac{\mathrm{d}x}{\sqrt{y^2+z^2}}
  = \int_1^2 \mathrm{d}z \int_0^z \frac{y}{\sqrt{y^2+z^2}}\mathrm{d}y \quad (得 10
  分)

  $$


  内层积分为 $\left.\sqrt{y^2+z^2}\right|_0^z = (\sqrt{2}-1)z$．最后关于 $z$ 积分：$\int_1^2 (\sqrt{2}-1)z\mathrm{d}z
  = (\sqrt{2}-1)\left.\frac{z^2}{2}\right|_1^2 = \frac{3(\sqrt{2}-1)}{2}$（满分 14 分）．'
