stem: 极限 $\lim_{x\to 0}\frac{\int_0^{\sin^2 x}\ln(1+t)\mathrm{d}t}{(\sqrt[3]{1+x^3}-1)\sin
  x} =$ ______．
reference_answer: $\frac{3}{2}$
solution: '当 $x\to 0$ 时，$\sin x \sim x$，$\sqrt[3]{1+x^3}-1 \sim \frac{1}{3}x^3$，故分母等价于
  $\frac{1}{3}x^4$．由洛必达法则或变上限积分等价代换：


  $$

  \lim_{x\to 0}\frac{\int_0^{\sin^2 x}\ln(1+t)\mathrm{d}t}{\frac{1}{3}x^4} = \lim_{x\to
  0}\frac{\ln(1+\sin^2 x)\cdot 2\sin x\cos x}{\frac{4}{3}x^3} = \lim_{x\to 0}\frac{x^2\cdot
  2x}{\frac{4}{3}x^3} = \frac{3}{2}

  $$


  因此所求极限值为 $\frac{3}{2}$．'
