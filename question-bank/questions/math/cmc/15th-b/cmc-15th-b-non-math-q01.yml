stem: $\lim_{x\to\infty}\left(\frac{x+3}{x+2}\right)^{2x-1} =$ ______．
reference_answer: $\mathrm{e}^2$
solution: 计算未定式极限：$\lim_{x\to\infty}\left(1 + \frac{1}{x+2}\right)^{2(x+2)-5} = \lim_{x\to\infty}\left[\left(1
  + \frac{1}{x+2}\right)^{x+2}\right]^2\cdot \left(1 + \frac{1}{x+2}\right)^{-5} =
  \mathrm{e}^2$
