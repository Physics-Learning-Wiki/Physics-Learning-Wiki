stem: （本题 14 分）求幂级数 $\sum_{n=1}^\infty \frac{(-1)^{n-1}x^{2n}}{n(2n-1)}$ 的收敛域及和函数．
reference_answer: 收敛域为 $[-1, 1]$，和函数 $S(x) = 2x\arctan x - \ln(1+x^2)$
solution: 利用比值法易得收敛半径 $R = 1$，在 $x = \pm 1$ 处绝对收敛，收敛域为 $[-1, 1]$（得 5 分）．设和函数为 $S(x)$，在 $(-1,1)$ 上逐项求导：$\frac{1}{2}S''(x) =
  \sum_{n=1}^\infty (-1)^{n-1}x^{2n-2} = \frac{1}{1+x^2} \quad (得 9 分)$积分得 $S'(x) = 2\int_0^x \frac{1}{1+s^2}\mathrm{d}s =
  2\arctan x$．再积分：$S(x) = 2\int_0^x \arctan s\mathrm{d}s = 2x\arctan x - \ln(1+x^2), \quad x\in(-1,1)$根据 Abel 连续性定理，端点处和函数连续，故在闭区间
  $[-1,1]$ 上均成立（满分 14 分）．
