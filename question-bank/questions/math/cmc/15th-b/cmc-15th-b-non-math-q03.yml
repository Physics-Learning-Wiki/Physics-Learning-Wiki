stem: 设曲线 $y = \ln(1+ax)+1$ 与曲线 $y = 2xy^3+b$ 在 $(0,1)$ 处相切，则 $a+b =$ ______．
reference_answer: $3$
solution: 曲线过点 $(0,1)$，代入第二条曲线得 $1 = 0 + b \implies b = 1$．求第一条曲线切线斜率：$y'_1(0) = a$．对第二条曲线两边求导：$y'
  = 2y^3 + 6xy^2 y'$，代入 $(0,1)$ 得切线斜率 $y'_2(0) = 2$．由相切斜率相等得 $a = 2$，故 $a+b = 3$．
