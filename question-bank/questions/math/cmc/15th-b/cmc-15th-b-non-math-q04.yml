stem: 设函数 $y = y(x)$ 由方程 $y = 1+\arctan(xy)$ 所确定，则 $y'(0) =$ ______．
reference_answer: $1$
solution: 由方程在 $x=0$ 处得 $y(0) = 1$．两端关于 $x$ 求偏导：$y' = \frac{y + xy'}{1+x^2y^2}$将 $x=0, y=1$ 代入上式得 $y'(0) = \frac{1 + 0}{1
  + 0} = 1$．
