stem: 计算 $\int_0^1 \mathrm{d}x\int_x^{\sqrt{x}}\frac{\cos y}{y}\mathrm{d}y =$ ______．
reference_answer: $1 - \cos 1$
solution: 积分区域为 $D = \{(x,y)\mid 0\leqslant x\leqslant 1, x\leqslant y\leqslant \sqrt{x}\}$．交换积分次序：$\int_0^1 \mathrm{d}y\int_{y^2}^y
  \frac{\cos y}{y}\mathrm{d}x = \int_0^1 \frac{\cos y}{y}(y-y^2)\mathrm{d}y = \int_0^1 (1-y)\cos y\mathrm{d}y$分部积分得：$\left.(1-y)\sin
  y\right|_0^1 + \int_0^1 \sin y\mathrm{d}y = 0 + (-\cos 1 - (-\cos 0)) = 1 - \cos 1$
