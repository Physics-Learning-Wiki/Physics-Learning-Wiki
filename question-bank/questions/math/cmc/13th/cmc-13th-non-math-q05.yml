stem: 记 $D = \{(x, y)\mid x^2+y^2 \le \pi\}$，则 $\iint_D (\sin x^2\cos y^2 + x\sqrt{x^2+y^2})\mathrm{d}x\mathrm{d}y =$ ______．
reference_answer: $\pi$
solution: '根据对称性，奇函数部分积分为零：$\iint_D x\sqrt{x^2+y^2}\mathrm{d}x\mathrm{d}y = 0$．


  对第一项利用 $x, y$ 轮换对称性：


  $$

  \iint_D \sin x^2\cos y^2\mathrm{d}x\mathrm{d}y = \iint_D \sin y^2\cos x^2\mathrm{d}x\mathrm{d}y = \frac{1}{2}\iint_D (\sin
  x^2\cos y^2 + \cos x^2\sin y^2)\mathrm{d}x\mathrm{d}y = \frac{1}{2}\iint_D \sin(x^2+y^2)\mathrm{d}x\mathrm{d}y

  $$


  变换为极坐标：


  $$

  \frac{1}{2}\int_0^{2\pi}\mathrm{d}\theta \int_0^{\sqrt{\pi}} r\sin r^2\mathrm{d}r = \frac{\pi}{2}\left[-\cos r^2\right]_0^{\sqrt{\pi}}
  = \frac{\pi}{2}(-\cos\pi + \cos 0) = \pi

  $$


  故积分为 $\pi$．'
