stem: 极限 $\lim_{x\to +\infty}\frac{x\sqrt{x^2+x+1} - x\ln(e^x+x)}{x} =$ ______．
reference_answer: $0$
solution: '原式可变形为 $\lim_{x\to+\infty}\left[\sqrt{x^2+x+1} - \ln(e^x+x)\right]$．


  注意到：


  $$

  \sqrt{x^2+x+1} - \ln(e^x+x) = x\sqrt{1+\frac{1}{x}+\frac{1}{x^2}} - x - \ln\left(1+\frac{x}{e^x}\right)
  = x\left(\sqrt{1+\frac{1}{x}+\frac{1}{x^2}}-1\right) - \ln\left(1+\frac{x}{e^x}\right)

  $$


  当 $x\to+\infty$ 时，$x\left(\sqrt{1+\frac{1}{x}+\frac{1}{x^2}}-1\right) \sim x\cdot\frac{1}{2x}
  = \frac{1}{2}$；同时 $\frac{x}{e^x}\to 0$，故 $\ln\left(1+\frac{x}{e^x}\right)\to 0$．因此极限为
  $0$（或由原题式直接化简 $-\lim_{x\to+\infty}\sqrt{1+\frac{1}{x}+\frac{1}{x^2}}\ln\left(1+\frac{x}{e^x}\right)
  = 0$）．'
