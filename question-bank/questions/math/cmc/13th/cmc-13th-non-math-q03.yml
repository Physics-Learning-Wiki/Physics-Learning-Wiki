stem: 设函数 $f(x)$ 连续，且 $f(0) \neq 0$，则 $\lim_{x\to 0}\frac{2\int_0^x (x-t)f(t)\mathrm{d}t}{x\int_0^x
  f(x-t)\mathrm{d}t} =$ ______．
reference_answer: $1$
solution: '分子改写为 $2x\int_0^x f(t)\mathrm{d}t - 2\int_0^x t f(t)\mathrm{d}t$；分母换元 $u
  = x-t$ 得 $x\int_0^x f(u)\mathrm{d}u$．应用洛必达法则：


  $$

  \lim_{x\to 0}\frac{2x\int_0^x f(t)\mathrm{d}t - 2\int_0^x t f(t)\mathrm{d}t}{x\int_0^x
  f(u)\mathrm{d}u} = \lim_{x\to 0}\frac{2\int_0^x f(t)\mathrm{d}t + 2x f(x) - 2x f(x)}{\int_0^x
  f(u)\mathrm{d}u + x f(x)} = \lim_{x\to 0}\frac{2\int_0^x f(t)\mathrm{d}t}{\int_0^x
  f(u)\mathrm{d}u + x f(x)}

  $$


  由积分中值定理，$\int_0^x f(t)\mathrm{d}t = x f(\xi)$（$\xi$ 介于 $0$ 与 $x$ 之间），代入得：


  $$

  \lim_{x\to 0}\frac{2x f(\xi)}{x f(\xi) + x f(x)} = \lim_{x\to 0}\frac{2f(\xi)}{f(\xi)+f(x)}
  = \frac{2f(0)}{2f(0)} = 1

  $$


  故极限为 $1$．'
