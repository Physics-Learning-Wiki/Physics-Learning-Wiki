stem: '设函数 $f(x)$ 在闭区间 $[a, b]$ 上有连续的二阶导数，证明：


  $$

  \lim_{n\to\infty} n^2 \left[\int_a^b f(x)\mathrm{d}x - \frac{b-a}{n}\sum_{k=1}^n
  f\left(a + \frac{2k-1}{2n}(b-a)\right)\right] = \frac{(b-a)^2}{24}[f''(b)-f''(a)]

  $$'
reference_answer: 见推导步骤
solution: '记 $x_k = a + \frac{k(b-a)}{n}$，中点 $\xi_k = a + \frac{2k-1}{2n}(b-a)$ ($k=1,2,\dots,n$)．在区间
  $[x_{k-1}, x_k]$ 上 Taylor 展开：


  $$

  f(x) = f(\xi_k) + f''(\xi_k)(x-\xi_k) + \frac{f''''(\eta_k)}{2}(x-\xi_k)^2

  $$


  两端积分，因对称性 $\int_{x_{k-1}}^{x_k}(x-\xi_k)\mathrm{d}x = 0$：


  $$

  \int_{x_{k-1}}^{x_k} (f(x) - f(\xi_k))\mathrm{d}x = \frac{1}{2}\int_{x_{k-1}}^{x_k}
  f''''(\eta_k)(x-\xi_k)^2\mathrm{d}x

  $$


  设 $f''''(x)$ 在 $[x_{k-1}, x_k]$ 上的最大值和最小值分别为 $M_k, m_k$．由 $\int_{x_{k-1}}^{x_k}(x-\xi_k)^2\mathrm{d}x
  = \frac{(b-a)^3}{12n^3}$，求和并放缩可得：


  $$

  \frac{(b-a)^2}{24}\sum_{k=1}^n m_k \frac{b-a}{n} \le n^2 B_n \le \frac{(b-a)^2}{24}\sum_{k=1}^n
  M_k \frac{b-a}{n}

  $$


  由 $f''''(x)$ 的连续性与定积分定义：


  $$

  \lim_{n\to\infty}\sum_{k=1}^n m_k \frac{b-a}{n} = \lim_{n\to\infty}\sum_{k=1}^n
  M_k \frac{b-a}{n} = \int_a^b f''''(x)\mathrm{d}x = f''(b) - f''(a)

  $$


  由夹逼定理即得极限为 $\frac{(b-a)^2}{24}[f''(b)-f''(a)]$．'
