stem: 设 $x_1 = 2021$，$x_n^2 - 2(x_n+1)x_{n+1} + 2021 = 0$ ($n \ge 1$)．证明数列 $\{x_n\}$
  收敛，并求极限 $\lim_{n\to\infty} x_n$．
reference_answer: $\sqrt{2022} - 1$
solution: '记 $a = 1011$，$y_n = 1 + x_n$．代入原递推式：


  $$

  (y_n-1)^2 - 2y_n(y_{n+1}-1) + 2021 = 0 \implies y_n^2 - 2y_n y_{n+1} + 2022 = 0

  $$


  即：


  $$

  y_{n+1} = \frac{y_n}{2} + \frac{1011}{y_n} = \frac{1}{2}\left(y_n + \frac{2a}{y_n}\right)

  $$


  定义函数 $f(y) = \frac{1}{2}\left(y + \frac{2a}{y}\right)$ ($y > 0$)．$y_1 = 2022 = 2a$．


  由均值不等式，当 $y > \sqrt{2a}$ 时，$f(y) > \sqrt{2a}$ 且 $f(y) < y$．因此 $\{y_n\}$ 单调减少且有下界
  $\sqrt{2a} = \sqrt{2022}$，故数列 $\{y_n\}$ 收敛，从而 $\{x_n\}$ 收敛．


  设 $\lim_{n\to\infty} y_n = A$ ($A > 0$)，由 $A = \frac{1}{2}\left(A + \frac{2022}{A}\right)$
  解得 $A = \sqrt{2022}$．


  因此 $\lim_{n\to\infty} x_n = A - 1 = \sqrt{2022} - 1$．'
