stem: 设 $f(x)$ 在 $[0, +\infty)$ 上是有界连续函数，证明：方程 $y'' + 14y' + 13y = f(x)$ 的每一个解在 $[0, +\infty)$ 上都是有界函数．
reference_answer: 见推导步骤
solution: '齐次方程 $y'''' + 14y'' + 13y = 0$ 的通解为 $y_h = C_1 e^{-x} + C_2 e^{-13x}$．


  将方程改写为一阶方程组形式：


  $$(y'' + y)'' + 13(y'' + y) = f(x)$$


  令 $y_1 = y'' + y$，解得 $y_1 = e^{-13x}\left(\int_0^x f(t)e^{13t}\mathrm{d}t + C_3\right)$．


  同理，$(y'' + 13y)'' + (y'' + 13y) = f(x)$，令 $y_2 = y'' + 13y$，解得 $y_2 = e^{-x}\left(\int_0^x f(t)e^t\mathrm{d}t + C_4\right)$．


  消去 $y''$ 可得原方程通解：


  $$

  y = C_1 e^{-x} + C_2 e^{-13x} + \frac{1}{12}e^{-x}\int_0^x f(t)e^t\mathrm{d}t - \frac{1}{12}e^{-13x}\int_0^x f(t)e^{13t}\mathrm{d}t

  $$


  因 $f(x)$ 在 $[0, +\infty)$ 上有界，存在 $M > 0$ 满足 $|f(x)| \le M$．当 $x \ge 0$ 时：


  $$

  \left|e^{-x}\int_0^x f(t)e^t\mathrm{d}t\right| \le M e^{-x}\int_0^x e^t\mathrm{d}t = M(1 - e^{-x}) \le M

  $$


  $$

  \left|e^{-13x}\int_0^x f(t)e^{13t}\mathrm{d}t\right| \le M e^{-13x}\int_0^x e^{13t}\mathrm{d}t = \frac{M}{13}(1 - e^{-13x})
  \le \frac{M}{13}

  $$


  因此对任意固定解，常数 $C_1, C_2$ 确定，有 $|y| \le |C_1| + |C_2| + \frac{7M}{78} < +\infty$，即每一个解在 $[0, +\infty)$ 上均有界．'
