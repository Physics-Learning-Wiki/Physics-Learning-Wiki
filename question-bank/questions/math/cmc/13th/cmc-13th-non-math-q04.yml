stem: '过三条直线 $L_1: \begin{cases}x=0,\\ y-z=2,\end{cases}$ $L_2: \begin{cases}x=0,\\
  x+y-z+2=0,\end{cases}$ 与 $L_3: \begin{cases}x=\sqrt{2},\\ y-z=0\end{cases}$ 的圆柱面方程为
  ______．'
reference_answer: $2x^2 + y^2 + z^2 - 2yz = 4$
solution: '三条直线的对称式方程方向向量均为 $(0, 1, 1)$，彼此平行．


  在 $L_1$ 上取点 $P_1(0, 1, -1)$，过该点作与三直线垂直的截平面 $y+z=0$．该平面分别与 $L_2, L_3$ 交于点 $P_2(0,
  -1, 1)$ 与 $P_3(\sqrt{2}, 0, 0)$．


  三点到原点距离均为 $\sqrt{2}$，截面圆圆心为 $O(0, 0, 0)$，中心轴线方程为 $\frac{x}{0} = \frac{y}{1} = \frac{z}{1}$．


  设圆柱面上任意点为 $Q(x, y, z)$，点 $Q$ 到轴线的距离为 $\sqrt{2}$：


  $$

  \frac{|(x, y, z) \times (0, 1, 1)|^2}{0^2+1^2+1^2} = \frac{(y-z)^2 + x^2 + x^2}{2}
  = 2

  $$


  化简即得所求圆柱面方程为 $2x^2 + y^2 + z^2 - 2yz = 4$．'
