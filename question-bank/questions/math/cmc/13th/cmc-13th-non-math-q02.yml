stem: 设 $z = z(x, y)$ 是由方程 $2\sin(x+2y-3z) = x+2y-3z$ 所确定的二元隐函数，则 $\frac{\partial
  z}{\partial x} + \frac{\partial z}{\partial y} =$ ______．
reference_answer: $1$
solution: '将方程两边分别关于 $x$ 和 $y$ 求偏导：


  $$

  2\cos(x+2y-3z)\left(1 - 3\frac{\partial z}{\partial x}\right) = 1 - 3\frac{\partial
  z}{\partial x}

  $$


  $$

  2\cos(x+2y-3z)\left(2 - 3\frac{\partial z}{\partial y}\right) = 2 - 3\frac{\partial
  z}{\partial y}

  $$


  按 $\cos(x+2y-3z) = \frac{1}{2}$ 和 $\cos(x+2y-3z) \neq \frac{1}{2}$ 两种情形讨论，均可解得：


  $$

  \frac{\partial z}{\partial x} = \frac{1}{3}, \quad \frac{\partial z}{\partial y}
  = \frac{2}{3}

  $$


  因此 $\frac{\partial z}{\partial x} + \frac{\partial z}{\partial y} = \frac{1}{3}
  + \frac{2}{3} = 1$．'
