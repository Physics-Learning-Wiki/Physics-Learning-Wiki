stem: '已知直线 $L: \begin{cases}2x-4y+z=0,\\ 3x-y-2z=9\end{cases}$ 和平面 $\pi: 4x-y+z=1$，则直线 $L$ 在平面 $\pi$ 上的投影直线方程为 ______．'
reference_answer: $\begin{cases}17x+31y-37z-117=0,\\ 4x-y+z=1\end{cases}$
solution: '设过 $L$ 的平面束方程为：


  $$

  \lambda(2x-4y+z) + \mu(3x-y-2z-9) = 0 \implies (2\lambda+3\mu)x - (4\lambda+\mu)y + (\lambda-2\mu)z - 9\mu = 0

  $$


  投影平面 $\pi_1$ 垂直于平面 $\pi$，法向量内积为零：


  $$

  4(2\lambda+3\mu) - (-1)(4\lambda+\mu) + 1\cdot(\lambda-2\mu) = 0 \implies 13\lambda + 11\mu = 0

  $$


  取 $\lambda = -11, \mu = 13$，代入得 $\pi_1: 17x+31y-37z-117=0$．


  故直线 $L$ 在平面 $\pi$ 上的投影直线方程为 $\begin{cases}17x+31y-37z-117=0,\\ 4x-y+z=1\end{cases}$．'
