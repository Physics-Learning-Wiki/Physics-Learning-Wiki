stem: 微分方程 $\begin{cases}(x+1)\frac{\mathrm{d}y}{\mathrm{d}x} + 1 = 2e^{-y},\\ y(0)=0\end{cases}$
  的解是 ______．
reference_answer: $y = \ln\frac{2x+1}{x+1}$
solution: '原方程变形为：


  $$

  e^y \frac{\mathrm{d}y}{\mathrm{d}x} + \frac{1}{x+1}e^y = \frac{2}{x+1}

  $$


  令 $u = e^y$，得到关于 $u$ 的一阶线性非齐次微分方程：


  $$

  \frac{\mathrm{d}u}{\mathrm{d}x} + \frac{1}{x+1}u = \frac{2}{x+1}

  $$


  通解为 $u = e^{-\int\frac{1}{x+1}\mathrm{d}x}\left(\int\frac{2}{x+1}e^{\int\frac{1}{x+1}\mathrm{d}x}\mathrm{d}x
  + C\right) = \frac{1}{x+1}(2x+C)$．


  由初始条件 $y(0)=0 \implies u(0)=1$，得 $C=1$．


  因此 $e^y = \frac{2x+1}{x+1}$，解为 $y = \ln\frac{2x+1}{x+1}$．'
