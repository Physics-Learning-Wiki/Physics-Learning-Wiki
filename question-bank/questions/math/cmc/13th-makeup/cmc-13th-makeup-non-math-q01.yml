stem: 设 $x_0 = 1$，$x_n = \ln(1+x_{n-1})$ ($n \ge 1$)，则 $\lim_{n\to+\infty} n x_n =$ ______．
reference_answer: $2$
solution: '由递推式可知 $x_n \in (0, 1)$ 严格单调减少且 $\lim_{n\to+\infty} x_n = 0$．由 Stolz 定理：


  $$

  \lim_{n\to+\infty} \frac{1}{n x_n} = \lim_{n\to+\infty} \frac{\frac{1}{x_{n+1}} - \frac{1}{x_n}}{(n+1)-n} = \lim_{n\to+\infty}
  \frac{x_n - x_{n+1}}{x_n x_{n+1}} = \lim_{n\to+\infty} \frac{x_n - \ln(1+x_n)}{x_n \ln(1+x_n)}

  $$


  利用等价无穷小与 Taylor 展开：


  $$

  = \lim_{x_n\to 0} \frac{x_n - \left(x_n - \frac{1}{2}x_n^2 + o(x_n^2)\right)}{x_n^2} = \frac{1}{2}

  $$


  因此 $\lim_{n\to+\infty} n x_n = 2$．'
