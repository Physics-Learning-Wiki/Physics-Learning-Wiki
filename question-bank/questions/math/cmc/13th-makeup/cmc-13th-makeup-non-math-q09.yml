stem: 设 $f(x) = \int_0^x \left(1 - \frac{[u]}{u}\right)\mathrm{d}u$，其中 $[x]$ 表示不超过 $x$ 的最大整数．试讨论反常积分 $\int_1^{+\infty} \frac{e^{f(x)}}{x^p}\cos\left(x^2
  - \frac{1}{x^2}\right)\mathrm{d}x$ 的敛散性（$p > 0$）．
reference_answer: 当 $p > \frac{3}{2}$ 时绝对收敛；当 $0 < p \le \frac{3}{2}$ 时条件收敛
solution: '当 $x \ge 1$ 时，展开积分易得 $f(x) = \frac{1}{2}\ln x + O(1)$，故存在常数 $0 < C_1 \le C_2$，使 $C_1\sqrt{x} \le e^{f(x)} \le C_2\sqrt{x}$．


  (1) 当 $p > \frac{3}{2}$ 时：


  $$

  \left|\frac{e^{f(x)}}{x^p}\cos\left(x^2 - \frac{1}{x^2}\right)\right| \le \frac{C_2}{x^{p-1/2}}

  $$


  由于 $p - \frac{1}{2} > 1$，由比较审敛法知原积分绝对收敛．


  (2) 当 $0 < p \le \frac{3}{2}$ 时，改写被积函数：


  $$

  \frac{e^{f(x)}}{x^p}\cos\left(x^2 - \frac{1}{x^2}\right) = \frac{e^{f(x)}x^{3-p}}{2(x^4+1)}\cdot 2\left(x+\frac{1}{x^3}\right)\cos\left(x^2
  - \frac{1}{x^2}\right)

  $$


  利用 Dirichlet 判别法，$\left|\int_A^B 2(x+1/x^3)\cos(x^2-1/x^2)\mathrm{d}x\right| \le 2$，且前项单调递减趋于 0，故原积分收敛．


  再由 $\cos^2\alpha = \frac{1+\cos 2\alpha}{2}$ 展开可知绝对值积分发散．因此当 $0 < p \le \frac{3}{2}$ 时条件收敛．'
