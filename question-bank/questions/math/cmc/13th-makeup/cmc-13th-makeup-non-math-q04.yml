stem: $\sum_{n=1}^\infty \arctan\frac{2}{4n^2+4n+1} =$ ______．
reference_answer: $\frac{\pi}{2} - \arctan 2$
solution: '注意到 $\frac{2}{4n^2+4n+1} = \frac{(2n+2)-2n}{1+2n(2n+2)}$，由正切差角公式：


  $$

  \arctan\frac{2}{4n^2+4n+1} = \arctan(2n+2) - \arctan(2n)

  $$


  级数部分和裂项相消：


  $$

  \sum_{n=1}^N \left[\arctan(2n+2) - \arctan(2n)\right] = \arctan(2N+2) - \arctan
  2

  $$


  令 $N\to+\infty$，由于 $\lim_{N\to+\infty}\arctan(2N+2) = \frac{\pi}{2}$，得级数和为 $\frac{\pi}{2}
  - \arctan 2$．'
