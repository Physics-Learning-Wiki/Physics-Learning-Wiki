stem: 积分 $\int_0^{\pi/2}\frac{\cos x}{1+\tan x}\mathrm{d}x =$ ______．
reference_answer: $\frac{1}{\sqrt{2}}\ln(1+\sqrt{2})$
solution: '作变量代换 $x = \frac{\pi}{2}-t$，则：


  $$

  \int_0^{\pi/2}\frac{\cos x}{1+\tan x}\mathrm{d}x = \int_0^{\pi/2}\frac{\sin x}{1+\cot x}\mathrm{d}x

  $$


  两式相加并除以 2：


  $$

  \int_0^{\pi/2}\frac{\cos x}{1+\tan x}\mathrm{d}x = \frac{1}{2}\int_0^{\pi/2}\left(\frac{\cos x}{1+\tan x} + \frac{\sin x}{1+\cot
  x}\right)\mathrm{d}x = \frac{1}{2}\int_0^{\pi/2}\frac{1}{\cos x+\sin x}\mathrm{d}x

  $$


  $$

  = \frac{1}{2\sqrt{2}}\int_0^{\pi/2}\csc\left(x+\frac{\pi}{4}\right)\mathrm{d}x = \frac{1}{2\sqrt{2}}\left[\ln\left|\csc\left(x+\frac{\pi}{4}\right)
  - \cot\left(x+\frac{\pi}{4}\right)\right|\right]_0^{\pi/2} = \frac{1}{\sqrt{2}}\ln(1+\sqrt{2})

  $$


  故积分为 $\frac{1}{\sqrt{2}}\ln(1+\sqrt{2})$．'
