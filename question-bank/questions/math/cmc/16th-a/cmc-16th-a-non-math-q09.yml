stem: '（本题 14 分）设 $f(x)$ 是 $(-\infty,+\infty)$ 上具有连续导数的非负函数，且存在 $M > 0$ 使得对任意的 $x,y\in(-\infty,+\infty)$，有 $|f''(x) - f''(y)|
  \leqslant M|x-y|$．

  证明：对于任意实数 $x$，恒有 $(f''(x))^2 \leqslant 2Mf(x)$．'
reference_answer: 详见参考解答（通过泰勒积分展开余项估计与极值参数选取法证明）
solution: 对任意非零实数 $h$：$0 \leqslant f(x+h) = f(x) + \int_0^h f'(x+t)\mathrm{d}t = f(x) + f'(x)h + \int_0^h (f'(x+t) - f'(x))\mathrm{d}t
  \quad (得 6 分)$取 $h$ 使 $h f'(x) \leqslant 0$，则：$-f'(x)h \leqslant f(x) + \int_0^h |f'(x+t)-f'(x)|\mathrm{d}t \leqslant f(x)
  + M\frac{h^2}{2}$即 $|f'(x)| \leqslant \frac{f(x)}{|h|} + \frac{M|h|}{2}$（得 12 分）．当 $f(x)=0$ 时显然 $f'(x)=0$；当 $f(x)>0$ 时，取最佳步长
  $|h| = \sqrt{\frac{2f(x)}{M}}$，代入得 $|f'(x)| \leqslant \sqrt{2Mf(x)}$，两边平方即证得 $(f'(x))^2 \leqslant 2Mf(x)$（满分 14 分）．
