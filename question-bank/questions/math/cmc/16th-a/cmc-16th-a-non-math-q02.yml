choice_order: fixed
stem: '设 $D: x^2 + y^2 \leqslant r^2$，其中 $r > 0$，则 $\lim_{r\to 0^+}\frac{\iint_D (\mathrm{e}^{x^2+y^2}-1)\mathrm{d}x\mathrm{d}y}{r^4}
  =$ ______．'
reference_answer: $\frac{\pi}{2}$
solution: 利用极坐标变换 $x = \rho\cos\theta, y = \rho\sin\theta$：$\iint_D (\mathrm{e}^{x^2+y^2}-1)\mathrm{d}x\mathrm{d}y = \int_0^{2\pi}\mathrm{d}\theta\int_0^r
  (\mathrm{e}^{\rho^2}-1)\rho\mathrm{d}\rho = \pi(\mathrm{e}^{r^2} - 1 - r^2)$当 $r\to 0^+$ 时，$\mathrm{e}^{r^2} - 1 - r^2 =
  \frac{r^4}{2} + o(r^4)$，故原极限为 $\frac{\pi}{2}$．
