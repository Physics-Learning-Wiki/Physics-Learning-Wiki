stem: （本题 14 分）求微分方程 $(x^3 - y^2)\mathrm{d}x + (x^2y + xy)\mathrm{d}y = 0$ 的通解．
reference_answer: $\left(\frac{1+x}{x}\right)^2 y^2 + (1+x)^2 = C$ 或 $(1+x)\sqrt{x^2+y^2} = Cx$
solution: '解法一（降次线性化）：令 $u = y^2$，方程化为：$\frac{\mathrm{d}u}{\mathrm{d}x} = \frac{2u}{x(1+x)} - \frac{2x^2}{x+1} \quad (得 6
  分)$这是一阶线性非齐次方程，通解为：$\left(\frac{1+x}{x}\right)^2 u + (1+x)^2 = C \implies \left(\frac{1+x}{x}\right)^2 y^2 + (1+x)^2 = C
  \quad (满分 14 分)$


  解法二（全微分凑微分法）：原方程改写为 $x\mathrm{d}x + y\mathrm{d}y + y\frac{x\mathrm{d}y - y\mathrm{d}x}{x^2} = 0$，即 $\frac{1}{2}\mathrm{d}(x^2+y^2)
  + y\mathrm{d}\left(\frac{y}{x}\right) = 0$（得 6 分）．两边同除以 $\sqrt{x^2+y^2}$ 积分得 $(1+x)\sqrt{x^2+y^2} = Cx$（满分 14 分）．'
