stem: '直线 $L: \frac{x-1}{1} = \frac{y}{1} = \frac{z-1}{-1}$ 在平面 $\pi: x - y + 2z -
  1 = 0$ 上的投影直线 $L_0$ 的单位方向向量为 ______．'
reference_answer: $\pm\left(-\frac{4}{\sqrt{21}}, -\frac{2}{\sqrt{21}}, \frac{1}{\sqrt{21}}\right)$
solution: 直线 $L$ 的一般式方程为 $x - y - 1 = 0, y + z - 1 = 0$．过 $L$ 的平面束方程为 $x - y - 1 +
  \lambda(y + z - 1) = 0$，即 $x + (\lambda-1)y + \lambda z - 1 - \lambda = 0$．平面束法向量为
  $(1, \lambda-1, \lambda)$．此法向量与平面 $\pi$ 法向量 $(1,-1,2)$ 垂直：$1 - (\lambda-1) + 2\lambda
  = 0 \implies \lambda = -2$．过 $L$ 与 $\pi$ 垂直的平面为 $x - 3y - 2z + 1 = 0$．两平面交线方向向量为
  $(1,-3,-2)\times(1,-1,2) = (-8,-4,2) \parallel (-4,-2,1)$．单位化得 $\pm\left(-\frac{4}{\sqrt{21}},
  -\frac{2}{\sqrt{21}}, \frac{1}{\sqrt{21}}\right)$（两符号任选其一均正确）．
