stem: 设 $L$ 为圆周 $x^2+y^2=9$，取逆时针方向，则第二类曲线积分 $\int_L \frac{-y}{4x^2+y^2}\mathrm{d}x + \frac{x}{4x^2+y^2}\mathrm{d}y =$ ______．
reference_answer: $\pi$
solution: '记 $P = \frac{-y}{4x^2+y^2}, Q = \frac{x}{4x^2+y^2}$．易知在原点外 $Q_x - P_y \equiv 0$．引入顺时针方向的辅助椭圆 $L_1: 4x^2+y^2=4$，由格林公式：$\int_{L+L_1}
  P\mathrm{d}x + Q\mathrm{d}y = 0 \implies \int_L P\mathrm{d}x + Q\mathrm{d}y = \frac{1}{4}\int_{-L_1} (-y\mathrm{d}x + x\mathrm{d}y)
  = \frac{1}{4}\iint_{4x^2+y^2\leqslant 4} 2\mathrm{d}x\mathrm{d}y = \frac{1}{2}\sigma(D) = \pi$其中椭圆面积 $\sigma(D) = \pi \times
  1 \times 2 = 2\pi$．故积分为 $\pi$．'
