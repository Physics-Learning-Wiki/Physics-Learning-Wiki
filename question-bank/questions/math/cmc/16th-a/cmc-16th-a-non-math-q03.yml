stem: 已知函数 $z = f(xy, \mathrm{e}^{x+y})$，且 $f(x,y)$ 具有二阶连续偏导数，则 $\frac{\partial^2
  z}{\partial x\partial y} =$ ______．
reference_answer: $xy f_{11} + (x+y)\mathrm{e}^{x+y}f_{12} + \mathrm{e}^{2(x+y)}f_{22}
  + f_1 + \mathrm{e}^{x+y}f_2$
solution: 求一阶偏导数：$z_x = y f_1 + \mathrm{e}^{x+y}f_2$．再对 $y$ 求偏导：$z_{xy} = (x f_{11}
  + \mathrm{e}^{x+y}f_{12})y + f_1 + (x f_{21} + \mathrm{e}^{x+y}f_{22})\mathrm{e}^{x+y}
  + \mathrm{e}^{x+y}f_2 = xy f_{11} + (x+y)\mathrm{e}^{x+y}f_{12} + \mathrm{e}^{2(x+y)}f_{22}
  + f_1 + \mathrm{e}^{x+y}f_2$式中利用了二阶混合偏导数的连续对称性 $f_{12} = f_{21}$．
