stem: $\int_0^1 \ln(1+x^2)\mathrm{d}x =$ ______．
reference_answer: $\ln 2 - 2 + \frac{\pi}{2}$
solution: 利用分部积分法：$\int_0^1 \ln(1+x^2)\mathrm{d}x = \left.x\ln(1+x^2)\right|_0^1 - \int_0^1 \frac{2x^2}{1+x^2}\mathrm{d}x
  = \ln 2 - 2\int_0^1 \left(1 - \frac{1}{1+x^2}\right)\mathrm{d}x = \ln 2 - 2 + \frac{\pi}{2}$故原式等于 $\ln 2 - 2 + \frac{\pi}{2}$．
