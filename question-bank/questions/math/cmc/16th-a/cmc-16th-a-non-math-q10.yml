stem: （本题 14 分）证明：级数 $\sum_{n=1}^\infty \sum_{k=1}^\infty \frac{(-1)^{[\sqrt{n}]}}{n^2+k^2}$ 收敛，其中 $[x]$ 表示不超过 $x$ 的最大整数．
reference_answer: 详见参考解答（通过内层定积分逼近放缩与分组交错级数判定法证明）
solution: 对于任意固定的 $n$，利用积分判别估计：$\frac{1}{n}\left(\arctan\frac{N+1}{n} - \arctan\frac{1}{n}\right) \leqslant \sum_{k=1}^N \frac{1}{k^2+n^2}
  \leqslant \frac{1}{n}\arctan\frac{N}{n}$令 $N\to\infty$，得 $\left|\sum_{k=1}^\infty \frac{1}{k^2+n^2} - \frac{\pi}{2n}\right|
  \leqslant \frac{1}{n}\arctan\frac{1}{n}$（得 4 分）．因为 $\sum_{n=1}^\infty \frac{1}{n}\arctan\frac{1}{n} \leqslant \sum_{n=1}^\infty
  \frac{1}{n^2} < \infty$，故差值级数绝对收敛，原级数与 $\frac{\pi}{2}\sum_{n=1}^\infty \frac{(-1)^{[\sqrt{n}]}}{n}$ 同敛散（得 8 分）．设部分和 $S_{n^2}
  = \sum_{m=1}^{n-1}(-1)^m C_m + \frac{(-1)^n}{n^2}$，其中 $C_m = \sum_{k=m^2}^{(m+1)^2-1}\frac{1}{k}$．易证 $C_m$ 单调递减趋于 0，由莱布尼茨判别法知交错级数收敛，进而证得原级数收敛（满分
  14 分）．
