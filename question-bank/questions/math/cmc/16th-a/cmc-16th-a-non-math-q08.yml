stem: （本题 14 分）求曲面积分 $I = \iint_S (x^2-x)\mathrm{d}y\mathrm{d}z + (y^2-y)\mathrm{d}z\mathrm{d}x
  + (z^2-z)\mathrm{d}x\mathrm{d}y$，其中 $S$ 是上半球面 $x^2+y^2+z^2 = R^2$ ($z\geqslant 0$)
  的上侧．
reference_answer: $\frac{\pi R^4}{2} - 2\pi R^3$
solution: '补底面 $\Sigma: z = 0, x^2+y^2\leqslant R^2$ 取下侧，由高斯公式：$\iint_{S+\Sigma} =
  \iiint_\Omega (2x+2y+2z-3)\mathrm{d}x\mathrm{d}y\mathrm{d}z \quad (得 4 分)$在底面 $\Sigma$
  上 $z=0,\mathrm{d}x\mathrm{d}y = -\mathrm{d}x\mathrm{d}y$，其余两项为 $0$，故 $\iint_\Sigma
  (z^2-z)\mathrm{d}x\mathrm{d}y = 0$．因此 $I = \iiint_\Omega (2(x+y+z)-3)\mathrm{d}x\mathrm{d}y\mathrm{d}z$（得
  8 分）．由对称性 $\iiint_\Omega x = \iiint_\Omega y = 0$．球坐标变换：$I = \int_0^{2\pi}\mathrm{d}\theta\int_0^{\pi/2}\mathrm{d}\varphi\int_0^R
  (2r\cos\varphi - 3)r^2\sin\varphi\mathrm{d}r = \frac{\pi R^4}{2} - 2\pi R^3 \quad
  (满分 14 分)$'
