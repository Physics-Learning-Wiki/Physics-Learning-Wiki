stem: '（本题 14 分）设函数 $f(x) = \begin{cases} \frac{1}{\ln(1+x)} - \frac{1}{x}, & 0 < x \leqslant 1, \\ k, & x = 0. \end{cases}$

  (1) 求常数 $k$ 的值，使得 $f(x)$ 在区间 $[0,1]$ 上连续；

  (2) 对 (1) 中的 $k$ 值，求函数 $f(x)$ 的最小值 $\lambda$ 与最大值 $\mu$．'
reference_answer: (1) $k = \frac{1}{2}$；(2) 最小值 $\lambda = \frac{1}{\ln 2} - 1$，最大值 $\mu = \frac{1}{2}$
solution: '(1) 由洛必达法则：$\lim_{x\to 0^+} f(x) = \lim_{x\to 0^+}\frac{x - \ln(1+x)}{x\ln(1+x)} = \lim_{x\to 0^+}\frac{x - \ln(1+x)}{x^2}
  = \lim_{x\to 0^+}\frac{1 - \frac{1}{1+x}}{2x} = \frac{1}{2}$令 $k = \frac{1}{2}$，则 $\lim_{x\to 0^+} f(x) = f(0)$，所以 $f(x)$
  在 $[0,1]$ 上连续（得 4 分）．

  (2) 在 $(0,1)$ 内可导：$f''(x) = -\frac{1}{(1+x)\ln^2(1+x)} + \frac{1}{x^2} = \frac{g(x)}{x^2(1+x)\ln^2(1+x)}$其中 $g(x) = (1+x)\ln^2(1+x)
  - x^2$（得 8 分）．求导 $g''(x) = \ln^2(1+x) + 2\ln(1+x) - 2x$，$g''''(x) = \frac{2\ln(1+x) - 2x}{1+x} < 0$．由 $g''(0)=0$ 知 $g''(x)<0$，再由
  $g(0)=0$ 知 $g(x)<0$．因此 $f''(x)<0$，$f(x)$ 在 $[0,1]$ 上单调递减．故最小值 $\lambda = f(1) = \frac{1}{\ln 2} - 1$，最大值 $\mu = f(0) = \frac{1}{2}$（满分
  14 分）．'
