stem: 设 $y = f(x)$ 是由方程 $\arctan\frac{x}{y} = \ln\sqrt{x^2+y^2} - \frac{1}{2}\ln 2 + \frac{\pi}{4}$ 确定的隐函数，且满足 $f(1)=1$，则曲线
  $y = f(x)$ 在点 $(1, 1)$ 处的切线方程为 ______．
reference_answer: $y = 1$
solution: '对所给方程两端关于 $x$ 求导：


  $$

  \frac{1}{1 + (x/y)^2}\cdot\frac{y - x y''}{y^2} = \frac{x + y y''}{x^2+y^2}

  $$


  整理得：


  $$(x+y)y'' = y - x$$


  代入点 $(1, 1)$，得 $2y''(1) = 0 \implies y''(1) = 0$．


  因此曲线在点 $(1, 1)$ 处的切线方程为 $y - 1 = 0(x - 1)$，即 $y = 1$．'
