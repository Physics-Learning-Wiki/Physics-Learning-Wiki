stem: 设函数 $f(x) = (x+1)^n e^{-x^2}$，则 $f^{(n)}(-1) =$ ______．
reference_answer: $\frac{n!}{e}$
solution: '利用 Leibniz 求导法则：


  $$

  f^{(n)}(x) = n! e^{-x^2} + \sum_{k=0}^{n-1} C_n^k [(x+1)^n]^{(k)} (e^{-x^2})^{(n-k)}

  $$


  当 $x = -1$ 时，对任意 $k < n$，导数 $[(x+1)^n]^{(k)}$ 均包含因子 $(x+1)^{n-k}$ 而取值为 0．


  因此：


  $$

  f^{(n)}(-1) = n! e^{-(-1)^2} = \frac{n!}{e}

  $$


  故导数值为 $\frac{n!}{e}$．'
