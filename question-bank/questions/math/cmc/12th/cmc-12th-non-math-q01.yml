stem: 极限 $\lim_{x\to 0}\frac{(x-\sin x)e^{-x^2}}{\sqrt{1-x^3}-1} =$ ______．
reference_answer: $-\frac{1}{3}$
solution: '利用等价无穷小与 Taylor 展开：当 $x\to 0$ 时，$\sqrt{1-x^3}-1 \sim -\frac{1}{2}x^3$，$x-\sin
  x \sim \frac{1}{6}x^3$，$e^{-x^2}\to 1$．


  因此：


  $$

  \lim_{x\to 0}\frac{(x-\sin x)e^{-x^2}}{\sqrt{1-x^3}-1} = \lim_{x\to 0}\frac{\frac{1}{6}x^3}{-\frac{1}{2}x^3}
  = -\frac{1}{3}

  $$


  故极限为 $-\frac{1}{3}$．'
