stem: 设 $f(x), g(x)$ 在 $x=0$ 的某一邻域 $U$ 内有定义，对任意 $x\in U$，$f(x)\neq g(x)$，且 $\lim_{x\to 0} f(x) = \lim_{x\to 0} g(x) = a >
  0$，则 $\lim_{x\to 0}\frac{[f(x)]^{g(x)} - [g(x)]^{g(x)}}{f(x)-g(x)} =$ ______．
reference_answer: $a^a$
solution: '由保号性，在去心邻域内 $f(x) > 0, g(x) > 0$．提取因子改写分子：


  $$

  [f(x)]^{g(x)} - [g(x)]^{g(x)} = [g(x)]^{g(x)}\left[\left(\frac{f(x)}{g(x)}\right)^{g(x)} - 1\right] = [g(x)]^{g(x)}\left[e^{g(x)\ln\frac{f(x)}{g(x)}}
  - 1\right]

  $$


  利用等价无穷小 $e^t - 1 \sim t$ 及 $\ln(1+u) \sim u$：


  $$

  e^{g(x)\ln\left(1 + \frac{f(x)-g(x)}{g(x)}\right)} - 1 \sim g(x)\cdot\frac{f(x)-g(x)}{g(x)} = f(x)-g(x)

  $$


  因此：


  $$

  \lim_{x\to 0}\frac{[f(x)]^{g(x)} - [g(x)]^{g(x)}}{f(x)-g(x)} = \lim_{x\to 0}[g(x)]^{g(x)} = a^a

  $$


  故极限为 $a^a$．'
