stem: 设数列 $\{a_n\}$ 满足：$a_1=1$，且 $a_{n+1} = \frac{a_n}{(n+1)(a_n+1)}$ ($n\ge 1$)．求极限
  $\lim_{n\to\infty} n! a_n$．
reference_answer: $\frac{1}{e}$
solution: '利用归纳法易知 $a_n > 0$ ($n\ge 1$)．考虑倒数关系：


  $$

  \frac{1}{a_{n+1}} = (n+1)\left(1 + \frac{1}{a_n}\right) = (n+1) + (n+1)\frac{1}{a_n}
  = (n+1) + (n+1)n + (n+1)n\frac{1}{a_{n-1}}

  $$


  递推可得：


  $$

  \frac{1}{a_{n+1}} = (n+1)!\left(\sum_{k=1}^n \frac{1}{k!} + \frac{1}{a_1}\right)
  = (n+1)!\sum_{k=0}^n \frac{1}{k!}

  $$


  因此：


  $$

  n! a_n = \frac{1}{\sum_{k=0}^{n-1}\frac{1}{k!}}

  $$


  因为 $\lim_{n\to\infty}\sum_{k=0}^{n-1}\frac{1}{k!} = e$，所以 $\lim_{n\to\infty} n!
  a_n = \frac{1}{e}$．'
