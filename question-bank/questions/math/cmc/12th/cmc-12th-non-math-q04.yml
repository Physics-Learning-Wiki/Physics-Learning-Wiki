stem: 已知 $\int_0^{+\infty}\frac{\sin x}{x}\mathrm{d}x = \frac{\pi}{2}$，则 $\int_0^{+\infty}\int_0^{+\infty}\frac{\sin x\sin(x+y)}{x(x+y)}\mathrm{d}x\mathrm{d}y
  =$ ______．
reference_answer: $\frac{\pi^2}{8}$
solution: '令 $u = x+y$，内层对 $y$ 积分转化为对 $u$ 积分：


  $$

  I = \int_0^{+\infty}\frac{\sin x}{x}\mathrm{d}x \int_x^{+\infty}\frac{\sin u}{u}\mathrm{d}u

  $$


  引入变限积分函数 $F(x) = \int_0^x \frac{\sin u}{u}\mathrm{d}u$，则 $F''(x) = \frac{\sin x}{x}$ 且 $\lim_{x\to+\infty}F(x) = \frac{\pi}{2}$．


  积分化为：


  $$

  I = \int_0^{+\infty}\left(\frac{\pi}{2} - F(x)\right)F''(x)\mathrm{d}x = \left[\frac{\pi}{2}F(x) - \frac{1}{2}F^2(x)\right]_0^{+\infty}
  = \frac{\pi^2}{4} - \frac{\pi^2}{8} = \frac{\pi^2}{8}

  $$


  故积分为 $\frac{\pi^2}{8}$．'
