stem: 设 $f(x, y)$ 在区域 $D$ 内可微，且 $\left(\frac{\partial f}{\partial x}\right)^2 + \left(\frac{\partial
  f}{\partial y}\right)^2 \le M^2$，$A(x_1, y_1), B(x_2, y_2)$ 是 $D$ 内两点，线段 $AB$ 包含在
  $D$ 内．证明：$|f(x_1, y_1) - f(x_2, y_2)| \le M |AB|$，其中 $|AB|$ 表示线段 $AB$ 的长度．
reference_answer: 见推导步骤
solution: '在线段 $AB$ 上作辅助一元函数：


  $$\varphi(t) = f(x_1 + t(x_2-x_1), y_1 + t(y_2-y_1)) \quad (0 \le t \le 1)$$


  根据多元复合函数求导法则，$\varphi(t)$ 在 $[0, 1]$ 上可导：


  $$\varphi''(t) = \frac{\partial f}{\partial x}(x_2-x_1) + \frac{\partial f}{\partial
  y}(y_2-y_1)$$


  由 Lagrange 中值定理，存在 $c \in (0, 1)$ 使得 $\varphi(1) - \varphi(0) = \varphi''(c)$．


  由 Cauchy–Schwarz 不等式：


  $$|f(x_2, y_2) - f(x_1, y_1)| = |\varphi''(c)| \le \sqrt{\left(\frac{\partial f}{\partial
  x}\right)^2 + \left(\frac{\partial f}{\partial y}\right)^2}\sqrt{(x_2-x_1)^2 + (y_2-y_1)^2}
  \le M |AB|$$


  不等式得证．'
