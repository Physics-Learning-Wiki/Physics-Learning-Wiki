stem: $\int \frac{\ln(x+\sqrt{1+x^2})}{(1+x^2)^{3/2}}\mathrm{d}x =$ ______．
reference_answer: $\frac{x}{\sqrt{1+x^2}}\ln(x+\sqrt{1+x^2}) - \frac{1}{2}\ln(1+x^2)
  + C$
solution: '注意到 $\frac{1}{(1+x^2)^{3/2}}\mathrm{d}x = \mathrm{d}\left(\frac{x}{\sqrt{1+x^2}}\right)$．应用分部积分法：


  $$\int \ln(x+\sqrt{1+x^2})\mathrm{d}\left(\frac{x}{\sqrt{1+x^2}}\right) = \frac{x}{\sqrt{1+x^2}}\ln(x+\sqrt{1+x^2})
  - \int \frac{x}{\sqrt{1+x^2}}\cdot\frac{1}{\sqrt{1+x^2}}\mathrm{d}x$$


  $$= \frac{x}{\sqrt{1+x^2}}\ln(x+\sqrt{1+x^2}) - \int \frac{x}{1+x^2}\mathrm{d}x
  = \frac{x}{\sqrt{1+x^2}}\ln(x+\sqrt{1+x^2}) - \frac{1}{2}\ln(1+x^2) + C$$'
