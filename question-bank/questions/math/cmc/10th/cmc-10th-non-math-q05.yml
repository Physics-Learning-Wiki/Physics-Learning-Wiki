stem: 设函数 $f(t)$ 在 $t\neq 0$ 时一阶连续可导，且 $f(1)=0$，求函数 $f(x^2-y^2)$，使得曲线积分 $\int_L [y(2-f(x^2-y^2))\mathrm{d}x + x f(x^2-y^2)\mathrm{d}y]$
  与路径无关，其中 $L$ 为任一不与直线 $y=\pm x$ 相交的分段光滑闭曲线．
reference_answer: $f(x^2-y^2) = 1 - \frac{1}{x^2-y^2}$
solution: '设 $P(x, y) = y(2-f(x^2-y^2)), Q(x, y) = x f(x^2-y^2)$．积分与路径无关的充要条件为 $\frac{\partial Q}{\partial x} = \frac{\partial
  P}{\partial y}$：


  $$\frac{\partial Q}{\partial x} = f(x^2-y^2) + 2x^2 f''(x^2-y^2)$$


  $$\frac{\partial P}{\partial y} = 2 - f(x^2-y^2) + 2y^2 f''(x^2-y^2)$$


  两端相等整理得：


  $$(x^2-y^2)f''(x^2-y^2) + f(x^2-y^2) = 1$$


  记 $t = x^2-y^2$，方程化为 $t f''(t) + f(t) = 1 \implies (t f(t))'' = 1$．


  积分得 $t f(t) = t + C$．由 $f(1) = 0$ 得 $C = -1$．


  故 $f(t) = 1 - \frac{1}{t}$，即 $f(x^2-y^2) = 1 - \frac{1}{x^2-y^2}$．'
