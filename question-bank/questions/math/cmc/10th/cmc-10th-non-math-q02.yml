choice_order: fixed
stem: 若曲线 $y=y(x)$ 由 $\begin{cases}x = t+\cos t,\\ e^y + ty + \sin t = 1\end{cases}$ 确定，则此曲线在 $t=0$ 对应点处的切线方程为 ______．
reference_answer: $x+y=1$
solution: '当 $t = 0$ 时，$x = 1$，$e^y = 1 \implies y = 0$．


  分别关于 $t$ 求导：


  $$\frac{\mathrm{d}x}{\mathrm{d}t} = 1 - \sin t, \quad \left.\frac{\mathrm{d}x}{\mathrm{d}t}\right|_{t=0} = 1$$


  $$e^y \frac{\mathrm{d}y}{\mathrm{d}t} + y + t\frac{\mathrm{d}y}{\mathrm{d}t} + \cos t = 0, \quad \left.\frac{\mathrm{d}y}{\mathrm{d}t}\right|_{t=0}
  = -1$$


  切线斜率为 $\frac{\mathrm{d}y}{\mathrm{d}x} = \frac{-1}{1} = -1$．


  切线方程为 $y - 0 = -(x - 1)$，即 $x+y=1$．'
