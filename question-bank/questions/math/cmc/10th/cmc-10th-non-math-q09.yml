stem: 证明：对于连续函数 $f(x) > 0$，有 $\ln \int_0^1 f(x)\mathrm{d}x \ge \int_0^1 \ln f(x)\mathrm{d}x$．
reference_answer: 见推导步骤
solution: '利用定积分的 Riemann 和与离散均值不等式：


  将 $[0, 1]$ 进行 $n$ 等分，取分点 $x_k \in [\frac{k-1}{n}, \frac{k}{n}]$．由算术–几何均值不等式：


  $$\sqrt[n]{\prod_{k=1}^n f(x_k)} \le \frac{1}{n}\sum_{k=1}^n f(x_k)$$


  两边取自然对数：


  $$\frac{1}{n}\sum_{k=1}^n \ln f(x_k) \le \ln\left(\frac{1}{n}\sum_{k=1}^n f(x_k)\right)$$


  由于 $f(x) > 0$ 连续，$\ln x$ 亦连续，令 $n\to+\infty$ 取极限：


  $$\int_0^1 \ln f(x)\mathrm{d}x \le \ln \int_0^1 f(x)\mathrm{d}x$$


  即得所证不等式．'
