stem: '设 $f(x)$ 在区间 $[0, 1]$ 上连续，且 $1 \le f(x) \le 3$．证明：


  $$1 \le \int_0^1 f(x)\mathrm{d}x \int_0^1 \frac{1}{f(x)}\mathrm{d}x \le \frac{4}{3}$$'
reference_answer: 见推导步骤
solution: '由 Cauchy–Schwarz 不等式：


  $$\int_0^1 f(x)\mathrm{d}x \int_0^1 \frac{1}{f(x)}\mathrm{d}x \ge \left(\int_0^1
  \sqrt{f(x)}\cdot\frac{1}{\sqrt{f(x)}}\mathrm{d}x\right)^2 = 1^2 = 1$$


  左侧不等式得证．


  对于右侧不等式，由于 $1 \le f(x) \le 3$，有 $(f(x)-1)(f(x)-3) \le 0$．两边除以 $f(x)$：


  $$f(x) + \frac{3}{f(x)} \le 4$$


  积分得 $\int_0^1 f(x)\mathrm{d}x + 3\int_0^1 \frac{1}{f(x)}\mathrm{d}x \le 4$．


  由均值不等式 $u v \le \frac{1}{4}(u+v)^2$：


  $$3\int_0^1 f(x)\mathrm{d}x \int_0^1 \frac{1}{f(x)}\mathrm{d}x = \int_0^1 f(x)\mathrm{d}x
  \cdot 3\int_0^1 \frac{1}{f(x)}\mathrm{d}x \le \frac{1}{4}\left(\int_0^1 f(x)\mathrm{d}x
  + 3\int_0^1 \frac{1}{f(x)}\mathrm{d}x\right)^2 \le 4$$


  两端同除以 3 即得 $\int_0^1 f(x)\mathrm{d}x \int_0^1 \frac{1}{f(x)}\mathrm{d}x \le \frac{4}{3}$．'
