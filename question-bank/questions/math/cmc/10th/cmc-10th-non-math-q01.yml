stem: 设 $\alpha \in (0, 1)$，则 $\lim_{n\to+\infty}((n+1)^\alpha - n^\alpha) =$ ______．
reference_answer: $0$
solution: '利用 Lagrange 中值定理，$(n+1)^\alpha - n^\alpha = \alpha \xi^{\alpha-1}$，其中 $n < \xi < n+1$．


  因为 $\alpha \in (0, 1)$，$\alpha - 1 < 0$．所以：


  $$0 < (n+1)^\alpha - n^\alpha < \alpha n^{\alpha-1} = \frac{\alpha}{n^{1-\alpha}}$$


  当 $n\to+\infty$ 时，因为 $1-\alpha > 0$，$\frac{\alpha}{n^{1-\alpha}} \to 0$．由夹逼准则得极限为 $0$．'
