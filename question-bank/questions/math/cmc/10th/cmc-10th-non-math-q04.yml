stem: $\lim_{x\to 0}\frac{1-\cos x\sqrt{\cos 2x}\sqrt[3]{\cos 3x}}{x^2} =$ ______．
reference_answer: $3$
solution: '拆分分子：


  $$1 - \cos x\sqrt{\cos 2x}\sqrt[3]{\cos 3x} = (1-\cos x) + \cos x(1-\sqrt{\cos 2x}) + \cos x\sqrt{\cos 2x}(1-\sqrt[3]{\cos
  3x})$$


  分别计算各部分极限：


  $$\lim_{x\to 0}\frac{1-\cos x}{x^2} = \frac{1}{2}$$


  $$\lim_{x\to 0}\frac{1-\sqrt{\cos 2x}}{x^2} = \lim_{x\to 0}\frac{\frac{1}{2}(1-\cos 2x)}{x^2} = 1$$


  $$\lim_{x\to 0}\frac{1-\sqrt[3]{\cos 3x}}{x^2} = \lim_{x\to 0}\frac{\frac{1}{3}(1-\cos 3x)}{x^2} = \frac{3}{2}$$


  三项相加得极限为 $\frac{1}{2} + 1 + \frac{3}{2} = 3$．'
