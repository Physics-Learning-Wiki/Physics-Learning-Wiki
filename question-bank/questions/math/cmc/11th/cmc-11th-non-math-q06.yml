stem: 计算三重积分 $\iiint_\Omega \frac{xyz}{x^2+y^2}\mathrm{d}x\mathrm{d}y\mathrm{d}z$，其中
  $\Omega$ 是由曲面 $(x^2+y^2+z^2)^2 = 2xy$ 围成的区域在第一卦限部分．
reference_answer: $\frac{1}{72}$
solution: '采用球面坐标系：$x = \rho\sin\varphi\cos\theta, y = \rho\sin\varphi\sin\theta,
  z = \rho\cos\varphi$．


  边界方程化为 $\rho^4 = 2\rho^2 \sin^2\varphi\sin\theta\cos\theta \implies \rho^2 = \sin
  2\theta \sin^2\varphi$．


  积分化为：


  $$I = \int_0^{\pi/2}\mathrm{d}\theta \int_0^{\pi/2}\mathrm{d}\varphi \int_0^{\sqrt{\sin
  2\theta}\sin\varphi} \frac{\rho^3\sin^2\varphi\cos\varphi\sin\theta\cos\theta}{\rho^2\sin^2\varphi}\rho^2\sin\varphi\mathrm{d}\rho$$


  $$= \int_0^{\pi/2}\sin\theta\cos\theta\mathrm{d}\theta \int_0^{\pi/2}\sin\varphi\cos\varphi\mathrm{d}\varphi
  \int_0^{\sqrt{\sin 2\theta}\sin\varphi} \rho^3\mathrm{d}\rho$$


  逐层计算：


  $$\int_0^{\sqrt{\sin 2\theta}\sin\varphi} \rho^3\mathrm{d}\rho = \frac{1}{4}\sin^2
  2\theta \sin^4\varphi$$


  $$\int_0^{\pi/2}\sin^5\varphi\cos\varphi\mathrm{d}\varphi = \frac{1}{6}$$


  $$\int_0^{\pi/2}\frac{1}{2}\sin 2\theta \cdot \frac{1}{4}\sin^2 2\theta\mathrm{d}\theta
  = \frac{1}{8}\int_0^{\pi/2}\sin^3 2\theta\mathrm{d}\theta = \frac{1}{16}\int_0^\pi
  \sin^3 t\mathrm{d}t = \frac{1}{12}$$


  因此 $I = \frac{1}{6}\times\frac{1}{12} = \frac{1}{72}$．'
