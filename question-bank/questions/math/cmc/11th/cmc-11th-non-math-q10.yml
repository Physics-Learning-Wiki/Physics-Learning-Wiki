stem: 设函数 $f(x)$ 在 $[0, +\infty)$ 上具有连续导数，满足 $3[3+f^2(x)]f'(x) = 2[1+f^2(x)]^2 e^{-x^2}$，且
  $f(0)\le 1$．证明：存在常数 $M > 0$，使得 $x\in [0, +\infty)$ 时，恒有 $|f(x)| \le M$．
reference_answer: 见推导步骤
solution: '由已知条件，由于 $e^{-x^2} > 0$ 及平方式非负，$f''(x) > 0$，故 $f(x)$ 在 $[0, +\infty)$ 上严格单调递增．


  因此 $\lim_{x\to+\infty} f(x) = L$（有限或 $+\infty$）．


  分离变量积分：


  $$\frac{3+y^2}{(1+y^2)^2}\mathrm{d}y = \frac{2}{3}e^{-x^2}\mathrm{d}x$$


  左边积分得：


  $$\int \frac{3+y^2}{(1+y^2)^2}\mathrm{d}y = \frac{y}{1+y^2} + 2\arctan y$$


  从而有：


  $$\frac{f(x)}{1+f^2(x)} + 2\arctan f(x) = \frac{2}{3}\int_0^x e^{-t^2}\mathrm{d}t
  + C$$


  其中 $C = \frac{f(0)}{1+f^2(0)} + 2\arctan f(0)$．


  若 $L = +\infty$，令 $x\to+\infty$：左端趋于 $\pi$，右端为 $\frac{\sqrt{\pi}}{3} + C$，解得 $C
  = \pi - \frac{\sqrt{\pi}}{3}$．


  另一方面，定义函数 $g(u) = \frac{u}{1+u^2} + 2\arctan u$ 在实数轴上严格单增．由 $f(0)\le 1$ 得 $C \le
  g(1) = \frac{1+\pi}{2}$．


  但 $\pi - \frac{\sqrt{\pi}}{3} > \frac{1+\pi}{2}$，产生矛盾！


  因此 $L < +\infty$，取 $M = \max\{|f(0)|, L\}$，即有 $|f(x)| \le M$ 对所有 $x\in [0, +\infty)$
  恒成立．'
