stem: 计算积分 $I = \int_0^{2\pi}\mathrm{d}\phi \int_0^\pi e^{\sin\theta(\cos\phi-\sin\phi)}\sin\theta\mathrm{d}\theta$．
reference_answer: $\sqrt{2}\pi(e^{\sqrt{2}} - e^{-\sqrt{2}})$
solution: '设单位球面 $\Sigma: x^2+y^2+z^2=1$，面积微元 $\mathrm{d}S = \sin\theta\mathrm{d}\theta\mathrm{d}\phi$．积分即为第一型曲面积分：


  $$I = \iint_\Sigma e^{x-y}\mathrm{d}S$$


  作旋转变换，设垂直于向量 $(1, -1, 0)$ 的截平面 $P_t: \frac{x-y}{\sqrt{2}} = t$（$-1 \le t \le 1$）．


  截面圆半径为 $r_t = \sqrt{1-t^2}$，球面环带面积为 $\mathrm{d}S = 2\pi r_t \frac{\mathrm{d}t}{\sqrt{1-t^2}} = 2\pi\mathrm{d}t$．


  在环带上 $x-y = \sqrt{2}t$ 为常数，积分转化为：


  $$I = \int_{-1}^1 e^{\sqrt{2}t} 2\pi\mathrm{d}t = \frac{2\pi}{\sqrt{2}}\left[e^{\sqrt{2}t}\right]_{-1}^1 = \sqrt{2}\pi(e^{\sqrt{2}}
  - e^{-\sqrt{2}})$$


  故积分为 $\sqrt{2}\pi(e^{\sqrt{2}} - e^{-\sqrt{2}})$．'
