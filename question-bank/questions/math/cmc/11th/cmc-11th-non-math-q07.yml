stem: 设 $f(x)$ 在 $[0, +\infty)$ 上可微，$f(0)=0$，且存在常数 $A > 0$，使得 $|f'(x)| \le A |f(x)|$ 在 $[0, +\infty)$ 上成立．试证明：在 $(0, +\infty)$
  上有 $f(x)=0$．
reference_answer: 见推导步骤
solution: '设 $x_0 \in \left[0, \frac{1}{2A}\right]$ 使得 $|f(x_0)| = \max_{x\in [0, 1/(2A)]} |f(x)|$．


  由 Lagrange 中值定理，存在 $\xi \in (0, x_0)$：


  $$|f(x_0)| = |f(x_0) - f(0)| = |f''(\xi)| x_0 \le A |f(\xi)| x_0 \le A |f(x_0)| \frac{1}{2A} = \frac{1}{2}|f(x_0)|$$


  因此 $|f(x_0)| \le \frac{1}{2}|f(x_0)| \implies |f(x_0)| = 0$．


  故在区间 $\left[0, \frac{1}{2A}\right]$ 上 $f(x) \equiv 0$．


  递推考虑区间 $\left[\frac{k-1}{2A}, \frac{k}{2A}\right]$ ($k=1, 2, \dots$)，同理以左端点为 0 重复上述放缩，可得对一切 $x \ge 0$ 均有 $f(x) = 0$．'
