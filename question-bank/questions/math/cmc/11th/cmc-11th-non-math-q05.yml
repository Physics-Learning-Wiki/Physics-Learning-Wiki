stem: 设 $a, b, c, \mu > 0$，曲面 $xyz = \mu$ 与曲面 $\frac{x^2}{a^2} + \frac{y^2}{b^2} + \frac{z^2}{c^2} = 1$ 相切，则 $\mu =$ ______．
reference_answer: $\frac{abc}{3\sqrt{3}}$
solution: '在切点 $(x, y, z)$ 处两曲面的法向量共线：


  $$(yz, xz, xy) = \lambda \left(\frac{2x}{a^2}, \frac{2y}{b^2}, \frac{2z}{c^2}\right)$$


  分别同乘 $x, y, z$：


  $$xyz = \mu = \frac{2\lambda x^2}{a^2} = \frac{2\lambda y^2}{b^2} = \frac{2\lambda z^2}{c^2}$$


  结合椭球面方程 $\frac{x^2}{a^2} + \frac{y^2}{b^2} + \frac{z^2}{c^2} = 1$，得：


  $$\frac{x^2}{a^2} = \frac{y^2}{b^2} = \frac{z^2}{c^2} = \frac{1}{3}$$


  因为 $x, y, z > 0$，有 $x = \frac{a}{\sqrt{3}}, y = \frac{b}{\sqrt{3}}, z = \frac{c}{\sqrt{3}}$．


  代入可得 $\mu = xyz = \frac{abc}{3\sqrt{3}}$．'
