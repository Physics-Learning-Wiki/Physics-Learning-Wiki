stem: 设隐函数 $y = y(x)$ 由方程 $y^2(x-y) = x^2$ 所确定，则 $\int \frac{\mathrm{d}x}{y^2} =$
  ______．
reference_answer: $\frac{3y}{x} - 2\ln\left|\frac{y}{x}\right| + C$
solution: '令 $y = tx$，代入原方程：


  $$t^2 x^2 (x - tx) = x^2 \implies t^2 x (1-t) = 1 \implies x = \frac{1}{t^2(1-t)}$$


  因此 $y = tx = \frac{1}{t(1-t)}$．求微分：


  $$\mathrm{d}x = \frac{3t-2}{t^3(1-t)^2}\mathrm{d}t$$


  代入被积式：


  $$\frac{\mathrm{d}x}{y^2} = \frac{\frac{3t-2}{t^3(1-t)^2}\mathrm{d}t}{\frac{1}{t^2(1-t)^2}}
  = \frac{3t-2}{t}\mathrm{d}t = \left(3 - \frac{2}{t}\right)\mathrm{d}t$$


  积分得 $3t - 2\ln|t| + C$．代回 $t = \frac{y}{x}$，即得 $\frac{3y}{x} - 2\ln\left|\frac{y}{x}\right|
  + C$．'
