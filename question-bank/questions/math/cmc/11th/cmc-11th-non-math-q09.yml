stem: 设 $f(x)$ 是仅有正实根的多项式函数，满足 $-\frac{f'(x)}{f(x)} = \sum_{n=0}^\infty c_n x^n$．试证：$c_n > 0$ ($n \ge 0$)，极限 $\lim_{n\to\infty}\frac{1}{\sqrt[n]{c_n}}$
  存在，且等于 $f(x)$ 的最小根．
reference_answer: 见推导步骤
solution: '设 $f(x)$ 的全部实根为 $0 < a_1 < a_2 < \dots < a_k$，重数依次为 $r_1, r_2, \dots, r_k$．


  因式分解得 $f(x) = A(x-a_1)^{r_1}\cdots(x-a_k)^{r_k}$．展开对数导数：


  $$-\frac{f''(x)}{f(x)} = \sum_{i=1}^k \frac{r_i}{a_i - x} = \sum_{i=1}^k \frac{r_i}{a_i}\sum_{n=0}^\infty \left(\frac{x}{a_i}\right)^n
  = \sum_{n=0}^\infty \left(\sum_{i=1}^k \frac{r_i}{a_i^{n+1}}\right)x^n$$


  由幂级数系数唯一性：


  $$c_n = \sum_{i=1}^k \frac{r_i}{a_i^{n+1}} > 0$$


  考虑系数比值：


  $$\lim_{n\to\infty}\frac{c_n}{c_{n+1}} = \lim_{n\to\infty}\frac{\frac{r_1}{a_1^{n+1}} + \dots + \frac{r_k}{a_k^{n+1}}}{\frac{r_1}{a_1^{n+2}}
  + \dots + \frac{r_k}{a_k^{n+2}}} = a_1 \lim_{n\to\infty}\frac{r_1 + \sum_{i=2}^k r_i (a_1/a_i)^{n+1}}{r_1 + \sum_{i=2}^k
  r_i (a_1/a_i)^{n+2}} = a_1$$


  由 Cauchy–Hadamard 定理：


  $$\lim_{n\to\infty}\frac{1}{\sqrt[n]{c_n}} = \lim_{n\to\infty}\frac{c_n}{c_{n+1}} = a_1$$


  即极限存在且等于 $f(x)$ 的最小正根 $a_1$．'
