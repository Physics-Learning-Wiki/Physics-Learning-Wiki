stem: 定积分 $\int_0^{\pi/2}\frac{e^x(1+\sin x)}{1+\cos x}\mathrm{d}x =$ ______．
reference_answer: $e^{\pi/2}$
solution: '拆分定积分并对第二项分部积分：


  $$\int_0^{\pi/2}\frac{e^x(1+\sin x)}{1+\cos x}\mathrm{d}x = \int_0^{\pi/2}\frac{e^x}{1+\cos x}\mathrm{d}x + \int_0^{\pi/2}\frac{\sin
  x}{1+\cos x}\mathrm{d}e^x$$


  对第二项应用分部积分公式：


  $$\int_0^{\pi/2}\frac{\sin x}{1+\cos x}\mathrm{d}e^x = \left[\frac{e^x\sin x}{1+\cos x}\right]_0^{\pi/2} - \int_0^{\pi/2}
  e^x \frac{\cos x(1+\cos x) + \sin^2 x}{(1+\cos x)^2}\mathrm{d}x$$


  由于 $\cos x(1+\cos x) + \sin^2 x = 1+\cos x$，两项积分恰好抵消：


  $$\int_0^{\pi/2}\frac{e^x(1+\sin x)}{1+\cos x}\mathrm{d}x = \left[\frac{e^x\sin x}{1+\cos x}\right]_0^{\pi/2} = e^{\pi/2}$$


  故定积分值为 $e^{\pi/2}$．'
