stem: 已知 $\mathrm{d}u(x, y) = \frac{y\mathrm{d}x - x\mathrm{d}y}{3x^2 - 2xy + 3y^2}$，则
  $u(x, y) =$ ______．
reference_answer: $\frac{1}{2\sqrt{2}}\arctan\left[\frac{3}{2\sqrt{2}}\left(\frac{x}{y}-\frac{1}{3}\right)\right]
  + C$
solution: '注意到 $y\mathrm{d}x - x\mathrm{d}y = y^2 \mathrm{d}(x/y)$．分子分母同除以 $y^2$：


  $$\mathrm{d}u(x, y) = \frac{\mathrm{d}(x/y)}{3(x/y)^2 - 2(x/y) + 3} = \frac{1}{3}\frac{\mathrm{d}(x/y)}{\left(\frac{x}{y}
  - \frac{1}{3}\right)^2 + \frac{8}{9}}$$


  两边积分：


  $$u(x, y) = \frac{1}{3}\cdot\frac{3}{2\sqrt{2}}\arctan\left[\frac{3}{2\sqrt{2}}\left(\frac{x}{y}-\frac{1}{3}\right)\right]
  + C = \frac{1}{2\sqrt{2}}\arctan\left[\frac{3}{2\sqrt{2}}\left(\frac{x}{y}-\frac{1}{3}\right)\right]
  + C$$'
