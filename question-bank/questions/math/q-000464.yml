reference_answer: 卷积仍归一化且均值为零；展开 $(v+u)^2$，交叉项因两个一阶矩为零而消失，故 $\sigma^2=\sigma_0^2+\sigma_c^2=1.85\,\mathrm{cm}^2$，$\sigma\approx1.36\,\mathrm{cm}$。
