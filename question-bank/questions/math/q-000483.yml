stem: 'Bodet 等（2024）测量亚太赫兹贝塞尔束，观察到中心窄峰、同心环及有限距离内较稳定的束形。 [研究来源（DOI）](https://doi.org/10.1038/s41598-024-70542-z)。


  用原创的理想剖面 $u(r)=J_0(kr)$、相对强度 $I(r)=J_0(kr)^2$ 解释论文报告的中心峰和环。给定 $J_0$ 的第一个正零点为 $j_{0,1}=2.4048255577$，取教学尺度 $k=2.00\,\mathrm{mm}^{-1}$。


  ![理想零阶贝塞尔强度随无量纲半径的曲线](asset:math-bessel)


  图中文字说明：横轴是 $s=kr$，纵轴是 $J_0(s)^2$；曲线是给定理想函数的计算图，不是实测数据。求第一暗环的半径 $r_1$，输入数值并使用单位标签 `mm`，允许绝对误差 $0.001$。'
solution: '暗环处强度为零，等价于 $J_0(kr_1)=0$。第一个正根要求 $kr_1=j_{0,1}$，所以


  $$r_1=\frac{2.4048255577}{2.00\,\mathrm{mm}^{-1}}=1.20241277885\,\mathrm{mm}.$$


  检查：将半径乘以 $k$ 恢复无量纲零点；$k$ 增大时，整个径向剖面按反比缩小，第一暗环也向轴线靠近。这个教学尺度未从论文的角度扫描或装置参数拟合。


  研究对应：Results, Effect of beam type, first concentric-ring discussion around Fig. 6(c)。教学范围：第一暗环位置不等于论文的旁瓣峰角；未将教学半径换成论文的接收扫描角。


  来源：[DOI 10.1038/s41598-024-70542-z](https://doi.org/10.1038/s41598-024-70542-z)。'
