hints:
- 先固定 $y$，完成内层 $x$ 积分。
- 注意变换振幅与取模平方后强度的区别。
feedback:
  correct: 正确分开两方向积分，并保持强度归一化。
  incorrect: 可分离函数产生乘积；不能把振幅或强度随意相加。
  choices:
    A: Fubini 分离积分给出两个一维变换的乘积。
    B: 复数乘积的模等于两个模的乘积。
    C: 加法对应的是不同的输入函数，不是 $g(x)h(y)$。
    D: 二维强度积分等于两个一维强度积分的乘积。
