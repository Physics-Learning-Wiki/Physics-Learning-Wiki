hints:
- 分离初始向量的平均值部分和零和部分。
- P 的本征值一在 P−I 中变成零。
feedback:
  correct: 保留了不衰减的常数模态，并让零和部分衰减。
  incorrect: 扩散生成元有零本征值，所以不是每个模态都衰减到零。
  choices:
    A: 初值不是纯常数模态，非均匀部分会随时间变化。
    B: 初始平均为一，这个常数模态保持不变。
    C: 总和将从三变为九，不符合本题算子的守恒关系。
    D: 误把零本征值模态也当作衰减项。
