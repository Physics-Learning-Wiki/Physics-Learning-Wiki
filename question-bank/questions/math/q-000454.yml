stem: |-
  Ryu 等（2024）用含复参数的二阶矩阵说明异常点附近的两支本征值如何交换；这里仅研究其复函数结构。 [研究来源（DOI）](https://doi.org/10.1038/s42005-024-01595-9)。

  论文二态模型的谱满足 $E^2=z$。取参数路径 $z(\theta)=e^{i\theta}$，从 $\theta=0$ 开始连续追踪根，初值 $E(0)=1$；允许 $0\leq\theta\leq4\pi$。

  ![复参数在单位圆上逆时针绕行的示意图](asset:math-loop)

  图中文字说明：圆心为 $0$，路径半径为 $1$，起点为正实轴上的 $z=1$，箭头只表示 $\theta$ 增大的方向，不表示本征值运动。

  请给出沿路径的连续根表达式，并据此论证：绕一周后根是否复原，以及为何不能在整个穿孔平面 $\mathbb C\setminus\{0\}$ 上定义一个连续单值平方根。答案须说明逐点取主值与连续追踪的区别。
solution: |-
  候选连续根为 $E(\theta)=e^{i\theta/2}$，其平方正好是 $z(\theta)$，且满足初值。任意其他连续根与它之比只可能为 $+1$ 或 $-1$；比值连续且起初为 $+1$，因此沿整个区间保持 $+1$。

  于是 $E(2\pi)=-1$，一周后交换到另一根；$E(4\pi)=1$，两周后才返回原根。若穿孔平面上有连续单值平方根，限制在这条闭合圆周上，起点与终点同为 $z=1$ 时必须给出同一值，这与上面的连续延拓结果矛盾。

  逐点主值把辐角强制限制在一个区间，在跨过割线时会发生跳变；它不能同时满足这次绕行的连续性。检查 $E(\theta)^2=e^{i\theta}$ 及两个端点均成立。本结论只谈根的交换，不包含量子态额外的几何相位。

  研究对应：Methods, Eqs. (7)–(11), circular parameter path (10)。教学范围：连续追踪的是瞬时本征值函数，不声称真实动态过程必然绝热跟随，也未证明论文的拓扑分类。

  来源：[DOI 10.1038/s42005-024-01595-9](https://doi.org/10.1038/s42005-024-01595-9)。
