stem: 'Sarenac 等（2025）用带三次相位的光栅产生中子艾里束，并用远场傅里叶变换和高斯模糊描述探测图样。 [研究来源（DOI）](https://doi.org/10.1103/PhysRevLett.134.153401)。


  论文所用单个光栅的载波周期为 $p=120\,\mathrm{nm}$，载波项写为 $e^{iKx}$，且一个周期的相位变化为 $2\pi$。


  求 $K$，用 $\mathrm{\mu m}^{-1}$ 表示，保留两位小数。输入数值并使用单位标签 `um^-1`；允许绝对误差 $0.01$。这里“弧度”视为无量纲。'
solution: '一个周期满足 $Kp=2\pi$。由于 $120\,\mathrm{nm}=0.120\,\mathrm{\mu m}$，


  $$

  K=\frac{2\pi}{0.120\,\mathrm{\mu m}}\approx52.36\,\mathrm{\mu m}^{-1}.

  $$


  检查：$Kp\approx6.2832$，即一周相位。$1/p\approx8.33\,\mathrm{\mu m}^{-1}$ 是空间周期频率，不是采用 $e^{iKx}$ 约定的空间角频率。数值答案不允许靠单位标签自动进行 nm 与 μm
  的换算。


  研究对应：Published article, Materials and methods, Eq. (1) and grating-parameter paragraph (p. 153401-3)。教学范围：不从这一周期推断完整艾里图样或透射效率。


  来源：[DOI 10.1103/PhysRevLett.134.153401](https://doi.org/10.1103/PhysRevLett.134.153401)。'
