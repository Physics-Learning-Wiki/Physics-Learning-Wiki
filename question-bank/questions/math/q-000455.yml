feedback:
  correct: 两项二阶导数恰好相消。
  incorrect: 商法则中的分母导数不能遗漏。
  choices:
    A: 符号相反的两个二阶项仍应相消。
    B: 没有包括求分母导数产生的抵消项。
    C: 在指定的孔外区域两项之和为零。
    D: 一次径向导数不能替代二维拉普拉斯算子。
