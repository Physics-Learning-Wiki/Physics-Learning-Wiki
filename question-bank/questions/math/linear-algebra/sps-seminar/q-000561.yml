stem: '**SPS 线性代数研讨班配套 · §2.1**


  为什么把零向量放进平面的一组基会出问题？'
choices:
- id: A
  content: 它不能提供新方向，且展开系数不唯一
- id: B
  content: 它会让所有向量的长度为零
- id: C
  content: 零向量不能与其他向量相加
answer:
  choice: A
hints:
- 给零向量乘任何数，结果都一样．
solution: 零向量没有提供独立方向；对它的系数任意改变也不改变线性组合，因此不可能得到唯一坐标．
feedback:
