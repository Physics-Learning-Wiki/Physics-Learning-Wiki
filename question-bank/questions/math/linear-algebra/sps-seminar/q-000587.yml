stem: |-
  **SPS 线性代数研讨班配套 · §2.4**

  任意矩阵连续转置两次会怎样？
choices:
- id: A
  content: 恢复原矩阵
- id: B
  content: 一定变成单位矩阵
- id: C
  content: 所有元素取相反数
answer:
  choice: A
hints:
- 每个元素的行号和列号交换两次．
solution: 元素从第 i 行第 j 列移到第 j 行第 i 列，再移回来．这个过程不改变数值，也不执行求逆．
