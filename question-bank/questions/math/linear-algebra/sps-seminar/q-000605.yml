stem: |-
  **SPS 线性代数研讨班配套 · §2.6**

  一个二维线性变换行列式为 1，就一定保留所有长度吗？
choices:
- id: A
  content: 不一定，例如横向拉长、纵向压短可以保持面积
- id: B
  content: 一定，因为面积与长度是同一回事
- id: C
  content: 不一定，但它一定会反转取向
answer:
  choice: A
hints:
- 比较面积约束与每条边长度的约束．
solution: 横向伸长两倍、纵向压缩为一半，面积倍数仍是 1，长度却变化．行列式为正还说明取向没有反转．
feedback:
  correct: 正确．横向伸长两倍、纵向压缩为一半，面积倍数仍是 1，长度却变化．行列式为正还说明取向没有反转．
  incorrect: 先想一想：比较面积约束与每条边长度的约束．
  choices:
    A: 横向伸长两倍、纵向压缩为一半，面积倍数仍是 1，长度却变化．行列式为正还说明取向没有反转．
    B: 这个判断不符合本题的结构．横向伸长两倍、纵向压缩为一半，面积倍数仍是 1，长度却变化．行列式为正还说明取向没有反转．
    C: 注意区分相关概念．横向伸长两倍、纵向压缩为一半，面积倍数仍是 1，长度却变化．行列式为正还说明取向没有反转．
