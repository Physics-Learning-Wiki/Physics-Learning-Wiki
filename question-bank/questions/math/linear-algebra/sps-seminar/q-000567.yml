stem: '**SPS 线性代数研讨班配套 · §2.2**


  对线性映射 T，已知 T(u) 和 T(v)，怎样得到 T(u+v)？'
choices:
- id: A
  content: 把 T(u) 与 T(v) 相加
- id: B
  content: 必须额外测量，无法推断
- id: C
  content: 把两个结果逐分量相乘
answer:
  choice: A
hints:
- 线性映射保留加法．
solution: 可加性给出 T(u+v)=T(u)+T(v)．这使得只知道基向量的像，就能推出所有线性组合的像．
feedback:
