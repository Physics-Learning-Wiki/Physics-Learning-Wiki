stem: '**SPS 线性代数研讨班配套 · §2.1 线性空间的封闭性**


  判断：只允许非负整数的「苹果数、梨数」二元组，在通常的加法和实数数乘下，构成一个实向量空间．'
answer:
  value: false
hints:
- 试着用负数或一半去乘一个允许的库存．
solution: 不构成．虽然两个实际库存可以相加，但 $-1\cdot(1,0)=(-1,0)$ 已经离开这个集合，$\tfrac12\cdot(1,0)$ 也不是整数库存．若想把水果类别当作实向量空间的基，就要允许任意实系数的形式组合；这时描述的对象已不限于实际水果个数．
