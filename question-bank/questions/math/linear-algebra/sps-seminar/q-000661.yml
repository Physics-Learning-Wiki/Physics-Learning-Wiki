choice_order: shuffle
choices:
- id: A
  content: $-6$ 与 $6$
- id: B
  content: $-8$ 与 $8$
- id: C
  content: $8$ 与 $8$
answer:
  choice: B
hints:
- 连续复合的行列式相乘；普通体积取绝对值。
solution: $\det(A^3)=(-2)^3=-8$。所以体积放大为 $8$ 倍，取向翻转三次后仍与原取向相反。
feedback:
  correct: 正确。三个负因子相乘为负，普通体积倍率为绝对值。
  incorrect: 再想一想：连续复合的行列式相乘；普通体积取绝对值。
  choices:
    A: 复合时缩放因子相乘，不是相加。
    B: 三个负因子相乘为负，普通体积倍率为绝对值。
    C: 三次取向翻转不能抵消成保持取向。
