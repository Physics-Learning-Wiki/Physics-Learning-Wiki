stem: |-
  **SPS 线性代数研讨班配套 · §2.6.5 矩阵幂与体积 · 2026-10-24 更新稿**

  某三维线性变换的矩阵 $A$ 满足 $\det A=-2$。连续执行三次后，$\det(A^3)$ 和普通体积放大倍数分别是多少？
