stem: '**SPS 线性代数研讨班配套 · §2.3 斜基下的长度**


  在通常的欧氏平面中，$\mathbf b_1=(1,0)^{\mathsf T}$、$\mathbf b_2=(1,1)^{\mathsf T}$．向量 $\mathbf v=\mathbf b_1+\mathbf b_2$ 在这组基下的坐标为
  $(1,1)^{\mathsf T}$．它的长度平方是多少？'
choices:
- id: A
  content: $2$
- id: B
  content: $3$
- id: C
  content: $5$
answer:
  choice: C
hints:
- 先把两根具体的箭头相加，再在通常的直角坐标系中计算．
solution: '先回到通常的直角坐标：$\mathbf v=(2,1)^{\mathsf T}$，所以 $\lVert\mathbf v\rVert^2=2^2+1^2=5$．


  也可直接展开内积：


  $$

  \lVert\mathbf b_1+\mathbf b_2\rVert^2

  =\lVert\mathbf b_1\rVert^2+2\mathbf b_1\cdot\mathbf b_2+\lVert\mathbf b_2\rVert^2

  =1+2+2=5.

  $$


  斜基下的两个坐标都是 1，但两根基箭头既不正交，也不都归一，不能直接把展开系数平方求和．'
feedback:
  correct: 已抓住本题的关键；可以再用自己的话解释一次．
  incorrect: 先展开提示，想清楚对象与操作，再对照解析检查．
  choices:
    A: 这是直接把斜基下的系数平方求和，忽略了基的几何信息．
    B: 这只加了两根基向量的长度平方，漏掉非正交带来的交叉项．
    C: 合成向量在标准直角坐标系中是 (2,1)，长度平方为 5．
