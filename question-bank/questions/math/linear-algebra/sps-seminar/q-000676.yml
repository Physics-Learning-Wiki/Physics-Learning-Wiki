choices:
- id: A
  content: $P_{\mathrm c}=C^{-1}$，且 $A^{\prime}=P_{\mathrm c}AP_{\mathrm c}^{-1}$
- id: B
  content: $P_{\mathrm c}=C$，且 $A^{\prime}=P_{\mathrm c}^{-1}AP_{\mathrm c}$
- id: C
  content: $P_{\mathrm c}=C^{-1}$，且 $A^{\prime}=P_{\mathrm c}^{-1}AP_{\mathrm c}$
answer:
  choice: A
hints:
- 不要只记字母；先看它把哪一组坐标变成哪一组坐标。
solution: 两条坐标式互为反向，所以 $P_{\mathrm c}=C^{-1}$。代入 $A^{\prime}=C^{-1}AC$，得到 $A^{\prime}=P_{\mathrm c}AP_{\mathrm c}^{-1}$。两种外观不同的公式表达同一件事。
feedback:
  correct: 正确。方向定义决定公式中的逆矩阵放在哪一侧。
  incorrect: 再想一想：不要只记字母；先看它把哪一组坐标变成哪一组坐标。
  choices:
    A: 方向定义决定公式中的逆矩阵放在哪一侧。
    B: 两种坐标换算方向相反，一般不相等。
    C: 这里已经换成反向定义的矩阵，公式顺序也要随之改变。
