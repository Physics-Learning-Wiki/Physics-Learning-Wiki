stem: |-
  **SPS 线性代数研讨班配套 · §2.6.6 换基与相似变换 · 2026-10-24 更新稿**

  有两种记法：$[\mathbf x]_{\mathcal B}=C[\mathbf x]_{\mathcal B^{\prime}}$，以及 $[\mathbf x]_{\mathcal B^{\prime}}=P_{\mathrm c}[\mathbf x]_{\mathcal B}$。若 $A^{\prime}=C^{-1}AC$，用 $P_{\mathrm c}$ 应怎样写？
