choices:
- id: A
  content: 把原矩阵改成五阶方阵
- id: B
  content: 辅助追踪六个三因子乘积，计算对象仍是原三阶行列式
- id: C
  content: 表示要多做两次线性变换
answer:
  choice: B
hints:
- 补写的列用来连线，不增加原矩阵的输入或输出维数。
solution: 补写两列只是读图的辅助。每条斜线取原矩阵中三个元素的乘积，两组三项相减；原行列式仍是三阶的。
feedback:
  correct: 正确。辅助列只是让跨边界的斜线更容易看清。
  incorrect: 再想一想：补写的列用来连线，不增加原矩阵的输入或输出维数。
  choices:
    A: 三行五列也不是五阶方阵，更不是原计算对象。
    B: 辅助列只是让跨边界的斜线更容易看清。
    C: 这不是矩阵复合，也没有增加线性变换。
