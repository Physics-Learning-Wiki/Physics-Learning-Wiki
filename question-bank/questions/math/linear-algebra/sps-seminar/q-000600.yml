stem: '**SPS 线性代数研讨班配套 · §2.6**


  平面中关于 x 轴反射，为什么行列式为 -1？'
choices:
- id: A
  content: 面积不变，但取向反转
- id: B
  content: 面积变成负的几何面积
- id: C
  content: 所有箭头长度变成 -1
answer:
  choice: A
hints:
- 区分普通面积与有向面积．
solution: 反射保留普通面积，但把有序基的逆时针取向翻为顺时针．负号记录取向，不表示普通面积或长度为负．
feedback:
  correct: 正确．反射保留普通面积，但把有序基的逆时针取向翻为顺时针．负号记录取向，不表示普通面积或长度为负．
  incorrect: 先想一想：区分普通面积与有向面积．
  choices:
    A: 反射保留普通面积，但把有序基的逆时针取向翻为顺时针．负号记录取向，不表示普通面积或长度为负．
    B: 这个判断不符合本题的结构．反射保留普通面积，但把有序基的逆时针取向翻为顺时针．负号记录取向，不表示普通面积或长度为负．
    C: 注意区分相关概念．反射保留普通面积，但把有序基的逆时针取向翻为顺时针．负号记录取向，不表示普通面积或长度为负．
