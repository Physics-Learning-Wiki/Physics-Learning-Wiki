stem: |-
  **SPS 线性代数研讨班配套 · 附录 A 三维割补 · 2026-10-23 更新稿**

  用外接长方体减去外围小块求体积，为什么要避免把同一小块减去两次？
choices:
- id: A
  content: 重复扣除会把目标体积算小
- id: B
  content: 重复扣除不会影响结果
- id: C
  content: 重复扣除一定把目标体积算大
answer:
  choice: A
hints:
- 每一块多余空间只应被移走一次．
solution: 外接体积中每块空间只计入一次，若同一块外围空间减去两次，就额外减掉一份体积，得到的数偏小．需要划分成内部不重叠的小块，或明确处理重叠．
feedback:
  correct: 正确。外接体积中每块空间只计入一次，若同一块外围空间减去两次，就额外减掉一份体积，得到的数偏小．需要划分成内部不重叠的小块，或明确处理重叠．
  incorrect: 再想一想：每一块多余空间只应被移走一次．
  choices:
    A: 外接体积中每块空间只计入一次，若同一块外围空间减去两次，就额外减掉一份体积，得到的数偏小．需要划分成内部不重叠的小块，或明确处理重叠．
    B: 同一块外围空间只在外接体积中计入一次，多扣一次会产生额外的负贡献。
    C: 额外的扣除使计算结果减小，不会使它增大。
