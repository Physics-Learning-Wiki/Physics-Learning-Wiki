stem: |-
  **SPS 线性代数研讨班配套 · §2.2**

  矩阵 A 与零矩阵相乘，在尺寸允许时，结果是什么？
choices:
- id: A
  content: 零矩阵
- id: B
  content: A
- id: C
  content: 单位矩阵
answer:
  choice: A
hints:
- 把它理解成与零映射复合．
solution: 先送到零再作用线性映射，或最后直接送到零，都得到零．这与相加零矩阵保持 A 的操作不同．
