stem: |-
  **SPS 线性代数研讨班配套 · §2.6.3 · 2026-10-23 更新稿**

  有人把“行列式对每列分别线性”理解成 $\det(A+B)=\det A+\det B$。取 $A=B=I_2$，这个等式的左、右两边分别是多少？
choices:
- id: A
  content: $2$ 和 $2$
- id: B
  content: $4$ 和 $4$
- id: C
  content: $4$ 和 $2$
answer:
  choice: C
hints:
- $A+B=2I_2$，两列都扩大了两倍。
solution: 左边为 $\det(2I_2)=2\times2=4$；右边为 $\det I_2+\det I_2=1+1=2$。这说明逐列线性不等于对整个矩阵相加的线性。
feedback:
  correct: 正确。左边为 $\det(2I_2)=2\times2=4$；右边为 $\det I_2+\det I_2=1+1=2$。这说明逐列线性不等于对整个矩阵相加的线性。
  incorrect: 再想一想：$A+B=2I_2$，两列都扩大了两倍。
  choices:
    A: 左边把两列的同时缩放误当成只缩放一列了。
    B: 右边的两个单位矩阵各有行列式 $1$，相加应为 $2$。
    C: 直接计算给出不相等的两边，构成反例。
