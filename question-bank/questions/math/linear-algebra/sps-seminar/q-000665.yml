type: single_choice
choice_order: shuffle
choices:
- id: A
  content: 因为没有行列式，所以连像的面积也无法讨论
- id: B
  content: 因为它在三维空间中没有体积，所以面积也为零
- id: C
  content: 像仍是面积为 1 的平面正方形，但原非方阵没有通常意义的行列式
answer:
  choice: C
hints:
- 区分平面面积、三维体积和方阵的行列式。
solution: 这个嵌入只把原平面放到三维的 z=0 平面中，边长和面积都保持。像的三维体积为零，不代表二维面积为零；不同维数的量不能混为一谈。
feedback:
  correct: 正确。面积可以直接判断，而通常行列式仍只适用于方阵。
  incorrect: 再想一想：区分平面面积、三维体积和方阵的行列式。
  choices:
    A: 非方阵没有通常行列式，不妨碍直接研究像的几何面积。
    B: 面积与三维体积是不同维数的量。
    C: 面积可以直接判断，而通常行列式仍只适用于方阵。
