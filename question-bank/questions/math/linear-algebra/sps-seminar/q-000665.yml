stem: '**SPS 线性代数研讨班配套 · §2.6.5 非方阵与面积 · 2026-10-24 更新稿**


  映射 $E:\mathbb R^2\to\mathbb R^3$ 定义为 $E(x,y)=(x,y,0)$。它的矩阵是 $3\times2$。关于单位正方形的像，哪种说法正确？'
