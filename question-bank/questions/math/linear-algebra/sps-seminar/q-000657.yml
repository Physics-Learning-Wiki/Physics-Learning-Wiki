choices:
- id: A
  content: 四阶矩阵也只需取四条正斜线和四条反斜线
- id: B
  content: 所有阶数都只需要六项
- id: C
  content: 用它计算三阶行列式；高阶可用其他方法，如按行或列展开
answer:
  choice: C
hints:
- 四阶行列式的排列项共有 24 项。
solution: 三阶行列式的六个排列项恰好能用萨鲁斯法则的两组三条斜线表示。四阶行列式有 24 个排列项，机械延长斜线会漏项。
feedback:
  correct: 正确。它是三阶的特殊记忆方法，不能直接向高阶照搬。
  incorrect: 再想一想：四阶行列式的排列项共有 24 项。
  choices:
    A: 四条加四条只有八项，通常会漏掉其他项。
    B: 六项是三阶的特征，阶数变化后排列项数也变化。
    C: 它是三阶的特殊记忆方法，不能直接向高阶照搬。
