stem: |-
  **SPS 线性代数研讨班配套 · §2.2**

  求 $2\begin{pmatrix}1&-1\\0&2\end{pmatrix}$．
choices:
- id: A
  content: $\begin{pmatrix}2&-2\\0&4\end{pmatrix}$
- id: B
  content: $\begin{pmatrix}2&-1\\0&2\end{pmatrix}$
- id: C
  content: $\begin{pmatrix}3&1\\2&4\end{pmatrix}$
answer:
  choice: A
hints:
- 数乘作用于每一个元素．
solution: 四个元素都乘以 2，负号保留，零仍为零．它既不是只改第一个元素，也不是给每个元素加 2．
