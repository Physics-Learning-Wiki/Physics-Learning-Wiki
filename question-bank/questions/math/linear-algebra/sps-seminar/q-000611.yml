stem: |-
  **SPS 线性代数研讨班配套 · §2.2.3 · 2026-10-23 更新稿**

  V 是二维空间、W 是三维空间，$T:V\to W$ 的矩阵有几行几列？
choices:
- id: A
  content: 3 行 2 列
- id: B
  content: 2 行 3 列
- id: C
  content: 2 行 2 列
answer:
  choice: A
hints:
- 每个输入基向量贡献一列，每列有输出空间维数那么多分量．
solution: 有两个输入基向量，所以有两列；每个像用三个输出坐标记录，所以有三行．矩阵不要求输入与输出维数相同．
feedback:
  correct: 正确。有两个输入基向量，所以有两列；每个像用三个输出坐标记录，所以有三行．矩阵不要求输入与输出维数相同．
  incorrect: 再想一想：每个输入基向量贡献一列，每列有输出空间维数那么多分量．
  choices:
    A: 有两个输入基向量，所以有两列；每个像用三个输出坐标记录，所以有三行．矩阵不要求输入与输出维数相同．
    B: 行数由输出维数决定，列数由输入维数决定；这个选项把两者颠倒了。
    C: 每个像位于三维输出空间，需要三个坐标，所以不能只用两行记录。
