stem: |-
  **SPS 线性代数研讨班配套 · §2.6.5 整数次幂的适用条件 · 2026-10-24 更新稿**

  希望对一个 $n\times n$ 矩阵讨论 $\det(A^k)=(\det A)^k$，其中整数 $k$ 可以为负数。此时必须补充什么条件？
