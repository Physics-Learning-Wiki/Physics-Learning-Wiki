choices:
- id: A
  content: $A$ 可逆
- id: B
  content: $A$ 必须正交
- id: C
  content: $A$ 的所有元素都为正
answer:
  choice: A
hints:
- 负整数次幂需要先定义逆矩阵。
solution: 当 $k<0$ 时，$A^k$ 通过 $A^{-1}$ 定义，所以要求 $A$ 可逆。对正整数次幂不需要此条件；矩阵不必正交，也不要求元素为正。
feedback:
  correct: 正确。可逆性保证负幂有定义。
  incorrect: 再想一想：负整数次幂需要先定义逆矩阵。
  choices:
    A: 可逆性保证负幂有定义。
    B: 正交性足够但不是必要条件；一般可逆矩阵也可以。
    C: 元素为正不能保证可逆，也不是定义负幂所需条件。
