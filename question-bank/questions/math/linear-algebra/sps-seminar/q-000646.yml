stem: |-
  **SPS 线性代数研讨班配套 · §2.6.3 按列展开 · 2026-10-23 更新稿**

  三阶行列式按第一列展开，第二项从该列取出 $a_{21}$。其余子式前的排列符号 $(-1)^{2+1}$ 是什么，几何上对应什么？
choices:
- id: A
  content: 正号，因为普通底面积总为正
- id: B
  content: 负号，因为物体具有负的普通体积
- id: C
  content: 负号，因为把坐标顺序从 $(x,y,z)$ 改为 $(y,x,z)$ 交换了一次
answer:
  choice: C
hints:
- 让高度方向排在最前，剩下两个坐标按原顺序排列。
solution: 此项以 $y$ 方向为高度，底面坐标依次为 $x,z$。次序 $(y,x,z)$ 相对 $(x,y,z)$ 交换了一次，所以符号为 $-1$。这是取向因子；整项的符号还取决于 $a_{21}$ 与余子式，普通体积始终非负。
feedback:
  correct: 正确。此项以 $y$ 方向为高度，底面坐标依次为 $x,z$。次序 $(y,x,z)$ 相对 $(x,y,z)$ 交换了一次，所以符号为 $-1$。这是取向因子；整项的符号还取决于 $a_{21}$ 与余子式，普通体积始终非负。
  incorrect: 再想一想：让高度方向排在最前，剩下两个坐标按原顺序排列。
  choices:
    A: 展开使用有向量，不能用普通底面积非负来取消排列符号。
    B: 负号记录取向，不是在把普通体积解释成负数。
    C: 一次交换产生负号，与代数式中的奇数指数一致。
