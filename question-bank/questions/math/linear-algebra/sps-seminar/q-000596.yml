stem: |-
  **SPS 线性代数研讨班配套 · §2.3**

  一组基向量彼此垂直，但长度不都是 1，能总用坐标平方和当长度平方吗？
choices:
- id: A
  content: 不能，还要乘上各基向量长度的平方
- id: B
  content: 能，只要垂直就够了
- id: C
  content: 不能，因为这种基不能表示向量
answer:
  choice: A
hints:
- 坐标为 1 的向量就是对应的基向量．
solution: 垂直消除了交叉项，但各方向的尺度仍在．若第一基向量长 2，坐标 (1,0) 的长度平方为 4 而不是 1．
feedback:
  correct: 正确．垂直消除了交叉项，但各方向的尺度仍在．若第一基向量长 2，坐标 (1,0) 的长度平方为 4 而不是 1．
  incorrect: 先想一想：坐标为 1 的向量就是对应的基向量．
  choices:
    A: 垂直消除了交叉项，但各方向的尺度仍在．若第一基向量长 2，坐标 (1,0) 的长度平方为 4 而不是 1．
    B: 这个判断不符合本题的结构．垂直消除了交叉项，但各方向的尺度仍在．若第一基向量长 2，坐标 (1,0) 的长度平方为 4 而不是 1．
    C: 注意区分相关概念．垂直消除了交叉项，但各方向的尺度仍在．若第一基向量长 2，坐标 (1,0) 的长度平方为 4 而不是 1．
