stem: |-
  **SPS 线性代数研讨班配套 · §2.6.6 换基与相似变换 · 2026-10-24 更新稿**

  设 $[\mathbf x]_{\mathcal B}=C[\mathbf x]_{\mathcal B^{\prime}}$，且 $A=\mathcal M_{\mathcal B}(T)$。求新基下的 $A^{\prime}=\mathcal M_{\mathcal B^{\prime}}(T)$ 时，正确关系是哪一个？
