type: single_choice
choice_order: shuffle
choices:
- id: A
  content: $A^{\prime}=CAC^{-1}$
- id: B
  content: $A^{\prime}=C^{-1}AC$
- id: C
  content: $A^{\prime}=AC^{-1}$
answer:
  choice: B
hints:
- 从新基输入出发：先转成原基输入，再执行 A，最后转回新基。
solution: 矩阵从右往左作用：$C$ 把新坐标变为原坐标，$A$ 执行变换，$C^{-1}$ 把输出转回新坐标。因此 $A^{\prime}=C^{-1}AC$。
feedback:
  correct: 正确。三个因子的顺序与输入输出坐标方向一致。
  incorrect: 再想一想：从新基输入出发：先转成原基输入，再执行 A，最后转回新基。
  choices:
    A: 在本题指定的 C 方向下，这把去程与回程交换了。
    B: 三个因子的顺序与输入输出坐标方向一致。
    C: 输入和输出都必须处理，不能只换算一侧。
