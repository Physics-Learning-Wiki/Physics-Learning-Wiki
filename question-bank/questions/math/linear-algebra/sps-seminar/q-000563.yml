stem: |-
  **SPS 线性代数研讨班配套 · §2.1**

  平面中所有长度恰好为 1 的向量，采用通常运算，能组成向量空间吗？
choices:
- id: A
  content: 不能，乘以 0 或 2 后就离开这个集合
- id: B
  content: 能，因为每个元素都是向量
- id: C
  content: 能，因为可以给它们写两个坐标
answer:
  choice: A
hints:
- 一个向量空间必须允许任意实数数乘．
solution: 单位圆上的箭头乘以 2 后长度为 2，乘以 0 后得到零向量；两者都不在原集合，数乘不封闭．
feedback:
  correct: 正确．单位圆上的箭头乘以 2 后长度为 2，乘以 0 后得到零向量；两者都不在原集合，数乘不封闭．
  incorrect: 先想一想：一个向量空间必须允许任意实数数乘．
  choices:
    A: 单位圆上的箭头乘以 2 后长度为 2，乘以 0 后得到零向量；两者都不在原集合，数乘不封闭．
    B: 这个判断不符合本题的结构．单位圆上的箭头乘以 2 后长度为 2，乘以 0 后得到零向量；两者都不在原集合，数乘不封闭．
    C: 注意区分相关概念．单位圆上的箭头乘以 2 后长度为 2，乘以 0 后得到零向量；两者都不在原集合，数乘不封闭．
