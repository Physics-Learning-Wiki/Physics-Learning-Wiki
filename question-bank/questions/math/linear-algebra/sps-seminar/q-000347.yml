stem: '**SPS 线性代数研讨班配套 · §2.6 行列式的大小与符号**


  在平面标准坐标中，线性变换的矩阵为


  $$

  A=\begin{pmatrix}-2&1\\0&3\end{pmatrix}.

  $$


  用 $2\times2$ 行列式公式 $ad-bc$ 算一次，并说明单位正方形的像的普通面积与取向．原正方形的边界按逆时针顺序走．'
choices:
- id: A
  content: $\det A=-6$，普通面积为 $-6$，取向翻转．
- id: B
  content: $\det A=-6$，普通面积为 $6$，取向翻转．
- id: C
  content: $\det A=6$，普通面积为 $6$，取向保持．
answer:
  choice: B
hints:
- 先算带符号的数，再把它的绝对值与符号分别解释．
solution: '行列式为


  $$

  \det A=(-2)\cdot3-1\cdot0=-6.

  $$


  普通面积是非负的，故像的面积为 $|\det A|=6$．负号表示取向翻转：沿对应顶点的相同顺序走，原来的逆时针变成顺时针．负号不表示「负的普通面积」．'
feedback:
  correct: 已抓住本题的关键；可以再用自己的话解释一次．
  incorrect: 先展开提示，想清楚对象与操作，再对照解析检查．
  choices:
    A: 取向判断正确，但普通面积不取负值．
    B: 绝对值给普通面积缩放，负号给取向翻转．
    C: 面积大小对了，但丢掉了行列式本来的负号与取向信息．
