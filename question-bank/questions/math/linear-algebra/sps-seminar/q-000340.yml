stem: '**SPS 线性代数研讨班配套 · §2.5 可逆变换**


  线性变换 $D(x,y)=(3x,y)$ 把水平方向拉长三倍．哪种操作能对所有输入撤销它？'
choices:
- id: A
  content: 把水平分量缩为三分之一，竖直分量不变．
- id: B
  content: 把水平分量减去 3．
- id: C
  content: 任何拉伸都丢失信息，因此不存在逆操作．
answer:
  choice: A
hints:
- 撤销一个三倍放大，应该再乘什么数？
solution: 已知输出为 $(X,Y)=(3x,y)$，原输入就是 $(X/3,Y)$．所以 $D^{-1}$ 把水平分量缩为三分之一，竖直分量保持不变．拉长虽然改变形状，却没有让不同输入重合，因此信息仍可恢复．
feedback:
  correct: 已抓住本题的关键；可以再用自己的话解释一次．
  incorrect: 先展开提示，想清楚对象与操作，再对照解析检查．
  choices:
    A: 连续做三倍和三分之一倍，回到原输入．
    B: 减去固定数是在平移，不能普遍撤销三倍缩放．
    C: 非零倍数的拉伸可以撤销；完全压扁一个方向才会丢失该方向信息．
