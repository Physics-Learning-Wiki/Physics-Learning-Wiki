stem: |-
  **SPS 线性代数研讨班配套 · §2.6.3–§2.6.5 行列式性质综合 · 2026-10-24 更新稿**

  已知三阶实矩阵 $A$ 满足 $\det A=2$。先交换第 1、2 列，再把第 3 列乘以 $3$，得到 $B$。

  1. 不展开矩阵，求 $\det B$。
  2. $B$ 是否可逆？若可逆，求 $\det(B^{-1})$。
  3. 对应变换把普通体积放大多少倍，是否保持取向？
