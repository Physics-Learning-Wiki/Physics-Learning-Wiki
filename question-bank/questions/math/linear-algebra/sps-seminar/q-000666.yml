reference_answer: $\det B=-6$；可逆，$\det(B^{-1})=-1/6$；普通体积放大 6 倍，取向反转。
hints:
- 交换两列变号；只缩放一列就只引入一次缩放因子。
solution: 交换两列后行列式为 $-2$，第三列乘以 $3$ 后为 $-6$。行列式非零，所以 $B$ 可逆，其逆矩阵的行列式为 $1/(-6)=-1/6$。普通体积倍率为 $|-6|=6$；负号表示取向反转。
