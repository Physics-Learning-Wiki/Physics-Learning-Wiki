stem: '**SPS 线性代数研讨班配套 · §2.1**


  把平面的一组基的顺序交换，原来的向量会发生什么？'
choices:
- id: A
  content: 向量不变，两个坐标的顺序交换
- id: B
  content: 向量一定反向
- id: C
  content: 向量长度变成两倍
answer:
  choice: A
hints:
- 坐标是相对于有序基的描述．
solution: 若原来是 a 个第一基向量加 b 个第二基向量，交换基的顺序后，用 b、a 描述同一个向量．改变描述不等于移动向量．
feedback:
  correct: 正确．若原来是 a 个第一基向量加 b 个第二基向量，交换基的顺序后，用 b、a 描述同一个向量．改变描述不等于移动向量．
  incorrect: 先想一想：坐标是相对于有序基的描述．
  choices:
    A: 若原来是 a 个第一基向量加 b 个第二基向量，交换基的顺序后，用 b、a 描述同一个向量．改变描述不等于移动向量．
    B: 这个判断不符合本题的结构．若原来是 a 个第一基向量加 b 个第二基向量，交换基的顺序后，用 b、a 描述同一个向量．改变描述不等于移动向量．
    C: 注意区分相关概念．若原来是 a 个第一基向量加 b 个第二基向量，交换基的顺序后，用 b、a 描述同一个向量．改变描述不等于移动向量．
