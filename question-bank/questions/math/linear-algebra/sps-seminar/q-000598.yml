stem: |-
  **SPS 线性代数研讨班配套 · §2.3**

  对实内积空间中的非零向量 u，u 与自身的内积能为负吗？
choices:
- id: A
  content: 不能，必须为正
- id: B
  content: 能，只要 u 的坐标有负数
- id: C
  content: 能，只要 u 朝左
answer:
  choice: A
hints:
- 内积的正定性约束的是向量与自身．
solution: 内积正定性要求非零向量的自内积严格为正．向量与另一向量的内积可以为负，但自内积不可以．
feedback:
  correct: 正确．内积正定性要求非零向量的自内积严格为正．向量与另一向量的内积可以为负，但自内积不可以．
  incorrect: 先想一想：内积的正定性约束的是向量与自身．
  choices:
    A: 内积正定性要求非零向量的自内积严格为正．向量与另一向量的内积可以为负，但自内积不可以．
    B: 这个判断不符合本题的结构．内积正定性要求非零向量的自内积严格为正．向量与另一向量的内积可以为负，但自内积不可以．
    C: 注意区分相关概念．内积正定性要求非零向量的自内积严格为正．向量与另一向量的内积可以为负，但自内积不可以．
