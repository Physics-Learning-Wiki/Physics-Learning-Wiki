hints:
- 转置与交换其中两列，是不同的操作。
solution: 对任意方阵，$\det(A^{\mathsf T})=\det A$，所以仍为 $-3$。转置不是交换一对列；不能套用交换两列变号的结论。
feedback:
  correct: 正确。转置保持行列式，包括原来的负号。
  incorrect: 再想一想：转置与交换其中两列，是不同的操作。
  choices:
    A: 转置保持行列式，包括原来的负号。
    B: 交换两列才会变号；转置不是这一操作。
    C: 倒数对应逆矩阵的行列式，不是转置。
