stem: |-
  **SPS 线性代数研讨班配套 · §2.6.3 转置与行列式 · 2026-10-24 更新稿**

  已知实方阵 $A$ 的行列式为 $-3$。把所有行和列互换得到 $A^{\mathsf T}$，其行列式是多少？
