stem: '**SPS 线性代数研讨班配套 · §2.6.7 特征方程、特征值与对角化 · 2026-10-24 更新稿**


  考虑实数或复数范围内的矩阵


  $$

  J=\begin{pmatrix}1&1\\0&1\end{pmatrix}.

  $$


  已经知道它的唯一特征值是 $1$。令 $\mathbf v=(x,y)^{\mathsf T}$。


  1. 把 $J\mathbf v=\mathbf v$ 写成两个分量的等式，找出全部非零特征向量。

  2. 能否选出两个线性无关的特征向量？能否对角化？

  3. 允许 x、y 为复数，会改变上述结论吗？'
