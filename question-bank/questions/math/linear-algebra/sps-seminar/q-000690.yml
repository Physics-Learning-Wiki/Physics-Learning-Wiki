reference_answer: 特征向量恰为 $(x,0)^{\mathsf T}$，其中 $x\ne0$。它们都共线，不能组成二维空间的基，因此在实数和复数范围内均不能对角化。
hints:
- 第一分量给出 x+y=x；不要把重根的出现次数当作独立向量的个数。
solution: $J\mathbf v=(x+y,y)^{\mathsf T}$，等式要求 $x+y=x$，即 $y=0$；非零条件要求 $x\ne0$。所有特征向量都是 $(1,0)^{\mathsf T}$ 的倍数，只有一个独立方向。允许复数也不会改变方程
  y=0。这说明复矩阵有特征值，并不保证存在足够多的独立特征向量；“有特征向量”与“可对角化”是不同要求。
