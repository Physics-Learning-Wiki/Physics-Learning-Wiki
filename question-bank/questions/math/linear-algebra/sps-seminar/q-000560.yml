stem: '**SPS 线性代数研讨班配套 · §2.1**


  平面中用两支不共线的箭头作基，坐标出现负数意味着什么？'
choices:
- id: A
  content: 沿对应基向量的反方向取倍数
- id: B
  content: 这个向量不存在
- id: C
  content: 所选的基一定错误
answer:
  choice: A
hints:
- 数乘允许负数．
solution: 负系数只改变对应分量的方向，例如 -2 倍基向量表示反向的两倍．坐标可以是任意实数．
feedback:
  correct: 正确．负系数只改变对应分量的方向，例如 -2 倍基向量表示反向的两倍．坐标可以是任意实数．
  incorrect: 先想一想：数乘允许负数．
  choices:
