stem: |-
  **SPS 线性代数研讨班配套 · §2.6**

  矩阵 $\begin{pmatrix}2&0\\0&3\end{pmatrix}$ 的行列式是多少？
choices:
- id: A
  content: $6$
- id: B
  content: $5$
- id: C
  content: $1$
answer:
  choice: A
hints:
- 单位正方形变为怎样的长方形？
solution: 横向放大 2 倍、纵向放大 3 倍，面积放大 2×3=6 倍，取向不变；二阶公式也给出 2×3-0×0=6．
feedback:
  correct: 正确．横向放大 2 倍、纵向放大 3 倍，面积放大 2×3=6 倍，取向不变；二阶公式也给出 2×3-0×0=6．
  incorrect: 先想一想：单位正方形变为怎样的长方形？
  choices:
    A: 横向放大 2 倍、纵向放大 3 倍，面积放大 2×3=6 倍，取向不变；二阶公式也给出 2×3-0×0=6．
    B: 这个判断不符合本题的结构．横向放大 2 倍、纵向放大 3 倍，面积放大 2×3=6 倍，取向不变；二阶公式也给出 2×3-0×0=6．
    C: 注意区分相关概念．横向放大 2 倍、纵向放大 3 倍，面积放大 2×3=6 倍，取向不变；二阶公式也给出 2×3-0×0=6．
