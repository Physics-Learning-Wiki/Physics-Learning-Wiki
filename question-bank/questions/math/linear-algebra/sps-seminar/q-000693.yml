type: single_choice
choice_order: shuffle
choices:
- id: A
  content: 能，只有出现全零行，行列式才能为零
- id: B
  content: 能，矩阵元素都非零就能求逆
- id: C
  content: 不能；两列相同，所以行列式为零，而且 $(1,-1)^{\mathsf T}$ 是非零核向量
answer:
  choice: C
hints:
- 行列式为零的关键是列线性相关，不是原矩阵是否有全零行。
solution: 本题两列相同，$\det M=1\cdot1-1\cdot1=0$。并且 $M(1,-1)^{\mathsf T}=0$，故 $A(1,-1)^{\mathsf T}=\lambda(1,-1)^{\mathsf
  T}$。原矩阵不必直接出现零行；行列式判据关注线性相关性。
feedback:
  correct: 正确。一个非零核向量已经证明存在 λ 对应的特征方向。
  incorrect: 再想一想：行列式为零的关键是列线性相关，不是原矩阵是否有全零行。
  choices:
    A: 全零行是充分情形，但不是行列式为零的必要条件。
    B: 元素是否非零不能决定矩阵是否可逆。
    C: 一个非零核向量已经证明存在 λ 对应的特征方向。
