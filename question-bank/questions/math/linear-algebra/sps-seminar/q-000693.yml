stem: |-
  **SPS 线性代数研讨班配套 · §2.6.7 特征方程的充分性 · 2026-10-24 更新稿**

  矩阵

  $$
  M=A-\lambda I=\begin{pmatrix}1&1\\1&1\end{pmatrix}
  $$

  没有全零行。能否因此断言 $\det M\ne0$、λ 不是 A 的特征值？
