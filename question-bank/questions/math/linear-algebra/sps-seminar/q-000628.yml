stem: |-
  **SPS 线性代数研讨班配套 · 附录 A 三维割补 · 2026-10-23 更新稿**

  观察三维割补动画时，只把摄像机换个角度，物体的体积会怎样？
choices:
- id: A
  content: 保持不变，屏幕上的投影形状可能改变
- id: B
  content: 随屏幕上看起来的面积成比例改变
- id: C
  content: 看到的棱越短，实际体积就越小
answer:
  choice: A
hints:
- 改变观察方向不等于对物体施加形变．
solution: 同一个物体从不同方向看会遮挡不同部分，但物体没有被拉伸或压缩，实际体积不变．屏幕上的二维投影不能直接当作三维体积．
feedback:
  correct: 正确。同一个物体从不同方向看会遮挡不同部分，但物体没有被拉伸或压缩，实际体积不变．屏幕上的二维投影不能直接当作三维体积．
  incorrect: 再想一想：改变观察方向不等于对物体施加形变．
  choices:
    A: 同一个物体从不同方向看会遮挡不同部分，但物体没有被拉伸或压缩，实际体积不变．屏幕上的二维投影不能直接当作三维体积．
    B: 屏幕上的投影面积依赖观察方向，不能直接当成三维物体的体积。
    C: 透视缩短是投影效果；只移动摄像机并没有改变物体本身的棱长。
