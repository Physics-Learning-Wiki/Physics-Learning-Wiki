stem: '**SPS 线性代数研讨班配套 · §2.3**


  在欧氏平面中，把非零向量 u 变成 -u，长度怎样变化？'
choices:
- id: A
  content: 长度不变
- id: B
  content: 长度变为负数
- id: C
  content: 长度变为零
answer:
  choice: A
hints:
- 长度没有方向，箭头有方向．
solution: 取负只把箭头反向；内积 (-u)·(-u)=u·u，所以长度不变且仍为正．
feedback:
  correct: 正确．取负只把箭头反向；内积 (-u)·(-u)=u·u，所以长度不变且仍为正．
  incorrect: 先想一想：长度没有方向，箭头有方向．
  choices:
