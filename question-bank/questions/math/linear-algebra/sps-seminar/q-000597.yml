    B: 这个判断不符合本题的结构．1 与 x 的乘积不是处处为零，但在对称区间上的积分为零．函数正交是整体积分条件，不是逐点条件．
    C: 注意区分相关概念．1 与 x 的乘积不是处处为零，但在对称区间上的积分为零．函数正交是整体积分条件，不是逐点条件．
