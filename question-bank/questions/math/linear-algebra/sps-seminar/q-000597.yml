stem: "**SPS 线性代数研讨班配套 · §2.3**\n\n对函数内积 $\\langle f,g\rangle=\\int_{-1}^{1}f(x)g(x)\\,dx$，正交是否要求每一点的乘积都为零？"
choices:
- id: A
  content: 不要求，积分中的正负贡献可以抵消
- id: B
  content: 要求，否则积分不可能为零
- id: C
  content: 要求其中一个函数恒为零
answer:
  choice: A
hints:
- 比较常数函数 1 与函数 x．
solution: 1 与 x 的乘积不是处处为零，但在对称区间上的积分为零．函数正交是整体积分条件，不是逐点条件．
feedback:
  correct: 正确．1 与 x 的乘积不是处处为零，但在对称区间上的积分为零．函数正交是整体积分条件，不是逐点条件．
  incorrect: 先想一想：比较常数函数 1 与函数 x．
