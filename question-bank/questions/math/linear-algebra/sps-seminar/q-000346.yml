stem: '**SPS 线性代数研讨班配套 · §2.6 剪切与面积**


  对平面施加剪切 $T(x,y)=(x+y,y)$．单位正方形变成底边长为 $1$、高为 $1$ 的斜平行四边形．哪句话正确？'
choices:
- id: A
  content: 面积不变，但某些长度与夹角会改变．
- id: B
  content: 面积不变，所以所有长度和夹角都不变．
- id: C
  content: 只要正方形变斜，面积就一定增大．
answer:
  choice: A
hints:
- 面积看底和高；一条边是否变长是另一个问题．
solution: 面积仍是底乘高，即 $1$，所以面积缩放比为 $1$．但竖直单位边从 $(0,1)^{\mathsf T}$ 变成 $(1,1)^{\mathsf T}$，长度从 $1$ 变成 $\sqrt2$，直角也变了．行列式记录有向面积缩放，并不记录全部长度与夹角信息．
feedback:
  correct: 已抓住本题的关键；可以再用自己的话解释一次．
  incorrect: 先展开提示，想清楚对象与操作，再对照解析检查．
  choices:
    A: 底和高不变，斜边却变长了．
    B: 保持面积的条件比保持长度、夹角弱得多．
    C: 斜边变长并不意味着底乘高增大．
