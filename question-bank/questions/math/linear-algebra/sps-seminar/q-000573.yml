stem: |-
  **SPS 线性代数研讨班配套 · §2.1**

  一组基有两支向量，就必须画成互相垂直吗？
choices:
- id: A
  content: 不必，只要在平面中不共线
- id: B
  content: 必须，否则无法定义坐标
- id: C
  content: 必须，否则不是向量
answer:
  choice: A
hints:
- 基要求的是独立方向和唯一展开．
solution: 斜着的两条独立方向也能覆盖平面并给出唯一坐标．垂直是方便的额外几何条件，不是基的定义．
