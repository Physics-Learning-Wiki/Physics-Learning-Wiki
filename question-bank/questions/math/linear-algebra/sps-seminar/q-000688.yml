type: single_choice
choice_order: shuffle
choices:
- id: A
  content: 变为 λ 乘以 det C
- id: B
  content: 变为 λ 的倒数
- id: C
  content: 仍为 λ
answer:
  choice: C
hints:
- 直接计算 $A^{\prime}\mathbf v^{\prime}$，相邻的 C 与其逆会抵消。
solution: $A^{\prime}\mathbf v^{\prime}=C^{-1}ACC^{-1}\mathbf v=C^{-1}A\mathbf v=\lambda C^{-1}\mathbf v=\lambda\mathbf v^{\prime}$。C
  可逆保证新坐标仍非零，因此特征值不变，改变的是同一特征向量的坐标。
feedback:
  correct: 正确。同一变换的特征值与选基无关。
  incorrect: 再想一想：直接计算 $A^{\prime}\mathbf v^{\prime}$，相邻的 C 与其逆会抵消。
  choices:
    A: 换基的行列式因子不改变这个特征值。
    B: 取逆矩阵才涉及非零特征值的倒数；换基不是取 A 的逆。
    C: 同一变换的特征值与选基无关。
