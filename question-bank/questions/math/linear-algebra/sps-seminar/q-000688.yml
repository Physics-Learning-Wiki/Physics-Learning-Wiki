stem: '**SPS 线性代数研讨班配套 · §2.6.7 特征方程、特征值与对角化 · 2026-10-24 更新稿**


  在原基中 $A\mathbf v=\lambda\mathbf v$，$\mathbf v\ne0$。换基后 $A^{\prime}=C^{-1}AC$，向量的新坐标为 $\mathbf v^{\prime}=C^{-1}\mathbf v$。新特征值会怎样？'
