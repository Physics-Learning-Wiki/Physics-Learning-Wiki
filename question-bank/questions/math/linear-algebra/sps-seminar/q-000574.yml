stem: |-
  **SPS 线性代数研讨班配套 · §2.2**

  多项式映射 T(a+bx)=(a,b) 保留的核心结构是什么？
choices:
- id: A
  content: 加法和实数数乘
- id: B
  content: 多项式在每个 x 处的函数值都不变
- id: C
  content: 多项式的图像变成同一条曲线
answer:
  choice: A
hints:
- 比较系数相加与坐标相加．
solution: 两多项式相加就是系数相加，数乘就是系数一起缩放．这个对应保留线性结构，不是把函数图像照搬到平面．
feedback:
