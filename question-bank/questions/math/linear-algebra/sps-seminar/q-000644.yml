stem: '**SPS 线性代数研讨班配套 · §2.6.3 · 2026-10-23 更新稿**


  设 $A$ 是 $3\times3$ 实矩阵且 $\det A=-2$。把整个矩阵乘以 $2$，$\det(2A)$ 是多少？'
choices:
- id: A
  content: $-16$
- id: B
  content: $-4$
- id: C
  content: $16$
answer:
  choice: A
hints:
- 整个三阶矩阵乘以二，意味着有几列各自乘以二？
solution: 三列各带来一个因子 $2$，所以 $\det(2A)=2^3\det A=8\times(-2)=-16$。正的缩放因子不会消除原来的取向反转。
feedback:
  correct: 正确。三列各带来一个因子 $2$，所以 $\det(2A)=2^3\det A=8\times(-2)=-16$。正的缩放因子不会消除原来的取向反转。
  incorrect: 再想一想：整个三阶矩阵乘以二，意味着有几列各自乘以二？
  choices:
    A: 三个列因子相乘，并保留原行列式的负号。
    B: 这个结果只乘了一次二，相当于仅改变一列。
    C: 绝对值是普通体积缩放比，但题目要求保留符号的行列式。
