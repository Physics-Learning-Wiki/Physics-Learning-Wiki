stem: |-
  **SPS 线性代数研讨班配套 · §2.6.7 特征方程、特征值与对角化 · 2026-10-24 更新稿**

  对给定数域上的 $n\times n$ 矩阵 A，若想把它在某组基下表示成对角矩阵，需要找到什么？
difficulty: 1
cognitive_level: understand
style: conceptual
estimated_seconds: 60
provenance:
  type: original
  note: '对应张梓超《SPS线性代数研讨班第一、二讲》2026-10-24 本地更新稿 §2.6.7 特征方程、特征值与对角化；源文件 SHA-256: 01fba536c273b9ed112e63ad338a556d724eb2422119464b2e33a976f0d1682a。题目、提示与解析独立编写，仅按教学范围组织，未转载讲义文字或图像。'
