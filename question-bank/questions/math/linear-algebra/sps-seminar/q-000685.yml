type: single_choice
choice_order: shuffle
choices:
- id: A
  content: 至少一个非零特征向量
- id: B
  content: n 个线性无关的特征向量
- id: C
  content: n 个互不相同的向量，无论是否线性相关
answer:
  choice: B
hints:
- 新的基必须张成整个空间，而且各基向量不能互相依赖。
solution: 若存在 n 个线性无关的特征向量，它们可组成基。每个基向量的像只在自身方向上，于是表示矩阵为对角矩阵；反过来，对角表示中的基向量都是特征向量。只找到一个方向通常不够。
feedback:
  correct: 正确。独立的特征向量基正是对角化所需条件。
  incorrect: 再想一想：新的基必须张成整个空间，而且各基向量不能互相依赖。
  choices:
    A: 一个方向通常不足以组成 n 维空间的基。
    B: 独立的特征向量基正是对角化所需条件。
    C: 互不相同仍可能共线，不能保证构成基。
