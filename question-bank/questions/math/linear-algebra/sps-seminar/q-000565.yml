stem: '**SPS 线性代数研讨班配套 · §2.1**


  在有序基 $(1,x)$ 下，多项式 $3-2x$ 的坐标是什么？'
choices:
- id: A
  content: $(3,-2)$
- id: B
  content: $(-2,3)$
- id: C
  content: $(3,2)$
answer:
  choice: A
hints:
- 按基的顺序读取系数．
solution: 展开就是 3 倍的 1 加 -2 倍的 x，因此坐标依次为 3、-2；负号不能丢失．
