stem: |-
  **SPS 线性代数研讨班配套 · §2.2 一次完整的矩阵乘法**

  设

  $$
  A=\begin{pmatrix}1&1\\0&1\end{pmatrix},\qquad
  B=\begin{pmatrix}2&0\\0&1\end{pmatrix}.
  $$

  算出 $AB$，写出其中一格的「行乘列」过程，并说清 $AB\mathbf v$ 是先做 $A$ 还是先做 $B$．可按「第一行 a,b；第二行 c,d」的格式，用算出的数字填写矩阵．
