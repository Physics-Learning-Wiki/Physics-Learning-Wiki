reference_answer: $AB=\begin{pmatrix}2&1\\0&1\end{pmatrix}$；例如左上格为 $1\cdot2+1\cdot0=2$；先做 $B$，再做 $A$．
hints:
- 第一行第一列取左矩阵第一行与右矩阵第一列；理解作用次序时，从最靠近输入的矩阵开始．
solution: |-
  四格分别计算，避免把矩阵乘法误作逐格相乘：

  $$
  \begin{aligned}
  (AB)_{11}&=1\cdot2+1\cdot0=2,\\
  (AB)_{12}&=1\cdot0+1\cdot1=1,\\
  (AB)_{21}&=0\cdot2+1\cdot0=0,\\
  (AB)_{22}&=0\cdot0+1\cdot1=1.
  \end{aligned}
  $$

  因此

  $$
  AB=\begin{pmatrix}2&1\\0&1\end{pmatrix},\qquad
  AB\mathbf v=A(B\mathbf v).
  $$

  先做 $B$：把水平分量扩大两倍；再做 $A$：把竖直分量加到水平分量上．整个变换是 $(x,y)\mapsto(2x+y,y)$，与乘积矩阵一致．
