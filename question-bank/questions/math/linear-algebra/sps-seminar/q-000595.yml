stem: '**SPS 线性代数研讨班配套 · §2.3**


  欧氏向量 (1,2) 的长度平方是多少？'
choices:
- id: A
  content: $5$
- id: B
  content: $3$
- id: C
  content: $\sqrt{5}$
answer:
  choice: A
hints:
- 长度平方是向量与自身的点积．
solution: 1²+2²=5．长度才是 √5；坐标直接相加得到的 3 不代表长度平方．
feedback:
