stem: |-
  **SPS 线性代数研讨班配套 · §2.6.2 · 2026-10-23 更新稿**

  在三阶行列式的莱布尼茨公式中，排列 $(\sigma(1),\sigma(2),\sigma(3))=(2,3,1)$ 对应的项是 $a_{12}a_{23}a_{31}$。它前面的符号是什么？
choices:
- id: A
  content: 负号，因为不是恒等排列
- id: B
  content: 正号，因为逆序数为 2
- id: C
  content: 负号，因为有 3 个元素
answer:
  choice: B
hints:
- 只统计满足 $i<j$ 且 $\sigma(i)>\sigma(j)$ 的位置对。
solution: 逆序对是位置 $(1,3)$ 与 $(2,3)$，共两对；位置 $(1,2)$ 不是逆序。因此符号为 $(-1)^2=+1$。是否为恒等排列不能单独决定正负。
feedback:
  correct: 正确。逆序对是位置 $(1,3)$ 与 $(2,3)$，共两对；位置 $(1,2)$ 不是逆序。因此符号为 $(-1)^2=+1$。是否为恒等排列不能单独决定正负。
  incorrect: 再想一想：只统计满足 $i<j$ 且 $\sigma(i)>\sigma(j)$ 的位置对。
  choices:
    A: 非恒等排列也可能是偶排列；需要数逆序对。
    B: 两次逆序带来两次变号，最终为正。
    C: 符号由逆序对的个数决定，不是由排列的元素个数决定。
