stem: '**SPS 线性代数研讨班配套 · §2.6.7 特征方程的充分性 · 2026-10-24 更新稿**


  设 $A$ 为 $n$ 阶实方阵，$\lambda$ 为实数。$\det(A-\lambda I)=0$ 保证有非零特征向量。它是否保证每个非零向量都满足 $A\mathbf v=\lambda\mathbf v$？'
