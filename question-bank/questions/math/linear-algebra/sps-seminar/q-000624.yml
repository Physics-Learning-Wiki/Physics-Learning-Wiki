stem: |-
  **SPS 线性代数研讨班配套 · §2.6 与附录 A · 2026-10-23 更新稿**

  三维变换分别把 x、y、z 方向放大 2、1、3 倍，单位立方体变成多大体积？
choices:
- id: A
  content: $6$
- id: B
  content: $5$
- id: C
  content: $3$
answer:
  choice: A
hints:
- 三个方向的长度因子相乘．
solution: 新长方体的三条边长为 2、1、3，体积为 2×1×3=6；长度因子应相乘，不是相加．
feedback:
  correct: 正确。新长方体的三条边长为 2、1、3，体积为 2×1×3=6；长度因子应相乘，不是相加．
  incorrect: 再想一想：三个方向的长度因子相乘．
  choices:
    A: 新长方体的三条边长为 2、1、3，体积为 2×1×3=6；长度因子应相乘，不是相加．
    B: $5=2+3$ 把长度因子相加了；体积应乘上三个方向的缩放因子 $2\times1\times3$。
    C: 只计算一个方向的因子会漏掉另一方向的两倍拉伸。
