choices:
- id: A
  content: $\operatorname{diag}(2,3)$
- id: B
  content: $\operatorname{diag}(3,2)$
- id: C
  content: $\operatorname{diag}(3,-2)$
answer:
  choice: B
hints:
- 新基的第 1、2 个向量分别按什么倍率变化？
solution: 两列线性无关，所以 C 可逆。在有序特征向量基中，第一列为 $(3,0)^{\mathsf T}$，第二列为 $(0,2)^{\mathsf T}$，因此得到 $\operatorname{diag}(3,2)$。对角元素的顺序跟随特征向量的列顺序。
feedback:
  correct: 正确。新基的顺序决定对应特征值的对角位置。
  incorrect: 再想一想：新基的第 1、2 个向量分别按什么倍率变化？
  choices:
    A: 这需要先交换特征向量在 C 中的列顺序。
    B: 新基的顺序决定对应特征值的对角位置。
    C: 特征向量的一个负分量不会把其特征值变号。
