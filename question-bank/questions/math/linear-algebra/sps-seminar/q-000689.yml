stem: '**SPS 线性代数研讨班配套 · §2.6.7 特征方程、特征值与对角化 · 2026-10-24 更新稿**


  设


  $$

  A=\begin{pmatrix}3&1\\0&2\end{pmatrix},\qquad

  \mathbf v_1=\begin{pmatrix}1\\0\end{pmatrix},\qquad

  \mathbf v_2=\begin{pmatrix}-1\\1\end{pmatrix}.

  $$


  可直接验证 $A\mathbf v_1=3\mathbf v_1$、$A\mathbf v_2=2\mathbf v_2$。令 $C=(\mathbf v_1\ \mathbf v_2)$，则 $C^{-1}AC$ 是什么？'
