stem: |-
  **SPS 线性代数研讨班配套 · §2.4 矩阵转置**

  设

  $$
  M=\begin{pmatrix}1&0&2\\-1&3&4\end{pmatrix}.
  $$

  把原来的每一行改排为一列，$M^{\mathsf T}$ 是哪个矩阵？
choices:
- id: A
  content: $\begin{pmatrix}1&0&2\\-1&3&4\end{pmatrix}$
- id: B
  content: $\begin{pmatrix}1&-1\\0&3\\2&4\end{pmatrix}$
- id: C
  content: $\begin{pmatrix}-1&1\\0&-3\\-2&-4\end{pmatrix}$
answer:
  choice: B
hints:
- 先检查尺寸：原来 2 行 3 列，转置后应为 3 行 2 列．
solution: |-
  第一行 $(1,0,2)$ 变成第一列，第二行 $(-1,3,4)$ 变成第二列：

  $$
  M^{\mathsf T}=\begin{pmatrix}1&-1\\0&3\\2&4\end{pmatrix}.
  $$

  结果有三行两列，元素的数值没有改变；转置只交换行号和列号，不是求逆，也不是将元素取负．
feedback:
  correct: 已抓住本题的关键；可以再用自己的话解释一次．
  incorrect: 先展开提示，想清楚对象与操作，再对照解析检查．
  choices:
    A: 这是原矩阵，尺寸和位置都没有转置．
    B: 原来的两行正好成为新的两列．
    C: 这是正确转置再整体取负；转置本身不改变数值．
