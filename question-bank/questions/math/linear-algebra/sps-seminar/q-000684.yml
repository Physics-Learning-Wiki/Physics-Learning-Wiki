type: single_choice
choice_order: shuffle
choices:
- id: A
  content: $-2\mathbf v$ 的特征值变为 $-6$
- id: B
  content: $-2\mathbf v$ 不再是特征向量，因为方向反了
- id: C
  content: $-2\mathbf v$ 仍是特征值 $3$ 的特征向量
answer:
  choice: C
hints:
- 对输入整体乘以非零常数，利用 A 的线性性。
solution: $A(-2\mathbf v)=-2A\mathbf v=-6\mathbf v=3(-2\mathbf v)$。输入和输出同时乘以相同常数，比例 3 不变。
feedback:
  correct: 正确。非零倍数不改变输出相对于输入的比例。
  incorrect: 再想一想：对输入整体乘以非零常数，利用 A 的线性性。
  choices:
    A: 负 6 是相对于原向量 v 的系数；相对于新输入仍为 3。
    B: 特征方向是一条直线，非零倍数仍是同一特征值的特征向量。
    C: 非零倍数不改变输出相对于输入的比例。
