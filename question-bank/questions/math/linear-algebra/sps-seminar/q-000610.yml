stem: |-
  **SPS 线性代数研讨班配套 · §2.2.3 · 2026-10-23 更新稿**

  线性映射 $T:V\to V$ 的输入和输出用同一组基，是否保证 T 可逆？
choices:
- id: A
  content: 不保证，还须 T 是双射
- id: B
  content: 保证，只要两组基相同
- id: C
  content: 保证，只要矩阵是方阵
answer:
  choice: A
hints:
- 试想把所有输入都送到零的映射．
solution: 同一组基只确定表示方式．例如非零空间上的零映射有方阵表示，却把所有输入混在一起，不能求逆；双射才保证逆映射存在．
feedback:
  correct: 正确。同一组基只确定表示方式．例如非零空间上的零映射有方阵表示，却把所有输入混在一起，不能求逆；双射才保证逆映射存在．
  incorrect: 再想一想：试想把所有输入都送到零的映射．
  choices:
    A: 同一组基只确定表示方式．例如非零空间上的零映射有方阵表示，却把所有输入混在一起，不能求逆；双射才保证逆映射存在．
    B: 同一组基只统一坐标描述，不会使零映射等丢失信息的映射变成双射。
    C: 方阵也可能不可逆，例如二维零矩阵。方阵尺寸不能替代双射条件。
