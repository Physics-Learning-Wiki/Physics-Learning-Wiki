stem: '**SPS 线性代数研讨班配套 · §2.3**


  两个非零向量垂直时，一个在另一个方向上的投影是多少？'
choices:
- id: A
  content: 零
- id: B
  content: 等于两个长度之和
- id: C
  content: 一定等于 1
answer:
  choice: A
hints:
- 沿另一支箭头看，是否有前进或后退？
solution: 垂直方向没有沿该方向的分量，投影为零，因此点积也为零；这不要求向量本身为零．
