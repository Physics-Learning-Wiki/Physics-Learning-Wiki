stem: '**SPS 线性代数研讨班配套 · §2.6.6 换基与相似变换 · 2026-10-24 更新稿**


  两组有序基为 $\mathcal B=(\mathbf e_1,\mathbf e_2)$ 与 $\mathcal B^{\prime}=(\mathbf e^{\prime}_1,\mathbf e^{\prime}_2)$，且 $P\mathbf
  e_i=\mathbf e^{\prime}_i$。记 $C=\mathcal M_{\mathcal B}(P)$。$C$ 的第 2 列记录什么？'
