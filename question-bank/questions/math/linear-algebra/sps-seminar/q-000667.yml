type: single_choice
choice_order: shuffle
choices:
- id: A
  content: $\mathbf e_2$ 在新基 $\mathcal B^{\prime}$ 下的坐标
- id: B
  content: $\mathbf e^{\prime}_2$ 在原基 $\mathcal B$ 下的坐标
- id: C
  content: $P^{-1}\mathbf e_2$ 在原基下的坐标
answer:
  choice: B
hints:
- 矩阵第 j 列记录第 j 个输入基向量的像，在输出基下的坐标。
solution: $C$ 的输入、输出都用 $\mathcal B$。第 2 列是 $[P\mathbf e_2]_{\mathcal B}=[\mathbf e^{\prime}_2]_{\mathcal B}$。务必区分“基向量被 P 改变”与“同一向量的坐标换算”。
feedback:
  correct: 正确。新基向量在原基下的坐标正是 C 的列。
  incorrect: 再想一想：矩阵第 j 列记录第 j 个输入基向量的像，在输出基下的坐标。
  choices:
    A: 这对应反方向的坐标换算，不是 C 的列定义。
    B: 新基向量在原基下的坐标正是 C 的列。
    C: 这里表示的是 P，不是其逆。
