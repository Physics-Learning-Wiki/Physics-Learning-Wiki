stem: |-
  **SPS 线性代数研讨班配套 · §2.6.5 体积保持与正交性 · 2026-10-24 更新稿**

  剪切矩阵

  $$
  H=\begin{pmatrix}1&1\\0&1\end{pmatrix}
  $$

  的行列式为 $1$。能否仅据此判断它是正交矩阵？
