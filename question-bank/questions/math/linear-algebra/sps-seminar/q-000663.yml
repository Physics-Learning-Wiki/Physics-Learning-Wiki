type: single_choice
choice_order: shuffle
choices:
- id: A
  content: 能，面积不变必然保证所有长度不变
- id: B
  content: 不能；它把单位向量 $(0,1)^{\mathsf T}$ 变成长度为 $\sqrt{2}$ 的向量
- id: C
  content: 能，所有可逆矩阵都是正交矩阵
answer:
  choice: B
hints:
- 检查一个单位向量的长度就足以否定正交性。
solution: $H(0,1)^{\mathsf T}=(1,1)^{\mathsf T}$，长度由 $1$ 变为 $\sqrt{2}$。所以 $H$ 保持面积却不保持所有长度。$\det Q=\pm1$ 是正交矩阵的必要条件，反过来不充分。
feedback:
  correct: 正确。一个长度改变的例子就能否定正交性。
  incorrect: 再想一想：检查一个单位向量的长度就足以否定正交性。
  choices:
    A: 面积由多个方向共同决定，面积保持不等于逐个长度保持。
    B: 一个长度改变的例子就能否定正交性。
    C: 可逆只保证可恢复输入，不保证长度保持。
