stem: |-
  **SPS 线性代数研讨班配套 · §2.2 矩阵的加法与数乘**

  设

  $$
  A=\begin{pmatrix}1&0\\-1&2\end{pmatrix},\qquad
  B=\begin{pmatrix}0&3\\1&-1\end{pmatrix}.
  $$

  $2A+B$ 等于什么？这里只做对应位置的运算．
choices:
- id: A
  content: $\begin{pmatrix}2&6\\0&2\end{pmatrix}$
- id: B
  content: $\begin{pmatrix}2&3\\-1&3\end{pmatrix}$
- id: C
  content: $\begin{pmatrix}2&0\\0&2\end{pmatrix}$
answer:
  choice: B
hints:
- 数乘会作用到每一格，包括负数和零．
solution: |-
  先把 $A$ 的每个元素乘以 $2$，再与 $B$ 的对应元素相加：

  $$
  2A+B=\begin{pmatrix}2+0&0+3\\-2+1&4-1\end{pmatrix}
  =\begin{pmatrix}2&3\\-1&3\end{pmatrix}.
  $$

  作用于同一个输入 $\mathbf v$ 时，这也表示把输出 $A\mathbf v$ 放大两倍，再与 $B\mathbf v$ 相加．
feedback:
  correct: 已抓住本题的关键；可以再用自己的话解释一次．
  incorrect: 先展开提示，想清楚对象与操作，再对照解析检查．
  choices:
    A: 这是把 B 也乘了 2，即算成了 2(A+B)．
    B: 每一格都先对 A 数乘，再与 B 对应相加．
    C: 这里误把加法做成了逐项乘法．
