stem: |-
  **SPS 线性代数研讨班配套 · §2.6 与附录 A · 2026-10-23 更新稿**

  在同一组标准正交归一基下，一个三维实线性变换的表示矩阵行列式为 $-4$，单位立方体的普通体积与取向如何？
choices:
- id: A
  content: 体积为 4，取向反转
- id: B
  content: 体积为 -4，取向保持
- id: C
  content: 体积为 4，取向保持
answer:
  choice: A
hints:
- 绝对值记录普通体积，符号记录取向．
solution: 普通体积非负，取行列式的绝对值得到 4．负号表示三条有序基向量的整体取向翻转，不是负的物体体积．
feedback:
  correct: 正确。普通体积非负，取行列式的绝对值得到 4．负号表示三条有序基向量的整体取向翻转，不是负的物体体积．
  incorrect: 再想一想：绝对值记录普通体积，符号记录取向．
  choices:
    A: 普通体积非负，取行列式的绝对值得到 4．负号表示三条有序基向量的整体取向翻转，不是负的物体体积．
    B: 普通体积不能为负；负号表示取向反转，而不是负的普通体积。
    C: 绝对值给出了正确的体积，但行列式的负号还告诉我们取向发生了反转。
