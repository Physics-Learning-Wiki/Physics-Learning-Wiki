  **SPS 线性代数研讨班配套 · §2.6.7 特征方程、特征值与对角化 · 2026-10-24 更新稿**

  在实平面中，逆时针旋转 $90^\circ$ 的矩阵为 $R=\left(\begin{smallmatrix}0&-1\\1&0\end{smallmatrix}\right)$。它是否有非零实特征向量？
