type: single_choice
choice_order: shuffle
choices:
- id: A
  content: 有，所有非零向量都是
- id: B
  content: 有，旋转不改变长度，所以特征值必为 1
- id: C
  content: 没有，因为每个非零向量都被旋到与自身垂直的方向
answer:
  choice: C
hints:
- 实数倍的向量与原向量共线；比较这与 90° 旋转。
solution: 非零实特征向量要求旋转后的向量仍与原向量共线，但 90° 旋转使它们垂直。也可算出 $\det(R-\lambda I)=\lambda^2+1$，在实数范围没有根。这里明确限定为实平面与 90°。
feedback:
  correct: 正确。没有实特征向量，但允许复数后会出现特征值。
  incorrect: 再想一想：实数倍的向量与原向量共线；比较这与 90° 旋转。
  choices:
    A: 每个非零向量都转到另一条直线上。
    B: 长度保持不代表向量本身不变。
    C: 没有实特征向量，但允许复数后会出现特征值。
