stem: |-
  **SPS 线性代数研讨班配套 · 附录 A 三维割补 · 2026-10-23 更新稿**

  一个物体在同一底面区域上由下表面 $z=f(x,y)$ 和上表面 $z=g(x,y)$ 围成，且 $0\le f\le g$。两个表面以下的体积都从 $z=0$ 算起。用上表面以下的体积减去下表面以下的体积时，减去的量表示什么？
choices:
- id: A
  content: 位于物体下方、被前一个体积多算的部分
- id: B
  content: 物体具有一块负体积的材料
- id: C
  content: 物体上方尚未计入的部分
answer:
  choice: A
hints:
- 沿同一条竖线，看上下表面之间才是物体．
solution: 上表面以下的柱体包含物体及下方空间；减去下表面以下的部分，剩下两表面之间的物体．负号表示扣除，不是某块材料的普通体积为负．
feedback:
  correct: 正确。上表面以下的柱体包含物体及下方空间；减去下表面以下的部分，剩下两表面之间的物体．负号表示扣除，不是某块材料的普通体积为负．
  incorrect: 再想一想：沿同一条竖线，看上下表面之间才是物体．
  choices:
    A: 上表面以下的柱体包含物体及下方空间；减去下表面以下的部分，剩下两表面之间的物体．负号表示扣除，不是某块材料的普通体积为负．
    B: 普通体积是非负的；这里的减号是在扣除第一次计算时多计入的空间。
    C: 减去的是下表面以下的多算部分；上表面以上的空间原本就没有计入。
