stem: |-
  **SPS 线性代数研讨班配套 · §2.6.7 特征方程、特征值与对角化 · 2026-10-24 更新稿**

  实平面中的旋转矩阵 $R=-I_2$ 表示旋转 $180^\circ$。对 $\mathbf v=(1,2)^{\mathsf T}$，它对应的特征值是多少？
difficulty: 1
cognitive_level: apply
