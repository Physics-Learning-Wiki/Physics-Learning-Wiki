type: single_choice
choice_order: shuffle
choices:
- id: A
  content: $-1$
- id: B
  content: $1$
- id: C
  content: 不存在，因为任何旋转都没有实特征向量
answer:
  choice: A
hints:
- 计算 $R\mathbf v$，再与原向量比较。
solution: $R\mathbf v=(-1,-2)^{\mathsf T}=-\mathbf v$，所以特征值为 $-1$。事实上每个非零实向量都是它的特征向量；不能把 90° 的结论推广到所有旋转。
feedback:
  correct: 正确。反向但保持长度，对应特征值负 1。
  incorrect: 再想一想：计算 $R\mathbf v$，再与原向量比较。
  choices:
    A: 反向但保持长度，对应特征值负 1。
    B: 特征值 1 意味着向量不变，这里方向反了。
    C: 180° 旋转保持每条过原点的直线，与 90° 情况不同。
