stem: '**SPS 线性代数研讨班配套 · §2.2**


  对 T(x,y)=(x,0)，输出 (2,0) 能唯一确定输入吗？'
choices:
- id: A
  content: 不能，(2,1) 和 (2,-1) 都可以
- id: B
  content: 能，只有 (2,0)
- id: C
  content: 不能，因为根本没有输入能产生它
answer:
  choice: A
hints:
- 输出没有记录输入的第二个坐标．
solution: 所有 (2,y) 都得到 (2,0)，所以这个输出有无穷多个原像，而不是没有原像．
feedback:
