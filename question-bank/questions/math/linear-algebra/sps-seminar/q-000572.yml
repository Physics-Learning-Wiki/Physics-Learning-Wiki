stem: |-
  **SPS 线性代数研讨班配套 · §2.2**

  映射 T(x,y)=(x,2y) 会把过原点的直线变成什么？
choices:
- id: A
  content: 仍是过原点的直线
- id: B
  content: 一定是圆
- id: C
  content: 一定是不经过原点的直线
answer:
  choice: A
hints:
- 直线上的向量都形如 t u．
solution: 线性给出 T(tu)=tT(u)．此处变换可逆，非零方向不会消失，因此直线仍是过原点的直线．
