stem: |-
  **SPS 线性代数研讨班配套 · §2.6.6 换基与相似变换 · 2026-10-24 更新稿**

  原基与新基的坐标满足 $[\mathbf x]_{\mathcal B}=C[\mathbf x]_{\mathcal B^{\prime}}$。给定

  $$
  C=\begin{pmatrix}1&1\\0&1\end{pmatrix},\quad
  C^{-1}=\begin{pmatrix}1&-1\\0&1\end{pmatrix},\quad
  A=\begin{pmatrix}3&0\\0&1\end{pmatrix},\quad
  A'=\begin{pmatrix}3&2\\0&1\end{pmatrix}.
  $$

  输入的原坐标为 $(2,1)^{\mathsf T}$。

  1. 求输入的新坐标。
  2. 用 $A^{\prime}$ 求输出的新坐标，再换回原坐标。
  3. 与直接用 $A$ 作用于原坐标的结果比较，并说明哪一步执行了实际变换。
