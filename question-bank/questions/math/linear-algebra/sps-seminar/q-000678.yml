reference_answer: 输入新坐标 $(1,1)^{\mathsf T}$，输出新坐标 $(5,1)^{\mathsf T}$，返回原坐标 $(6,1)^{\mathsf T}$，与直接计算一致。中间乘 $A^{\prime}$
  执行 T。
hints:
- 按“原坐标乘逆矩阵 → 新表示 → 乘 C 返回”的顺序。
solution: 先算 $C^{-1}(2,1)^{\mathsf T}=(1,1)^{\mathsf T}$；再算 $A^{\prime}(1,1)^{\mathsf T}=(5,1)^{\mathsf T}$；最后 $C(5,1)^{\mathsf
  T}=(6,1)^{\mathsf T}$。直接算 $A(2,1)^{\mathsf T}$ 也得到 $(6,1)^{\mathsf T}$。首尾是对同一输入或输出换坐标，中间一步执行所研究的线性变换 T。
