type: single_choice
choice_order: shuffle
choices:
- id: A
  content: $A$ 本身没有通常意义的行列式；$\det\widetilde A=0$
- id: B
  content: $\det A=0$，因为补零以后算出了零
- id: C
  content: $\det\widetilde A$ 一定非零，因为它现在是方阵
answer:
  choice: A
hints:
- 补零后得到的是另一个矩阵。
solution: 通常的行列式只对方阵定义。$A$ 是非方阵，所以 $\det A$ 未定义；补零得到的 $\widetilde A$ 有零列，故其行列式为零。这不能反过来当作给 $A$ 定义了行列式。
feedback:
  correct: 正确。计算结果属于补全后的方阵。
  incorrect: 再想一想：补零后得到的是另一个矩阵。
  choices:
    A: 计算结果属于补全后的方阵。
    B: 补全改变了矩阵对象，不能把结果移给原非方阵。
    C: 方阵的行列式可以为零；零列正是这种情况。
