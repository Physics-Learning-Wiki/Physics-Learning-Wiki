stem: '**SPS 线性代数研讨班配套 · §2.6.5 非方阵与零补全 · 2026-10-24 更新稿**


  给一个 $3\times2$ 矩阵 $A$ 补上一列零，得到三阶方阵 $\widetilde A$。哪句话符合通常的行列式定义？'
difficulty: 1
cognitive_level: understand
style: conceptual
estimated_seconds: 60
provenance:
  type: original
  note: '对应张梓超《SPS线性代数研讨班第一、二讲》2026-10-24 本地更新稿 §2.6.5 非方阵与零补全；源文件 SHA-256: 01fba536c273b9ed112e63ad338a556d724eb2422119464b2e33a976f0d1682a。题目、提示与解析独立编写，仅按教学范围组织，未转载讲义文字或图像。'
