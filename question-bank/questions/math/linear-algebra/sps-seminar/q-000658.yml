stem: '**SPS 线性代数研讨班配套 · §2.6.4 三阶行列式的短计算 · 2026-10-24 更新稿**


  计算


  $$

  A=\begin{pmatrix}1&1&0\\0&2&1\\1&0&1\end{pmatrix}

  $$


  的行列式。'
