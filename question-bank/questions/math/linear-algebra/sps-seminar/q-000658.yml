answer:
  choice: B
hints:
- 先列出向右下的三项，再减去向左下的三项。
solution: 向右下三项的和为 $1\cdot2\cdot1+1\cdot1\cdot1+0\cdot0\cdot0=3$；向左下的三个乘积都为 $0$。所以 $\det A=3$。
feedback:
  correct: 正确。两个非零正项分别为 2 和 1。
  incorrect: 再想一想：先列出向右下的三项，再减去向左下的三项。
  choices:
    A: 不要把右下方向的非零项 1 误写成减项。
    B: 两个非零正项分别为 2 和 1。
    C: 只乘主对角线会漏掉另一个非零排列项。
