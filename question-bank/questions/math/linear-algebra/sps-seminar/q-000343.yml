stem: |-
  **SPS 线性代数研讨班配套 · §2.3 内积：投影后再缩放**

  在通常的欧氏平面中，$\mathbf u=(3,0)^{\mathsf T}$、$\mathbf v=(2,1)^{\mathsf T}$．$\mathbf v$ 在 $\mathbf u$ 方向上的投影长度为 $2$．求 $\mathbf u\cdot\mathbf v$（填一个数，无需单位）．
answer:
  value: 6
  tolerance:
    value: 0
    type: absolute
  unit:
    required: false
    accepted: []
hints:
- 不要把投影长度直接当作点积；还要乘上长度 3．
solution: |-
  点积是投影的有向长度再乘以另一向量的长度．本题中投影与 $\mathbf u$ 同向，投影有向长度为 $2$，而 $\lVert\mathbf u\rVert=3$，所以

  $$
  \mathbf u\cdot\mathbf v=3\times2=6.
  $$

  按坐标算也是 $3\cdot2+0\cdot1=6$．只有用于投影的方向向量已经归一时，点积本身才直接等于投影的有向长度．
