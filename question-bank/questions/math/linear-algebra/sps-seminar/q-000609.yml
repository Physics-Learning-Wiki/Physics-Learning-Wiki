stem: |-
  **SPS 线性代数研讨班配套 · §2.2.3 · 2026-10-23 更新稿**

  对 $T:V\to W$，输入用基 $\mathcal B$，输出用基 $\mathcal C$．矩阵第 j 列应怎样记录？
choices:
- id: A
  content: 用 $\mathcal C$ 坐标记录 $T(b_j)$
- id: B
  content: 用 $\mathcal B$ 坐标记录 $b_j$
- id: C
  content: 用 $\mathcal C$ 坐标记录 $b_j$，不必作用 T
answer:
  choice: A
hints:
- 先变换输入基向量，再描述输出．
solution: 第 j 列是第 j 个输入基向量的像，在输出空间的基下的坐标．直接记录输入会漏掉 T，且输入基向量未必属于输出空间．
feedback:
  correct: 正确。第 j 列是第 j 个输入基向量的像，在输出空间的基下的坐标．直接记录输入会漏掉 T，且输入基向量未必属于输出空间．
  incorrect: 再想一想：先变换输入基向量，再描述输出．
  choices:
    A: 第 j 列是第 j 个输入基向量的像，在输出空间的基下的坐标．直接记录输入会漏掉 T，且输入基向量未必属于输出空间．
    B: $[b_j]_{\mathcal B}$ 只记录输入基向量本身，完全没有记录 $T$ 对它的作用。
    C: 必须先作用 $T$；而且 $b_j\in V$，未必能直接用 $W$ 的基 $\mathcal C$ 展开。
