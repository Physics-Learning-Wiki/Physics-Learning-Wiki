stem: '**SPS 线性代数研讨班配套 · §2.6.6 换基与相似变换 · 2026-10-24 更新稿**


  已知


  $$

  C=\begin{pmatrix}1&1\\0&1\end{pmatrix},\qquad

  C^{-1}=\begin{pmatrix}1&-1\\0&1\end{pmatrix},\qquad

  A=\begin{pmatrix}2&0\\0&1\end{pmatrix}.

  $$


  坐标关系为 $[\mathbf x]_{\mathcal B}=C[\mathbf x]_{\mathcal B^{\prime}}$。新表示 $A^{\prime}=C^{-1}AC$ 是什么？'
