answer:
  choice: A
hints:
- 先算 $AC$，再在左侧乘 $C^{-1}$。
solution: $AC=\left(\begin{smallmatrix}2&2\\0&1\end{smallmatrix}\right)$；再左乘 $C^{-1}$ 得到 $A^{\prime}=\left(\begin{smallmatrix}2&1\\0&1\end{smallmatrix}\right)$。非对角项来自换基，不表示原几何变换变了。
feedback:
  correct: 正确。按从右向左的次序相乘得到此矩阵。
  incorrect: 再想一想：先算 $AC$，再在左侧乘 $C^{-1}$。
  choices:
    A: 按从右向左的次序相乘得到此矩阵。
    B: 这个符号来自误用 $CAC^{-1}$ 的反向公式。
    C: 在这组斜基下，原来的对角矩阵不再是对角形式。
