stem: '**SPS 线性代数研讨班配套 · §2.6.7 特征方程、特征值与对角化 · 2026-10-24 更新稿**


  特征向量满足 $A\mathbf v=\lambda\mathbf v$。为什么定义还要求 $\mathbf v\ne\mathbf0$？'
difficulty: 1
cognitive_level: understand
style: conceptual
