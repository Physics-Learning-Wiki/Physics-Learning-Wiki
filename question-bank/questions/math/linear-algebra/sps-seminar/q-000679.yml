type: single_choice
choice_order: shuffle
choices:
- id: A
  content: 因为线性映射不能把零向量映成零向量
- id: B
  content: 因为把零向量代入时，对任意 λ 等式都成立，不能识别特征方向
- id: C
  content: 因为 λ 不允许为零
answer:
  choice: B
hints:
- 直接把 $\mathbf v=\mathbf0$ 代入两侧。
solution: 任何线性映射都满足 $A\mathbf0=\mathbf0$，而 $\lambda\mathbf0=\mathbf0$ 对任何 λ 都成立。因此必须排除零向量；特征值本身仍然可以是零。
feedback:
  correct: 正确。零向量没有可供识别的方向，也不能限制 λ。
  incorrect: 再想一想：直接把 $\mathbf v=\mathbf0$ 代入两侧。
  choices:
    A: 线性映射恰恰一定把零向量映到零向量。
    B: 零向量没有可供识别的方向，也不能限制 λ。
    C: 非零条件施加在特征向量上，不施加在特征值上。
