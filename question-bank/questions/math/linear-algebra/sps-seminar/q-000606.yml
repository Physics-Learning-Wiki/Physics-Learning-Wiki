stem: |-
  **SPS 线性代数研讨班配套 · §2.6**

  一个 2×2 矩阵的两列完全相同，行列式为什么为零？
choices:
- id: A
  content: 两条生成边共线，围不出面积
- id: B
  content: 因为每个矩阵元素必定是零
- id: C
  content: 因为两列交换后面积变大
answer:
  choice: A
hints:
- 把两列画成从同一原点出发的箭头．
solution: 重复的两列只给出一条方向，平行四边形退化为线段，面积为零．矩阵本身可以有许多非零元素．
feedback:
  correct: 正确．重复的两列只给出一条方向，平行四边形退化为线段，面积为零．矩阵本身可以有许多非零元素．
  incorrect: 先想一想：把两列画成从同一原点出发的箭头．
