stem: '**SPS 线性代数研讨班配套 · §2.6.3 · 2026-10-23 更新稿**


  方阵的列为 $u,v,w$。把第二列改为 $v+2u$，其余列不变，为什么行列式不变？'
choices:
- id: A
  content: 展开后多出的项为 $2\det(u,u,w)=0$
- id: B
  content: 因为行列式对整个矩阵都是线性的
- id: C
  content: 因为所有列向量的长度都没变
answer:
  choice: A
hints:
- 只对第二列使用可加性，再观察多出的项中有哪两列。
solution: 多线性给出 $\det(u,v+2u,w)=\det(u,v,w)+2\det(u,u,w)$。第二项有两列相同，因反对称性而为零，所以该列操作不改变行列式。
feedback:
  correct: 正确。多线性给出 $\det(u,v+2u,w)=\det(u,v,w)+2\det(u,u,w)$。第二项有两列相同，因反对称性而为零，所以该列操作不改变行列式。
  incorrect: 再想一想：只对第二列使用可加性，再观察多出的项中有哪两列。
  choices:
    A: 逐列线性与反对称性共同解释了这个不变量。
    B: 行列式是对每一列分别线性，不满足一般的 $\det(A+B)=\det A+\det B$。
    C: 剪切可以改变边长；保持体积不等于保持每条边的长度。
