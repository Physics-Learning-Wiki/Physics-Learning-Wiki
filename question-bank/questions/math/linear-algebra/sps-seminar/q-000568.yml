stem: '**SPS 线性代数研讨班配套 · §2.2**


  一台机器把每个输入向量都变成零向量，它是线性映射吗？'
choices:
- id: A
  content: 是，但通常会丢失信息
- id: B
  content: 不是，线性映射不能让向量消失
- id: C
  content: 是，而且一定可逆
answer:
  choice: A
hints:
- 分别检查加法和数乘，两边都是零．
solution: 零映射保持线性组合，所以是线性的．若输入空间含非零向量，不同输入都有相同输出，无法反推出输入．
feedback:
  correct: 正确．零映射保持线性组合，所以是线性的．若输入空间含非零向量，不同输入都有相同输出，无法反推出输入．
  incorrect: 先想一想：分别检查加法和数乘，两边都是零．
  choices:
    A: 零映射保持线性组合，所以是线性的．若输入空间含非零向量，不同输入都有相同输出，无法反推出输入．
    B: 这个判断不符合本题的结构．零映射保持线性组合，所以是线性的．若输入空间含非零向量，不同输入都有相同输出，无法反推出输入．
    C: 注意区分相关概念．零映射保持线性组合，所以是线性的．若输入空间含非零向量，不同输入都有相同输出，无法反推出输入．
