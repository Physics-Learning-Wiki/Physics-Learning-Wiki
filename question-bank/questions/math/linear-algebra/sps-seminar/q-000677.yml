stem: '**SPS 线性代数研讨班配套 · §2.6.6 换基与相似变换 · 2026-10-24 更新稿**


  从新坐标回到原坐标的矩阵为


  $$

  C=\begin{pmatrix}1&0\\1&1\end{pmatrix}.

  $$


  若某次计算得到输出的新坐标 $[\mathbf y]_{\mathcal B^{\prime}}=(2,-1)^{\mathsf T}$，则输出的原坐标是什么？'
