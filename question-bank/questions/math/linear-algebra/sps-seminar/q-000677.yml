choices:
- id: A
  content: $(2,-3)^{\mathsf T}$
- id: B
  content: $(2,1)^{\mathsf T}$
- id: C
  content: $(1,-1)^{\mathsf T}$
answer:
  choice: B
hints:
- 本题要从新坐标返回原坐标，直接乘 C。
solution: $[\mathbf y]_{\mathcal B}=C(2,-1)^{\mathsf T}=(2,2-1)^{\mathsf T}=(2,1)^{\mathsf T}$。两列线性组合也是同一计算。
feedback:
  correct: 正确。第二个原坐标为 2 加上负 1。
  incorrect: 再想一想：本题要从新坐标返回原坐标，直接乘 C。
  choices:
    A: 这是误用逆矩阵得到的反方向结果。
    B: 第二个原坐标为 2 加上负 1。
    C: 矩阵乘列向量时，需要按行计算每个输出分量。
