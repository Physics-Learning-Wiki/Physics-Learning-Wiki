type: single_choice
choice_order: shuffle
choices:
- id: A
  content: 同一向量改用另一组基记录，坐标可能改变
- id: B
  content: 对向量执行了一次物理旋转
- id: C
  content: 向量被乘以了新的矩阵表示，所以几何对象必然改变
answer:
  choice: A
hints:
- 区分描述方式的变化与实际执行线性变换。
solution: 换基是对同一对象重新记录坐标。只有执行所研究的变换 T 时，输入向量才按 T 变成输出；换算坐标的数值乘法本身不表示这里的几何箭头被移动。
feedback:
  correct: 正确。箭头不动、坐标记录改变，正是这一步的意义。
  incorrect: 再想一想：区分描述方式的变化与实际执行线性变换。
  choices:
    A: 箭头不动、坐标记录改变，正是这一步的意义。
    B: 网格改变不等于把箭头实际旋转。
    C: 坐标列的数值变化不必对应几何向量变化。
