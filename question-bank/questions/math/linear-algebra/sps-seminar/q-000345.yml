stem: |-
  **SPS 线性代数研讨班配套 · §2.3 函数的正交性**

  在实多项式空间上定义 $\langle p,q\rangle=\int_{-1}^{1}p(x)q(x)\,\mathrm dx$．

  判断：常数函数 $p(x)=1$ 与函数 $q(x)=x$ 在这个内积下正交，即使它们的函数图像并不是两根互相垂直的箭头．
answer:
  value: true
hints:
- 画出 y=x 在 -1 到 1 之间的图像：两侧对积分的贡献有什么关系？
solution: |-
  正交的定义是内积为零．这里

  $$
  \langle1,x\rangle=\int_{-1}^{1}x\,\mathrm dx=0.
  $$

  左半区间的负贡献与右半区间的正贡献恰好抵消，不必计算复杂积分．函数空间中的「正交」由所选内积定义，不是在函数图像的交点处量夹角．
