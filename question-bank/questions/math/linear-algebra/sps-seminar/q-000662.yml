stem: |-
  **SPS 线性代数研讨班配套 · §2.6.5 正交矩阵的行列式 · 2026-10-24 更新稿**

  实方阵 $Q$ 满足 $Q^{\mathsf T}Q=I$。为什么它的行列式只能是 $+1$ 或 $-1$？
