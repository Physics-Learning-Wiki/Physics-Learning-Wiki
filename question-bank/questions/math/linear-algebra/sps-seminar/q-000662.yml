choice_order: shuffle
choices:
- id: A
  content: 因为正交矩阵的每个元素都是 $+1$ 或 $-1$
- id: B
  content: 因为保持长度只能对应旋转，不能对应镜像
- id: C
  content: 两边取行列式可得 $(\det Q)^2=1$
answer:
  choice: C
hints:
- 结合行列式的乘法性质与转置不变性。
solution: $1=\det(Q^{\mathsf T}Q)=\det(Q^{\mathsf T})\det Q=(\det Q)^2$。因此 $\det Q=\pm1$；负号允许镜像等改变取向的正交变换。
feedback:
  correct: 正确。这个等式同时保留了两种取向。
  incorrect: 再想一想：结合行列式的乘法性质与转置不变性。
  choices:
    A: 旋转矩阵也可含正弦、余弦，元素不必是正负 1。
    B: 镜像也保持长度，是必须保留的可能性。
    C: 这个等式同时保留了两种取向。
