stem: |-
  **SPS 线性代数研讨班配套 · §2.6**

  平面中绕原点旋转 90°，面积和取向怎样变化？
choices:
- id: A
  content: 面积与取向都保持
- id: B
  content: 面积保持，取向反转
- id: C
  content: 面积变为零
answer:
  choice: A
hints:
- 旋转不会把有序基的转向翻过去．
solution: 旋转保面积，且旋转后的两个有序基方向仍有原来的取向，所以行列式为 +1．反射才翻转取向．
feedback:
