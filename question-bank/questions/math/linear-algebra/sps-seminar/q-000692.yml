choices:
- id: A
  content: $(1,-1)^{\mathsf T}$
- id: B
  content: $(1,1)^{\mathsf T}$
- id: C
  content: $(1,0)^{\mathsf T}$
answer:
  choice: A
hints:
- 求解 $(A-2I)(x,y)^{\mathsf T}=0$，两行都给出 $x+y=0$。
solution: $A-2I=\left(\begin{smallmatrix}1&1\\1&1\end{smallmatrix}\right)$，所以非零解满足 $y=-x$。选 $x=1$ 得 $(1,-1)^{\mathsf
  T}$；直接相乘也得到 $(2,-2)^{\mathsf T}=2(1,-1)^{\mathsf T}$。
feedback:
  correct: 正确。两个分量相反，满足核方程。
  incorrect: 再想一想：求解 $(A-2I)(x,y)^{\mathsf T}=0$，两行都给出 $x+y=0$。
  choices:
    A: 两个分量相反，满足核方程。
    B: 这个向量对应特征值 4，而不是 2。
    C: A 把它变成 (3,1)，不是其两倍。
