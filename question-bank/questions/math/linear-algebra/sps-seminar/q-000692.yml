stem: |-
  **SPS 线性代数研讨班配套 · §2.6.7 特征方程的充分性 · 2026-10-24 更新稿**

  矩阵

  $$
  A=\begin{pmatrix}3&1\\1&3\end{pmatrix}
  $$

  满足 $\det(A-2I)=0$。哪一个非零向量属于特征值 $2$？
