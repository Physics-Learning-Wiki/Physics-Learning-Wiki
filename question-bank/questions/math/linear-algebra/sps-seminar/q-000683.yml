type: single_choice
choice_order: shuffle
choices:
- id: A
  content: $4$ 与 $2$
- id: B
  content: $1$ 与 $0$
- id: C
  content: 只有 $8$
answer:
  choice: A
hints:
- 二阶行列式等于主对角乘积减副对角乘积。
solution: $\det(A-\lambda I_2)=(4-\lambda)(2-\lambda)-1\cdot0$，令其为零得到 $\lambda=4$ 或 $2$。行列式 $8$ 是两者之积，不是本题的特征值。
feedback:
  correct: 正确。两个因子分别为零，得到这两个根。
  incorrect: 再想一想：二阶行列式等于主对角乘积减副对角乘积。
  choices:
    A: 两个因子分别为零，得到这两个根。
    B: 非对角元素不直接给出本题的特征值。
    C: 8 是 det A，不能把行列式当作唯一特征值。
