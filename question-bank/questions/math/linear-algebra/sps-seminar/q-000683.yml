stem: |-
  **SPS 线性代数研讨班配套 · §2.6.7 特征方程、特征值与对角化 · 2026-10-24 更新稿**

  对矩阵

  $$
  A=\begin{pmatrix}4&1\\0&2\end{pmatrix},
  $$

  解 $\det(A-\lambda I_2)=0$，得到哪些特征值？
difficulty: 1
cognitive_level: apply
style: computational
