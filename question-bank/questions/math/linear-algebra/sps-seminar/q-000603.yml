stem: '**SPS 线性代数研讨班配套 · §2.6**


  把一个矩阵的第一列乘以 2，第二列保持不变，行列式怎样变化？'
choices:
- id: A
  content: 变为原来的 2 倍
- id: B
  content: 变为原来的 4 倍
- id: C
  content: 一定保持不变
answer:
  choice: A
hints:
- 只拉长平行四边形的一条生成边．
solution: 有向面积对每一列都是线性的，只缩放一列时行列式乘 2；同时缩放两列才会乘 4．
feedback:
  correct: 正确．有向面积对每一列都是线性的，只缩放一列时行列式乘 2；同时缩放两列才会乘 4．
  incorrect: 先想一想：只拉长平行四边形的一条生成边．
  choices:
    A: 有向面积对每一列都是线性的，只缩放一列时行列式乘 2；同时缩放两列才会乘 4．
