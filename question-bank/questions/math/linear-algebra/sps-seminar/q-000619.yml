stem: |-
  **SPS 线性代数研讨班配套 · §2.2.7 · 2026-10-23 更新稿**

  把横坐标压缩到原来的一半、纵坐标不变，会不可逆吗？
choices:
- id: A
  content: 不会，横向放大两倍即可恢复
- id: B
  content: 会，只要叫压缩就不可逆
- id: C
  content: 会，因为它必定压成一条线
answer:
  choice: A
hints:
- 缩短与彻底消去一个方向是两回事．
solution: 非零比例缩放没有混淆不同输入，所以仍可逆．把横坐标乘以零才完全丢掉横向信息，不能恢复．
feedback:
  correct: 正确。非零比例缩放没有混淆不同输入，所以仍可逆．把横坐标乘以零才完全丢掉横向信息，不能恢复．
  incorrect: 再想一想：缩短与彻底消去一个方向是两回事．
  choices:
    A: 非零比例缩放没有混淆不同输入，所以仍可逆．把横坐标乘以零才完全丢掉横向信息，不能恢复．
    B: 非零比例的压缩仍保留全部坐标信息；只有压掉某个方向等操作才会失去可逆性。
    C: 横坐标乘以一半后仍可取任意实数，整个平面没有变成一条线。
