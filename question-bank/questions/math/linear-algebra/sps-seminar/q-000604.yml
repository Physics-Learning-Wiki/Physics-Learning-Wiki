stem: '**SPS 线性代数研讨班配套 · §2.6**


  两个平面变换的行列式分别为 -1 和 -1，复合后取向怎样？'
choices:
- id: A
  content: 保持原取向
- id: B
  content: 仍然反转
- id: C
  content: 一定压成直线
answer:
  choice: A
hints:
- 连续翻转取向两次．
solution: 复合的行列式是乘积 (-1)×(-1)=+1，两次反转恢复取向．这不意味着复合变换必定是恒等变换．
feedback:
  correct: 正确．复合的行列式是乘积 (-1)×(-1)=+1，两次反转恢复取向．这不意味着复合变换必定是恒等变换．
  incorrect: 先想一想：连续翻转取向两次．
  choices:
    A: 复合的行列式是乘积 (-1)×(-1)=+1，两次反转恢复取向．这不意味着复合变换必定是恒等变换．
    B: 这个判断不符合本题的结构．复合的行列式是乘积 (-1)×(-1)=+1，两次反转恢复取向．这不意味着复合变换必定是恒等变换．
    C: 注意区分相关概念．复合的行列式是乘积 (-1)×(-1)=+1，两次反转恢复取向．这不意味着复合变换必定是恒等变换．
