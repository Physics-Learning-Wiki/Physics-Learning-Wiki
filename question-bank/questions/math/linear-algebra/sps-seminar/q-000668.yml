type: single_choice
choice_order: shuffle
choices:
- id: A
  content: $[\mathbf x]_{\mathcal B}=C[\mathbf x]_{\mathcal B^{\prime}}$
- id: B
  content: $[\mathbf x]_{\mathcal B^{\prime}}=C[\mathbf x]_{\mathcal B}$
- id: C
  content: $[\mathbf x]_{\mathcal B}=C^{\mathsf T}[\mathbf x]_{\mathcal B^{\prime}}$
answer:
  choice: A
hints:
- 用新基的系数对 C 的各列作线性组合。
solution: 若新坐标为 $(x^{\prime}_1,x^{\prime}_2)^{\mathsf T}$，向量就是 $x^{\prime}_1\mathbf e^{\prime}_1+x^{\prime}_2\mathbf
  e^{\prime}_2$。在原基下展开，得到 $[\mathbf x]_{\mathcal B}=C[\mathbf x]_{\mathcal B^{\prime}}$；反方向使用 $C^{-1}$。
feedback:
  correct: 正确。C 将新坐标转回原坐标。
  incorrect: 再想一想：用新基的系数对 C 的各列作线性组合。
  choices:
    A: C 将新坐标转回原坐标。
    B: 由原坐标求新坐标应使用 C 的逆。
    C: 列向量线性组合不需要转置。
