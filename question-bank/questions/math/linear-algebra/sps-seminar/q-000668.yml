stem: |-
  **SPS 线性代数研讨班配套 · §2.6.6 换基与相似变换 · 2026-10-24 更新稿**

  $C$ 的各列是新基 $\mathcal B^{\prime}$ 的基向量在原基 $\mathcal B$ 下的坐标。对同一个向量 $\mathbf x$，正确的坐标关系是哪一个？
difficulty: 1
cognitive_level: understand
style: conceptual
