stem: '**SPS 线性代数研讨班配套 · §2.1**


  在标准基中，$2(1,0)+3(0,1)$ 表示哪个向量？'
choices:
- id: A
  content: $(2,3)$
- id: B
  content: $(3,2)$
- id: C
  content: $(5,5)$
answer:
  choice: A
hints:
- 分别看横向与纵向贡献．
solution: 第一项提供横向 2，第二项提供纵向 3，合起来是 (2,3)．两个系数分别控制两条方向．
