stem: |-
  **SPS 线性代数研讨班配套 · §2.2**

  令 $A=\begin{pmatrix}1&1\\0&1\end{pmatrix}$，$B=\begin{pmatrix}1&0\\0&2\end{pmatrix}$．AB 的第一行是什么？
choices:
- id: A
  content: $(1,2)$
- id: B
  content: $(1,1)$
- id: C
  content: $(2,2)$
answer:
  choice: A
hints:
- A 的第一行分别乘 B 的两列．
solution: 第一项为 1×1+1×0=1，第二项为 1×0+1×2=2．同一行分别与两列配对，而不是逐位置相乘．
feedback:
  correct: 正确．第一项为 1×1+1×0=1，第二项为 1×0+1×2=2．同一行分别与两列配对，而不是逐位置相乘．
  incorrect: 先想一想：A 的第一行分别乘 B 的两列．
  choices:
    A: 第一项为 1×1+1×0=1，第二项为 1×0+1×2=2．同一行分别与两列配对，而不是逐位置相乘．
    B: 这个判断不符合本题的结构．第一项为 1×1+1×0=1，第二项为 1×0+1×2=2．同一行分别与两列配对，而不是逐位置相乘．
    C: 注意区分相关概念．第一项为 1×1+1×0=1，第二项为 1×0+1×2=2．同一行分别与两列配对，而不是逐位置相乘．
