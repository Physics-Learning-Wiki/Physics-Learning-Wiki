stem: '**SPS 线性代数研讨班配套 · §2.6.2 · 2026-10-23 更新稿**


  讲义用 $|A|$ 表示行列式。对于实方阵 $A$，若 $\det A=-3$，下面哪句话正确？'
choices:
- id: A
  content: $|A|=3$，因为竖线总表示绝对值
- id: B
  content: $|A|=-3$，实际体积缩放比也是 $-3$
- id: C
  content: $|A|=-3$，实际体积缩放比为 $|\det A|=3$
answer:
  choice: C
hints:
- 先区分“矩阵的行列式记号”与“一个实数的绝对值”。
solution: 这里 $|A|$ 是 $\det A$ 的另一种记号，可以是负数；对行列式这个实数再取绝对值，才得到普通体积缩放比 $|\det A|$。负号记录取向反转。
feedback:
  correct: 正确。这里 $|A|$ 是 $\det A$ 的另一种记号，可以是负数；对行列式这个实数再取绝对值，才得到普通体积缩放比 $|\det A|$。负号记录取向反转。
  incorrect: 再想一想：先区分“矩阵的行列式记号”与“一个实数的绝对值”。
  choices:
    A: 这里竖线作用于矩阵，是行列式记号；不能据此去掉结果的负号。
    B: 行列式判断正确，但普通体积缩放比不能为负。
    C: 行列式保留取向符号，普通体积使用其绝对值。
