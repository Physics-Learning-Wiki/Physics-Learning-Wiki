type: single_choice
choice_order: shuffle
choices:
- id: A
  content: $\begin{pmatrix}3-\lambda&1-\lambda\\-\lambda&2-\lambda\end{pmatrix}$
- id: B
  content: $\begin{pmatrix}3-\lambda&1\\0&2-\lambda\end{pmatrix}$
- id: C
  content: $\begin{pmatrix}3\lambda&\lambda\\0&2\lambda\end{pmatrix}$
answer:
  choice: B
hints:
- λ 乘的是单位矩阵，所以只改变对角元素。
solution: $\lambda I_2=\left(\begin{smallmatrix}\lambda&0\\0&\lambda\end{smallmatrix}\right)$。逐项相减，只在 A 的两个对角位置减
  λ，非对角位置保持不变。
feedback:
  correct: 正确。单位矩阵只有对角元素非零。
  incorrect: 再想一想：λ 乘的是单位矩阵，所以只改变对角元素。
  choices:
    A: 不能把 λ 从每一个元素中都减掉。
    B: 单位矩阵只有对角元素非零。
    C: 移项使用减法，不是把整个矩阵乘以 λ。
