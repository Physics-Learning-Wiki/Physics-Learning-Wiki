stem: '**SPS 线性代数研讨班配套 · §2.6.3 与附录 A · 2026-10-23 更新稿**


  交换一个可逆 $3\times3$ 实矩阵的两列后，由列向量张成的平行六面体普通体积改变吗？'
choices:
- id: A
  content: 不改变，但有向体积变号
- id: B
  content: 普通体积也取相反数
- id: C
  content: 普通体积必定变为零
answer:
  choice: A
hints:
- 交换的是三条生成边的排列顺序．
solution: 三条生成边还是原来的三条，因此点集与普通体积不变；交换两列使有序三元组的取向反转，行列式变号．
feedback:
  correct: 正确。三条生成边还是原来的三条，因此点集与普通体积不变；交换两列使有序三元组的取向反转，行列式变号．
  incorrect: 再想一想：交换的是三条生成边的排列顺序．
  choices:
    A: 三条生成边还是原来的三条，因此点集与普通体积不变；交换两列使有序三元组的取向反转，行列式变号．
    B: 普通体积取行列式的绝对值，不会因交换生成边的顺序而变成负数。
    C: 交换列不改变列向量是否线性无关，原来非退化的平行六面体不会因此压扁。
