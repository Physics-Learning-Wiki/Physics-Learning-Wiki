stem: '**SPS 线性代数研讨班配套 · §2.6 行列式为零的图像**


  矩阵


  $$

  C=\begin{pmatrix}1&2\\1&2\end{pmatrix}

  $$


  的第二列是第一列的两倍．无需展开行列式，想象单位正方形的两条边变换后会怎样：哪种描述正确？'
choices:
- id: A
  content: 正方形的像仍有非零面积，因为矩阵不是零矩阵．
- id: B
  content: 所有向量都变成零，因为两列相关．
- id: C
  content: 正方形的像压成线段，行列式为零，而且有输入信息丢失．
answer:
  choice: C
hints:
- 如果两条边指向同一条直线，还能围出非零面积吗？
solution: '两根基箭头的像都沿着 $(1,1)^{\mathsf T}$ 方向，因此正方形的像压成一条线段，普通面积为零，行列式也为零．


  一般输入的输出为 $C(x,y)^{\mathsf T}=(x+2y,x+2y)^{\mathsf T}$，整个平面的像是一条直线，秩为 $1$．不同输入会重合，例如 $(2,0)$ 与 $(0,1)$ 都变成 $(2,2)$，所以不能唯一恢复输入．'
feedback:
  correct: 已抓住本题的关键；可以再用自己的话解释一次．
  incorrect: 先展开提示，想清楚对象与操作，再对照解析检查．
  choices:
    A: 非零矩阵仍可能把整个平面压到一条直线．
    B: 线性相关只说明丢失了一个独立方向；例如第一列本身仍非零．
    C: 两列共线，二维面积消失，且不同输入可以有相同输出．
