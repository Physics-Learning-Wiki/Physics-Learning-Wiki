stem: '**SPS 线性代数研讨班配套 · §2.2**


  单位矩阵 I 的几何作用是什么？'
choices:
- id: A
  content: 每个向量保持原样
- id: B
  content: 每个向量变成单位长度
- id: C
  content: 每个向量变成零
answer:
  choice: A
hints:
- 单位矩阵的每一列就是相应标准基向量．
solution: I 保留所有基方向及其倍数，所以 Iv=v．名称中的单位不意味着把长度归一化．
feedback:
  correct: 正确．I 保留所有基方向及其倍数，所以 Iv=v．名称中的单位不意味着把长度归一化．
  incorrect: 先想一想：单位矩阵的每一列就是相应标准基向量．
  choices:
    A: I 保留所有基方向及其倍数，所以 Iv=v．名称中的单位不意味着把长度归一化．
    B: 这个判断不符合本题的结构．I 保留所有基方向及其倍数，所以 Iv=v．名称中的单位不意味着把长度归一化．
    C: 注意区分相关概念．I 保留所有基方向及其倍数，所以 Iv=v．名称中的单位不意味着把长度归一化．
