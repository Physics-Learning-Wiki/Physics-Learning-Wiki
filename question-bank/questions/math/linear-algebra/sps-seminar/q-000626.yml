stem: '**SPS 线性代数研讨班配套 · §2.6 与附录 A · 2026-10-23 更新稿**


  三维变换把所有向量压到一个平面里，为什么行列式为零？'
choices:
- id: A
  content: 立方体的像没有三维体积
- id: B
  content: 平面上每个向量必定变成零
- id: C
  content: 所有矩阵元素必须为零
answer:
  choice: A
hints:
- 想象一只立体盒子被完全压平．
solution: 输出可以仍有非零面积和许多非零向量，但厚度为零，因此三维体积为零．行列式为零不要求矩阵的每个元素为零．
feedback:
  correct: 正确。输出可以仍有非零面积和许多非零向量，但厚度为零，因此三维体积为零．行列式为零不要求矩阵的每个元素为零．
  incorrect: 再想一想：想象一只立体盒子被完全压平．
  choices:
    A: 输出可以仍有非零面积和许多非零向量，但厚度为零，因此三维体积为零．行列式为零不要求矩阵的每个元素为零．
    B: 压到平面只说明丢掉了至少一个方向的信息，平面内仍可以存在非零的输出向量。
    C: 例如 $\operatorname{diag}(1,1,0)$ 把空间投影到平面，只有一个对角元为零，行列式仍为零。
