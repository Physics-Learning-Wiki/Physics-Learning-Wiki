stem: |-
  **SPS 线性代数研讨班配套 · §2.3**

  两个非零向量的欧氏点积为负，夹角处于什么范围？
choices:
- id: A
  content: 大于 90°，不超过 180°
- id: B
  content: 小于 90°
- id: C
  content: 必定等于 90°
answer:
  choice: A
hints:
- 点积的符号由夹角余弦决定．
solution: 长度乘积为正，点积为负意味着余弦为负，夹角在 (90°,180°]．垂直时点积才是零．
feedback:
  correct: 正确．长度乘积为正，点积为负意味着余弦为负，夹角在 (90°,180°]．垂直时点积才是零．
