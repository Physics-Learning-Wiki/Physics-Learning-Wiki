    B: 这个判断不符合本题的结构．长度乘积为正，点积为负意味着余弦为负，夹角在 (90°,180°]．垂直时点积才是零．
    C: 注意区分相关概念．长度乘积为正，点积为负意味着余弦为负，夹角在 (90°,180°]．垂直时点积才是零．
