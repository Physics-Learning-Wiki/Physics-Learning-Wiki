choices:
- id: A
  content: $2$
- id: B
  content: $-2$
- id: C
  content: $-1/2$
answer:
  choice: C
hints:
- 对 $AA^{-1}=I$ 取行列式。
solution: $1=\det(AA^{-1})=\det A\det(A^{-1})$，因此 $\det(A^{-1})=-1/2$。逆变换恢复原体积，同时抵消原变换的取向改变。
feedback:
  correct: 正确。负数的倒数仍为负数。
  incorrect: 再想一想：对 $AA^{-1}=I$ 取行列式。
  choices:
    A: 取倒数不会把负号去掉。
    B: 逆变换的缩放因子应与原因子相乘为 1。
    C: 负数的倒数仍为负数。
