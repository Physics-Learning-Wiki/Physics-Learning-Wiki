stem: '**SPS 线性代数研讨班配套 · §2.6.5 逆矩阵的行列式 · 2026-10-24 更新稿**


  可逆实矩阵 $A$ 满足 $\det A=-2$，那么 $\det(A^{-1})$ 是多少？'
