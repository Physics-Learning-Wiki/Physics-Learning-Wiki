stem: '**SPS 线性代数研讨班配套 · §2.1**


  次数不超过 1 的实系数多项式中，零多项式扮演什么角色？'
choices:
- id: A
  content: 向量加法的零元
- id: B
  content: 额外的一条基方向
- id: C
  content: 不是这个空间的元素
answer:
  choice: A
hints:
- 把它与任意多项式相加．
solution: 任意多项式加零多项式保持不变，这正是零向量的作用．零多项式不是独立的基方向．
feedback:
