type: single_choice
choice_order: shuffle
choices:
- id: A
  content: 沿原直线反向，长度变为原来的 2 倍
- id: B
  content: 没有特征值，因为特征值必须为正
- id: C
  content: 向量被旋转了 90°
answer:
  choice: A
hints:
- 负数倍仍与原向量共线，但箭头反向。
solution: 特征向量对应的不一定是正向拉伸。这里特征值为 $-2$，输出与输入共线且方向相反，长度乘以 $|-2|=2$。
feedback:
  correct: 正确。负号控制朝向，绝对值控制长度。
  incorrect: 再想一想：负数倍仍与原向量共线，但箭头反向。
  choices:
    A: 负号控制朝向，绝对值控制长度。
    B: 实特征值可以为负，也可以为零。
    C: 乘以实标量不会把非零向量转到垂直方向。
