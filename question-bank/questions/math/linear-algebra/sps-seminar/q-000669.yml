stem: |-
  **SPS 线性代数研讨班配套 · §2.6.6 换基与相似变换 · 2026-10-24 更新稿**

  原基为 $\mathcal B=(\mathbf e_1,\mathbf e_2)$，新基为 $\mathcal B^{\prime}=(\mathbf e_1,\mathbf e_1+\mathbf e_2)$。向量 $\mathbf x=3\mathbf e_1+2\mathbf e_2$ 的新坐标是多少？
