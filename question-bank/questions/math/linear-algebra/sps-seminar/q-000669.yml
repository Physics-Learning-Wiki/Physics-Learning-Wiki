hints:
- 写成 $a\mathbf e_1+b(\mathbf e_1+\mathbf e_2)$，再比较系数。
solution: 比较 $a+b=3$ 与 $b=2$，得到 $a=1$。因此 $[\mathbf x]_{\mathcal B^{\prime}}=(1,2)^{\mathsf T}$。这两个新系数组合出的仍是原向量。
feedback:
  correct: 正确。代回新基展开式，恰好得到原向量。
  incorrect: 再想一想：写成 $a\mathbf e_1+b(\mathbf e_1+\mathbf e_2)$，再比较系数。
  choices:
    A: 基变了，同一向量的坐标通常随之改变。
    B: 这是把原坐标误当成新坐标后再乘 C 的结果。
    C: 代回新基展开式，恰好得到原向量。
