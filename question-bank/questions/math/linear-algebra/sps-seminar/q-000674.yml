type: single_choice
choice_order: shuffle
choices:
- id: A
  content: 能，行列式相同就代表同一个线性变换
- id: B
  content: 不能；任意可逆 C 都满足 $C^{-1}I_2C=I_2$，不可能变成 B
- id: C
  content: 不能，因为 B 不可逆
answer:
  choice: B
hints:
- 先判断恒等变换换基后会变成什么。
solution: 相似矩阵的行列式相同，但反过来不成立。恒等矩阵在任意基下仍为恒等矩阵，$C^{-1}I_2C=I_2\ne B$。B 本身是可逆的。
feedback:
  correct: 正确。恒等矩阵的相似变换给出了直接反例。
  incorrect: 再想一想：先判断恒等变换换基后会变成什么。
  choices:
    A: 同一行列式只记录一个数，不能确定整个线性变换。
    B: 恒等矩阵的相似变换给出了直接反例。
    C: B 的行列式为 1，所以它可逆。
