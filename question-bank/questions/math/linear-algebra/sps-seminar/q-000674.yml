stem: |-
  **SPS 线性代数研讨班配套 · §2.6.6 换基与相似变换 · 2026-10-24 更新稿**

  两个二阶矩阵 $A=I_2$ 与 $B=\operatorname{diag}(2,1/2)$ 的行列式都为 $1$。能否因此断定它们相似？
difficulty: 1
cognitive_level: understand
style: conceptual
