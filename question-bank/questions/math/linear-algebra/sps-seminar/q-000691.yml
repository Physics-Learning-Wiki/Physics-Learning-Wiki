stem: '**SPS 线性代数研讨班配套 · §2.6.7 特征方程的充分性 · 2026-10-24 更新稿**


  设 $A$ 是实方阵，实数 $\lambda$ 满足 $\det(A-\lambda I)=0$。为什么这能保证存在非零实特征向量？'
difficulty: 1
cognitive_level: understand
style: conceptual
estimated_seconds: 60
