  type: original
  note: '对应张梓超《SPS线性代数研讨班第一、二讲》2026-10-24 本地更新稿 §2.6.7 特征方程的充分性；源文件 SHA-256: e61eb903d56eaa5d46e8509d1f1246fe91e77800413f5f1b3259be31d8a1a2bd。题目、提示与解析独立编写，仅按教学范围组织，未转载讲义文字或图像。'
