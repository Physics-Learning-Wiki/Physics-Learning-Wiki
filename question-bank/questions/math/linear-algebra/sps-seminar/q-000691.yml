type: single_choice
choice_order: shuffle
choices:
- id: A
  content: 因为 $A-\lambda I$ 必须是零矩阵
- id: B
  content: 因为 $A-\lambda I$ 的列线性相关，存在非零系数列 $\mathbf c$ 使 $(A-\lambda I)\mathbf c=0$
- id: C
  content: 因为行列式为零就表示每一列都是零列
answer:
  choice: B
hints:
- 线性相关意味着存在一组不全为零的线性组合系数。
solution: 行列式为零说明 $A-\lambda I$ 的列线性相关。取不全为零的组合系数组成 $\mathbf c$，则 $(A-\lambda I)\mathbf c=0$，所以 $A\mathbf c=\lambda\mathbf
  c$ 且 $\mathbf c\ne0$。这就是所需特征向量的坐标。
feedback:
  correct: 正确。列的相关系数直接给出一个非零核向量。
  incorrect: 再想一想：线性相关意味着存在一组不全为零的线性组合系数。
  choices:
    A: 奇异矩阵不一定是零矩阵，只需有非平凡的核。
    B: 列的相关系数直接给出一个非零核向量。
    C: 列之间可以相互依赖，而不必任何一列为零。
