stem: '**SPS 线性代数研讨班配套 · §2.1**


  过原点的一条直线，采用通常的加法和实数数乘，是实向量空间吗？'
choices:
- id: A
  content: 是，因为相加和数乘都留在直线上
- id: B
  content: 不是，因为它不是整个平面
- id: C
  content: 不是，因为直线只允许正方向
answer:
  choice: A
hints:
- 考虑反向、缩放和首尾相接．
solution: 所有向量都可写成同一非零向量的实数倍，相加和数乘仍有这种形式，也包含零向量．向量空间不必是整个平面．
feedback:
  correct: 正确．所有向量都可写成同一非零向量的实数倍，相加和数乘仍有这种形式，也包含零向量．向量空间不必是整个平面．
  incorrect: 先想一想：考虑反向、缩放和首尾相接．
