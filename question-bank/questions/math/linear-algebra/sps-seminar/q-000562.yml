    B: 这个判断不符合本题的结构．所有向量都可写成同一非零向量的实数倍，相加和数乘仍有这种形式，也包含零向量．向量空间不必是整个平面．
    C: 注意区分相关概念．所有向量都可写成同一非零向量的实数倍，相加和数乘仍有这种形式，也包含零向量．向量空间不必是整个平面．
