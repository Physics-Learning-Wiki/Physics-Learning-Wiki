stem: |-
  **SPS 线性代数研讨班配套 · §2.2**

  令 $A=\begin{pmatrix}0&1\\1&0\end{pmatrix}$，求 $A(2,-1)^{\mathsf T}$．
choices:
- id: A
  content: $(-1,2)^{\mathsf T}$
- id: B
  content: $(2,-1)^{\mathsf T}$
- id: C
  content: $(-2,1)^{\mathsf T}$
answer:
  choice: A
hints:
- 这两行分别取走输入的哪个分量？
solution: 第一行取第二个分量 -1，第二行取第一个分量 2；矩阵交换两个坐标，没有把它们全部取负．
feedback:
  correct: 正确．第一行取第二个分量 -1，第二行取第一个分量 2；矩阵交换两个坐标，没有把它们全部取负．
  incorrect: 先想一想：这两行分别取走输入的哪个分量？
  choices:
    A: 第一行取第二个分量 -1，第二行取第一个分量 2；矩阵交换两个坐标，没有把它们全部取负．
