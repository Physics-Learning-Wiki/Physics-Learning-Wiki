stem: '**SPS 线性代数研讨班配套 · §2.5**


  为什么不能给把平面压到 x 轴的投影找到一个恢复所有输入的逆矩阵？'
choices:
- id: A
  content: 不同输入产生同一输出，无法知道原来的高度
- id: B
  content: 因为矩阵中只要有零就不可逆
- id: C
  content: 因为所有矩阵都不可逆
answer:
  choice: A
hints:
- 比较高度不同但横坐标相同的点．
solution: (x,1) 与 (x,2) 的投影一样，恢复时没有办法区分．真正的障碍是信息丢失；单位矩阵也含零但可逆．
feedback:
  correct: 正确．(x,1) 与 (x,2) 的投影一样，恢复时没有办法区分．真正的障碍是信息丢失；单位矩阵也含零但可逆．
  incorrect: 先想一想：比较高度不同但横坐标相同的点．
  choices:
    A: (x,1) 与 (x,2) 的投影一样，恢复时没有办法区分．真正的障碍是信息丢失；单位矩阵也含零但可逆．
    B: 这个判断不符合本题的结构．(x,1) 与 (x,2) 的投影一样，恢复时没有办法区分．真正的障碍是信息丢失；单位矩阵也含零但可逆．
    C: 注意区分相关概念．(x,1) 与 (x,2) 的投影一样，恢复时没有办法区分．真正的障碍是信息丢失；单位矩阵也含零但可逆．
