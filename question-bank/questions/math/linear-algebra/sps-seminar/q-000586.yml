stem: '**SPS 线性代数研讨班配套 · §2.4**


  矩阵 $\begin{pmatrix}1&2\\3&4\end{pmatrix}$ 转置后，第一行是什么？'
choices:
- id: A
  content: $(1,3)$
- id: B
  content: $(1,2)$
- id: C
  content: $(4,2)$
answer:
  choice: A
hints:
- 原来的第一列变成第一行．
solution: 转置交换行列位置，第一列 (1,3) 变成第一行；它不是把行顺序倒过来．
feedback:
  correct: 正确．转置交换行列位置，第一列 (1,3) 变成第一行；它不是把行顺序倒过来．
  incorrect: 先想一想：原来的第一列变成第一行．
  choices:
    A: 转置交换行列位置，第一列 (1,3) 变成第一行；它不是把行顺序倒过来．
    B: 这个判断不符合本题的结构．转置交换行列位置，第一列 (1,3) 变成第一行；它不是把行顺序倒过来．
    C: 注意区分相关概念．转置交换行列位置，第一列 (1,3) 变成第一行；它不是把行顺序倒过来．
