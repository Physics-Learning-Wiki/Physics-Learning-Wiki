type: single_choice
choice_order: shuffle
choices:
- id: A
  content: 不是特征向量，因为输出是零
- id: B
  content: 是特征向量，对应的特征值为 1
- id: C
  content: 是特征向量，对应的特征值为 0
answer:
  choice: C
hints:
- 检查是否满足 $A\mathbf v=0\mathbf v$；注意输入不为零。
solution: $A\mathbf v=\mathbf0=0\mathbf v$，且 $\mathbf v\ne\mathbf0$，所以它是特征值 $0$ 的特征向量。零特征值表示某个非零方向被压到零。
feedback:
  correct: 正确。零特征值对应非平凡的核。
  incorrect: 再想一想：检查是否满足 $A\mathbf v=0\mathbf v$；注意输入不为零。
  choices:
    A: 定义要求输入向量非零，输出可以为零。
    B: 特征值 1 要求输出等于输入，这里不成立。
    C: 零特征值对应非平凡的核。
