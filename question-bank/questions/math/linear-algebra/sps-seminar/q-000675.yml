stem: '**SPS 线性代数研讨班配套 · §2.6.6 换基与相似变换 · 2026-10-24 更新稿**


  同一个平面旋转，在标准正交归一基下的矩阵满足 $A^{\mathsf T}A=I$。换到任意斜基后，关于新矩阵 $A^{\prime}$，哪种说法正确？'
