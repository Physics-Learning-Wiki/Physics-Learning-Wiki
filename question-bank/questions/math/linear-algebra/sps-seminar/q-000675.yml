type: single_choice
choice_order: shuffle
choices:
- id: A
  content: 仍然必有 $(A^{\prime})^{\mathsf T}A^{\prime}=I$，因为矩阵元素不受基影响
- id: B
  content: 如果新矩阵不满足该等式，旋转就不再保持几何长度
- id: C
  content: 几何旋转仍保持长度，但新坐标的通常平方和未必表示几何长度，故该矩阵等式不必保持
answer:
  choice: C
hints:
- 斜基的坐标轴不垂直时，不能直接用坐标平方和计算几何长度。
solution: 旋转是否保持几何长度，与选择哪组基无关。然而矩阵的普通转置条件使用标准坐标内积；在任意斜基中，坐标平方和通常不等于原空间的长度平方，所以新矩阵不必满足该等式。
feedback:
  correct: 正确。必须区分几何内积与任意坐标列的普通点积。
  incorrect: 再想一想：斜基的坐标轴不垂直时，不能直接用坐标平方和计算几何长度。
  choices:
    A: 矩阵表示依赖基，普通转置条件也不能直接搬到任意斜基。
    B: 改变记录方式不会破坏原几何旋转的长度保持性。
    C: 必须区分几何内积与任意坐标列的普通点积。
