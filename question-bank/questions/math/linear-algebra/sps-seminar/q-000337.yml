stem: |-
  **SPS 线性代数研讨班配套 · §2.2 矩阵乘法的尺寸**

  $A$ 是 $2\times3$ 矩阵，$B$ 是 $3\times1$ 矩阵．哪句话正确？先想输入、输出之间能否接上．
choices:
- id: A
  content: $AB$ 是 $2\times1$，$BA$ 未定义．
- id: B
  content: $AB$ 是 $3\times3$，$BA$ 是 $1\times2$．
- id: C
  content: 两种乘法都可以，因为两个矩阵都含有数字 3．
answer:
  choice: A
hints:
- 矩阵作用在列向量上；先做右边的映射，再做左边的映射．
solution: $B$ 把一个数（$\mathbb R^1$ 中的列向量）变成三分量列向量，$A$ 再把它变成两分量列向量，因此 $AB$ 是 $2\times1$．反过来，$A$ 的两个输出分量不能直接送进只接收一个分量的
  $B$，所以 $BA$ 未定义．对应尺寸规则是 $(2\times3)(3\times1)\to2\times1$．
feedback:
  correct: 已抓住本题的关键；可以再用自己的话解释一次．
  incorrect: 先展开提示，想清楚对象与操作，再对照解析检查．
  choices:
    A: 中间尺寸 3 接上了；反向相乘时中间的 1 和 2 接不上．
    B: 乘积的外侧尺寸来自左矩阵行数、右矩阵列数，且须先检查中间尺寸．
    C: 共享一个尺寸数字不够，必须是左列数等于右行数．
