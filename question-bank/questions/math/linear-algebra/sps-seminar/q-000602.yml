stem: |-
  **SPS 线性代数研讨班配套 · §2.6**

  将平面中的所有向量都乘以 2，单位正方形面积变为多少？
choices:
- id: A
  content: $4$
- id: B
  content: $2$
- id: C
  content: $8$
answer:
  choice: A
hints:
- 两条边都变长，而非只改一条．
solution: 边长从 1、1 变成 2、2，面积变为 4．二维面积随统一长度比例的平方变化．
