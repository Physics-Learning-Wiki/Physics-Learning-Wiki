stem: |-
  **SPS 线性代数研讨班配套 · §2.2 线性映射的定义**

  把整个平面向右平移两格：$T(x,y)=(x+2,y)$．它是从 $\mathbb R^2$ 到自身的线性映射吗？
choices:
- id: A
  content: 是，因为直线平移后还是直线．
- id: B
  content: 是，因为每个点都移动相同距离．
- id: C
  content: 不是，因为零向量被送到了非零向量．
answer:
  choice: C
hints:
- 只需跟踪原点，不必检查所有向量．
solution: 不是．线性映射必须满足 $T(\mathbf0)=\mathbf0$，而这里 $T(0,0)=(2,0)$．平移保留了许多熟悉的几何形状，但它把「没有位移」送成了一个非零向量，因此不保留向量空间的线性结构．
feedback:
  correct: 已抓住本题的关键；可以再用自己的话解释一次．
  incorrect: 先展开提示，想清楚对象与操作，再对照解析检查．
  choices:
    A: 直线仍是直线并不足以说明映射线性．
    B: 统一平移仍会移动零向量．
    C: 线性映射固定零向量，平移不满足这一必要条件．
