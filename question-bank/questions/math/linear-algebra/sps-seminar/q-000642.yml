stem: |-
  **SPS 线性代数研讨班配套 · §2.6.3 · 2026-10-23 更新稿**

  二维行列式 $\det(u+w,v+z)$ 按两列分别展开，正确的是哪一项？
choices:
- id: A
  content: $\det(u,v)+\det(w,z)$
- id: B
  content: $\det(u,v)+\det(u,z)+\det(w,v)+\det(w,z)$
- id: C
  content: $\det(u,v)+\det(u,z)+\det(v,w)+\det(w,z)$
answer:
  choice: B
hints:
- 每一项从第一列、第二列各选一个加数，而且不能调换列的位置。
solution: 先固定第二列拆第一列，再分别拆每项的第二列，得到四项。交叉项不能省略；其中第一列选 $w$、第二列选 $v$ 时得到的是 $\det(w,v)$。
feedback:
  correct: 正确。先固定第二列拆第一列，再分别拆每项的第二列，得到四项。交叉项不能省略；其中第一列选 $w$、第二列选 $v$ 时得到的是 $\det(w,v)$。
  incorrect: 再想一想：每一项从第一列、第二列各选一个加数，而且不能调换列的位置。
  choices:
    A: 这漏掉了两个交叉项；两列同时相加不会只产生两项。
    B: 四种选取都保留了原来的列顺序。
    C: 第三项把列顺序调换了，$\det(v,w)=-\det(w,v)$，一般会改变结果。
