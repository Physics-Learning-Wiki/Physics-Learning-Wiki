    points: 1
reference_answer: 能覆盖整个 $\mathbb R^2$；不能唯一恢复输入．例如 $(1,2,0)$ 与 $(1,2,5)$ 的输出都为 $(1,2)$，高度信息丢失．
hints:
- 把同一竖直线上的两个点投影到地面，影子会在哪里？
solution: |-
  任意平面点 $(a,b)$ 都可以由 $(a,b,0)$ 得到，所以像就是整个目标空间 $\mathbb R^2$，秩为 $2$．

  但 $(1,2,0)$ 与 $(1,2,5)$ 都变成 $(1,2)$，输出中没有高度信息．所有 $(0,0,z)$ 都被送到零向量，它们组成核．像占满目标空间与输入能否唯一恢复，是两个不同问题．
