stem: |-
  **SPS 线性代数研讨班配套 · §2.2 投影、像与信息丢失**

  从俯视图看一个三维点，只保留水平坐标：$Q:\mathbb R^3\to\mathbb R^2$，$Q(x,y,z)=(x,y)$．

  不必写矩阵，用一两句话回答：输出能覆盖整个 $\mathbb R^2$ 吗？仅凭输出能唯一恢复三维输入吗？给出两个输出相同的不同输入．
