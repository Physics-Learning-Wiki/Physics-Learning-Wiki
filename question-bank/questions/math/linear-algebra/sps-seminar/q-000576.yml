stem: |-
  **SPS 线性代数研讨班配套 · §2.2**

  一个二维线性变换把两个标准基向量都送到同一支非零箭头，整个平面会怎样？
choices:
- id: A
  content: 被压到一条直线上
- id: B
  content: 仍完整覆盖整个平面
- id: C
  content: 所有向量都必定变成零
answer:
  choice: A
hints:
- 任意输出都是这同一支箭头的倍数．
solution: 若两列同为 w，输出是 (x+y)w，只有一条方向；并非所有输出都为零，但信息已经丢失．
feedback:
  correct: 正确．若两列同为 w，输出是 (x+y)w，只有一条方向；并非所有输出都为零，但信息已经丢失．
  incorrect: 先想一想：任意输出都是这同一支箭头的倍数．
  choices:
    A: 若两列同为 w，输出是 (x+y)w，只有一条方向；并非所有输出都为零，但信息已经丢失．
    B: 这个判断不符合本题的结构．若两列同为 w，输出是 (x+y)w，只有一条方向；并非所有输出都为零，但信息已经丢失．
    C: 注意区分相关概念．若两列同为 w，输出是 (x+y)w，只有一条方向；并非所有输出都为零，但信息已经丢失．
