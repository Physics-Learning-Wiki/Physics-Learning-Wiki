stem: '**SPS 线性代数研讨班配套 · §2.2.7 · 2026-10-23 更新稿**


  剪切 $T(x,y)=(x+2y,y)$ 后得到 (7,2)，原来的输入是什么？'
choices:
- id: A
  content: (3,2)
- id: B
  content: (11,2)
- id: C
  content: (7,0)
answer:
  choice: A
hints:
- 第二个坐标保留着；从第一个坐标减去它的两倍．
solution: 输出的 y=2，所以原来的 x=7-2×2=3．代回得到 (3+4,2)=(7,2)；再加一次剪切会得到 11，不是在撤销．
feedback:
  correct: 正确。输出的 y=2，所以原来的 x=7-2×2=3．代回得到 (3+4,2)=(7,2)；再加一次剪切会得到 11，不是在撤销．
  incorrect: 再想一想：第二个坐标保留着；从第一个坐标减去它的两倍．
  choices:
    A: 输出的 y=2，所以原来的 x=7-2×2=3．代回得到 (3+4,2)=(7,2)；再加一次剪切会得到 11，不是在撤销．
    B: $11=7+2\times2$ 是再做一次同方向剪切；逆操作应减去 $2y$。
    C: 剪切保持第二坐标，因此输入的第二坐标仍是 $2$，不能改成 $0$。
