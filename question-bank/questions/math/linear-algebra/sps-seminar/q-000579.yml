stem: '**SPS 线性代数研讨班配套 · §2.2**


  求 $\begin{pmatrix}1&0\\0&2\end{pmatrix}+\begin{pmatrix}0&1\\1&0\end{pmatrix}$．'
choices:
- id: A
  content: $\begin{pmatrix}1&1\\1&2\end{pmatrix}$
- id: B
  content: $\begin{pmatrix}0&0\\0&0\end{pmatrix}$
- id: C
  content: $\begin{pmatrix}1&2\\2&2\end{pmatrix}$
answer:
  choice: A
hints:
- 矩阵加法把相同位置的元素相加．
solution: 四个位置依次为 1+0、0+1、0+1、2+0，得到第一行 (1,1)、第二行 (1,2)．这里无需行乘列．
feedback:
  correct: 正确．四个位置依次为 1+0、0+1、0+1、2+0，得到第一行 (1,1)、第二行 (1,2)．这里无需行乘列．
  incorrect: 先想一想：矩阵加法把相同位置的元素相加．
  choices:
    A: 四个位置依次为 1+0、0+1、0+1、2+0，得到第一行 (1,1)、第二行 (1,2)．这里无需行乘列．
    B: 这个判断不符合本题的结构．四个位置依次为 1+0、0+1、0+1、2+0，得到第一行 (1,1)、第二行 (1,2)．这里无需行乘列．
    C: 注意区分相关概念．四个位置依次为 1+0、0+1、0+1、2+0，得到第一行 (1,1)、第二行 (1,2)．这里无需行乘列．
