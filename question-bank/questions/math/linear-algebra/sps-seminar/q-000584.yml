stem: |-
  **SPS 线性代数研讨班配套 · §2.5**

  先左右镜面反射，再做同一次反射，结果是什么？
choices:
- id: A
  content: 回到原向量
- id: B
  content: 所有向量变为零
- id: C
  content: 每个向量长度加倍
answer:
  choice: A
hints:
- 横坐标连续变号两次．
solution: 一次反射把 x 变成 -x，两次变成 x，纵坐标不变．所以该反射是自己的逆操作．
