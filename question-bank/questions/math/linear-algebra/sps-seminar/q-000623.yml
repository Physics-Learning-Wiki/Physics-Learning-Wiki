stem: |-
  **SPS 线性代数研讨班配套 · §2.6 与附录 A · 2026-10-23 更新稿**

  在 $\mathbb R^3$ 的标准直角坐标系中，用实矩阵 $A$ 作用于向量。它的三列是三条标准基向量的像；单位立方体的像是什么？
choices:
- id: A
  content: 由这三条向量张成的平行六面体，可能退化
- id: B
  content: 总是三条边两两垂直的长方体
- id: C
  content: 三个互不相关的平面图形
answer:
  choice: A
hints:
- 线性映射把立方体内的线性组合一起送过去．
solution: 单位立方体中的点可写成三个标准基向量的组合，系数在 0 到 1 之间；输出是三列的相同组合，形成平行六面体，不保证直角，也可能被压扁．
feedback:
  correct: 正确。单位立方体中的点可写成三个标准基向量的组合，系数在 0 到 1 之间；输出是三列的相同组合，形成平行六面体，不保证直角，也可能被压扁．
  incorrect: 再想一想：线性映射把立方体内的线性组合一起送过去．
  choices:
    A: 单位立方体中的点可写成三个标准基向量的组合，系数在 0 到 1 之间；输出是三列的相同组合，形成平行六面体，不保证直角，也可能被压扁．
    B: 线性变换不一定保持直角；例如剪切会让立方体变成斜的平行六面体。
    C: 三个列向量要用同一组三个系数组合，联合描述整个立方体的像，不能分成三个独立平面图形。
