stem: '**SPS 线性代数研讨班配套 · §2.3**


  在标准欧氏内积下，$(1,2)\cdot(2,-1)$ 等于多少？'
choices:
- id: A
  content: $0$
- id: B
  content: $4$
- id: C
  content: $-4$
answer:
  choice: A
hints:
- 对应分量相乘再相加．
solution: 1×2+2×(-1)=2-2=0，正负贡献抵消．两个非零向量可以具有零点积，这里它们互相垂直．
feedback:
