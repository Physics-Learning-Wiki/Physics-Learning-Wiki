stem: '**SPS 线性代数研讨班配套 · §2.2**


  对于列向量 v，ABv 对应怎样的操作顺序？'
choices:
- id: A
  content: 先 B，再 A
- id: B
  content: 先 A，再 B
- id: C
  content: A 和 B 必须同时作用
answer:
  choice: A
hints:
- 从离输入最近的操作开始．
solution: ABv=A(Bv)，先由 B 产生中间输出，再交给 A．矩阵书写顺序与口头叙述的先后相反．
feedback:
  correct: 正确．ABv=A(Bv)，先由 B 产生中间输出，再交给 A．矩阵书写顺序与口头叙述的先后相反．
  incorrect: 先想一想：从离输入最近的操作开始．
  choices:
    A: ABv=A(Bv)，先由 B 产生中间输出，再交给 A．矩阵书写顺序与口头叙述的先后相反．
    B: 这个判断不符合本题的结构．ABv=A(Bv)，先由 B 产生中间输出，再交给 A．矩阵书写顺序与口头叙述的先后相反．
    C: 注意区分相关概念．ABv=A(Bv)，先由 B 产生中间输出，再交给 A．矩阵书写顺序与口头叙述的先后相反．
