type: single_choice
choice_order: shuffle
choices:
- id: A
  content: $\det A^{\prime}=4$，因为换基去掉了负号
- id: B
  content: $\det A^{\prime}$ 取决于 $\det C$ 的大小
- id: C
  content: $\det A^{\prime}=-4$
answer:
  choice: C
hints:
- 对三个因子的乘积取行列式。
solution: $\det A^{\prime}=\det(C^{-1})\det A\det C=\det A=-4$。换基前后表示同一变换，其行列式相同；C 的因子在往返中相消。
feedback:
  correct: 正确。相似变换保持行列式。
  incorrect: 再想一想：对三个因子的乘积取行列式。
  choices:
    A: 取向符号属于所研究的变换，不会被相似变换去掉。
    B: 去程与回程的行列式互为倒数，会相消。
    C: 相似变换保持行列式。
