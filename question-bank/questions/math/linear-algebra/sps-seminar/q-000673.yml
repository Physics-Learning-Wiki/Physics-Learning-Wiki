stem: '**SPS 线性代数研讨班配套 · §2.6.6 换基与相似变换 · 2026-10-24 更新稿**


  同一线性变换的两种表示满足 $A^{\prime}=C^{-1}AC$，$C$ 可逆。已知 $\det A=-4$，以下哪项必然成立？'
difficulty: 1
cognitive_level: understand
