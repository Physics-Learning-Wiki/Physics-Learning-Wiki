reference_answer: 三个投影是 $1/\sqrt2,0,-1/\sqrt2$；中心点源不耦合反对称模态。展开给 $v=(1/2,1,1/2)^T$，直接代回得到 $Lv=(0,1,0)^T$，并满足外侧零边界。
