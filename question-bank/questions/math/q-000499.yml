hints:
- 在 x=0 代入两个核，比较它们的值。
- 镜像点在区域外，因此不会在 x>0 添加额外的狄拉克源。
feedback:
  correct: 镜像符号同时满足边界抵消与正单位源。
  incorrect: 只满足边界还不够，还需保留点源的正确符号。
  choices:
    A: 边界值相加而非抵消。
    B: 边界相消，源点导数跳跃给正单位源。
    C: 自由核在 x=0 不为零。
    D: 虽然边界抵消，但整体反号把源变为负单位源。
