choices:
- id: A
  content: $r_0$ 对应不衰减模态。
- id: B
  content: $r_1$ 的幅度按 $e^{-t/\mu}$ 衰减。
- id: C
  content: $r_2$ 的幅度按 $e^{-2t/\mu}$ 衰减。
- id: D
  content: 因为 P 每行和为一，所以任意初值下三个节点的算术平均必定守恒。
answer:
  choices:
  - A
  - B
  - C
