feedback:
  correct: 把逆算子和指定输入位置正确对应。
  incorrect: 要求解 JV=I，不能把 JI 当作响应。
  choices:
    A: 这是 JI，不是 J 的逆作用于 I。
    B: 除非输入恰好是本征值一的本征向量，否则响应不等于输入。
    C: 这是 J 的逆矩阵第一列，并通过直接代回检验。
    D: 这是逆矩阵第二列，对应输入在第二节点。
