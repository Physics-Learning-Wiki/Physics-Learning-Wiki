stem: |-
  La Croix 与 Lindsay（2026）把有吸收边界的热扩散问题作拉普拉斯变换，再求解变换后的边值问题。 [研究来源（DOI）](https://doi.org/10.1007/s10915-026-03222-x)。

  将研究的恒定温度边界改为一个明确的教学时序：边界值在 $0\leq t<t_0$ 为零，在 $t\geq t_0$ 为常数 $f_0$，其中 $t_0>0$。在单边变换 $F(s)=\int_0^\infty e^{-st}f(t)dt$、$s>0$ 下，应给变换后边值问题输入哪一边界值？
solution: |-
  只有 $t\geq t_0$ 的积分有贡献，因此

  $$
  F(s)=f_0\int_{t_0}^\infty e^{-st}dt
  =\frac{f_0}{s}e^{-st_0}.
  $$

  时间延迟对应衰减因子 $e^{-st_0}$，原来的阶跃变换仍含 $1/s$。检查：$t_0\to0$ 时还原论文常值边界的 $f_0/s$；对于实正 $s$，更晚的信号在变换积分中的权重更小。

  研究对应：Section 2, Eq. (5b) and its following derivation of constant boundary transform。教学范围：不求变换后的空间解，不声称论文实际采用了延迟边界。

  来源：[DOI 10.1007/s10915-026-03222-x](https://doi.org/10.1007/s10915-026-03222-x)。
difficulty: 1
