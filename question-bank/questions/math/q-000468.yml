hints:
- 把积分下限改成真正开始输入的时刻。
- 代入指数积分的上下限。
feedback:
  correct: 延迟因子与常值时间积分均正确。
  incorrect: 同时检查延迟因子的符号和阶跃所带的 1/s。
  choices:
    A: 对正 s 延迟输入不会增加积分权重。
    B: 时间与变换频率不能这样相减，且不符合直接积分。
    C: 缺少阶跃的 1/s；此形式更像延迟脉冲。
    D: 从 $t_0$ 到无穷的积分直接给出该式。
