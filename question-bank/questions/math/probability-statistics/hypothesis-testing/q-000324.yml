stem: 为什么 Q–Q 图和 Shapiro–Wilk 不应作为「已证明正态」的开关？
reference_answer: 图形和检验只是模型诊断，小样本能力不足，大样本对小偏差敏感，量化并列也有影响．
solution: 先看时间依赖和采样设计，报告数据、方法和p值；不能用不拒绝替代独立同分布假设或证明尾部结构．
