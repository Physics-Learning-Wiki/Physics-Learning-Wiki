stem: 由两个独立均匀量说明梯形怎样退化为三角分布．
reference_answer: U(−a,a)+U(−b,b) 卷积有中部平台，a=b 时平台宽零．
solution: '写支撑±(a+b)、平台高度1/(2a)及边缘斜率，注意a=b时三角半宽为2a，方差为2a²/3．


  关键算式：


  $$

  \operatorname{Var}(U(-a,a)+U(-b,b))=(a^2+b^2)/3

  $$

  '
