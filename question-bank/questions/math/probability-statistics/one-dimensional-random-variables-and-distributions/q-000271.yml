stem: 固定振幅正弦项的相位在完整周期均匀时，输出服从什么？
choices:
- id: A
  content: 反正弦分布
- id: B
  content: 必为均匀分布
- id: C
  content: 必为正态分布
answer:
  choice: A
solution: 变量变换须计多个相位原像，密度在端点附近较大，方差为振幅平方的一半．
