stem: 推导均匀相位正弦项的反正弦分布，并给出 CDF 和方差．
reference_answer: f(x)=1/[π√(h²−x²)]，F=1/2+arcsin(x/h)/π，方差h²/2．
solution: '需计每个内部x的两个相位原像，支撑外CDF为0或1；均值由对称性为零，二阶矩来自相位平均sin²．


  关键算式：


  $$

  F(x)=\frac12+\frac1\pi\arcsin(x/h),\quad\operatorname{Var}(X)=h^2/2

  $$

  '
