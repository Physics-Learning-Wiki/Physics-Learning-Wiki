stem: 推导均匀分布期望、方差和非对称偏离区间的处理．
reference_answer: U(a,b) 均值(a+b)/2，方差(b−a)²/12．
solution: '从密度积分或平移对称均匀量推导；非零中心先作修正，不能把零中心二阶矩误认为围绕均值方差．


  关键算式：


  $$

  E(X)=(a+b)/2,\quad\operatorname{Var}(X)=(b-a)^2/12

  $$

  '
