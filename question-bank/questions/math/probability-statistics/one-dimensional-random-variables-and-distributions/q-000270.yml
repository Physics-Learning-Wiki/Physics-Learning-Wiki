stem: 连续分布密度 f(x) 的值代表什么？
choices:
- id: A
  content: 单位自变量间隔内的概率密度
- id: B
  content: 点 x 的概率
- id: C
  content: 一定不超过一的概率
answer:
  choice: A
solution: 区间概率是密度积分，密度可大于一；连续单点概率通常为零．
