stem: 从期望、方差和 Chebyshev 不等式证明有限方差版本大数定律．
reference_answer: P(|均值−μ|≥ε)≤σ²/(nε²)→0．
solution: '先利用独立同方差得均值方差σ²/n，说明依概率收敛，不是有限n精确等于μ或逐步单调改进．


  关键算式：


  $$

  P(|\bar X-\mu|\geq\epsilon)\leq\sigma^2/(n\epsilon^2)\to0

  $$

  '
