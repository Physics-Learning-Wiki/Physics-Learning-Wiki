stem: 共同偏移 B 与独立重复项 E_i 的均值会怎样？
reference_answer: 均值仍含B，方差为u²(B)+σE²/n．
solution: 'B独立于E_i但在各次之间是共同来源；均值依概率趋向条件中心μ+B，而非自动消偏到μ．


  关键算式：


  $$

  \operatorname{Var}(\bar X)=u^2(B)+\sigma_E^2/n

  $$

  '
