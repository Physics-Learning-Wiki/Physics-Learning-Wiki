stem: 写出经典中心极限定理的标准化量和条件．
reference_answer: √n(平均值−μ)/σ 依分布趋N(0,1)，独立同分布且有限非零方差．
solution: '原始量不必正态，若原始正态则均值任何n正态；不能将分布收敛与原始观测变成正态混同．


  关键算式：


  $$

  \sqrt n(\bar X-\mu)/\sigma\xrightarrow{d}N(0,1)

  $$

  '
