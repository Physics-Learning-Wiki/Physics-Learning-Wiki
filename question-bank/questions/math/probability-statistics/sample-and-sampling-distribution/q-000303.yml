stem: 给出t和F的矩存在条件，解释自由度小时不能随意用标准差．
reference_answer: t均值ν>1、方差ν>2；F均值ν2>2、方差ν2>4．
solution: '写t方差ν/(ν−2)和F均值ν2/(ν2−2)，不存在时不能以对称性或有限样本计算值代替总体矩．


  关键算式：


  $$

  \operatorname{Var}(t_\nu)=\nu/(\nu-2)\quad(\nu\gt 2)

  $$

  '
