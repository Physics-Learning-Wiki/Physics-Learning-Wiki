stem: 解释卡方构造与正态样本残差自由度．
reference_answer: ν个独立标准正态平方和为χ²ν，去掉拟合均值后残差平方和有n−1自由度．
solution: '给出密度归一系数与E=ν、Var=2ν，不能将n个相关残差当独立标准正态平方．


  关键算式：


  $$

  Q=\sum_{i=1}^{\nu}Z_i^2\sim\chi_\nu^2

  $$

  '
