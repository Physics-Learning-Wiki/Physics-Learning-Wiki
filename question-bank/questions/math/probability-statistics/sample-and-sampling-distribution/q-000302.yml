stem: 写出总体方差的卡方区间并说明上下分位数次序．
reference_answer: '[(n−1)s²/χ²上分位,(n−1)s²/χ²下分位]．'
solution: '从χ²下≤(n−1)S²/σ²≤χ²上反解，分母导致反序；区间通常不对称，不能照抄t对称半宽．


  关键算式：


  $$

  \left[\frac{(n-1)s^2}{\chi^2_{1-\alpha/2,n-1}},\frac{(n-1)s^2}{\chi^2_{\alpha/2,n-1}}\right]

  $$

  '
