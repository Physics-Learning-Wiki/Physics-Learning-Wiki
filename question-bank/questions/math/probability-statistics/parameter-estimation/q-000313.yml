stem: 算术平均、加权平均和一般最小二乘怎样统一？
reference_answer: 分别为等方差常数模型、不等方差常数模型和多参数线性观测模型的估计．
solution: '从残差平方和或加权和的导数看常数模型特例，说明最小方差线性无偏推导不必正态，但似然解释有相应条件．


  关键算式：


  $$

  \sum_i w_i(y_i-a)=0\quad\Longrightarrow\quad \hat a=\frac{\sum_i w_iy_i}{\sum_i w_i}

  $$

  '
