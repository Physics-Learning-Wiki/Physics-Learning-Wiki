stem: 推导 MSE=方差+偏差平方，并解释无偏不等于最精确．
reference_answer: 将估计减参数拆成估计减其期望加偏差，交叉项期望为零．
solution: '同为无偏估计仍有不同方差，带少量偏差者也可能更小MSE；选择准则须声明．


  关键算式：


  $$

  E[(\hat\theta-\theta)^2]=\operatorname{Var}(\hat\theta)+[E(\hat\theta)-\theta]^2

  $$

  '
