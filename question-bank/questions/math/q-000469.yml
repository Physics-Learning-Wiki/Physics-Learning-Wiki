feedback:
  correct: 直接积分并通过归一化检验。
  incorrect: 核中已有 1/μ 的归一化因子，不能漏掉。
  choices:
    A: 指数核的衰减率相加，不是相减。
    B: 该式对应固定等待时间的狄拉克核，不是指数密度。
    C: 合并衰减率后的积分得到此式。
    D: 多了时间量纲，且 s=0 时通常不等于一。
