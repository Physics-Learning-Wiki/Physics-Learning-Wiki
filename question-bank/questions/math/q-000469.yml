stem: 'Luo 等（2026）研究网络扩散的等待时间与松弛速度；指数等待时间是其一般模型的一个可解极限。 [研究来源（DOI）](https://doi.org/10.1038/s41467-026-72161-w)。


  在论文的无记忆极限，各节点等待时间密度可写为 $\rho(t)=\mu^{-1}e^{-t/\mu}$，$t\geq0$，其中平均等待时间 $\mu>0$。采用 $\widehat\rho(s)=\int_0^\infty e^{-st}\rho(t)dt$，$s\geq0$。


  正确的变换是哪一个？'
solution: '合并指数后有


  $$

  \widehat\rho(s)=\frac1\mu\int_0^\infty e^{-(s+1/\mu)t}dt

  =\frac{1/\mu}{s+1/\mu}=\frac1{1+\mu s}.

  $$


  检查：$\widehat\rho(0)=1$，正好对应密度总积分为一；$-\widehat\rho^{\prime}(0)=\mu$，恢复平均等待时间。分母中的 $\mu s$ 必须无量纲。


  研究对应：Results, exponential waiting-time paragraph before Eq. (2), transform definition following Eq. (3)。教学范围：相同平均值并不使任意等待时间分布具有相同变换或相同扩散动力学。


  来源：[DOI 10.1038/s41467-026-72161-w](https://doi.org/10.1038/s41467-026-72161-w)。'
