reference_answer: $F^{\prime}(s)=sJ_0(s)^2$ 且 $F(0)=0$。变量代换后 $P(a)=\pi A^2a^2[J_0(ka)^2+J_1(ka)^2]$。小 ka 时趋于 $\pi A^2a^2$；上限求导与原积分一致。
