hints:
- 先看 0<C<1 使右边有什么符号。
- 比较严格单调函数在区间两端的值。
feedback:
  correct: 通过导数符号发现了边界资料的不相容。
  incorrect: 边界值的数目不能代替相容性检查。
  choices:
    A: 常数函数的零导数不等于给定方程的负右端。
    B: 严格下降与相等端点矛盾。
    C: 还必须逐点满足微分方程，不能只连接端点。
    D: 一阶方程通常不能任意独立指定两个端点值，本题更可直接证明矛盾。
