stem: |-
  Xu 与 Torres（2025）研究多通道热扩散脱盐；其浓度分布同时受普通扩散和温度梯度驱动。 [研究来源（DOI）](https://doi.org/10.1038/s44221-025-00428-5)。

  仍取静止二元零通量模型 $C^{\prime}=-\kappa C(1-C)$，其中 $h>0$、$\kappa>0$，并要求整个通道 $0\leq y\leq h$ 内 $0<C(y)<1$。现同时指定教学边界值 $C(0)=0.2$ 和 $C(h)=0.2$。

  关于这个边值问题，哪一判断正确？
solution: |-
  在题设浓度范围内，$\kappa C(1-C)>0$，因此 $C^{\prime}<0$。若存在解，它在长度为正的通道中必须严格下降，必有 $C(h)<C(0)$，与给定相等的端点矛盾。

  所以这组边界值与所给零通量方程不相容。常数函数 $C=0.2$ 也不满足方程，因为其导数是零，而右端为 $-0.16\kappa$。检查：若去掉热扩散梯度使 $\kappa=0$，相等的端点可以相容；但这不在本题条件内。允许外部维持浓度并产生非零通量时，需要另一个方程模型。

  研究对应：Results, Theoretical framework for thermodiffusive separation, zero-flux concentration equation following Eq. (1)。教学范围：只证明所给零通量模型无解，不声称任何具有相同端点浓度的实际系统都无稳态。

  来源：[DOI 10.1038/s44221-025-00428-5](https://doi.org/10.1038/s44221-025-00428-5)。
