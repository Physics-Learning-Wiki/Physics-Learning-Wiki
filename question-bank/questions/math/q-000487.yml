choices:
- id: A
  content: $\alpha>0$ 时，负半轴多出的 $e^{-2\alpha v}$ 使强度尾部可积。
- id: B
  content: 对固定有限 $\alpha$，正半轴的 $s^{3/2}$ 衰减最终压过线性指数项。
- id: C
  content: $\alpha=0$ 时两端都自动给出有限积分强度。
- id: D
  content: $\alpha<0$ 会使负半轴尾部指数增长，不能起到所需的有限能量截断作用。
answer:
  choices:
  - A
  - B
  - D
