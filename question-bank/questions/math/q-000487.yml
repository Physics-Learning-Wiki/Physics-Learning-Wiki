stem: 'Chen 等（2025）利用有限能量艾里束调整传播路径，以绕过无线链路中的障碍物。 [研究来源（DOI）](https://doi.org/10.1038/s41467-025-62443-0)。


  考虑论文初始场的无量纲形式 $f_\alpha(s)=\operatorname{Ai}(s)e^{\alpha s}$，积分强度为 $\int_{-\infty}^{\infty}|f_\alpha(s)|^2ds$。允许使用


  $$\operatorname{Ai}(s)\sim\frac{s^{-1/4}}{2\sqrt\pi}e^{-2s^{3/2}/3}\quad(s\to+\infty),$$

  $$\operatorname{Ai}(-v)\sim\frac{v^{-1/4}}{\sqrt\pi}\sin\left(\frac23v^{3/2}+\frac\pi4\right)\quad(v\to+\infty).$$


  平方正弦的振荡具有非零平均，不会单独使 $v^{-1/2}$ 尾部积分收敛。选出所有正确判断，采用完全一致评分。'
solution: '负半轴令 $s=-v$，强度尾部带因子 $v^{-1/2}e^{-2\alpha v}$ 乘有界振荡。当 $\alpha>0$，指数衰减使它可积。正半轴的强度指数为 $-4s^{3/2}/3+2\alpha s$；对任何有限的常数
  $\alpha$，负的 $s^{3/2}$ 项最终占优，所以此端可积。


  当 $\alpha=0$，负半轴只有 $v^{-1/2}$ 的平方振幅衰减及非零平均振荡，总积分发散；当 $\alpha<0$，负半轴指数增长，也不能得到有限积分强度。检查：截断所修正的是负半轴的长尾，而正半轴本已快速衰减。对任意有限区间，Ai
  光滑，因此没有额外的内部积分奇点。


  研究对应：Results, Airy beam generation and characterization, Eq. (1), finite-energy truncation parameter discussion。教学范围：仅检验一维初始剖面的积分收敛，不计算真实有限阵列的辐射效率或无障碍传输保证。


  来源：[DOI 10.1038/s41467-025-62443-0](https://doi.org/10.1038/s41467-025-62443-0)。'
