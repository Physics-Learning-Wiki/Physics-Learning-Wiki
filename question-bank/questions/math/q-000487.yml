hints:
- 负半轴必须把 s 写成 −v，再判断指数符号。
- 正半轴比较 s 与 s^(3/2) 的增长速度。
feedback:
  correct: 分别检查了两端的函数渐近行为。
  incorrect: 在负半轴，正截断参数对应衰减；不能把两端的 s 符号混在一起。
  choices:
    A: 指数衰减支配幂次尾部。
    B: s^(3/2) 比 s 增长更快，负的高次指数决定收敛。
    C: 未截断 Ai 的负半轴平方振幅衰减不足以可积。
    D: 负的 α 在 s=−v 上产生正增长指数。
