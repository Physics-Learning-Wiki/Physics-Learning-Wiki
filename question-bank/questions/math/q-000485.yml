hints:
- 二次求导需要两个 1/x0 因子。
- 定义方程中的 s 也要换成 x/x0。
feedback:
  correct: 两个导数缩放因子与函数自变量缩放都保留了。
  incorrect: 先按链式法则求导，再代入定义方程，不要直接替换函数名。
  choices:
    A: 遗漏长度尺度，量纲也不符。
    B: 只换了自变量，却漏掉二次求导因子。
    C: 艾里定义方程中没有该负号。
    D: 链式法则产生 1/x0²，原方程再贡献 x/x0。
