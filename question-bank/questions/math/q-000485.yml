stem: 'Chen 等（2025）利用有限能量艾里束调整传播路径，以绕过无线链路中的障碍物。 [研究来源（DOI）](https://doi.org/10.1038/s41467-025-62443-0)。


  论文艾里束初始剖面含 $\operatorname{Ai}(x/x_0)$。先取未截断的理想参考函数 $u(x)=\operatorname{Ai}(x/x_0)$，$x_0>0$ 为长度。给定艾里函数的定义方程 $\operatorname{Ai}^{\prime\prime}(s)=s\operatorname{Ai}(s)$，撇号表示对无量纲变量
  $s$ 求导。


  关于物理坐标 $x$ 的方程是哪一个？'
solution: '令 $s=x/x_0$。链式法则给出 $u^{\prime\prime}(x)=x_0^{-2}\operatorname{Ai}^{\prime\prime}(s)$。代入定义方程，得到


  $$u^{\prime\prime}(x)=\frac1{x_0^2}\frac{x}{x_0}\operatorname{Ai}(x/x_0)=\frac{x}{x_0^3}u(x).$$


  检查：$x/x_0^3$ 的单位是长度的负二次，与两次坐标导数一致；在 $x=0$，二阶导数为零。这是未加指数截断的参考剖面方程；对论文的完整截断函数求导还会出现额外项。


  研究对应：Results, Airy beam generation and characterization, Eq. (1), initial profile at z=0。教学范围：不把未截断参考函数称为有限能量束；也不求完整传播解。


  来源：[DOI 10.1038/s41467-025-62443-0](https://doi.org/10.1038/s41467-025-62443-0)。'
