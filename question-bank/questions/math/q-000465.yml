hints:
- 先对时间导数作一次分部积分。
- 下限 $t=0$ 的项带负号。
feedback:
  correct: 保留了初值并正确移动空间项。
  incorrect: 初值不能在时间变换时丢掉，也不会额外乘上 s。
  choices:
    A: 只适用于零初值，与点源初值不符。
    B: 初值项是 $u_0$，不是 $su_0$。
    C: 把移项后的空间算子符号写反了。
    D: 由 $sU-u_0=D\Delta U$ 直接得到。
