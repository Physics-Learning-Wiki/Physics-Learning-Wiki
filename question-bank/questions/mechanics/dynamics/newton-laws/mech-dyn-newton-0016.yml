stem: 人向后蹬地而向前加速。直接使人向前加速的力是？
choices:
- id: A
  content: 人对地面的向后摩擦力
- id: B
  content: 地面对人的向前摩擦力
- id: C
  content: 人的重力
- id: D
  content: 人的惯性
answer:
  choice: B
feedback:
  choices:
    A: 该力作用在地面上。
    B: 正确，它作用在人身上。
    C: 重力竖直向下。
    D: 惯性不是力。
  correct: 正确找到了受力物体为人的水平力。
  incorrect: 先确认每个力作用在哪个物体上。
hints:
- 研究对象是人，只列作用在人身上的力。
solution: 人对地面施加向后的摩擦力，地面依牛顿第三定律对人施加向前的摩擦力，使人向前加速。
