stem: 质量为 $2\,\mathrm{kg}$ 的质点所受合外力为 $\boldsymbol F=(6\,\hat{\boldsymbol i}-8\,\hat{\boldsymbol j})\,\mathrm N$。加速度大小是多少？
answer:
  value: 5
  tolerance:
    type: absolute
    value: 0.01
  unit:
    required: true
    canonical: m/s^2
    accepted:
    - m/s^2
feedback:
  correct: 正确，你正确处理了矢量分量。
  incorrect: 先分别除以质量得到加速度分量，再求矢量大小。
hints:
- $a_x=F_x/m$，$a_y=F_y/m$。
solution: $\boldsymbol a=(3\hat{\boldsymbol i}-4\hat{\boldsymbol j})\,\mathrm{m/s^2}$，故 $|\boldsymbol a|=\sqrt{3^2+(-4)^2}=5\,\mathrm{m/s^2}$。
