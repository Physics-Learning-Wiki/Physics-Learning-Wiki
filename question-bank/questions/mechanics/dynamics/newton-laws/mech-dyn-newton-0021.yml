stem: '![由斜向细线拉住的方块](asset:block-tension)


  光滑水平面上的方块由一根斜向右上方的细线拉动。方块的受力图包含哪些力？'
assets:
- id: block-tension
  path: mechanics/dynamics/newton-laws/block-tension.svg
choices:
- id: A
  content: 重力
- id: B
  content: 地面支持力
- id: C
  content: 沿细线方向的拉力
- id: D
  content: 与运动方向相同的“运动力”
- id: E
  content: 水平摩擦力
answer:
  choices:
  - A
  - B
  - C
feedback:
  choices:
    A: 地球对方块的作用。
    B: 地面对方块的接触力。
    C: 细线对方块的作用。
    D: 不存在这种真实力。
    E: 水平面光滑，摩擦力为零。
  correct: 正确列出了全部非零真实力。
  incorrect: 只画作用在方块上的真实非零力。
hints:
- 逐一检查方块与地球、地面、细线的相互作用。
solution: 方块受重力、支持力和沿细线方向的拉力。光滑面不提供摩擦力，也不存在“运动力”。
