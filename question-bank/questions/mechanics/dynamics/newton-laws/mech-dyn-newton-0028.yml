stem: 光滑水平面上，质量为 $2\,\mathrm{kg}$ 和 $3\,\mathrm{kg}$ 的 A、B 两物体接触。水平力 $20\,\mathrm N$ 作用在 A 上推动二者。求 A 对 B 的接触力。
answer: {value: 12, tolerance: {type: absolute, value: 0.01}, unit: {required: true, canonical: N, accepted: [N]}}
feedback: {correct: 正确，你先求整体加速度再隔离 B。, incorrect: 先用整体法求共同加速度，再以 B 为研究对象。}
hints: [整体加速度为 $20/(2+3)$。]
solution: 整体加速度 $a=4\,\mathrm{m/s^2}$。隔离 B，水平方向只有 A 对 B 的接触力，故 $F_{AB}=m_Ba=3\times4=12\,\mathrm N$。
