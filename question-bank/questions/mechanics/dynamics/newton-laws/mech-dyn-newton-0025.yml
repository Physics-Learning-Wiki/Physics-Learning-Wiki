stem: 方块沿倾角 $37^\circ$ 的粗糙斜面向下滑，动摩擦因数为 $0.25$。取沿斜面向下为正，$g=10\,\mathrm{m/s^2}$，$\sin37^\circ=0.6$，$\cos37^\circ=0.8$。求加速度。
answer:
  value: 4
  tolerance:
    type: absolute
    value: 0.02
  unit:
    required: true
    canonical: m/s^2
    accepted:
    - m/s^2
feedback:
  correct: 正确，你同时使用了法向与切向方程。
  incorrect: 先由垂直斜面方程求 $N=mg\cos\theta$。
hints:
- 摩擦力大小为 $\mu N$，方向沿斜面向上。
solution: $N=mg\cos37^\circ$，沿斜面有 $mg\sin37^\circ-\mu N=ma$，所以 $a=10(0.6-0.25\times0.8)=4\,\mathrm{m/s^2}$。
