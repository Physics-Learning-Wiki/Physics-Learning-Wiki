stem: 质量为 $2\,\mathrm{kg}$ 的方块置于倾角 $30^\circ$ 的光滑斜面上，取沿斜面向下为正，$g=10\,\mathrm{m/s^2}$。沿斜面方向的加速度是多少？
answer:
  value: 5
  tolerance:
    type: absolute
    value: 0.01
  unit:
    required: true
    canonical: m/s^2
    accepted:
    - m/s^2
feedback:
  correct: 正确，沿斜面只有重力分量。
  incorrect: 沿斜面列 $mg\sin\theta=ma$。
hints:
- 支持力垂直斜面，不进入沿斜面方程。
solution: $mg\sin30^\circ=ma$，消去质量得 $a=g\sin30^\circ=5\,\mathrm{m/s^2}$。
