stem: '![水平面上静止方块的受力示意底图](asset:block-horizontal)


  方块静止在粗糙水平面上，且没有水平外力。正确的受力图应包含哪些力？'
assets:
- id: block-horizontal
  path: mechanics/dynamics/newton-laws/block-horizontal.svg
choices:
- id: A
  content: 只有重力
- id: B
  content: 重力和支持力
- id: C
  content: 重力、支持力和静摩擦力
- id: D
  content: 重力、支持力和向前的运动力
answer:
  choice: B
feedback:
  choices:
    A: 地面对方块有支持力。
    B: 正确，且没有产生静摩擦的趋势。
    C: 无水平外力时静摩擦力为零。
    D: 不存在“运动力”。
  correct: 正确，只画实际作用在方块上的非零力。
  incorrect: 接触并不必然产生非零摩擦力。
hints:
- 先列相互作用，再判断每个力是否为零。
solution: 方块受重力和地面支持力，二者平衡。没有水平外力或相对滑动趋势，静摩擦力为零，不画入受力图。
