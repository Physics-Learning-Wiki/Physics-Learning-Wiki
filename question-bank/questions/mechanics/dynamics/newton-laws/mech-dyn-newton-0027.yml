stem: 光滑水平面上，$1\,\mathrm{kg}$、$2\,\mathrm{kg}$、$3\,\mathrm{kg}$ 三个相连物体受水平外力 $12\,\mathrm N$。把三者视为整体，求加速度。
answer:
  value: 2
  tolerance:
    type: absolute
    value: 0.01
  unit:
    required: true
    canonical: m/s^2
    accepted:
    - m/s^2
feedback:
  correct: 正确，连接力是系统内力。
  incorrect: 整体质量为三者质量之和。
hints:
- 系统所受水平外力只有 $12\,\mathrm N$。
solution: $a=F/(m_1+m_2+m_3)=12/(1+2+3)=2\,\mathrm{m/s^2}$。
