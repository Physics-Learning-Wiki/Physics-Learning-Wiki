stem: '![粗糙斜面上的下滑方块](asset:block-incline)


  方块正沿粗糙斜面向下滑。以方块为研究对象，摩擦力方向是？'
assets:
- id: block-incline
  path: mechanics/dynamics/newton-laws/block-incline.svg
choices:
- id: A
  content: 沿斜面向上
- id: B
  content: 沿斜面向下
- id: C
  content: 垂直斜面向外
- id: D
  content: 竖直向上
answer:
  choice: A
feedback:
  choices:
    A: 正确，摩擦力阻碍接触面的相对滑动。
    B: 这会促进而不是阻碍下滑。
    C: 这是支持力方向。
    D: 摩擦力沿接触面。
  correct: 正确判断了滑动摩擦力方向。
  incorrect: 摩擦力沿接触面并阻碍相对滑动。
hints:
- 先确定方块相对斜面的运动方向。
solution: 方块相对斜面向下滑，因此斜面对方块的滑动摩擦力沿斜面向上。
