choice_order: shuffle
stem: 一本书静止在桌面上。与地球对书的重力构成第三定律力对的是哪一个力？
choices:
- id: A
  content: 桌面对书的支持力
- id: B
  content: 书对桌面的压力
- id: C
  content: 书对地球的引力
- id: D
  content: 书受到的合力
answer:
  choice: C
feedback:
  choices:
    A: 与重力作用在同一物体上。
    B: 它与桌面对书的支持力成对。
    C: 正确，来自同一引力相互作用。
    D: 合力不是单个相互作用力。
  correct: 正确。
  incorrect: 第三定律力对作用在不同物体上，来自同一相互作用。
hints:
- 写出施力物体和受力物体。
solution: 地球吸引书，书也以大小相等、方向相反的力吸引地球。
