- id: A
  content: 大小相等
- id: B
  content: 方向相反
- id: C
  content: 作用在同一物体上
- id: D
  content: 来自同一个相互作用
answer:
  choices:
  - A
  - B
  - D
feedback:
  choices:
    A: 正确。
    B: 正确。
    C: 它们分别作用在两个物体上。
    D: 正确，这是识别力对的关键。
  correct: 你准确掌握了第三定律力对的条件。
  incorrect: 第三定律力对作用在不同物体上。
hints:
- 写成“甲对乙”和“乙对甲”。
solution: 第三定律力对来自同一相互作用，大小相等、方向相反，分别作用于两个不同物体。
