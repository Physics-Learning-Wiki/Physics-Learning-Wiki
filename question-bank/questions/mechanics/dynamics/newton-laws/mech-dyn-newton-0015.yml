stem: 同一恒力先后单独作用于质量为 $m$ 和 $2m$ 的两个物体，第二个物体的加速度大小是第一个的多少？
choices:
- id: A
  content: $2$ 倍
- id: B
  content: $1/2$
- id: C
  content: 相同
- id: D
  content: $4$ 倍
answer:
  choice: B
feedback:
  choices:
    A: 加速度与质量成反比。
    B: 正确。
    C: 质量不同导致加速度不同。
    D: 不是平方关系。
  correct: 正确应用了 $a=F/m$。
  incorrect: 恒力相同时，加速度与质量成反比。
hints:
- 分别写出两个物体的 $a=F/m$。
solution: $a_1=F/m$，$a_2=F/(2m)=a_1/2$。
