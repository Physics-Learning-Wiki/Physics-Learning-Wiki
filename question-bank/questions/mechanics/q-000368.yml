choices:
- id: A
  content: $\kappa=mg\ell$ 时是具有非零线性频率的简谐振子。
- id: B
  content: $\kappa<mg\ell$，且 $\omega=\sqrt{(mg\ell-\kappa)/I}$。
- id: C
  content: $\kappa>mg\ell$，且 $\omega=\sqrt{(\kappa-mg\ell)/I}$。
- id: D
  content: 任意 $\kappa>0$ 都稳定，且 $\omega=\sqrt{(\kappa+mg\ell)/I}$。
answer:
  choice: C
