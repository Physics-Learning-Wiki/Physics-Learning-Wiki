choices:
- id: A
  content: 真空估计约为 $11.0\,\mathrm{m/s}$；对于同一高度，计入正的阻力损耗会要求更大的起飞速度。
- id: B
  content: 真空估计约为 $16.6\,\mathrm{m/s}$，完全无需阻力模型。
- id: C
  content: 空气阻力在上升时帮助载荷增高，因此计入阻力会要求更小的起飞速度。
- id: D
  content: 只知道最高点高度，就能在不指定阻力的情况下唯一确定实际起飞速度。
answer:
  choice: A
