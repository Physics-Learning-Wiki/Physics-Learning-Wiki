choices:
- id: A
  content: $mv=J_b$ 在任意 T 下都严格成立，因为重力不产生冲量。
- id: B
  content: $mv=J_b-(M+m)gT$，基底为所选系统提供外冲量。
- id: C
  content: $mv=0$，因为所有弹射器都只能施加内力。
- id: D
  content: $mv=-J_b-(M+m)gT$，向上的基底冲量应按负号计。
answer:
  choice: B
