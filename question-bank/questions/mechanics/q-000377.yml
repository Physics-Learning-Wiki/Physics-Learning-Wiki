choices:
- id: A
  content: 在规定的接触状态中，$N=Mg-F_L$。
- id: B
  content: 克服最大抗滚动阻力矩所需的水平力阈值（尚未检查防滑条件）为 $\mu_r(Mg-F_L)$。
- id: C
  content: 当 $F_L>Mg$ 时可令 N 为负数，并照常维持同一无黏附接触模型。
- id: D
  content: 增加 $F_L$ 还会降低静摩擦上限，因此不能只凭滚动阻力减小就保证无滑动。
