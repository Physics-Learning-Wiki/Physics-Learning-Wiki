stem: '跷跷板负泊松比材料的等效刚度来自铰链储能；共享边界铰链若重复计数，会系统性高估刚度。（[研究来源](https://doi.org/10.1093/jom/ufae029)）


  按论文分析使用的一个单元计账：有一个完全属于该单元的内部转动弹簧，另有五个边界转动弹簧各由相邻两个单元平分。每个弹簧的刚度为 $\kappa=0.0200\,\mathrm{N\,m}$，相对转角增量均为 $2\,\delta\theta$，单个弹簧储能为
  $\frac12\kappa(2\delta\theta)^2$。初态 $\theta=0$，尺寸 $X=2(a\cos\theta+b\sin\theta)$，$b=20.0\,\mathrm{mm}$；一次小变形使 $\delta X=0.200\,\mathrm{mm}$，可使用一阶近似
  $\delta X=2b\,\delta\theta$。图仅显示能量归属权重，不代表真实铰链连杆拓扑。


  ![能量归属计数图：虚线单元边界内一个弹簧权重为 1，边界上五个弹簧的权重各为 1/2；统一标注相对转角增量 2δθ。](asset:m032)


  *原创教学示意图，非按比例绘制。*


  归属于该单元的总弹性储能 U 为多少？以 $\mathrm{J}$ 为单位，保留三位有效数字。'
hints:
- 每个边界铰链只计一半的能量。
- 先从 δX 求 δθ，再注意弹簧两端的相对转角是 2δθ。
feedback:
  correct: 按共享权重计算周期单元的铰链能量，并将尺寸增量转换为转角增量。，并保留了题设的适用条件。
  incorrect: 每个边界铰链只计一半的能量。
solution: '先由尺寸变化求转角：$\delta\theta=\delta X/(2b)=0.200/(2\times20.0)=0.00500$。有效弹簧数为 $1+5\times\frac12=3.5$，因此 $U=3.5\times\frac12\kappa(2\delta\theta)^2=7\kappa\delta\theta^2$。代入得
  $U=7\times0.0200\times(0.00500)^2=3.50\times10^{-6}\,\mathrm{J}$。长度单位在比值中相消，弹簧刚度所用转角按弧度计。


  **检查与物理含义：** 单个弹簧能量为 $1.00\times10^{-6}\,\mathrm{J}$，乘 3.5 后与总式一致。若位移增量减半，线性弹性储能应降为四分之一，$U\propto\delta X^2$ 正满足这一点。


  **适用范围：** 这里只计算指定单元的线性铰链能量；不包含刚性单元的弯曲或有限转角下的非线性。


  **来源定位：** Auxetic metamaterial inspired by the seesaw motion，§2 Analysis, energy counting of one internal hinge and five
  half-shared boundary hinges; U=7κ(dθ)²；[论文 DOI](https://doi.org/10.1093/jom/ufae029)。'
