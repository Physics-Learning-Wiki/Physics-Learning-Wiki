  content: $m\ddot\eta+(k+3\beta q_0^2)\eta=0$，$\omega=\sqrt{(k+3\beta q_0^2)/m}$。
- id: B
  content: $m\ddot\eta+k\eta=0$，预变形永远不影响频率。
- id: C
  content: $m\ddot\eta+(k+F_0)\eta=0$，$\omega=\sqrt{(k+F_0)/m}$。
- id: D
  content: $m\ddot\eta+(k+\beta q_0^2)\eta=0$，$\omega=\sqrt{(k+\beta q_0^2)/m}$。
answer:
  choice: A
