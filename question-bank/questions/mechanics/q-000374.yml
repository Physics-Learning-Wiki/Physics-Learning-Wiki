reference_answer: 四段姿态增量分别为 −α₁Δ、0、+α₂Δ、0，合计 Δθ=(α₂−α₁)Δ。总角动量始终为零，但权重随形变改变，外壳姿态可累计变化。固定 α 的往返相对转动完全抵消。内部执行器仍可能需要能量，本题不计算能耗。
