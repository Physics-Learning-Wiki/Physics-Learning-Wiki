choices:
- id: A
  content: $A=\tau_0/(I\gamma\omega_0)$。
- id: B
  content: 平均耗散功率为 $I\gamma A^2\omega_0^2/2$。
- id: C
  content: 只要品质因数很大，撤去驱动后仍能永远保持同样的非零振幅。
- id: D
  content: 稳态下平均输入功率等于 $\gamma E_0$，其中 $E_0=I\omega_0^2A^2/2$。
answer:
  choices:
  - A
  - B
  - D
