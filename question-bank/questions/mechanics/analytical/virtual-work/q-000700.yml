stem: 质点在固定直线 $y=2x$ 上运动，所受主动力为 $\boldsymbol F=(3,4)\,\mathrm N$．取 $\delta x=1.00\times10^{-3}\,\mathrm m$，这一容许虚位移对应的主动力虚功是多少？
answer:
  value: 0.011
  tolerance:
    type: absolute
    value: 1.0e-06
  unit:
    required: true
    accepted:
    - J
    canonical: J
feedback:
  correct: 数值与容差要求相符．请继续核对解析中的单位和符号．
  incorrect: 按提示重算，并检查单位、正方向及是否遗漏几何系数．
hints:
- 先用约束求出 $\delta y$，再作标量积．
solution: 约束给出 $\delta y=2\delta x=2.00\times10^{-3}\,\mathrm m$．所以 $\delta W=3\delta x+4\delta y=0.0110\,\mathrm J$．应把两个方向的贡献相加，不能只用力的一个分量．
