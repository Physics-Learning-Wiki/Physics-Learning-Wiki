reference_answer: 令 $\alpha=\arctan(F/(mg))$，则 $\theta=\alpha$ 为稳定平衡，$\theta=\alpha+\pi$ 为不稳定平衡，均按 $2\pi$ 取模．
hints:
- 把水平力和重力的虚功相加，要求对任意 $\delta\theta$ 为零．
- 将势能写成平移后的余弦，能同时找出两个驻点和曲率符号．
feedback:
  correct: 已记录你的自评．请按本题标准确认推导和检查是否齐全．
  incorrect: 对照参考解答定位缺失步骤，再记录自评；本题不自动判断文字答案．
solution: '位置为 $(R\sin\theta,-R\cos\theta)$，等时虚位移为 $R(\cos\theta,\sin\theta)\delta\theta$．主动力虚功为


  $$

  \delta W=R(F\cos\theta-mg\sin\theta)\delta\theta.

  $$


  理想反力沿法向，对任意容许切向虚位移总虚功为零，因此平衡只需令括号为零．记 $A=\sqrt{F^2+(mg)^2}>0$，并取 $\alpha=\arctan(F/(mg))\in[0,\pi/2)$，有 $F=A\sin\alpha$、$mg=A\cos\alpha$．条件化为
  $\sin(\theta-\alpha)=0$，故两类解是 $\alpha$ 与 $\alpha+\pi$．


  势能可取


  $$

  V=-mgR\cos\theta-FR\sin\theta=-RA\cos(\theta-\alpha).

  $$


  在 $\alpha$ 处 $V''''=RA>0$；在 $\alpha+\pi$ 处 $V''''=-RA<0$．动能系数 $mR^2$ 正，前者为非退化稳定平衡，后者不稳定．当 $F=0$ 时回到最低点与最高点．两点的一阶主动力虚功都为零，稳定性差别来自二阶变化．'
