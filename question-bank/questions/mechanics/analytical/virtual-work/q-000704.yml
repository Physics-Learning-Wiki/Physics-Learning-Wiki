stem: '质量 $m>0$ 的小环套在固定光滑竖直圆形铁丝上，不会脱离，半径 $R>0$．取 $x$ 向右、$y$ 向上，$\theta$ 从竖直向下逆时针量取．除重力外，小环还受恒定水平向右的力 $F\ge0$．


  用虚功求出一个周期内的全部平衡位形，并用势能曲率区分稳定性．说明为何无需先求铁丝反力，以及「平衡」为何不等于「稳定」．'
