solution: '位置映射为 $\boldsymbol r=(x,h(t)+x^2/(2a))$．沿真实运动求全导数得到


  $$

  \boldsymbol v=(\dot x,\dot h+x\dot x/a).

  $$


  虚位移在同一时刻进行，故 $\delta t=0$、$\delta h=0$，只有坐标 $x$ 改变：


  $$

  \delta\boldsymbol r=(1,x/a)\delta x,\qquad

  \boldsymbol f\cdot\delta\boldsymbol r

  =\lambda(-x/a+x/a)\delta x=0.

  $$


  实际功率则是


  $$

  P_f=\boldsymbol f\cdot\boldsymbol v

  =\lambda[-(x/a)\dot x+\dot h+(x/a)\dot x]

  =\lambda\dot h.

  $$


  维持导轨运动的装置可向质点传递或取走能量，符号由 $\lambda\dot h$ 决定．当 $\dot h=0$ 时恢复固定光滑导轨的零实际功率．功率结果的单位是 $\mathrm{N\,m/s}$．'
