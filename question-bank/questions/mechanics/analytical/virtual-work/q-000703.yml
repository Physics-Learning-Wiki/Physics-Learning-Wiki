stem: '质点在光滑移动抛物线导轨上运动，约束为 $y=h(t)+x^2/(2a)$，$a>0$ 为长度常量，$h(t)$ 是已知高度．取 $x$ 为广义坐标，反力写成 $\boldsymbol f=\lambda(-x/a,1)$，其中
  $\lambda$ 的单位为牛顿．


  写出位置、真实速度、容许虚位移，验证反力零虚功，并求反力的实际功率．明确在哪一步固定时间，说明已知导轨运动怎样参与能量交换．'
