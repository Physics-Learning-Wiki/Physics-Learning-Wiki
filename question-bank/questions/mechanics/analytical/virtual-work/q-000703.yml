reference_answer: $\boldsymbol v=(\dot x,\dot h+x\dot x/a)$，$\delta\boldsymbol r=(1,x/a)\delta x$，$\delta W_f=0$，$P_f=\lambda\dot
  h$．
hints:
- 先分别求全时间导数与等时变分，不要让 $\delta h$ 带入已知时间演化．
- 实际功率使用完整真实速度，包括 $\dot h$．
