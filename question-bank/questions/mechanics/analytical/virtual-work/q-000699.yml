type: multiple_choice
choice_order: shuffle
stem: 对固定光滑圆轨道上的质点，以下哪些关于虚位移的陈述成立？
choices:
- id: A
  content: 虚位移是一阶切向变化．
- id: B
  content: 每个容许虚位移都必须等于当前速度乘同一个时间间隔．
- id: C
  content: 可以分别检验正向和反向的无穷小切向变化．
- id: D
  content: 沿切线走任意有限距离仍严格位于圆周．
answer:
  choices:
  - A
  - C
feedback:
  choices:
    A: 距离约束的一阶变分要求径向分量为零．
    B: 当前速度只是运动状态，不能穷尽任意容许变化．
    C: 固定双侧等式约束允许两种切向符号．
    D: 切向关系只是一阶关系，有限切线位移通常离开圆周．
  correct: 已选出全部成立的陈述．请核对每条结论的条件．
  incorrect: 逐条检查陈述，不要用一条正确结论替代其余判断．
hints:
- 分别检查「固定时刻」「一阶」「任意容许方向」三个条件．
solution: 圆周约束的一阶变分使虚位移位于该点的切空间．虚位移可独立于当前速度选取；它是无穷小的一阶变化，不能解释成沿直切线的任意有限移动．
