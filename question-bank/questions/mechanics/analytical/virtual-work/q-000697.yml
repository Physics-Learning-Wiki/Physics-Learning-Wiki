type: single_choice
choice_order: shuffle
stem: 质点受光滑移动直导轨约束 $y=h(t)+a x$，$a$ 为常量．在固定时刻的容许虚位移满足哪一式？
choices:
- id: A
  content: $\delta y=a\,\delta x$．
- id: B
  content: $\delta y=\dot h\,\delta t+a\,\delta x$，且 $\delta t$ 可任意．
- id: C
  content: $\delta y=0$．
- id: D
  content: $\delta x=\dot x\,\mathrm dt$，只能沿真实运动方向．
answer:
  choice: A
feedback:
  choices:
    A: 固定时间时 $h(t)$ 不发生虚变化．
    B: 虚位移的等时条件是 $\delta t=0$．
    C: 导轨斜率不一定为零，沿轨道的变化一般含竖直分量．
    D: 容许虚位移不是某条真实轨迹已经发生的位移．
  correct: 判断正确．请结合解析检查所用条件．
  incorrect: 先按提示重建所需关系，再对照各项反馈．
hints:
- 对约束取变分时先写出 $\delta t=0$．
solution: 对约束在同一时刻取一阶变分，得到 $\delta y-a\delta x=0$．而真实速度满足 $\dot y-a\dot x=\dot h$．两式分别固定时间和沿真实时间演化，不能混用．
