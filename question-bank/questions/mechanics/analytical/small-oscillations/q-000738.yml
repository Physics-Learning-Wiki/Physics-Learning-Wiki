type: single_choice
choice_order: shuffle
stem: 按 $\eta=\varepsilon u(t)$ 且在固定时间尺度上 $u,\dot u$ 有界计数，动能项 $a\eta\dot\eta^2$（$a$ 为常量）是几阶？
choices:
- id: A
  content: 一阶．
- id: B
  content: 二阶．
- id: C
  content: 三阶．
- id: D
  content: 无法计数，因为速度不是小量．
answer:
  choice: C
feedback:
  choices:
    A: 需要同时计入位移和两个速度因子．
    B: 速度平方是二阶，再乘位移会升一阶．
    C: 三个一阶因子相乘给出三阶．
    D: 题面已给共同小参数的速度计数条件．
  correct: 判断正确．请结合解析检查所用条件．
  incorrect: 先按提示重建所需关系，再对照各项反馈．
hints:
- 把每个因子中的 $\varepsilon$ 都写出来．
solution: $\dot\eta=\varepsilon\dot u$，因此 $a\eta\dot\eta^2=a\varepsilon^3u\dot u^2$，是三阶．二次动能中可舍去该项，但这依赖位移与速度在所用时间尺度上都按同一个小参数计数．
