reference_answer: $k>0$ 时零点稳定，$\omega=\sqrt{k/m}$；$k=0$ 时零点稳定但二阶近似退化；$k<0$ 时零点不稳定，$\pm\sqrt{-k/\alpha}$ 稳定，$\omega=\sqrt{-2k/m}$．
hints:
- 先求全部驻点，再在各驻点计算曲率，不要只检查原点．
- 二阶项消失时回到原势能和原方程，区分稳定与线性简谐近似．
feedback:
  correct: 已记录你的自评．请按本题标准确认推导和检查是否齐全．
  incorrect: 对照参考解答定位缺失步骤，再记录自评；本题不自动判断文字答案．
solution: '平衡条件是 $V''=x(k+\alpha x^2)=0$，曲率为 $V''''=k+3\alpha x^2$．


  当 $k>0$ 时只有 $x_0=0$，曲率为 $k>0$，故 $\omega_0=\sqrt{k/m}$．


  当 $k=0$ 时也只有零点．原势能 $\alpha x^4/4$ 在零点有严格极小值，且正定动能与势能一起限制足够小能量的位移和速度，因此该平衡稳定．但 $V''''(0)=0$，二次近似没有回复项，不能给出正的线性振动频率．原方程仍是
  $m\ddot x+\alpha x^3=0$，并非自由运动．


  当 $k<0$ 时有三处平衡．零点曲率为负，故不稳定．另外两点为 $x_0=\pm\sqrt{-k/\alpha}$，代回曲率得


  $$

  V''''(x_0)=k+3\alpha(-k/\alpha)=-2k>0.

  $$


  故两处均非退化稳定，置 $\eta=x-x_0$ 后线性方程为 $m\ddot\eta-2k\eta=0$，角频率为 $\sqrt{-2k/m}$．这里 $k$ 的单位是 $\mathrm{N/m}$、$\alpha$ 是 $\mathrm{N/m^3}$，各频率量纲均正确．'
