stem: '一个长度坐标模型有 $T=m\dot x^2/2$、$V(x)=kx^2/2+\alpha x^4/4$，其中 $m,\alpha>0$，$k$ 可正、可零、可负．无驱动与阻力．


  分别讨论 $k>0$、$k=0$、$k<0$ 时全部平衡位置及其稳定性．对每个非退化稳定平衡求线性小振动角频率；解释零曲率情形为什么不能当作原系统自由运动．'
