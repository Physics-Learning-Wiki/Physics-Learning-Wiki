solution: '在共同小量计数下，$\dot X\dot\theta$ 已是二阶，故其中 $\cos\theta$ 只取零阶的一．余弦二阶修正乘速度乘积是四阶．势能用 $1-\cos\theta=\theta^2/2+O(\theta^4)$，得到


  $$

  L^{(2)}=\frac12(M+m)\dot X^2+ml\dot X\dot\theta+\frac12ml^2\dot\theta^2

  -\frac12kX^2-\frac12mgl\theta^2.

  $$


  按坐标顺序 $(X,\theta)$ 读出


  $$

  M_q=\begin{pmatrix}M+m&ml\\ml&ml^2\end{pmatrix},\qquad

  K_q=\begin{pmatrix}k&0\\0&mgl\end{pmatrix}.

  $$


  方程为 $(M+m)\ddot X+ml\ddot\theta+kX=0$、$ml\ddot X+ml^2\ddot\theta+mgl\theta=0$．交叉动能本身就是二阶，小角度并不使它成为高阶．


  $M_q$ 的第一主子式正、行列式为 $Mml^2>0$，$K_q$ 的两对角元均正，故两矩阵正定．$M_{11},M_{12},M_{22}$ 的单位分别是 $\mathrm{kg}$、$\mathrm{kg\,m}$、$\mathrm{kg\,m^2}$；$K_{11}$
  是 $\mathrm{N/m}$，$K_{22}$ 是 $\mathrm{N\,m}$．第一行方程是力、第二行是力矩，每个能量项仍具有焦耳单位．'
