stem: '带弹簧小车悬摆模型中，车质量 $M>0$、摆球质量 $m>0$、杆长 $l>0$、车的对地弹簧劲度 $k>0$．车位移 $X$ 从弹簧自然长度位置向右量取，摆角 $\theta$ 从竖直向下逆时针量取，支承固定、无阻力．其能量为


  $$

  T=\frac12(M+m)\dot X^2+ml\dot X\dot\theta\cos\theta+\frac12ml^2\dot\theta^2,\qquad

  V=\frac12kX^2+mgl(1-\cos\theta).

  $$


  在 $(X,\theta)=(0,0)$ 附近构造二次拉格朗日量、$M_q,K_q$ 和线性方程．说明为何动能交叉项不能删除，检查正定性及混合量纲坐标的矩阵单位．'
