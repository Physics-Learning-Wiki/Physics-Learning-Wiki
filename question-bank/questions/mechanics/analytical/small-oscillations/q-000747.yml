reference_answer: $M_q=\begin{pmatrix}M+m&ml\\ml&ml^2\end{pmatrix}$，$K_q=\operatorname{diag}(k,mgl)$；$\det M_q=Mml^2>0$，$\det
  K_q=kmgl>0$．
hints:
- 只对余弦作展开，并给每个速度因子计阶，避免把二阶交叉项一起删除．
- 用行列式检查质量矩阵，并按各坐标的单位逐项检查动能．
feedback:
  correct: 已记录你的自评．请按本题标准确认推导和检查是否齐全．
