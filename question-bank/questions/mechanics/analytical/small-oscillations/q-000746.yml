reference_answer: $M=m\operatorname{diag}(1,2)$，$K=k\begin{pmatrix}2&-1\\-1&2\end{pmatrix}$；$m\ddot x_1+2kx_1-kx_2=0$，$2m\ddot
  x_2+2kx_2-kx_1=0$．
hints:
- 从三根弹簧分别写势能，再展开中间伸长的平方．
- 相同位移是一种瞬时检查位形，不一定是该不等质量系统的振型．
feedback:
  correct: 已记录你的自评．请按本题标准确认推导和检查是否齐全．
  incorrect: 对照参考解答定位缺失步骤，再记录自评；本题不自动判断文字答案．
solution: '端部弹簧长度变化的大小由 $x_1,x_2$ 给出，中间弹簧的变化为 $x_2-x_1$，所以


  $$

  T=\frac12m\dot x_1^2+\frac12(2m)\dot x_2^2,\qquad

  V=\frac12kx_1^2+\frac12k(x_2-x_1)^2+\frac12kx_2^2.

  $$


  展开势能，交叉项为 $-kx_1x_2$，因此


  $$

  M=m\begin{pmatrix}1&0\\0&2\end{pmatrix},\qquad

  K=k\begin{pmatrix}2&-1\\-1&2\end{pmatrix}.

  $$


  从矩阵方程得到 $m\ddot x_1+2kx_1-kx_2=0$、$2m\ddot x_2+2kx_2-kx_1=0$．$M$ 对角元正；$K$ 的第一顺序主子式为 $2k>0$，行列式为 $3k^2>0$，故两矩阵正定．


  当两位移相同为 $a$ 时，中间弹簧不伸长，势能仅来自两端，为 $ka^2$；各滑块的回复力均为 $-ka$．这验证了交叉项的符号与系数，但不表示两质量在这种位形下必有相同加速度．'
