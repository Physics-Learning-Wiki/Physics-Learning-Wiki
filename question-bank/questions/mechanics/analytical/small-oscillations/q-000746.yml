stem: '两个滑块在固定光滑水平导轨上运动，质量分别为 $m$ 与 $2m$，$m>0$．两端各用劲度系数 $k>0$ 的弹簧连到固定墙，中间也以劲度系数 $k$ 的弹簧相连．用相对静止平衡位置的位移 $x_1,x_2$ 作坐标，各弹簧均在线性范围内，无阻力．


  从各弹簧的长度变化构造二次能量、质量矩阵与刚度矩阵，并写出两条方程．证明两矩阵正定，再用 $x_1=x_2$ 的位形检查中间弹簧的贡献．本题不要求求频率．'
