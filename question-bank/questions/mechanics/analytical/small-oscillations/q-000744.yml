stem: 一个角坐标的二次能量为 $T^{(2)}=J\dot\theta^2/2$、$V^{(2)}=\kappa\theta^2/2$，其中 $J=0.50\,\mathrm{kg\,m^2}$、$\kappa=2.0\,\mathrm{N\,m}$．求固有角频率．
answer:
  value: 2.0
  tolerance:
    type: absolute
    value: 1.0e-06
  unit:
    required: true
    accepted:
    - rad/s
    canonical: rad/s
feedback:
  correct: 数值与容差要求相符．请继续核对解析中的单位和符号．
  incorrect: 按提示重算，并检查单位、正方向及是否遗漏几何系数．
hints:
- 先用两个能量系数的比求角频率平方，并检查单位．
solution: 方程为 $J\ddot\theta+\kappa\theta=0$，所以 $\omega_0=\sqrt{\kappa/J}=\sqrt{4.0\,\mathrm{s^{-2}}}=2.0\,\mathrm{rad/s}$．质量矩阵元素此处是转动惯量，刚度系数有能量单位，两者的比仍给出角频率平方．
