stem: 平面双摆由两个质点和两根长度固定的轻杆组成，第一根杆连接固定支点与第一质点，第二根杆连接两个质点。最自然的独立角坐标有几个？
choices:
- id: A
  content: 1 个
- id: B
  content: 2 个
- id: C
  content: 3 个
- id: D
  content: 4 个
answer:
  choice: B
feedback:
  choices:
    A: 只有一根杆的平面单摆才只需一个独立角度。
    B: 正确，两根杆的方向角可独立标记双摆位形。
    C: 杆长约束已由两个角坐标自动满足，不需另加坐标。
    D: 不应把两个质点的直角坐标分量全部当作独立坐标。
  correct: 正确，平面双摆有两个位形自由度。
  incorrect: 直接用两根杆各自的方向角表示位形，检查杆长是否已自动满足。
hints:
- 每根固定长度的杆在平面内还剩下哪一个独立变化？
solution: 两个质点原有四个平面位置分量，两条独立杆长约束留下 $4-2=2$ 个位形自由度。用两根杆相对固定竖直方向的角度作为广义坐标，能自动满足两条长度约束。
