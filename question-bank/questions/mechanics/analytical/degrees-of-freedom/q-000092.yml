stem: 半径为 $R>0$ 的球面上有一个质点。关于它的位形自由度，下列哪些说法正确？
choices:
- id: A
  content: 它有 2 个位形自由度，因为一个独立的位置约束把三维坐标数从 3 降为 2。
- id: B
  content: 它有 3 个位形自由度，因为质点仍处在三维空间。
- id: C
  content: 在坐标有效的区域内，可用两个独立角坐标描述球面上的位置。
- id: D
  content: 它有 1 个位形自由度，因为球面方程只含一个等式。
answer:
  choices:
  - A
  - C
feedback:
  choices:
    A: 正确。球面方程在 $R>0$ 时给出一个独立的位置限制。
    B: 质点受球面限制，不能任意改变三个位置分量。
    C: 正确。球面局部需要两个独立参数；极点等处需注意坐标奇异性。
    D: 约束方程的个数不是剩余自由度；应从坐标数中减去独立约束秩。
  correct: 正确，球面是三维空间中的二维位形集合。
  incorrect: 从三个位置坐标中减去球面约束的秩，并记住坐标只需在局部有效。
hints:
- 检查约束 $x^2+y^2+z^2=R^2$ 的梯度是否处处为零。
solution: 球面质点的坐标满足 $x^2+y^2+z^2=R^2$。当 $R>0$ 时该约束梯度不为零，因此它独立，位形空间局部维数为 $3-1=2$。球面角坐标在极点等处有坐标奇异性，但不改变球面的维数。
