stem: 一块始终竖直、可改变前进方向且无滑动滚动的圆盘，用接触位置 $(x,y)$、前进方向角 $\phi$ 和自转角 $\theta$ 描述位形。下列哪些判断正确？
choices:
- id: A
  content: 位形自由度为 4，因为这四个位置与姿态参数局部独立。
- id: B
  content: 位形自由度为 2，因为无滑动条件直接消去了两个位置坐标。
- id: C
  content: 两条独立无滑动速度约束使容许速度有 2 个独立分量。
- id: D
  content: 位形自由度与容许速度数在任何约束模型中必定相等。
answer:
  choices:
  - A
  - C
feedback:
  choices:
    A: 正确。固定高度和竖直姿态已消去，剩余四个局部位形参数。
    B: 无滑动约束限制速度；这个可转向模型中它们不能作为两个独立位置方程消去坐标。
    C: 正确。四个广义速度受两条独立线性速度约束，留下两个独立分量。
    D: 该圆盘模型正说明位形维数和容许速度数可能不同。
  correct: 正确。该模型有 4 个位形自由度和 2 个独立容许速度分量。
  incorrect: 分别计数位形参数与速度约束的秩，不要将两种数量混为一谈。
hints:
- 先数 $(x,y,\phi,\theta)$，再对四个广义速度施加两条独立无滑动关系。
solution: 固定高度和竖直姿态已消去后，$(x,y,\phi,\theta)$ 给出四维位形空间。无滑动关系为 $\dot x=a\dot\theta\cos\phi$ 与 $\dot y=a\dot\theta\sin\phi$，两条独立速度约束使每个位形处的容许速度有
  $4-2=2$ 个独立分量。对可转向圆盘，这些速度约束不能一般地积分为两个位置约束，因此位形自由度仍为 $4$。
