stem: 下列关于速度约束的说法，哪一项正确？
choices:
- id: A
  content: 约束式只要含有广义速度，就一定是非完整约束。
- id: B
  content: $\dot x-v_0=0$（$v_0$ 为常数）可积分为 $x-v_0t=C$，所以它不因含速度而自动成为非完整约束。
- id: C
  content: 约束显含时间，就一定是非完整约束。
- id: D
  content: 含有三角函数的速度约束一定不能积分。
answer:
  choice: B
feedback:
  choices:
    A: 含速度不是判别完整性的充分条件；还需检查是否可化为位置与时间的关系。
    B: 正确，积分后得到位置和时间关系，属于完整约束。
    C: 显含时间的完整约束称为非定常约束，不等同于非完整约束。
    D: 函数形式本身不能判定可积性，应检查约束能否化为位置关系。
  correct: 正确，速度形式的约束有时可积分为完整约束。
  incorrect: 判别时检查约束能否化为只含位置和时间的等式。
hints:
- 对 $\dot x=v_0$ 两边关于时间积分，会得到什么？
solution: 对 $\dot x=v_0$ 积分得 $x-v_0t=C$，这是一条只含位置与时间的完整约束。因此不能仅凭约束中出现广义速度，就判定它非完整。
