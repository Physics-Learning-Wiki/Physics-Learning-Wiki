stem: 平面质点的位置为 $(x,y)$，并满足 $x^2+y^2=L^2$ 与 $2x^2+2y^2=2L^2$，其中 $L>0$。按独立约束的秩计数，它有多少个位形自由度？
answer:
  value: 1
  tolerance:
    type: absolute
    value: 0
  unit:
    required: false
    accepted: []
feedback:
  correct: 正确，两条方程互为倍数，只提供一个独立限制。
  incorrect: 先判断两条约束是否独立，再从两个位置坐标中减去约束秩。
hints:
- 第二个等式是否提供了第一式之外的新信息？
solution: 第二个等式是第一个等式的两倍，两个约束的梯度线性相关，约束秩为 $1$。因此位形自由度为 $2-1=1$。
