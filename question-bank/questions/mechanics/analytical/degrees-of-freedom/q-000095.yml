    accepted: []
feedback:
  correct: 正确，六个平面坐标受三个独立固定距离约束。
  incorrect: 三个平面质点共有六个位置分量；非退化三角形的三条边长约束独立。
hints:
- 先数三个质点的平面坐标，再检查三条固定距离条件的独立性。
solution: 三个平面质点共有 $2\times3=6$ 个位置坐标。非退化三角形的三条固定边长约束独立，因此位形自由度为 $6-3=3$，对应整体的两个平移和一个转动。
