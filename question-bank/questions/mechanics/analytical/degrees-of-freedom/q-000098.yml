feedback:
  correct: 正确。自由度计数描述位形维数；二阶运动方程还需要初速度。
  incorrect: 一个独立角度描述位形，但不能单独确定摆的运动方向和快慢。
hints:
- 单摆的运动方程对角度含几阶时间导数？
solution: 单摆有一个位形自由度，但其运动方程是二阶微分方程。一般需要指定初始摆角和初始角速度，才能确定运动。
