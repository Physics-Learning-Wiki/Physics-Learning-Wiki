stem: 关于广义坐标与位形自由度，下列哪些说法正确？
choices:
- id: A
  content: 广义坐标必须是笛卡尔坐标。
- id: B
  content: 广义坐标可以是长度、角度或其他适合标记位形的参数。
- id: C
  content: 在坐标有效的局部区域内，独立广义坐标的数目等于位形空间维数。
- id: D
  content: 若系统有 $n$ 个位形自由度，就只需 $n$ 个初始数值即可确定任意二阶运动。
answer:
  choices:
  - B
  - C
feedback:
  choices:
    A: 广义坐标不局限于笛卡尔坐标，也可选角度等参数。
    B: 正确，广义坐标按能否独立标记容许位形来选择。
    C: 正确，非奇异局部坐标需要与位形空间维数相同的独立参数。
    D: 位形自由度不等于完整动力学初态所需数据数；通常还需各坐标的初速度。
  correct: 正确，广义坐标是适合描述容许位形的独立参数。
  incorrect: 把位形参数与笛卡尔坐标、速度和完整初态区分开。
hints:
- 单摆用角度表示位形时，角度是不是笛卡尔坐标？
solution: 广义坐标只要求在所用区域内独立地标记容许位形，可以是长度、角度等。若位形空间局部维数为 $n$，就需要 $n$ 个独立广义坐标；确定二阶动力学通常还要给出对应的 $n$ 个初速度。
