feedback:
  choices:
    A: 质点的位置仍可改变，并非没有自由度。
    B: 平面位置需要两个独立坐标。
    C: 正确，平面内的位置可由两个独立坐标确定。
    D: 三个位置坐标对应三维空间中的自由质点。
  correct: 正确，平面质点有两个独立的位置坐标。
  incorrect: 先数描述平面位置所需的坐标，再减去独立约束数。
