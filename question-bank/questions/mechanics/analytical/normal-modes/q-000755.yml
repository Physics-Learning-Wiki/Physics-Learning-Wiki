choice_order: shuffle
stem: 某简正方向的刚度为零，且原势能对该方向的平移严格不变．若该简正坐标的初态为 $Q_0(0)=A$、$\dot Q_0(0)=V$，运动应写成什么？
choices:
- id: A
  content: $Q_0(t)=A+Vt$．
- id: B
  content: $Q_0(t)=A\cos0t+(V/0)\sin0t$，无需另作处理．
- id: C
  content: $Q_0(t)=A$，任何 $V$ 都会被约束消去．
- id: D
  content: $Q_0(t)=A\mathrm e^{-t}$．
answer:
  choice: A
feedback:
  choices:
    A: 零模满足 $\ddot Q_0=0$，可含匀速项．
    B: 包含除以零的写法没有定义，应先求解零模方程．
    C: 零刚度不消去初速度．
    D: 题面没有阻尼，不能引入指数衰减．
  correct: 判断正确．请结合解析检查所用条件．
  incorrect: 先按提示重建所需关系，再对照各项反馈．
hints:
- 直接求解零角频率对应的微分方程，避免使用含除法的振动通式．
solution: 零模方程是 $\ddot Q_0=0$，直接积分得 $A+Vt$．原势能严格平移不变确保这一方向确实无回复力．若仅知道二阶曲率为零而原势能含高阶项，则不能把此结论直接用于原系统．
