stem: 质量矩阵 $M=\operatorname{diag}(1,2)\,\mathrm{kg}$，两个无量纲振型方向为 $\boldsymbol a=(2,1)^{\mathsf T}$、$\boldsymbol b=(1,-1)^{\mathsf
  T}$．它们的质量内积 $\boldsymbol a^{\mathsf T}M\boldsymbol b$ 是多少？
answer:
  value: 0.0
  tolerance:
    type: absolute
    value: 1.0e-09
  unit:
    required: true
    accepted:
    - kg
    canonical: kg
feedback:
  correct: 数值与容差要求相符．请继续核对解析中的单位和符号．
  incorrect: 按提示重算，并检查单位、正方向及是否遗漏几何系数．
hints:
- 先让质量矩阵作用于一个振型，再与另一个作点积．
solution: $M\boldsymbol b=(1,-2)^{\mathsf T}\,\mathrm{kg}$，故质量内积为 $2(1)+1(-2)=0\,\mathrm{kg}$．普通点积却为 $2-1=1$．此例说明普通点积非零不排斥质量正交．
