stem: '两个水平滑块质量为 $m,2m$，三根劲度系数均为 $k>0$ 的弹簧依次连接左墙、两滑块和右墙，支承固定，无阻力．相对平衡位移为 $\boldsymbol x=(x_1,x_2)^{\mathsf T}$，已有


  $$

  M=m\begin{pmatrix}1&0\\0&2\end{pmatrix},\qquad

  K=k\begin{pmatrix}2&-1\\-1&2\end{pmatrix}.

  $$


  求两固有角频率、振型及质量归一化因子．再求初态 $\boldsymbol x(0)=(d,0)^{\mathsf T}$、$\dot{\boldsymbol x}(0)=0$ 下的运动，验证质量正交、初态和能量．$d$ 处于弹簧线性范围内．'
