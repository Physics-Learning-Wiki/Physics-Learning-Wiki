solution: '令 $\lambda=m\omega^2/k$，频率方程为 $(2-\lambda)(2-2\lambda)-1=0$，所以


  $$

  \lambda_L=\frac{3-\sqrt3}{2},\qquad

  \lambda_H=\frac{3+\sqrt3}{2},\qquad

  \omega_{L,H}=\sqrt{\frac{k}{m}\lambda_{L,H}}.

  $$


  由第一行得到振幅比 $r=2-\lambda$．取 $r_L=(1+\sqrt3)/2$、$r_H=(1-\sqrt3)/2$，振型为 $\boldsymbol a_L=(1,r_L)^{\mathsf T}$、$\boldsymbol a_H=(1,r_H)^{\mathsf
  T}$．两者满足 $r_Lr_H=-1/2$，故


  $$

  \boldsymbol a_L^{\mathsf T}M\boldsymbol a_H=m(1+2r_Lr_H)=0.

  $$


  质量范数平方是 $n_L^2=m(3+\sqrt3)$、$n_H^2=m(3-\sqrt3)$，归一化振型为 $\boldsymbol b_{L,H}=\boldsymbol a_{L,H}/n_{L,H}$．初态投影给出 $Q_{L,H}(0)=md/n_{L,H}$、$\dot
  Q_{L,H}(0)=0$．还原后


  $$

  x_1(t)=\frac{d}{3+\sqrt3}\cos\omega_Lt+\frac{d}{3-\sqrt3}\cos\omega_Ht,

  $$


  $$

  x_2(t)=\frac{d}{2\sqrt3}(\cos\omega_Lt-\cos\omega_Ht).

  $$


  利用 $1/(3+\sqrt3)+1/(3-\sqrt3)=1$，可恢复初位移；两式初导数均为零．每一振型均满足 $K\boldsymbol a=\omega^2M\boldsymbol a$，所以叠加满足运动方程．初能量为 $kd^2$，模态能量之和也为


  $$

  \frac12\omega_L^2\frac{m^2d^2}{n_L^2}

  +\frac12\omega_H^2\frac{m^2d^2}{n_H^2}=kd^2.

  $$


  普通点积一般不为零，不影响质量正交结论．'
