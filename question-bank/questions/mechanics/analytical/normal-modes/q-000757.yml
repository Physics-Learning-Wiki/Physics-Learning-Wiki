reference_answer: $\omega_{L,H}^2=(k/m)(3\mp\sqrt3)/2$，振型可取 $(1,(1\pm\sqrt3)/2)^{\mathsf T}$；$x_1=d[\cos\omega_Lt/(3+\sqrt3)+\cos\omega_Ht/(3-\sqrt3)]$，$x_2=d(\cos\omega_Lt-\cos\omega_Ht)/(2\sqrt3)$．
hints:
- 先以 $\lambda=m\omega^2/k$ 无量纲化；第一行即可得到振幅比．
- 投影必须使用 $M$；用初态和 $kd^2$ 的总能量独立检查系数．
