type: single_choice
choice_order: shuffle
stem: 系统的两个独立振型是 $\boldsymbol a_1=(1,1)^{\mathsf T}$ 和 $\boldsymbol a_2=(1,-1)^{\mathsf T}$．初始位移为 $(a,a)^{\mathsf T}$，初始速度为
  $(v,-v)^{\mathsf T}$，$a,v\ne0$．后续运动包含哪些模态？
choices:
- id: A
  content: 只有第一模态，因为初始位移沿第一振型．
- id: B
  content: 只有第二模态，因为初速度沿第二振型．
- id: C
  content: 两个模态都有．
- id: D
  content: 无法由位移和速度确定运动．
answer:
  choice: C
feedback:
  choices:
    A: 第二模态有非零初速度，会产生正弦项．
    B: 第一模态有非零初始位移，会产生余弦项．
    C: 位置与速度分别激发不同模态，均需保留．
    D: 完整初始位移与速度足以确定此线性系统的运动．
  correct: 判断正确．请结合解析检查所用条件．
  incorrect: 先按提示重建所需关系，再对照各项反馈．
hints:
- 把位置与速度分别展开，不要只检查一组初态．
solution: 在振型幅值表示中，第一模态的初始幅值为 $a$、初始速度为零；第二模态初始幅值为零、初始速度为 $v$．因此分别有余弦项与正弦项．纯模要求初始位移和初始速度都不含其他模态分量．
