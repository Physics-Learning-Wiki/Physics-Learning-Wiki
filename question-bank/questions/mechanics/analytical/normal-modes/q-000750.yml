solution: $M^{-1}K$ 与实对称正定矩阵 $M^{-1/2}KM^{-1/2}$ 相似，所以其特征值仍为正实数．问题是一般不能用普通点积断言原振型正交，应使用质量内积．非对称的矩阵外形不直接决定它是否有复特征值．
