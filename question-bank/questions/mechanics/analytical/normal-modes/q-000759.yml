stem: '三个质量均为 $m>0$ 的质点在同一直线上运动，只以两根劲度系数均为 $k>0$ 的相邻弹簧相连，无端部固定弹簧、无外力．相对平衡位移为 $\boldsymbol x=(x_1,x_2,x_3)^{\mathsf T}$，弹簧处于线性范围．


  初态为 $\boldsymbol x(0)=(d,0,0)^{\mathsf T}$，$\dot{\boldsymbol x}(0)=v(1,1,1)^{\mathsf T}$．求三个模态并写出完整运动，说明质心运动和内部振动分别由哪些模态承担，并核对初态与能量．'
