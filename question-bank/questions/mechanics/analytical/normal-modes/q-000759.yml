reference_answer: $\boldsymbol x=(d/3+vt)(1,1,1)^{\mathsf T}+(d/2)\cos(\sqrt{k/m}\,t)(1,0,-1)^{\mathsf T}+(d/6)\cos(\sqrt{3k/m}\,t)(1,-2,1)^{\mathsf
  T}$．
hints:
- 先利用整体平移和两端对称性猜振型，再代回矩阵方程核对．
- 分别分解初位移与初速度；共同初速度只进入零模．
feedback:
  correct: 已记录你的自评．请按本题标准确认推导和检查是否齐全．
  incorrect: 对照参考解答定位缺失步骤，再记录自评；本题不自动判断文字答案．
solution: '矩阵为 $M=mI$、$K=k\begin{pmatrix}1&-1&0\\-1&2&-1\\0&-1&1\end{pmatrix}$．可直接检验三个振型和频率：


  $$

  \boldsymbol a_0=(1,1,1)^{\mathsf T},\quad\omega_0=0;\qquad

  \boldsymbol a_1=(1,0,-1)^{\mathsf T},\quad\omega_1^2=k/m;

  $$


  $$

  \boldsymbol a_2=(1,-2,1)^{\mathsf T},\qquad\omega_2^2=3k/m.

  $$


  质量范数平方分别为 $3m,2m,6m$，三者两两质量正交．初位移分解为 $(d/3)\boldsymbol a_0+(d/2)\boldsymbol a_1+(d/6)\boldsymbol a_2$，初速度只有零模分量．因此


  $$

  \boldsymbol x(t)=\left(\frac d3+vt\right)\boldsymbol a_0+

  \frac d2\cos\omega_1t\,\boldsymbol a_1+

  \frac d6\cos\omega_2t\,\boldsymbol a_2.

  $$


  零模必须直接解 $\ddot u_0=0$，不可代入含 $1/\omega_0$ 的表达式．质心位置变化为 $d/3+vt$；另外两振型分量和为零，只承担内部振动．原势能对整体平移严格不变，因此这里的自由零模不是二次展开遗漏四次回复力的结果．


  初态由上述分解直接恢复．初总能量为 $3mv^2/2+kd^2/2$；零模动能为 $3mv^2/2$，两个非零模能量各为 $kd^2/4$．三项相加与原能量一致．'
