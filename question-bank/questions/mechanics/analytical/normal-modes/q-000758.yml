stem: '一个二自由度保守线性系统有 $M=m\operatorname{diag}(1,2)$、$K=\omega_0^2M$，$m,\omega_0>0$，两个位移坐标都具有长度单位．给定同一频率子空间内的两个独立振型 $\boldsymbol
  a_1=(1,0)^{\mathsf T}$、$\boldsymbol a_2=(1,1)^{\mathsf T}$．


  检验这两个振型是否质量正交，按质量内积正交化并归一化，写出简正坐标．说明频率简并为什么不造成振型缺失；对任意初始位移 $\boldsymbol x_0$ 和初始速度 $\boldsymbol v_0$ 写出运动，并说明更换该子空间的正交基是否改变运动．'
