reference_answer: 可取 $\boldsymbol b_1=(1,0)^{\mathsf T}/\sqrt m$、$\boldsymbol b_2=(0,1)^{\mathsf T}/\sqrt{2m}$，$Q_1=\sqrt
  m\,x_1$、$Q_2=\sqrt{2m}\,x_2$；$\boldsymbol x=\boldsymbol x_0\cos\omega_0t+\boldsymbol v_0\sin\omega_0t/\omega_0$．
hints:
- Gram–Schmidt 的投影分子与分母都使用质量内积．
- 两简正坐标频率相同，可以先在模态中求解，再还原为一个向量表达式．
feedback:
  correct: 已记录你的自评．请按本题标准确认推导和检查是否齐全．
  incorrect: 对照参考解答定位缺失步骤，再记录自评；本题不自动判断文字答案．
solution: '给定矩阵使每个非零向量都满足 $K\boldsymbol a=\omega_0^2M\boldsymbol a$，所以整个二维空间都是同一频率的特征子空间．原基底不正交，因为 $\boldsymbol a_1^{\mathsf
  T}M\boldsymbol a_2=m$．


  从第二个向量减去在第一个上的质量投影：


  $$

  \widetilde{\boldsymbol a}_2=\boldsymbol a_2-

  \frac{\boldsymbol a_1^{\mathsf T}M\boldsymbol a_2}

  {\boldsymbol a_1^{\mathsf T}M\boldsymbol a_1}\boldsymbol a_1

  =(0,1)^{\mathsf T}.

  $$


  质量范数分别为 $\sqrt m,\sqrt{2m}$，故可取


  $$

  B=\begin{pmatrix}1/\sqrt m&0\\0&1/\sqrt{2m}\end{pmatrix},\qquad

  \boldsymbol Q=B^{\mathsf T}M\boldsymbol x

  =(\sqrt m\,x_1,\sqrt{2m}\,x_2)^{\mathsf T}.

  $$


  两坐标均满足 $\ddot Q+\omega_0^2Q=0$，还原任意初态即得


  $$

  \boldsymbol x(t)=\boldsymbol x_0\cos\omega_0t+

  \frac{\boldsymbol v_0}{\omega_0}\sin\omega_0t.

  $$


  频差为零时并不自动保证最初基底正交，但可在完整子空间内另选质量正交基．更换基底会改变坐标分量及投影系数；二者同步变换后，实际 $\boldsymbol x(t)$ 不变．该式同时恢复两组初态并满足原矩阵方程．'
