type: single_choice
choice_order: shuffle
stem: 两个模态具有相同频率时，如何处理其振型？
choices:
- id: A
  content: 两个振型必线性相关，只剩一个独立模态．
- id: B
  content: 任取两个独立振型便自动质量正交．
- id: C
  content: 在同一特征子空间内按质量内积正交化，再归一化．
- id: D
  content: 必须给一个振型人为加入不同频率．
answer:
  choice: C
feedback:
  choices:
    A: 实对称正定广义问题仍有完整基底，简并不意味着缺失维数．
    B: 同频时由频差得到的等式不给出自动正交性．
    C: 子空间中的线性组合仍属于相同特征值．
    D: 不能为选择基底而改变原系统频率．
  correct: 判断正确．请结合解析检查所用条件．
  incorrect: 先按提示重建所需关系，再对照各项反馈．
hints:
- 频差为零时，正交证明还提供约束吗？
solution: 同频时 $(\omega_\alpha^2-\omega_\beta^2)\boldsymbol a_\alpha^{\mathsf T}M\boldsymbol a_\beta=0$ 成为恒等式，不强制原基底正交．可在该特征子空间内按质量内积执行
  Gram–Schmidt，再归一化；选择改变而物理子空间不变．
