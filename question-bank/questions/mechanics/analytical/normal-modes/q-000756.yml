choice_order: shuffle
stem: 对于已解耦的保守小振动系统，以下哪些陈述成立？
choices:
- id: A
  content: 每个简正模的能量分别守恒．
- id: B
  content: 原物体之间可以交换能量，即使模态能量各自不变．
- id: C
  content: 质量归一化后，简正坐标一定仍有长度单位．
- id: D
  content: 把全部模态初始位置和速度给齐后，初态信息数仍为原来的两倍自由度数．
answer:
  choices:
  - A
  - B
  - D
feedback:
  choices:
    A: 独立振子方程使各模态能量的导数为零．
    B: 物体分解与模态分解是不同的能量组织方式．
    C: 惯性尺度被吸收，单位由 $\dot Q^2$ 的能量量纲确定．
    D: 可逆坐标变换不减少初态信息．
  correct: 已选出全部成立的陈述．请核对每条结论的条件．
  incorrect: 逐条检查陈述，不要用一条正确结论替代其余判断．
hints:
- 区分一个物体、一个模态以及归一化后的坐标单位．
solution: 解耦后 $E_\alpha=(\dot Q_\alpha^2+\omega_\alpha^2Q_\alpha^2)/2$，用各模态方程即得 $\dot E_\alpha=0$．原物体运动是模态叠加，物体能量分配可以随时间变化．质量归一化改变坐标尺度与单位，但不改变独立初态数量．
