solution: '把约束沿真实路径写为 $\mathrm dz=(x/L)\,\mathrm dy$．两段水平边上 $\mathrm dy=0$，没有 $z$ 增量．向上的一边有 $x=a$，给出 $ab/L$；向下的一边有 $x=0$，增量为零．所以


  $$

  \Delta z=\oint\frac{x}{L}\,\mathrm dy=\frac{ab}{L}.

  $$


  相同的最终 $x,y$ 可以伴随不同的 $z$，因此不能只根据当前 $x,y$ 消去 $z$．这个计算也表明增量依赖路径，而非只依赖端点．在足够小的区域可用正反向小回路调整 $z$，并独立调整 $x,y$，没有额外位置等式把位形限制在二维曲面上．


  速度式的系数向量为 $(0,-x/L,1)$，始终非零，秩为一．给定 $\dot x,\dot y$ 后即确定 $\dot z$，所以三个位置变量对应两个独立容许速度分量．不能把这一个非完整速度限制直接当成一个已消去的位置约束．$ab/L$
  具有长度单位，与 $z$ 一致．'
