reference_answer: $\Delta z=ab/L$；速度约束不可普遍积分为 $z=z(x,y)$，位形维数为三，独立容许速度数为二．
hints:
- 逐段积分，不要在整个回路把 $x$ 当成同一常量．
- 速度限制的秩与位置等式的秩承担不同的计数任务．
