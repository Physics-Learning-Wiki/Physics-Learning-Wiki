stem: '两个质点在平面内运动，只由长度为 $l>0$ 的不可伸长轻杆相连，没有固定端，也没有其他约束．用杆中点的位置 $(X,Y)$ 和从 $x$ 正向逆时针量取的杆方向角 $\phi$ 描述位形．


  从四个笛卡尔位置分量出发计算位形自由度；写出两端的位置与速度映射，并验证杆长恒定．说明只用 $\phi$ 为什么不足，以及角度的周期性是否意味着多出一个自由度．本题只研究运动学．'
