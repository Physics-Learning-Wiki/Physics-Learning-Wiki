reference_answer: 一个独立距离约束留下三个位形自由度；$\boldsymbol r_{1,2}=(X,Y)\mp(l/2)(\cos\phi,\sin\phi)$，速度由全时间导数得到．
hints:
- 先检查距离约束的梯度是否可能在杆长非零时消失．
- 两端位置等于中点位置加减半根杆矢量；求速度时中点也可移动．
feedback:
  correct: 已记录你的自评．请按本题标准确认推导和检查是否齐全．
  incorrect: 对照参考解答定位缺失步骤，再记录自评；本题不自动判断文字答案．
solution: '距离约束为 $f=(x_2-x_1)^2+(y_2-y_1)^2-l^2=0$．因 $l>0$，两端不重合，梯度非零，约束秩为一，因此自由度为 $4-1=3$．


  按题面定义，取


  $$

  \boldsymbol r_1=(X-\tfrac l2\cos\phi,\ Y-\tfrac l2\sin\phi),\qquad

  \boldsymbol r_2=(X+\tfrac l2\cos\phi,\ Y+\tfrac l2\sin\phi).

  $$


  对时间求导：


  $$

  \boldsymbol v_1=(\dot X+\tfrac l2\dot\phi\sin\phi,\ \dot Y-\tfrac l2\dot\phi\cos\phi),\qquad

  \boldsymbol v_2=(\dot X-\tfrac l2\dot\phi\sin\phi,\ \dot Y+\tfrac l2\dot\phi\cos\phi).

  $$


  两端差矢量为 $l(\cos\phi,\sin\phi)$，长度恒为 $l$．仅给杆方向不能确定杆中点，故只用 $\phi$ 漏掉两个平移变量．$\phi$ 与 $\phi+2\pi$ 标记同一方向，是坐标的周期识别，不增加局部维数．这里的中点不必是质心，计数不依赖两质点质量是否相等．'
