reference_answer: $V=kx^2/2-mgx\sin\alpha$，$m\ddot x+kx-mg\sin\alpha=0$；$x_0=mg\sin\alpha/k$，$m\ddot\eta+k\eta=0$．
hints:
- 先用正方向确定高度变化的符号，再写重力势能．
- 将势能配成关于平衡位移的平方，可独立检查重力项是否只移动平衡．
feedback:
  correct: 已记录你的自评．请按本题标准确认推导和检查是否齐全．
  incorrect: 对照参考解答定位缺失步骤，再记录自评；本题不自动判断文字答案．
solution: '滑块沿导轨的速率为 $|\dot x|$，高度相对 $x=0$ 的变化为 $-x\sin\alpha$，所以


  $$

  T=\frac12m\dot x^2,\quad

  V=\frac12kx^2-mgx\sin\alpha,\quad

  L=T-V.

  $$


  独立坐标的拉格朗日方程给出


  $$

  m\ddot x+kx-mg\sin\alpha=0.

  $$


  令加速度为零可得 $x_0=mg\sin\alpha/k$．置 $\eta=x-x_0$ 后，恒定重力分量与静态弹簧力抵消，得到 $m\ddot\eta+k\eta=0$，故 $\omega_0=\sqrt{k/m}$．本题在理想线性弹簧的有效范围内不需另作小位移近似．


  将势能配方得 $V=k\eta^2/2-kx_0^2/2$，与平衡附近的回复系数一致．$mg/k$ 是长度，$\sqrt{k/m}$ 是时间的负一次方；$\alpha\to0$ 时平衡偏移趋零．'
