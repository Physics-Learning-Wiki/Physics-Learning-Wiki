stem: '质量 $m>0$ 的滑块套在固定光滑斜直导轨上，不会脱离．导轨与水平夹角 $\alpha\in(0,\pi/2)$，正坐标 $x$ 沿斜面向下．滑块由沿导轨的理想弹簧连接上方固定端，$x=0$ 为弹簧自然长度位置，劲度系数 $k>0$．重力加速度为
  $g$，无阻力．


  从位置与高度变化建立 $T,V,L$ 和运动方程，找出静止平衡位置．改用相对平衡的位移 $\eta$，说明重力如何影响平衡位置与振动角频率，并检查量纲．'
