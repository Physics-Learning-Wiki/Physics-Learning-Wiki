reference_answer: $T=\tfrac12(A+C+2B\cos\psi)\dot\theta_1^2+(C+B\cos\psi)\dot\theta_1\dot\psi+\tfrac12C\dot\psi^2$；新质量矩阵行列式为
  $AC-B^2\cos^2\psi>0$．
hints:
- 先变换速度，再把各平方与交叉项按新速度整理．
- 质量矩阵非对角元等于动能交叉项的系数；检验行列式而非只看对角元．
feedback:
  correct: 已记录你的自评．请按本题标准确认推导和检查是否齐全．
  incorrect: 对照参考解答定位缺失步骤，再记录自评；本题不自动判断文字答案．
solution: "同时代入 $\\theta_2=\\theta_1+\\psi$、$\\dot\\theta_2=\\dot\\theta_1+\\dot\\psi$，再展开平方，得到\n\n$$\nT=\\frac12(A+C+2B\\\
  cos\\psi)\\dot\\theta_1^2\n +(C+B\\cos\\psi)\\dot\\theta_1\\dot\\psi+\\frac12C\\dot\\psi^2,\n$$\n\n$$\nV=-(m_1+m_2)gl_1\\\
  cos\\theta_1-m_2gl_2\\cos(\\theta_1+\\psi).\n$$\n\n故新质量矩阵是\n\n$$\nM'=\\begin{pmatrix}\nA+C+2B\\cos\\psi&C+B\\cos\\psi\\\\\
  \nC+B\\cos\\psi&C\n\\end{pmatrix}.\n$$\n\n其行列式为 $AC-B^2\\cos^2\\psi=m_2l_1^2l_2^2(m_1+m_2\\sin^2\\psi)>0$，且 $C>0$，因此矩阵正定．也可把坐标变换写成\
  \ $\\boldsymbol\\theta=J(\\theta_1,\\psi)^{\\mathsf T}$，$J=\\begin{pmatrix}1&0\\\\1&1\\end{pmatrix}$，由速度关系得 $M'=J^{\\mathsf\
  \ T}MJ$．\n\n直接代入原能量式得到新能量式，保证同一状态的能量一致．简单改变量名会漏掉 $\\dot\\theta_1$ 在第二角速度中的贡献，不能代表该坐标变换．"
