stem: '一般双摆的绝对角为 $\theta_1,\theta_2$，杆长 $l_1,l_2>0$，质点质量 $m_1,m_2>0$．已有


  $$

  T=\frac12A\dot\theta_1^2+B\dot\theta_1\dot\theta_2\cos(\theta_1-\theta_2)+\frac12C\dot\theta_2^2,

  $$


  其中 $A=(m_1+m_2)l_1^2$、$B=m_2l_1l_2$、$C=m_2l_2^2$；势能为 $V=-(m_1+m_2)gl_1\cos\theta_1-m_2gl_2\cos\theta_2$．


  改用独立坐标 $(\theta_1,\psi)$，$\psi=\theta_2-\theta_1$．写出新动能、势能及质量矩阵，验证同一物理状态的能量不变，并检查新质量矩阵是否正定．不必展开新的两条运动方程．'
