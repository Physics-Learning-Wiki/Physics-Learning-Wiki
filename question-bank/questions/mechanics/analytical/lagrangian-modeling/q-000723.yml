- 检查维持该数学约束所需的反力能否由实际装置提供．
solution: 绳只能受拉，圆周模型还要求张力 $F_{\rm ten}=m(l\dot\theta^2+g\cos\theta)\ge0$．若需要负张力，绳会松弛，应改换运动模型．轻杆可受拉也可受压，因此轻杆与轻绳不能在所有运动中互换．
