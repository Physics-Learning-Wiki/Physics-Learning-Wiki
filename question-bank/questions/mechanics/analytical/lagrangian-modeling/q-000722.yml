choice_order: shuffle
stem: 将双摆坐标从绝对角 $(\theta_1,\theta_2)$ 改成 $(\theta_1,\psi)$，其中 $\psi=\theta_2-\theta_1$．以下操作哪些正确？
choices:
- id: A
  content: 代入 $\theta_2=\theta_1+\psi$．
- id: B
  content: 同时代入 $\dot\theta_2=\dot\theta_1+\dot\psi$．
- id: C
  content: 保留原动能，只把变量名 $\theta_2$ 换成 $\psi$．
- id: D
  content: 用新拉格朗日量对新独立变量求导．
answer:
  choices:
  - A
  - B
  - D
feedback:
  choices:
    A: 位置关系必须按新坐标重新表达．
    B: 速度变换由坐标关系求导得到．
    C: 这会改变物理速度而没有反映到动能．
    D: 新偏导固定的其他变量与原来不同．
  correct: 已选出全部成立的陈述．请核对每条结论的条件．
  incorrect: 逐条检查陈述，不要用一条正确结论替代其余判断．
hints:
- 把位置关系对时间求导，再检查所有速度项．
solution: 坐标和速度需要成套变换．例如原动能中的 $\dot\theta_2^2$ 成为 $(\dot\theta_1+\dot\psi)^2$，从而改变多个惯性系数．坐标变换不改变同一状态的物理能量，却会改变函数表达式及偏导时固定的变量．
