type: single_choice
choice_order: shuffle
stem: 质量 $M$ 的小车沿固定水平轨道运动，悬挂质量 $m$、杆长 $l$ 的轻杆单摆．车位置为 $X$，摆角 $\theta$ 从竖直向下量起．动能中的交叉项是哪一个？
choices:
- id: A
  content: $Ml\dot X\dot\theta\cos\theta$．
- id: B
  content: $ml\dot X\dot\theta\cos\theta$．
- id: C
  content: $ml\dot X\dot\theta\sin\theta$．
- id: D
  content: 没有交叉项，因为两个坐标独立．
answer:
  choice: B
feedback:
  choices:
    A: 交叉项来自摆球的速度平方，质量应为摆球质量．
    B: 摆球绝对速度的两部分产生这一标量积．
    C: 车速水平，角速度带来的水平速度含 $\cos\theta$．
    D: 坐标独立不意味着动能没有耦合．
  correct: 判断正确．请结合解析检查所用条件．
  incorrect: 先按提示重建所需关系，再对照各项反馈．
hints:
- 先求摆球绝对速度，交叉项来自哪一物体就使用哪一质量．
solution: 摆球位置为 $(X+l\sin\theta,-l\cos\theta)$，所以 $v^2=\dot X^2+2l\dot X\dot\theta\cos\theta+l^2\dot\theta^2$．总动能是 $(M+m)\dot
  X^2/2+ml\dot X\dot\theta\cos\theta+ml^2\dot\theta^2/2$．
