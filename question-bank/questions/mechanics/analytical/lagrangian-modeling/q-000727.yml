stem: '质量 $M>0$ 的小车在固定水平光滑轨道上运动，由劲度系数 $k>0$ 的水平弹簧连接固定支座．车在弹簧自然长度位置时记 $X=0$．车上固定悬点挂有长度 $l>0$、摆球质量 $m>0$ 的轻杆单摆，运动限制在竖直平面，无阻力，重力加速度为
  $g>0$．


  取惯性系 $x$ 向右、$y$ 向上，车位置为 $X$，摆角 $\theta$ 从竖直向下逆时针量取．建立完整非线性方程：先给出位置映射，再写动能、势能和两条方程．以下垂摆球和 $X=0$ 为势能零点，并用能量或质量矩阵检查结果．'
