reference_answer: $(M+m)\ddot X+ml\cos\theta\,\ddot\theta-ml\sin\theta\,\dot\theta^2+kX=0$；$ml\cos\theta\,\ddot X+ml^2\ddot\theta+mgl\sin\theta=0$．
hints:
- 先分别计算车与摆球的动能，摆球的绝对速度含车速．
- 求角方程时检查两处混合速度项是否抵消；再用两行的不同单位检查．
feedback:
  correct: 已记录你的自评．请按本题标准确认推导和检查是否齐全．
  incorrect: 对照参考解答定位缺失步骤，再记录自评；本题不自动判断文字答案．
solution: '车的速度为 $(\dot X,0)$，摆球位置和速度是


  $$

  \boldsymbol r=(X+l\sin\theta,-l\cos\theta),\qquad

  \boldsymbol v=(\dot X+l\dot\theta\cos\theta,\ l\dot\theta\sin\theta).

  $$


  相加车与摆球动能，得到


  $$

  T=\frac12(M+m)\dot X^2+ml\dot X\dot\theta\cos\theta+\frac12ml^2\dot\theta^2,\qquad

  V=\frac12kX^2+mgl(1-\cos\theta).

  $$


  对 $X$ 求导：$\partial_{\dot X}L=(M+m)\dot X+ml\dot\theta\cos\theta$、$\partial_XL=-kX$，因此


  $$

  (M+m)\ddot X+ml\cos\theta\,\ddot\theta-ml\sin\theta\,\dot\theta^2+kX=0.

  $$


  对 $\theta$ 求导时，$\mathrm d(ml\dot X\cos\theta)/\mathrm dt$ 中的混合速度项与 $\partial_\theta T$ 抵消，留下


  $$

  ml\cos\theta\,\ddot X+ml^2\ddot\theta+mgl\sin\theta=0.

  $$


  第一行各项为力，第二行各项为力矩．惯性矩阵行列式为 $ml^2(M+m\sin^2\theta)>0$，符合正质量模型的正则性．把两行分别乘 $\dot X,\dot\theta$ 后相加，得到 $\mathrm d(T+V)/\mathrm
  dt=0$．车固定时，第二式恢复轻杆单摆方程；该检查不意味着原来车可以无说明地固定．'
