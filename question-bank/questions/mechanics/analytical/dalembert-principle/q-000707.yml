  incorrect: 需要区分题面中的模型条件与额外推断．
hints:
- 检查方向是否正交，而不只比较加速度大小．
solution: 固定半径时，径向加速度 $-R\dot\theta^2\boldsymbol e_r$ 与容许虚位移 $R\boldsymbol e_\theta\delta\theta$ 正交．投影为零与加速度大小无关．切向投影仍含 $R\ddot\theta$，不能把全部惯性项一起删除．
