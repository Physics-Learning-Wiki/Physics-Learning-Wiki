choice_order: shuffle
stem: 以下关于广义力的说法，哪些成立？
choices:
- id: A
  content: $Q_\alpha\delta q_\alpha$ 具有能量量纲．
- id: B
  content: 每个广义力只能来自一个质点上的力．
- id: C
  content: 角坐标的广义力可具有力矩单位．
- id: D
  content: 广义力总等于某个力矢量的模．
answer:
  choices:
  - A
  - C
feedback:
  choices:
    A: 它是主动力虚功的一项．
    B: 同一坐标变化可移动多个受力点，需要求和．
    C: 其单位为能量除以无量纲角度．
    D: 它含正方向、投影及几何尺度，可以为负．
  correct: 已选出全部成立的陈述．请核对每条结论的条件．
  incorrect: 逐条检查陈述，不要用一条正确结论替代其余判断．
hints:
- 从虚功定义检查单位、求和和符号．
solution: 定义 $Q_\alpha=\sum_i\boldsymbol F_i^{(a)}\cdot\partial\boldsymbol r_i/\partial q_\alpha$ 保留了全部受力点的投影．因 $Q_\alpha\delta
  q_\alpha$ 是虚功，广义力的量纲取决于坐标，不能一律当成牛顿．
