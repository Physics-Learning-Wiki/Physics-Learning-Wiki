stem: '质量 $m>0$ 的小环被固定光滑抛物线铁丝约束在 $y=x^2/(2a)$ 上，$a>0$ 为长度常量，套环不会脱离．取 $x$ 向右、$y$ 向上，小环受重力和水平力 $F(t)$．


  取 $x$ 为独立坐标，用达朗贝尔原理建立运动方程．需直接计算位置、加速度、容许虚位移与惯性项投影，暂不使用拉格朗日方程；说明反力为何不出现，并检查各项单位．'
