solution: '由位置映射得到


  $$

  \boldsymbol r=(x,x^2/(2a)),\quad

  \delta\boldsymbol r=(1,x/a)\delta x,\quad

  \ddot{\boldsymbol r}=(\ddot x,(\dot x^2+x\ddot x)/a).

  $$


  光滑固定双侧约束的反力垂直于容许切向，所以它的虚功为零．主动力 $(F,-mg)$ 的投影系数为 $F-mgx/a$；惯性项投影系数为


  $$

  m\ddot{\boldsymbol r}\cdot(1,x/a)

  =m(1+x^2/a^2)\ddot x+\frac{mx}{a^2}\dot x^2.

  $$


  对任意 $\delta x$ 使用达朗贝尔原理，得到


  $$

  m(1+x^2/a^2)\ddot x+\frac{mx}{a^2}\dot x^2+\frac{mgx}{a}=F(t).

  $$


  每项均是力．在 $x=0$ 的瞬时，竖直重力无水平切向投影，但轨道其他位置会有 $mgx/a$ 回复项；不能把整条轨道上的竖直运动删去．变惯性项反映位置映射的几何变化．'
