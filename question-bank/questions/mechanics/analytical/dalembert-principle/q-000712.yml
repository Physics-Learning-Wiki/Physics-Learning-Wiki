reference_answer: $m(1+x^2/a^2)\ddot x+(mx/a^2)\dot x^2+mgx/a=F(t)$．
hints:
- 先求 $\ddot y=(\dot x^2+x\ddot x)/a$，不要漏掉速度平方项．
- 把主动力和惯性项都投影到 $(1,x/a)$，它不是单位切向矢量．
