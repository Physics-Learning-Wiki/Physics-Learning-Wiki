choice_order: shuffle
stem: 固定悬点单摆长 $l=2.0\,\mathrm m$，摆角从竖直向下逆时针量取．小球受水平向右外力 $F=3.0\,\mathrm N$．在 $\theta=\pi/3$ 时，该外力对 $\theta$ 的广义力是多少？
choices:
- id: A
  content: $3.0\,\mathrm{N\,m}$．
- id: B
  content: $6.0\,\mathrm N$．
- id: C
  content: $3\sqrt3\,\mathrm{N\,m}$．
- id: D
  content: $-3.0\,\mathrm{N\,m}$．
answer:
  choice: A
feedback:
  choices:
    A: 应计算 $Fl\cos\theta=3.0\,\mathrm{N\,m}$．
    B: 角度的广义力应有力矩单位，并需保留投影因子．
    C: 水平力与角度增加方向的投影含 $\cos\theta$．
    D: 给定角度下水平向右力推动摆角增加，符号为正．
  correct: 判断正确．请结合解析检查所用条件．
  incorrect: 先按提示重建所需关系，再对照各项反馈．
hints:
- 先求位置对摆角的偏导，再与外力作标量积．
solution: $\partial\boldsymbol r/\partial\theta=l(\cos\theta,\sin\theta)$，所以 $Q_\theta=(F,0)\cdot\partial_\theta\boldsymbol
  r=Fl\cos\theta=3.0\,\mathrm{N\,m}$．角度无量纲，但其共轭广义力仍具有能量或力矩单位．
