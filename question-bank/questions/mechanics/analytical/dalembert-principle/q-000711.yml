reference_answer: $Q_1=(F_1+F_2)l_1\cos\theta_1$，$Q_2=F_2l_2\cos\theta_2$；二者都有力矩单位，合广义功率等于两个物理力的总功率．
hints:
- 依次固定另一个角，列出两个质点的位置偏导．
- 用物理力乘各自受力点的水平速度，检验广义功率．
feedback:
