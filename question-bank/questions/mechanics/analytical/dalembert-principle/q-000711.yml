solution: '只增加 $\theta_1$ 会使两个受力点都移动，且它们的位置偏导同为 $l_1(\cos\theta_1,\sin\theta_1)$．只增加 $\theta_2$ 不移动第一质点，第二质点的位置偏导为 $l_2(\cos\theta_2,\sin\theta_2)$．因此


  $$

  Q_1=(F_1+F_2)l_1\cos\theta_1,\qquad

  Q_2=F_2l_2\cos\theta_2.

  $$


  两个角均无量纲，两个广义力均有 $\mathrm{N\,m}$ 单位．从位置映射求速度：


  $$

  \dot x_1=l_1\dot\theta_1\cos\theta_1,\qquad

  \dot x_2=l_1\dot\theta_1\cos\theta_1+l_2\dot\theta_2\cos\theta_2.

  $$


  于是 $F_1\dot x_1+F_2\dot x_2=Q_1\dot\theta_1+Q_2\dot\theta_2$．该功率检验使用固定支承、不显含时间的位置映射；外力大小可以随时间变化．遗漏 $F_2$ 对 $Q_1$ 的贡献，就会破坏这个恒等式．'
