stem: '平面双摆采用绝对角 $\theta_1,\theta_2$，均从竖直向下逆时针量取，$x$ 向右、$y$ 向上．杆长 $l_1,l_2>0$，位置为


  $$

  \boldsymbol r_1=(l_1\sin\theta_1,-l_1\cos\theta_1),\qquad

  \boldsymbol r_2=\boldsymbol r_1+(l_2\sin\theta_2,-l_2\cos\theta_2).

  $$


  两个质点分别受到水平向右的已知外力 $F_1(t),F_2(t)$．只计算这两个外力的广义力，暂不计重力：求 $Q_1,Q_2$，检查量纲，并验证固定支承下 $\sum_\alpha Q_\alpha\dot\theta_\alpha=F_1\dot
  x_1+F_2\dot x_2$．'
