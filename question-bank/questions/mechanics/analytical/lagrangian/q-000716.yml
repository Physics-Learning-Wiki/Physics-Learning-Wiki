stem: 给定 $L=m\dot q^2/2-kq^2/2$，$q$ 是长度，$m=2.0\,\mathrm{kg}$、$k=8.0\,\mathrm{N/m}$，无额外广义力．由拉格朗日方程求固有角频率．
answer:
  value: 2.0
  tolerance:
    type: absolute
    value: 1.0e-06
  unit:
    required: true
    accepted:
    - rad/s
    canonical: rad/s
feedback:
  correct: 数值与容差要求相符．请继续核对解析中的单位和符号．
  incorrect: 按提示重算，并检查单位、正方向及是否遗漏几何系数．
hints:
- 先建立运动方程，再区分角频率与角频率平方．
solution: $\mathrm d(\partial_{\dot q}L)/\mathrm dt=m\ddot q$，$\partial_qL=-kq$，故 $m\ddot q+kq=0$．角频率 $\omega_0=\sqrt{k/m}=2.0\,\mathrm{rad/s}$，不是
  $k/m=4.0\,\mathrm{s^{-2}}$．
