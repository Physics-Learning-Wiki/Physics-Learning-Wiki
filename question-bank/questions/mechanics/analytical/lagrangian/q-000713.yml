type: single_choice
choice_order: shuffle
stem: 单自由度动能为 $T=a(q)\dot q^2/2$，$a(q)>0$．广义惯性项 $\mathrm d(\partial T/\partial\dot q)/\mathrm dt-\partial T/\partial q$ 是哪一个？
choices:
- id: A
  content: $a(q)\ddot q$．
- id: B
  content: $a(q)\ddot q+a'(q)\dot q^2$．
- id: C
  content: $a(q)\ddot q+\tfrac12a'(q)\dot q^2$．
- id: D
  content: $a(q)\ddot q-\tfrac12a'(q)\dot q^2$．
answer:
  choice: C
feedback:
  choices:
    A: 系数随位置变化会带来额外项．
    B: 全导数中的附加项还需减去 $\partial T/\partial q$．
    C: 全导数与坐标偏导相减后留下半个系数导数项．
    D: 乘积求导给出正的 $a'\dot q^2$，相减后仍为正的半项．
  correct: 判断正确．请结合解析检查所用条件．
  incorrect: 先按提示重建所需关系，再对照各项反馈．
hints:
- 分别完成两个导数，再相减；不要提前把 $a(q)$ 当作常量．
solution: 固定 $\dot q$ 求偏导，有 $\partial_qT=a'\dot q^2/2$；而 $\partial_{\dot q}T=a\dot q$ 沿轨迹求导为 $a\ddot q+a'\dot q^2$．两者相减即得
  $a\ddot q+a'\dot q^2/2$．
