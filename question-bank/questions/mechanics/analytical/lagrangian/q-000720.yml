solution: '记 $I(\theta)=I_0(1+\varepsilon\sin^2\theta)>0$，则


  $$

  \frac{\partial L}{\partial\dot\theta}=I\dot\theta,\qquad

  \frac{\mathrm d}{\mathrm dt}\frac{\partial L}{\partial\dot\theta}=I\ddot\theta+I''\dot\theta^2,\qquad

  \frac{\partial L}{\partial\theta}=\frac12I''\dot\theta^2-\kappa\sin\theta.

  $$


  相减后只剩半个 $I''\dot\theta^2$．因 $I''=2I_0\varepsilon\sin\theta\cos\theta$，运动方程是


  $$

  I_0(1+\varepsilon\sin^2\theta)\ddot\theta+

  I_0\varepsilon\sin\theta\cos\theta\,\dot\theta^2+\kappa\sin\theta=0.

  $$


  机械能 $E=I\dot\theta^2/2+\kappa(1-\cos\theta)$ 满足


  $$

  \dot E=\dot\theta\left(I\ddot\theta+\frac12I''\dot\theta^2+\kappa\sin\theta\right)=0.

  $$


  这是把已建立的方程用于检查，不需要在转向点除以 $\dot\theta$．当 $\varepsilon=0$ 时恢复常惯性系数模型；各项均具有力矩单位．遗漏 $I''$ 项会使原能量关系一般不再成立．'
