reference_answer: $I_0(1+\varepsilon\sin^2\theta)\ddot\theta+I_0\varepsilon\sin\theta\cos\theta\,\dot\theta^2+\kappa\sin\theta=0$．
hints:
- 先用一般 $I(\theta)$ 计算两个导数，再代入给定函数．
- 能量求导后应出现运动方程乘 $\dot\theta$，无需除以角速度．
