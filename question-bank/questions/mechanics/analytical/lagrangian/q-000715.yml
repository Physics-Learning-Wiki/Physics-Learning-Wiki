stem: 对光滑位置映射与状态函数 $T(q,\dot q,t)$，下列操作哪些正确？
choices:
- id: A
  content: 求 $\partial T/\partial q_\alpha$ 时固定 $\dot q$ 和 $t$．
- id: B
  content: 先代入某条解的 $\dot q(q)$，再求出的导数总等于 $\partial T/\partial q$．
- id: C
  content: 沿轨迹求 $\mathrm d(\partial\boldsymbol r_i/\partial q_\alpha)/\mathrm dt$ 时要计入显式时间项．
- id: D
  content: 恒等式 $\partial\boldsymbol v_i/\partial\dot q_\alpha=\partial\boldsymbol r_i/\partial q_\alpha$ 允许位置映射显含时间．
answer:
  choices:
  - A
  - C
  - D
feedback:
  choices:
    A: 这是状态变量表达下的偏导定义．
    B: 先限制到特定轨迹会引入额外的速度变化．
    C: 全导数需同时追踪坐标变化和显式时间变化．
    D: 位置的显式时间项不依赖广义速度，速度偏导不受其影响．
  correct: 已选出全部成立的陈述．请核对每条结论的条件．
  incorrect: 逐条检查陈述，不要用一条正确结论替代其余判断．
hints:
- 区分「改变一种可能状态」与「沿同一条轨迹前进」．
solution: $q,\dot q,t$ 在状态函数偏导中承担独立变量角色．真实运动才将它们沿时间联系起来．速度的链式表达同时给出题列运动学恒等式，不能据此把任意全导数与偏导无条件交换．
