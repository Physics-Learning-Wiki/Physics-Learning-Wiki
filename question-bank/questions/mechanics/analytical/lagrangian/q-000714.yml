hints:
- 普通拉格朗日方程的推导是否要求位置映射不显含时间？
solution: 一般位置映射允许 $\boldsymbol r_i=\boldsymbol r_i(q,t)$，速度中保留 $\partial_t\boldsymbol r_i$．满足独立坐标、恒定质点质量和理想完整约束等条件时，推导依然成立；只是动能可能含广义速度的一次项和显式时间项，不能省略它们．
