  mode: self_assessed
  rubric:
  - id: incomplete
    label: 尚未掌握：把 $\partial_rT$ 当成零，或把 $mr^2$ 未经说明地视为常量．
    points: 0
  - id: partial
    label: 部分掌握：两条方程基本正确，但遗漏乘积求导解释、单位或坐标条件．
    points: 0.5
  - id: complete
    label: 基本掌握：给出全部关键导数与两条方程，解释不同量纲并检查固定半径极限．
    points: 1
reference_answer: $m\ddot r-mr\dot\theta^2+V'(r)=0$，$m(r^2\ddot\theta+2r\dot r\dot\theta)=\tau(t)$．
hints:
- 求 $\partial_rT$ 时仍需保留 $r^2\dot\theta^2$ 的位置依赖．
- 对 $mr^2\dot\theta$ 作乘积求导，并分别用对应坐标的单位检查两行．
feedback:
  correct: 已记录你的自评．请按本题标准确认推导和检查是否齐全．
  incorrect: 对照参考解答定位缺失步骤，再记录自评；本题不自动判断文字答案．
solution: '径向偏导为 $\partial_{\dot r}L=m\dot r$、$\partial_rL=mr\dot\theta^2-V''(r)$，故


  $$

  m\ddot r-mr\dot\theta^2+V''(r)=0.

  $$


  角向偏导为 $\partial_{\dot\theta}L=mr^2\dot\theta$、$\partial_\theta L=0$．对前者求全时间导数必须同时微分 $r^2$ 与 $\dot\theta$：


  $$

  m(r^2\ddot\theta+2r\dot r\dot\theta)=\tau(t).

  $$


  径向方程各项为力，角向方程各项为力矩，因为对应坐标分别是长度与角度．当 $r$ 恰为常量时，角向惯性项退为 $mr^2\ddot\theta$；但不能在原问题中未说明就预先令 $\dot r=0$．$r>0$ 排除了极坐标原点的坐标奇点．'
