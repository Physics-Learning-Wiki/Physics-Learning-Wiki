stem: '质量 $m>0$ 的质点在平面内运动，用极坐标 $r>0,\theta$ 表示．动能为 $T=m(\dot r^2+r^2\dot\theta^2)/2$，位置势能为光滑函数 $V(r)$．另有切向驱动力，其对角度的广义力为已知力矩
  $\tau(t)$，对 $r$ 的广义力为零．


  分别建立两条拉格朗日方程，展示关键偏导和全导数，并检查径向方程与角向方程的量纲为何不同．不要求求解轨迹．'
