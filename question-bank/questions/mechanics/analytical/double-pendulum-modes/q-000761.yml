stem: 等长等质量双摆在下垂平衡附近小振动，两杆长均为 $l=2.0\,\mathrm m$．本题教学模型取 $g=10.0\,\mathrm{m/s^2}$，低频满足 $\omega_-^2=(2-\sqrt2)g/l$．求低频固有角频率．
