- 先算角频率平方，再取正平方根；不要除以 $2\pi$．
solution: 代入得到 $\omega_-^2=5(2-\sqrt2)\,\mathrm{s^{-2}}$，故 $\omega_-=\sqrt{5(2-\sqrt2)}\simeq1.7114\,\mathrm{rad/s}$．若求普通频率，还需除以 $2\pi$；本题要求的是角频率．给定 $g$ 是教学设定，不是精密测量值．
