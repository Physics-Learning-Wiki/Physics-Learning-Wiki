stem: 等长等质量双摆的初始两角均为零，初角速度为 $(v,0)$，$v\ne0$ 且足够小．对振型幅值 $u_\mp=(\theta_1\pm\theta_2/\sqrt2)/2$，哪组时间函数正确？
choices:
- id: A
  content: $u_\mp(t)=\frac{v}{2\omega_\mp}\sin\omega_\mp t$．
- id: B
  content: $u_\mp(t)=\frac v2\cos\omega_\mp t$．
- id: C
  content: $u_-(t)=0$、$u_+(t)=v\sin\omega_+t/\omega_+$．
- id: D
  content: $u_\mp(t)=\frac v2\sin\omega_\mp t$．
answer:
  choice: A
feedback:
  choices:
    A: 两幅值初导数均为 $v/2$，两模态均被激发．
    B: 余弦项会使初角度非零，而且量纲不符．
    C: 给定速度并不沿高频振型．
    D: 初导数会多出角频率因子，且幅值单位错误．
  correct: 判断正确．请结合解析检查所用条件．
  incorrect: 先按提示重建所需关系，再对照各项反馈．
hints:
- 正弦项的系数应是初速度除以角频率．
solution: 初位移为零，所以两模态都没有余弦项．由逆变换得 $\dot u_-(0)=\dot u_+(0)=v/2$，因此必须除以各自 $\omega_\mp$ 才恢复该初速度．代回 $\theta_1=u_-+u_+$、$\theta_2=\sqrt2(u_--u_+)$，可检验给定的两角速度．
