hints:
- 先把 $u$ 换成归一化的 $Q$，再分别计算两模态能量．
solution: |-
  两未归一化幅值初态均为 $u_-(0)=u_+(0)=d/2$．质量归一化坐标为 $Q_\mp=n_\mp u_\mp$，所以

  $$
  E_\mp=\frac18 n_\mp^2\omega_\mp^2d^2.
  $$

  两个乘积均为 $n_\mp^2\omega_\mp^2=4mgl$，因此 $E_-=E_+=mgl d^2/2$，比值为一．两者之和 $mgl d^2$ 等于原二次势能．不能仅凭相同的 $u$ 幅值就断言能量相同，仍需检查各自惯性与频率因子．
