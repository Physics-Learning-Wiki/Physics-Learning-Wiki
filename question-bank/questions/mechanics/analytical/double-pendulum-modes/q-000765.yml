stem: 等长等质量双摆在小振动范围取初态 $\theta_1(0)=d$、$\theta_2(0)=0$，两初角速度为零，$d\ne0$．令低频与高频模态能量分别为 $E_-,E_+$，求无量纲比值 $E_-/E_+$．可用 $n_\mp^2=ml^2(4\pm2\sqrt2)$ 和 $\omega_\mp^2=(2\mp\sqrt2)g/l$．
