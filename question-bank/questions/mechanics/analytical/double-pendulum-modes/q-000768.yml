solution: |-
  小角度几何给出 $x_1=l\theta_1$、$x_2=l(\theta_1+\theta_2)$，故 $\theta_2=(x_2-x_1)/l$，角速度也有相同的线性关系．高频纯模要求两组初态均满足 $\theta_2=-\sqrt2\theta_1$，因此

  $$
  B=(1-\sqrt2)A,\qquad W=(1-\sqrt2)U.
  $$

  高频角频率为 $\omega_+=\sqrt{(2+\sqrt2)g/l}$，于是

  $$
  x_1(t)=A\cos\omega_+t+\frac{U}{\omega_+}\sin\omega_+t,\qquad
  x_2(t)=(1-\sqrt2)x_1(t).
  $$

  未归一化高频幅值等于 $\theta_1=x_1/l$，其质量范数为 $n_+=\sqrt{ml^2(4-2\sqrt2)}$．所以

  $$
  Q_+(t)=\sqrt{m(4-2\sqrt2)}\,x_1(t),\qquad Q_-(t)=0.
  $$

  纯模二次能量为

  $$
  E_+=\frac12m(4-2\sqrt2)\bigl[U^2+\omega_+^2A^2\bigr]
  =m(2-\sqrt2)U^2+\frac{2mg}{l}A^2.
  $$

  也可将 $\theta_1=A/l$、$\theta_2=-\sqrt2 A/l$ 及相应角速度代入原二次能量验证．角振幅比不同于质点水平位移比；忽略第二质点随第一杆的平移，会得到错误的 $B,W$．所有关系均在线性小角度精度内成立．
