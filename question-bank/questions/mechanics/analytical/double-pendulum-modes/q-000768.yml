reference_answer: $B=(1-\sqrt2)A$、$W=(1-\sqrt2)U$；$x_1=A\cos\omega_+t+(U/\omega_+)\sin\omega_+t$，$x_2=(1-\sqrt2)x_1$；$E_+=m(2-\sqrt2)U^2+2mgA^2/l$．
hints:
- 先用 $x_2=l(\theta_1+\theta_2)$ 转换成两角，再对位移与速度各施加一次纯模条件．
- 未归一化幅值是 $\theta_1$；乘质量范数后才可用单位惯性系数的能量式．
