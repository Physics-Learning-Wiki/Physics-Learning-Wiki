stem: |-
  等长等质量双摆处于小振动范围，两质点质量均为 $m>0$、杆长均为 $l>0$．在最低点附近，以两个质点的水平位移 $x_1,x_2$ 描述准备的初态：

  $$
  x_1(0)=A,\quad x_2(0)=B,\quad \dot x_1(0)=U,\quad \dot x_2(0)=W.
  $$

  各初始量均足够小．已知高频角振型为 $(1,-\sqrt2)^{\mathsf T}$．求只激发高频模所需的 $B,W$，给出随后的两质点水平运动，并计算质量归一化高频坐标及该纯模的二次能量．解释为什么不能直接令 $B=-\sqrt2 A$．
