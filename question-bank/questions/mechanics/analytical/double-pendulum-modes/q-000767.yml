solution: |-
  线性化后的矩阵为

  $$
  M=ml^2\begin{pmatrix}1+\mu&\mu\\\mu&\mu\end{pmatrix},\qquad
  K=mgl\begin{pmatrix}1+\mu&0\\0&\mu\end{pmatrix}.
  $$

  两矩阵在 $\mu>0$ 时正定．令 $\lambda=\omega^2l/g$，约去正的公因子后，频率方程是

  $$
  (1+\mu)(1-\lambda)^2-\mu\lambda^2
  =\lambda^2-2(1+\mu)\lambda+(1+\mu)=0.
  $$

  因此

  $$
  \lambda_{L,H}=1+\mu\mp\sqrt{\mu(1+\mu)},\qquad
  \omega_{L,H}^2=\frac gl\lambda_{L,H}.
  $$

  两个根均正．第二行给出 $-\lambda a_1+(1-\lambda)a_2=0$，代入两根可得

  $$
  \frac{a_{2L}}{a_{1L}}=\sqrt{\frac{1+\mu}{\mu}},\qquad
  \frac{a_{2H}}{a_{1H}}=-\sqrt{\frac{1+\mu}{\mu}}.
  $$

  当 $\mu=1$ 时恢复 $(2\mp\sqrt2)g/l$ 与 $\pm\sqrt2$．共同乘大两质量不改变频率，但改变质量比会改变频率．

  当 $\mu\to0^+$ 时两个 $\lambda$ 都趋近一，以上选取的振幅比发散；在 $\mu=0$ 处 $\det M=(ml^2)^2\mu=0$，原模型退化．数值极限不能代替端点模型的重新识别；若物理上移除下质点及下杆，只剩一个单摆自由度．
