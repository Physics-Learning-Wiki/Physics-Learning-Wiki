reference_answer: $\omega_{L,H}^2=(g/l)[1+\mu\mp\sqrt{\mu(1+\mu)}]$，角振幅比为 $a_2/a_1=\pm\sqrt{(1+\mu)/\mu}$，低频取正，高频取负．
hints:
- 先保留正的质量比，再求无量纲频率；不要在推导中提前令 $\mu=0$．
- 振幅比可从第二行直接求，再用等质量情形与质量矩阵行列式检查．
