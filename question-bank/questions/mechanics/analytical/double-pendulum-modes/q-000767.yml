stem: |-
  两杆等长的平面双摆，上质点质量 $m_1=m>0$，下质点质量 $m_2=\mu m$，$\mu>0$，杆长均为 $l>0$．两角仍为相对竖直向下的绝对角，支承固定、无阻力，在下垂位置附近小振动．

  从一般双摆的二次能量得到质量与刚度矩阵，求两固有角频率和各自的角振幅比．核对 $\mu=1$ 的结果，并解释 $\mu\to0^+$ 时频率数值的极限为何不代表零质量端点仍有两个正常动力学自由度．
