stem: |-
  等长等质量轻杆双摆在下垂平衡附近运动，两质点质量均为 $m>0$，两杆长均为 $l>0$．两角都是从竖直向下量取的绝对角．已知振型 $\boldsymbol a_-=(1,\sqrt2)^{\mathsf T}$、$\boldsymbol a_+=(1,-\sqrt2)^{\mathsf T}$，以及 $\omega_\mp^2=(2\mp\sqrt2)g/l$．

  给定 $\theta_1(0)=a$、$\theta_2(0)=0$、$\dot\theta_1(0)=0$、$\dot\theta_2(0)=v$，其中 $a$ 与 $v/\omega_-$ 都满足小振动尺度．求两角完整时间解，并用初态、线性方程与二次能量检查．
