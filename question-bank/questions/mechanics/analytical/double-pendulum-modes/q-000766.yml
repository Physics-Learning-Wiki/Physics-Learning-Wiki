reference_answer: $u_-=\tfrac a2\cos\omega_-t+\tfrac{v}{2\sqrt2\omega_-}\sin\omega_-t$，$u_+=\tfrac a2\cos\omega_+t-\tfrac{v}{2\sqrt2\omega_+}\sin\omega_+t$；$\theta_1=u_-+u_+$、$\theta_2=\sqrt2(u_--u_+)$．
hints:
- 分别变换初角度和初角速度，注意两个速度投影符号相反．
- 能量检查需使用未归一化幅值的质量范数 $n_\mp^2$．
