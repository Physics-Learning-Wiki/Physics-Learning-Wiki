solution: |-
  逆变换给出 $u_\mp=(\theta_1\pm\theta_2/\sqrt2)/2$，因此

  $$
  u_-(0)=u_+(0)=a/2,\qquad
  \dot u_-(0)=v/(2\sqrt2),\quad
  \dot u_+(0)=-v/(2\sqrt2).
  $$

  分别求两个独立振子，得到

  $$
  u_-(t)=\frac a2\cos\omega_-t+\frac{v}{2\sqrt2\omega_-}\sin\omega_-t,\qquad
  u_+(t)=\frac a2\cos\omega_+t-\frac{v}{2\sqrt2\omega_+}\sin\omega_+t.
  $$

  再由 $\theta_1=u_-+u_+$、$\theta_2=\sqrt2(u_--u_+)$ 还原两角．在 $t=0$ 直接得到 $(a,0)$，求导得到 $(0,v)$，两组初态均被恢复．每个振型满足 $K\boldsymbol a_\mp=\omega_\mp^2M\boldsymbol a_\mp$，所以该叠加解满足两条线性双摆方程．

  取 $n_\mp^2=ml^2(4\pm2\sqrt2)$，两模态能量之和在初始时刻为

  $$
  E^{(2)}=\frac12\sum_{\sigma=-,+}
  n_\sigma^2\left[\dot u_\sigma(0)^2+\omega_\sigma^2u_\sigma(0)^2\right]
  =\frac12ml^2v^2+mgl a^2.
  $$

  这与原二次能量 $T^{(2)}+V^{(2)}$ 一致，且各模态能量分别守恒．这是线性小振动的能量检查，不是把该近似解当成完整非线性双摆的精确解．
