stem: 无驱动振子满足 $m\ddot x+c\dot x+kx=0$，$m=2.0\,\mathrm{kg}$、$c=4.0\,\mathrm{kg/s}$、$k=10.0\,\mathrm{N/m}$．求欠阻尼运动的角频率 $\omega_d$．
answer:
  value: 2.0
  tolerance:
    type: absolute
    value: 1.0e-06
  unit:
    required: true
    accepted:
    - rad/s
    canonical: rad/s
feedback:
  correct: 数值与容差要求相符．请继续核对解析中的单位和符号．
  incorrect: 按提示重算，并检查单位、正方向及是否遗漏几何系数．
hints:
- 先计算衰减常量 $c/(2m)$，再判断阻尼类别．
solution: $\gamma=c/(2m)=1.0\,\mathrm{s^{-1}}$，$\omega_0^2=k/m=5.0\,\mathrm{s^{-2}}$，所以 $\gamma<\omega_0$ 且 $\omega_d=\sqrt{\omega_0^2-\gamma^2}=2.0\,\mathrm{rad/s}$．它与固有角频率
  $\sqrt5\,\mathrm{rad/s}$ 不同．
