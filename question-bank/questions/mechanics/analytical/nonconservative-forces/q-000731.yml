type: numeric
choice_order: fixed
stem: 滑块相对静止介质的阻力为 $-c\dot x$，$c=4.0\,\mathrm{kg/s}$，某瞬时 $\dot x=3.0\,\mathrm{m/s}$．这一瞬时瑞利耗散函数 $\mathcal R$ 的值是多少？
answer:
  value: 18.0
  tolerance:
    type: absolute
    value: 1.0e-06
  unit:
    required: true
    accepted:
    - W
    canonical: W
feedback:
  correct: 数值与容差要求相符．请继续核对解析中的单位和符号．
  incorrect: 按提示重算，并检查单位、正方向及是否遗漏几何系数．
hints:
- 题目问的是 $\mathcal R$，并非 $2\mathcal R$ 或累计能量损失．
solution: $\mathcal R=c\dot x^2/2=4.0\times9.0/2=18.0\,\mathrm W$．阻力做功功率为 $-36.0\,\mathrm W$，损失功率的正值为 $36.0\,\mathrm W$．耗散函数本身具有功率单位，不是已损失的能量．
