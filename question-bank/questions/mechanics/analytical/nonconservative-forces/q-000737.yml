stem: '固定悬点轻杆单摆的摆球质量 $m>0$、杆长 $l>0$，$\theta$ 从竖直向下逆时针量取．摆球受到水平向右的已知力 $F(t)$，以及相对于静止空气的阻力 $\boldsymbol F_D=-c\boldsymbol v$，$c\ge0$．取下垂位置的重力势能为零．


  构造保守部分的 $L$、耗散函数和驱动广义力，建立完整角度方程，并求「动能＋重力势能」的变化率．再说明若改用外势能 $V_{\rm ext}=-F(t)l\sin\theta$，怎样避免重复计入驱动．'
