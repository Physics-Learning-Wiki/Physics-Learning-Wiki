reference_answer: $ml^2\ddot\theta+cl^2\dot\theta+mgl\sin\theta=F(t)l\cos\theta$；$\dot E=F(t)l\cos\theta\,\dot\theta-cl^2\dot\theta^2$．
hints:
- 水平力先与 $\partial_\theta\boldsymbol r$ 作标量积，不可直接把 $F$ 放进力矩方程．
- 验证驱动功率时使用摆球水平速度，并明确能量是否包含外势能．
feedback:
  correct: 已记录你的自评．请按本题标准确认推导和检查是否齐全．
  incorrect: 对照参考解答定位缺失步骤，再记录自评；本题不自动判断文字答案．
solution: '位置为 $(l\sin\theta,-l\cos\theta)$，因此


  $$

  L=\frac12ml^2\dot\theta^2-mgl(1-\cos\theta),\quad

  \mathcal R=\frac12cl^2\dot\theta^2,\quad

  Q_\theta^{\rm drive}=F(t)l\cos\theta.

  $$


  含耗散方程给出


  $$

  ml^2\ddot\theta+cl^2\dot\theta+mgl\sin\theta=F(t)l\cos\theta.

  $$


  机械能 $E=ml^2\dot\theta^2/2+mgl(1-\cos\theta)$ 的变化率为


  $$

  \dot E=\dot\theta(ml^2\ddot\theta+mgl\sin\theta)

  =F(t)l\cos\theta\,\dot\theta-cl^2\dot\theta^2.

  $$


  第一项正是水平力乘摆球水平速度，第二项为阻力损失功率．驱动功率可正可负．


  若将 $V_{\rm ext}$ 并入势能，则 $L$ 需增加 $F(t)l\sin\theta$，右侧不再保留同一个驱动广义力，得到相同方程．此时若定义 $E_{\rm tot}=E+V_{\rm ext}$，则 $\dot E_{\rm
  tot}=-cl^2\dot\theta^2-\dot F(t)l\sin\theta$；它和题目先前定义的 $E$ 是不同的能量记账对象．'
