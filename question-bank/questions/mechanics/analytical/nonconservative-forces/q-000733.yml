stem: 固定轻杆单摆受相对静止空气的各向同性线性阻力 $\boldsymbol F_D=-c\boldsymbol v$ 时，$\mathcal R=cl^2\dot\theta^2/2$，不能把角速度直接代入 $c\dot\theta^2/2$
  取代物理速度平方．
answer:
  value: true
feedback:
  correct: 判断正确．关键条件与理由见解析．
  incorrect: 需要区分题面中的模型条件与额外推断．
hints:
- 角速度的单位与小球线速度的单位不同．
solution: 固定杆长给出 $v^2=l^2\dot\theta^2$．系数 $c$ 是物理线速度的阻力系数，必须保留几何尺度 $l^2$．相应广义阻力为 $-cl^2\dot\theta$，具有力矩单位．若另定义角阻尼系数，也需明确其单位与
  $c$ 的换算．
