solution: '由各弹簧伸长和各阻尼器的相对速度写出


  $$

  T=\frac12m_1\dot x_1^2+\frac12m_2\dot x_2^2,\quad

  V=\frac12k_1x_1^2+\frac12k_c(x_2-x_1)^2+\frac12k_2x_2^2,

  $$


  $$

  \mathcal R=\frac12c_1\dot x_1^2+\frac12c_2\dot x_2^2+

  \frac12c_{12}(\dot x_2-\dot x_1)^2.

  $$


  对速度求偏导，连接阻尼器对第一、第二滑块的力分别为 $c_{12}(\dot x_2-\dot x_1)$、$-c_{12}(\dot x_2-\dot x_1)$．含耗散的方程是


  $$

  m_1\ddot x_1+(c_1+c_{12})\dot x_1-c_{12}\dot x_2+(k_1+k_c)x_1-k_cx_2=0,

  $$


  $$

  m_2\ddot x_2+(c_2+c_{12})\dot x_2-c_{12}\dot x_1+(k_2+k_c)x_2-k_cx_1=F(t).

  $$


  将两行分别乘相应速度并相加，得到


  $$

  \dot E=F\dot x_2-c_1\dot x_1^2-c_2\dot x_2^2-c_{12}(\dot x_2-\dot x_1)^2,\qquad E=T+V.

  $$


  当 $F=0$ 时右侧不大于零；若某些阻尼系数或对应相对速度为零，可以出现瞬时零损失，不能无条件声称每个非静止状态都严格衰减．连接阻尼器不阻碍两滑块的共同匀速运动，但对地阻尼器可能仍耗散．'
