reference_answer: $\mathcal R=[c_1\dot x_1^2+c_2\dot x_2^2+c_{12}(\dot x_2-\dot x_1)^2]/2$；$\dot E=F\dot x_2-c_1\dot x_1^2-c_2\dot
  x_2^2-c_{12}(\dot x_2-\dot x_1)^2$．
hints:
- 连接元件使用相对位移或相对速度，对地元件使用各滑块相对固定支座的量．
- 用两条方程乘速度求和，检查交叉阻尼项是否组成一个负平方．
