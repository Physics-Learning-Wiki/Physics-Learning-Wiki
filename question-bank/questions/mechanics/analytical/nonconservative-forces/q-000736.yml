stem: '两个质量 $m_1,m_2>0$ 的滑块在固定光滑水平导轨上运动，以各自静止平衡位置的位移 $x_1,x_2$ 为坐标．左右对地弹簧劲度为 $k_1,k_2>0$，两滑块之间的弹簧劲度为 $k_c>0$．另有对地黏滞阻尼器 $c_1,c_2\ge0$
  和连接两滑块的阻尼器 $c_{12}\ge0$；连接阻尼器只阻碍相对速度．已知外力 $F(t)$ 仅作用于第二滑块，正向与 $x_2$ 一致．


  构造 $T,V,\mathcal R$，建立两条运动方程，并求机械能变化率．说明连接阻尼器对两滑块的广义力如何配对，以及无驱动时的能量结论．'
