reference_answer: U=(M−m)u/(M+m)，v=2Mu/(M+m)。η=4r/(1+r)²≤1，r=m/M，等号在 r=1。该结论只适用于无外冲量、无持续驱动的完全弹性两体模型；真实水凝胶的基底、形变和损耗使其最优载荷不能由本式直接确定。
