reference_answer: 能量等价给 E_X=14κX/[hY(X′)²]。在 θ=0，X=2a、Y=2b、X′=2b，故 E_X(0)=7κa/(2hb³)，量纲为 Pa。X′趋零造成一阶运动学映射奇异和模型模量发散，不证明真实材料无限刚。
