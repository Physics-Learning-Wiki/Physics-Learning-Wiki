stem: '动力学超材料中的刚性单元可以同时平移和转动；能量聚集的计算因此需要完整的单元动能。（[研究来源](https://doi.org/10.1038/s41563-024-02008-6)）


  一个均匀薄矩形单元质量 $m=2.00\,\mathrm{g}$，两条完整边长分别为 $a=20.0\,\mathrm{mm}$、$b=10.0\,\mathrm{mm}$。该瞬间质心速度大小 $v=0.200\,\mathrm{m/s}$，绕过质心、垂直于单元平面的轴转动，角速度
  $\omega=100\,\mathrm{rad/s}$。可用 $I=m(a^2+b^2)/12$。忽略出平面运动。


  求这一单元的总瞬时动能，以 $\mathrm{J}$ 为单位，保留三位有效数字。'
hints:
- 边长应先换成米，因为转动惯量含边长平方。
- 速度 v 是质心速度，转动能需用相对于质心的惯量另加。
feedback:
  correct: 对平面刚体同时计入质心平动和绕质心转动，并正确转换毫米与克。，并保留了题设的适用条件。
  incorrect: 边长应先换成米，因为转动惯量含边长平方。
solution: '先换为 SI 单位：$m=0.00200\,\mathrm{kg}$、$a=0.0200\,\mathrm{m}$、$b=0.0100\,\mathrm{m}$。于是 $I=0.00200(0.0200^2+0.0100^2)/12=8.3333\times10^{-8}\,\mathrm{kg\,m^2}$。质心平动动能为
  $T_{\rm tr}=mv^2/2=4.00\times10^{-5}\,\mathrm{J}$，转动动能为 $T_{\rm rot}=I\omega^2/2=4.1667\times10^{-4}\,\mathrm{J}$。两项相加得
  $T=4.5667\times10^{-4}\,\mathrm{J}$，三位有效数字为 $4.57\times10^{-4}\,\mathrm{J}$。


  **检查与物理含义：** 两项均为正且具有焦耳量纲。转动动能约为平动动能的 $10.4$ 倍，说明在此教学状态中只跟踪质心速度会漏掉大部分动能。令 $\omega=0$ 时公式回到纯平动结果。容差覆盖三位有效数字舍入。


  **适用范围：** 数值并非论文测量；实际单元的惯量应由其真实形状和质量分布确定。


  **来源定位：** Automated discovery of reprogrammable nonlinear dynamic metamaterials，Author manuscript Mechanical model, total
  kinetic energy of translational and rotational block motion; publisher Supplement §2；[论文 DOI](https://doi.org/10.1038/s41563-024-02008-6)。'
