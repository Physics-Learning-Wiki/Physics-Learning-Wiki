reference_answer: 基频平衡给出 Ω²=K/I+3BA²/(4I)，故 Ω≈√(K/I)[1+3BA²/(8K)]。B>0 硬化、B<0 软化；β=mgℓ/6 消除三阶恢复力矩的领先振幅频移。忽略高阶项和有限振幅效应，因此不能推出全振幅等时。
