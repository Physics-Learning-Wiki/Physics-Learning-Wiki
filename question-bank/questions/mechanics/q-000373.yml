choices:
- id: A
  content: 一般都可写成 $x=R\theta\cos\psi+C_x$、$y=R\theta\sin\psi+C_y$。
- id: B
  content: 只要约束含速度，就一定非完整，固定朝向也无法积分。
- id: C
  content: 无滑动意味着轮心永远静止，所以 $\dot x=\dot y=0$。
- id: D
  content: 一般可转向时非完整；若再固定 $\psi=\psi_0$，则可积分成完整约束。
answer:
  choice: D
