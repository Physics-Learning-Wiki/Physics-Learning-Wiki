stem: |-
  跳跃研究把未有效转入质心上升的能量与脚端及转动部件的惯性联系起来。（[研究来源](https://doi.org/10.1016/j.mechmachtheory.2024.105688)）

  取竖直向上为正，考虑离地瞬间的两质量模型：机身质量为 $m>0$，竖直向上速度为 $u>0$；脚端质量为 $\mu>0$，该瞬间速度为零。连接弹簧无质量；离地没有额外碰撞冲量。离地后只有均匀重力 $g$，无阻力，也没有质量被抛出。

  只讨论这个瞬间的总动能 $K=mu^2/2$。弹簧当时还可能有储能，但题目不要求计算初始充能到离地的全过程效率。

  ![离地瞬间，机身质量 m 向上速度 u，脚端质量 μ 瞬时速度为零；无质量弹簧连接二者，地面已不再施力。](asset:m005)

  *原创教学示意图，非按比例绘制。*

  求离地总动能中属于整体质心平动的比例 $\eta_{\mathrm{CM}}$，并说明它怎样决定此后的质心上升高度。请依次写出质心速度、相对质心的动能及高度，最后讨论 $\mu\to0$ 的极限。
hints:
- 先用两部分动量之和除以总质量得到质心速度。
- 在质心系中分别写两个速度；检查内部动能与质心动能之和。
feedback:
  correct: 分解质心平动能与内部相对动能，解释脚端质量为何影响跳高，并保留了题设的适用条件。
  incorrect: 先用两部分动量之和除以总质量得到质心速度。
solution: |-
  总动量为 $P=mu$，总质量为 $M=m+\mu$，所以

  $$
  V=\frac{P}{M}=\frac{m}{m+\mu}u.
  $$

  整体平动动能是

  $$
  K_{\mathrm{CM}}=\frac12(m+\mu)V^2=\frac{m^2u^2}{2(m+\mu)},\qquad
  \eta_{\mathrm{CM}}=\frac{K_{\mathrm{CM}}}{K}=\frac{m}{m+\mu}.
  $$

  在质心系中，机身速度为 $u-V=\mu u/(m+\mu)$，脚端速度为 $-V=-mu/(m+\mu)$。因此

  $$
  K_{\mathrm{rel}}=\frac12m(u-V)^2+\frac12\mu V^2
  =\frac{m\mu}{2(m+\mu)}u^2.
  $$

  直接相加可得 $K_{\mathrm{CM}}+K_{\mathrm{rel}}=mu^2/2$。离地后内部弹簧只在内部动能和弹性能之间交换能量；质心满足 $\ddot Y=-g$，故

  $$
  \Delta H=\frac{V^2}{2g}=\frac{m^2u^2}{2g(m+\mu)^2}.
  $$

  在题设固定 $m,u$ 的比较中，增大脚端质量会降低质心速度、能量比例和高度；$\mu\to0$ 时内部相对动能趋零，$\eta_{\mathrm{CM}}\to1$，高度趋于 $u^2/(2g)$。

  **检查与物理含义：** 独立计算的 $K_{\mathrm{rel}}$ 与差额 $K-K_{\mathrm{CM}}$ 一致；两能量均非负且 $0<\eta_{\mathrm{CM}}<1$；无脚端质量极限恢复单质点结果。

  **适用范围：** 这里的比例以离地总动能作分母，不能等同于论文以初始弹性储能作分母的弹性—质心动能效率；真实设计改变脚端质量也可能改变 u。

  **来源定位：** Characterising the take-off dynamics and energy efficiency in spring-driven jumping robots，§2.1, Fig. 2 and Eqs. (1)–(5)；[论文 DOI](https://doi.org/10.1016/j.mechmachtheory.2024.105688)。
