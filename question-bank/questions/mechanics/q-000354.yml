reference_answer: $V=mu/(m+\mu)$；$\eta_{\mathrm{CM}}=m/(m+\mu)$；$K_{\mathrm{rel}}=m\mu u^2/[2(m+\mu)]$；$\Delta H=m^2u^2/[2g(m+\mu)^2]$。应说明固定
  m,u 比较，内部弹性力不改质心弹道，且此比例不是初始弹性能转化效率。
