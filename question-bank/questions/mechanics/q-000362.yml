choices:
- id: A
  content: 动能变为 $m(\dot b^2+\dot d^2)/2$。
- id: B
  content: 阻尼造成的机械能变化率为 $-\gamma\dot b^2$。
- id: C
  content: 当 $k_X=k_Y$ 时，势能中的 $bd$ 交叉项为零。
- id: D
  content: 由于坐标变换是正交的，阻尼一定同时给出 $-\gamma\dot d$ 的暗模阻尼力。
