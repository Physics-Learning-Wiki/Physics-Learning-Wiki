answer: {choice: A}
feedback:
  choices: {A: 位移等于末位置减初位置。, B: 这是位移大小，不含方向。, C: 不能把两个坐标直接相加。}
  correct: 正确，负号表示位移向西。
  incorrect: 使用 $\Delta x=x_2-x_1$。
hints: [先写末位置减初位置。]
solution: $\Delta x=-2-3=-5\,\mathrm m$。
