stem: |-
  混合风滚机器人需要主动辅助通过局部障碍。以下刚性球的准静态台阶模型，用于理解仅增加水平驱动力何时可以抬离地面。（[研究来源](https://doi.org/10.1038/s41467-025-66513-1)）

  质量 $M=0.300\,\mathrm{kg}$、半径 $R=0.100\,\mathrm{m}$ 的刚性球停在高度 $h=0.0200\,\mathrm{m}$ 的竖直台阶前。通过球心施加向右的水平力 F；$g=10.0\,\mathrm{m/s^2}$。在即将绕台阶棱角 C 转动、脱离下方水平地面的瞬间，下方地面支持力为零，球与 C 接触，接触反力通过 C，无额外接触力偶。忽略变形和惯性。球心仍高于下方地面 R，且球心到 C 的距离为 R。

  ![球与台阶棱角 C 接触，球心 O 位于 C 的左上方，OC=R；图标出台阶高度 h、竖直差 R−h、水平差 d，以及通过球心的 F 和 Mg。](asset:m030)

  *原创教学示意图，非按比例绘制。*

  求准静态抬升的临界水平力 F，以 $\mathrm{N}$ 为单位，保留三位有效数字。
hints:
- 在临界瞬间对台阶棱角取矩，接触反力便不出现。
- 重力和水平推力的力臂不同，需要先由圆的几何关系求出。
feedback:
  correct: 在接触状态改变的临界瞬间选取支点，利用几何确定力矩臂。，并保留了题设的适用条件。
  incorrect: 在临界瞬间对台阶棱角取矩，接触反力便不出现。
solution: |-
  以 C 为支点，球心相对 C 的竖直高度为 $R-h$，故水平力 F 的力臂为 $R-h$。球心到 C 的距离为 R，重力的水平力臂为 $d=\sqrt{R^2-(R-h)^2}=\sqrt{2Rh-h^2}$。临界力矩平衡为 $F(R-h)=Mgd$。代入 $d=\sqrt{2\times0.100\times0.0200-0.0200^2}=0.0600\,\mathrm{m}$，得到 $F=0.300\times10.0\times0.0600/0.0800=2.25\,\mathrm{N}$。

  **检查与物理含义：** 推力矩 $2.25\times0.0800=0.180\,\mathrm{N\,m}$ 与重力矩 $3.00\times0.0600=0.180\,\mathrm{N\,m}$ 相等。$h\to0$ 时所需力趋零；$h\to R^-$ 时水平力的力臂趋零，阈值发散。

  **适用范围：** 实际机器人可通过弹性、惯性、跳跃或改变施力位置越障；本准静态阈值不适用于这些其他机制。

  **来源定位：** Tumbleweed-inspired robots with hybrid mobility for terrestrial exploration，Results: Hybrid mobility and obstacle traversal; active assistance for environmental obstacles；[论文 DOI](https://doi.org/10.1038/s41467-025-66513-1)。
