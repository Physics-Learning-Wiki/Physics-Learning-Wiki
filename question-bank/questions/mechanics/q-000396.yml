choices:
- id: A
  content: 速率恒为 $\sqrt{R^2\Omega^2+V^2}$。
- id: B
  content: 竖直加速度恒为 $-g$，即使 z(t) 已给为 $-Vt$。
- id: C
  content: 加速度大小恒为 $R\Omega^2$，方向在水平面指向 z 轴。
- id: D
  content: 完成一圈轨迹进动时，竖直下降量为 $2\pi V/\Omega$。
answer:
  choices:
  - A
  - C
  - D
