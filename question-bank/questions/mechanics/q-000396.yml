stem: '翅果研究用多点追踪展示种子与翼尖的平滑螺旋下降。用匀半径、匀进动的教学轨迹分离水平绕行和竖直下降的运动学。（[研究来源](https://doi.org/10.1098/rsif.2025.0391)）


  取固定惯性坐标系，z 轴竖直向上。一个被追踪点的理想轨迹为 $x(t)=R\cos(\Omega t)$、$y(t)=R\sin(\Omega t)$、$z(t)=-Vt$，其中 $R,\Omega,V>0$ 为常数。这里 $\Omega$
  描述轨迹绕 z 轴的进动，不是翅果绕展向的滚转角速度；该轨迹不用于求未知气动力。


  ![固定 z 轴周围的理想下降螺线，水平绕行半径 R、向下速度分量 V 和一圈竖直下降量以符号标示；x、y 为水平坐标。](asset:m047)


  *原创教学示意图，非按比例绘制。*


  以下哪些陈述成立？选择所有成立的陈述。'
hints:
- 逐分量求一阶和二阶时间导数。
- 进动一圈对应 Ωt 增加 2π，而不是展向滚转一圈。
feedback:
  correct: 对三维参数轨迹求导，区分恒定速率、恒定速度和向心加速度。，并保留了题设的适用条件。
  incorrect: 逐分量求一阶和二阶时间导数。
  choices:
    A: 水平圆周速率与竖直速率正交，合速率由平方和开方得到。
    B: 给定轨迹的二阶导数为零；若分析受力，空气动力须参与竖直平衡。
    C: 两次求导后只剩水平向心项。
    D: 先求绕轴周期，再乘以恒定下降速率。
solution: '逐分量求导，$\mathbf v=(-R\Omega\sin\Omega t,\ R\Omega\cos\Omega t,\ -V)$，故速率 $|\mathbf v|=\sqrt{R^2\Omega^2+V^2}$ 恒定。再求导得
  $\mathbf a=(-R\Omega^2\cos\Omega t,\ -R\Omega^2\sin\Omega t,\ 0)$，加速度完全水平、指向 z 轴，其大小为 $R\Omega^2$。竖直速度为常数，故 $a_z=0$；有重力并不意味着净加速度只能等于重力。进动周期
  $T=2\pi/\Omega$，一圈的竖直下降量为 $VT=2\pi V/\Omega$。


  **检查与物理含义：** $\mathbf v\cdot\mathbf a=0$，说明加速度只改变方向而不改变速率；$R\to0$ 时回到竖直匀速下降、加速度为零。螺距 $2\pi V/\Omega$ 的量纲为长度。


  **适用范围：** 真实轨迹会随释放瞬态、形态和气流变化；本题不由运动学公式反推出具体升力或力矩。


  **来源定位：** Precession dynamics and morphology of rolling samaras，§3.1, Fig. 3a–c and text on smooth helical seed/wingtip
  trajectories；[论文 DOI](https://doi.org/10.1098/rsif.2025.0391)。'
