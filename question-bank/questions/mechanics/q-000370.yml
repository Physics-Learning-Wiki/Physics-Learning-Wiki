choices:
- id: A
  content: $p_\theta=J\dot\phi$；$\dot\phi=0$。
- id: B
  content: $p_\theta=(I+J)\dot\theta-J\dot\phi$；$\dot\theta=J\dot\phi/(I+J)$。
- id: C
  content: $p_\theta=(I+J)\dot\theta+J\dot\phi$；$\dot\theta=-J\dot\phi/(I+J)$。
- id: D
  content: $p_\theta=I\dot\theta$；$\dot\theta=0$。
answer:
  choice: C
