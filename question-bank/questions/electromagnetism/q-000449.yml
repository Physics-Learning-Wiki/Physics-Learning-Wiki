reference_answer: 入射磁场沿 \(+x\)，反射磁场沿 \(-\cos\theta\,\hat x+\sin\theta\,\hat z\)。两波法向平均能流分别为 \(-E_{\rm i}^2/(2\eta_0)\) 和 \(E_{\rm
  r}^2\cos\theta/(2\eta_0)\)。守恒给出 \(E_{\rm r}/E_{\rm i}=1/\sqrt{\cos\theta}\)，在 \(60^\circ\) 时为 \(\sqrt2\)；幅值增大补偿斜向能流的法向投影减小。
