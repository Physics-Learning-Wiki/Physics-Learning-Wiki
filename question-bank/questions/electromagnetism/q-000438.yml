stem: '旋转永磁体电场研究采用磁准静态模型，并扫描转动频率。下面对一个另行指定的简单材料做尺度检查；示例材料参数不代表真实脑组织参数。 [研究来源](https://www.mdpi.com/2306-5354/11/3/258)


  一个均匀、线性、各向同性且无色散的教学介质满足


  $$

  \mathbf J_{\rm c}=\sigma\mathbf E,\qquad

  \mathbf J_{\rm d}=\varepsilon\frac{\partial\mathbf E}{\partial t}.

  $$


  局部非零电场以 \(f=400\ \mathrm{Hz}\) 作正弦变化，介质参数为


  $$

  \sigma=0.20\ \mathrm{S/m},\qquad \varepsilon=80\varepsilon_0,\qquad

  \varepsilon_0=8.85\times10^{-12}\ \mathrm{F/m}.

  $$


  定义幅值比 \(\eta=J_{{\rm d},0}/J_{{\rm c},0}\)，即位移电流峰值除以传导电流峰值。哪项结论正确？此处只检验电流幅值比，不要求据此证明完整准静态模型成立。'
solution: '若电场峰值为 \(E_0\)，则


  $$

  J_{{\rm c},0}=\sigma E_0,\qquad J_{{\rm d},0}=2\pi f\varepsilon E_0.

  $$


  相除得


  $$

  \frac{J_{{\rm d},0}}{J_{{\rm c},0}}

  =\frac{2\pi f\varepsilon}{\sigma}

  =\frac{2\pi(400)(80)(8.85\times10^{-12})}{0.20}

  \approx8.90\times10^{-6}.

  $$


  因此该例中位移电流幅值远小于传导电流幅值。比值无量纲，因为 \(\varepsilon/\sigma\) 的单位是秒。若频率上升或电导率下降，比值会增大；还需另外检查空间尺度、传播延迟和材料色散，才可完整判断近似。


  选项辨析：


  “比值约 \(8.9\times10^{-6}\)，传导电流占主导”正确，位移电流是分子且比值远小于 1。


  “同一小比值表示位移电流占主导”颠倒了分子和分母的意义。


  “比值约 \(8.9\times10^6\)”存在量级或 SI 单位换算错误。


  “任意频率都可忽略”错误，因为比值与频率成正比，还依赖 \(\varepsilon/\sigma\)。


  适用范围：真实低频生物组织的介电参数和色散需要独立资料；本题计算不能证明论文组织模型的全部近似有效。


  来源定位：Electric Field Characteristics of Rotating Permanent Magnet Stimulation，Methods: governing equations and magnetoquasistatic
  computational model; Results: frequency sweep; Discussion of conductivity approximations。DOI: [10.3390/bioengineering11030258](https://doi.org/10.3390/bioengineering11030258)。'
hints:
- 正弦电场的时间导数峰值为 \(2\pi fE_0\)。
- 用位移电流除以传导电流；共同的 \(E_0\) 会消去。
