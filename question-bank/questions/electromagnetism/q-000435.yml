    B: “4 倍”错误地把电动势幅值当成与频率平方成正比；一次时间导数只产生一次频率因子。
    C: “2 倍”正确：峰值与 \(p\Omega\) 成正比，题设保持 \(\Phi_0,\Omega\) 不变。
    D: “1 倍”忽略了每转磁通变化次数的增加；相同转速不一定意味着相同磁通频率。
