feedback:
  correct: 判断正确．中板势为 $V=\sigma ab/[\varepsilon_0(a+b)]$，左面密度为 $\varepsilon_0V/a$．
  incorrect: 请先重新核对模型条件．中板势为 $V=\sigma ab/[\varepsilon_0(a+b)]$，左面密度为 $\varepsilon_0V/a$．
  choices:
    A: 中板势为 $V=\sigma ab/[\varepsilon_0(a+b)]$，左面密度为 $\varepsilon_0V/a$．
    B: 只有两间距相等时才平均分配．
    C: 把右侧分配误用于左侧；较窄间隙对应较大电容．
