stem: 两接地外板与中间带电板的间距分别为 $a,b$，中板净面密度为 $\sigma$，其左侧表面密度为？
solution: 中板势为 $V=\sigma ab/[\varepsilon_0(a+b)]$，左面密度为 $\varepsilon_0V/a$．
