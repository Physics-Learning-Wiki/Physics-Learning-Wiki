stem: '**保守性、零点与分段势**


  先由点电荷场证明静电环路定理，再求均匀带电实心长圆柱的电势，圆柱半径 $R$、体密度 $\rho$，取 $\varphi(R)=0$．讨论能否改取无穷远零势，并验证势的导数．'
solution: '1. 点场有 $\boldsymbol E\cdot\mathrm{d}\boldsymbol l=kQ\,\mathrm{d}r/r^2=-\mathrm{d}(kQ/r)$，端点相同则积分零．固定多源由线性叠加推广，路径须避开奇点．

  2. 圆柱内场为 $\rho s/(2\varepsilon_0)$，外场为 $\rho R^2/(2\varepsilon_0s)$．分别从 R 积分：内势 $\rho(R^2-s^2)/(4\varepsilon_0)$，外势 $-\rho
  R^2\ln(s/R)/(2\varepsilon_0)$．

  3. 势在表面连续，负导数恢复两区场．无限圆柱外场积分到无穷远对数发散，不能要求有限的无穷远零势．

  4. 评分核对：证明、叠加条件、分段积分常数、导数与远处条件分别自检．'
