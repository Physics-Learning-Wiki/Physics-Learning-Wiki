stem: '**偶极子的完整场与误差**


  两点电荷 $\pm q$ 位于 $z=\pm a$．从精确电势展开得到偶极远场，再求球坐标和坐标无关的场．用正轴精确解估计 $z=10a$ 处领先项的误差．'
solution: '1. $\varphi=kq(1/|\boldsymbol r-a\boldsymbol e_z|-1/|\boldsymbol r+a\boldsymbol e_z|)$，$p=2qa$，远处得 $\varphi\simeq
  kp\cos\theta/r^2$．

  2. 负梯度给 $E_r=2kp\cos\theta/r^3$、$E_\theta=kp\sin\theta/r^3$，合成 $\boldsymbol E=k[3(\boldsymbol p\cdot\boldsymbol n)\boldsymbol
  n-\boldsymbol p]/r^3$．

  3. 正轴精确式为 $2kpz^{-3}(1-a^2/z^2)^{-2}$．相对领先项的首个修正约 $2a^2/z^2$，在 $10a$ 处约百分之二．

  4. 评分核对：说明远场条件、角向尺度因子、特殊方向与误差的适用含义．'
