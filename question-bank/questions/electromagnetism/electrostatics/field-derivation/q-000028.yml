stem: "**带电细圆环与薄圆盘轴线电场微元矢量积分与渐近分析**\n\n在无法直接应用高斯定理求解全局电场时，直接使用库仑定律微元积分是基本物理方法。请完成以下三步推导：\n\n1. **均匀带电细圆环轴线电场推导与极值点**：\n  \
  \ - 半径为 $R$ 的细圆环置于 $xy$ 平面，环心位于原点，均匀带有总电量 $q$（$q > 0$）。\n   - 分析轴线上（$z$ 轴）任一点 $P(0,0,z)$ 的电场对称性，说明为何垂直于 $z$ 轴的分量积分抵消；\n\
  \   - 积分推导点 $P$ 处的电场强度矢量 $\\boldsymbol{E}(z)$；\n   - 对 $E_z(z)$ 求导，确定轴线上电场强度模长达到极大值的位置 $z_{\\text{max}}$，并写出极大值 $E_{\\text{max}}$。\n\
  \n2. **均匀带电薄圆盘轴线电场推导**：\n   - 半径为 $R$ 的均匀带电薄圆盘置于 $xy$ 平面，中心在原点，面电荷密度为 $\\sigma$（$\\sigma > 0$）；\n   - 将圆盘分割为半径 $r'$、宽度 $\\\
  mathrm{d}r'$ 的细同心圆环，利用上述细圆环的场强结果进行积分；\n   - 推导出轴线上 $z > 0$ 区域各点的电场强度矢量 $\\boldsymbol{E}(z)$。\n\n3. **渐近极限与物理模型退化**：\n  \
  \ - **近场极限（$z \\ll R$ 或 $R \\to \\infty$）**：分析圆盘轴线场强的渐近行为，说明其退化为哪种经典理想模型；\n   - **远场极限（$z \\gg R$）**：利用泰勒展开 $\\frac{z}{\\\
  sqrt{R^2 + z^2}} = \\left(1 + \\frac{R^2}{z^2}\\right)^{-1/2}$ 展开至一阶修正项，证明其一级近似退化为总电量为 $Q = \\sigma \\pi R^2$ 的点电荷库仑电场。\n"
