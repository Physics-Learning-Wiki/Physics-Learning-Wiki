stem: "**柱对称体系与同轴复合柱电场推导**\n\n柱对称是静电学高斯定理应用的经典模型之一。请完成以下两项推导与分析：\n\n1. **无限长均匀带电直细线**：\n   - 线电荷密度为 $\\lambda$（$\\lambda >\
  \ 0$）。分析其空间对称性，并说明为何端面无电通量；\n   - 选取适当的闭合高斯面，推导距导线垂直距离为 $r$ 处的电场强度矢量 $\\boldsymbol{E}(r)$。\n\n2. **同轴复合柱电场与静电屏蔽**：\n   -\
  \ 内层为无限长实心绝缘圆柱体，半径为 $R_1$，均匀充满体电荷密度 $\\rho$（$\\rho > 0$）；\n   - 外层为同轴的极薄圆柱导电套筒，半径为 $R_2$（$R_2 > R_1$），套筒单位长度所带电荷量为 $\\lambda_2$。\n\
  \   - 分别推导区域 I（$r < R_1$）、区域 II（$R_1 \\le r < R_2$）和区域 III（$r > R_2$）内的电场强度矢量 $\\boldsymbol{E}(r)$；\n   - 若要求区域 III 内处处无电场（即实现外层对外的静电屏蔽），求外壳单位长度带电量\
  \ $\\lambda_2$ 必须满足的条件，并从高斯定理的角度解释该结论的物理本质。\n"
