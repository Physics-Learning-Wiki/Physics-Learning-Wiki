stem: "**平面对称体系与界面电场法向跃变定理推导**\n\n平面对称在静电学分析中具有代表性。请完成以下三项理论推导：\n\n1. **无限大均匀带电薄板**：\n   - 面电荷密度为 $\\sigma$（$\\sigma > 0$）。分析其镜像对称性，选取恰当的柱形高斯盒；\n\
  \   - 推导板两侧区域的电场强度矢量 $\\boldsymbol{E}$，并指出电场方向与距离的关系。\n\n2. **厚度为 $2d$ 的无限大均匀带电厚平板**：\n   - 平板中心位于 $z = 0$ 面，电荷均匀分布在 $-d\
  \ \\le z \\le d$ 空间内，体电荷密度为 $\\rho$（$\\rho > 0$）；\n   - 利用关于 $z = 0$ 面的反演对称性（由镜像对称可得 $E_z(0) = 0$），选取适当高斯面；\n   - 分别推导平板内部（$|z|\
  \ \\le d$）与平板外部（$|z| > d$）的电场矢量 $\\boldsymbol{E}(z)$；\n   - 分析 $E_z$ 随坐标 $z$ 的变化规律，并验证其在边界 $z = \\pm d$ 处是否连续。\n\n3. **曲面带电界面法向跃变定理严格证明**：\n\
  \   - 设任意分界面上存在自由面电荷密度 $\\sigma$，法向单位矢量 $\\hat{\\boldsymbol{n}}$ 指向介质 2；\n   - 构建一个底面积为 $\\Delta A$、高度为 $\\Delta h$ 的微元高斯圆柱盒跨越界面，取极限\
  \ $\\Delta h \\to 0$；\n   - 严格推导两侧电场法向分量的跃变关系 $\\hat{\\boldsymbol{n}} \\cdot (\\boldsymbol{E}_2 - \\boldsymbol{E}_1) = \\\
  frac{\\sigma}{\\varepsilon_0}$，并结合静电场环路定理简要说明切向分量为何满足 $E_{2t} = E_{1t}$。\n"
