reference_answer: "1. 均匀带电球体：\n   - 球内（$r \\le R$）：$\\boldsymbol{E}(r) = \\frac{\\rho r}{3\\varepsilon_0}\\hat{\\boldsymbol{r}}\
  \ = \\frac{Q r}{4\\pi\\varepsilon_0 R^3}\\hat{\\boldsymbol{r}}$（与 $r$ 成正比线性增长）。\n   - 球外（$r > R$）：$\\boldsymbol{E}(r) =\
  \ \\frac{Q}{4\\pi\\varepsilon_0 r^2}\\hat{\\boldsymbol{r}}$（与点电荷场强完全一致，按 $1/r^2$ 衰减）。\n   - 界面讨论：在 $r = R$ 处，$E_{\\text{内}}(R)\
  \ = E_{\\text{外}}(R) = \\frac{Q}{4\\pi\\varepsilon_0 R^2}$，由于体电荷分布无宏观面电荷堆积（$\\sigma = 0$），电场强度在交界面处连续。\n\n2. 非均匀带电球体 $\\\
  rho(r) = Ar$：\n   - 总电荷量：$Q_{\\text{总}} = \\int_0^R \\rho(r') 4\\pi r'^2 \\mathrm{d}r' = 4\\pi A \\int_0^R r'^3 \\mathrm{d}r'\
  \ = \\pi A R^4$。\n   - 球内（$r \\le R$）：高斯面内包围电量 $Q_{\\text{in}}(r) = \\pi A r^4$，由高斯定理 $4\\pi r^2 E = \\frac{\\pi A r^4}{\\\
  varepsilon_0}$ 得 $\\boldsymbol{E}_{\\text{内}}(r) = \\frac{A r^2}{4\\varepsilon_0}\\hat{\\boldsymbol{r}}$。\n   - 球外（$r >\
  \ R$）：面内包围全电量 $Q_{\\text{总}}$，得 $\\boldsymbol{E}_{\\text{外}}(r) = \\frac{A R^4}{4\\varepsilon_0 r^2}\\hat{\\boldsymbol{r}}\
  \ = \\frac{Q_{\\text{总}}}{4\\pi\\varepsilon_0 r^2}\\hat{\\boldsymbol{r}}$。\n   - 界面检验：在 $r = R$ 处两式均给出 $E(R) = \\frac{A\
  \ R^2}{4\\varepsilon_0}$，电场处处连续。\n"
solution: "### 1. 均匀带电球体的电场推导\n- **对称性分析**：电荷分布具有完整的球对称性。因此，电场线只能沿径向向外（若 $Q>0$）辐射，电场强度矢量形式必为 $\\boldsymbol{E}(\\boldsymbol{r})\
  \ = E(r)\\hat{\\boldsymbol{r}}$，且在同心球面上大小处处相等。\n- **选取高斯面**：以球心为中心，作半径为 $r$ 的同心球面高斯面 $S$。通过高斯面的电通量为：\n  $$\\Phi_E = \\oint_S\
  \ \\boldsymbol{E} \\cdot \\mathrm{d}\\boldsymbol{S} = E(r) \\cdot 4\\pi r^2$$\n- **球内场强（$r \\le R$）**：\n  高斯面内包含的净电量为：\n\
  \  $$Q_{\\text{in}} = \\rho \\cdot \\frac{4}{3}\\pi r^3 = Q \\frac{r^3}{R^3}$$\n  由高斯定理 $E(r) \\cdot 4\\pi r^2 = \\frac{Q_{\\\
  text{in}}}{\\varepsilon_0} = \\frac{\\rho \\cdot \\frac{4}{3}\\pi r^3}{\\varepsilon_0}$，得：\n  $$\\boldsymbol{E}(r) = \\\
  frac{\\rho r}{3\\varepsilon_0}\\hat{\\boldsymbol{r}} = \\frac{Q r}{4\\pi\\varepsilon_0 R^3}\\hat{\\boldsymbol{r}}$$\n- **球外场强（$r\
  \ > R$）**：\n  高斯面包含球体内全部电量 $Q_{\\text{in}} = Q$。由高斯定理：\n  $$E(r) \\cdot 4\\pi r^2 = \\frac{Q}{\\varepsilon_0} \\implies\
  \ \\boldsymbol{E}(r) = \\frac{Q}{4\\pi\\varepsilon_0 r^2}\\hat{\\boldsymbol{r}}$$\n- **界面连续性**：\n  在 $r = R$ 处，代入两式均得 $E(R)\
  \ = \\frac{Q}{4\\pi\\varepsilon_0 R^2}$。界面处无自由面电荷（$\\sigma = 0$），由电场跃变定理 $\\Delta E_n = \\sigma / \\varepsilon_0 = 0$，电场在界面处严格连续。\n\
  \n### 2. 径向非均匀带电球体 $\\rho(r) = A r$ 的电场推导\n- **总电量计算**：\n  采用薄球壳体积元 $\\mathrm{d}V = 4\\pi r'^2 \\mathrm{d}r'$：\n  $$Q_{\\\
  text{总}} = \\int_0^R \\rho(r') \\cdot 4\\pi r'^2 \\mathrm{d}r' = 4\\pi A \\int_0^R r'^3 \\mathrm{d}r' = 4\\pi A \\left[\\\
  frac{r'^4}{4}\\right]_0^R = \\pi A R^4$$\n- **球内场强（$r \\le R$）**：\n  作半径为 $r$ 的球面高斯面，面内所含电量为：\n  $$Q_{\\text{in}}(r) = \\\
  int_0^r Ar' \\cdot 4\\pi r'^2 \\mathrm{d}r' = \\pi A r^4$$\n  由高斯定理：\n  $$E(r) \\cdot 4\\pi r^2 = \\frac{\\pi A r^4}{\\\
  varepsilon_0} \\implies \\boldsymbol{E}(r) = \\frac{A r^2}{4\\varepsilon_0}\\hat{\\boldsymbol{r}}$$\n  此时球内场强随径向距离呈二次方规律\
  \ $E \\propto r^2$ 增长。\n- **球外场强（$r > R$）**：\n  高斯面涵盖全部电量 $Q_{\\text{总}} = \\pi A R^4$：\n  $$E(r) \\cdot 4\\pi r^2 = \\\
  frac{\\pi A R^4}{\\varepsilon_0} \\implies \\boldsymbol{E}(r) = \\frac{A R^4}{4\\varepsilon_0 r^2}\\hat{\\boldsymbol{r}}\
  \ = \\frac{Q_{\\text{总}}}{4\\pi\\varepsilon_0 r^2}\\hat{\\boldsymbol{r}}$$\n- **界面连续性验证**：\n  在 $r \\to R^-$ 时，$E = \\frac{A\
  \ R^2}{4\\varepsilon_0}$；在 $r \\to R^+$ 时，$E = \\frac{A R^4}{4\\varepsilon_0 R^2} = \\frac{A R^2}{4\\varepsilon_0}$。内外场强在球表面平滑相接，连续性得到严格满足。\n"
