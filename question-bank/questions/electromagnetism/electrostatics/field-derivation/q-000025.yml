stem: "**球对称体系静电场综合推导**\n\n请写出以下两种典型球对称带电体系的电场推导过程：\n\n1. **均匀带电球体**：半径为 $R$ 的实心球体，均匀带电总量为 $Q$（体电荷密度 $\\rho = \\frac{3Q}{4\\\
  pi R^3}$）。\n   - 分析对称性，选取恰当的高斯面；\n   - 分别推导球内（$r \\le R$）和球外（$r > R$）的电场强度矢量 $\\boldsymbol{E}(r)$；\n   - 讨论在交界面 $r = R$\
  \ 处电场的连续性。\n\n2. **径向非均匀带电球体**：半径为 $R$ 的绝缘球体，体电荷密度随径向距离线性增加，即 $\\rho(r) = A r$（$0 \\le r \\le R$，$A$ 为正常数），球外无电荷。\n   -\
  \ 计算球体所带的总电荷量 $Q_{\\text{总}}$（用 $A$ 和 $R$ 表示）；\n   - 利用高斯定理分别推导球内（$r \\le R$）与球外（$r > R$）的电场强度矢量 $\\boldsymbol{E}(r)$；\n\
  \   - 检验交界面 $r = R$ 处电场是否满足界面条件。\n"
