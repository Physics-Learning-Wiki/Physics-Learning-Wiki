stem: "**偏心球形与柱形空腔内匀强电场的割补叠加法严格推导**\n\n割补法（负电荷填充等效法）是解决非完整对称带电结构场强分布的核心方法。请完成以下两项推导：\n\n1. **偏心球形空腔内的匀强电场证明**：\n   - 一个半径为\
  \ $R$ 的均匀带电实心球体，体电荷密度为 $\\rho$。首先写出球内任一点（相对球心 $O_1$ 的矢径为 $\\boldsymbol{r}_1$）的电场矢量表达式 $\\boldsymbol{E}_1(\\boldsymbol{r}_1)$；\n\
  \   - 在球内挖去一个半径为 $R'$ 的偏心球形空腔（满足 $|\\boldsymbol{a}| + R' < R$），空腔球心 $O_2$ 相对于原球心 $O_1$ 的位置矢量为 $\\boldsymbol{a}$（即 $\\overrightarrow{O_1\
  \ O_2} = \\boldsymbol{a}$）；\n   - 利用电荷割补原理（将挖去空腔等效为完整大球与一个充满体电荷密度 $-\\rho$ 的小球重叠），严格写出空腔内任一点 $P$ 的场强矢量叠加式；\n   - 证明空腔内部各点的电场强度是严格均匀的，并写出腔内电场矢量\
  \ $\\boldsymbol{E}_{\\text{腔}}$ 的大小与方向。\n\n2. **无限长偏心柱形空腔内的匀强电场推广**：\n   - 类似地，设一个无限长均匀带电圆柱体（体电荷密度 $\\rho$），内部挖去一个轴线相互平行的无限长偏心圆柱形空腔，腔轴相对原柱轴的横截面位移矢量为\
  \ $\\boldsymbol{a}$；\n   - 给出无腔无限长圆柱内部场强的二维径向矢量表达式；\n   - 证明柱腔内部的电场同样是严格均匀的，并给出柱腔内场强矢量 $\\boldsymbol{E}_{\\text{柱腔}}$。\n"
