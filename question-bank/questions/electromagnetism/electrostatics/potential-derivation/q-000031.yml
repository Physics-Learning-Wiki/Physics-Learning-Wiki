stem: "**轴线标量电势积分及电势梯度微商验证（圆环与薄圆盘）**\n\n通过标量积分求解电势，再利用负梯度 $\\boldsymbol{E} = -\\nabla V$ 求解电场，通常比直接进行矢量微元积分更加简便。请完成以下三项推导与分析：\n\
  \n1. **均匀带电细圆环轴线电势与负梯度验证**：\n   - 半径为 $R$ 的细圆环置于 $xy$ 平面，环心在坐标原点，均匀带总电荷 $q$（$q > 0$），取无穷远处为电势参考点；\n   - 分析环上任意电荷微元 $\\mathrm{d}q$\
  \ 到轴线上 $P(0,0,z)$ 的几何距离，推导轴线电势 $V(z)$；\n   - 通过一维负导数关系 $E_z = -\\frac{\\mathrm{d}V}{\\mathrm{d}z}$ 求解轴线电场强度，并与库仑矢量积分结果进行对照验证。\n\
  \n2. **均匀带电薄圆盘轴线电势推导**：\n   - 半径为 $R$ 的薄圆盘置于 $xy$ 平面，中心在原点，面电荷密度为 $\\sigma$（$\\sigma > 0$）；\n   - 将圆盘分割为同心细圆环微元，利用上述细圆环电势公式进行标量积分；\n\
  \   - 推导出轴线上全域（包括 $z > 0$ 与 $z < 0$）的电势解析表达式 $V(z)$（注意包含 $|z|$ 绝对值项）。\n\n3. **圆盘轴线电场求导与界面导数跃变分析**：\n   - 分别对 $z > 0$ 与 $z\
  \ < 0$ 区域求负导数 $E_z = -\\frac{\\partial V}{\\partial z}$，得到轴线电场分布；\n   - 考察 $z \\to 0^+$ 与 $z \\to 0^-$ 时的电场极限，计算穿越盘面时的法向场强差\
  \ $\\Delta E_z = E_z(0^+) - E_z(0^-)$；\n   - 结合电势与电场的关系，从物理上阐明为什么电势函数 $V(z)$ 在 $z=0$ 处连续（呈尖点拐折），而其一阶导数（电场）却发生不连续跃变。\n"
