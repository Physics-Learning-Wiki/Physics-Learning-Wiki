stem: "**电偶极子远场电势多极展开、负梯度场强与等势面推导**\n\n电偶极子是静电学多极展开的一级基元模型。请完成以下三项理论推导：\n\n1. **远场多极展开电势严格推导**：\n   - 设一对等量异号点电荷 $+q$ 和 $-q$\
  \ 放置在 $z$ 轴上，坐标分别为 $(0, 0, +d/2)$ 与 $(0, 0, -d/2)$，电偶极矩矢量定义为 $\\boldsymbol{p} = q\\boldsymbol{d} = qd\\hat{\\boldsymbol{z}}$；\n\
  \   - 场点 $P$ 的球坐标为 $(r, \\theta, \\varphi)$。写出场点到两电荷的精确几何距离 $r_+$ 与 $r_-$；\n   - 在远场条件（$r \\gg d$）下，利用一阶泰勒展开 $\\frac{1}{r_\\\
  pm} \\approx \\frac{1}{r}\\left(1 \\pm \\frac{d}{2r}\\cos\\theta\\right)$，推导证明远场电势为：\n     $$V(r, \\theta) = \\frac{p \\\
  cos\\theta}{4\\pi\\varepsilon_0 r^2} = \\frac{\\boldsymbol{p} \\cdot \\hat{\\boldsymbol{r}}}{4\\pi\\varepsilon_0 r^2}$$\n\
  \n2. **球坐标系负梯度求电场强度**：\n   - 利用球坐标系梯度算符公式 $\\nabla V = \\frac{\\partial V}{\\partial r}\\hat{\\boldsymbol{r}} + \\frac{1}{r}\\\
  frac{\\partial V}{\\partial \\theta}\\hat{\\boldsymbol{\\theta}} + \\frac{1}{r\\sin\\theta}\\frac{\\partial V}{\\partial\
  \ \\varphi}\\hat{\\boldsymbol{\\varphi}}$，通过 $\\boldsymbol{E} = -\\nabla V$ 分别求出径向分量 $E_r$ 与极角分量 $E_\\theta$；\n   - 写出远场电场强度总大小\
  \ $E(r, \\theta)$ 的解析式；\n   - 分别讨论在偶极子轴线上（$\\theta = 0$ 或 $\\pi$）与正交赤道面上（$\\theta = \\pi/2$）的电场强度大小与方向特征。\n\n3. **等势面与电力线正交性几何解析**：\n\
  \   - 写出远场等势面 $V(r, \\theta) = C$（常数）在平面极坐标系下的函数方程 $r(\\theta)$；\n   - 说明赤道面 $\\theta = \\frac{\\pi}{2}$ 是怎样的等势面；\n   -\
  \ 利用微分方程 $\\frac{\\mathrm{d}r}{r\\,\\mathrm{d}\\theta} = \\frac{E_r}{E_\\theta}$ 积分推导电力线方程 $r(\\theta) = C_0 \\sin^2\\theta$，并证明电力线与等势线在空间处处正交。\n"
