stem: "**静电场保守性、环路定理与电势参考点规范严格推导**\n\n电势概念的建立依赖于静电场的保守力场性质。请完成以下三项理论推导与讨论：\n\n1. **静电场环路定理与全微分推导**：\n   - 从单个点电荷 $q$ 的库仑电场\
  \ $\\boldsymbol{E}(\\boldsymbol{r}) = \\frac{q}{4\\pi\\varepsilon_0 r^2}\\hat{\\boldsymbol{r}}$ 出发，计算沿空间任意路径移动检验电荷的线元点积\
  \ $\\boldsymbol{E} \\cdot \\mathrm{d}\\boldsymbol{l}$；\n   - 证明 $\\boldsymbol{E} \\cdot \\mathrm{d}\\boldsymbol{l} = -\\\
  mathrm{d}V$，即线元点积可写为全微分形式；\n   - 由此证明沿任意闭合路径 $L$ 的线积分恒为零：$\\oint_L \\boldsymbol{E} \\cdot \\mathrm{d}\\boldsymbol{l} = 0$（静电场的环路定理）；\n\
  \   - 利用场强叠加原理将上述结论推广至任意分布的静电荷系，并阐明为什么这保证了空间两点间电势差 $U_{AB} = \\int_A^B \\boldsymbol{E}\\cdot\\mathrm{d}\\boldsymbol{l}$\
  \ 的路径无关性与单值性。\n\n2. **无穷远电势参考点 $V(\\infty) = 0$ 的收敛性条件**：\n   - 假设所有源电荷均局域在以原点为中心、有限半径为 $R$ 的区域内，系统总电量为 $Q$；\n   - 证明在远距离\
  \ $r \\gg R$ 处，电势积分 $\\int_r^\\infty E(r')\\,\\mathrm{d}r'$ 必然收敛，从而说明有限局域电荷系总可以合理规范 $V(\\infty) = 0$。\n\n3. **非局域带电体系参考点反常与规范选取**：\n\
  \   - 对于无限长均匀带电直线（线密度 $\\lambda$）或无限大均匀带电平面（面密度 $\\sigma$），若强行将积分上限设定至无穷远 $\\int_r^\\infty E\\,\\mathrm{d}r$，分析积分发散的数学原因与物理根源；\n\
  \   - 说明在这类非局域模型中应如何规范选取电势参考点，并写出无限长带电直线相对有限参考距离 $r_0$ 的电势表达式。\n"
