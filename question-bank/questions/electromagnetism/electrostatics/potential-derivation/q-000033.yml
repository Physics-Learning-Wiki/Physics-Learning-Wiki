stem: "**柱对称系统对数电势路径积分与同轴圆柱电容器推导**\n\n柱对称系统电场按 $1/r$ 衰减，其电势展现出典型的对数特性。请完成以下三项推导：\n\n1. **无限长均匀带电直细线对数电势推导**：\n   - 线电荷密度为\
  \ $\\lambda$（$\\lambda > 0$），已知场强分布为 $E(r) = \\frac{\\lambda}{2\\pi\\varepsilon_0 r}$；\n   - 规定距导线垂直距离为 $r_0$ 处的一点为电势参考点（即\
  \ $V(r_0) = 0$）；\n   - 通过沿径向的路径积分，推导出距导线距离为 $r$ 处的电势分布表达式 $V(r)$。\n\n2. **均匀带电实心圆柱体电势分布（选柱面为参考点）**：\n   - 半径为 $R$ 的无限长实心绝缘圆柱体，均匀充满体电荷密度\
  \ $\\rho$（$\\rho > 0$）；\n   - 选取圆柱表面 $r = R$ 为电势参考点（即 $V(R) = 0$）；\n   - 利用高斯定理给出的柱内场强 $E_{\\text{内}}(r) = \\frac{\\rho\
  \ r}{2\\varepsilon_0}$ 与柱外场强 $E_{\\text{外}}(r) = \\frac{\\rho R^2}{2\\varepsilon_0 r}$，分别推导柱外（$r > R$）和柱内（$r \\le R$）的电势分布解析式\
  \ $V(r)$；\n   - 验证在边界 $r = R$ 处电势的连续性与一阶导数的平滑性。\n\n3. **同轴圆柱形电容器电势差与单位长度电容推导**：\n   - 由半径为 $R_a$ 的内圆柱面与半径为 $R_b$ 的外同轴圆柱面（$R_a\
  \ < R_b$）组成一个长电容器；\n   - 两极板单位长度所带电荷分别为 $+\\lambda$ 与 $-\\lambda$；\n   - 积分推导内外两极板之间的电势差 $U = V_a - V_b$；\n   - 据此推导该同轴圆柱形电容器单位长度的电容\
  \ $C_L = \\frac{C}{L}$。\n"
