stem: "**均匀实心球二次抛物线电势与同心双球壳接地感应电势推导**\n\n球对称系统的电势路径积分与接地导体边界条件是电磁学考查的重中之重。请完成以下两项推导：\n\n1. **均匀实心绝缘球体的电势分布推导**：\n   - 半径为\
  \ $R$ 的绝缘实心球体，均匀带有总电量 $Q$（$Q > 0$），取无穷远处为电势参考点 $V(\\infty) = 0$；\n   - 已知高斯定理给出的场强分布为 $E_{\\text{外}}(r) = \\frac{Q}{4\\\
  pi\\varepsilon_0 r^2}$（$r \\ge R$）和 $E_{\\text{内}}(r) = \\frac{Q r}{4\\pi\\varepsilon_0 R^3}$（$r < R$）；\n   - 通过分段路径积分，分别推导球外（$r\
  \ \\ge R$）和球内（$r < R$）的电势解析式 $V(r)$；\n   - 证明球心处的电势与球面电势满足倍数关系 $V(0) = \\frac{3}{2}V(R)$；\n   - 分析 $V-r$ 曲线在球表面 $r = R$\
  \ 处的几何特征（连续性与一阶导数的平滑性）。\n\n2. **同心双金属球壳接地感应电势推导**：\n   - 现有两个极薄的同心金属球面壳，内壳半径为 $R_1$，外壳半径为 $R_2$（$R_2 > R_1$）；\n   - 内球壳带净电荷\
  \ $Q$（$Q > 0$），外球壳用细导线可靠接地（保持电势为零 $V(R_2) = 0$），且与无穷远处同电势；\n   - 利用高斯定理与静电屏蔽性质，求外球壳内表面和外表面各自所带的感应电荷量；\n   - 分别写出区域 I（$r\
  \ < R_1$）、区域 II（$R_1 \\le r \\le R_2$）和区域 III（$r \\ge R_2$）内的电势分布函数 $V(r)$。\n"
