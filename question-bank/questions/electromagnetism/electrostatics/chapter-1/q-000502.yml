feedback:
  correct: 判断正确．横向抵消，纵向积分为 $-k\lambda\int_0^\pi\sin\theta\,\mathrm d\theta/R$．
  incorrect: 请先重新核对模型条件．横向抵消，纵向积分为 $-k\lambda\int_0^\pi\sin\theta\,\mathrm d\theta/R$．
  choices:
    A: 半圆不具备完整圆周的方向抵消．
