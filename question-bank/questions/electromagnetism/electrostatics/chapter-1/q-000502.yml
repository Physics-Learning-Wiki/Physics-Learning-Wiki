stem: 均匀带电半圆弧半径 $R$，位于上半平面，总电荷 $Q>0$，圆心电场为？
solution: 横向抵消，纵向积分为 $-k\lambda\int_0^\pi\sin\theta\,\mathrm d\theta/R$．
