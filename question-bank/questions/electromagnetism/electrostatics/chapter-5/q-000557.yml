stem: '**介质球的自洽场**


  半径 R、常数正介电系数 ε 的线性球处于真空均匀外场 E0 e_z．用内外调和势及无自由界面电荷条件求场和总偶极矩，再用退极化关系独立验证．'
solution: '1. 设内势 $-Ar\cos\theta$，外势 $-E_0r\cos\theta+B\cos\theta/r^2$．势连续得 $A=E_0-B/R^3$，D 法向连续得 $\varepsilon A=\varepsilon_0(E_0+2B/R^3)$．

  2. 解得 $A=3\varepsilon_0E_0/(\varepsilon+2\varepsilon_0)$，$B=(\varepsilon-\varepsilon_0)E_0R^3/(\varepsilon+2\varepsilon_0)$，总偶极矩为
  $4\pi\varepsilon_0B\boldsymbol e_z$．

  3. 另用 $\boldsymbol E=\boldsymbol E_0-\boldsymbol P/(3\varepsilon_0)$ 与 $\boldsymbol P=(\varepsilon-\varepsilon_0)\boldsymbol
  E$ 得同一内场．

  4. ε=ε₀ 时无扰动，ε/ε₀ 趋大时内场趋零．评分含全边界、总场响应及至少两个极限检验．'
