stem: '一种磁性微机器人研究使用三对亥姆霍兹线圈控制磁场，并报告在 40 mT 旋转场下的导航演示。 [研究来源](https://www.nature.com/articles/s41467-025-65459-8)


  取其中一对线圈的静态快照。两同轴圆线圈半径 R，相距 R，每个有 N 匝，通过相同方向的电流 I。采用**示例线圈参数** $R=5.0\,\mathrm{cm}$、$N=200$；目标中心场取论文的幅值 $B=40\,\mathrm{mT}$。空气中
  $\mu_0=4\pi\times10^{-7}\,\mathrm{T\,m/A}$。


  单个 N 匝圆线圈在轴上距其中心 z 处的场为

  $B_{\mathrm{one}}(z)=\mu_0NI R^2/[2(R^2+z^2)^{3/2}]$。

  忽略线圈截面。求 I，**以 A 为单位输入数值及单位**，保留两位小数。


  ![教学模型示意：两圆线圈共用 z 轴，各 N 匝、半径 R；中心距 s=R，电流绕向相同。原点 O 位于两线圈中间。](asset:helmholtz-pair)


  图为原创教学示意，非按比例绘制。两圆线圈共用 z 轴，各 N 匝、半径 R；中心距 s=R，电流绕向相同。原点 O 位于两线圈中间。'
solution: '中点距离每个线圈均为 R/2，两场同向叠加，因此


  $$

  B=2B_{\mathrm{one}}(R/2)

  =\left(\frac45\right)^{3/2}\frac{\mu_0NI}{R}.

  $$


  解得

  $I=BR/[(4/5)^{3/2}\mu_0N]\simeq11.12\,\mathrm A$。


  检查：电流随目标场和半径增大，随匝数增加而减小；单位为 A。这个较大的示例电流提示几何与线圈设计会影响实际发热，但本题没有用它估计原实验电流。


  适用范围：11.12 A 不是论文设备实测电流；原设备的线圈尺寸和热设计未被复现。


  来源定位：Soft magnetic microrobots with remote sensing and communication capabilities，Results, navigation paragraph following
  Fig. 3; Methods, Magnetic navigation。DOI: [10.1038/s41467-025-65459-8](https://doi.org/10.1038/s41467-025-65459-8)。'
hints:
- 先找中点相对每个线圈的轴向距离，再把两场相加。
- 两线圈中心距为 R，不代表观察点距每个线圈也是 R。
