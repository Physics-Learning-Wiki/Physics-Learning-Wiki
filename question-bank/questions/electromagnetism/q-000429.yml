reference_answer: 应得到 $\tau_\theta=-B^2(\alpha_\parallel-\alpha_\perp)\sin2\theta/2$；θ=0、π 为最低能稳定轴向，θ=π/2 为最高能不稳定取向。必须解释诱导轴的
  θ→θ+π 等价性，不能套用永久磁矩的单一极性。
