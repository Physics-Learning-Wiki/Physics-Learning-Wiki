reference_answer: 由两段磁通积分得内区 \(E_\varphi=B_0\omega(r/2-r^3/(4a^2))\sin\omega t\)，外区 \(E_\varphi=B_0\omega a^2\sin\omega t/(4r)\)。两段在
  \(a\) 连续；内区幅值导数在 \(a\sqrt{2/3}\) 变号，外区递减，故全局最大幅值为 \(B_0\omega a\sqrt{2/3}/3\)。
