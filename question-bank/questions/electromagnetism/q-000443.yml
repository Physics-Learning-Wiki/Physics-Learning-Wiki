  incorrect: 请检查：先使用 \(\tan x\simeq x\)，再把 \(\eta_0k_0\) 化成 \(\omega\mu_0\)。
  choices:
    A: “\(j\omega\varepsilon_0d\)”具有电容型频率依赖，不能由给定短路导纳的薄层展开得到。
    B: “正虚部的倒频率导纳”与正电感在 \(e^{j\omega t}\) 约定下的符号不符。
    C: “\(-j\omega\mu_0d\)”把阻抗量级当成导纳，单位也是 \(\Omega\) 而非 S。
    D: “\(-j/(\omega\mu_0d)\)，\(L_{\rm s}=\mu_0d\)”正确，满足展开、符号和量纲。
