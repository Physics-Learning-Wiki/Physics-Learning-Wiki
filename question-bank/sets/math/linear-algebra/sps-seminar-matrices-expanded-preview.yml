description: 与《SPS线性代数研讨班第一、二讲》2026-10-23 更新稿对齐。§2.2、§2.4、§2.5：矩阵的列、加法与数乘、乘积尺寸、行乘列、复合顺序、可逆变换与转置。每次从 36 道候选题中随机抽取
  8 道，单次不重复；此预览包含待人工审核的新题。不同次练习可能遇到相同题目。每次含 3 道短计算题。每题均有提示和解析。补充逆剪切、逆复合、逆旋转及两组基之间的坐标记录。 新增逆矩阵的输入输出基、转置与伴随的测量解释，以及逆复合的短计算。
