title: 中山大学高等数学一（II）期末 A 卷（2023–2024 学年第 2 学期）
description: 中山大学 2023–2024 学年第 2 学期《高等数学一（II）》期末考试 A 卷整卷练习，包含正弦围成平面区域二重积分、球体对称性三重积分、周期二次函数傅里叶级数展开及其间断点和函数、圆锥面第二类曲面积分与高斯公式、格林公式路径无关曲线积分简化计算、直线段第一类曲线积分、一阶线性常微分方程分离变量、二阶常系数非齐次线性微分方程待定系数通解、交错级数莱布尼茨与绝对敛散性、幂级数收敛域与和函数求导积分、含参反常积分一致收敛狄利克雷判别法与狄利克雷积分应用、瑕积分两端点敛散性判别及单调有界数列级数裂项放缩收敛性证明等
  13 道大题．
