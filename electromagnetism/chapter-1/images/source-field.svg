<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">源点、场点与库仑力</title><desc id="desc">从源点 r′ 指向场点 r 的距离矢量 R = r − r′．</desc>
<rect width="720" height="380" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#172033">
<text x="24" y="30" fill="#172033" font-size="17">源点、场点与库仑力</text>
<circle cx="160" cy="230" r="15" fill="#fff1f2" stroke="#ba2636" stroke-width="2"/>
<text x="150" y="236" fill="#172033" font-size="14">+q</text>
<circle cx="550" cy="140" r="6" fill="#155da0" stroke="#155da0" stroke-width="2"/>
<text x="540" y="110" fill="#172033" font-size="17">场点 r</text>
<path d="M165 225 L535 145" fill="none" stroke="#155da0" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300" y="160" fill="#172033" font-size="17">R = r − r′</text>
<path d="M65 310 L150 240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M65 310 L540 145" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="80" y="330" fill="#172033" font-size="17">O</text>
<text x="110" y="210" fill="#172033" font-size="17">源点 r′</text>
<text x="24" y="365" fill="#475569" font-size="13">PLW 原创 · 示意图非比例；曲线按正文公式采样</text>
</g></svg>
