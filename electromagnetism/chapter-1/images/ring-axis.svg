<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#172033">
<text x="24" y="30" fill="#172033" font-size="17">圆环轴线上的投影与环形微元</text>
<circle cx="230" cy="190" r="85" fill="none" stroke="#155da0" stroke-width="2"/>
<circle cx="230" cy="105" r="15" fill="#e4f2ff" stroke="#155da0" stroke-width="2"/>
