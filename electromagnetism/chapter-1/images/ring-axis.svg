<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">圆环轴线上的投影与环形微元</title><desc id="desc">圆环横向场抵消，轴向投影因子为 z/sqrt(a²+z²)；圆盘由同心环组成．</desc>
