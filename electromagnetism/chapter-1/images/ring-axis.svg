<path d="M230 105 L535 190" fill="none" stroke="#155da0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M230 190 L230 105" fill="none" stroke="#ba2636" stroke-width="2"/>
<text x="250" y="145" fill="#172033" font-size="17">a</text>
<text x="365" y="220" fill="#172033" font-size="17">z</text>
<text x="370" y="135" fill="#172033" font-size="17">R</text>
