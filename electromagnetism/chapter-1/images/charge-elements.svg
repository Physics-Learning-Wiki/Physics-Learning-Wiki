<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">连续体积分的尺度与微元</title><desc id="desc">线、面和体微元分别以长度、面积和体积权重计入电荷．</desc>
<rect width="720" height="380" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#172033">
<text x="24" y="30" fill="#172033" font-size="17">连续体积分的尺度与微元</text>
<path d="M65 150 L240 150" fill="none" stroke="#155da0" stroke-width="2"/>
<path d="M120 150 L150 150" fill="none" stroke="#ba2636" stroke-width="2"/>
<text x="70" y="205" fill="#172033" font-size="17">dq = λ dl</text>
<rect x="285" y="100" width="130" height="100" fill="#e5edf5" stroke="#475569" stroke-width="2"/>
<rect x="330" y="130" width="25" height="25" fill="#ffe4e6" stroke="#ba2636" stroke-width="2"/>
<text x="280" y="235" fill="#172033" font-size="17">dq = σ dS</text>
<rect x="495" y="90" width="130" height="140" fill="#e5edf5" stroke="#475569" stroke-width="2"/>
<rect x="535" y="135" width="35" height="35" fill="#ffe4e6" stroke="#ba2636" stroke-width="2"/>
<text x="490" y="265" fill="#172033" font-size="17">dq = ρ dV</text>
<text x="24" y="365" fill="#475569" font-size="13">PLW 原创 · 示意图非比例；曲线按正文公式采样</text>
