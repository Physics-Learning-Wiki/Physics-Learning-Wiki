<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">介质界面的法向与切向条件</title><desc id="desc">n 从介质1指向介质2；小柱给 Dn 跃变，小回路给 Et 连续．</desc>
<rect width="720" height="380" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#172033">
<text x="24" y="30" fill="#172033" font-size="17">介质界面的法向与切向条件</text>
<rect x="60" y="80" width="600" height="120" fill="#edf6ff" stroke="#475569" stroke-width="2"/>
<rect x="60" y="200" width="600" height="120" fill="#fff3e6" stroke="#475569" stroke-width="2"/>
<text x="90" y="125" fill="#172033" font-size="17">介质 2</text>
<text x="90" y="280" fill="#172033" font-size="17">介质 1</text>
<path d="M330 250 L330 125" fill="none" stroke="#ba2636" stroke-width="2" marker-end="url(#arrow)"/>
<text x="345" y="150" fill="#172033" font-size="17">n</text>
<rect x="440" y="160" width="80" height="80" fill="none" stroke="#155da0" stroke-width="2"/>
<text x="460" y="110" fill="#172033" font-size="17">D₂n − D₁n = σf</text>
<text x="415" y="295" fill="#172033" font-size="17">E₂t = E₁t</text>
<text x="24" y="365" fill="#475569" font-size="13">PLW 原创 · 示意图非比例；曲线按正文公式采样</text>
</g></svg>
