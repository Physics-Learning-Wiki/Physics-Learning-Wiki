<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">束缚电荷与法向</title><desc id="desc">均匀 P 沿右方，左右两面分别出现负、正束缚电荷；上下表面 P·n=0．</desc>
<rect width="720" height="380" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#172033">
<text x="24" y="30" fill="#172033" font-size="17">束缚电荷与法向</text>
<rect x="200" y="85" width="300" height="230" fill="#f1f6fb" stroke="#475569" stroke-width="2"/>
<text x="205" y="125" fill="#155da0" font-size="17">−</text>
<text x="475" y="125" fill="#ba2636" font-size="17">+</text>
<text x="205" y="185" fill="#155da0" font-size="17">−</text>
<text x="475" y="185" fill="#ba2636" font-size="17">+</text>
<text x="205" y="245" fill="#155da0" font-size="17">−</text>
<text x="475" y="245" fill="#ba2636" font-size="17">+</text>
<path d="M285 195 L425 195" fill="none" stroke="#155da0" stroke-width="2" marker-end="url(#arrow)"/>
<text x="345" y="175" fill="#172033" font-size="17">P</text>
<path d="M500 150 L590 150" fill="none" stroke="#ba2636" stroke-width="2" marker-end="url(#arrow)"/>
<text x="550" y="130" fill="#172033" font-size="17">n</text>
<text x="245" y="335" fill="#172033" font-size="17">σb = P·n；ρb = −∇·P</text>
<text x="24" y="365" fill="#475569" font-size="13">PLW 原创 · 示意图非比例；曲线按正文公式采样</text>
</g></svg>
