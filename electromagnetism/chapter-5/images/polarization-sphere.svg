<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">均匀极化球的退极化场</title><desc id="desc">球内均匀附加场 E′=−P/(3ε₀)，与 P 相反；球外为总偶极矩的场．</desc>
<rect width="720" height="380" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#172033">
<text x="24" y="30" fill="#172033" font-size="17">均匀极化球的退极化场</text>
<circle cx="345" cy="195" r="120" fill="#f1f6fb" stroke="#155da0" stroke-width="2"/>
<path d="M280 165 L415 165" fill="none" stroke="#155da0" stroke-width="2" marker-end="url(#arrow)"/>
<text x="335" y="145" fill="#172033" font-size="17">P</text>
<path d="M415 235 L280 235" fill="none" stroke="#ba2636" stroke-width="2" marker-end="url(#arrow)"/>
<text x="335" y="270" fill="#172033" font-size="17">E′</text>
<text x="195" y="70" fill="#172033" font-size="17">左侧束缚负电荷，右侧束缚正电荷</text>
<text x="24" y="365" fill="#475569" font-size="13">PLW 原创 · 示意图非比例；曲线按正文公式采样</text>
</g></svg>
