<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">接地平面的镜像构造</title><desc id="desc">实线右侧为物理求解区域；左侧虚设电荷只用于构造右半空间解．</desc>
