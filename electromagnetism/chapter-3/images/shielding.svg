<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">导体空腔、材料与外部空间</title><desc id="desc">灰色为金属，白色为含电荷的空腔；金属内 E=0 不代表空腔场为零．</desc>
<rect width="720" height="380" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#172033">
<text x="24" y="30" fill="#172033" font-size="17">导体空腔、材料与外部空间</text>
<circle cx="330" cy="195" r="130" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
<circle cx="305" cy="180" r="75" fill="white" stroke="#475569" stroke-width="2"/>
<circle cx="285" cy="175" r="15" fill="#fff1f2" stroke="#ba2636" stroke-width="2"/>
<text x="275" y="181" fill="#172033" font-size="14">+q</text>
<text x="270" y="105" fill="#172033" font-size="17">内面总电荷 −q</text>
<text x="450" y="190" fill="#172033" font-size="17">外面 Qc + q</text>
<text x="335" y="285" fill="#172033" font-size="17">材料内 E = 0</text>
<path d="M450 285 L575 285" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="550" y="315" fill="#172033" font-size="17">接地可交换电荷</text>
<text x="24" y="365" fill="#475569" font-size="13">PLW 原创 · 示意图非比例；曲线按正文公式采样</text>
</g></svg>
