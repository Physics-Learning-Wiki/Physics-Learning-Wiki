<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">导体表面的小柱与小回路</title><desc id="desc">静电平衡材料内场为零；小柱给法向跃变，小回路给切向连续．</desc>
<rect width="720" height="380" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#172033">
<text x="24" y="30" fill="#172033" font-size="17">导体表面的小柱与小回路</text>
<rect x="60" y="200" width="600" height="110" fill="#e5edf5" stroke="#475569" stroke-width="2"/>
<rect x="295" y="145" width="80" height="115" fill="none" stroke="#ba2636" stroke-width="2"/>
<path d="M130 200 L130 95" fill="none" stroke="#155da0" stroke-width="2" marker-end="url(#arrow)"/>
<text x="126" y="225" fill="#172033" font-size="17">+</text>
<path d="M230 200 L230 95" fill="none" stroke="#155da0" stroke-width="2" marker-end="url(#arrow)"/>
<text x="226" y="225" fill="#172033" font-size="17">+</text>
<path d="M430 200 L430 95" fill="none" stroke="#155da0" stroke-width="2" marker-end="url(#arrow)"/>
<text x="426" y="225" fill="#172033" font-size="17">+</text>
<path d="M530 200 L530 95" fill="none" stroke="#155da0" stroke-width="2" marker-end="url(#arrow)"/>
<text x="526" y="225" fill="#172033" font-size="17">+</text>
<text x="80" y="285" fill="#172033" font-size="17">金属：E = 0</text>
<text x="400" y="170" fill="#172033" font-size="17">外侧：En = σ/ε₀</text>
<text x="24" y="365" fill="#475569" font-size="13">PLW 原创 · 示意图非比例；曲线按正文公式采样</text>
</g></svg>
