<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">逐个组装点电荷</title><desc id="desc">先放第一颗不需相互作用功；后放入的电荷只计已有电荷的势，电荷对仅计一次．</desc>
<rect width="720" height="380" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#172033">
<text x="24" y="30" fill="#172033" font-size="17">逐个组装点电荷</text>
<circle cx="180" cy="245" r="15" fill="#e4f2ff" stroke="#155da0" stroke-width="2"/>
<text x="170" y="251" fill="#172033" font-size="14">q₁</text>
<circle cx="380" cy="100" r="15" fill="#e4f2ff" stroke="#155da0" stroke-width="2"/>
<text x="370" y="106" fill="#172033" font-size="14">q₂</text>
<circle cx="560" cy="245" r="15" fill="#e4f2ff" stroke="#155da0" stroke-width="2"/>
<text x="550" y="251" fill="#172033" font-size="14">q₃</text>
<path d="M180 245 L380 100" fill="none" stroke="#155da0" stroke-width="2"/>
<path d="M380 100 L560 245" fill="none" stroke="#155da0" stroke-width="2"/>
<path d="M180 245 L560 245" fill="none" stroke="#155da0" stroke-width="2"/>
<text x="245" y="310" fill="#172033" font-size="17">W = Σ(i &lt; j) k qi qj / rij</text>
<text x="24" y="365" fill="#475569" font-size="13">PLW 原创 · 示意图非比例；曲线按正文公式采样</text>
</g></svg>
