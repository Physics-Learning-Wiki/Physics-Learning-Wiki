<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">固定电压时的能量收支</title><desc id="desc">电容增加 dC&gt;0，电源输入 U²dC，一半增加场能，一半输出机械功．</desc>
<rect width="720" height="380" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#172033">
<text x="24" y="30" fill="#172033" font-size="17">固定电压时的能量收支</text>
<rect x="40" y="145" width="165" height="90" fill="#e5edf5" stroke="#475569" stroke-width="2"/>
<text x="65" y="180" fill="#172033" font-size="17">电源输入</text>
<text x="65" y="210" fill="#172033" font-size="17">U² dC</text>
<path d="M205 170 L440 100" fill="none" stroke="#155da0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M205 210 L440 270" fill="none" stroke="#ba2636" stroke-width="2" marker-end="url(#arrow)"/>
<text x="455" y="100" fill="#172033" font-size="17">场能增加 ½ U² dC</text>
<text x="455" y="280" fill="#172033" font-size="17">机械输出 ½ U² dC</text>
<text x="80" y="320" fill="#172033" font-size="17">固定 Q：没有电源输入，机械输出来自场能减少</text>
<text x="24" y="365" fill="#475569" font-size="13">PLW 原创 · 示意图非比例；曲线按正文公式采样</text>
</g></svg>
