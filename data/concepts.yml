version: 1

concepts:
  measurement-error:
    name: 测量误差
    english: Measurement error
    summary: 测得量值减去参考量值，有符号；参考真值未知时，不能直接知道相对于真值的误差．
    target: experiment/error-analysis/measurement-basics.md#误差偏差和残差各指什么
  measurement-uncertainty:
    name: 测量不确定度
    english: Measurement uncertainty
    summary: 根据所用信息表征赋予被测量的量值分散性的非负参数，不等同于已知误差．
    target: experiment/error-analysis/measurement-basics.md#不确定度不是已知误差
  standard-uncertainty:
    name: 标准不确定度
    english: Standard uncertainty
    summary: 以标准差形式表达的测量不确定度，可通过观测序列的统计分析或其他可靠信息评定．
    target: experiment/error-analysis/uncertainty-evaluation.md#标准不确定度与两种评定方法
  uncertainty-propagation:
    name: 不确定度传播
    english: Propagation of uncertainty
    summary: 按测量模型将输入量的不确定度与相关性传到输出量；一阶传播依赖局部线性近似．
    target: experiment/error-analysis/uncertainty-propagation.md#从局部变化推导传播式
  least-squares:
    name: 最小二乘法
    english: Least squares
    summary: 通过最小化观测残差的平方和或加权平方和估计模型参数，结果解释依赖测量与模型假设．
    target: experiment/error-analysis/least-squares.md#从残差平方和出发
  derivative:
    name: 导数
    english: Derivative
    summary: 函数增量与自变量增量之比的极限，存在时描述局部变化率。
    target: math/calculus/derivative.md
  differential-equation:
    name: 微分方程
    english: Differential equation
    summary: 将未知函数及其导数联系起来的方程。
    target: math/differential-equations/ode-intro.md
  momentum:
    name: 动量
    english: Momentum
    summary: 牛顿力学中，质点动量是质量与速度的乘积，是矢量；相对论表达式不同。
    target: mechanics/dynamics/momentum-energy.md
  inertial-frame:
    name: 惯性参考系
    aliases:
      - 惯性系
    english: Inertial frame
    summary: 自由质点保持静止或匀速直线运动的参考系。
    target: mechanics/kinematics/reference-frames.md
  constraint:
    name: 约束
    english: Constraint
    summary: 力学模型对位置或速度施加的运动学限制，需区分约束关系与实现它的约束力。
    target: mechanics/analytical/constraints-generalized-coordinates.md#约束限制了什么
  configuration-space:
    name: 位形空间
    english: Configuration space
    summary: 系统所有容许几何位置与姿态构成的空间，不包含速度；其局部维数给出位形自由度。
    target: mechanics/analytical/constraints-generalized-coordinates.md#位形空间与广义坐标
  generalized-coordinate:
    name: 广义坐标
    english: Generalized coordinate
    summary: 在某个区域内标记系统位形的参数；独立坐标可使完整约束自动满足，但非完整速度限制仍须处理。
    target: mechanics/analytical/constraints-generalized-coordinates.md#位形空间与广义坐标
  virtual-displacement:
    name: 虚位移
    english: Virtual displacement
    summary: 固定时刻满足该时刻约束的假想无穷小位形变化，不必沿真实运动方向。
    target: mechanics/analytical/virtual-work.md#冻结时间后哪些位置变化仍被允许
  ideal-constraint:
    name: 理想约束
    english: Ideal constraint
    summary: 对所有容许虚位移，总约束力虚功为零的约束；不表示约束力的实际功率永远为零。
    target: mechanics/analytical/virtual-work.md#理想约束为什么能消去反力
  generalized-force:
    name: 广义力
    english: Generalized force
    summary: 主动力虚功中与某个广义坐标变化配对的系数，其单位取决于该坐标的单位。
    target: mechanics/analytical/dalembert-principle.md#广义力每个坐标变化对应的虚功系数
  lagrangian:
    name: 拉格朗日量
    english: Lagrangian
    aliases:
      - 拉格朗日函数
      - 拉氏量
    summary: 在本入门模型中由动能减去位置势能构成的函数；完整理想约束下可用它在独立坐标中建立运动方程。
    target: mechanics/analytical/lagrangian.md#把位置势能并入拉格朗日量
  rayleigh-dissipation:
    name: 瑞利耗散函数
    english: Rayleigh dissipation function
    summary: 本入门模型中表示线性黏滞阻力的速度二次函数，其速度偏导给出反号的阻力广义力；静止介质中两倍函数值为损失功率。
    target: mechanics/analytical/nonconservative-forces.md#瑞利耗散函数从哪里来
  metrological-traceability:
    name: 计量溯源性
    english: Metrological traceability
    summary: 测量结果经有文件记录、每环贡献不确定度的不间断校准链联系到参考的性质．
    target: experiment/error-analysis/metrology.md
  weighted-mean:
    name: 加权平均
    english: Weighted mean
    summary: 按相容信息为观测赋权的平均；独立已知方差下最小方差线性无偏组合使用逆方差权．
    target: experiment/error-analysis/weighted-measurements.md
  outlier-test:
    name: 异常值检验
    english: Outlier test
    summary: 在明确总体、候选选择及显著性水平下评估可疑观测的统计方法，不直接证明物理失效．
    target: experiment/error-analysis/outlier-tests.md
  uncertainty-allocation:
    name: 不确定度分配
    english: Uncertainty allocation
    summary: 从输出目标与灵敏系数反推输入要求，并结合相关性、可实现性与成本调整预算．
    target: experiment/error-analysis/error-allocation.md
  linear-parameter-estimation:
    name: 线性参数估计
    english: Linear parameter estimation
    summary: 用满列秩设计矩阵组织多观测、多参数模型，并求参数及其协方差．
    target: experiment/error-analysis/linear-parameters.md
  nonlinear-fitting:
    name: 非线性拟合
    english: Nonlinear fitting
    summary: 从初值出发以局部雅可比和迭代估计非线性模型参数，需要收敛与可辨识性检查．
    target: experiment/error-analysis/nonlinear-fitting.md
  combined-measurement:
    name: 组合测量
    english: Combined measurement
    summary: 独立观测若干参数组合，由观测方程共同估计各分量及其相关性．
    target: experiment/error-analysis/combined-measurements.md
  sampling-distribution:
    name: 抽样分布
    english: Sampling distribution
    summary: 统计量在重复抽样中的分布，用于说明自由度、区间与检验条件．
    target: math/probability-statistics/sample-and-sampling-distribution.md
  maximum-likelihood:
    name: 最大似然估计
    english: Maximum likelihood estimation
    summary: 将观测固定后选择使其似然最大的参数；似然不是参数的概率密度．
    target: math/probability-statistics/parameter-estimation.md
  hypothesis-test:
    name: 假设检验
    english: Hypothesis test
    summary: 在指定模型与显著性水平下，用样本证据检验原假设而不将不拒绝当作证明．
    target: math/probability-statistics/hypothesis-testing.md
  central-limit-theorem:
    name: 中心极限定理
    english: Central limit theorem
    summary: 在独立同分布、有限非零方差等条件下，标准化均值的分布渐近正态．
    target: math/probability-statistics/law-of-large-numbers-and-central-limit-theorem.md
  electric-charge:
    name: 电荷
    english: Electric charge
    summary: 电磁相互作用中带正负号的源量，孤立系统总电荷守恒．
    target: electromagnetism/chapter-1/charge-coulomb.md
  coulombs-law:
    name: 库仑定律
    english: Coulomb’s law
    summary: 真空中静止点电荷间作用力沿连线、与电荷乘积成正比并按距离平方反比变化．
    target: electromagnetism/chapter-1/charge-coulomb.md
  electric-field:
    name: 电场
    english: Electric field
    summary: 用理想静止试验电荷的受力与电荷量之比描述的矢量场，须区分源场与探针受力．
    target: electromagnetism/chapter-1/electric-field.md
  electric-flux:
    name: 电通量
    english: Electric flux
    summary: 电场通过定向曲面的面积分；闭合面通常取外法向，净通量不等于局部场强．
    target: electromagnetism/chapter-1/gauss-law.md
  gauss-law:
    name: 高斯定理
    english: Gauss’s law
    summary: 真空闭合面总电通量等于包围净电荷除以真空介电系数，直接求局部场还需对称性等信息．
    target: electromagnetism/chapter-1/gauss-law.md
  electric-potential:
    name: 电势
    english: Electric potential
    summary: 静电场的标量势，差值的负值给单位电荷场力功；整体零点可以平移．
    target: electromagnetism/chapter-2/potential-reference.md
  electric-dipole:
    name: 电偶极子
    english: Electric dipole
    summary: 由相邻等量异号电荷构成的模型，偶极矩从负端指向正端，远场领先项与偶极矩有关．
    target: electromagnetism/chapter-2/dipole.md
  electric-quadrupole:
    name: 电四极矩
    english: Electric quadrupole moment
    summary: 描述电荷分布二阶形状信息的矩，总电荷和偶极矩为零时可主导远场．
    target: electromagnetism/chapter-2/multipoles.md
  poisson-equation:
    name: 泊松方程
    english: Poisson equation
    summary: 把电势的拉普拉斯与源电荷联系起来的局域方程，确定解还需要边界或远处条件．
    target: electromagnetism/chapter-2/field-equations.md
  electrostatic-equilibrium:
    name: 静电平衡
    english: Electrostatic equilibrium
    summary: 理想宏观导体内自由电荷不再发生定向迁移的状态，材料内部电场为零且连通导体等势．
    target: electromagnetism/chapter-3/equilibrium.md
  electrostatic-uniqueness:
    name: 静电边值问题唯一性
    english: Electrostatic uniqueness theorem
    summary: 给定区域、源和相容边界及远处条件后，若静电解存在则其场唯一；势可能保留共同常数自由度．
    target: electromagnetism/chapter-3/uniqueness.md
  image-charge-method:
    name: 镜像法
    english: Method of images
    summary: 用求解区域外的虚设电荷构造具有相同内部源与边界数据的解，再由唯一性确认物理场．
    target: electromagnetism/chapter-3/image-plane.md
  capacitance:
    name: 电容
    english: Capacitance
    summary: 固定几何线性两导体体系中，等量异号电荷大小与两端电势差的比例系数．
    target: electromagnetism/chapter-4/capacitance.md
  electrostatic-energy:
    name: 静电能
    english: Electrostatic energy
    summary: 准静态组装电荷分布所需的功，计算须说明系统边界、自能处理及电源约束．
    target: electromagnetism/chapter-4/assembly-energy.md
  polarization:
    name: 极化强度
    english: Polarization
    summary: 宏观平均后单位体积的电偶极矩矢量和，描述材料中正负电荷相对位移或取向响应．
    target: electromagnetism/chapter-5/polarization.md
  bound-charge:
    name: 束缚电荷
    english: Bound charge
    summary: 由极化的散度和边界法向分量表征的宏观等效电荷，同样参与总电场的产生．
    target: electromagnetism/chapter-5/bound-charge.md
  electric-displacement:
    name: 电位移
    english: Electric displacement
    summary: 由真空介电系数乘电场加极化定义的辅助场，散度由自由电荷决定，求解仍需本构与边界．
    target: electromagnetism/chapter-5/displacement.md
  gradient:
    name: 梯度
    english: Gradient
    summary: 标量场的局部最大增长方向及相应方向变化率构成的矢量，电场是静电势的负梯度．
    target: electromagnetism/chapter-2/potential-gradient.md
