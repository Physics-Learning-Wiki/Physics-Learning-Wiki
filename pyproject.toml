[project]
name = "physics-learning-wiki"
version = "1.0.0"
description = "Physics Learning Wiki"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mkdocs==1.5.3",
    "pymdown-extensions==10.21.2",
    "pygments",
    "beautifulsoup4",
    "requests",
    "markdown==3.9",
    "python-markdown-document-offsets-injection-extension==0.5.16",
    "mkdocs-toggle-sidebar-plugin==0.0.8",
    "PyYAML>=6,<7",
    "jsonschema>=4,<5",
    "bleach>=6,<7",
    "python-frontmatter>=1,<2"
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv.pip]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://pypi.tuna.tsinghua.edu.cn/simple"]
