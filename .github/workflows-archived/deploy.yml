# Archived on 2026-03-07.
# The active production deployment pipeline is .github/workflows/build.yml.

name: Deploy to GitHub Pages (Archived)

on:
# Mannul
  workflow_dispatch:
# Auto
  #push:
    #branches: [ main ]
  #pull_request:
    #branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --index-url https://pypi.tuna.tsinghua.edu.cn/simple/

    - name: Install theme
      run: |
        chmod +x ./scripts/pre-build/install-theme.sh
        chmod +x ./scripts/pre-build/install-theme-vendor.sh
        ./scripts/pre-build/install-theme.sh

    - name: Build with MkDocs
      run: uv run mkdocs build

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4