name: Import Question Submission
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Question submission Issue number'
        required: true
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: question-submission-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
jobs:
  import:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.label.name == '题库-接受整理' && (contains(github.event.issue.labels.*.name, '投稿-题目') || contains(github.event.issue.labels.*.name, '投稿-题集'))) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && (contains(github.event.issue.labels.*.name, '投稿-题目') || contains(github.event.issue.labels.*.name, '投稿-题集')) && contains(github.event.comment.body, 'plw-submission-v1'))
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --frozen
      - run: uv run python -m scripts.submissions.questions
