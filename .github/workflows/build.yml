name: Build

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Physics-Learning-Wiki Page Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          check-latest: true
      - name: Install Python dependencies
        run: uv sync
      - name: Install Node.js dependencies
        run: corepack yarn --frozen-lockfile
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate question bank
        env:
          PLW_QUIZ_PREVIEW: ''
        run: |
          test -z "$PLW_QUIZ_PREVIEW"
          uv run python -m scripts.question_bank validate
          uv run python -m scripts.question_bank coverage
      - name: Run test matrix
        run: |
          uv run pytest tests/question_bank tests/integration tests/seo
          corepack yarn quiz:typecheck
          corepack yarn quiz:test
          corepack yarn quiz:build:check
          corepack yarn runtime:typecheck
          corepack yarn runtime:test
          corepack yarn runtime:build:check
          corepack yarn submit:test
          corepack yarn submit:check
      - name: Page Build
        env:
          PLW_QUIZ_PREVIEW: ''
        run: |
          test -z "$PLW_QUIZ_PREVIEW"
          chmod +x ./scripts/pre-build/pre-build.sh
          ./scripts/pre-build/pre-build.sh
          uv run mkdocs build -v
      - name: Build Pagefind search index
        run: corepack yarn search:index
      - name: Post-process HTML
        # https://github.com/TypeStrong/ts-node/issues/1997
        run: node --loader ts-node/esm scripts/post-build/html-postprocess.ts commits-info math external-links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=3072
      - name: Minify html
        run: |
          chmod +x ./scripts/post-build/minify-html/minify-html.sh
          ./scripts/post-build/minify-html/minify-html.sh
      - name: Generate redirects
        run: uv run python scripts/post-build/redirect/generate-redirects.py
      - name: Generate SEO sitemap
        run: uv run python scripts/post-build/seo/generate-sitemap.py --site-dir site --output site/sitemap.xml
      - name: Validate SEO output
        run: uv run python scripts/check-seo.py --site-dir site --docs-dir docs
      - name: Run browser smoke test
        run: corepack yarn e2e:smoke
      - name: Run browser search test
        run: corepack yarn e2e:search
      # - name: Check links
      #   uses: wjdp/htmltest-action@<pinned-ref>
      #   with:
      #     skip_external: true
      - name: Fetch old site
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: old-site
      # - name: Check _redirects
      #   run: uv run python scripts/post-build/redirect/check-redirects.py
      - name: Deploy to gh-pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
      - name: Push to Baidu
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository_owner == 'Physics-Learning-Wiki' }}
        env:
          SITE: physics-learning-wiki.github.io/Physics-Learning-Wiki/
          BAIDU_TOKEN: ${{ secrets.BaiduToken }}
        run: |
          chmod +x ./scripts/post-deploy/baidu-push.sh
          ./scripts/post-deploy/baidu-push.sh

