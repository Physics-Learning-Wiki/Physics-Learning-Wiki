name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Physics-Learning-Wiki Page Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Set up locked Node toolchain
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'

      - name: Install Python dependencies
        run: uv sync

      - name: Check Sharp native runtime
        run: corepack yarn media:check
      - name: Guard published submission amendments
        if: github.event_name == 'pull_request'
        env:
          SUBMISSION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run python -m scripts.submissions.amendments --base "$SUBMISSION_BASE_SHA"
      - name: Install Playwright Chromium
        run: corepack yarn playwright install --with-deps chromium
      - name: Validate question bank
        env:
          PLW_QUIZ_PREVIEW: ''
        run: |
          test -z "$PLW_QUIZ_PREVIEW"
          uv run python -m scripts.question_bank validate
          uv run python -m scripts.question_bank coverage
      - name: Run test matrix
        run: |
          uv run pytest tests/question_bank tests/integration tests/seo
          corepack yarn quiz:typecheck
          corepack yarn quiz:test
          corepack yarn quiz:build:check
          corepack yarn runtime:typecheck
          corepack yarn runtime:test
          corepack yarn runtime:build:check
          corepack yarn submit:test
          corepack yarn submission:contract:check
          corepack yarn submit:check
          corepack yarn forms:typecheck
          corepack yarn forms:test
          corepack yarn forms:build:check
          corepack yarn features:build:check
          corepack yarn features:typecheck
          corepack yarn media:test
          corepack yarn post-build:test
      - name: Build production site
        env:
          PLW_QUIZ_PREVIEW: ''
          NODE_OPTIONS: --max_old_space_size=3072
        run: |
          test -z "$PLW_QUIZ_PREVIEW"
          ./scripts/build/build-site.sh
      - name: Run browser behavior gate
        id: browser-gate
        run: corepack yarn e2e
      - name: Upload browser failure diagnostics
        if: ${{ failure() && steps.browser-gate.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Static budget audit
        run: corepack yarn perf:audit --mode blocking
      - name: Upload site artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-artifact
          path: ./site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository_owner == 'Physics-Learning-Wiki' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-artifact
          path: ./site
      - name: Fetch old site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: old-site
          persist-credentials: false
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
