name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Source tests and checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-python
        with:
          profile: project
          cache: 'true'

      - name: Set up locked Node toolchain
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'

      - name: Guard published submission amendments
        if: github.event_name == 'pull_request'
        env:
          SUBMISSION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run python -m scripts.submissions.amendments --base "$SUBMISSION_BASE_SHA"
      - name: Validate question bank
        env:
          PLW_QUIZ_PREVIEW: ''
        run: |
          test -z "$PLW_QUIZ_PREVIEW"
          uv run python -m scripts.question_bank validate --include-drafts
          uv run python -m scripts.question_bank coverage
      - name: Run test matrix
        run: |
          uv run pytest tests/question_bank tests/integration tests/seo
          corepack yarn quiz:format:check
          corepack yarn quiz:typecheck
          corepack yarn quiz:test
          corepack yarn quiz:build:check
          corepack yarn runtime:typecheck
          corepack yarn runtime:test
          corepack yarn runtime:build:check
          corepack yarn submit:test
          corepack yarn submission:contract:check
          corepack yarn submit:check
          corepack yarn forms:typecheck
          corepack yarn forms:test
          corepack yarn forms:build:check
          corepack yarn features:build:check
          corepack yarn features:typecheck
          corepack yarn media:test
          corepack yarn post-build:test

  site:
    name: Production site and browser checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-python
        with:
          profile: project
          cache: 'true'
      - name: Set up locked Node toolchain
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'
      - name: Check Sharp native runtime
        run: corepack yarn media:check
      - name: Build production site
        env:
          PLW_QUIZ_PREVIEW: ''
          NODE_OPTIONS: --max_old_space_size=3072
        run: |
          test -z "$PLW_QUIZ_PREVIEW"
          ./scripts/build/build-site.sh
      - name: Verify production site artifact
        run: uv run pytest tests/site --built-site-dir=site
      - name: Install Playwright Chromium
        run: corepack yarn playwright install --with-deps chromium
      - name: Run browser behavior gate
        id: browser-gate
        run: corepack yarn e2e
      - name: Upload browser failure diagnostics
        if: ${{ failure() && steps.browser-gate.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Upload site artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-artifact
          path: ./site
          retention-days: 1

  build:
    name: Physics-Learning-Wiki Page Build
    needs: [tests, site]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require all checks to succeed
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          SITE_RESULT: ${{ needs.site.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$SITE_RESULT" = success

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository_owner == 'Physics-Learning-Wiki' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-artifact
          path: ./site
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
