name: Complete Question Submission

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  complete:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'question-submission/issue-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const match = context.payload.pull_request.head.ref.match(/^question-submission\/issue-(\d+)$/);
            if (!match) return;
            const issue_number = Number(match[1]);
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const question = files
              .map(file => file.filename.match(/question-bank\/questions\/.+\/([^/]+)\.yml$/)?.[1])
              .find(Boolean);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `题目草稿已通过 PR #${context.payload.pull_request.number} 收录${question ? `，题目 ID：\`${question}\`` : ""}。`,
            });
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const labels = issue.data.labels
              .map(label => typeof label === "string" ? label : label.name)
              .filter(label => label && label !== "题库-已生成PR" && label !== "投稿-待审核");
            if (!labels.includes("投稿-已收录")) labels.push("投稿-已收录");
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels,
              state: "closed",
              state_reason: "completed",
            });
