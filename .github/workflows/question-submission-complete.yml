name: Complete Question Submission
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  complete:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(github.event.pull_request.body, 'plw-question-pr:') || contains(github.event.pull_request.body, 'plw-quiz-set-pr:'))
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-python
        with:
          profile: project
          cache: 'false'

      - run: uv run python -m scripts.submissions.questions
