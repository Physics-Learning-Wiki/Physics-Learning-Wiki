name: Complete Question Submission
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  complete:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, 'plw-question-pr:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -m scripts.submissions.questions
