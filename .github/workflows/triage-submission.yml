name: Triage Submission
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: submission-triage-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  triage:
    if: >-
      !github.event.issue.pull_request &&
      (contains(github.event.issue.labels.*.name, '投稿-待审核') || contains(github.event.issue.body, 'plw-submission-v1')) &&
      (github.event_name == 'issues' || contains(github.event.comment.body, 'plw-submission-v1'))
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Record a versioned editorial decision
        if: github.event.action == 'labeled'
        run: uv run python -m scripts.submissions.operations status-event
      - name: Classify new content
        if: github.event.action != 'labeled'
        run: uv run python -m scripts.submissions.operations triage
