name: Check PR Format

on:
  pull_request:
    branches:
      - main

jobs:
  check-format:
    name: Check PR Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          check-latest: true
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install dependencies
        run: yarn install
      - name: Run checker
        run: |
          yarn docs:format:check -a

  remark-lint:
    name: Check PR with remark-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          check-latest: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install clang-format-18 and ruff from pypi
        run: pip install clang-format==18.1.5 ruff==0.4.4
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install dependencies
        run: yarn install
      
      - name: Format changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t changed_files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA")
          markdown_files=()
          remark_files=()
          python_files=()
          clang_files=()
          for file in "${changed_files[@]}"; do
            [[ -f "$file" ]] || continue
            case "$file" in
              docs/*.md)
                markdown_files+=("$file")
                case "$file" in
                  docs/superpowers/*) ;;
                  */op.md|*/bit.md|*/binary-set.md) ;;
                  *) remark_files+=("$file") ;;
                esac
                ;;
              docs/*.py) python_files+=("$file") ;;
            esac
            case "$file" in
              *.c|*.cpp|*.h|*.hpp) clang_files+=("$file") ;;
            esac
          done
          if ((${#markdown_files[@]})); then
            python3 scripts/linter_patch.py --files "${markdown_files[@]}" --mode pre
          fi
          if ((${#remark_files[@]})); then
            yarn remark "${remark_files[@]}" -o
          fi
          if ((${#python_files[@]})); then
            ruff format "${python_files[@]}"
          fi
          if ((${#clang_files[@]})); then
            clang-format -i "${clang_files[@]}"
          fi
          if ((${#markdown_files[@]})); then
            python3 scripts/linter_patch.py --files "${markdown_files[@]}" --mode post
          fi
      
      - name: Generate patch
        run: |
          mkdir -p .debug
          git diff > .debug/changed.patch
      - name: Upload patch to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: changes by bot
          path: .debug/changed.patch
      - name: Check for changes
        run: |
          git diff --exit-code
