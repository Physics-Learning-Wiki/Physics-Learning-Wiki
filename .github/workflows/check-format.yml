name: Check PR Format

on:
  pull_request:
    branches:
      - main

jobs:
  check-format:
    name: Check PR Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up locked Node toolchain
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'

      - name: Run checker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Include both paths of a rename so the checker sees the surviving file.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: diff.renames
          GIT_CONFIG_VALUE_0: 'false'
        run: |
          set -euo pipefail
          # Reuse staged-files mode to compare the PR base with the checked-out
          # merge result. A temporary index leaves the checkout's real index intact.
          checker_index="$(mktemp)"
          trap 'rm -f "$checker_index"' EXIT
          export GIT_INDEX_FILE="$checker_index"
          git read-tree "$BASE_SHA"
          corepack yarn docs:format:check

  remark-lint:
    name: Check PR with remark-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up locked Node toolchain
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'

      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-python
        with:
          profile: format
          cache: 'true'

      - name: Format changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t changed_files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA")
          markdown_files=()
          remark_files=()
          python_files=()
          clang_files=()
          for file in "${changed_files[@]}"; do
            [[ -f "$file" ]] || continue
            case "$file" in
              docs/*.md)
                markdown_files+=("$file")
                case "$file" in
                  docs/superpowers/*) ;;
                  */op.md|*/bit.md|*/binary-set.md) ;;
                  *) remark_files+=("$file") ;;
                esac
                ;;
              docs/*.py) python_files+=("$file") ;;
            esac
            case "$file" in
              *.c|*.cpp|*.h|*.hpp) clang_files+=("$file") ;;
            esac
          done
          if ((${#markdown_files[@]})); then
            uv run --only-group format python scripts/linter_patch.py --files "${markdown_files[@]}" --mode pre
          fi
          if ((${#remark_files[@]})); then
            corepack yarn remark "${remark_files[@]}" -o
          fi
          if ((${#python_files[@]})); then
            uv run --only-group format ruff format "${python_files[@]}"
          fi
          if ((${#clang_files[@]})); then
            uv run --only-group format clang-format -i "${clang_files[@]}"
          fi
          if ((${#markdown_files[@]})); then
            uv run --only-group format python scripts/linter_patch.py --files "${markdown_files[@]}" --mode post
          fi
      
      - name: Generate patch
        run: |
          mkdir -p .debug
          git diff > .debug/changed.patch
      - name: Upload patch to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: changes by bot
          path: .debug/changed.patch
      - name: Check for changes
        run: |
          git diff --exit-code
