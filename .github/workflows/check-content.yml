# .github/workflows/check-content.yml
name: Check Content Format

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "scripts/check-format.py"
      - "tests/test_check_format.py"
      - ".github/workflows/check-content.yml"
  workflow_dispatch:

jobs:
  check-format:
    name: Check Markdown & LaTeX Format
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-python
        with:
          profile: project
          cache: 'false'

      - name: Run format checker regression tests
        run: uv run pytest tests/test_check_format.py
      - name: Run format checker
        run: uv run python scripts/check-format.py docs
      - name: Post results as PR comment
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require("child_process");
            let output;
            try {
              output = execSync("uv run python scripts/check-format.py docs", {
                encoding: "utf-8",
              });
            } catch (e) {
              output = e.stdout || e.message || "";
            }
            const truncated = output.length > 60000
              ? output.slice(0, 60000) + "\n\n... (输出过长已截断)"
              : output;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 格式检查结果\n\n\`\`\`\n${truncated}\n\`\`\`\n\n请根据以上建议修改后重新提交。格式相关问题为**建议修改**（非阻断），但建议在合并前修正。`,
            });
