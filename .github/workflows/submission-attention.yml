name: Submission Attention Queue
on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: submission-attention-queue
  cancel-in-progress: false
jobs:
  attention:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-python
        with:
          profile: project
          cache: 'false'

      - run: uv run python -m scripts.submissions.operations attention
