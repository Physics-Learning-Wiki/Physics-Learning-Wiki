name: Check Scripts

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/**
      - package.json
      - yarn.lock
      - .prettierrc
      - tsconfig.json
  workflow_dispatch:

jobs:
  build:
    name: Check Scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked Node toolchain
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'

      - name: Check Prettier Format
        run: corepack yarn scripts:format:check
      - name: Check TypeScript Compile
        run: corepack yarn tsc
