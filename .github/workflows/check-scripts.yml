name: Check Scripts

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/**
      - package.json
      - yarn.lock
      - .prettierrc
      - tsconfig.json
  workflow_dispatch:

jobs:
  build:
    name: Check Scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up locked Node toolchain
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'

      - name: Check Prettier Format
        run: corepack yarn scripts:format:check
      - name: Check TypeScript Compile
        run: corepack yarn tsc
