name: Check quotes

permissions:
  contents: read

on: [ pull_request ]

jobs:
  check-quotes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: |
          if git diff -G[“”] HEAD^ -- '*.md' | grep ^+.*[“”]; then
            echo '::error::由于 `“……”` 未区分全半角，请使用 `「……」` 作为全角引号，`"..."` 作为半角引号。'
            exit 1
          fi
