name: Check Navigation Coverage

permissions:
  contents: read

on:
  # push:
  #   branches:
  #     - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-nav-coverage:
    name: Check Navigation Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-python
        with:
          profile: project
          cache: 'true'

      - name: Check MkDocs nav coverage
        run: uv run python scripts/check-nav-coverage.py --ignore-file scripts/nav-coverage-ignore.txt