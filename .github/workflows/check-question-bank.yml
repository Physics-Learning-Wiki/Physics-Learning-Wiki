name: Check Question Bank

on:
  pull_request:
    paths: &quiz-paths
      - 'question-bank/**'
      - 'contracts/**'
      - 'scripts/submissions/**'
      - 'workers/**'
      - 'docs/_static/js/features/quiz-set-contribute.js'
      - 'scripts/question_bank/**'
      - 'data/concepts.yml'
      - 'scripts/concepts/**'
      - 'hooks/concept_reference.py'
      - 'scripts/features/**'
      - 'docs/_static/js/features/concept-reference.js'
      - 'docs/glossary/glossary.md'
      - 'docs/intro/writing.md'
      - 'docs/mechanics/oscillation-wave/linear-oscillation.md'
      - 'tsconfig.features.json'
      - 'scripts/quiz/**'
      - 'tests/question_bank/**'
      - 'tests/integration/**'
      - 'docs/quiz/**'
      - 'docs/_static/js/features/quiz.js'
      - 'docs/_static/js/features/submit.js'
      - 'docs/_static/js/features/question-contribute.js'
      - 'docs/_static/js/submit-form.js'
      - 'docs/_static/css/quiz.css'
      - 'docs/_static/css/submit-form.css'
      - 'docs/_static/css/features/**'
      - 'docs/submit.md'
      - 'workers/submit.js'
      - 'workers/submit.test.js'
      - 'workers/submit-ui.test.js'
      - 'docs/mechanics/kinematics/linear-motion.md'
      - 'docs/mechanics/dynamics/newton-laws.md'
      - 'hooks/question_bank.py'
      - 'hooks/runtime_features.py'
      - 'scripts/runtime/**'
      - 'scripts/forms/**'
      - 'scripts/test/serve-site.mjs'
      - 'docs/_static/js/runtime-loader.js'
      - 'tests/e2e/**'
      - 'scripts/post-build/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig.quiz.json'
      - 'tsconfig.runtime.json'
      - 'tsconfig.forms.json'
      - 'playwright.config.ts'
      - '.github/workflows/check-question-bank.yml'
  push:
    branches: [main]
    paths: *quiz-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      PLW_QUIZ_PREVIEW: ''
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
      - name: Set up locked Node toolchain
        uses: ./.github/actions/setup-node
        with:
          cache: 'true'

      - name: Install Python dependencies
        run: uv sync --dev --frozen

      - name: Check Sharp native runtime
        run: corepack yarn media:check
      - name: Install Playwright Chromium
        run: corepack yarn playwright install --with-deps chromium
      - name: Validate and test Python tools
        run: |
          test -z "$PLW_QUIZ_PREVIEW"
          uv run python -m scripts.question_bank validate --include-drafts
          uv run python -m scripts.question_bank validate
          uv run pytest tests/question_bank tests/integration
      - name: Check deterministic compilation
        run: |
          uv run python -m scripts.question_bank build --output .tmp-bank-a
          uv run python -m scripts.question_bank build --output .tmp-bank-b
          diff -r .tmp-bank-a .tmp-bank-b
          uv run python -m scripts.question_bank coverage --format json --output question-bank-coverage.json
          uv run python -m scripts.question_bank benchmark --repeat 5 --json-output question-bank-benchmark.json
      - name: Check quiz TypeScript and bundle
        run: |
          corepack yarn quiz:format:check
          corepack yarn quiz:typecheck
          corepack yarn quiz:test
          corepack yarn post-build:test
          corepack yarn submit:check
          corepack yarn submit:test
          corepack yarn forms:typecheck
          corepack yarn forms:test
          corepack yarn forms:build:check
          corepack yarn media:test
          corepack yarn quiz:build:check
          corepack yarn runtime:typecheck
          corepack yarn runtime:test
          corepack yarn runtime:build:check
          corepack yarn features:typecheck
          corepack yarn features:build:check
      - name: Build MkDocs site for smoke test
        run: |
          test -z "$PLW_QUIZ_PREVIEW"
          uv run mkdocs build --clean
      - name: Run browser smoke test
        run: |
          corepack yarn e2e:smoke
          corepack yarn playwright test tests/e2e/concept-popover.spec.ts tests/e2e/concept-reference.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: question-bank-metrics
          path: |
            question-bank-coverage.json
            question-bank-benchmark.json
