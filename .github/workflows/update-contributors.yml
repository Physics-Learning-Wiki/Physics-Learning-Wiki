name: Update Contributors Wall
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
concurrency:
  group: community-submissions-sync
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Set up locked Node toolchain
        uses: ./.github/actions/setup-node
        with:
          cache: 'false'

      - run: uv sync --frozen

      - name: Generate contributor statistics and community review PR
        run: uv run python -m scripts.community.sync --contributors
      - name: Link submissions to their review PR
        run: uv run python -m scripts.submissions.community_state
