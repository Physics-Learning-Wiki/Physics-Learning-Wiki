name: Update Contributors Wall
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
concurrency:
  group: community-submissions-sync
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-python
        with:
          profile: project
          cache: 'false'

      - name: Set up locked Node toolchain
        uses: ./.github/actions/setup-node
        with:
          cache: 'false'

      - name: Generate contributor statistics and community review PR
        run: uv run python -m scripts.community.sync --contributors
      - name: Link submissions to their review PR
        run: uv run python -m scripts.submissions.community_state
